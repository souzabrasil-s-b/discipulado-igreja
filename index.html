 bons despenseiros da\nmultiforme graça de Deus... se alguém serve, faça-o na força que Deus supre, para que em todas as\ncousas seja Deus glorificado...\" (1 Pe 4: 10, 11)\n\n      Nosso alvo é que Deus levante um número expressivo de pessoas com dons, paixão e chamado,\npara se comprometerem em formar equipes de ministério em nossa igreja. Sabemos de igrejas que\natuam em mais de 150 áreas com equipes de ministério. Ou seja, não há limites.\n      Vejamos algumas equipes da rede Ministerial.\n\nNa Igreja de Vencedores há sempre um espaço reservado especialmente para você que deseja\ntrabalhar na obra do Senhor. Independente do seu talento natural, aptidão ou aspiração, aqui\nvocê encontra sempre o que mais lhe agrada fazer e no que você mais se sente útil. Venha fazer\nparte desta visão de Vencedores.\nVenha Ser Um Vencedor!!!\n\n2 Tm 4.5 \"Tu, porém, sê sóbrio em todas as coisas, suporta as aflições, faze o trabalho de um\nevangelista, cumpre rigorosamente o teu ministério.\"\n\nAt 20.24 \"Porém em nada considero a vida preciosa para mim mesmo, contanto que complete a minha\ncarreira e o ministério que recebi do Senhor Jesus para testemunhar o evangelho da graça de Deus.\"\n\n                                                                                   Igreja de Vencedores\n\n    Para você que ainda tem dúvidas de qual o melhor ministério a seguir ou em que área da\nobra trabalhar, o Discipulado preparou para você a descrição de todos os ministérios do daIgreja\nde Vencedores, para que você saiba mais de como fazer parte desta obra. Portanto, não perca\nmais tempo, venha e conheça nossos ministérios e torne-se parte de uma Igreja de Vencedores e\nde um incrível mover de Deus, que a cada dia mais vem conquistando vidas para Jesus.\n\n      IGREJA\n\n      MINISTÉRIO DE COORDENADORES DE BASE AUXILIAR\n\n      É o ministério que zela belo bom andamento dos cultos e pela preservação material e espiritual\nda Base.\n\n      MINISTÉRIO 12 TRIBOS\n\n       É um ministério de Batalha Espiritual e Evangelismo no bairro onde a Base está estabelecida.\nHá o acompanhamento das vidas dos moradores, comerciantes, enfim de todos os que moram naquele\nbairro. O bairro é dividido em 12 partes, segundo a orientação do Espírito Santo. Em cada duas tribos\n(duas parte) ficará uma geração responsável, e as células com a geração avançam conquistando as\nvidas para Jesus, ministrando em CÉLULAS, GERAÇÕES E O DISCIPULADO JUNTO COM O\nENCONTRO COM DEUS.\n\n       MINISTÉRIO DE CONSOLIDAÇÃO (Discipulado)\n\n        Sua função principal é adotar os novos convertidos, acompanhá-los e integrá-los ao Corpo de\nCristo (Ministérios, Célula, Geração e Base), de maneira que estes não fiquem deslocados e o fruto\nnão se perca. A consolidação acontece desde quando o consolidador anota o nome do visitante no\nculto, e em menos de 24hs faz uma fonovisita ou uma visita pessoal para saber o que o visitante\nachou do culto e agradecer por ele ter participado do mesmo, o visitante deve ganhar uma bíblia do\nconsolidador de presente e o visitante deve ser convidado para o próximo culto, após uma semana da\nprimeira visita o consolidador deverá voltar na casa do visitante, o visitante deve ganhar o livro do\ndiscipulado de presente do consolidador e logo após deve ser marcado o discipulado, a partir da 4ª\nlição do discipulado o discipulador deverá marcar o Encontro com Deus com o discípulo e a partir\nde então colocá-lo em um ministério, célula e geração. A conclusão da consolidação é quando o\ndiscípulo se torna líder em treinamento na célula.\n\n       MINISTÉRIO DE RETIROS ESPIRITUAIS\n\nMinistério responsável por realizar todos os retiros espirituais, tais como Encontro com Deus,\nRadicamp e outros.\n\n       MINISTÉRIO DAS CAMPANHAS DOS 30 DIAS\n\n        Ministério responsável por realizar OS 30 DIAS COM PROPÓSITO E OUTROS\n\n       30 dias de Jejum e Oração Forte e Estudaremos um livro da Bíblia 1 Capitulo por Dia.\n\n       O jejum acontecerá em três horários opcionais: 5hs - 7hs/ 7hs - 10hs/ 7hs - 12hs\n\n       OS CULTOS DE CELEBRAÇÃO:\n\n        1ª Semana - Festa Judaica - Festa de Purim, Pentecoste ou Tabernaculo (Realizar Célula Forte\ne emtregar os convites da festa na célula).\n\n       2ª Semana – Culto do Ministério de Mulheres\n\n       3ª Semana - Culto do Ministério de Homens.\n\n       4ª Semana - Culto do Ministério Juvenil.\n\n       5ª Semana - Festa dos Vencedores CELEBRAÇÃO GERAL NA QUADRA OU OUTROS\n\n     =} NA SEMANA DO MINISTÉRIO O MESMO REALIAZARÁ A PREPARAÇÃO DAS\nLEMBRANÇAS DO CULTO, LIMPEZA DA IGREJA, ORNAMENTAÇÂO, LOUVOR, JOGRAL,\nTEATRO, DANÇA E EVANGELISMO EM MASSA NO SÁBADO E DOMINGO (PANFLETAGEM,\nCARRO SOM E PESSOA POR PESSOA...)\n\n       MINISTÉRIO DAS CAMPANHAS DOS 40 DIAS\n\n       Ministério responsável por realizar OS 40 DIAS COM PROPÓSITO E OUTROS\n\n       * O culto das Gerações acontecerá nas ruas, (cada geração ficará responsável por realizar\numa rua de lazer com a sua comunidade) *Cada Geração terá que abrir uma Nova célula. * Acontecerá\na Semana Atos 2 (semana de oração na base que finaliza com uma festa – cada célula fica responsável\npor uma parte da festa – ou apresentação)\n\n       MINISTÉRIO DA SEMANA ATOS 2\n\n        Durante uma semana a igreja viverá como a igreja primitiva viveu, com orações no templo e\nnas casas. De segunda a quarta a oração acontecera nas casas aonde a célula acontece, de quinta a\nsábado a oração acontecera na igreja – no sábado acontecerá também a entrega dos convites da festa.\n\n                                                                                  Igreja de Vencedores\n\n        Acontecerá a vigília do relógio (perto da meia noite o líder de célula liga ou passa mensagem\nno whatsapp para seus discípulos (mulher com mulher / homem com homem) para orarem 30 minutos,\npara que passem a virada da noite orando – CADA UM NA SUA CASA- isso acontecerá durante toda\na Semana Atos (templo e casa). O final da Semana Atos será o Uma Grande Festa.\n\n        MINISTÉRIO DOS VENCEDORES KIDS\n\n        É o ministério voltado às crianças, isso porque entendemos que uma criança bem formada,\npode ser o gancho de salvação para toda a família, além de tornar-se no futuro um servo de Deus e um\nlíder que impacte sua geração.\n\n        MINISTÉRIO DOS VENCEDORES TEENS\n\n         É a frente ministerial voltada aos adolescentes, ou seja, aqueles que não têm mais idade para os\nVencedores Kids e são um tanto jovens para ingressar nos Vencedores Radicais. Trata dos valores de\ncaráter e santidade voltada a essa fase transitória da vida do ser humano.\n\n        MINISTÉRIO DOS VENCEDORES RADICAIS\n\n        É a frente ministerial voltada aos jovens, ou seja, aqueles que não têm mais idade para os\nTeens e são jovens maduros, preparados para radicalizar vidas através do poder de Deus.\n\n        MINISTÉRIO DE MULHERES\n\n        Visa atender as mulheres nas suas particularidades, tanto em termos de uma palavra específica,\nquanto em termos de aconselhamento e acompanhamento.\n\n        MINISTÉRIO DOS GLADIADORES\n\n        Visa atender os homens nas suas particularidades, tanto em termos de uma palavra específica,\nquanto em termos de aconselhamento e acompanhamento.\n\n        MINISTÉRIO DE CASAIS\n\n        Visa atender o casal nas suas particularidades, tanto em termos de uma palavra específica,\nquanto em termos de aconselhamento e acompanhamento.\n\nMINISTÉRIO DAS FAMILIAS\n\n        Visa atender as famílias nas suas particularidades, tanto em termos de uma palavra específica,\nquanto em termos de aconselhamento e acompanhamento.\n\n        MINISTÉRIO DE ACONSELHAMENTO\n\n        Orientam indivíduos, homens, mulheres, jovens, casais ou famílias dentro daquilo que é a\nPalavra de Deus para a situação que têm vivido ou enfrentado, ministrando a visão da Igreja de\nVencedores e ajudando-os a chegar a conclusões de acordo com o propósito de Deus para os seus\nservos.\n\n        MINISTÉRIO DE INTERCESSÃO\n\n        O ministério surgiu pela necessidade de se batalhar espiritualmente a fim de estabelecer e\nampliar os limites do Reino de Deus através das armas espirituais. O ministério de intercessão funciona\nprincipalmente nos culto, reunião de ministérios e etc.\n\n        MINISTÉRIO DE DANÇA\n\n        Faz parte dos ministérios criativos, e tem por objetivo adorar ao Senhor através da expressão\ncorporal.\n\n        MINISTÉRIO DE LOUVOR E ADORAÇÃO\n\n       Visa resgatar o verdadeiro e perfeito louvor através da adoração, como descreve o salmo 150,\ncom todos os instrumentos, ritmos e excelência.\n\n        MINISTÉRIO DE TEATRO\n\n        Faz parte dos ministérios criativos, e busca evangelizar através de peças teatrais\n\n        MINISTÉRIO DE RECEPÇÃO\n\n        Organiza o acesso a igreja e acomoda as pessoas em horários de cultos. Este ministério\ntrabalha em parceria com o ministério de consolidação, pois ele pega os nomes de todos os visitantes.\n\n                                                                                      Igreja de Vencedores\n\n          MINISTÉRIO DOS OBREIROS\n\n          Preparação do Óleo da Unção para entregar para o povo de Deus, prepara a Santa Ceia, e\noutros.\n\n          MINISTÉRIO ATALAIA\n\n       Visa permitir que a igreja não feche suas portas durante o dia, a fim de atender as pessoas a\nqualquer hora.\n\n          MINISTÉRIO MISSÕES PORTAS ABERTAS\n\n          Visa permitir que a igreja ajude em missões mundiais – Igreja Perseguida.\n\n          MINISTÉRIO MOMENTO COM DEUS\n\n        Visa permitir que a igreja ore durante o dia todo e durante toda a semana, formando através\ndos irmãos, grupos de oração e cada grupo ficará responsável por uma hora na base. 6hs, 12hs e 18hs.\n\n          MINISTÉRIO VOLTA LOGO\n\n        Este ministério nasceu com o propósito de receber de volta, como servos de Deus aqueles que\nestavam machucados e frustrados pela religiosidade, e também aqueles que foram enredados pelo\ninimigo e apostataram da fé.\n\n          MINISTÉRIO ANTES DE DIZER SIM\n\n          Aconselhamento e acompanhamento para casais que querem assumir o matrimônio.\n\n          MINISTÉRIO RECEM CASADOS\n\n          Aconselhamento e acompanhamento para casais que acabaram de assumir o matrimônio.\n\n          MINISTÉRIO DE APOIO\n\n          Visa cuidar, preparar e fazer a manutenção dos equipamentos de luz, áudio e vídeo da igreja e\noutros.\n\nMINISTÉRIO DA CANTINA\n\n        Tem como objetivo ajudar na obra de Deus através das vendas de comidas em geral.\n\n        ENSINO\n\n        MINISTÉRIO DA ESCOLA DE VENCEDORES\n\n         Estrutura de ensino básico, intermediário e avançado, com preparação e aperfeiçoamento dos\ncristãos.\n\n        MINISTÉRIO SEMINARIOS DAS CLASSES COM PROPOSITOS\n\n        Seminário de preparação para amadurecimento espiritual\n\n        Classe 101 / classe 201 / classe 301 / classe 401 e classe 501.\n\n        MINISTÉRIO DO DISCIPULADO / CLASSE DA MATURIDADE\n\n        Princípios da vida cristã – em grupo / individual ou da forma online pelo nosso canal no You\nTube.\n\n        FRENTES ASSISTENCIAIS\n\n        MINISTÉRIO DE ÁREA SOCIAL\n\n        Visa o atendimento social de membros e não membros da igreja, através de roupas e cestas\nbásicas, desenvolvem trabalhos manuais e artísticos, tais como: pinturas, tricô, crochê, costura,\ncerâmica, esculturas, artesanatos e etc. E que geram interação e recursos para a obra e tendo também\ncomo finalidade principal o evangelismo.\n\n        MINISTÉRIO EXPRESSO DA SOLIDARIEDADE\n\n        Consiste em um transporte que sai pelas ruas da cidade levando comida, roupas lavadas, muito\ncarinho e, principalmente a Palavra de Deus a pessoas carentes moradoras de favelas e moradoras de\nrua.\n\n                                                                                 Igreja de Vencedores\n\n       MINISTÉRIO SOS DA VIDA\n\n       Atende e orienta pelo telefone, segundo a Palavra de Deus, todos que ligam solicitando oração\nou aconselhamento.\n\n       MINISTÉRIO PROJETO VENCEDORES KIDS\n\n        Visa o atendimento social a crianças e jovens.\n\n       EVENTOS\n\n       FESTA DOS VENCEDORES\n\n        É um encontro de todos os membros da Igreja de Vencedores. Neste encontro acontece uma\ngrande festa de celebração e adoração ao Senhor Jesus.\n\n       FESTA DA VITÓRIA\n\n       É a ultima festa do ano. Ela acontece sempre na virada do ano.\n\n       ENCONTRO DE MULHERES\n\n        São encontros periódicos que acontecem, reunindo mulheres e visitantes, nos quais são\nministrados temas espirituais e de cunho rotineiro do cotidiano feminino e muita dinâmica.\n\n       ENCONTRO DE CASAIS\n\n        São encontros periódicos que acontecem, reunindo casais e visitantes, nos quais são\nministrados temas espirituais e de cunho rotineiro do cotidiano do casal e muita dinâmica.\n\n       SANTA CEIA DOS LIDERES\n\n        Preparação dos elementos. Ministração especial aos lideres da Igreja de Vencedores, trazendo\na proximidade com nossos líderes espirituais, os Pastores Ermeson e Leiane Souza, visando a\npreservação da visão que Deus nos deu através de seus servos.\n\nDISCIPULADO\n\n     1. A maioria dos cristãos deseja servir. A maioria sabe que deve servir. Mas muitos cristãos não\nsabem como podem servir da melhor maneira possível. Este é o propósito da Rede Ministerial. Procure\nainda nesta semana um ministério para servir a Deus da melhor maneira possível.\n\n     2. De acordo com a Parábola dos Talentos (Mt.25), podemos entender que Deus espera um\nretorno do seu investimento. Como cristãos, Deus tem nos dado a oportunidade - e a responsabilidade -\nde levar-nos à descoberta do Seu plano para cada um. Portanto não devemos enterra nosso talento ou\nficarmos somente no banco vendo as coisas passarem...\n\n   3. Frequente assiduamente um ministério ou inicio um novo, é isso que Deus espera de você!\n\nVERIFIQUE O QUE VOCÊ APRENDEU\n\n1. Defina Rede Ministerial.\n\n______________________________________________________________________________\n\n2. Defina Paixão Ministerial.\n\n______________________________________________________________________________\n\n3. Defina Dons Espirituais.\n\n______________________________________________________________________________\n\n4. Defina Estilo Pessoal.\n\n______________________________________________________________________________\n\n5. Defina Rede Ministerial Homogenia e Rede Ministerial Heterogenia.\n\n______________________________________________________________________________\n\n                                                                                  Igreja de Vencedores\n         210", "quiz": [{"q": "Qual é o texto bíblico-base da lição \"REDE MINISTERIAL\"?", "options": ["Filipenses 2.8", "1 Pe 4: 10, 11", "Malaquias 3. 8 - 12", "2 Tm 4.7"], "answer": 1}, {"q": "Qual destes é um dos tópicos estudados na lição \"REDE MINISTERIAL\"?", "options": ["Maria Nunca Foi E Nunca Será: \"Sempre Virgem\"", "Defina Rede Ministerial Homogenia E Rede Ministerial Heterogenia", "Nomes E Simbolos Do Espirito Santo", "Prefira Incentivar Do Que Criticar"], "answer": 1}, {"q": "Qual destes tópicos NÃO faz parte da lição \"REDE MINISTERIAL\"?", "options": ["Conhecendo Deus, Através Dos Aspectos Do Seu Caráter", "Defina Rede Ministerial", "Defina Dons Espirituais", "Defina Rede Ministerial Homogenia E Rede Ministerial Heterogenia"], "answer": 0}]}, {"num": 32, "title": "DISCIPULADO", "verseRef": "Mt18.19-20", "content": "TEXTO BÍBLICO\n\n     \"Portanto ide, fazei discípulos de todas as nações...\" Mt 28.19\n\n     É um sistema de consolidação cujo objetivo é formar o caráter de um indivíduo, ajudando-o em\n     sua vida espiritual, auxiliando, tirando as suas dúvidas e etc. É o discipulado um a um, uma igreja\ncuidando de outra igreja.\n\n     Neste processo, cada casal discípula outro casal. O homem solteiro, discípula outro homem\nsolteiro. A mulher solteira discípula outra mulher solteira e etc.\n\n     O discipulado apostólico constitui a imagem do discipulado feito por Cristo. Assim como havia\naquele cuidado com seus discípulos em particular, assim é o discipulado. É um irmão na fé maduro\najudando outro irmão a crescer.\n\n     A amizade é o alicerce, a confiança mútua é o combustível e a transparência a característica mais\nimportante para se ter um bom discipulado.\n\n      Procure o seu discipulo e seja importante para alguém!!!\n\n      Jesus priorizou o discipulado na Sua vida aqui na terra. Antes de escolher os seus discípulos Ele\norou a noite toda (Lucas 6:12-13), e uma grande parte do seu tempo foi ocupado investindo na vida\ndestes discípulos. Como Ele viajava horas e horas a pé, é bem provável que enquanto estava\ncaminhando com os discípulos naquelas estradas construídas pelo Império Romano, Ele aproveitava\nbem o tempo discipulando. Quem já caminhou por muitas horas sabe que é difícil andar e falar com\nmuitas pessoas ao mesmo tempo. Cremos que Jesus discipulava muito:\n\n      Observe os resultados surpreendentes de uma pesquisa realizada entre um grande número de\nlíderes cristãos. Segundo está pesquisa foi constatado que: é muito bom discipular em grupos, mas\nnunca em substituição ao discipulado um a um. Vez após vez, temos comprovado a eficácia do\ndiscipulado um a um. Sem dúvida, isto possibilita que o discipulado seja mais profundo, intenso, e\nespecífico.\n\n      No discipulado um a um, o discípulo sentirá mais liberdade para se abrir totalmente, e o\ndiscipulador sentirá mais liberdade de cavar profundamente sem constranger este discípulo na frente\ndos outros discípulos, como provavelmente poderia acontecer no discipulado em grupo. É claro, que\npara haver este tipo de discipulado os dois (discípulo e discipulador) devem ser do mesmo sexo.\n\nTambém, alguém não pode estar discipulando outra pessoa se ele primeiramente não tiver sido\ndiscipulo.\n\n      O discipulador tem compromisso total de não falar nada para pessoa alguma daquilo que o\ndiscípulo confidenciou a não ser que obtenha primeiramente sua permissão. Este discipulado deve\nacontecer no contexto da Célula, ou seja, o discipulador deve participar da mesma Célula do discípulo.\nNormalmente o Líder da Célula, vai discipular o líder em treinamento principal e mais dois lideres em\ntreinamento. Estes três lideres em treinamento por sua vez vão discipular os outros integrantes da\nCélula (Discipulado Individual).\n\n      O Líder é discipulado pelo Líder de Geração, o Líder de Geração pelo Coordenador de base, e\nassim por diante. Uma vez que você está sendo discipulado, é importante começar a orar e pedir a Deus\nacerca de quem você deverá discipular. Quando você ganha alguém para Jesus, você tem que garantir\nque aquela pessoa seja bem discipulada. Normalmente, é você quem deve discipular aquele novo\nconvertido. Jesus ordenou que fizéssemos discípulos (Mateus 28:18-20). No nosso modelo, traduzimos\nisto em um mínimo de três. Cremos que todo cristão deve ser um discipulador e no mínimo ter três\ndiscípulos. Se você é recém-convertido (1 a 3 meses), podemos compreender que ainda não tenha\ndiscípulos. Mas comece a orar e buscar a Deus sobre esta área. Comece a evangelizar seus amigos,\ncolegas de trabalho e de aula, vizinhos, parentes, etc. Ore bastante pela conversão de toda a sua família.\n\n     A Bíblia garante que através da fé você pode ganhar toda a sua família para Jesus. Na medida em\nque você vai ganhando pessoas para Jesus logo você terá seus três discípulos ou até mais. Jesus, antes\nde ascender aos céus, nos deixou a Grande Comissão: Ide, portanto, fazei discípulos... (Mt. 28:19).\nIsto tem que ser priorizado, pois, sem dúvida, é de máxima importância. Na medida em que\nmeditávamos na centralidade do discipulado, Deus me revelou que o discipulado um a um é o coração\nda Célula. Este relacionamento do discipulador com seu discípulo (líder em Treinamento) chamamos\nde Discipulado.\n\n       Sendo, também, que a ênfase central da Visão do Discipulado é o discipulado um a um. Então\ncomo visão do Igreja de Vencedores temos: O discipulado com os Lideres em Treinamento. É\nimportante observar que este tipo de discipulado é o discipulado um a um. Contamos os discípulos que\nestão sendo discipulado das Células. Esse procedimento, também tem sido uma forma de reconhecer e\nhonrar quem está fazendo discípulos. Ao motivar todo cristão a ter pelo menos três discípulos estamos\npriorizando aquilo que Deus prioriza: Fazer discípulos! Sem dúvida, alguns irmãos que têm mais\ntempo podem investir a sua vida em muito mais do que três pessoas. Temos ensinado que o mínimo é 3\n(três discípulos), e o máximo é 12 (doze discípulos).\n\n      O Discípulo. é o mesmo líder em treinamento, portanto não existe um Discípulo. que não seja\nlíder em treinamento. Se o seu Discípulo. ainda não é um líder em treinamento, você deve trabalhá-lo\npara que se torne um, e lhe auxilie na célula. O importante é que todos estejam debaixo da cobertura de\num discipulador, e que todos estejam fazendo discípulos, porque, como já foi enfatizado, o discipulado\né o coração da Célula.\n\n                                                                                      Igreja de Vencedores\n\n      A Visão do Discipulado. pede que cada cristão esteja comprometido uns com os outros: Na\nVisão do Discipulado. cada cristão deve estar sendo e fazendo discípulos, participar de uma Célula,\nabraçar a visão da Igreja de Vencedores, e colocar em primeiro lugar o Reino de Deus.\n\n           1. PROPÓSITO DO DISCIPULADO\n\n      Um dos últimos desejos e mandamento do Senhor Jesus antes de deixar a terra foi\n\n     \"ir e fazer discípulos por todas as nações\" (Mt18.19-20). Esta ordem envolve toda a igreja do\n   Senhor Jesus.\n\n      \"Ir e fazer discípulos\" é buscar aqueles que não ouviram e nem entenderam a mensagem da\n   cruz.\n\n      Esse trabalho pode ser feito por qualquer cristão em seu lar, na rua, no seu trabalho, na faculdade\n   e etc.\n\n     O segundo passo é tornar a pessoa um discípulo, e isso é que chamamos de Consolidação, é um\n   período que requer cuidado, atenção, até Cristo ser formado no novo convertido.    (Jo 15.16),\n   (At13.14 e 16) e (At 141-6)\n\n       2. ASPECTOS IMPORTANTES DA CONSOLIDAÇÃO\n\n       * Confirmar: É servir de suporte ou sustento de alguém. É dar abertura, cuidar da pessoa para\nque não caia. Quando você ganha uma pessoa para Jesus, deve demonstrar que quer o seu bem-estar\npessoal (At 14.21 e 22).\n\n      * Exortar: Estimular alguém para que siga determinada conduta. É orientar, animar, corrigir\ncom amor, animando-a para alcançar o propósito de Deus.\n\n       * Trabalho e esforço: (Cl 1.28 e 29). Se quisermos apresentar perfeitos em Cristo aqueles a\nquem Ele tem colocado em nossas mãos, para discipular e consolidar, devemos trabalhar com todo\nesforço. Mas tudo isso é proveitoso quando é feito com amor. (Cl 3.17,23 e 24). O amor deve ser o\nmotor que nos leva a servir o Senhor e discipular os seus escolhidos.\n\n          3. O DISCIPULADOR E SEU DISCIPULO\n\n          Você é um discipulador, você não é chamado apenas para confessar que Jesus Cristo é o\nSenhor.\n\n        Isto é apenas o primeiro passo no processo do discipulado, agora é a vez de você firmar o novo\nconvertido em sua decisão.\n\nCada novo convertido precisa de um discipulador, você foi escolhido para essa nova tarefa\nfascinante, você acaba de receber do Senhor Jesus a missão de fazer discípulos.\n\n        * Aprenda a servir como discipulador: Sua tarefa é encorajar e apóia esse novo convertido.\nVocê está aí para ser um amigo e para orar por ele. Não precisa ser um professor ou um líder, seja\napenas um irmão em Cristo que serve por amor. Seja transparente, às vezes, você vai achar que é você\nque precisa de oração. Se esse for o caso, dê oportunidade ao seu discípulo para orar por você.\n\n       * Aprenda a conhecer o discípulo: Aprenda a criar laços com o novo convertido, promova\nalgumas atividades e leve ele com você.\n\n        * Encontre-se com seu discípulo: Seja flexível quanto ao horário e local do discipulado, fale\nsobre isso com o discípulo. Não desaponte o seu discípulo, quando marcar cumpra, quando o encontrar\ndê toda atenção ao discípulo.\n\n        * Prepare-se para passar o tempo juntos: Veja se o seu discípulo já tem uma Bíblia, o livro\ndo discipulado e uma lista dos louvores da Igreja. Você terá um período longo pela frente de\ndiscipulado com seu discípulo. Você precisa orar para que cada encontro seja marcante em sua vida e\ntenha cuidado para não sufocar o discípulo.\n\n         * Seu tempo junto: Seu tempo com o discípulo é precioso, não pode ser gasto futilmente.\nBusque descobrir as necessidades do seu discípulo, sinta-se livre para compartilhar as descobertas e as\nvitorias do Senhor na sua vida.\n\n         * Organograma do discipulado: 1. Descontração; 2. Revisão do estudo anterior;              3.\nTirar algumas duvidas; 4. Memorização dos versículos; 5. Enfatizar a necessidade da vida devocional –\nBíblia e Oração; 6. Enfatizar as participações na Escola de Vencedores, Célula, Geração, Ministérios e\nnos Cultos da Igreja; 7. Antecipe o estudo da próxima semana para que ele estude e 8. Oração final.\n\n       * Você tem uma grande responsabilidade nas mãos. Você está cuidando de um bebê em Cristo\nque acaba de nascer. Você precisa ter paciência e disposição de ministrar a visão da Igreja de\nVencedores, de forma que ele possa crescer saudável.\n\n        * O seu tempo com o discípulo precisa ser um tempo de qualidade. Seu objetivo é acompanhá-\nlo nos próximos meses e conduzi-lo a uma célula, geração e ministério.\n\n        * Apresente-se a ele como o seu discipulador e esclareça que você tem a missão de\nacompanhá-lo nos próximos meses para ajudá-lo a crescer em Deus e, que para tanto vocês deverão se\nencontrar pelo menos uma vez por semana, para estudarem juntos a lição do discipulado.\n\n        * O discipulado sempre deve ser dado pelo mesmo sexo do discípulo ou situação matrimonial:\ncasado discípula casado; rapaz discípula rapaz; moça discípula moça e etc...\n\n         * Não tenha pressa nas lições. Não dê alimento demais, isto pode produzir uma intoxicação\nespiritual. A lição é para ser lida. Preste atenção nisso: A lição é para ser lida junto com o novo\n\n                                                                                    Igreja de Vencedores\n\nconvertido. Você pode fazer observações e esclarecer duvidas durante a leitura, mas nunca deixe de ler\na lição.\n\n        * Você não pode acabar com o curso de discipulado fazendo uma lição por dia. Não tente\nabreviá-lo. Não é esse o nosso objetivo. Queremos que o novo convertido desenvolva uma relação de\namizade e se vincule na igreja através de você.\n\n        * Cada célula deve providenciar um discipulado para seus novos convertidos.\n\n        * Não tente mudar a pessoa baseada no seu preconceito pessoal. Não queira mudar o exterior,\nse ainda o interior não foi mudado. Não se prenda a coisas exteriores, mas leve o novo convertido, a ter\numa experiência intima e profunda com Deus.\n\n       * Não seja negligente com a pontualidade e também não desmarque o encontro na ultima hora.\nOs novos convertidos se ressentem dessas atitudes, que eles interpretam como sendo indisposição, má\nvontade, ou rejeição mesmo. Lembre-se que você para ele é o padrão de cristão.\n\n        * Não faça um encontro com mais de uma hora de duração. Evite tomar o tempo do novo\nconvertido desnecessariamente. Seja cuidadoso para não ter encontros em horários impróprios, como\nmuito tarde da noite, nem em lugares movimentados demais, onde não seja possível a privacidade.\n\n       * Não há nada de errado com roupas informais, como bermudas e camisetas, mas seja\ncuidadoso com a higiene pessoal: limpeza, odores e aparência em geral. Se o encontro for na casa do\nnovo convertido, seja ainda mais criterioso com aparência.\n\n         * Ficar guardando o novo convertido o tempo todo compromete a vida espiritual dele. Os\ncristãos superprotegidos são inseguros e necessitam constantemente de \"mamadeira\" espiritual. Não\nfaça tudo por ele, deixe que ele se esforce um pouco também. Por exemplo, você não tem que buscá-lo\nde carro para todas as reuniões da igreja ou da célula. Assim como as crianças ficam mimadas, os\nnovos convertidos também ficam. E depois eles não vão querer ir para a igreja sozinhos; sempre vão\nexigir que alguém vá buscá-lo. Isso se aplica a muitos outros aspectos da vida cristã. Deixe que ele\nande com suas próprias pernas.\n\n         * O cuidado exagerado pode ser perigoso. A consequência disso é que o novo convertido se\ncansara de você e da igreja. Se ele se sentir sufocado, ele irá fugir de você, e o inimigo acabará por\narrastá-lo de volta para o mundo...\n\n        * Fuja da super dependência. Há novos convertido que são super pegajosos.\n\n        * Não faça negócios. Durante esse tempo de discipulado, você não deve fazer qualquer tipo de\nnegocio com o novo convertido. Ele ainda não tem maturidade e algo muito pequeno pode escandalizá-\nlo. Além disso, não dê, e nem empreste dinheiro a ele ou vice-versa.\n\n       4. PRINCIPIOS BASICOS PARA DESENVOLVER O DISCIPULADOR\n\nÉ preciso estabelecer certas bases e fundamentos sobre os quais edificaremos o chamado que\nDeus nos tem dado.\n\n      Dt 28.1 e 2 - Três requisitos exigidos pelo Senhor:\n\n      * Ouvir (escutar atentamente)\n\n      * Guardar (entesourar algo muito valioso)\n\n      * Cumprir (praticar diariamente)\n\n      Alguns princípios devem ser observados no processo da consolidação:\n\n      * Não pedir dinheiro, nem deixar que peçam. Devemos diferenciar a igreja dos negócios.\n\n     * Não visitar as pessoas do sexo oposto sozinho. Jesus sempre enviou seus discípulos de dois\nem dois.\n\n       * Não dar lugar as queixas, criticas e murmurações. Não permitir que falem mal da igreja, do\npastor ou outros ministérios.\n\n     * Não pregar um evangelho de proibições ao novo convertido. O Espírito Santo é que\nconvence a pessoa do pecado.\n\n       * Não divulgar os assuntos pessoais daqueles a quem você tem aconselhado. Precisamos nos\ntornar pessoas extremamente confiáveis.\n\n       5. ORGANOGRAMA DA CONSOLIDAÇÃO\n\n        Sua função principal é adotar os novos convertidos, acompanhá-los e integrá-los ao Corpo de\nCristo (Ministérios, Célula, Geração, Escola de Vencedores e Base), de maneira que estes não fiquem\ndeslocados e o fruto não se perca. A consolidação acontece desde quando o consolidador anota o\nnome do visitante no culto, e em menos de 24hs faz uma fonovisita ou uma visita pessoal para saber\no que o visitante achou do culto e agradecer por ele ter participado do mesmo, o visitante deve ganhar\numa bíblia do consolidador de presente e o visitante deve ser convidado para o próximo culto, após\numa semana da primeira visita o consolidador deverá voltar na casa do visitante, o visitante deve\nganhar o livro do discipulado e uma lista com os louvores da igreja de presente do consolidador e logo\napós deve ser marcado o discipulado, apartir da 4ª lição do discipulado o discipulador deverá\nmarcar o Encontro com Deus com o discípulo e a partir de então colocá-lo em um ministério,\ncélula, geração e matriculá-lo na Escola de Vencedores. A conclusão da consolidação é quando o\ndiscípulo se torna líder em treinamento na célula.\n\nDISCIPULADO\n\n                                                                                   Igreja de Vencedores\n\n      1. Você aprendeu que o discipulado é o ponto vital para se ganhar pessoas. Descobriu, também,\nque sua célula só irá crescer se tiver um discipulador. Pôde, ainda, chega à conclusão, que sua célula só\nse tornará uma geração se tiver muitos discipuladores.\n\n     2. A partir de agora, levante vários discipuladores em sua célula ou geração.\n\n     3. Lembre-se: A amizade é o alicerce, a confiança mútua é o combustível e a transparência a\ncaracterística mais importante para se ter um bom discipulado.\n\n    4. Comece ainda nesta semana a discipular alguém. Pense em três pessoas que você poderia\ncomeçar o discipulado e mãos a obra!\n\nVERIFIQUE O QUE VOCÊ APRENDEU\n\n1. Defina o Discipulado.\n\n______________________________________________________________________________\n\n2. Defina o propósito do discipulado.\n\n______________________________________________________________________________\n\n3. Defina os aspectos da consolidação.\n\n______________________________________________________________________________\n\n4. Defina o organograma do discipulado.\n\n______________________________________________________________________________\n\n5. Defina Mt18.19-20.\n\n______________________________________________________________________________", "quiz": [{"q": "Qual é o texto bíblico-base da lição \"DISCIPULADO\"?", "options": ["1 João 4.1", "Mt18.19-20", "Tiago 4:7; I João 3:8; Efésios 4:27;", "Atos 4.12"], "answer": 1}, {"q": "Qual destes é um dos tópicos estudados na lição \"DISCIPULADO\"?", "options": ["Como Surgem As Maldições", "Defina Os Aspectos Da Consolidação", "Deus Se Agrada Quando Nossa Adoração É Autêntica", "Você Deve Organizar Baseado Nos Dons Das Pessoas De Sua Célula"], "answer": 1}, {"q": "Qual destes tópicos NÃO faz parte da lição \"DISCIPULADO\"?", "options": ["Defina Mt18.19-20", "O Discipulador E Seu Discipulo", "Como Surgem As Maldições", "Defina O Discipulado"], "answer": 2}]}, {"num": 33, "title": "IGREJA EM CÉLULAS", "verseRef": "At 2.46", "content": "TEXTO BÍBLICO\n\n       \"Diariamente perseveravam unânimes no templo, partiam pão de casa em casa e tomavam as\nsuas refeições com alegria e singeleza de coração\" (At 2.46).\n\nBases Bíblicas e Históricas da Igreja em Células\n\n      \"E todos os dias, no templo e de casa em casa, não cessavam de ensinar e de pregar Jesus, o\nCristo\" (At 5.42).\n\n    \"Jamais deixando de vos anunciar coisa alguma proveitosa e de vo-la ensinar publicamente e\ntambém de casa em casa\" (At 20.20).\n\n     \"Saudai Priscila e Áqüila, meus cooperadores em Cristo Jesus, os quais pela minha vida\narriscaram a sua própria cabeça; e isto lhes agradeço, não somente eu, mas também todas as igrejas\ndos gentios; saudai igualmente a igreja que se reúne na casa deles. Saudai meu querido Epêneto,\nprimícias da Ásia para Cristo\" (Rm 16.3-5ª).\n\n    \"Saudai os da casa de Aristóbulo\" (Rm 16.10).\n\n   \"Saudai Asíncrito, Flegonte, Hermes, Pátrobas, Hermas e os irmãos que se reúnem com eles\"\n(Rm 16.14)\n\n.   \"Saudai Filólogo, Júlia, Nereu e sua irmã, Olimpas e todos os santos que se reúnem com eles\"\n(Rm 16.15).\n\n    \"As igrejas da Ásia vos saúdam. No Senhor, muito vos saúdam Áqüila e Priscila e, bem assim, a\nigreja que está na casa deles\" (1Co 16.19).\n\n    \"Saudai os irmãos de Laodicéia, e Ninfa, e à igreja que ela hospeda em sua casa\" (Cl 4.15).\n\n    \"Paulo, prisioneiro de Cristo Jesus, e o irmão Timóteo, ao amado Filemom, também nosso\ncolaborador, e à irmã Áfia, e a Arquipo, nosso companheiro de lutas, e à igreja que está em tua casa\"\n(Fm 1-2).\n\n     Além de todos estes, vale também citar o conselho de Jetro que, cheio de sabedoria, observou que\nseu genro Moisés passava praticamente o tempo todo julgando e resolvendo as questões do povo\nhebreu, que era insuficiente, desgastante e contra produtivo, retirando-lhe importante tempo e energia\npara outras atividades que eram de exclusiva responsabilidade dele.      Aconselhou-o então a dividir o\n\n                                                                                    Igreja de Vencedores\n\npovo em células com chefes de mil, de cem, de cinqüenta e de dez para que resolvessem as questões\nbásicas do povo. Assim, Moisés pode então exercer uma liderança eficaz entre o povo, fazendo com\nque este fosse mais beneficiado  (Êxodo 18.1-27).\n\n1º Período das Células:\n\nFormação da Igreja I (Jesus Cristo)\n\n    Todos nós sabemos que a Igreja nasceu com o Senhor Jesus Cristo como fundamento e com o\nEspírito Santo como fundador. A base lançada pelo fundamento da Igreja foi a escolha de uma célula\nde pessoas a quem chamou de discípulos (M.D.A.), e com quem compartilhou de seus ensinamentos e\ndelegou responsabilidades mais do que com outras pessoas em seus 3 anos de ministério terreno.\n\n     A comunhão diária de Jesus com aqueles doze homens foi de grande privilégio tendo o ensino\nprático, aplicado no dia-a-dia deles, predominância sobre qualquer ensino teórico. A estes doze, por\nexemplo, Jesus enviou para pregar o reino, e deu-lhes poder para curar os enfermos e expulsar os\ndemônios.\n\n     Assim, o período formativo da Igreja se deu em uma célula de 12 pessoas em torno de uma\nliderança.\n\n2º Período das Células:\n\nFormação da Igreja II (Pentecostes)\n\n      Depois Jesus enviou 70 discípulos para que pregassem o reino (evangelizar), curassem os\nenfermos e expulsassem os demônios, sendo que os discípulos deviam ir                              \"de\ndois em dois\" (Lc 10.1). Aqui vemos a estratégia evangelística de Jesus.\n      Logo após sua ascensão aos céus vemos que havia cerca de 120 pessoas reunidas em uma mesma\ncasa no dia de Pentecostes (At 1.15; 2.1-4), que foram batizadas com o Espírito Santo. Capacitados por\neste \"poder do alto\" em suas vidas, começam a anunciar o evangelho com intrepidez, tendo a pregação\nde       Pedro         levado     cerca      de      3.000       almas      para       a     salvação.\n      A Igreja crescia e algo precisava ser feito para que aquelas vidas permanecessem firmes e\nfrutíferas (o fruto tinha que \"permanecer\"). A Bíblia mostra que a igreja começa a se organizar com o\ndesenvolvimento de uma estrutura de diáconos para apoio pastoral. Porém a história mostra que a\nIgreja não teria descanso, pois além da inimizade com os judeus, salvo raras exceções (como em\nJerusalém imediatamente após o batismo daquelas 3.000 almas) a pregação de Cristo atraia inimizade\ndos gregos, romanos e etc.\n\n3º Período das Células:\n\nA Igreja Perseguida vesus Igreja Prostituta\n\n     Se no início reuniam-se no templo e de casa em casa (At 2.42 e 5.46), após a morte de Estevão a\nperseguição piorou e até meados do século III d.C. a igreja sobreviveu – e cresceu – reunindo-se nos\nlares, escondidos das babuskas e demais delatores.\n\n      Com a cripto-conversão de Constantino, templos pagão passam a ser renomeados com nomes de\ncristãos e este mascaramento secreto do paganismo geraria a Igreja Católica, adotando costumes e\npráticas pagãs e perdendo a cada dia suas características neotestamentárias.\n\n     Uma vez tendo o Pseudo-Cristianismo dominado com seus templos \"oficiais\" a Europa e parte da\nÁsia, perguntamos: Como a Igreja Verdadeira sobreviveu? A resposta é simples: nas casas, nas\nflorestas, nas montanhas. Foi nestes lugares, tão distantes dos templos, que a Reforma Protestante\ncomeçou, bem antes de 1517.\n\n4º Período das Células:\n\nA Reforma Protestante também se desenvolveu por causa das Células\n\n     Sabemos que Lutero e Zwínglio, assim como seus antecessores Savanarola, Wycliff e Huss eram\npessoas que tinham a prática de pregar suas doutrinas nos púlpitos dos templos ou em salas e auditórios\nde universidades, mas a extensão da Reforma se deu através da adoção de suas idéias em células, como\nos valdenses, os petroprussianos, os anabatistas, os pietistas luteranos e os morávios, dentre muitos\noutros.\n\n     O movimento reformado, entretanto, se fixou demais nos templos e, com o tempo, perdeu sua\nforça evangelística-discipular. Os grupos que mantiveram reuniões além dos templos promoveram a\nexpansão do evangelho em todo mundo. Os morávios, por exemplo, exerceram grande influência em\nWesley que iniciou sua Reforma Santa pelas Células, tanto de estudantes (em Oxford, inicialmente)\nquanto nos lares. Aliás, enquanto os protestantes lutavam nos púlpitos, cortes e universidades\neuropéias, os morávios enviavam missionários para os confins da terra.\n\n5º período das Células:\n\nAs Células difundem o Pentecostalismo\n\n        E o que dizer do movimento Pentecostal senão como um movimento de base caseira? De Atos\ndos Apóstolos ao reavivamento da Rua Azuza, o movimento pentecostal foi sendo expandido pelo\nEspírito Santo em reuniões de oração dentro das casas, uma vez que tais reuniões em que era dada a\nliberdade ao Espírito Santo eram proibidas nas tradicionais igrejas protestantes.\n\n                                                                                    Igreja de Vencedores\n\n      É o caso típico do movimento pentecostal do início do século XX quando alunos do        Pr.\nCharles Fox Parham, da Bethel College de Topeka (Kansas), durante um breve período de férias de\nfinal de ano se reuniram para estudar sobre o Espírito Santo em sua casa e, como conseqüência,\ncomeçaram a orar e uma das alunas, Agnes Ozman, foi batizada com o Espírito Santo.\n      O mesmo se deu com William Seymour em Los Angeles, que pregava a doutrina pentecostal\nnas casas dos cristãos que aceitaram a mensagem, tendo seu endereço caseiro mais comum o do casal\nRichard e Ruth Asbery, na Rua Bonni Brae, 214.\n\n6º período das Células:\n\nAs Células fazem a Igreja sobreviver ao Comunismo\n\n      Ainda na antiga União Soviética (Rússia, Ucrânia, Letônia etc.) e os países por ela invadidos e\ndominados (Polônia, Hungria, Tchecoslováquia etc.), com a proibição de reuniões religiosas pelo\nregime comunista, os cristãos se reuniam nos porões das casas em células                    (\"a Igreja\nSubterrânea\") e prevaleceram diante da imposição atéia e do envio de muitos pastores e evangelistas\nflagrados pregando a Cristo, sendo enviados às Clínicas de Reabilitação, na Sibéria.    Ainda hoje a\nChina, mesmo sob o comunismo, é o país de maior crescimento numérico do evangelho apenas e tão\nsomente através das Igrejas em Células, uma vez que as igrejas \"oficiais\" têm suas lideranças\ndeterminadas pelo governo e as mensagens pregadas são analisadas pela censura comunista.\n\n7º Período das Células:\n\nAs Igrejas em Células HOJE\n\n     Principalmente após os anos 1950 a igreja no mundo atual começou a dar atenção ao crescimento\ndas igrejas em células no \"mundo livre\" por causa da igreja coreana, o que veremos a seguir.\n\nDavid Young Cho (Seul, Coréia do Sul)\n\n     A maior divulgação de Igreja em células no presente século nos vem de Seul, capital da Coréia do\nSul, onde o Pastor David (Paul) Young Cho implantou no ano de 1964 o sistema de reuniões nos lares\ndenominando-os de células. Seu rol de membros era composto de cerca de 2.400 membros. Seu\ncrescimento foi impressionante, conforme os dados abaixo:\n\n      * Em 1964 contavam com 2.400 membros\n\n      * Em 1972 passaram para 18.000 membros\n\n      * Em 1980 já eram 150.000 membros\n\n      * Em 1982 atingiram 300.000 membros\n\n      * Em 1993 chegaram a 700.000 membros com 51.000 líderes\n\n* Atualmente já passam de 1.000.000 membros\n\n       O templo da ilha de Yoido é o maior do mundo, tendo capacidade para 300 mil pessoas, e\nchega-se a ter nove cultos em um só domingo. Para acomodar as pessoas, o templo tem cinco andares e\ncinqüenta telões espalhados. Durante os intervalos do culto, as telas exibem filmes evangélicos do\nmundo intero e testemunhos.\n\nRalph W. Neighbour Jr. (America)\n\n      O pastor Ralph W. Neighbour Jr visitou uma das células na Coréia do Sul e gostou do sistema de\ntrabalho. Com toda sua formação e sendo um bom conhecedor nas áreas de administração empresarial\ne econômica, procurou adaptar o sistema administrativo da igreja coreana para uma igreja americana os\nfamosos G's, ou seja, os Grupos ou Gerações. Foi a primeira vez que se ouviu falar em G (ou seja, o\n\"G-5\", o modelo que deu inicio e que viria ajudar na elaboração do \"G-12\" e outros G's).\n\nDion Robert (Costa do Marfim)\n\nO pastor Dion Robert, é pastor de uma igreja em Abdijan (Costa do Marfim), começou a adotar o\nsistema de pastoreamento e discipulado nos lares e hoje conta com mais de 150.000 membros,\ninfluenciando e abençoando aquela nação que foi livre uma grande guerra civil que assolou muitas\nnações vizinhas.\n\nCésar Castellanos (Colômbia)\n\n      A cidade de Bogotá na Colômbia tem sido abalada por uma Igreja em Células dirigida pelo Pr.\nCésar Castellanos Domingues que têm cerca de 25 mil células onde se reúnem mais de 250 mil pessoas\nalcançadas pelo amor do Senhor Jesus Cristo. Essa Igreja era composta há alguns anos por 300\nmembros.\n\n       O pastor Castellanos desenvolveu o sistema de evangelismo, discipulado e pastorado    G-12,\nonde se objetiva que cada pessoa forme uma célula com doze pessoas, mas não deixando de participar\nda célula original (Geração), e assim por diante, cada geração ter 12 células e cada célula ter 12\npessoas.\n\nLawrence Khong (Cingapura)\n\n                                                                                  Igreja de Vencedores\n\n      Pastor Lawrence Khong, é pastor de uma igreja em Cingapura, pequeno país de 641 km2, mas\ncom uma população de 3,4 milhões de pessoas, é um dos países livres onde se proíbe a evangelização\nnas ruas. Apesar disso, fazendo o trabalho de evangelismo, discipulado e pastoreio nos lares, hoje\naquela igreja conta com mais de 10.000 membros e já implantou congregações com seus membros\ndistribuídos em células em vários países, como a Rússia, Hong Kong, Taiwan, Cazaquistão, China,\nIndonésia,      Filipinas    e     outros     dentro     da     oprimida       \"Janela     10/40\".\n\nSérgio Solorzano (El Salvador)\n\n       Em 1977 o pastor Sérgio Solorzano foi chamado da Guatemala para iniciar um trabalho em El\nSalvador junto com outros 9 irmãos. Em sete anos, a igreja cresceu para 3.000 membros, usando a\nestrutura tradicional da igreja. Em 1985, Solorzano visitou o congresso de crescimento da igreja em\nSeul e, ao retornar, mudou todo o trabalho da sua igreja para a estrutura baseada em células. Após\nperder alguns membros, agora tem mais de 120.000 membros na igreja central, além de congregações\nem vários países. Essa igreja tem dois encontros das células por semana, um para edificação e outro\npara evangelismo.\n\n     A igreja que adotam o modelo tradicional baseado exclusivamente em reuniões nos cultos\npúblicos tem conseguido crescer até um patamar limitado (salvo exceções que, percentualmente,\nsão pequenas). Os números dão conta:\n\n    * 67% das igrejas param de crescer ao atingirem de 100 membros.\n\n    * 50% das igrejas param de crescer ao atingirem de 150 membros.\n\n    * 28% estacionam em 350 membros.\n\n    * 5% conseguem chegar a 1.000 membros (membros \"ativos\", e não rol de membros\n\n\"fantasmas\").\n     * 1% consegue chegar a 2.000 membros\n\n     Qual a causa dessa limitação? Com as atividades centralizadas nos templos (edifícios) e em\nespecialistas (dirigentes de programas), as pessoas não são alcançadas lá onde se encontram,\nnecessitadas e sedentas do amor de Cristo.\n\n      Você pode perguntar: Por que essa preocupação toda com o crescimento da Igreja? E a resposta\nnos vem dos dados do crescimento da população mundial:\n\n     * No ano 1800 a população mundial era de 1 bilhão de pessoas.\n\n* No ano 1900 a população duplicou, indo para 2 bilhões.\n\n      * No ano 2006 a população mundial chegou a 6 bilhões.\n\n      * A estimativa para o ano de 2025 é que a população mundial atinja 10 bilhões.\n\nA Melhor Estratégia de Evangelismo no tempo atual!\n\n       \"E todos os dias, no templo e de casa em casa, não cessavam de ensinar e de pregar Jesus, o\nCristo.\" - Atos 5:42\n\n       Como já vimos anteriormente, é muito difícil a penetração da igreja nos lares de estranhos para\na pregação do evangelho. O milagre, porém, pode acontecer, e, de repente, poderão se abrir dezenas de\ncasas e centenas de caminhos novos e livres para o acesso da igreja. E acontecerá de maneira suave,\ntranqüila, sem alardes, sem a necessidade de muito marketing, e com custo quase zero para a igreja.\nRapidamente, as muralhas que separam a igreja do povo ao redor cairão por terra, a igreja sairá das\nquatro paredes e em pouco tempo estará fazendo missões urbanas.\n\n      Vamos agora fazer modestas projeções estatísticas, você se surpreenderá! Por exemplo,\ntrabalhemos com os dados de uma congregação de 200 membros. Se as células se reunirem no mesmo\ndia, em um só dia haverá 40 cultos! Se cada célula contar com a presença de quatro outros irmãos da\ncongregação, 200 irmãos estarão participando destes cultos. Se pelo menos 03 visitantes não\nevangélicos comparecerem à reunião da célula, semanalmente 120 pessoas estarão sendo\nevangelizadas. As perspectivas de crescimento são imensuráveis, porque cada pessoa que se converte\ntraz outras consigo. Está escrito: \"Crê no Senhor Jesus e serás salvo, tu e a tua casa\" - Atos 16:31!\n\n       Os líderes de célula serão devidamente orientados, treinados e verão que a liderança das\nreuniões é a coisa mais fácil do mundo! Em pouco tempo outros membros da célula se habilitarão à\ndireção. Algumas Células crescerão rapidamente, e, ao atingirem o número de doze participantes,\npoderão se multiplicar, dando origem a uma nova célula. Para facilitar a comunicação e visando o bom\nfuncionamento desta estratégia, poderão ser formadas as gerações que poderão ter até doze células e\ncada célula com doze pessoas.\n\n        Qualquer pessoa alfabetizada estará habilitada a dirigir uma célula. As lições serão sempre\ndistribuídas antecipadamente, com tempo suficiente para o estudo individual. Na reunião de célula, o\nlíder fará apenas os comentários conclusivos (que poderão ser lidos), dará as respostas (para dissipação\nde dúvidas) que terá recebido do líder de geração, e coordenará a reunião, cujo programa poderá ser: -\nQuebra Gelo, um ou dois cânticos; Reflexão rápida da lição; breves opiniões dos presentes; palavra de\noferta; orações intercessórias; e lanche\n\n       Para atrair os vizinhos há muitas formas, além, é claro, do convite direto. Uma boa idéia é criar\num formulário de Pedido de Oração, distribuir aos vizinhos para que preencham com os seus pedidos.\nMeia hora antes da reunião, alguém passa para recolher os pedidos e aproveita para convidar a pessoa\npara a reunião, a fim de conhecer aqueles que estão orando por sua vida.\n\n                                                                                    Igreja de Vencedores\n\n     Periodicamente os líderes de células poderão promover festas, passeios e outras atividades entre\nos membros e participantes das células da sua rua, bairro e cidade, para propiciar maior comunhão.\n\n       O método de células. O Senhor Jesus treinou os seus discípulos, deu as orientações necessárias,\ne os enviou de casa-em-casa ( Lucas 9:1-6 ). Posteriormente, enviou outros 70 discípulos também de\ncasa-em-casa (Lucas 10:1-10 ), os quais regressaram \"possuídos de alegria, dizendo: Senhor, os\npróprios demônios se nos submetem pelo teu nome!\" - Lc 10:17. Qual o propósito do Senhor Jesus\nao enviá-los? O prosseguimento da obra e a expansão do seu Reino por todo o mundo.\n\n       A igreja se expandiu rapidamente pregando o evangelho publicamente e de casa-em-casa.\n\"Partiam o pão de casa-em-casa...\" Atos 2:46; \"de casa-em-casa não cessavam de ensinar...\" Atos 5:42;\n\"publicamente e também de casa-em-casa.\" -Atos 20:20. Por dois anos Paulo pregava o evangelho\ndentro da sua própria casa - Atos 28:30-31; a igreja na casa de Lídia (Atos 16:40); a igreja na casa de\nPriscila e Áqüila (Romanos 16:3-5); a igreja na casa de Filemon (Filemon 2).\n\n       O Pastor Paul Yonggi Cho conta que certa feita foi ministrar no Japão sobre o crescimento da\nigreja e os japoneses ficaram céticos quanto a esta possibilidade para aquele país. Paul, mesmo\nsabendo do alto grau de rejeição dos japoneses pelos coreanos, escolheu uma senhora bem treinada da\nsua igreja e a enviou ao Japão com o desafio de plantar uma igreja e atingir 200 membros no primeiro\nano, e fazê-la crescer para 1.000 membros. Já no primeiro ano esta missionária ultrapassou o alvo\nchegando a 250 membros. Para o ano seguinte seu alvo já era 500 membros!\n\n       Nestes tempos de metrópoles, não há método melhor para missões urbanas do que o sistema de\ncélulas. Ao redor da casa de cada membro da igreja há dezenas de famílias fechadas nas suas fortalezas\nque nunca atenderiam a um estranho. Contudo, você que é vizinho tem acesso a essas pessoas. Se\ninsistir no convite elas irão à reunião da célula.\n\n      Uma forma de facilitar a aceitação do convite por parte dos convidados é servir um jantar da\namizade após as reuniões. Neste caso, as pessoas seriam convidadas para um \"jantar da amizade\"\nseguido de breve momento de meditação. É uma estratégia boa. Funciona bem. A decisão de fazer ou\nnão o jantar, ficará à critério de cada célula. Mas lembre se que as pessoas gostam de serem\nbeneficiadas.\n\n      As células poderão ser fixas ou móveis. Com o desenvolvimento do programa, os líderes de\ngeração perceberão isto, que determinados locais se mostram mais férteis, e poderá decidir pela fixação\ndas reuniões da célula nesses locais. Os líderes devem, contudo, perguntar sempre se alguém oferece a\nsua residência para hospedar a próxima reunião. Muitos visitantes solicitarão reuniões, e isto será\nótimo, porque sempre que a reunião ocorrer em local diferente estarão aumentadas as chances de se\nalcançar outras pessoas, vizinhos e familiares do anfitrião.\n\nEstá estratégia só deverá ser usada até os 6 meses de célula, após isso devera ser usada a estratégia\nADORAÇÃO, COMUNHÃO, DISCIPULADO, MINISTÉRIO E MISSÕES (igreja com propósitos)\n\nOS ESTAGIOS DA REUNIÃO DA CÉLULA DE EVANGELISMO:\n\n     Encontro - Quebra Gelo - 5 Minutos\n\n     Exaltação - Louvor - 10 Minutos\n\n    Edificação - Reflexão com Perguntas no final (O que mais lhe chamou a atenção no texto). - 20\nMinutos\n\n     Evangelismo - Palavra de oferta (5 min.), Planejar Próxima Reunião (5 min.) e Lanche (10 min.)\n(25 Minutos)\n\nTOTAL DE TEMPO DOS 4 \"ES\" É 1h DE DURAÇÃO\n\n        Como membro da Igreja de Vencedores você teve ter sua célula, afim de anunciar o Reino de\nDeus.\n\nDISCIPULADO\n\n     1. Faça um propósito, a partir de agora, de ser um exemplo de obediência para aqueles que se\nconverteram depois de você. Abra ainda nesta semana sua célula ou sua geração e comece a ganha\npessoas para o Senhor Jesus.\n\n     2. Como já vimos anteriormente, é muito difícil a penetração da igreja nos lares de estranhos para\na pregação do evangelho. O milagre, porém, pode acontecer, e, de repente, poderão se abrir dezenas de\ncasas e centenas de caminhos novos e livres para o acesso da igreja. E acontecerá de maneira suave,\ntranquila, sem alardes, sem a necessidade de muito marketing, e com custo quase zero para a igreja.\nRapidamente, as muralhas que separam a igreja do povo ao redor cairão por terra, a igreja sairá das\nquatro paredes e em pouco tempo estará fazendo missões urbanas.\n\n     3. Para atrair os vizinhos há muitas formas, além, é claro, do convite direto. Uma boa idéia é criar\num formulário de Pedido de Oração, distribuir aos vizinhos para que preencham com os seus pedidos.\nMeia hora antes da reunião, alguém passa para recolher os pedidos e aproveita para convidar a pessoa\npara a reunião, a fim de conhecer aqueles que estão orando por sua vida.\n\n      4. Qualquer pessoa alfabetizada estará habilitada a dirigir uma célula. As lições serão sempre\ndistribuídas antecipadamente, com tempo suficiente para o estudo individual. Na reunião de célula, o\nlíder fará apenas os comentários conclusivos (que poderão ser lidos), dará as respostas (para dissipação\nde dúvidas) que terá recebido do líder de geração, e coordenará a reunião, cujo programa poderá ser: -\nQuebra Gelo, um ou dois cânticos; Reflexão rápida da lição; breves opiniões dos presentes; palavra de\noferta; orações intercessórias; e lanche.\n\n                                                                                     Igreja de Vencedores\n\n5. Não obedeça apenas por obedecer, mas que sua submissão seja fruto de uma razão maior: a fé no\nDeus Todo-Poderoso para cumprir o \"Ide\" de Jesus.\n\nVERIFIQUE O QUE VOCÊ APRENDEU\n\n1. Defina Igreja em Células.\n\n______________________________________________________________________________\n\n2. Defina o Estagio da Célula – Encontro.\n\n______________________________________________________________________________\n\n3. Defina o Estagio da Célula – Exaltação.\n\n______________________________________________________________________________\n\n4. Defina o Estagio da Célula – Edificação.\n\n______________________________________________________________________________\n\n5. Defina o Estagio da Célula – Evangelismo.\n\n______________________________________________________________________________", "quiz": [{"q": "Qual é o texto bíblico-base da lição \"IGREJA EM CÉLULAS\"?", "options": ["Gênesis 32:30; II Samuel 12", "At 2.46", "2 Corintios 4.17", "Amós 4:12b ;João 4:1-42; Tiago 1:21-22"], "answer": 1}, {"q": "Qual destes é um dos tópicos estudados na lição \"IGREJA EM CÉLULAS\"?", "options": ["Encontro Com O Mundo", "Renovação Comunitária", "Ao Fim Dos Dez Minutos O Ministrador Dirá Com Voz Suave: Vez Do Próximo", "Defina O Estagio Da Célula – Edificação"], "answer": 3}, {"q": "Qual destes tópicos NÃO faz parte da lição \"IGREJA EM CÉLULAS\"?", "options": ["Defina Igreja Em Células", "Defina O Estagio Da Célula – Edificação", "Início Do Desvio", "Defina O Estagio Da Célula – Evangelismo"], "answer": 2}]}, {"num": 34, "title": "VISÃO DE CONQUISTA", "verseRef": "1 Coríntios 9.16", "content": "TEXTO BÍBLICO\n\n      \"mas recebereis poder, ao descer sobre vós o Espírito Santo, e sereis minhas testemunhas tanto\nem Jerusalém como em toda a Judéia e Samaria e até aos confins da terra\". (Atos 1:8)\n\n       O poder de uma igreja genuinamente flui para estabelecer o testemunho da ressurreição\ndo Senhor Jesus em cada cidade, em cada estado e em cada nação. E esse testemunho, sabemos que é a\nigreja local em cada bairro ou cidade. E, segundo o que o Senhor Jesus falou para os apóstolos,\ncomeçariam em Jerusalém e espalharia por toda a região em torno da cidade principal. Neste caso nos\nfala de um mover de Deus estabelecendo em uma capital e penetrando pelo estado e indo até os confins\nda terra.\n\n       Cremos que o mover de Deus para estes dias flui necessariamente em duas direções,\ncrescimento da igreja local através de treinamento de lideres, multiplicação de células e\nedificação de uma congregação forte. E o desafio é que cada Igreja de Vencedores aonde chegar,\na partir de um dado momento (entre 50 a 100 membros) já deverá começar a plantar\ncongregações em sua região.\n\n      Como temos praticado a Implantação de congregações em nosso estado, temos obtido êxito\nna visão de que cada membro é um ministro. Por conta disso à medida que um irmão se muda para\numa cidade vizinha ele começa a sonhar com uma igreja na sua nova cidade. Uma vez que ele nos\nprocura, nós os desafiamos a abrir uma célula, depois de plantada a célula, nós enviamos uma equipe\nde Implantadores de base (lideres), com o objetivo de estruturar as células, estabelecer um culto e\nfinalmente estabelecer a base. Esse processo tem algumas etapas:\n\n        1 – Líder de Célula - esta é a primeira etapa do processo. Um irmão que já esteve entre nós vai\ncomo Líder de Célula começa a evangelizar, entendeu a visão de que cada membro é um ministro,\nsendo assim, ele é desafiado por nós para abrir uma célula. Uma vez feito isso nós os munimos do\nmaterial necessário (Folheto das 4 Leis, Discipulado e a preparação do 1º Encontro com Deus naquele\nlocal). O trabalho é básico: Célula Forte, evangelismo e estabelecer reuniões das Células e Gerações.\nLEMBRANDO QUE ESTE MODELO É NOS LOCAIS ONDE NÃO HÁ IGREJAS, POIS ONDE\nHÁ IGREJAS, A IMPLANTAÇÃO ACONTECE POR MEIO DA MULTIPLICAÇÃO DAS\nCONGREGAÇÕES OU SEJA, UMA METADE VAI PARA A NOVA CONGREGAÇÃO\nENQUANTO A OUTRA PERMANECE NO LOCAL ORIGINAL.\n\n                                                                                    Igreja de Vencedores\n\n      2 – Organizando e Estabelecendo\n\n      O trabalho deles é:\n\n            a. Estabelecer uma célula modelo, com líderes em treinamento e anfitriões, e\n      Estabelecer uma célula de discipulado.;\n\n             b. Organizar, estabelecer e dirigir um Culto de Celebração e visitar as células para\n      estabelecimento de um padrão da visão e prática da igreja.\n\n      Tempo e o Trabalho da Implantação\n\n      a) Nas sextas-feiras acontecem as visitas as pessoas chaves da obra naquele bairro ou cidade,\npara uma comunhão informal e para o conhecimento do estado da fé e da obra naquele bairro ou\ncidade. Chamamos de sondagem de território.\n\n       b) Neste momento os Auxiliares da Palavra são orientados a fazerem uma pesquisa no bairro\nou cidade, sobre o histórico cultural do bairro ou cidade, (quantidade de cristãos, igrejas, se possível\naté uma conversa com pastores que estão lá a mais tempo), mapa do bairro ou cidade (possíveis locais\npara estabelecer o prédio da igreja), lugares estratégicos, pessoas influentes no bairro ou cidade (Esta\npesquisa será realizada em um período de 3 Semanas).\n\n       c) Célula Padrão e Discipulado – Nas primeiras reuniões de célula, os Líderes de Célula\nfazem no período dos primeiros 2 meses, uma reunião com os discipulos (lideres em treinamento que\nestão recebendo o discipulado) que nós chamamos de célula modelo, nesta reunião ele fará a célula\ncom quebra gelo, louvor, compartilhar da palavra, oração intercessoria, palavra de oferta e\nlanche, com toda a intensidade, liberdade, vida, unção, encargo, envolvimento, que se espera de uma\ncélula saudável. O objetivo desta reunião é deixar um paradigma para esta primeira geração de\nlideres que está nascendo na igreja. Depois de dois meses, a reunião da célula modelo vira uma\ngeração, para motivação, apascentamento, supervisão das células e planejamento da igreja.\n\n       d) Visita e supervisão das Células – Nesta etapa, fazemos uma visita padrão para estabelecer\numa supervisão dentro das células, neste momento queremos sentir a necessidade dos membros, e a\nnecessidade das células. O acompanhamento é feito semanalmente Líderes de Célula da Congregação,\ndando ênfase principalmente às necessidade dos novos convertidos nas células. Nesta fase\nImplantamos a multiplicação da Geração para facilitar a supervisão das células. Cada Líder de\nCélula deve ficar com uma geração e cada geração ficar com o mínimo de uma célula e o Maximo 12\ncélulas.\n\n       e) Culto de Celebração – Faz parte também da sua missão planejar, organizar e dirigir o\nprimeiro culto de celebração desta base. Primeiro terá que definir um local arejado, espaçoso,\nprovidenciar cadeiras, púlpitos, gasofilácio e se possível som. Para isto você deverá levantar\npatrocínio, e as primeiras ofertas e dízimos que já foram tirados, e improvisar conforme a necessidade\ndo local. Geralmente procuramos por um local de reunião a partir dos primeiros três meses.\n\nO culto será estabelecido nos moldes da Igreja de Vencedores, boletim de informação\nsemanal, abertura, celebração, adoração (geralmente os primeiros são com mp3, mas em alguns\nlugares já temos equipes de louvor prontas para serem treinadas), reflexão da noite, oração\nintercessoria, palavra de oferta e dízimo e avisos semanais. Geralmente a partir do segundo e\nterceiro mês de trabalho com cultos a arrecadação da igreja já se estabelece e aumenta\nsignificativamente. Podendo assim, planejar o aluguel de um local de Reunião ou a compra do terreno\nda congregação, (sendo que antes, esses cultos ocorrem em uma casa de um dos irmãos daquele local).\n\n       Com o local estabelecido, deve se fazer um trabalho com crianças intenso, pois as crianças\nsão os membros mais fieis da congregação, após as crianças deve se fazer o trabalho com os juvenis\n(Adolescente e Jovens), na sequência com mulheres e etc...\n\nLideres da visão\n\n      Pregar o evangelho é a grande ordem deixada por Jesus. Ao atender a este desafio levaremos\nmuitos a se entregarem a Cristo.\n\n       \"Se cada membro se tornar um líder, o evangelho será rapidamente proclamado em todos os\npaíses, a todos os povos, nações e línguas.\"\n\n      Os cristãos como as Igrejas de hoje, devem ser evangelistas. A Igreja é como uma represa de\nágua pura, mas esta tem encanamentos que levam a água a toda a comunidade e as nações do mundo.\n\n       Os encanamentos são os cristãos cheios de amor e compaixão pelas almas perdidas e cheios do\npoder do Espírito Santo, poder este que dá um ardente desejo no coração do cristão de trabalhar sem\ncessar para Jesus.\n\nA Ordem de Jesus:\n\n      Nós encontramos na Bíblia muitos versículos e passagens sobre as quais podemos\n\n        Basear este trabalho de ganhar almas para Cristo, como Lucas 19:10; João 4:20, 20:21; Atos\n8:4; I Pedro 4:10; Mateus 28:19,20.\n\nOs mandamentos de Jesus acerca deste trabalho são explícitos:\n\n      1) Ide portanto, fazei discípulos de todas as nações. Mateus 20:19.\n\n      2) \"Ide por todo o mundo e pregai o Evangelho a toda a criatura\". Marcos 16:15.\n\n      Para quem Jesus falou estas palavras? Quem são os seus discípulos?\n\n       Quem são os discípulos de Cristo hoje? Em nossos dias? Quando lemos estes versículos,\ndevemos pensar e determinar para quem Jesus estava falando quando disse: \"IDE, EU VOS ENVIO\".\nCertamente Jesus estava falando para todos os cristãos (Seus Discípulos) de todas as raças e tempos e\nlugares. JESUS FALOU ISTO PARA VOCÊ!!!\n\n                                                                                  Igreja de Vencedores\n\n      CRESCIMENTO:\n\n      Fatores Para Crescimento da Igreja Em Células:\n\n      1- Oração\n\n      2- Estabelecer Alvos\n\n      3- Preparar Líderes em Treinamento\n\n      4- Atrair Visitantes (célula forte)\n\n      5- Evangelizar em Equipe\n\n      6- Evangelizar Suprindo Necessidades (área social e projetos)\n\n      7- Fazer os Preparativos Para um Parto Tranqüilo - Calendário para multiplicação\n\nPrimeiro Fator - Oração\n\n      Vida Devocional do Líder é Determinante na Multiplicação da célula - Ouvir a Deus.\n\n   Tempo e Lugar Específico\n\n      O Conteúdo\n\n      Ore diariamente Pelos Membros e Visitantes\n\n      Jejum e Oração Intercessoria por 3 pessoas durante um mês.\n\nSegundo Fator - Estabeleça Alvos\n\n      Igrejas em Crescimentos estão orientadas por alvos.\n\n      Alvos proporcionam direção e garantem que prioridades sejam levadas a sério.\n\n      Alvos desafiadores têm o potencial de produzir motivação e entusiasmo.\n\n      Um alvo que toda CÉLULA se esforça por alcançar é uma data prevista para a multiplicação\n\nTerceiro Fator - Preparar Líderes em Treinamento\n\n      Delegar Encargos - Compartilhe\n\n      Esteja Disposto a Multiplicar a Liderança- Dentre Os Novos Na Fé\n\nOre Continuamente Por Mais Líderes em Treinamento\n\n      Envolva Líderes Em Potencial\n\n      Recrute, capacite E Equipe O Novo Líder- Dê o Discipulado e o envolva na pratica.\n\n      Forme Uma Equipe De Liderança na célula\n\n      Não Tema O Fracasso\n\nQuarto Fator Atrair visitantes (Célula Forte – evento ponte)\n\n      Visitas a Pessoas Novas – realizem células fortes (Eventos para convidar vizinhos e amigos)\n\n      Exortação na célula para convidar amigos - o líder encerra a célula perguntando: quem você irá\nconvidar na próxima semana?\n\n       O seu OIKOS - NT -Família. No novo Testamento, ela não se refere somente aos membros da\nfamília - grupo primário- de amigos.\n\n       Os visitantes renovam a célula e fazem os membros antigos lembrarem de um mundo perdido e\nsofrido.\n\nQuinto Fator Evangelize em Equipe\n\n      Parceria no evangelismo da célula – a célula toda planeja o evangelismo regularmente\n\n      Cada um Participa - Evangelismo da célula deve ser por meio da Edificação - da amizade - da\nTransparência honesta\n\n      Comprometer a toda equipe na célula\n\n       O evangelismo não deve ser um, convite para um culto e sim para um evento, uma festa da\namizade, um jantar entre amigo, um encontro da comunidade (nestas reuniões sempre deve ter uma\nreflexão rápida 10 minutos e dinâmicas 10 minutos).\n\nSexto Fator - Evangelize ao Suprir as Necessidades Sociais\n\n      Evangelismo por meio de serviços Comunitários\n\n      A hospitalidade era uma característica essencial na Igreja Primitiva\n\n      Exemplo do Ministério de Jesus\n\n                                                                                  Igreja de Vencedores\n\n      Necessidades sentidas\n\n      Necessidades solucionadas\n\n      Desenvolva trabalhos como artesanato, escola de reforço, escola de musica e etc..\n\nSétimo Fator - Faça os Preparativos Para Um Parto Tranqüilo\n\n      Nascer uma nova CÉLULA - Requer Planejamento e Preparo Detalhado\n\n      Porque uma célula não se Multiplica-\n\n      1-Os membros da célula tornam-se confortáveis demais na companhia uns dos outros\n\n      2-Os membros não conhecem a alegria do nascimento de uma nova célula\n\n      3-Temor de que a nova célula não seja tão boa quanto a outra.\n\n      Se o grupo não permanece pequeno, ele perde sua Eficácia e sua habilidade de cuidar das\nnecessidades de cada membro\n\n      O Grupo precisa ser pequeno o suficiente para que todos os membros possam contribuir\nlivremente e compartilhar necessidades pessoais\n\n        Crescimento em tamanho normalmente exclui crescimento na intimidade. Essa é a razão mais\nforte a favor da multiplicação.\n\n   Como a sua CÉLULA Pode Crescer e Multiplicar\n\n      Crescimento de Igreja é: fisgar o peixe (Evangelismo e Célula Forte) e não deixá-lo\nEscapar (discipulado e Encontro com Deus).\n\n      Não há um modo ou um método correto e definitivo para multiplicar A CÉLULA\n\n   Modo ou método correto é aquele que edifica os santos e atrai não cristãos para a sua célula.\n\nMorte dos Apóstolos:\n\n   ANDRÉ - Pregou na Grécia e Ásia Menor. Foi crucificado em Acácia pelo procônsul Eges, foi\n   amarrado para sofrer mais.\n\n   Foi crucificado em forma de X (crux decussata).\n\n   BARTOLOMEU - Foi surrado e esfolado. Sendo golpeado até a morte. Segundo Fox's Book of\n   Martyrs, ainda foi crucificado.\n\n   TIAGO, filho de Alfeu - Foi apedrejado até a morte.\n\n   TIAGO, filho de Zebedeu - Pregou em Jerusalém e na Judéia, foi decapitado.\n\n   JOÃO - Foi exilado por causa da sua fé e morreu por causas naturais (velhice).\n\n   JUDAS, não o Iscariotes - Apedrejado até a morte.\n\n   MATEUS - Perfurado com lanças até a morte.\n\n   PEDRO - Pregou entre os judeus até a Babilônia. Foi crucificado de cabeça para baixo,\n   considerado indigno de sofrer como Jesus.\n\n   FILIPE - Foi crucificado\n\n   SIMÃO, o zelote - Foi crucificado\n\n   TOMÉ - Pregou na Pérsia e na Índia, sendo martirizado perto de Masdras. Foi perfurado de lanças\n   até a morte.\n\n                                                                                    Igreja de Vencedores\n\n   MATIAS - Este ficou no lugar de Judas Iscariotes, foi apedrejado até a morte.\n\n   JUDAS ISCARIOTES - Traiu Jesus e enforcou-se.\n\n   PAULO - Foi decaptado em Roma por ordem de Nero.\n\n   ELES FIZERAM A PARTE DELES E VOCÊ JÁ FEZ A SUA?\n\n   VOCÊ JÁ TEM UMA CÉLULA?\n\n   VOCÊ JÁ DISCIPULOU AGUÉM?\n\n   VOCÊ JÁ ACEITOU JESUS MESMO EM SUA VIDA?\n\n   Recebemos uma ordem do Senhor Jesus. Fomos chamados pelo Senhor e separados para nobre e\n   suprema tarefa da evangelização (leia Mateus 4.21; João 20.21). A \"grande comissão\" repetida\n   cinco vezes, em todos os evangelhos e em Atos dos Apóstolos (leia Mateus 28.18-20; Marcos\n   16.15; Lucas 24.47; Atos 1.8), é o verdadeiro alvo do Novo Testamento. O \"ide\" de Jesus é mais do\n   que uma ordem, é uma obrigação: \"... me é imposta esta obrigação; e ai de mim, se não anunciar o\n   Evangelho\" (1 Coríntios 9.16).\n\nDISCIPULADO\n\n     Você aprendeu que somos uma igreja missionária e que Deus lhe chamou para fazer parte desta\nfamília, portanto temos uma só visão – Adoração, Comunhão, Discipulado, Ministério e Missões\n\n      Diante do exposto, cabe-lhe avaliar, se você tem seguido o objetivo proposto, que é ganhar nosso\nbairro, cidade, estado, nação e o mundo para o Senhor Jesus.\n\n     1. Se você ainda não tem uma célula ou geração pesa perdão ao Senhor por você está\nnegligenciando o \"Ide\" de Jesus. \"Portanto ide, fazei discípulos de todas as nações, batizando-os em\nnome do Pai, e do Filho, e do Espírito Santo; ensinando-os a observar todas as coisas que eu vos\ntenho mandado...\"(Mt 28.19 e 20) ; \"Vós não me escolhestes a mim mas eu vos escolhi a vós, e vos\ndesignei, para que vades e deis frutos, e o vosso fruto permaneça, a fim de que tudo quanto pedirdes\nao Pai em meu nome, ele vo-lo conceda\".(Jo 15. 16) e \"Maldito aquele que fizer a obra do Senhor\nnegligentemente, e maldito aquele que vedar do sangue a sua espada!\" (Jr 48.10). Se é maldito o que\nfaz a obra do Senhor relaxadamente ou negligentemente, quanto mais o que não faz... O que é?\n\n   2. Abra sua célula ou geração ou base, não enterre o seu chamado!\n\n   3. Abra uma célula em outro bairro, cidade, estado ou nação.\n\nVERIFIQUE O QUE VOCÊ APRENDEU\n\n1. Defina Atos 1:8.\n\n______________________________________________________________________________\n\n2. Defina Líder de Célula.\n\n______________________________________________________________________________\n\n3. Defina a célula modelo.\n\n______________________________________________________________________________\n\n4. Defina os fatores para crescimento da Igreja Em Células.\n\n______________________________________________________________________________\n\n                                                                   Igreja de Vencedores\n         236", "quiz": [{"q": "Qual é o texto bíblico-base da lição \"VISÃO DE CONQUISTA\"?", "options": ["2\nCoríntios     5:14", "1 Pe 4: 10, 11", "1 Coríntios 12.1", "1 Coríntios 9.16"], "answer": 3}, {"q": "Qual destes é um dos tópicos estudados na lição \"VISÃO DE CONQUISTA\"?", "options": ["Como Surgem As Maldições", "A Consciência Do Seu Chamado", "Defina Atos 1:8", "Espírito – Elemento Com O Qual Falarmos Com Deus;"], "answer": 2}, {"q": "Qual destes tópicos NÃO faz parte da lição \"VISÃO DE CONQUISTA\"?", "options": ["Defina Rede Ministerial", "Defina A Célula Modelo", "Defina Atos 1:8", "Abra Uma Célula Em Outro Bairro, Cidade, Estado Ou Nação"], "answer": 0}]}, {"num": 35, "title": "BATALHA ESPIRITUAL", "verseRef": "2 Tm 4.7", "content": "TEXTO BÍBLICO\n\n\"pois não é contra carne e sangue que temos que lutar, mas sim contra os principados, contra as\npotestades, conta os príncipes do mundo destas trevas, contra as hostes espirituais da iniqüidade nas\nregiões celestes\". (Efésios 6.12)\n\nBatalha Espiritual:\n\n      A uma diferença entre batalha e guerra, a batalha é um combate com um propósito especifico. A\nguerra é um conjunto de batalhas, com um propósito de tomadas de nações, continentes e estados.\n\n      No mundo espiritual entendemos que a guerra, existe desde a fundação do mundo, e acabará no\nfinal dos tempos, quando satanás for totalmente aprisionado, com todos os seus demônios. Enquanto\nisso se levantam batalhas espirituais, em todo o tempo. Os personagens deste cenário são:\n\n      * Eu e Você\n\n      * Anjos e Demônios\n\n      * Deus, pois é onipotente\n\n    A Bíblia Sagrada nos revela algumas observações importantes acerca de batalhas espirituais.\nObserve:\n\n    * Batalha espiritual é Deus derrotando satanás (2Ts 2.8).\n\n    * Batalha espiritual é a luta entre a carne e o espírito (Rm 8. 5)\n\n    * Batalha espiritual é a luta entre os anjos e os demônios (Ap 12.7)\n\n    * Batalha espiritual é pela fé, vencer as aflições do mundo (Jo 16. 33)\n\n    * Batalha espiritual é livrar as almas da morte (Pv 24. 11)\n\n     Muitos cristãos assumem o ministério de Batalha Espiritual como se fosse uma responsabilidade\ndele mesmo. Não é, somos apenas instrumentos nas mãos de Deus. A batalha é do Senhor. O motivo\nde cristãos desistirem da igreja, geração, célula e até da fé é justamente por isso. Eles querem ver\nresultados imediatos, e querem fazer de seu jeito. Somos guerreiros e soldados, e devemos está sobre a\n\ndireção do Grande General de Guerra, para que possamos ter grandes vitórias. E finalmente dizermos\ncomo Paulo: \"combati o bom combate, acabei a carreira, e guardei a fé\" (2 Tm 4.7)\n\n     Medite nestes versículos, e entenda que a batalha pertence ao Senhor:\n\n     * Gn 3.15\n\n     * Ex 15.3\n\n     * Ex 14.14\n\n      * Is 41. 10 - 13\n\n      1. Não existe luta entre Deus e o diabo\n\n        Uma vez um bruxo mundialmente conhecido disse: \"O mundo é um grande tabuleiro de xadrez,\ne existe uma luta entre as pedras braças e as pedras negras. Cabe a você escolher de que lado quer\nlutar\". Neste pensamento, o bruxo fazia a menção à chamada \"eterna luta entre Deus e o diabo; a luta\nentre o bem e o mal\".\n\n        O pensamento é até bonito, interessante, mais é uma meia verdade de satanás, que tem\nconfundido diversas pessoas. Muitos cristãos e até lideres assumem está visão em relação à batalha\nespiritual, porém Não existe luta entre Deus e o diabo em outras palavras satanás bate continência na\npresença de Deus. Tudo o que ocorre no mundo espiritual está debaixo da soberania de Deus, e o\npróprio satanás depende da autorização de Deus para fazer seus atos malignos.\n\n      \"Ora, chegado o dia em que os filhos de Deus vieram apresentar-se perante o Senhor, veio\ntambém Satanás entre eles. O Senhor perguntou a Satanás: Donde vens? E Satanás respondeu ao\nSenhor, dizendo: De rodear a terra, e de passear por ela\" (Jó 1. 6 - 7)\n\n       2. Então de quem é a luta?\n\n      Eis uma boa pergunta. Se Deus não luta contra o diabo, porque vivemos em batalha? Porque o\npovo de Deus vivi em guerra espiritual?... É por que a luta é entre o homem e satanás.\n\n      \"pois não é contra carne e sangue que temos que lutar, mas sim contra os principados, contra as\npotestades, conta os príncipes do mundo destas trevas, contra as hostes espirituais da iniqüidade nas\nregiões celestes\". (Ef 6.12)\n\n      Paulo diz que a luta espiritual é contra nós. Satanás e seus demônios sabem que não podem lutar\ncontra Deus, pois o senhor tem poder para destrui-los com o sopro de sua boca (2 Ts 2.8). Portanto eles\nsabem que podem afetar diretamente ao Senhor, quando agridem sua noiva.\n\n                                                                                    Igreja de Vencedores\n\n      A igreja representa a noiva de Cristo, que está temporariamente na terra, sendo preparada pelo\nEspírito Santo o grande encontro, o dia do casamento. Enquanto isso o diabo tenta atacar a igreja do\nSenhor. Para ele este casamento não pode acontecer.\n\n     Sim estamos em batalha, e como bons soldados precisamos está preparados, devidamente\ntreinados. Fique alerta, o diabo anda ao derredor, buscando quem possa tragar.\n\n     3. Não subestime o inimigo\n\n     Um dos grandes ensinamentos que qualquer militar aprende é: Não subestime o inimigo.\n\n     Satanás e os demônios são nossos piores inimigos, você pode crer que eles são fracos, e que são\nsubmissos á autoridade do nome de Jesus. Eles podem até correr quando olham para você, devido à\nunção que Deus coloca sobre sua vida, mas não se distraia, não subestime o inimigo.\n\n     Nosso inimigo não tem pressa, ele tem todo o tempo para tentar acabar com sua vida, sua célula,\nsua geração e seu ministério. Entenda que ele anda ao nosso derredor, esperando uma oportunidade\npara tragar-no
