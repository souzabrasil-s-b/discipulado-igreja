    A queda do homem no pecado destruiu a paz com Deus, com outros homens, com o próprio ser,\ncom a própria consciência. Foi por meio da instrumentalidade da cruz que Deus estabeleceu a paz\n(Colossenses 1.20).\n\n     O cristão vive no meio da violência que gera insegurança e medo nas pessoas, mais esta virtude\ndo Espírito lhe concede tranqüilidade e confiança.\n\n      2. Qualidades sociais (v.22). Longanimidade, benignidade e bondade. São virtudes direcionadas\nao relacionamento entre os cristãos.\n\n     a) Longanimidade. É uma qualidade atribuída a Deus. Ele tem tolerado pacientemente todas as\niniqüidades do homem. Não se deixando levar pela ira e furor, manifesta o seu amor, bondade e\nmisericórdia; não usando sua justa indignação. De nós os cristãos é esperado que nossas relações com\nos outros homens se caracterizem pela longanimidade do mesmo modo que Deus tem agido conosco.\nLeia 2 Co 6.6; Cl 1.11; 3.12.\n\n                                                                                      Igreja de Vencedores\n\n     Se Deus não fosse misericordioso e longânimo para conosco teríamos sido imediatamente\nconsumidos.\n\n      b) Benignidade. Benignidade no original grego significa \"bondade\" ou \"honestidade\". O cristão\nque possui esta virtude é afável e gentil para com seus semelhantes não se mostrando inflexível e\namargo. Deus é a fonte dessa qualidade e Cristo o melhor exemplo. Ele foi uma pessoa imensamente\ngentil, conforme os evangelhos o retratam. Essa virtude torna o cristão benigno, desejoso do bem a\ntodos, principalmente para com seus inimigos.\n\n     c) Bondade. Representa a generosidade que flui de uma santa retidão dada por Deus. Se antes\nvocê praticava o mal, agora é bom para todos, sem acepção de pessoas.\n\n     3. Demais qualidades (v.22). Fidelidade, mansidão e temperança ou domínio próprio.\n\n     a) Fé ou fidelidade. No original grego significa tanto \"confiança\" quanto \"fidelidade\". A fé aqui\nindica a confiança em Jesus Cristo (Efésios 2.8,9). Mediante esta qualidade do fruto, podemos alcançar\na medida total da plenitude de Cristo (Efésios 4.13). À medida que esse fruto amadurece em nós, nossa\nconfiança em Deus é fortalecida. A fé não é produto humano; ocorre através da operação divina; e\nconsiste em confiança plena de alma em Cristo, resultante de uma experiência com Ele. É a certeza que\nDeus existe e está sempre conosco para nos dá a vitória.\n\n     b) Mansidão. Trata-se de uma submissão do homem para com Deus, e, em seguida, para com o\npróprio homem. A mansidão é o resultado da verdadeira humildade, que nos leva ao reconhecimento\ndo valor alheio e a recusa de nos considerarmos superiores. Jesus disse: \"Bem aventurado os mansos,\nporque eles herdarão a terra\" (Mateus 5.5).\n\n     Essa virtude torna você manso e calmo, quando antes, era agressivo e se irava por qualquer coisa\nque o contrariava.\n\n     c) Temperança. Parece ser o somatório de tudo. Quem a possui tem o domínio próprio.\n\n     [i] Nas palavras. Há um ditado popular que afirma: \"Não devemos falar o que sabemos, mas, sim,\nsabermos o que falamos\". Isto é o que se pode chamar de sobriedade, domínio próprio. Leia Tiago 3.2.\n\n      Você encontra nas escrituras Sagradas diversos exemplos de pessoas mal sucedidas, porque\nfalaram demais. Miriã e Arão, irmãos de Moisés, o criticaram, por ter se casado com uma estrangeira.\nDeus, então, os castigou. Ela, por ser a mentora da critica, ficou leprosa por sete dias e ambos\nperderam o direito de entrar na terra prometida.\n\n      [ii] Nas ações. Quatro jovens judeus, levados cativos para a Babilônia, foram escolhidos por\nNabucodonosor para realizarem um curso, e, depois, servirem ao governo caldeu. O rei ordenou que os\nalimentasse com todas as iguarias da mesa real. Daniel e seus companheiros propuseram em seus\ncorações [leia Daniel 1.8]. Solicitaram, então, ao despenseiro que lhes fornecesse apenas legumes\ndurante dez dias. Se após este período, seus semblantes estivessem abatidos, aceitariam o manjar do\nrei. No entanto, se apresentassem bom estado de saúde, continuariam com a refeição escolhida por eles\naté o final daquele treinamento.\n\nApós aquele período de dez dias, seus semblantes eram melhores do que os demais jovens. Por\nisso, continuaram com aquela refeição, à base de legumes, até o final do curso.\n\n     Esta é uma demonstração de sobriedade, força de vontade e temperança dos quatro jovens judeus.\n\n     [iii] Nos pensamentos. Por falta de domino próprio, Davi cedeu a tentação que o naufragou no\npecado e o fez pagar as conseqüências pelo resto da vida. Era a época em que os reis saiam para guerra.\nNo entanto, ele passeava no terraço de sua casa real. Seu pensamento vagava distante, em busca de\nalgo que satisfizesse o seu ego. Repentinamente, deparou-se com uma cena que o devorou, como uma\nlabareda de fogo ao consumir algo inflamável: uma mulher banhava-se, nua, no quintal de sua casa. A\nchama da sensualidade acendeu o desejo incontido no coração do rei de Israel de possuí-la. Quando\npercebeu o que fizera, já era tarde demais: havia se deitado com ela e tinha ordenado a morte do seu\nmarido. Tudo isso aconteceu por falta de autocontrole do pensamento que o levou a cometer aquela\nloucura. Leia 2 Samuel 11.1-4.\n\n     O cristão deve sempre ocupar-se com coisas boas. E a melhor terapia é ler a Bíblia, cantar hinos\nevangélicos, visitar os novos convertidos, desviados e enfermos. A Palavra de Deus também nos\nrecomenda que devemos fugir da aparência do mal [leia 1 Tessalonicenses 5.22]. Só assim,\nvenceremos as tentações e manteremos a nossa sobriedade. Onde você estiver: no trabalho, na igreja,\nno ônibus, etc. pense nas coisas celestiais, e viva como Jesus, vitoriosamente.\n\n    DISCIPULADO\n\n     1. O fruto do Espírito não é produzido na vida de alguém que vive de qualquer maneira. O cristão\nprecisa dedicar-se à oração, ao estudo da Palavra de Deus e passar por várias provas, para alcançar o\nseu crescimento espiritual.\n\n     2. Ao analisar, uma por uma, as virtudes produzidas pelo fruto do Espírito, você chega à sublime\nconclusão que há um preço a ser pago, para alcançá-lo, mas a alegria é imensurável e lhe sustenta até a\nsua partida, ao encontro de Cristo.\n\n     3. Procure se envolver no ministério que você faz parte é sempre bom ter novas ideias no grupo.\n\n     4. Ore nesta semana para você levar novas pessoas para a célula e a geração. Deus lhe chamou\npara ganhar sua família e amigos para Ele. Se você já os chamou não desista deles continue orando e\njejuando, pois muito pode a oração do justo.\n\n                                                                                    Igreja de Vencedores\n\nVERIFIQUE O QUE VOCÊ APRENDEU\n\n1. Em que consiste o fruto do Espírito na vida do cristão?\n\n______________________________________________________________________________\n\n2. Quais são as qualidades universais do fruto?\n\n______________________________________________________________________________\n\n3. Quais são as qualidades sociais do fruto?\n\n______________________________________________________________________________\n\n4. De que modo Deus tem demonstrado sua longanimidade?\n\n______________________________________________________________________________\n\n5. Qual a principal característica de quem possui a temperança?\n\n______________________________________________________________________________", "quiz": [{"q": "Qual é o texto bíblico-base da lição \"O DISCIPULO E O FRUTO DO ESPIRITO SANTO\"?", "options": ["1 Pe 4: 10, 11", "Gálatas 5.22,23", "2 Coríntios 5.17", "Tiago 5.17,18"], "answer": 1}, {"q": "Qual destes é um dos tópicos estudados na lição \"O DISCIPULO E O FRUTO DO ESPIRITO SANTO\"?", "options": ["Virtudes Ou Qualidades Do Fruto Do Espirito", "Entendendo Mais Sobre Demônios", "Iniciar Sua Própria Célula", "A Primeira Divisão Da Igreja Católica"], "answer": 0}]}, {"num": 13, "title": "O DISCIPULO E O EVANGELISMO", "verseRef": "Marcos 16.15", "content": "TEXTO BÍBLICO\n\n     \"E disse-lhes: ide por todo o mundo, pregai o evangelho a toda a criatura\" (Marcos 16.15).\n\n     COMENTÁRIO\n\n     INTRODUÇÃO\n\n      O que é evangelismo? Certamente você já ouviu esta expressão na sua igreja em vários\nministérios, gerações e células. Você mesmo foi alcançado pela graça de Deus através desta magnífica\nobra! Evangelismo é a divulgação da Palavra de Deus por todos os cristãos, com o sincero desejo no\ncoração de ganhar almas para Cristo em todos os lugares, em todo o tempo, e por todos os meios. Cada\ncristão autêntico tem o privilégio de evangelizar. Todos os cristãos estão autorizados e nomeados para\nesta nobre tarefa. Em suma, evangelizar é: pregar (Marcos 16.15); pescar (Mateus 4.19); procurar os\nperdidos (Lucas 15); livrar da morte (Provérbios 24.11); é cuidar das almas (Salmos 142.4).\n\nI. POR QUE E QUANDO DEVEMOS EVANGELIZAR\n\n      1. Todos precisam de uma salvação. Todos os homens são pecadores e precisam de um\nSalvador. O homem pecou e foi destituído da gloria de Deus (Romanos 3.23), ou seja, ficou\nimpossibilitado de permanecer na presença do Criador. Com a entrada do pecado no mundo satanás\ntornou-se deus deste século e príncipe deste mundo. O pecador está preso pelos laços do diabo,\ndominado e entregue a toda sorte de iniquidades. Portanto, necessita urgentemente de um Salvador.\nVocê agora é portador desta mensagem preciosa, que propicia remissão e regeneração do mais vil\npecador. O homem só poderá crer depois de ouvir a Palavra. \"Como pois invocarão aquele em que não\ncreram? E como crerão naquele de quem não ouviram? E como, ouvirão, se não há quem pregue?\"\n(Romanos 10.14). Enquanto não crer ele está perdido (João 3.13-36), porém quando ouve a Palavra\nadquire fé (Romanos 10.17), e esta comunica-lhe salvação (Efésios 2.8) e muitas outras bênçãos\ncelestiais. Leia Marcos 16.17,18.\n\n     2. Recebemos uma ordem do Senhor Jesus. Fomos chamados pelo Senhor e separados para\nnobre e suprema tarefa da evangelização (leia Mateus 4.21; João 20.21). A \"grande comissão\" repetida\ncinco vezes, em todos os evangelhos e em Atos dos Apóstolos (leia Mateus 28.18-20; Marcos 16.15;\nLucas 24.47; Atos 1.8), é o verdadeiro alvo do Novo Testamento. O \"ide\" de Jesus é mais do que uma\nordem, é uma obrigação: \"... me é imposta esta obrigação; e ai de mim, se não anunciar o Evangelho\"\n(1 Coríntios 9.16). Isto não significa que você será forçado ou constrangido a pregar o evangelho. Mas\nque foi convidado pelo Senhor a fazê-lo, e o faz com dedicação, prazer e gratidão dando o seu próprio\ntestemunho de fé ao mundo.\n\n                                                                                   Igreja de Vencedores\n\n      3. Deus nos concedeu o privilegio de participarmos de sua obra. Os anjos desejam\nardentemente realizar esta tarefa, mas eles não possuem este direito. O anjo disse a Cornélio que\nmandasse buscar a Pedro para que viesse e pregasse o evangelho: \"... manda chamar a Simão... ele te\ndirá o que deves fazer\" (Atos 10.5,6). Os seres angelicais nada podem fazer devido à sua condição de\nespírito. Mas o cristão tem plena condição de realizar esta obra. A proclamação do evangelho é um\nprivilegio que Deus concedeu a homens com o fim de se adquirir galardões. A salvação é dádiva que o\nSenhor concedeu aos homens, mas o galardão é recompensa que o cristão obtém mediante sua\natividade na obra de Deus.\n\n      4. O tempo de Deus é \"agora\" (Atos 17.30). \"... eis aqui agora o tempo aceitável, eis aqui agora\no dia da salvação\" (2 Coríntios 6.2). Por que agora? Agora estamos vivos. Não sabemos quando\nseremos recolhidos pelo Senhor. Devemos fazer a obra de Deus \"enquanto é dia; a noite vem, quando\nninguém pode trabalhar\" (João 9.14). Hoje em nosso país, temos plena liberdade para pregarmos o\nevangelho em todos os lugares. Entretanto, pode ser que no futuro, nossa liberdade religiosa seja\nrestringida ou caçada e fiquemos impossibilitados de pregar o evangelho.\n\n     Devemos evangelizar todos os dias aproveitando todas as oportunidades. A Bíblia recomenda que\npreguemos a palavra \"a tempo e a fora de tempo\" (2 Timóteo 4.2).\n\nII. ONDE DEVEMOS EVANGELIZAR\n\n       Nem em todos os lugares podemos fazer cultos e pregações, mas ganhar almas, individualmente,\nsim.\n\n     1. Nos cultos. Após a pregação os ganhadores de almas, deverão estar atentos para levar aos\nouvintes uma palavra amiga, sincera e marcar o discipulado. Existem pessoas que mesmo sendo\nconvencidas pelo Espírito Santo, precisam de ajuda para fazer sua decisão. Muitos têm dúvidas,\ntemores e diversas dificuldades internas. Nestas horas uma palavra de encorajamento é decisiva.\n\n      2. Nos lares. Jesus disse que o campo é o mundo, o mundo começa à nossa porta, no nosso\npróprio lar (Marcos 5.19). Os cristãos primitivos evangelizavam de casa em casa (Atos 20.20). Muitas\nigrejas de hoje que são grandes, começaram em casas particulares (células). Marque com quem você\nconhece uma célula, a célula deve acontecer na casa da pessoa uma vez por semana. Se você conhece\ndez pessoas e cinco aceitarem a célula em suas casas, você terá cinco células.\n\n      3. Nos trabalhos. Jesus chamou seus discípulos, quando eles estavam ocupados em seus\ntrabalhos habituais (leia Marcos 1.16-19; Mateus 9.9). Nem sempre é possível evangelizar no trabalho,\nmas a mensagem que fala mais forte ao coração ímpio é a própria vida de quem prega. Portanto, um\nbom testemunho constitui-se uma poderosa mensagem.\n\n    4. Nos transportes. Nos ônibus, trens, metrôs e outros meios de transportes públicos, as pessoas\nnormalmente estão dispostas e desocupadas, gostam de conversar e ler. Quando não podemos falar\ncom alguém, entregar um folheto apropriado é bem oportuno.\n\n5. Nos hospitais, penitenciarias e outras instituições públicas. A primeira providência é obter a\nautorização para realizar o trabalho que se pretende.\n\n      Há pessoas que em boas condições de saúde em plena liberdade jamais ouviriam o evangelho,\nmas nestas circunstâncias costumam ouvir de boa mente. Nunca discuta pontos doutrinários ou\nreligião. Lembre-se! Seu objetivo é anunciar a Cristo.\n\n     6. Em todos os lugares. O convite da salvação destina-se a todas as pessoas em todos os lugares\nindependentes de cor, credo, religião, raça, cultura e posição social.\n\nIII. REQUISITOS NECESSÁRIOS PARA EVANGELIZAR\n\n     Em primeiro lugar, o ganhador de almas precisa ter a experiência da salvação [2 Timóteo 1.12].\nSe o cristão não tem convicção plena de sua própria salvação, como poderá convencer os outros?\n\n      1. Ler e estudar a Bíblia diariamente. \"Procura apresentar-te a Deus aprovado, como obreiro\nque não tem de que se envergonhar, que maneja bem a Palavra da Verdade\" (2 Timóteo 2.15); \"Então\nFelipe, abrindo sua boca, e começando nesta escritura, lhe anunciou a Jesus\" [Atos 8.35]. É preciso que\nos cristãos, que desejam ganhar almas para Cristo, estudem sistemática, metódica e perseverantemente\na Bíblia. Aquilo que a eloquência, o argumento e a persuasão humana não pode fazer, a Palavra de\nDeus o faz quando apresentada sob a unção do Espírito Santo.\n\n     2. Ter ardente amor pelas almas perdidas. O evangelismo na igreja primitiva era caracterizado\npelo esforço constante dos cristãos no cumprimento do \"ide\" de Jesus. Nem as proibições (leia Atos\n4.18; 5.28), nem as prisões (leia Atos 5.17-20), nem as ameaças de morte puderam deter aqueles\nirmãos inflamados pelo poder de Deus, pelo amor às almas perdidas, em nada tiveram suas vidas por\npreciosas contanto que pudessem cumprir com alegria a sublime missão que lhes fora dada pelo\nMestre.\n\n     Constrangidos pelo amor de Cristo (2 Coríntios 5.14), eles não podiam deixar de falar do que\ntinham visto e ouvido (Atos 4.20). Se quisermos lograr êxito no evangelismo em nossos dias, a\nexemplo dos nossos irmãos no inicio do cristianismo, devemos pedir ao Senhor que nos encha o\ncoração de amor pelos perdidos, pois só ganha almas quem ama.\n\n     Assim se expressou um grande servo de Deus: \"Não me importava onde ou como vivia nem as\nexperiências duras que passava, se isto me levava a ganhar almas para Cristo. Enquanto dormia era este\no meu sonho e quando acordava o meu primeiro pensamento neste grande trabalho estava\".\n\n     Sem dúvida alguma, a força que move o evangelismo é a compaixão. Sem ela, o evangelho do\nevangelista se torna frio, rotineiro e secularizado. Eu preciso amar as pessoas para abrir células em suas\ncasas, caso contrario eu serei egoísta em relação às bênçãos de Deus.\n\n      3. Ter vida santa, separada para Deus. \"Lava-me completamente da minha iniquidade e\npurifica-me do meu pecado\"; \"Então, ensinarei aos transgressores os teus caminhos, e os pecadores a ti\nse converterão.\" (Salmos 51.2,13). Muitos cristãos trabalham à toda força e não há fruto. Qual é a\nrazão? O pecado é um impedimento à conversão de pecadores.\n\n                                                                                      Igreja de Vencedores\n\n     Se estivermos em pecado, se não estivermos em comunhão com Deus, se estivermos nos\ndescuidando da leitura da Bíblia e da oração, fatalmente teremos o coração de pedra e nosso trabalho\nnão frutificará.\n\n     4. Aprender com o Mestre Jesus. Leia João 4.1-30 e acompanhe os passos do nosso amoroso\nSalvador evangelizando a mulher samaritana.\n\n      a) Jesus aproveitou a oportunidade, embora cansado (v.6) e, faminto (v.8), pregou. Ele teve amor\ne espírito de sacrifício, tudo por uma alma perdida.\n\n     b) Ele esperou o momento de estar a sós com a mulher (v.8).\n\n     c) Ele não se importou com os preconceitos raciais, sociais ou religiosos (v.9,10).         Leia\nEfésios 2.13-19.\n\n     d) Entrou logo no assunto da necessidade espiritual da mulher (v.7).\n\n     e) Não se afastou do assunto da salvação e nem se desviou do seu objetivo (v. 9-13).\n\n     f) Jesus fez a samaritana entender que era uma pecadora (v.16).\n\n     g) Não atacou seus defeitos nem a condenou (v.18).\n\n     h) Jesus mostrou compaixão e interesse na vida da mulher.\n\n      5. Ser cheio do Espírito Santo. A ordem de Jesus à igreja em Mateus 28.20, para pregar o\nevangelho, está intimamente ligada à afirmação anterior. \"... é me dado todo o poder no céu e na terra\n[v.18], e também na afirmação posterior. \"Eis que estou convosco todos os dias até a consumação dos\nséculos\" (v.20). Essa foi cumprida na pessoa do Espírito Santo. A presença de Jesus com os discípulos\nfoi trocada pela onipresença do Espírito Santo, que está em toda parte. Leia Lucas 24.49; e Atos 18.\n\n     O apostolo Pedro fraco e tímido antes do Pentecoste, tornou-se coluna após o revestimento de\npoder. É o Espírito Santo que capacita o cristão e dá direção para a obra de evangelização, para\nabrirmos as células nas casas das pessoas e as enviarmos para o Encontro com Deus.\n\n    DISCIPULADO\n\n     1. Como discípulo de Jesus e pregador do evangelho, você precisa estar convicto que fora do\nevangelho não há esperança, não há remédio nem solução para as almas, e os cristãos tem esse poder.\nDeixar de partilhá-lo é contribuir para que as almas se percam.\n\n     2. Para podermos evangelizar apaixonadamente, precisamos ter a capacidade de ver as multidões\ncomo que através dos olhos de Jesus – como ovelhas sem pastor, desgarradas, errantes e sofredoras. Se\nassim não for, nosso trabalho de evangelização se tornará frio, rotineiro e secularizado, pecando por\nexcesso de organização por um lado, e, por outro, pela falta de amor e unção do Espírito Santo.\n\n3. Se você não é um líder de célula ainda, comece nesta semana uma célula na casa de uma\npessoa que você ama e não quer ver nas garras do Diabo. Converse com seu líder de Geração.\n\n     4. Ore e Jejue por três pessoas durante este mês e procure abrir três células em suas casas. Após\nas células abertas marque o discipulado em outro dia que não seja o da célula. Após a quarta lição\nmarque o Encontro com Deus com ela.\n\nVERIFIQUE O QUE VOCÊ APRENDEU\n\n1. De acordo com o estudo desta lição, o que é evangelismo?\n\n______________________________________________________________________________\n\n2. Por que devemos evangelizar?\n\n______________________________________________________________________________\n\n3. O que a Bíblia recomenda a respeito do \"tempo\" de pregar a palavra?\n\n______________________________________________________________________________\n\n4. Qual o principal requisito necessário à evangelização destacado nesta lição?\n\n______________________________________________________________________________\n\n5. Quem é que dá direção e capacita o cristão para a obra de evangelização?\n\n______________________________________________________________________________\n\n                                                                                   Igreja de Vencedores\n          72", "quiz": [{"q": "Qual é o texto bíblico-base da lição \"O DISCIPULO E O EVANGELISMO\"?", "options": ["2 Coríntios 5.17", "Efésios 1.11", "Marcos 16.15", "Gálatas 5:1,4,5,13,14,16-25; Colossenses 3:5-10; II"], "answer": 2}, {"q": "Qual destes é um dos tópicos estudados na lição \"O DISCIPULO E O EVANGELISMO\"?", "options": ["Os Resultados Da Cura Interior", "Requisitos Necessários Para Evangelizar", "Inicie O Discipulado E Consolide O Discípulo", "Somos Conduzidos Ao Arrependimento (Pv 28:13)"], "answer": 1}, {"q": "Qual destes tópicos NÃO faz parte da lição \"O DISCIPULO E O EVANGELISMO\"?", "options": ["Requisitos Necessários Para Evangelizar", "A Essência Da Adoração É A Rendição", "Por Que E Quando Devemos Evangelizar", "Onde Devemos Evangelizar"], "answer": 1}]}, {"num": 14, "title": "O DISCIPULO E A COMUNIDADE", "verseRef": "2 Coríntios 5.17", "content": "TEXTO BÍBLICO\n\n      \"Assim que, se alguém está em Cristo, nova criatura é: as coisas velhas já passaram; eis que tudo\nse fez novo\" (2 Coríntios 5.17).\n\n     COMENTÁRIO\n\n     INTRODUÇÃO\n\n      A vida do cristão também se projeta na comunidade. É da própria natureza humana a necessidade\nde companheirismo, para a construção conjunta da sociedade em que vive. Vale lembrar o que Jesus\ndisse em sua oração sacerdotal: \"Não peço que os tires do mundo, mas que os livres do mal\" (João\n17.15). A conversão, portanto, não significa afastar-se fisicamente do mundo, mas exercer influência,\npara transformá-lo pela presença ativa dos salvos em toda parte.\n\nI. UMA NOVA VIDA ESPIRITUAL\n\n      1. Uma nova fé. É possível que você tenha tido antes uma vida religiosa. Sua atuação sempre foi\nmarcada pela fidelidade aos princípios religiosos até então adotados. Ou, quem sabe, mesmo sem ser\nreligioso, sempre teve um comportamento inquiridor, procurando descobrir o que está por trás da vida.\nOu talvez tenha sido daqueles que jamais se preocuparam com tais coisas, preferindo apenas os\nprazeres da vida material. Não importa. A verdade é que onde você esteve a comunidade sofreu os\nreflexos do seu comportamento.\n\n     Mas agora tudo mudou. Você experimenta a fé viva e verdadeira, plantada no seu coração pela\npalavra de Deus que o levou à salvação. Seria uma atitude de egoísmo, a partir de agora, se você\nresolvesse viver recluso, sem que as pessoas possam ficar sabendo acerca da transformação que Deus\noperou em sua vida. Este não é o propósito divino. Deus deseja \"que todos venham a arrepender-se\" (2\nPedro 3.9).\n\n      O apostolo Paulo passou por experiência semelhante. Veja o que ele relatou em Gálatas 1.14: \"E,\nna minha nação excedia em judaísmo a muitos da minha idade, sendo extremamente zeloso das\ntradições de meus pais\".\n\n     Paulo se considerava zeloso das tradições de seus pais, excedendo na prática a muitos de sua\nidade. Mas quando a sua vida foi transformada, ele prontamente mudou de rumo, tornando-se um ativo\npregador do evangelho. Agora leia em sua Bíblia o que ele escreveu mais adiante, nos versículos 15 e\n16.\n\n      Se você fizer um levantamento criterioso nas cartas de Paulo, vai descobrir quantas comunidades,\nnas regiões da Ásia e Europa, foram beneficiadas pela nova vida do apóstolo, que lhes pregava a fé no\n\nSenhor Jesus. Ainda hoje, e enquanto Jesus não voltar, seus ensinos repercutem em todo o mundo\nporque ele resolveu ser uma bênção para os outros.\n\n    Vivenciar a sua nova fé através das boas obras é outra atitude que de agora em diante deve\nmarcar a sua vida. Entenda bem esta verdade bíblica: você não pratica boas obras para ser salvo. Este\ncaminho jamais leva o homem a Deus. Leia Efésios 2.8,9.\n\n      Você aprendeu, através da leitura do texto citado, que a salvação \"é dom de Deus. Não vem das\nobras, para que ninguém se glorie\". Mas se você já é salvo pela obra redentora de Cristo no Calvário,\nisto deve resultar em boas obras. É por isto que está escrito: \"porque, assim como o corpo sem o\nespírito está morto, assim também a fé sem obras é morta\" (Tiago 2.26). Portanto, esta é outra maneira\nde você ajudar a sua comunidade, mostrando que a sua nova fé está aliada à prática.\n\n      2. Uma nova esperança. A fé resulta também em esperança, a âncora da nossa salvação. Vale\nsalientar que a esperança do cristão nunca morre, pois \"o choro pode durar uma noite, mas a alegria\nvem pela manhã\" (Salmo 30.5). Em outras palavras, esta esperança trás certeza, não só para a\neternidade, mas também para a vida eterna. O salvo é, portanto, um idealista que por força de sua fé\nenxerga acima das circunstâncias, para sempre viver em triunfo. E como tal, espelha o otimismo onde\nquer que chegue, contagiando os demais em busca da superação dos obstáculos aparentemente\nintransponíveis. Mas não termina aí. Quando se extingue a vida física, a nova esperança coloca-o no\nCéu, diante do trono de Deus, onde receberá os galardões pelos trabalhos aqui prestados, levando-se\nem conta as motivações de cada obra realizada. Leia 2 Coríntios 5.10.\n\nII. UMA NOVA VIDA MORAL\n\n      1. O conceito bíblico de moral. É bom ficar claro que o conceito bíblico de moral é absoluto.\nEsta é uma área que não pode ser relativizada, como querem alguns. Eles condenam com dureza\ndeterminado pecado, mas em relação a outros preferem o caminho da omissão. Normalmente, quando\neste assunto é abordado, a primeira coisa que vem à tona é que se trata apenas de sexo. Mas segundo os\npadrões bíblicos, isto implica também finanças, a palavra empenhada, a sinceridade no lidar com os\nsuperiores e imediatos, a retidão do cumprimento das normas, o não comprometimento com os valores\nmundanos e o apego à ética cristã à toda prova. É preciso que todas estas áreas sejam consideradas,\ninclusive a sexual, no que tange ao nosso comportamento perante a comunidade. Jesus disse: \"Se a\nvossa justiça não exceder a dos escribas e fariseus, de modo nenhum entrareis no reino dos céus\"\n(Mateus 5.20). Leia 1 Coríntios 11.1.\n\n     2. Como somos vistos pela comunidade? Vale apena parar um pouco para refletirmos. Como\nnosso comportamento está sendo refletido sobre a nossa comunidade? Como as pessoas que nos\ncercam estão julgando a nossa maneira de pensar e agir? O que elas pensam a cerca do uso que\nfazemos do dinheiro? Como elas encaram o nosso relacionamento com o sexo oposto? Será que nos\njulgam cumpridores das normas que regulam as relações sociais?\n\n     Você agora é uma nova pessoa e está iniciando uma nova vida. É provável que em alguns pontos\no seu passado não tenha sido promissor. Em outros, talvez tenha tido um comportamento considerado\nnormal para os padrões gerais. Só que hoje você está vivendo na dimensão do Espírito Santo, e isto\n\n                                                                                   Igreja de Vencedores\n\nsignifica produzir frutos sadios que testemunhem diante dos homens a boa qualidade espiritual da\nVideira Verdadeira.\n\nIII. UMA NOVA VIDA SOCIAL\n\n     1. Novas relações sociais. Este ponto tem maior implicação com a área do relacionamento. Antes\nde converte-se, é provável que você, sob a alegação de convívio social, tenha frequentado lugares\nimpróprios sem se dar conta do mal que isto representava. Mas seus olhos espirituais agora estão\nabertos para discernir quais são as boas amizades, que tipo de lugar pode ser frequentado sem colocar\nsua vida espiritual em risco, e afastar-se daquelas situações que vão levá-lo, sem dúvida, ao fracasso.\nNada melhor para este caso do que os conselhos do salmo primeiro. Abra sua Bíblia e leia-o agora\nmesmo.\n\n     Aí está, com toda a segurança, o referencial para você se orientar em suas novas relações sociais.\n\n     Exemplo:\n\n     \"Sua turma de faculdade está armando uma tremenda festa para comemorar o aniversário da\npessoa mais simpática da sala. Vai ter muita comida, música, bebida, namoros de ocasião e sabe lá\nDeus o que mais. Ninguém vai faltar e se você não for terá de passar a semana inteira explicando o\nmotivo.\n\n      \"Há duas opções: ir e se comportar como peixe fora d‘água, beber só refrigerante ou só água,\nficar a léguas da pista de dança, só conversar com colegas do mesmo sexo e nunca, jamais, prestar\natenção na musica que estar sendo tocada. Porém, é bom que se saiba: esta solução é inviável, pois não\ncondiz com o padrão de vida estabelecido pela Bíblia que, entre outras coisas, aconselha-nos a evitar a\naparência do mal.\n\n     \"A outra saída é recusar o convite, pois a tentação será grande, e é melhor ter problemas com os\ncolegas de classe do que com aquele que o criou e será eternamente seu mais verdadeiro amigo.\n\n      \"Caso você resolva contrariar seus princípios cristãos e opte pela primeira alternativa, é melhor\nir-se preparando, pois terá de repetir a dose em todas as outras festas. E isso não será legal! Ah! Não se\nesqueça também de pedir oração a sua tia, sua mãe, sua avó, ao dirigente, a geração, a célula e etc.\nvocê vai precisar. Se decidir, porém, encarar os amigos e recusar o convite, fique tranquilo, eles não\nvão mais contar com você para as outras festas e a sua aparente covardia foi na verdade uma grande\nprova de coragem e domínio próprio\".\n\n      A história que você acabou de ler é muito clara em seu significado. Mas, de qualquer maneira,\nfica a pergunta:\n\n     Você recusaria o convite e perderia a amizade dos amigos, ou aceitaria o convite e perderia a\namizade de Deus?\n\n     2. O outro lado da vida social. Para concluir, há o outro lado da vida social que não pode ser\ndeixado de lado. É aquele ensinado por Tiago que nos impõe o dever de ajudar socialmente os mais\n\ncarentes da comunidade. Repartir um pouco do nosso pão com os pobres é tarefa que devemos\ndesempenhar com amor, como resultado da salvação. Procure informa-se em sua congregação, pois\nnormalmente ela dispõe de um Ministério de Ação Social que ajuda aos menos favorecidos, no qual\nvocê pode envolver-se. Se você é empresário, lembre-se de ser justo nas relações trabalhistas com os\nseus funcionários, não defraudando os salários daqueles que trazem progresso à sua empresa. Leia\nTiago 5.4-6. Se você é empregado, buque dedicar-se como se estivesse fazendo para o Senhor, que\ncertamente vai recompensá-lo. Leia 1 Timóteo 6.1,2.\n\n    DISCIPULADO\n\n     1. Faça uma lista das coisas que você vinha praticando e que descobriu, com esta lição, não serem\ncompatíveis com o comportamento cristão. Depois disso, ponha-se diante de Deus em oração, peça-lhe\nperdão em nome de Jesus. Ele vai mudar estas áreas de sua vida.\n\n    2. Procure desenvolver novas amizades, principalmente entre os cristãos, e evite acompanhar os\namigos de outrora, que acabarão levando-o para o caminho do mal se você não estiver bem firmando\nem Cristo. Há locais que não devem ser frequentados, sob pena de você fracassar na fé.\n\n     3. Não queira viver uma vida reclusa, pois o homem, por natureza, busca o companheirismo. Seja\numa carta aberta e lida diante dos homens, sem que isso signifique envolvimento com os seus pecados,\npara que eles possam vir ao conhecimento de Cristo.\n\n     4. Procure se envolver em vários ministérios da sua congregação: Ação Social, Teatro, Louvor,\nJovens, Mulheres, Homens, Casais e etc.\n\nVERIFIQUE O QUE VOCÊ APRENDEU\n\n1. O que disse Jesus em sua oração sacerdotal?\n\n______________________________________________________________________________\n\n2. Qual o significado daquela parte da oração?\n\n______________________________________________________________________________\n\n3. Que tipo de experiência viveu Paulo, no contexto da lição?\n\n______________________________________________________________________________\n\n4. Segundo Efésios 2.8,9, por que a salvação é dom de Deus, e não das obras?\n\n______________________________________________________________________________\n\n5. O que acontece com o cristão que não anda segundo o conselho dos ímpios?\n\n                                                                                   Igreja de Vencedores\n         76", "quiz": [{"q": "Qual é o texto bíblico-base da lição \"O DISCIPULO E A COMUNIDADE\"?", "options": ["2 Timóteo 4.7", "Amós 4:12b ;João 4:1-42; Tiago 1:21-22", "Salmos 119.105", "2 Coríntios 5.17"], "answer": 3}, {"q": "Qual destes é um dos tópicos estudados na lição \"O DISCIPULO E A COMUNIDADE\"?", "options": ["Você Não É Um Acidente", "Procure Adquirir O Livro Casa Favorita – Tommy Tenney", "Uma Nova Vida Moral", "Renovação Comunitária"], "answer": 2}, {"q": "Qual destes tópicos NÃO faz parte da lição \"O DISCIPULO E A COMUNIDADE\"?", "options": ["Uma Nova Vida Espiritual", "Uma Nova Vida Moral", "Uma Nova Vida Social", "Contado Piadas Indecentes? (I Co 15:33; Pv 26:18-19)"], "answer": 3}]}, {"num": 15, "title": "O DISCIPULO E O LAR CRISTÃO", "verseRef": "Josué 24.15", "content": "TEXTO BÍBLICO\n\n      \"Porém, se vos parece mal aos vossos olhos servir ao Senhor, escolhei hoje a quem sirvais; se os\ndeuses a quem serviram vossos pais, que estavam dalém do rio, ou os deuses dos amorreus, em cuja\nterra habitais. Porém eu e a minha casa serviremos ao Senhor\" (Josué 24.15).\n\n     COMENTÁRIO\n\n     INTRODUÇÃO\n\n      A salvação que você recebeu, através de Jesus Cristo, resultará em grandes mudanças no seu\nmodo de vida. A partir daí, você começou uma nova caminhada, onde, segundo a Bíblia, \"tudo se fez\nnovo\". Isto inclui não só a vida pessoal, mas também a área do relacionamento. Esta \"nova vida\" toma\nforma na maneira como o cristão se comporta no meio em que vive. Em outras palavras, ele não vive\nmais por si mesmo, mas todas as suas ações são fruto desta comunhão intima com o Criador, como\ndisse o apostolo Paulo: \"... vivo não mais eu, mas Cristo vive em mim\" (Gálatas 2.20). O lar é o ponto\nde partida desta nova experiência. É ali, junto aos familiares, que você pode e deve começar a pôr em\nprática a sua nova vida em Cristo, como testemunho da transformação que o conduziu a esta nova\ndimensão espiritual.\n\nI. O QUE É O LAR\n\n     1. A família, a base do lar. O lar não é simplesmente uma casa, onde a família se reúne. É muito\nmais do que isto. É a dimensão física que traduz o propósito de Deus, ao instituir o casamento, através\nde nossos primeiros pais, Adão e Eva. (Leia Gênesis 2.18).\n\n      Jamais foi desejo de Deus que o homem vivesse uma vida solitária. Daí a decisão de fazer-lhe\numa companheira. A ideia aqui é basicamente de companheirismo, solidariedade, respeito mútuo e\nvida em comum. O lar é, portanto, a expressão maior da unidade familiar, onde estas qualidades podem\nser demonstradas na vida do casal e no seu relacionamento com os filhos.\n\n      2. O lar, a base da sociedade. Os lares formam a sociedade. Lares desagregados vão também\ncorresponder a uma sociedade desagregada. Esta é a razão pela qual satanás procura subverter os\nprincípios que regem o lar. Desta forma, ele sabe que pode destruir a sociedade. De que forma, ele faz\nisto? Disseminando a infidelidade conjugal, o desrespeito aos pais, a falta de dialogo no lar, o amor\nlivre entre os jovens e instituindo outros valores que ferem a Palavra de Deus. É por isso que Josué, o\nlíder que substituiu Moisés na liderança do povo de Israel, fez questão de confrontar seus liderados,\ndiante da pressão exercida por outros povos que praticavam a idolatria. Ele partiu da base, o lar, para o\ntodo: \"Eu e minha casa serviremos ao Senhor\" (Josué 24.15). Ou seja, se as demais famílias seguissem\na mesma trilha, o povo de Israel seria fortalecido e ficaria imune às pressões externas.\n\nDiante do que representa o lar para sociedade, você, como novo cristão, tem um importante papel\na desempenhar, para que todos possam ser beneficiados pela sua nova vida em Cristo. Jesus mesmo\ndisse: \"Vós sois a luz do mundo\" (Mateus 5.14). Luz, neste caso, significa que as trevas são afastadas,\ne que existe segurança para a caminhada, pois os perigos são expostos pela claridade. Esta luz é você,\nque precisa iluminar a partir do seu próprio lar.\n\nII. O LAR COMO EXTENSÃO DA IGREJA\n\n      1. O que significa o vocábulo igreja? A palavra \"igreja\" quer dizer \"uma reunião de pessoas\nchamadas para fora\". Ou seja, um grupo de pessoas que saíram de dentro do mundo (espiritual e não\nfisicamente) para juntos seguirem a Cristo. Neste sentido, todos os cristãos em qualquer parte do\nmundo formam a igreja. A palavra, igreja, pode também ser aplicada aos cristãos de um determinado\nlugar – isto é a \"igreja local\". Por consequência, a igreja é também formada pelos lares, assim como a\nsociedade. Portanto, quando você começou a frequentar a igreja na qual está servindo a Cristo, pôde\nobservar que ela é constituída de indivíduos que pertencem a famílias distintas que, juntas, adoram a\nDeus em espírito e em verdade.\n\n      2. O lar, extensão da igreja. Ora, diante da definição acima, é justo considerar que o lar é a\nextensão da igreja. Em outras palavras, isto quer dizer que o bom testemunho cristão deve começar a\nser vivido no lar. Não é possível ter um \"comportamento de cristão\" no templo, onde a igreja se reúne,\ne ter no lar um comportamento de incrédulo. As duas coisas não se combinam e significa que ainda não\nhouve, de fato, conversão a Cristo. Mesmo que todos à sua volta não tenham sido salvos, se você se\ncomportar como luz, no dizer do Mestre, as trevas não terão poder sobre sua vida. É uma questão de\nlógica: elas não podem sobrepor-se à luz. Então lembre-se: onde você estiver, aí está a igreja de Cristo,\ne isto incluí o lar. Faça dele o seu ponto de apoio para alcançar outros que ainda não conhecem a\nCristo. Você é um instrumento pelo qual a graça salvadora pode chegar aos seus parentes, vizinhos e\namigos. Se você ainda não tem comece ainda nesta semana uma Célula em sua casa e também o culto\nfamiliar (esposo, esposa e filhos).\n\nIII. A VIDA CRISTÃ NO LAR\n\n      1. O que é vida cristã. Definir vida cristã é simples. Agora vivê-la implica sério compromisso\nsom Cristo. Veja o que o Mestre disse em Mateus 16.24: \"Se alguém quiser vir após mim, renuncie-se\na si mesmo, tome sobre si a sua cruz e siga-me\". Isso significa que a vida cristã é o ato de seguir a\nCristo, renunciando os interesses próprios, para que a vontade dele prevaleça em todas as áreas que lhe\nsão submetidas a partir da conversão. Repetindo o texto bíblico que foi usado no primeiro ponto deste\ncomentário, é o ato de estar figuramente crucificado com Cristo, para que ele viva através de nós.\nAqueles que nos virem, portanto, observarão em nossa vida não a nós mesmos, mas as marcas do\ncaráter de Cristo.\n\n     É óbvio que, do ponto de vista de Deus, isto é um processo, no qual somos aperfeiçoados dia-a-\ndia. O profeta Oséias escreveu: \"Conheçamos, e prossigamos em conhecer ao Senhor\" (Oséias 6.3).\nQuando você é apresentado a uma pessoa pela primeira vez, jamais irá conhecê-la plenamente no\nprimeiro contato. Este conhecimento será progressivo, à medida que o tempo passa, e ainda assim\n\n                                                                                     Igreja de Vencedores\n\nmuitas coisas ficarão encobertas. Com a vida cristã, em certo sentido é a mesma coisa. O aprendizado é\ndiário, aos pés de Cristo, até que se alcance a maturidade espiritual. Paulo definiu este processo\ndizendo: \"Irmãos, quanto a mim, não julgo que o haja alcançado; mas uma coisa faço, e é que,\nesquecendo-me das coisas que atrás ficam e avançando para as que estão diante de mim, prossigo para\no alvo, pelo prêmio da soberana vocação de Deus em Cristo Jesus\" (Filipenses 3.13,14).\n\n     Esquecer as coisas que atrás ficam não significa permanecer parado remoendo as imperfeições.\nAo contrário, precisamos aprender com os erros do passado, para que eles não sejam repetidos.\nProsseguir para o alvo é entender que a vida cristã não é uma caminhada sem destino, mas há um norte\npara o qual todos os cristãos avançam: é o premio da soberana vocação em Cristo Jesus.\n\n     2. Como viver a vida cristã no lar. Como você já aprendeu, fica claro que, a partir da conversão,\nsua vida mudou. Agora, as suas motivações são outras. Isto vai refletir em seu comportamento no lar.\nTem que ser assim. Mas como viver esta nova vida no lar, principalmente, se os demais familiares não\nforem cristãos? Você não pode partir para o extremo e impor, pela força, a conversão de seus parentes.\nA Palavra de Deus diz: \"Não por força, nem por violência, mas pelo meu Espírito, diz o Senhor dos\nExércitos\" (Zacarias 4.6).\n\n      É o Espírito Santo que faz a obra, sem necessidade da força ou violência. Não é, também,\nrecomendável extrapolar os limites de sua liberdade e \"perturbar\" os demais familiares nos momentos\ninoportunos. Isto pode fechar as portas para o evangelho. Então, o que fazer? Seja prudente, sem que\nisto signifique falta de ação. Procure ser um observador atento das oportunidades e aproveite-as com\ncuidado, para mostrar o amor de Jesus. Procure deixar que o testemunho de suas próprias ações fale,\nsem palavras, pois soará mais alto do que qualquer outra coisa.\n\n     O culto Familiar: Pode ser uma vez por semana ou todos os dias, com a duração de uma hora\n(Pão diário, Presente diário ou outro devocional diário).\n\n      Se você é um pai ou mãe de família, pode lentamente introduzir o culto familiar, levando os\nfilhos a participarem com alegria da reunião. Levá-los à igreja depois será uma questão de tempo.\n\n      Se você é filho, aja do mesmo modo. Seja obediente aos pais, cumpra as suas obrigações filiais e\nmostre que a rebeldia é coisa do passado. Se você for induzido a alguma prática incompatível com a fé\ncristã, seja educado e responda, com mansidão, que você agora tem outro projeto de vida: o de servir a\nCristo de todo o coração.\n\n     Não se esqueça de quem você foi no passado e que agora você vai ter grande influência sobre\naqueles que o cercam.\n\n     Finalmente, você pode fazer o mais importante: estabeleça um programa pessoal e diário de\noração e leitura da Palavra de Deus (use o relógio da oração). Descubra um horário que lhe seja mais\noportuno, de modo que você possa ficar a sós no seu quarto. Leia a Bíblia, o verdadeiro alimento para a\nsua alma, e ore para que o seu testemunho, como cristão, seja um poder de atração para levar os seus\nfamiliares aos pés de Cristo.\n\nDISCIPULADO\n\n      1. Você deseja que seus familiares experimentem a mesma bênção que agora desfruta. Convide-\nos, portanto, a participar de sua célula, de sua geração e de um culto na igreja onde você congrega. Este\npoderá ser o ponto de partida para que eles cheguem ao conhecimento de Cristo.\n\n    2. Se possível, convide seu líder de célula e geração para visitar os seus familiares. Mas faça-o de\nmodo que a visita seja recebida sem formalidades.\n\n     3. Se os seus familiares gostam de ler, presenteie-os com o discipulado e uma bíblia.\n\n     4. Fale para seus familiares sobre Encontro com Deus.\n\nVERIFIQUE O QUE VOCÊ APRENDEU\n\n1. Quem disse: \"vivo, não mais eu, mas Cristo vive em mim\"?\n\n______________________________________________________________________________\n\n2. Por que Deus criou a companheira para o homem?\n\n______________________________________________________________________________\n\n3. Por que o lar é a expressão maior da unidade familiar?\n\n______________________________________________________________________________\n\n4. O que significa a expressão: \"Vós sois a luz do mundo\"?\n\n______________________________________________________________________________\n\n5. Por que o lar é a extensão da igreja?\n\n______________________________________________________________________________\n\n                                                                                     Igreja de Vencedores\n          80", "quiz": [{"q": "Qual é o texto bíblico-base da lição \"O DISCIPULO E O LAR CRISTÃO\"?", "options": ["Atos 2.41", "Josué 24.15", "Salmo 139.2", "Gênesis 17:2; Isaías 60:22; Marcos 16:15"], "answer": 1}, {"q": "Qual destes é um dos tópicos estudados na lição \"O DISCIPULO E O LAR CRISTÃO\"?", "options": ["O Lar Como Extensão Da Igreja", "Utilize Músicas Que Enfatizem A Presença E O Batismo No Espírito Santo", "A Bíblia Em Suas Mãos", "Renovação De Propósitos"], "answer": 0}, {"q": "Qual destes tópicos NÃO faz parte da lição \"O DISCIPULO E O LAR CRISTÃO\"?", "options": ["Maria Não É A Mãe De Deus", "A Vida Cristã No Lar", "O Lar Como Extensão Da Igreja", "O Que É O Lar"], "answer": 0}]}, {"num": 16, "title": "O DISCIPULO E A MORDOMIA CRISTÃ", "verseRef": "Lucas 12.43,44", "content": "TEXTO BÍBLICO\n\n     \"Bem-aventurado aquele servo a quem o Senhor, quando vier, achar fazendo assim. Em verdade\nvos digo que sobre todos os bens o porá\" (Lucas 12.43,44).\n\n     COMENTÁRIO\n\n     INTRODUÇÃO\n\n      Hoje você vai estudar sobre a mordomia cristã. Esta é uma área que precisa ser considerada com\nespecial atenção, pois dela dependerá, basicamente, o êxito da vida cristã. Isto porque tudo quanto se\nrelaciona ao nosso dia-a-dia, como cristãos, é conseqüência direta do modo como encaramos e vivemos\no nosso papel como mordomos de Deus. A Bíblia é clara quando estabelece as regras de uma boa\nmordomia, não deixando qualquer hipótese para que esqueçamos a nossa responsabilidade, sem que\nisto traga prejuízos à nossa vida espiritual. Por conseguinte, vale apena exercitar este mandado com\ndedicação, pois o próprio Senhor deixou esta promessa: \"Sobre o pouco foste fiel, sobre o muito te\ncolocarei\" (Mateus 25.21).\n\nI. O QUE É MORDOMO?\n\n     1. Um administrador dos bens alheios. A palavra mordomo significa \"aquele que administra os\nbens de outro\". É alguém colocado com a responsabilidade de administrar uma propriedade (uma\nmansão, por exemplo).\n\n     Ele normalmente responde pelas seguintes áreas: finanças, compras, serviços, empregados,\nmanutenção e alimentação. O bom mordomo desfruta da confiança do patrão e, mesmo na sua\nausência, cumpre com fidelidade as tarefas que lhe são confiadas. Com efeito, fidelidade é a palavra\nchave nas relações entre o mordomo e o patrão.\n\n      2. Um administrador de Deus na terra. O Senhor Jesus deu bastante ênfase ao papel do\nmordomo, usando figuradamente algumas vezes, para explicar nosso papel como administradores de\nDeus aqui na terra. Tudo quanto dispomos a Ele pertence. Porém, tal qual o proprietário terreno\ndelegou estes bens sob nossa administração para, de igual forma, exigir em tempo oportuno a prestação\nde contas do que fizemos. Daí o texto bíblico básico desta lição, que admoesta: \"Bem-aventurado\naquele servo a quem o Senhor, quando vier, achar fazendo assim\" significa exatamente está cumprindo\nas determinações que foram anteriormente confiadas. Isto quer dizer que o Senhor Jesus voltará, um\ndia, para cobrar de cada um o cumprimento da boa mordomia. Ele não deixará passar em branco\nnenhuma omissão de nossa parte.\n\nII. AS TRÊS ÁREAS BÁSICAS DA MORDOMIA CRISTÃ\n\n     1. A mordomia dos talentos. Talento era uma unidade de moeda muito usada nos tempos de\nCristo. Ele mesmo contou uma parábola, na qual usou o talento como ilustração para ensinar sobre\ncomo investir nossos recursos na obra de Deus. Leia Mateus 25.14-29. A determinação do proprietário\nexigia-lhes investir aqueles bens para que eles se multiplicassem. Os dois primeiros foram bons\nadministradores. Eles dobraram o investimento inicial. O ultimo, porém, apenas guardou o que\nrecebeu, sem apresentar qualquer resultado. Imagine se isto ocorresse numa época de inflação alta. O\ndinheiro recebido já não teria mais nenhum valor. Qual foi a conseqüência disso? Leia o versículo 29.\n\n      Com o tempo, a palavra talento passou a significar os nossos dons pessoais, de modo que quando\nalguém se destaca numa determinada tarefa, ele é chamado de talentoso. Portanto, a mordomia dos\ntalentos, em seu sentido atual, significa empregar os nossos dons pessoais no serviço do Mestre. É\nimportante frisar, inclusive, que esta é a visão dos ensinos de Paulo acerca dos ministérios. Leia\nEfésios 4.11.\n\n      Os dons ministeriais não podem ser confundidos com os dons pessoais. Aqueles foram dados por\nCristo à igreja. Estes são desenvolvidos de maneira natural pelo individuo. No entanto, Paulo disse no\nversículo 12 que os dons ministeriais visam aperfeiçoar os santos e equipá-los para o serviço cristão.\nEm outras palavras, isto significa que os ministros, os quais exercem estes dons, na igreja, têm o dever\nde levar cada cristão em particular a desenvolver-se de corpo e alma na obra de Deus, cantando,\norando, visitando, liderando célula, liderando geração, enviando pessoas para o Encontro com Deus,\npraticando as boas obras e empregando os seus talentos pessoais para o engrandecimento do Reino.\n\n     2. A mordomia do tempo. Antes de seguir adiante, leia Efésios 5.16. O seu tempo agora deve ser\nadministrado de acordo com o propósito de Deus. A palavra \"remir\", descoberta no texto que você\nacabou de ler, quer dizer exatamente isso. Ou seja, os minutos não podem ser desperdiçados com\ncoisas vãs, que não trarão qualquer resultado para sua vida, principalmente de ordem espiritual. O\nsalmista definiu esta questão como \"contar os dias de tal maneira\" (Salmo 90.12). Isso significa dar\nvalor a cada dia vivido, de modo que você nunca venha a ter o senso de perda, como ocorreu com\nJeremias em relação ao povo de Israel. Ele disse: \"Passou a sega, findou o verão, e nós não estamos\nsalvos\" (Jeremias 8.20).\n\n      Costuma-se dizer que às 24 horas do dia devem ser divididas da seguinte maneira: oito horas para\no trabalho, oito para o descanso e oito para o Reino de Deus. No entanto, pelo padrão bíblico, esta\nproposta incorre em erro, porque só submete ao Senhor apenas uma parte do tempo. Deus exerce o\nsenhorio sobre nossas vidas, sendo nós apenas os seus mordomos, nossas atividades em qualquer área\ndevem ser exercidas segundo a perspectiva divina, seja no trabalho, lazer, descanso ou na vida\neclesiástica. Todo o tempo pertence ao Senhor e deve ser bem administrado.\n\n     3. A mordomia das finanças. Falamos anteriormente sobre a parábola dos talentos, para\nexemplificar o emprego dos nossos dons pessoais no Reino de Deus. No entanto, como o texto usa um\nelemento de valor monetário, podemos utilizá-lo também como ponto de partida para a mordomia das\n\n                                                                                    Igreja de Vencedores\n\nfinanças. Nossos recursos financeiros devem ser administrados sob a perspectiva de que eles também\npertencem ao Senhor. (Leia Mateus 6.33). Isto significa que nossa vida como cristãos deve ter como\npropósito buscar o Reino de Deus e partilhar os seus valores, onde quer que estejamos: no trabalho, na\nfaculdade, no ônibus, em casa, no templo e em nossas relações pessoais. Como resultado, \"todas estas\ncoisas (recursos, por exemplo) nos serão acrescentadas\". Portanto, tudo quanto ganharmos vem do\nSenhor para ser reaplicado na sua obra e na nossa subsistência pessoal, para que invistamos em seu\nReino de modo que todas estas coisas nos sejam acrescentadas, e assim por diante. A partir da\nperspectiva do Reino, você evitará aplicar o seu dinheiro em coisas supérfluas, poderá aplicar sobre o\nque lhe é útil, bem como a sua família, e tudo quanto fizer glorificará com certeza o nome do Senhor.\nLeia atentamente Isaías 55.2.\n\n      A visão do Reino far-lhe-á também contribuir com voluntariedade para a obra de Deus. Os\ncristãos de Filipos souberam agir desta forma, não deixando que o apóstolo Paulo passasse por sérias\nprivações. Eles sempre lhe providenciavam recursos para a sobrevivência.                       Leia\nFilipenses 4.15,16.\n\n      Dar o dízimo é outra parte da mordomia das finanças, pois tudo é de Deus. Dízimo é a décima\nparte dos rendimentos e deve ser entregue à casa do Senhor, para a aplicação na sua obra, conforme\nMalaquias 3.8-10. O dizimo deve ser proporcional aos ganhos está embutida nos textos de 1 Coríntios\n16.2 e 2 Coríntios 8.12, que realçam as expressões \"conforme a prosperidade\" e \"segundo o que\nqualquer um tem\". A doutrina do dízimo também está registrada em Hebreus, onde diz que Jesus é\nsacerdote segundo a ordem de Melquisedeque (Hebreus 7.17), a quem Abraão pagou o dízimo de tudo\n(Gênesis 14.20). Se assim é, devemos também, por fé, cumprir este mandamento.\n\nIII. PRESTANDO CONTA DE UMA BOA MORDOMIA\n\n     Onde o cristão deve praticar a mordomia cristã? Veja o que diz o texto bíblico: \"Tudo que você é\ne tem não lhe pertence\" (Leia Salmo 24.1). Você não tem mais o direito de fazer o que quer com o que\ntem. Deus agora está em primeiro lugar e agora você é um mordomo dele. Isso inclui sua vida, seu\ntempo, seus talentos, suas finanças e bens.\n\n     Você deve aplicar na igreja a sua vida com o melhor dos seus esforços e dedicação; deve passar\nboa parte do seu tempo cultuando a Deus e servindo a Ele na célula, geração e ministério; deve\nempregara todos os talentos na igreja, para torná-la forte e vibrante; deve pagar os dízimos, para que\nvocê seja abençoado e a igreja tenha recursos suficientes, e deve dedicar os seus bens a Deus, sabendo\nque vai prestar contas a Ele sobre como foram adquiridos e aplicados.\n\n      Naquele dia, perante o tribunal de Cristo, que resposta iremos ouvir dos lábios do Senhor? Bom\nseria que fosse: \"Sobre o pouco foste fiel, sobre o muito te colocarei; entra no gozo do teu Senhor\"\n(Mateus 25.21).\n\nDISCIPULADO\n\n    1. Se você ainda não experimentou contribuir para a obra de Deus, comece ainda hoje. Faça\ntambém o propósito de, a partir deste mês, separar o dízimo para o trabalho do Senhor.\n\n      2. A Bíblia diz que existe um demônio chamado devorador (Ml 3.8-10) e ele só é repreendido\nmediante o ato de entregar o Dizimo na casa de Deus, portanto não adianta orar para que o devorador\nsaia da vida da pessoa, mas sim entregar o que é de Deus.\n\n      3. Procure também, a partir de hoje, administrar o seu tempo segundo a perspectiva do Reino de\nDeus. Onde quer que esteja, saiba que você é um instrumento, para que o Reino de Deus cresça. E não\nse esqueça de compartilhar com os outros a sua experiência com Cristo.\n\n     4. Deus lhe deu talentos, para que eles sejam bem utilizados no seu Reino. Coloque-se à\ndisposição da igreja, para o que for útil.\n\n      5. Procure o líder de Célula, o líder de geração e até mesmo o coordenador de base e diga-lhes do\nseu desejo em empregar o melhor dos seus esforços no Reino de Deus. Eles, por certo, lhe ajudarão a\ndar estes primeiros passos, introduzindo-o paulatinamente nas atividades da igreja.\n\n     6. Lembre-se tudo o que você tem não é de você mesmo seu carro, sua casa, sua finança, seu\ncorpo..., tudo pertence a Deus.\n\nVERIFIQUE O QUE VOCÊ APRENDEU\n\n1. Quem disse \"sobre o pouco foste fiel, sobre o muito te colocarei\"?\n\n______________________________________________________________________________\n\n2. O que faz o mordomo, na vida comum?\n\n______________________________________________________________________________\n\n3. Cite a palavra chave nas relações entre o mordomo e o patrão?\n\n______________________________________________________________________________\n\n4. O que significa a expressão \"achar fazendo assim\"?\n\n______________________________________________________________________________\n\n                                                                                    Igreja de Vencedores\n         84", "quiz": [{"q": "Qual é o texto bíblico-base da lição \"O DISCIPULO E A MORDOMIA CRISTÃ\"?", "options": ["Mateus 6:9-15; Lucas 11:1-4; II Crônicas 7:14", "Lucas 12.43,44", "Malaquias 3. 8 - 12", "Atos 1.8"], "answer": 1}, {"q": "Qual destes é um dos tópicos estudados na lição \"O DISCIPULO E A MORDOMIA CRISTÃ\"?", "options": ["Prestando Conta De Uma Boa Mordomia", "Defina Líder De Célula", "Vitórias Através Da Oração", "Cristo, Em Toda A Bíblia, É A Pedra-Rocha Grande E Firme:"], "answer": 0}, {"q": "Qual destes tópicos NÃO faz parte da lição \"O DISCIPULO E A MORDOMIA CRISTÃ\"?", "options": ["Você Não É Um Acidente", "As Três Áreas Básicas Da Mordomia Cristã", "Prestando Conta De Uma Boa Mordomia", "O Que É Mordomo?"], "answer": 0}]}, {"num": 17, "title": "O DISCIPULO E AS ORDENANÇAS", "verseRef": "Atos 2.41", "content": "1. O BATISMO NAS ÁGUAS\n\n     TEXTO BÍBLICO\n\n     \"De sorte que foram batizados os que de bom grado receberam a sua palavra; e, naquele dia,\nagregaram-se quase três mil almas\" (Atos 2.41).\n\n     INTRODUÇÃO\n\n      Apesar de tudo que você aprendeu até aqui, é provável que ainda tenha dúvidas em relação à\nnecessidade e a importância do batismo na experiência cristã. Talvez ainda esteja questionando: Que\nmérito tem esse ritual para a minha vida com Deus? Qual o significado desse ato? Por que devo me\nbatizar? O batismo é obrigatório ou opcional?\n\nI. A IMPORTÂNCIA DO BATISMO\n\n      O batismo é um assunto de bastante importância tanto para a igreja como para você. Como\nsempre aconteceu, ainda hoje é pelo batismo que o novo cristão, reconhece publicamente que ele\naceitou Jesus como Senhor e Salvador.\n\nII. O SIGNIFICADO DO BATISMO\n\n     1. Definição. Batismo significa \"mergulho\", \"submersão\". É a primeira ordenança de Cristo,\natravés da qual o cristão passa a fazer sua declaração de fé publica.\n\n     2. Conceito. O batismo ilustra a experiência da regeneração efetuada pelo Espírito Santo no\npecador, experiência esta que se relaciona com a morte e a ressurreição de Jesus Cristo. Significa que\nquando o pecador aceita a Cristo como único e suficiente salvador passa por uma transformação tão\nradical, que só pode ser explicada como sendo morte e sepultamento do velho ser e ressurreição de\numa nova criatura para viver uma nova vida com Deus. Em outras palavras, quando o pecador aceita a\nmorte de Jesus como morte vicária, isto é, para substituí-lo diante da justiça de Deus, morre também\ncom ele. Mas assim como Jesus não ficou na sepultura, antes ressuscitou, o que crê nele ressuscitou\ncom Ele, para viver eternamente. Desse modo, o batismo simboliza a morte para o mundo e a\nressurreição para uma nova vida de fé em Cristo Jesus.\n\n      É evidente que essa regeneração para uma nova vida de fé não se dá no momento em que a\npessoa se batiza, mas sim no momento em que a pessoa se submete a Cristo pela fé. O batismo\nsimboliza simplesmente uma realidade já alcançada pelo pecador no momento que ele fez a oração de\naceitação.\n\nIII. A NECESSIDADE DO BATISMO\n\n      1. É necessário porque Cristo o ordenou. O batismo nas águas não é uma opção para o cristão;\né um mandamento do Senhor: \"Portanto, ide, ensinai todas as nações, batizando-as em nome do Pai, e\ndo Filho, e do Espírito Santo\" (Mateus 28.19). Todo cristão fiel e que de fato ama ao Senhor Jesus\nsentirá prazer em cumprir esse mandamento. A admissão no Reino de Deus se dá através da fé no\nsacrifício de Cristo associada ao verdadeiro arrependimento. Todavia, é o ato do batismo que\npossibilita a aceitação publica.\n\n       2. É necessário porque Cristo deu o exemplo. \"Então veio Jesus da Galiléia ter com João, junto\ndo Jordão, para ser batizado por ele. Mas João opunha-se-lhe, dizendo: Eu careço de ser batizado por\nti, e vens tu a mim? Jesus, porém, respondendo, disse-lhe: Deixa por agora, porque assim nos convém\ncumprir toda a justiça. Então, ele o permitiu. E, sendo Jesus batizado, saiu logo da água, e eis que se\nlhe abriram os céus, e viu o Espírito Santo de Deus descendo como pomba e vindo sobre ele. E eis que\numa voz dos céus dizia: Este é o meu filho amado, em quem me comprazo\" (Mateus 3.13-17).\n\n     Era da vontade de Deus que se batizassem todos os que aceitassem o seu Reino, de que João\nBatista era o precursor: Por isso Jesus, que veio para instruí-lo, deu o exemplo, batizando-se também.\nAlém disso, no batismo Jesus estava se identificando com a raça de que veio ser representante para\nsalvá-la. Se o próprio Jesus foi batizado, não há como se entender que um cristão não o queira. A\nnecessidade é evidente.\n\n      3. É necessário porque os cristãos do inicio da igreja nos deixaram o exemplo. Após terem\nsido cheio do Espírito Santo e ouvirem o inflamado sermão do apostolo Pedro, os primeiros cristãos de\nJerusalém não hesitaram diante da oportunidade de serem batizados: \"De sorte que foram batizados os\nque receberam a sua palavra; e naquele dia agregaram-se quase três mil almas\" (Atos 2.41).\n\nIV. O METODO BÍBLICO DO BATISMO\n\n      Água respingada sobre a cabeça, óleo na fronte e tantas outras invencionices que vemos por aí,\nnão passam de criação do homem não respaldadas e nem ensinadas pela Palavra de Deus. Por essa\nrazão, orientamos os cristãos a se submeterem unicamente ao batismo bíblico, que é imersão total, ou\nseja, mergulhar o corpo totalmente dentro da água (piscina, rio ou mar).\n\n     Existem basicamente quatro evidencias de que a forma bíblica do batismo é a imersão total: a\nevidencia do texto bíblico; a evidencia do significado da palavra batismo; a evidencia da história e a\nevidencia do simbolismo do batismo.\n\n      1. Evidencia do texto bíblico. Os textos que narram o batismo de Jesus dizem: \"E logo, quando\nsaía da água...\" (Marcos 1.10). \"Batizado que foi Jesus, saiu logo da água\" (Mateus 3.16). O texto que\nnarra o batismo do eunuco realizado por Felipe declara: \"E mandou parar o carro, e desceram ambos à\nágua, tanto Felipe como o eunuco, e o batizou. E quando saíram da água...\" (Atos 8.38,39).\n\n                                                                                    Igreja de Vencedores\n\n      Esses textos não deixam dúvida. É improvável que, vezes seguidas, os ministrantes dos batismos\ntivessem que entrar na água com os que eram batizados, se fosse aspersão de água. Aliás, a ser assim\nnem mesmo o candidato precisaria entrar na água. Você concorda?\n\n     2. Evidencia do significado da palavra. Como afirmamos acima, a palavra vem do grego\nbaptizo, que significa imergir completamente. Se a própria palavra traz esse sentido, é claro que todas\nas demais formas de batismo não passam de ensinamentos insignificantes e sem apoio nas Escrituras\nSagradas.\n\n     3. Evidencia da história. Os livros de História Eclesiástica ensinam que até o ano de 150 d.C.\naproximadamente, só era praticada a imersão como forma de batismo.\n\n     4. Evidencia do simbolismo do batismo. Desde que o batismo simboliza a morte, o\nsepultamento e a ressurreição, como já assinalamos anteriormente, a sua forma de administração não\npode ser outra, a não ser a imersão total.\n\n2. A SANTA CEIA\n\n \"Porque, todas as vezes que comerdes este pão e beberdes o cálice, anunciais a morte do Senhor, até\nque Ele venha.\" (1 Coríntios 11.26).\n\n      A ceia do Senhor foi instruída por Jesus na noite de quinta-feira de Páscoa, quando foi preso no\nGetsêmani. Primeiro, ele participou da ceia pascal com os discípulos e depois instituiu a sua própria\nceia que haveria de comemorar sua morte pelos pecadores.\n\nI. SIGINIFICADO E FINALIDADE DA SANTA CEIA\n\n      1. Em que base foi instituída a Santa Ceia? A Santa Ceia, instituída por Jesus, está baseada na\nceia pascal dos judeus, que apontava para o passado e ao mesmo tempo para o futuro. Em relação ao\npassado, servia para comemorar a saída do Egito, onde o povo de Israel esteve em cativeiro durante\nmais de quatrocentos anos. E ao futuro, prefigurava o sacrifício do Messias.\n\n      O cordeiro pascal apontava para Jesus. Ele seria sacrificado como o \"cordeiro de Deus que tira o\npecado do mundo\" (João 1.29). Através da morte de Cristo, uma nova aliança entre Deus e seu povo\nseria estabelecida, onde os laços de sangue seriam substituídos por laços de fé.\n\n      Na antiga aliança o povo de Deus era constituído pelos descendentes de Abraão; na nova, é\nconstituído por todos aqueles que recebem Jesus como Salvador e Senhor (João 1.11,12; Gálatas 3.7-\n9). Portanto, foi necessário substituir a páscoa por uma celebração que representasse a nova aliança. A\nSanta Ceia.\n\n     2. Qual o significado da Santa Ceia? É cerimônia mais solene da igreja. A Santa Ceia simboliza\na morte do Senhor em nosso lugar, na qualidade de Cordeiro Pascal, sacrificado para livrar-nos do\npecado e da morte. Ela simboliza a libertação de todos os pecadores das garras de satanás e da morte.\n\nAssim como o sangue do cordeiro livrou os primogênitos dos israelitas da morte, o sangue de Jesus,\nnosso Cordeiro Pascal (1 Coríntios 5.7), nos livra da more eterna, da condenação ao inferno.\n\n     3. Para quem foi constituída? A Ceia foi constituída para ser celebrada por todas as pessoas\nsalvas por Jesus e que já tomaram uma decisão com Cristo.\n\n     4. Qual a finalidade da Santa Ceia? A ceia do Senhor é uma cerimônia memorial, isto é, que\nserve de lembrança.\n\n      a) Faz-nos lembrar da Pessoa e obra de Jesus Cristo. Pela sua comemoração os cristãos\nrelembram que Jesus morreu pelos seus pecados, e também que ele voltará ao mundo para estabelecer\no juízo final e o seu Reino glorioso. Durante a Ceia o Espírito Santo atua nos cristãos, esclarecendo-os\na realidade do sofrimento, morte, ressurreição e ascensão de Jesus Cristo.\n\n      b) Une os cristãos em amor pela comunhão com Jesus. Veja o que escreveu o apostolo João: \"Se\nandarmos na luz, como ele na luz está, temos comunhão uns com os outros, e o sangue de Jesus, nos\npurifica de todo pecado\" (1 João 1.7).\n\nIII. ELEMENTOS QUE CONSTITUIEM A CEIA\n\n     Os elementos da Santa Ceia são dois: pão e vinho. O pão simboliza o corpo de Cristo, que pelos\npecadores foi dado na cruz do Calvário. O vinho simboliza o sangue de Jesus derramado para remissão\ndos pecados da humanidade.\n\n     Agora vamos nos deter um pouco no significado de cada elemento da Santa Ceia.\n\n     1. O significado do pão. Na ceia da Páscoa, que Jesus celebrou com seus discípulos na véspera\nda sua crucificação, Ele tomou um pedaço de pão, deu graças, partiu-o e o distribuiu a todos dizendo:\n\"Fazei isso em memória de mim\" (Lucas 22.19).\n\n      Anteriormente, Jesus havia falado de si mesmo como sendo \"o pão do céu\" e o pão da vida. Ele\nfoi o pão divino, dado aos homens por Deus; vindo do céu, sacrificou-se para alimentar com sua vida o\nmundo inteiro. Veja o que Ele disse: \"Eu sou o pão da vida. Vossos pais comeram o maná no deserto, e\nmorreram. Este é o pão que desceu do céu, para que o que dele comer não morra. Eu sou o pão vivo\nque desceu do céu; se alguém comer deste pão, viverá para sempre; e o pão que eu der é a minha carne,\nque eu darei pela vida do mundo\" (João 6.48-51).\n\n      Ao receber o pão na Santa Ceia, recebemos pela fé a vida de Jesus. Da mesma forma que o pão\nfortalece nosso corpo físico, a vida de Jesus nos dá força e energia espiritual.\n\n      2. O significado do cálice. Após a ceia da Páscoa, com seus discípulos, Jesus tomou o cálice e\ndisse: \"Este cálice é a nova aliança no meu sangue; fazei isto, todas as vezes que o beberdes, em\nmemória de mim\" (1 Coríntios 11.25). O cálice e o fruto da vide representam o sangue derramado de\nJesus; significa também a nova aliança, selada com este sangue vertido: \"Este é o cálice da nova\n\n                                                                                    Igreja de Vencedores\n\naliança no meu sangue derramado em favor de vós\" (Lucas 22.20). Trata-se do pacto predito pelo\nprofeta Jeremias no capitulo 31.31-34.\n\n      Jesus foi ao monte das Oliveiras; ali, num jardim de nome Getsêmani, ajoelhou-se para orar:\n\"Pai\", disse Jesus, \"se queres, passa de mim este cálice; contudo não se faça a minha vontade, e sim a\ntua\" (Lucas 22.42). O temido \"cálice\" representa os pecados do mundo, que Ele iria levara. Tal peso ia\nser muito mais terrível que a dor física que Ele sofreria. Sua angustia foi tal que Ele suou grandes gotas\nde sangue naquela noite.\n\n     É importante lembrar que os elementos da Santa Ceia não passam por nenhuma transformação,\nque permanecem inalteráveis em sua natureza; o pão continua a ser pão e o vinho continua a ser vinho.\nA Santa Ceia é feita simplesmente para lembrança da morte de Cristo. A bênção da sua comemoração\nconsiste somente em reavivar na mente dos participantes a obra de amor de Cristo Jesus, dando-lhes\noportunidade de examinarem a consciência e de renovarem os seus propósitos para com Deus.\n\nIII. COMO O CRISTÃO DEVE PARTICIPAR DA SANTA CEIA\n\n     O apostolo Paulo revelou na passagem mencionada que os coríntios não estavam celebrando\ncorretamente a Santa Ceia. Não a entendiam, e faziam dela um banquete em que uns comiam muito e\noutros nada tinham. Por isso Paulo lhes escreveu, orientando-os, para que entendessem a finalidade da\nSanta Ceia e a maneira adequada de sua celebração. De seus ensinos aos coríntios é conveniente\ndestacar:\n\n      1. Com discernimento. É preciso que o cristão participe da Santa Ceia com discernimento. Isto\né, entendendo o que ela significa e o seu objetivo. Caso contrário, a transformará numa rotina fria e\nsem sentido.\n\n      2. Com exame de consciência. É preciso que o cristão se examine antes de participar da Santa\nCeia. Isso não quer dizer que deixe de participar, em certas circunstâncias, e sim que se corrija, se\nestiver em falta, e com novo propósito participe da ordenança.\n\n      3. Com reverência. É preciso que o cristão participe da Santa Ceia reverente e solenemente em\nvirtude do que ela representa, a morte de Jesus.\n\n     Quem não está preparado para participar da Santa Ceia, não está preparado para ser arrebatado.\nSe uma pessoa aceita Jesus hoje como seu único e suficiente Salvador ela está preparada para participar\nda Santa Ceia.\n\n      Existem igrejas que tem em suas doutrinas, que o candidato a participar da Santa Ceia deve ser\nbatizado nas águas, porém não há referencias bíblicas que afirmem tal doutrina.\n\nDISCIPULADO\n\n     1.Você aprendeu nesta lição o significado das ordenanças. Batismo nas Águas e a Santa Ceia.\n\n     2. Batismo nas Águas:\n\n    3. Infelizmente, já existem no mundo algumas igrejas que negam a importância do batismo em\nnome do Pai, do Filho e do Espírito Santo. Não deem ouvidos a tais pessoas, pois elas estão\ncompletamente distanciadas dos sagrados princípios bíblicos.\n\n      4. Na \"Grande Comissão\" registrada em Mateus 28.19,20, Jesus nos mandou fazer discípulos,\nbatizando-os e ensinando-lhes todas as coisas. É importante notar que todo o texto desta referência tem\nforça de mandamento. O Novo Testamento, e especialmente o livro de Atos, nos mostra que os\ndiscípulos aceitaram as palavras de Jesus como mandamento. Eles reconheceram a importância de\nfazer discípulos, batizar e ensinar.\n\n     5. É verdade que o batismo não salva, mas é necessário que você seja batizado conforme\nclaramente ensina a Palavra de Deus.\n\n     6. O batismo nas águas é uma demonstração publica de que você morreu para o mundo           (o\nvelho homem) e está assumindo uma nova vida em Cristo: \"Já estou crucificado com Cristo; e vivo não\nmais eu, mas Cristo vive em mim\" (Gálatas 2.20).\n\n     Santa Ceia:\n\n     7. A Santa Ceia simboliza o sofrimento e a morte de Jesus. Não basta, porém, ficarmos\ncomovidos com isso. Devemos pensar profundamente e aceitar a vitória ganha por Ele através da sua\nobra completa. A morte de Cristo não ocorreu em vão; Jesus assim cumpriu a incumbência recebida do\nseu Pai, e ganhou para si um povo santo.\n\n     8. A Santa Ceia é um ato comemorativo, não um ato sacrificial. Ela nos faz lembrar que Cristo\n\"se manifestou uma vez por todas, para aniquilar pelo sacrifício de si mesmo o pecado\"   (Hebreus\n9.26).\n\n      9. A Santa Ceia não é um altar, sobre o qual Jesus Cristo se sacrifica repetidas vezes.\nParticipamos da Santa Ceia, dando graças pela morte sacrificial de Jesus já realizada em nosso favor.\nDesta forma, continuaremos proclamando a morte dEle até que ele venha de novo para nos buscar\n(1Coríntios 11.26).\n\n     10. Procure adquirir o livro 21 Minutos de Poder na Vida de Um Líder – Jonh Maxwell\n\n                                                                                    Igreja de Vencedores\n\nVERIFIQUE O QUE VOCÊ APRENDEU\n\n1. Qual é a definição de batismo, o que significa?\n\n______________________________________________________________________________\n\n2. O que simboliza o batismo?\n\n______________________________________________________________________________\n\n3. Quais as evidências de que a forma bíblica do batismo é a imersão total?\n\n______________________________________________________________________________\n\n4. Quais são os elementos usados para celebrar a Santa Ceia?\n\n______________________________________________________________________________\n\n5. Explique a simbologia dos elementos usados na Santa Ceia.\n\n______________________________________________________________________________\n\n6. Para participar da Santa Ceia o cristão precisa ser batizado nas águas?\n\n______________________________________________________________________________\n\nVISÃO DE CONQUISTA/ DICAS\n\n As pessoas aprendem fazendo; por isso, envolva todos os membros da célula\n  nas atividades do grupo.\n O sucesso somente pode ser obtido por meio de fracassos repetidos e\n  avaliados. O sucesso é resultado de varias tentativo fracassadas.\n Cada líder de célula ou geração deve lembrar constantemente os membros de\n  convidarem os seus amigos para a reunião.\n Lideres experiente sabem que é necessário que se convide 25 pessoas, para\n  que 15 se comprometam a comparecer. Das 15, apenas 8 virão realmente; e\n  das 8, 5 ou menos se decidirão a permanecer. Portanto, convidem muitos!\n Anuncie constantemente o alvo de multiplicação para a célula!\n Lideres de célula eficaz procuram conhecer cada pessoa que entra na célula.\n  Ele dá atenção a todos e não se limita a um pequeno grupo.\n Faça um mural na sua célula. Escreva o nome ou coloque a foto de todos por\n  quem a célula está orando ou quem está evangelizando. Ore por eles em toda\n  reunião da célula. Espere por resultados!\n Faça perguntas durante a palavra da célula. Perguntas envolvem as pessoas.\n  Quando não há envolvimento, não há discipulado. É impossível envolver as\n  pessoas sem fazer perguntas a elas!\n O líder de célula deve lembrar constantemente os membros da célula de\n  convidarem os seus amigos e familiares para a célula.\n Faça perguntas durante a palavra da célula. Os lideres precisam saber o nível\n  espiritual de cada membro e o que eles precisam aprender com mais urgência.\n  Essas informações são claramente fornecidas quando as pessoas respondem\n  perguntas. As perguntas revelam o grau de maturidade do grupo.\n Célula Forte ou Geração Forte. São Eventos Sociais. Jesus sempre comia com\n  as pessoas. Comida, descontração e visitantes são uma ótima combinação.\n Um novo Convertido precisa fazer amizade com pelo menos 6 pessoas da\n  igreja para poder continuar participando. Estimule os vínculos de amizade!\n As células de crianças: As células de crianças funcionam paralelas às células\n  de adultos. As células que não tem uma célula infantil paralela passa por\n  dificuldades.\n As células de Crianças: Muitos pais deixam de ir à célula por não terem com\n  quem deixar as crianças, e ficam constrangidos em levá-las, com receio de\n  que perturbem. Quando os pais levam as crianças e não há uma célula infantil,\n\n                                                                Igreja de Vencedores\n\n     as crianças ficam inquietas. Os anfitriões ficam incomodados com a bagunça\n     e com o barulho das crianças. Células com esse perfil chegam a fechar, pois\n     as reuniões não são produtivas.\n\nConverse com os convidados. A maneira de estabelecermos afinidades é através\nde conversas. Os membros da célula não devem fazer rodinhas para conversar\nentre si; o alvo é envolver e fazer amizade com as convidados. Se um convidado\nfica sozinho, enquanto os membros da célula conversam entre si, ele se sentirá\nexcluído e, nunca irá voltar.\n\n   Estabeleça um ou mais Discipuladores no grupo para dar o discipulado ao\n    novo membro. O ideal é que o discipulado seja individual, mais se não for\n    possível o discipulado deve ser dado em grupo.\n   Não espere que o novo convertido vá sozinho à célula. Busque-o, ou\n    determine alguém para fazê-lo!\n   Envolva todos os membros da célula inclusive os novos convertidos nos\n    ministérios, para que eles amadureçam e cresçam espiritualmente.\n\nEssa estratégia só deverá ser usada a partir dos 6 meses de célula\n\n                 Passos para Congregação e Células – Engatinhar\n                                                   1ª FASE\n\n SE POSSIVEL ESCOLHA UM MEMBRO OU FORME EQUIPES DE DUAS PESSOAS PARA CUIDAR DE CADA PROPÓSITO\n\nAdoração\n  1. Façam questão de orar pelo grupo quando se reúnem. Vocês talvez queiram iniciar ou concluir a reunião com\n     oração ,porem certifique-se que ela será parte do grupo.\n  DATA:\n  2. Participar em grupo de um culto de louvor e adoração a Deus (café da manhã / DOMINGO)\n  DATA:\n  3. Fazer a ceia em grupo (organizar a data da ceia no calendário de cada grupo) – VIDEO DO CANAL NO YOU TUBE\n     DA NOSSA IGREJA (SOBRE SANTA CEIA)\n  DATA:\n\n  4. Faça um estudo que se concentre em maneiras de adorar a Deus. De que modo vocês podem fazer isto na\n     pratica como grupo. - VIDEO DO CANAL NO YOU TUBE DA NOSSA IGREJA (SOBRE ESCOLA DE VENCEDORES)\n  DATA:\nComunhão\n  1. Celebrem ocasiões importantes (aniversários) em grupo procurem brincar juntos – EVENTO PONTE DA\n     CONGREGAÇÃO OU CÉLULA\n  DATA:\n  2. Façam da oração algo fundamental para o aprofundamento do relacionamento uns com outros. Tenham um\n     tempo regular para compartilhamento de preocupações de pedidos,e os escrevam em um diário ,sempre o\n     consultem ,para observar como Deus tem respondido suas orações . FAZER CADERNO DE ORAÇÃO + VASILHA\n     COM ÓLEO\n  DATA:\n  3. Separem um tempo para orarem pelas necessidades dos membros do grupo. Escreva essas necessidades e as\n     compartilhem uns com os outros. DEPOIS DA CÉLULA OU OUTRO DIA\n  DATA:\n  4. Para lembra-los que vocês estão abertos a compartilhar comunidade com outros, escrevam o nome de alguém\n     com quem vocês gostariam de lanchar ou tomar café. ALGUÉM QUE NÃO SEJA DA CÉLULA (FAMILIA, FAMILIAR,\n     AMIGOS, VIZINHOS....)\n  DATA:\n\nDiscipulado\n  1. Escolham com o grupo temas da próxima serie que eles gostariam de estudar – FAÇA UMA VOTAÇÃO E ENVIE\n     PARA GRUPO DE SERVIÇO DA IGREJA\n  DATA:\n\n                                                                                          Igreja de Vencedores\n\n  2. Faça com que seu g
