                                         Igreja de Vencedores\n\nem minha vida. Eu jamais enterrarei aquilo que o Senhor tem posto em minhas mãos, antes, frutificarei\npara o Reino de Deus através da unção. Amém\".\n\n    DISCIPULADO\n\n      Ao ascender ao céu, o Senhor Jesus ordenou aos seus discípulos que realizassem a obra que Ele\niniciara em seu ministério terreno. Desde então, todos os que aceitam a Cristo, como seu Senhor e\nSalvador, cumprem o \"ide\", a fim de ganhar as almas para o Reino de Deus (Mc 16.15).\n      1. Você, também, está incumbido desta tarefa gloriosa. Portanto ore por três pessoas durante um\nmês e em seguida abra uma célula na casa de cada uma dela e se possível as envie para o Encontro com\nDeus. Você é um discípulo de Jesus, e deve cumprir o que Ele ordenou.\n      2. Comece por evangelizar as pessoas com as quais você está mais relacionado, por exemplo:\nseus familiares, vizinhos, amigos, colegas de trabalho ou da escola, etc. todos carecem da salvação e\nprecisam de Jesus.\n      3. Peça a Deus que lhe ajude a ganhar o maior número possível de almas para Cristo. Lembre-se:\nvocê é uma nova criatura e tem um chamado de Deus; convide outras pessoas a fazerem parte do Reino\nde Deus. O Senhor vai abençoar grandemente o seu trabalho evangelístico e sua célula irá crescer em\nnome de Jesus. Amém.\n      Adquira o livro: Um Ministério com Propósitos - Doug Fields\n\nVERIFIQUE O QUE VOCÊ APRENDEU\n\n1. Defina Unção.\n\n______________________________________________________________________________\n\n2. Defina Habilitação.\n\n______________________________________________________________________________\n\n3. Defina Constituição.\n\n______________________________________________________________________________\n\n4. Quem são os lideres fundadores do Aprisco Igreja de Vencedores?\n\n______________________________________________________________________________\n\n5. Quais são os Encargos da Igreja de Vencedores?\n\n______________________________________________________________________________", "quiz": [{"q": "Qual é o texto bíblico-base da lição \"O DISCIPULO E A UNÇÃO\"?", "options": ["Atos\n10.38", "Efésios 5.18", "Gênesis 32:30; II Samuel 12", "Malaquias 3. 8 - 12"], "answer": 0}, {"q": "Qual destes é um dos tópicos estudados na lição \"O DISCIPULO E A UNÇÃO\"?", "options": ["Defina As Testemunhas De Jeová", "Somos Conduzidos Ao Arrependimento (Pv 28:13)", "Níveis De Entrega E Renúncia – A Unção Provendo Habilitação", "Defina Paixão Ministerial"], "answer": 2}, {"q": "Qual destes tópicos NÃO faz parte da lição \"O DISCIPULO E A UNÇÃO\"?", "options": ["A Vida Na Terra É Uma Atribuição Temporária", "Níveis De Entrega E Renúncia – A Unção Provendo Habilitação", "O Valor Da Unção", "A Habilitação Para Vivermos A Constituição"], "answer": 0}]}, {"num": 21, "title": "VIVENDO COM PROPÓSITO", "verseRef": "Efésios 1.11", "content": "INTRODUÇÃO\n\n      Antes que você nascesse, Deus planejou este exato momento em sua vida.\n      Não é por acaso que você conseguiu chegar até aqui.\n      Deus anseia que você descubra a vida que ele criou para você — aqui na terra e para sempre na\neternidade.\n      É em Cristo que descobrimos quem somos, e o propósito de nossa vida. Muito antes de termos\nouvido falar de Deus, ele já tinha seus olhos sobre nós; já havia planejado para nós uma vida\ngloriosa, parte do projeto global que ele está elaborando para tudo e para todos.\n      A expectativa média de vida nos dias de hoje é de 25.550 dias. Esta deverá ser a duração de sua\nvida se você for uma pessoa típica. Mas o que você tem feito de sua vida? Em que você tem investido\nseu tempo? Afinal de contas, por que motivo você nasceu?\n      Uma vida dedicada às coisas materiais é morta, um tronco cortado; uma vida moldada por Deus\né uma árvore florescente. Felizes os que confiam no Senhor são como árvores plantadas às margens\nde um rio, cujas raízes alcançam águas profundas. Tais árvores não são afetadas pelo calor nem se\npreocupam com longos meses de seca. Suas folhas permanecem verdes e produzem fruto delicioso.\n\n      I. Tudo Começa com Deus\n      Pois tudo, absolutamente tudo, nos céus e na terra, visível e invisível, todas as coisas começaram\nnele e nele encontram seu propósito. Colossenses 1.16\n      O propósito de sua vida é muito maior que sua realização pessoal, sua paz de espírito ou mesmo\nsua felicidade. É muito maior que sua família, sua carreira ou mesmo seus mais ambiciosos sonhos e\naspirações.\n      Se você quiser saber por que foi colocado neste planeta, deverá começar a querer saber quem é\nDeus. Você nasceu de acordo com os propósitos dele e para cumprir os propósitos dele.\n      A procura pelo propósito (sentido) da vida tem intrigado as pessoas por milhares de anos. Isso\nporque normalmente começamos pelo lado errado — nós mesmos.\n      Nós fazemos perguntas voltadas para a nossa pessoa, como: \"O que eu quero ser? O que eu\ndeveria fazer com a minha vida? Quais são meus objetivos, minhas ambições e meus sonhos para o\nfuturo?\". Mas concentrarmo-nos em nós mesmos jamais desvendará o propósito de nossa vida.\n       A Bíblia diz: A vida de todas as criaturas está na mão de Deus; é ele quem mantém todas as\npessoas com vida.\n      Se eu lhe entregar uma invenção desconhecida, você não terá como saber sua serventia nem a\nprópria invenção terá a capacidade de lhe dizer. Somente o criador ou o manual do fabricante poderá\nmostrar sua utilidade.\n      Você não pode chegar ao propósito da sua vida concentrando-se em si mesmo.\n      Você deve começar com Deus, seu Criador. Você só existe porque Deus deseja que você exista.\nVocê foi feito por Deus e para Deus — e, enquanto não compreender isso, a vida jamais terá sentido.\n      É somente em Deus que descobrimos nossa origem, nossa identidade, o que significamos, nosso\npropósito, nossa importância e nosso destino. Todos os outros caminhos levam a um beco sem saída.\n      Muitas pessoas tentam usar Deus para sua auto-realização, mas isso é contrário à natureza e está\nfadado ao fracasso.\n\n                                                                                     Igreja de Vencedores\n\n      Você foi feito por Deus, e não o contrário; viver é deixar Deus usá-lo para seus propósitos, e não\nvocê usar a Deus para o que deseja.\n      Você poderia alcançar seus objetivos pessoais, tornando-se um sucesso pelos padrões do mundo,\ne ainda assim falhar em alcançar os propósitos para os quais Deus o criou.\n      Deus não é apenas o ponto de partida de nossa vida: é a fonte dela. Para descobrir o propósito\npara sua vida, volte-se para a Palavra de Deus, e não para a sabedoria do mundo.\n      A Bíblia diz: É em Cristo que descobrimos quem somos e o propósito de nossa vida. Muito antes\nde termos ouvido falar de Cristo e de termos erguido nossas esperanças... ele já tinha seus olhos sobre\nnós; já havia planejado para nós uma vida gloriosa, parte do projeto global que ele está elaborando\npara tudo e para todos!\n      Esse versículo nos dá três descobertas a respeito do nosso propósito:\n      1. Você descobre a sua identidade e propósito através de um relacionamento com Jesus Cristo.\n      2. Deus já pensava a seu respeito muito antes de você pensar a respeito dele. O propósito\ndeterminado por ele para a sua vida é anterior à sua concepção. Ele planejou isso antes que você\nexistisse, sem a sua contribuição!\n      Você pode escolher sua carreira, seu cônjuge, seus passatempos e muitas outras partes da sua\nvida, mas não pode escolher o seu propósito.\n      3. O propósito da sua vida cabe em um outro propósito muito maior, que Deus planejou para a\neternidade.\n\n        II. Você não é um acidente\n        Eu sou seu criador. Você estava sob meus cuidados mesmo antes de nascer.              Isaías\n44.2.\n      Seu nascimento não foi um erro ou um infortúnio, e sua vida não é um acaso da natureza. Seus\npais podem não tê-lo planejado, mas Deus certamente o fez. Ele não ficou nem um pouco surpreso com\nseu nascimento.\n      Aliás, ele o aguardava. Muito antes de ser concebido por seus pais, você foi concebido na mente\nde Deus. Ele pensou em você primeiro.\n      Você não está respirando neste exato momento por acaso, sorte, destino ou coincidência. Você\nestá vivo porque Deus quis criá-lo!\n      A Bíblia diz: O Senhor cumprirá o seu propósito para comigo! Deus determinou cada pequeno\ndetalhe de nosso corpo.\n      Ele deliberadamente escolheu sua raça, a cor de sua pele, seu cabelo e todas as outras\ncaracterísticas.\n      Ele fez seu corpo sob medida, exatamente do jeito que queria. Ele também determinou os talentos\nnaturais que você possuiria e a singularidade de sua personalidade.\n      A Bíblia diz: Tu me conheces por dentro e por fora, conheces cada osso do meu corpo; conheces\nexatamente como fui formado, parte por parte, como fui esculpido e vim a existir.\n      Uma vez que Deus o fez por um motivo, ele também decidiu o momento de seu nascimento e seu\ntempo de vida.\n      Ele planejou os dias de sua vida antecipadamente, escolhendo o momento exato de seu\nnascimento e de sua morte. A Bíblia diz: Antes mesmo de o meu corpo tomar forma humana Tu já\nhavias planejado todos os dias da minha vida; cada um deles estava registrado no teu livro!\n      Deus também programou onde você nasceria e onde viveria para o propósito dele.\n      Sua raça e nacionalidade não são um mero acaso; Deus não deixou nenhum detalhe ao acaso. Ele\nplanejou isso tudo para o propósito dele.\n\nA Bíblia diz: De um só fez ele todos os povos tendo determinado os tempos anteriormente\nestabelecidos e os lugares exatos em que deveriam habitar. Nada em sua vida é casual — tudo foi feito\nem função de um propósito.\n      E o mais incrível: Deus decidiu como você nasceria. Independentemente das circunstâncias de\nseu nascimento e de quem são seu pais, Deus tinha um plano ao criá-lo.\n      Não importa se seus pais foram bons, ruins ou indiferentes. Deus sabia que esses dois indivíduos\npossuíam a constituição genética específica para criar você em especial, exatamente como ele tinha em\nmente.\n       Eles tinham o DNA que Deus queria para formá-lo.\n      Embora existam pais ilegítimos, não existem filhos ilegítimos. Muitos filhos não foram\nplanejados pelos pais, mas não são um imprevisto para Deus.\n      O propósito de Deus levou em conta o erro humano e até mesmo o pecado.\n      Deus nunca faz nada por acaso, e ele nunca comete erros. Ele tem um motivo para tudo que criou.\n      Todas as plantas e animais foram planejados por Deus, e cada pessoa foi idealizada com um\npropósito.\n      O motivo para Deus tê-lo criado foi o amor que ele tem.\n      A Bíblia diz: Muito antes de estabelecer as fundações da terra, Deus já nos tinha em mente,\ntendo nos escolhido como foco de seu amor.\n      Deus já pensava em você antes de formar o mundo. Na verdade, você foi o motivo de Deus ter\ncriado o mundo! Deus projetou o meio ambiente deste planeta para que pudéssemos viver nele.\n      Nós somos o foco de seu amor e o elemento de maior valor em toda a sua criação.\n      A Bíblia diz: Por sua decisão ele nos gerou pela palavra da verdade, a fim de sermos como que\nos primeiros frutos de tudo o que ele criou.\n       Eis quanto Deus o ama e valoriza!\n      Deus não age de forma aleatória; ele planejou tudo de forma extremamente precisa. Quanto mais\nos físicos, biólogos e outros cientistas aprendem sobre o universo, mais compreendemos quanto ele é\nadequado à nossa existência — feito sob medida com as exatas especificações que tornam a vida\nhumana possível.\n      Por que Deus fez tudo isso? Por que enfrentou todo o incômodo de criar um universo para nós?\nPorque ele é um Deus de amor. Esse tipo de amor é difícil de compreender, mas é essencialmente\nconfiável.\n      Você foi criado para ser um alvo especial do amor de Deus!\n       Deus o fez para poder amá-lo.\n      Essa é uma verdade sobre a qual você precisa edificar sua vida.\n      A Bíblia nos diz que Deus é amor. Ela não diz que Deus tem amor. Ele é amor! Amor é a\nessência do caráter de Deus.\n      Há um perfeito amor na irmandade da Trindade, então Deus não precisou criá-lo. Ele não estava\nsó. Mas quis fazê-lo para expressar o seu amor.\n      Deus diz: Vocês, a quem tenho sustentado desde que foram concebidos, e que tenho carregado\ndesde o seu nascimento. Mesmo na sua velhice, quando tiverem cabelos brancos, sou eu aquele,\naquele que os susterá. Eu os fiz e os levarei; eu os sustentarei e os salvarei.\n      Se não houvesse um Deus, seríamos todos \"acidentes\", o resulta do de um fato\nextraordinariamente aleatório no universo.\n      Você poderia parar de crer em Deus, pois a vida não teria nenhum propósito, significado ou\nimportância.\n      Não haveria certo e errado, bem como nenhuma esperança além de seus breves anos aqui na terra.\n      Mas há um Deus que o fez por uma razão, e sua vida tem um profundo significado! Descobrimos\nesse significado e propósito somente quando tomamos a Deus como ponto de referência de nossa vida.\n\n                                                                                   Igreja de Vencedores\n\n      Romanos 12.3 diz: A única forma precisa de compreendermos a nós mesmos é pelo que Deus é e\npelo que ele faz por nós.\n      Você é quem é por uma razão.\n      Você é uma criação original, preciosa e perfeita, denominada como notável homem ou mulher de\nDeus.\n      Você tem essa aparência por uma razão.\n      Nosso Deus não cometeu nenhum erro.\n      Ele o teceu no útero, você é exatamente o que ele quis fazer.\n      Os pais que você teve foram escolhidos por ele, e, a respeito de seus sentimentos, eles foram\nfeitos sob medida para os planos que Deus tem em mente, e estão aprovados pelo Senhor.\n      Não, aquele trauma que você enfrentou não foi fácil.\n      E Deus chorou por aquilo o ter machucado tanto; mas foi permitido para moldar seu coração para\nque você crescesse à sua imagem.\n\n     III. O QUE DIRIGE SUA VIDA?\n     Todo e qualquer indivíduo tem sua vida dirigida por algo.\n     A maioria dos dicionários define a palavra \"dirigir\" como \"guiar, controlar, direcionar\".\n     Se você está dirigindo um carro, estará naquele momento guiando, controlando e direcionando.\n     Qual a força que dirige sua vida?\n     Neste exato momento, você pode estar sendo dirigido por um problema, por pressão ou por um\nprazo limitado.\n     Você pode estar sendo dirigido por uma lembrança dolorosa, um temor pungente ou uma crença\ninconsciente.\n     Existem centenas de circunstâncias, valores e emoções que podem dirigir sua vida. Eis aqui cinco\ndos mais comuns.\n\n      1. Muitos são dirigidos pela culpa.\n      Tais pessoas passam a vida inteira fugindo do remorso e ocultando sua vergonha.\n      Pessoas dirigidas pela culpa são manipuladas por suas lembranças. Elas permitem que seu\npassado controle seu futuro. Elas frequentemente culpam a si mesmas por sabotarem o próprio sucesso.\n      Quando Caim pecou, sua culpa o fez cair da presença de Deus, e Deus disse: Você será um\nfugitivo errante pelo mundo.\n      Isso descreve a maioria das pessoas hoje em dia — perambulando pela vida, sem propósito.\n      Somos produto de nosso passado, mas não temos de ser prisioneiros dele. O propósito de Deus\nnão é restringido pelo seu passado.\n       Ele tornou um assassino chamado Moisés em um líder, e um covarde chamado Gideão em um\ncorajoso herói.\n      Ele também pode fazer coisas maravilhosas com o resto de sua vida. Deus é especialista em dar\nàs pessoas um novo começo.\n      A Bíblia diz: Como é feliz o homem que tem suas desobediências perdoadas e seus pecados\ncobertos!\n\n     2. Muitos são dirigidos pelo rancor e pela raiva.\n     Eles se apegam a mágoas, sem jamais superá-las. Em vez de aliviarem sua dor através do perdão,\nrevivem-na de contínuo em sua mente.\n     Algumas pessoas dirigidas pelo rancor \"se fecham\" e interiorizam sua raiva, enquanto outras\n\"explodem\" sobre os outros.\n     Ambas as reações são perniciosas e não trazem nenhum benefício.\n\nO rancor sempre machuca mais a você que a pessoa que trouxe tal indignação. Enquanto aquele\nque o ofendeu provavelmente esqueceu o insulto e seguiu com sua vida, você continua angustiado em\nsua dor, perpetuando o passado.\n     Ouça: os que o magoaram no passado não podem continuar a magoá-lo, a menos que você se\nagarre à dor através do rancor.\n     O que passou, passou! Nada poderá mudar o passado.\n     Você apenas machuca a si mesmo com sua amargura. Para seu próprio bem, aprenda com o\npassado e então afaste-se dele.\n     A Bíblia diz: Ficar desgostoso e amargurado é loucura, é falta de juízo, que leva à morte?\n\n      3. Muitos são dirigidos pelo medo.\n      Seus temores são provavelmente o resultado de experiências traumáticas e de expectativas\nilusórias, do crescimento em um lar extremamente severo ou mesmo de predisposição genética.\nIndependentemente do que tenha causado tal situação, pessoas dirigidas pelo medo com frequência\nperdem grandes oportunidades por terem medo de correr riscos.\n      Em vez disso, elas se comportam de maneira cautelosa, evitando riscos e tentando manter a\nsituação vigente.\n      O medo é a auto-imposição de um cárcere, que o impedirá de se tornar o que Deus pretende que\nvocê seja.\n      Você tem de agir contra isso, com as armas da fé e do amor.\n      A Bíblia diz: No amor não há medo; ao contrário, o perfeito amor expulsa o medo, porque o\nmedo supõe castigo. Aquele que tem medo não está aperfeiçoado no amor.\n\n       4. Muitos são dirigidos pelo materialismo.\n       Seu desejo de adquirir se torna o único objetivo na vida.\n       O impulso de sempre querer mais baseia-se no conceito errôneo de que ter mais me tornará mais\nfeliz, mais importante e mais protegido. Mas os três pensamentos são falsos.\n       Posses somente trazem felicidade temporária.\n       Uma vez que as coisas não se modificam, acabamos nos entediando e então passamos a desejar\nmodelos mais novos, maiores e melhores.\n       Também é um mito a concepção de que, quanto mais possuir, mais importante serei.\n       Auto-estima e patrimônio não são as mesmas coisas. Seu valor não é determinado pelas suas\nposses, e Deus deixa claro que as coisas mais valiosas da vida não são os bens!\n       O mito mais frequente a respeito do dinheiro é o que diz que, quanto mais dinheiro se tem, mais\nprotegido se está. Isso não é verdade. Riquezas podem ser perdidas em um piscar de olhos, em virtude\nde uma enorme quantidade de fatores incontroláveis.\n       A verdadeira proteção só pode ser achada naquilo que nunca poderão tomar de você — seu\nrelacionamento com Deus.\n\n        5. Muitos são dirigidos pela necessidade de aprovação.\n        Eles permitem que as expectativas dos pais, esposas, filhos, professores ou amigos controlem sua\nvida.\n     Muitos adultos ainda tentam ganhar a aprovação de pais que nunca estão satisfeitos.\n     Outros são dirigidos pela pressão social, sempre preocupados com o que os outros poderiam\npensar. Infelizmente, os que seguem a multidão acabam normalmente perdidos nela.\n\n        IV. AS VANTAGENS DE UMA VIDA DIRIGIDA COM PROPÓSITOS.\n        Existem algumas grandes vantagens em se levar uma vida dirigida com propósitos:\n\n                                                                                      Igreja de Vencedores\n\n      1. Conhecer o propósito de sua vida faz que ela tenha sentido.\n       Fomos feitos para ser importantes. É por isso que as pessoas usam métodos questionáveis, como\nastrologia e psicologia, para descobrir isso. Quando a vida faz sentido, você pode suportar quase tudo;\nsem isso, tudo é insuportável.\n      Sem Deus, a vida não tem nenhum propósito, e sem um propósito a vida não tem significado.\nSem um significado, a vida não tem esperança. Na Bíblia, diversas pessoas expressaram sua falta de\nesperança.\n      Isaías queixou-se: Tenho me afadigado sem qualquer propósito; tenho gastado minha força em\nvão e para nada.\n       Jó disse: Meus dias são vazios e sem esperança e Detesto a vida; não quero mais viver.\n       A maior de todas as desgraças não é a morte, mas uma vida sem propósitos.\n      A esperança é tão essencial para sua vida como o ar e a água. É preciso esperança para vencer.\n      A esperança é gerada quando se tem propósitos.\n      Se você tem se sentido sem esperança, não desista!\n      Coisas maravilhosas acontecerão em sua vida quando você começar a viver com propósitos.\n      Deus diz: Porque sou eu que conheço os planos que tenho para vocês, diz o Senhor, planos de\nfazê-los prosperar e não de lhes causar dano, planos de dar-lhes esperança e um futuro.\n       Você pode ter a sensação de estar enfrentando uma situação impossível, mas a Bíblia diz: ... pelo\nseu grandioso poder operando em nós [Deus] é capaz de fazer muito mais do que nós jamais\nousaríamos pedir ou mesmo imaginar, infinitamente além de nossas mais sublimes orações, anseios,\npensamentos ou esperanças.\n\n      2. Conhecer seu propósito simplifica a vida.\n      Ele define o que você faz e o que você não faz.\n      O propósito se torna o padrão pelo qual você avalia quais ações são essenciais e quais não são.\n      Você simplesmente pergunta: \"Esse ato me ajuda a cumprir o propósito de Deus para minha\nvida?\".\n      Sem um propósito claro, ficamos sem alicerce sobre o qual fundamentar decisões, destinar o\ntempo e empregar os recursos. A tendência será tomar decisões com base nas circunstâncias, nas\npressões do momento e no humor do dia. Quem não conhece seu propósito tenta realizar além do que\ndeve — e isso causa estresse e fadiga, gerando conflitos.\n      É impossível fazer tudo o que as pessoas querem que você faça.\n      O seu tempo só é suficiente para fazer a vontade de Deus. Se você não consegue realizá-la por\ncompleto, significa que você está tentando fazer mais do que Deus pretendia que você fizesse (ou,\npossivelmente, você está assistindo muito a televisão).\n      Uma vida dirigida por propósito leva a um estilo de vida mais simples e a uma agenda mais\nequilibrada.\n      A Bíblia diz: A vida vistosa e arrogante é vida vazia; a vida simples e comum é vida plena. Isso\ntambém leva à paz de espírito: Tu, ó Senhor, dás paz e prosperidade às pessoas que têm uma fé firme,\nàs pessoas que confiam em ti.\n\n      3. Conhecer seu propósito o prepara para a eternidade.\n       Muitas pessoas passam a vida tentando criar um legado a ser deixado sobre a terra. Elas querem\nser lembradas quando partirem.\n      O que as pessoas não percebem é que todas as realizações acabam sendo superadas; recordes são\nquebrados, reputações desvanecem e homenagens são esquecidas.\n       Exemplo. Um Jovem tinha a meta de ser o campeão de atletismo de sua cidade. Ele sentiu-se\norgulhoso quando seu troféu foi posto em um local de destaque na sala de troféus da prefeitura. Anos\n\nmais tarde, alguém enviou-lhe o troféu pelo correio. Eles o haviam achado em uma lata de lixo quando\na prefeitura foi reformada...\n      No devido tempo, todos os seus troféus serão jogados no lixo por alguém!\n      Você não foi posto na terra para ser lembrado. Você foi posto aqui para se preparar para a\neternidade.\n      Chegará o dia em que você estará diante de Deus, e ele fará uma auditoria em sua vida; um\nexame final, antes que você entre na eternidade.\n       A Bíblia diz: Lembrem-se: cada um de nós estará pessoalmente diante de Deus para ser julgado\npor ele. Sim, cada um de nós terá que prestar contas de si mesmo a Deus.\n      Felizmente, Deus quer que passemos nesse teste, por isso ele nos passou as perguntas\nantecipadamente.\n      Apartir da Bíblia, podemos supor que Deus nos fará duas perguntas fundamentais:\n      Primeira: O que você fez com meu Filho, Jesus Cristo? Deus não irá perguntar sobre seus\nantecedentes religiosos ou visões doutrinárias. O único ponto importante será: \"Você aceitou o que\nJesus fez por você, aprendeu a amá-lo e a confiar nele?\".\n      Jesus disse: Eu sou o caminho, a verdade e a vida. Ninguém vem ao Pai, a não ser por mim.\n      Segunda: O que você fez com o que eu lhe dei? O que você fez com sua vida — todas as dádivas,\ntalentos, oportunidades, energia, relacionamentos e recursos que Deus lhe deu? Você os gastou\nconsigo mesmo ou os utilizou para os propósitos que Deus lhe deu?\n      Prepará-lo para essas duas perguntas é o objetivo do Encontro com Deus.\n      A primeira vai determinar onde você passará a eternidade. A segunda determinará o que você fará\nna eternidade.\n\n    COMENTE O QUE MAIS CHAMOU A SUA ATENÇÃO:\n    ______________________________________________________________________________\n__________________________________________________________________________________\n__________________________________________________________________________________\n\n                                                                                  Igreja de Vencedores\n         132", "quiz": [{"q": "Qual é o texto bíblico-base da lição \"VIVENDO COM PROPÓSITO\"?", "options": ["Malaquias 3.10", "Efésios 5.18", "1 João 4.1", "Efésios 1.11"], "answer": 3}, {"q": "Qual destes é um dos tópicos estudados na lição \"VIVENDO COM PROPÓSITO\"?", "options": ["Você Não É Um Acidente", "Fazendeiros E Mercadores", "Leve As Pessoas A Declararem Em Voz Alta Que Estão Livres", "Você É Chamado Para Servir A Deus"], "answer": 0}, {"q": "Qual destes tópicos NÃO faz parte da lição \"VIVENDO COM PROPÓSITO\"?", "options": ["Como Curar Feridas", "Você Não É Um Acidente", "Tudo Começa Com Deus", "O Que Dirige Sua Vida?"], "answer": 0}]}, {"num": 22, "title": "CRIADO PARA SER ETERNO", "verseRef": "Eclesiastes 3.11", "content": "INTRODUÇÃO\n\n      Deus tem [...] plantado a eternidade no coração humano. Deus certamente não teria criado um\nser como o homem para existir somente por um dia! Não, não... o homem foi feito para a imortalidade.\n      Esta vida não é tudo o que há.\n      A vida é apenas um ensaio geral, antes da verdadeira produção. Você passará muito mais tempo\ndo outro lado da morte — na eternidade — do que aqui. A terra é um lugar de preparação, a pré-escola,\no vestibular para sua vida na eternidade.\n      É o treinamento coletivo que ocorre antes do jogo; a volta de aquecimento antes do início da\ncorrida.\n      Esta vida é uma preparação para a próxima.\n      Você viverá no máximo cem anos sobre a terra, mas para sempre na eternidade.\n      Você foi feito para ser eterno.\n      A Bíblia diz que Deus tem [...] plantado a eternidade no coração humano. É por Isso que as\npessoas têm um desejo pela imortalidade. Isso ocorre porque Deus as projetou à sua imagem, para\nviver eternamente.\n      Embora saibamos que com o tempo todos morreremos, a morte sempre parece anormal e injusta.\n      A razão pela qual sentimos que deveríamos viver para sempre é que Deus condicionou nossa\nmente com esse desejo!\n      Um dia, o nosso coração parará de bater. Então será o fim de seu corpo e de seu tempo na terra;\nmas não será o fim.\n      Seu corpo terreno é apenas uma residência temporária de seu espírito.\n      A Bíblia chama o nosso corpo terreno de \"temporária habitação\", mas se refere ao nosso futuro\ncorpo como uma \"casa\".\n      Se a vida na terra oferece muitas opções, a eternidade nos oferece apenas duas: céu ou inferno.\n      Seu relacionamento com Deus na terra determinará seu relacionamento com Deus na eternidade.\n      Se aprender a amar Jesus, o Filho de Deus, e confiar nele, você será convidado a passar o resto da\neternidade com ele.\n      Entretanto, se desprezar o amor, o perdão e a salvação que ele oferece, você passará a eternidade\nseparado de Deus.\n      Quando você compreender plenamente que há mais na vida que apenas o aqui-e-agora e perceber\nque a vida é apenas uma preparação para a eternidade, você começará a viver de forma diferente.\n      Você começará a viver à luz da eternidade, e isso lhe dará nova perspectiva de como lidar com\ncada relacionamento, tarefa ou circunstancia.\n      Subitamente, muitas atividades, metas e até mesmo problemas que pareciam importantes se\nmostrarão banais, insignificantes e indignos de sua atenção. Quanto mais próximo você viver de Deus,\nmenor todo o resto parecerá.\n      Quando você vive à luz da eternidade, seus valores mudam.\n      Você utiliza mais sabiamente seu dinheiro e seu tempo.\n\nVocê passa a dar maior valor a sua personalidade e a seus relacionamentos, em vez de valorizar\nfama, riqueza, realizações ou mesmo prazeres.\n      Suas prioridades são reorganizadas.\n      Manter-se em dia com as tendências, modas e valores populares já não é tão importante.\n      Paulo disse: Antigamente eu pensava que todas essas coisas eram muito importantes, mas agora\neu as considero sem valor algum por causa do que Cristo fez?\n      Cada ato de nossa vida ecoa na eternidade.\n      O aspecto mais prejudicial da vida contemporânea é o raciocínio em curto prazo.\n      Para tirar o máximo da vida, você deve manter sempre em sua mente a visão da eternidade e em\nseu coração, o valor que ela representa.\n      Há muito mais na vida que apenas o aqui-e-agora!\n      O que vemos hoje é apenas a ponta do iceberg. A eternidade é todo o resto que você não vê sob a\nsuperfície.\n      Como será a eternidade com Deus? Com toda a franqueza, nosso cérebro não é capaz de\ncompreender a maravilha e a grandeza do céu, seria como tentar descrever a Internet para uma formiga.\nÉ inútil.\n       Não foram inventadas palavras que pudessem transmitir a experiência da eternidade.\n      A Bíblia diz: Este é o significado das Escrituras que dizem que nenhum mero homem jamais viu,\nouviu, nem mesmo imaginou, que coisas maravilhosas Deus preparou para aqueles que amam ao\nSenhor.\n      Deus tem um propósito para sua vida na terra, mas ele não termina aqui. O plano envolve muito\nmais do que as poucas décadas que você passará neste planeta.\n      É mais do que \"a oportunidade de toda uma vida\"; Deus lhe oferece uma oportunidade para além\nde toda uma vida.\n      A Bíblia diz: Mas o que o Senhor planeja dura para sempre, as suas decisões permanecem\neternamente.\n      O único momento em que as pessoas pensam a respeito da eternidade é nos enterros, e mesmo\nnessas ocasiões são pensamentos freqüentemente sentimentais e superficiais, baseados na ignorância.\n      Você pode sentir que é loucura pensar a respeito da morte, mas na verdade não é saudável viver\nnegando-a, sem a considerar inevitável.\n      Somente um tolo passaria pela vida despreparado para o que todos sabemos que acabará\nacontecendo.\n      Você deve pensar mais a respeito da eternidade, e não menos.\n      Assim como os nove meses que você passou no útero de sua mãe não tinham um fim em si, mas\nera uma preparação para a vida, também a vida é uma preparação para o que vem a seguir.\n      Se você possui um relacionamento com Deus por meio de Jesus, não é preciso temer a morte. Ela\né a porta para a eternidade.\n      Será o último momento de seu tempo na terra, mas não será o fim. Em vez de ser o fim de sua\nvida, será o seu nascimento na vida eterna.\n      A Bíblia diz: Porque este mundo não é nossa pátria; nós estamos aguardando a nossa pátria\neterna no céu.\n      Em comparação com a eternidade, nosso tempo na terra não passa de um piscar de olhos, mas as\nconsequências durarão para sempre.\n      Os atos desta vida definem o destino na próxima.\n      Deveríamos compreender que cada instante que gastamos neste corpo terreno é tempo gasto\nlonge de nosso lar eterno, no céu com Jesus.\n\n                                                                                  Igreja de Vencedores\n\n      I. Enxergando a vida do ponto de vista de Deus\n      Nós não vemos as coisas como são, mas como nós somos.\n      O modo de você enxergar sua vida molda a mesma.\n      O modo de você definir a vida determina o seu destino.\n      Sua perspectiva irá influenciar o modo de você investir seu tempo, gastar seu dinheiro, usar seus\ntalentos e valorizar seus relacionamentos.\n      Uma das melhores formas de compreender os outros é perguntar-lhes: \"Como você enxerga a sua\nvida?\".\n      Você descobrirá que existem tantas respostas diferentes. Já me disseram que a vida é um circo,\num campo minado, uma montanha russa, um quebra-cabeça, uma sinfonia, uma jornada e uma dança.\n      As pessoas dizem \"A vida é um carrossel: algumas vezes você está em cima, outras em baixo, e\nalgumas vezes você fica apenas dando voltas\", ou \"A vida é uma bicicleta de dez marchas, com\nengrenagens que nunca usamos\", ou \"A vida é um jogo de cartas: você tem de jogar com o que lhe\nderam\".\n      Se eu perguntasse como você imagina a vida, qual figura lhe viria à mente? Tal imagem é a sua\nmetáfora de vida.\n       É a visão da vida que você tem, consciente ou inconscientemente. É a sua descrição de como\nfunciona a vida e o que você espera dela.\n       As pessoas frequentemente expressam suas metáforas de vida através de roupas, jóias, carros,\npenteados, adesivos e até mesmo tatuagens.\n      Sua metáfora de vida influencia sua vida mais do que você percebe.\n       Ela determina suas esperanças, valores, relacionamentos, metas e prioridades.\n      Por exemplo: se você pensa que a vida é uma festa, seu principal valor é divertir-se.\n      Se você vê a vida como uma corrida, certamente valorizará a velocidade e provavelmente estará\napressada a maior parte do tempo.\n      Se você vê a vida como uma maratona, valorizará a resistência.\n      Se você vê a vida como uma batalha, ou um jogo, vencer será muito importante para você.\n      Qual a sua visão da vida? Você pode estar baseando sua vida em uma metáfora falha.\n      Para cumprir os propósitos que Deus lhe deu, você terá de contestar o pensamento convencional e\nsubstituí-lo pelas metáforas bíblicas da vida.\n       A Bíblia diz: Não vivam como vivem as pessoas deste mundo, mas deixem que Deus os\ntransforme por meio de uma completa mudança da mente de vocês. Assim vocês conhecerão a vontade\nde Deus...\n      A Bíblia oferece três metáforas que nos ensinam a visão que Deus tem da vida: a vida é um teste,\na vida é uma incumbência de confiança e a vida é uma atribuição temporária.\n      Essas ideias são os fundamentos da vida dirigida com propósitos.\n\n      II. A vida na terra é um teste.\n       Essa metáfora de vida é vista em histórias ao longo de toda a Bíblia.\n      Deus continuamente testa as pessoas quanto ao caráter, fé, obediência, amor, honestidade e\nlealdade.\n       Palavras como \"provações\", \"tentações\", \"refinar\" e \"testar\" ocorrem mais de duzentas vezes na\nBíblia.\n      Deus provou Abraão ao pedir-lhe que oferecesse seu filho Isaac.\n      Deus provou Jacó, quando ele teve de trabalhar outros tantos anos para obter Raquel como\nesposa.\n\nAdão e Eva foram reprovados no teste do jardim do Éden, e Davi o foi em testes dados por Deus\nem diversas ocasiões. Mas a Bíblia também nos dá muitos exemplos de pessoas que passaram em\ngrandes testes, tais como José, Rute, Ester e Daniel.\n      Os testes tanto desenvolvem quanto manifestam o caráter de alguém, e toda a vida é um teste.\n      Você está sempre sendo testado. Deus constantemente observa sua reação às pessoas, problemas,\nsucesso, conflitos, enfermidades, decepções e etc.\n      Ele até observa a mais simples ação, como quando você abre uma porta para alguém, pega o lixo\nque foi largado no chão ou quando é educado com um balconista ou uma garçonete.\n      Não conhecemos todos os testes que Deus vai aplicar, mas podemos prever alguns deles,\nbaseados na Bíblia.\n       Você será testado por grandes mudanças, promessas retardadas, problemas impossíveis, orações\nnão respondidas, críticas imerecidas e até mesmo tragédias sem sentido.\n      Um teste muito importante é verificar qual a sua atitude quando você não consegue sentir a\npresença de Deus em sua vida.\n      Às vezes Deus se retira intencionalmente, e não sentimos mais sua proximidade.\n      Um rei chamado Ezequias experimentou esse teste.\n      A Bíblia diz: Deus o deixou, para prová-lo e para saber tudo o que havia em seu coração.\n       Ezequias desfrutava da companhia íntima de Deus, mas em um momento crucial de sua vida\nDeus deixou-o só para testar o seu caráter, revelar uma fraqueza e prepará-lo para uma\nresponsabilidade maior.\n      Uma vez que tenha compreendido que a vida é um teste, você percebe que nada é insignificante\nna vida.\n      Mesmo o menor incidente é relevante para o desenvolvimento de seu caráter. Cada dia é\nimportante, e cada segundo é uma oportunidade de crescimento para aprofundar o caráter e demonstrar\namor ou dependência de Deus.\n      Alguns testes parecem esmagadores, enquanto outros você nem percebe. Mas todos têm\nimplicações eternas.\n      A boa notícia é que Deus quer que você passe nos testes da vida, então ele jamais permitirá que\nvocê enfrente testes maiores que a graça que ele lhe concede para lidar com eles.\n      A Bíblia diz: ... mas Deus cumpre a sua promessa e não deixará que vocês sofram tentações que\nvocês não têm forças para suportar?\n      Toda vez que você passa em um teste, Deus toma conhecimento e faz planos para recompensá-lo\nna eternidade.\n      Tiago diz: Felizes são aqueles que perseveram quando são testados. Depois de serem aprovados,\neles receberão a coroa da vida que Deus prometeu aos que o amam.\n      A vida na terra é uma incumbência de confiança.\n      Essa é a segunda metáfora bíblica da vida.\n      Nosso tempo sobre a terra, nossa energia, inteligência, oportunidades, relacionamento e recursos\nsão dádivas que Deus nos confiou para cuidarmos e administramos.\n      Somos mordomos de tudo quanto Deus nos dá. Esse conceito de mordomia começa com o\nreconhecimento de que Deus é o dono de tudo e de todos na terra.\n      A Bíblia diz: Ao Senhor Deus pertencem o mundo e tudo o que nele existe; a terra e todos os\nseres vivos que nela vivem são dele.\n      Nós nunca realmente possuímos qualquer coisa durante nosso breve período na terra.\n      Deus apenas nos empresta a terra enquanto estamos aqui. Ela já era propriedade de Deus antes\nque você chegasse, e Deus irá emprestá-la a outra pessoa depois que você morrer.\n      Tudo que você pode fazer é desfrutá-la por algum tempo.\n\n                                                                                   Igreja de Vencedores\n\n       Quando Deus criou Adão e Eva, confiou a eles os cuidados de sua criação e os nomeou\nadministradores de sua propriedade.\n       A Bíblia diz: ... e os abençoou dizendo: — Tenham muitos e muitos filhos; espalhem-se por toda\na terra e a dominem. E tenham poder sobre os peixes do mar, sobre as aves que voam no ar e sobre os\nanimais que se arrastam pelo chão.\n       O primeiro serviço que Deus deu aos humanos foi administrar e cuidar das \"coisas\" dele sobre a\nterra.\n       Dessa função o homem jamais foi exonerado. E é parte de nosso propósito atualmente.\n       Tudo de que nós desfrutamos deve ser tratado como uma incumbência de confiança que Deus nos\npôs nas mãos.\n       A Bíblia diz: Vocês têm alguma coisa que não tenha sido dada por Deus? E se tudo o que vocês\ntêm vem de Deus, por que vocês se vangloriam como se tivessem realizado alguma coisa por si\npróprios?\n       Na parábola dos talentos, um homem de negócios confiou sua riqueza ao cuida dos servos\nenquanto estava fora.\n       Quando retornou, avaliou a responsabilidade de cada servo e recompensou a cada um conforme\nmereciam.\n       O dono diz: Muito bem, servo bom e fiel! Você foi fiel no pouco, eu o porei sobre o muito. Venha\ne participe da alegria do seu senhor!\n        Ao fim de sua vida sobre a terra, você será avaliado e recompensado conforme seu desempenho\nao lidar com o que Deus lhe confiou. Isso significa que tudo que você faz, mesmo uma simples tarefa\ndiária, tem implicações eternas.\n       A maioria das pessoas não consegue perceber que o dinheiro é tanto um teste quanto uma\nincumbência de confiança dada por Deus.\n       Deus usa a área financeira para nos ensinar a confiar nele. E, para muitas pessoas, o dinheiro é o\nmaior de todos os testes.\n       Deus observa a forma em que usamos o dinheiro para testar quão confiáveis somos.\n       A Bíblia diz: Se vocês forem indignos de confiança em relação às riquezas deste mundo, quem\nlhes confiará as verdadeiras riquezas celestiais?\n       Essa é uma verdade muito importante. (\"Riquezas deste mundo\") determina quanto Deus pode\nconfiar em mim com as bênçãos espirituais (\"verdadeiras riquezas\").\n       Deixe-me perguntar: \"A forma de você administrar o seu dinheiro está impedindo Deus de fazer\nmais em sua vida?\n       Você pode ser incumbido de riquezas espirituais?\".\n       Jesus disse: A quem muito foi dado, muito será exigido; e a quem muito foi confiado, muito mais\nserá pedido.\n        A vida é um teste e uma incumbência de confiança, e quanto mais Deus lhe dá, mais responsável\nele espera que você seja.\n\n         III. A vida na terra é uma atribuição temporária.\n\n         Senhor lembra-me de quão breve é o meu tempo na terra.\n         Lembra-me que os meus dias estão numerados e que a minha vida está indo embora. Salmos 39.4\n         Estou aqui na terra só por um pouco de tempo. Salmos 119.19\n         A Bíblia é cheia de metáforas que ensinam a respeito da natureza breve e transitória da vida na\nterra.\n         A vida é descrita como uma neblina, um corredor rápido, um sopro e um fio de fumaça.\n         A Bíblia diz:... nossos dias sobre a terra são tão transitórios como uma sombra.\n\nPara usar sua vida da melhor forma possível, você não deve nunca esquecer duas verdades.\n      Primeira: em comparação com a eternidade, a vida é extremamente breve.\n      Segunda: a terra é apenas uma residência temporária. Você não ficará aqui por muito tempo,\nentão não fique muito apegado.\n      Peça a Deus que o ajude a ver a vida na terra como ele a vê.\n      Davi orou: Então finalmente pedi a Deus: Senhor, mostra-me o pouco tempo que me resta aqui\nna terra. Mostra-me como a vida é curta e eu sou frágil.\n      A Bíblia compara por várias vezes a vida na terra a uma habitação temporária em um país\nestrangeiro.\n      Aqui não é seu lar permanente nem seu destino final.\n      Você só está de passagem, apenas visitando.\n      A Bíblia usa termos como forasteiro, peregrino, estrangeiro, estranho, visitante e viajante para\ndescrever nossa breve estadia na terra.\n      Davi disse: Viverei poucos anos aqui na terra. E Pedro explicou: Se vocês chamam a Deus de\nPai, levem a vida como residentes temporários na terra.\n      Muitas pessoas se mudaram de outras partes do mundo para trabalhar em outro país, mas elas\nainda são cidadãs de seu país de origem.\n      Os cristãos devem lembrar que a sua cidadania é no céu.\n      Deus diz que seus filhos devem pensar a respeito da vida de modo diferente dos que não são\ncristãos.\n      Tudo o que eles pensam é sobre esta vida aqui na terra. Os verdadeiros cristãos compreendem\nque há muito mais para viver do que os poucos anos que passamos neste planeta.\n      A nossa identidade está na eternidade, e a nossa pátria é o céu.\n      Quando flertamos com as tentações deste mundo, Deus chama isso de adultério espiritual.\n      Imagine que você tenha sido convidado por seu país para atuar como embaixador em uma nação\ninimiga.\n      Você provavelmente teria de aprender outra língua e adaptar-se a alguns costumes e diferenças\nculturais, a fim de ser cortês e cumprir sua missão.\n      Na função de embaixador, você não teria como se isolar do inimigo.\n      Visando a cumprir sua missão, você teria de ter contato e se relacionar com o inimigo.\n      Mas suponhamos que você se sentisse tão à vontade nesse país que se apaixonasse por ele,\npreferindo-o à sua terra natal.\n      Seu comprometimento e lealdade seriam alterados. Sua atuação como embaixador ficaria\ncomprometida. Em vez de representar sua terra natal, você começaria a agir como o inimigo.\n      Você seria um traidor.\n      A Bíblia diz: Somos embaixadores de Cristo. Lamentavelmente, muitos cristãos têm traído seu\nRei e seu Reino. Eles têm estupidamente chegado à conclusão de que, por viverem na terra, aqui é o\nseu lar.\n      Aqui não é o seu lar.\n      A Bíblia é clara: Amigos, este mundo não é o seu lar, então não fiquem à vontade. Não\nsatisfaçam o ego em prejuízo da alma.\n      Deus não quer que fiquemos apegados ao que está a nossa volta, porque é uma situação\ntemporária.\n      Já fomos avisados de que os que têm um contato freqüente com as coisas deste mundo devem\nusá-las corretamente sem criar apego; pois este mundo e tudo o que está nele passarão.\n      Em comparação com outros séculos, a vida nunca foi tão fácil para grande parte do mundo\nocidental.\n      Somos frequentemente entretidos, divertidos e servidos.\n\n                                                                                    Igreja de Vencedores\n\n      Com todas as fascinantes atrações, mídia cativante e agradáveis experiências disponíveis hoje em\ndia, é fácil esquecer que a vida não consiste em perseguir a felicidade.\n      É somente ao lembrarmos que a vida é um teste, uma incumbência de confiança e uma atribuição\ntemporária que o encanto dessas coisas perderão o domínio sobre nossa vida.\n      Estamos nos preparando para algo ainda melhor. As coisas que vemos agora estão aqui hoje e\namanhã se foram. Mas as coisas que não podemos ver (coisas espirituais) agora vão durar para\nsempre.\n      O fato de a terra não ser nosso lar definitivo explica por que, como seguidores de Jesus,\nexperimentamos dificuldades, aflições e rejeições neste mundo.\n       Isso também explica por que algumas promessas de Deus parecem não terem sido cumpridas,\nalgumas orações parecem não-respondidas e algumas situações parecem injustas.\n      Esse não é o final da história.\n      Para impedir que fiquemos muito apegados à terra, Deus nos permite sentir uma substancial\nquantidade de descontentamentos e desgostos na vida — anseios que jamais serão satisfeitos deste lado\nda eternidade.\n      Não somos completamente felizes porque não era para sermos! A terra não é nosso lar definitivo;\nfomos criados para algo muito melhor.\n      Um peixe nunca seria feliz vivendo em terra, porque foi feito para viver na água. Uma águia\njamais poderia ficar contente se não lhe fosse permitido voar. Você nunca se sentirá plenamente\nsatisfeito na terra, porque foi feito para algo mais.\n      Você terá momentos felizes por aqui, mas nada comparado ao que Deus tem planejado para você.\n      Perceber que a vida na terra é apenas uma atribuição temporária alteraria completamente os seus\nvalores. Valores eternos, e não temporários, se tornariam fatores determinantes em suas decisões.\n      Tudo o que não é eterno é eternamente inútil.\n      A Bíblia diz: Assim, fixamos os olhos, não naquilo que se vê, mas no que não se vê, pois o que se\nvê é transitório, mas o que não se vê é eterno.\n      Quando a vida fica difícil e você é subjugado pelas dúvidas, ou quando fica imaginando se viver\npara Cristo vale o esforço, lembre-se de que você ainda não chegou em casa. Na morte, você não vai\nabandonar sua casa — você vai para casa.\n\n    COMENTE O QUE MAIS CHAMOU A SUA ATENÇÃO:\n    ______________________________________________________________________________\n__________________________________________________________________________________\n__________________________________________________________________________________", "quiz": [{"q": "Qual é o texto bíblico-base da lição \"CRIADO PARA SER ETERNO\"?", "options": ["Colossenses 2.6", "1 Pe 4: 10, 11", "Eclesiastes 3.11", "Salmo 32; Oséias 2:14; Jeremias 17:9-10; 24:7"], "answer": 2}, {"q": "Qual destes é um dos tópicos estudados na lição \"CRIADO PARA SER ETERNO\"?", "options": ["Na Nova Vida Em Cristo Eu Devo Ser Fiel", "Proibição Em Doar Sangue", "A Vida Na Terra É Uma Atribuição Temporária", "Você Deve Formar A Equipe De Lideres Em Treinamento Com Propósitos"], "answer": 2}, {"q": "Qual destes tópicos NÃO faz parte da lição \"CRIADO PARA SER ETERNO\"?", "options": ["Enxergando A Vida Do Ponto De Vista De Deus", "A Vida Na Terra É Um Teste", "O Que Dirige Sua Vida?", "A Vida Na Terra É Uma Atribuição Temporária"], "answer": 2}]}, {"num": 23, "title": "A RAZÃO DE TUDO", "verseRef": "Romanos 11.36", "content": "INTRODUÇÃO\n\n      Tudo isso é para ele.\n      O objetivo fundamental do universo é demonstrar a glória de Deus. Essa é a razão de tudo que\nexiste, incluindo você. Deus fez tudo isso para a glória dele.\n      Se não fosse a glória de Deus, não haveria nada.\n      O que é a glória de Deus? A glória de Deus é o que ele é. É a essência de sua natureza, o peso de\nsua importância, o brilho de seu esplendor, a demonstração de seu poder e o ambiente de sua presença.\n      A glória de Deus é a expressão de sua bondade e de todas as suas outras qualidades próprias e\neternas.\n      Onde está a glória de Deus? Basta olhar em volta.\n      Tudo que foi criado por Deus reflete sua glória de alguma forma. Vemos isso em toda parte: da\nmenor forma de vida microscópica até a Via Láctea; do pôr-do-sol e das estrelas às tempestades e\nestações do ano.\n      A criação dá a conhecer a glória de nosso Criador.\n      Na natureza, aprendemos que Deus é poderoso, aprecia a variedade, ama a beleza e é organizado,\nsábio e criativo.\n      A Bíblia diz que os céus declaram a glória de Deus.\n      Ao longo da história, Deus tem revelado sua glória às pessoas em diferentes ambientes.\n      Ele a revelou inicialmente no jardim do Éden, depois disso a Moisés, no Tabernáculo, no Templo,\npor meio de Jesus e agora por intermédio da igreja, aqui representada pelo Aprisco Igreja de\nVencedores.\n      A gloria de Deus foi descrito como um fogo consumidor, uma nuvem, um trovão, uma fumaça e\numa luz brilhante. No céu, a glória de Deus fornece toda a luz necessária.\n      A Bíblia diz: A cidade não precisa de sol nem de lua para brilharem sobre ela, pois a glória de\nDeus a ilumina.\n      A glória de Deus é mais bem observada em Jesus Cristo. Ele, a Luz do mundo, esclarece a\nnatureza de Deus.\n      Graças a Jesus, já não somos ignorantes a respeito de quem Deus realmente é.\n      A Bíblia diz: O Filho é o resplendor da glória de Deus.\n      Jesus veio à terra de modo que pudéssemos entender completamente a glória de Deus. Aquele que\né a Palavra tornou-se carne e viveu entre nós. Vimos a sua glória... Cheio de graça e de verdade.\n      Ele possui uma glória inerente a Deus porque ele é Deus; faz parte de sua natureza.\n      Não há nada que possamos agregar à sua glória, assim como seria impossível aumentar o brilho\ndo sol; mas somos instruídos a reconhecer sua glória, honrar sua glória, declarar sua glória, louvar sua\nglória, refletir sua glória e viver por sua glória.\n       Por quê? Porque Deus merece! Nós lhe devemos toda a honra que pudermos dar.\n      Uma vez que Deus fez todas as coisas, ele merece toda a glória.\n      A Bíblia diz: Tu, Senhor e Deus nosso, és digno de receber a glória, a honra e o poder, porque\ncriaste todas as coisas.\n      Em todo o universo, somente duas das criações de Deus falham em glorificá-lo: anjos caídos\n(demônios) e nós (pessoas).\n\n                                                                                    Igreja de Vencedores\n\n     Todo pecado, basicamente, consiste na incapacidade de dar glória a Deus, ou seja, amando\nqualquer outra coisa mais do que a Deus.\n     Recusar-se a dar glória a Deus é rebelião e arrogância, e foi este pecado que causou a queda de\nSatanás — bem como a nossa.\n     De formas diferentes, todos já vivemos para nossa própria glória, e não a de Deus.\n     A Bíblia diz: Pois todos pecaram e estão destituídos da glória de Deus.\n     Nenhum de nós tem dado a Deus toda a glória que ele merece em nossa vida. Esse é o pior\npecado, e o maior engano que podemos cometer.\n     Entretanto, viver para a glória dele é a maior realização que podemos alcançar em nossa vida.\n     Deus diz: Todos eles são o meu próprio povo; eu os criei e lhes dei vida a fim de que mostrem a\nminha grandeza, logo, esse deve ser o objetivo supremo de nossa vida.\n\n     I. Como posso dar glória a Deus?\n     Jesus disse ao Pai: O Senhor criou todas as coisas para os seus próprios propósitos.\n     Jesus glorificou a Deus cumprindo seu propósito na terra. Nós honramos a Deus da mesma forma.\n     Qualquer coisa na criação glorifica a Deus quando cumpre seu propósito.\n     Os pássaros glorificam a Deus ao voar, fazer um ninho e ao realizar ou trás atividades próprias\ndos pássaros, conforme os planos de Deus.\n     Mesmo uma humilde formiga dá glória a Deus quando cumpre o propósito para o qual foi criada.\nDeus fez as formigas para serem formigas, e fez você para ser você.\n     A glória de Deus é um ser humano em plenitude de vida!\n     Existem muitas formas de dar glória a Deus, mas elas podem ser resumidas nos cinco propósitos\nque ele estabeleceu para sua vida.\n\n     II. Damos glória a Deus ao adorá-lo.\n     Adorar é o nosso primeiro dever para com Deus, e nós o adoramos ao                apreciá-lo.\n     Deus deseja que nossa adoração seja motivada por amor, ação de graças e alegria.\n     Adorar é muito mais que louvar, cantar e orar a Deus. É um estilo de vida que compreende\napreciar a Deus, amá-lo e nos doar para sermos usados em seus propósitos.\n     Quando você usa sua vida para a glória de Deus, tudo que faz pode se tornar um ato de adoração.\n     A Bíblia diz: Usem o seu corpo inteiro como instrumento para fazer o que é justo, para a glória\nde Deus.\n\n     III. Damos glória a Deus ao amar outros cristãos.\n     Quando nasceu de novo, você se tornou parte da família de Deus.\n     Seguir a Cristo não é apenas uma questão de acreditar, mas também inclui pertencer e aprender a\namar a família de Deus, sua igreja, o Aprisco Igreja de Vencedores.\n     João escreveu: Sabemos que já passamos da morte para a vida porque amamos nossos irmãos.\n      Paulo disse: Aceitem-se uns aos outros, da mesma forma que Cristo os aceitou, a fim de que\nvocês glorifiquem a Deus.\n     É sua responsabilidade aprender a amar como Deus ama, porque Deus é amor, e isso confere\nhonra a ele.\n     Jesus disse: Amem-se uns aos outros. Como eu os amei, vocês devem amar-se uns aos outros.\n\n     IV. Damos glória a Deus ao nos tornar como Cristo.\n     Uma vez que tenhamos nascido na família de Deus, ele quer que prossigamos crescendo até a\nmaturidade espiritual. E o que seria isso?\n     Maturidade espiritual é nos tornar como Jesus na forma de pensar, de sentir e de agir.\n\nQuanto mais você desenvolver o caráter cristão, mais dará glória a Deus.\n      A Bíblia diz: À medida que o Espírito do Senhor trabalha em nós, tornamo-nos mais e mais\nsemelhantes a ele e refletimos a sua glória ainda mais.\n      Quando você aceitou a Cristo, Deus lhe deu nova vida e nova natureza. Agora, pelo resto de sua\nvida sobre a terra, Deus quer dar continuidade ao processo de transformação de sua personalidade.\n      A Bíblia diz: Que vocês estejam sempre cheios do fruto da salvação de vocês — aquelas coisas\nboas produzidas na sua vida por Jesus Cristo —, pois isso trará muita glória e louvor a Deus.\n\n      V. Damos glória a Deus servindo a outras pessoas com nossos dons.\n      Cada um de nós foi exclusivamente planejado por Deus com talentos, dons, capacidades e\nhabilidades.\n      O modo de você estar relacionado aos outros não é um acidente; Deus não lhe deu suas\nhabilidades para propósitos egoístas.\n      Elas lhe foram concedidas para beneficiar outras pessoas, assim como outros receberam\nhabilidades para o seu benefício.\n      A Bíblia diz: Deus concedeu dons a cada um de vocês, dentre a sua grande variedade de dons\nespirituais.\n      Administrem bem os dons, para que a generosidade de Deus flua por meio de vocês.\n      Vocês são chamados para ajudar aos outros? Ajudem com toda a força e energia com que Deus\nlhes dá.\n\n     VI. Damos glória a Deus falando dele às outras pessoas.\n\n     Deus não quer que seu amor e propósitos sejam mantidos em segredo. Uma vez que tenhamos\nconhecido a verdade, ele espera que a partilhemos com os outros.\n      Este é um enorme privilégio — apresentar Jesus às outras pessoas, ajudando-as á descobrir seus\npropósitos e preparando-as para seu destino eterno.\n     A Bíblia diz que, à medida que a graça de Deus trouxer mais e mais pessoas para Cristo, Deus\nreceberá mais e mais glória.\n\n      VII. Qual será o objetivo de sua vida?\n      Viver o resto de sua vida para a glória de Deus exigirá uma mudança em suas prioridades,\nagenda, relacionamentos e tudo o mais; e algumas vezes significará pegar o caminho mais difícil, em\nvez do mais fácil.\n      Até mesmo Jesus teve dificuldades com isso. Consciente de que estava para ser crucificado, ele\nclamou: Minha alma está perturbada; e será que devo dizer: \"Pai, livra-me desta hora\"? Mas, foi\npara esse propósito que eu vim para esta hora. Pai, glorifica o teu nome.\n      Jesus deparou com uma divisão em seu caminho: cumpriria ele seu propósito, glorificando a\nDeus, ou recuaria e viveria uma vida confortável e egoísta?\n      Você agora enfrenta a mesma escolha.\n      Você viverá para seus próprios objetivos, conforto e prazer ou viverá o resto de sua vida para a\nglória de Deus, sabendo que ele prometeu recompensas eternas?\n      A Bíblia diz: Quem quer preservar a vida como ela é acaba por destruí-la. Mas, se você abrir\nmão dela, ela será sua para sempre, real e eterna.\n      Este é o momento de definir esta questão: \"Para quem você irá viver: para si ou para Deus?\".\nVocê pode decidir, imaginando se terá forças para viver para Deus, mas não se preocupe. Deus lhe dará\ntudo que for necessário, se você apenas fizer a escolha de viver por ele.\n\n                                                                                   Igreja de Vencedores\n\n      A Bíblia diz: Tudo que é necessário para uma vida agradável a Deus temos recebido,\nmiraculosamente, por meio do conhecimento pessoal e íntimo daquele que nos chamou para Deus.\n      Neste exato momento, Deus o está convidando a viver para sua glória, cumprindo os propósitos\nque ele estabeleceu para você. Essa é realmente a única forma de viver.\n      Todo o resto é apenas existir. A verdadeira vida começa quando você se compromete\ncompletamente com Jesus Cristo.\n      A Bíblia deixa clara a promessa que aos que o receberam, aos que creram em seu nome, deu-lhes\no direito de se tornarem filhos de Deus. E quanto a você? Vai aceitar a oferta de Deus?\n      Em primeiro lugar, creia. Creia que Deus o ama, e o criou para seus propósitos. Creia que você\nnão é um acidente. Creia que você foi feito para ser eterno. Creia que Deus escolheu você para ter um\nrelacionamento com Jesus, o qual morreu na cruz por você.\n      Creia que, a respeito de suas ações passadas, Deus quer perdoar a você.\n      Em segundo lugar, receba. Receba Jesus em sua vida como seu Senhor e Salvador. Receba o\nperdão pelos pecados. Receba o Espírito Santo, que lhe dará poder para cumprir o propósito de sua\nvida.\n      A Bíblia diz: Qualquer pessoa que aceite o Filho e confie nele receberá tudo, vida completa e\npara sempre. Hoje aqui e agora, convido-o a inclinar a cabeça e a fazer em voz baixa a oração que\nmudará sua eternidade:\n      \"Jesus, em ti eu creio e te recebo\". Siga em frente.\n      Se você fez essa oração com sinceridade, meus parabéns! Bem vindo à família de Deus! Bem\nVindo ao Aprisco Igreja de Vencedores! Você agora está pronto para descobrir e começar a viver o\npropósito de Deus para sua vida.\n\n      VIII. Você foi planejado para agradar a Deus\n      No instante em que você nasceu neste mundo, Deus estava lá como testemunha invisível,\nsorrindo ao assistir seu nascimento. Ele quis que você vivesse, e sua chegada lhe deu enorme prazer.\n      Deus não precisava criar você, mas escolheu criá-lo para a satisfação dele.\n      Você existe para benefício, glória, propósito e prazer de Deus.\n      Dar satisfação a Deus, vivendo para seu prazer, é o primeiro propósito de sua vida. Quando\nvocê tiver compreendido plenamente essa verdade, jamais voltará a se sentir insignificante, pois isso\nprova o valor que você tem.\n      Se você é tão importante para Deus, e ele o considera valioso o suficiente para mantê-lo consigo\npor toda a eternidade, que maior importância você poderia alcançar? Você é um filho de Deus e\nproporciona prazer ao coração dele como nada mais que ele já tenha criado.\n      A Bíblia diz: Deus já havia resolvido que nos tornaria seus filhos, por meio de Jesus Cristo, pois\neste era o seu prazer e a sua vontade.\n      Um dos maiores dons que Deus lhe deu foi a capacidade de apreciar o prazer. Ele o dotou com\ncinco sentidos e emoções, para que você pudesse experimentá-lo.\n      Ele deseja que você aprecie a vida, não se limitando a apenas suportá-la. O motivo pelo qual você\npode sentir prazer é que Deus o fez à sua imagem.\n      Nós nos esquecemos com frequência de que Deus também tem emoções. Ele possui sentimentos\nintensos.\n      A Bíblia diz que Deus sofre, fica enciumado e sente compaixão e piedade, bem como alegria,\nregozijo e satisfação.\n      Deus ama, se deleita, sente prazer, exulta, desfruta e até mesmo rir.\n\n     IX. Dar prazer a Deus é o que se chama \"adorar\".\n     A Bíblia diz: O Senhor se agrada somente daqueles que o adoram e confiam em seu amor.\n\nQualquer atitude sua que venha agradar a Deus é um ato de adoração. Como o diamante, a\nadoração apresenta várias facetas.\n      Os antropólogos perceberam que a adoração é um impulso universal, posto por Deus na estrutura\nde nosso ser — uma necessidade própria de nos ligarmos a Deus.\n      Adorar é tão natural quanto comer e respirar. Quando não conseguimos adorar a Deus, sempre\nachamos um substituto, ainda que no fim sejamos nós mesmos.\n      A razão pela qual Deus nos fez com esse desejo é que ele anseia por adoradores!\n      Jesus disse: São estes os adoradores que o Pai procura.\n      Dependendo de sua formação religiosa, pode ser que você precise ampliar sua compreensão do\ntermo \"adorar\".\n      Você talvez imagine cultos na igreja em que haja cânticos, orações e se escute uma pregação ou\ntalvez você imagine um cerimonial, velas e uma ceia ou talvez ainda imagine curas, milagres e\nexperiências arrebatadoras.\n      A adoração pode incluir esses elementos, mas vai muito além dessas manifestações. Adorar é um\nestilo de vida.\n\n      X. Adoração é muito mais do que música.\n      Todos os momentos do culto em uma igreja são um ato de adoração: a oração, a leitura da Bíblia,\nos cânticos, a declaração de fé, o silêncio, manter-se quieto, ouvir uma pregação, tomar notas, ofertar,\nentregar o Dízimo a Casa do Senhor, ser fiel, não murmurar contra os lideres e a igreja, tudo isso tem\nhaver com adoração.\n      Na verdade, a adoração é anterior à música.\n      Adão adorou no jardim do Éden, mas não há nenhuma menção à música antes de Gênesis 4.21,\ncom o nascimento de Jubal.\n      Se adoração fosse somente música, então os que nunca se utilizaram da música jamais adoraram.\nAdoração é muito mais do que música.\n      Adoração não tem relação com o estilo, volume ou andamento da música. Deus ama todos os\ntipos de música porque ele inventou todas — rápidas e lentas, altas e suaves, antigas e modernas. É\nprovável que você não goste de todas, mas Deus gosta!\n      Se ela é oferecida a Deus em espírito e em verdade, então é um ato de adoração.\n      Os cristãos frequentemente discordam quanto ao estilo de música a ser utilizado na adoração,\ndefendendo apaixonadamente seus estilos preferidos como se fossem os mais bíblicos ou reverentes a\nDeus. Mas não existe um estilo bíblico!\n\n      XI. A adoração não é parte de sua vida; ela é a sua vida.\n      Não o adore somente nos cultos na igreja, pois nos foi dito: Procurem a ajuda do Senhor; estejam\nsempre na sua presença e Cantem glórias e louvem ao Senhor desde o nascer até o pôr-do-sol.\n      Na Bíblia, as pessoas louvavam a Deus no trabalho, em casa, na batalha, na prisão e até mesmo\nna cama! Louvar deveria ser sua primeira atividade, assim que abrisse os olhos pela manhã, e sua\núltima atividade, ao fechá-los à noite.\n      Davi disse: Eu agradecerei ao Senhor o tempo todo. Minha boca sempre o louvará.\n      Cada atividade pode ser transformada em ato de adoração, quando você a faz para louvar,\nglorificar e agradar a Deus.\n      A Bíblia diz: Assim, quer vocês comam, bebam ou façam qualquer outra coisa, façam tudo para\na glória de Deus.\n\n                                                                                     Igreja de Vencedores\n\n      XII. A essência da adoração é a rendição.\n      Render-se a Deus é a essência da adoração; é uma resposta natural ao maravilhoso amor e à\nmisericórdia de Deus.\n      Nós nos entregamos a ele não por medo ou obrigação, mas por amor, porque ele nos amou\nprimeiro.\n      Após passar onze capítulos do livro de Romanos explicando a respeito da incrível graça de Deus\npara conosco, Paulo nos exorta a render nossa vida completamente a Deus em adoração:\n      Portanto, meus irmãos, por causa da grande misericórdia divina, peço que vocês se ofereçam\ncompletamente a Deus como um sacrifício vivo, dedicado ao seu serviço e agradável a ele.\n      Esta é a verdadeira adoração que vocês devem oferecer a Deus.\n      A verdadeira adoração — agradar a Deus — acontece quando você se entrega totalmente a ele.\n      Repare que a primeira e a última palavra desse versículo são a mesma: oferecer.\n      A adoração consiste exatamente em oferecer-se a Deus.\n      O ato da rendição pessoal é conhecido de muitas formas: consagração, fazer de Jesus o seu\nSenhor, carregar a cruz, morrer para si próprio, submeter-se ao Espírito Santo.\n      O que interessa é você fazê-lo, e não a forma de você chamar esse ato. Deus quer a sua vida —\ntoda ela; 95% não é o suficiente.\n      O que significa rendição. Render-se a Deus significa sacrificar a vida ou sofrer, a fim de mudar o\nque precisa ser mudado.\n      Deus frequentemente chama pessoas que se entregaram a ele, para batalhar em seu nome; render-\nse não é para covardes ou bajuladores.\n      Do mesmo modo, não significa desistir do raciocínio lógico; Deus não desperdiçaria a mente que\nlhe concedeu! Deus não quer ser servido por robôs.\n      A rendição se manifesta mais claramente na obediência e na confiança. Você diz \"Sim, Senhor\" a\ntudo o que ele lhe pede; dizer \"Não, Senhor\" seria uma contradição.\n      Você não pode chamar a Jesus de Senhor, quando se recusa a obedecer. Após uma noite de\nfracassos na pescaria, Pedro foi um exemplo de rendição quando Jesus lhe mandou tentar novamente:\nMestre, esforçamo-nos a noite inteira e não pegamos nada. Mas, porque és tu quem está dizendo isto,\nvou lançar as redes.\n      Pessoas que se entregaram a Cristo obedecem à Palavra de Deus mesmo que ela não faça\nsentido.\n\n    COMENTE O QUE MAIS CHAMOU A SUA ATENÇÃO:\n    ______________________________________________________________________________\n__________________________________________________________________________________\n__________________________________________________________________________________", "quiz": [{"q": "Qual é o texto bíblico-base da lição \"A RAZÃO DE TUDO\"?", "options": ["Filipenses 2.8", "Mateus 6:9-15; Lucas 11:1-4; II Crônicas 7:14", "Marcos 16.15", "Romanos 11.36"], "answer": 3}, {"q": "Qual destes é um dos tópicos estudados na lição \"A RAZÃO DE TUDO\"?", "options": ["Você Está Tão Perto De Deus Quanto Imagina", "Você Deve Formar A Equipe De Lideres Em Treinamento Com Propósitos", "Virtudes Ou Qualidades Do Fruto Do Espirito", "Damos Glória A Deus Ao Adorá-Lo"], "answer": 3}, {"q": "Qual destes tópicos NÃO faz parte da lição \"A RAZÃO DE TUDO\"?", "options": ["Damos Glória A Deus Ao Adorá-Lo", "O Que É Mordomo?", "Damos Glória A Deus Servindo A Outras Pessoas Com Nossos Dons", "A Adoração Não É Parte De Sua Vida; Ela É A Sua Vida"], "answer": 1}]}, {"num": 24, "title": "SENDO AMIGO DE DEUS", "verseRef": "João 15.15", "content": "INTRODUÇÃO\n\n      Deus quer ser o seu melhor amigo.\n      O seu relacionamento com Deus tem muitos e variados aspectos: Deus é seu Autor e Criador,\nSenhor e Mestre, Juiz, Redentor, Pai, Salvador e muito mais.\n      Porém, a mais espantosa verdade é esta: o Deus todo-poderoso anseia ser seu amigo!\n      No Éden, vemos o relacionamento ideal de Deus para conosco. Adão e Eva desfrutavam de uma\namizade íntima com Deus.\n      Não existiam rituais, cerimônias ou religião — apenas um simples e carinhoso relacionamento\nentre Deus e as pessoas que ele criou.\n      Livres de culpas ou medos, Adão e Eva desfrutavam de Deus, e Deus desfrutava deles.\n      Fomos feitos para viver continuamente na presença de Deus, mas após a queda do homem aquele\nrelacionamento ideal foi perdido. Somente umas poucas pessoas no Antigo Testamento tiveram o\nprivilégio de uma amizade com Deus.\n      Moisés e Abraão foram chamados \"amigos de Deus\", Davi foi chamado \"um homem segundo o\ncoração de Deus\", e Jó, Enoque e Noé eram amigos íntimos de Deus. Entre tanto, medo de Deus, e não\namizade, eram mais comuns no Antigo Testamento.\n      Então Jesus mudou a situação. Quando pagou nossos pecados na cruz, o véu do Templo, que\nsimbolizava nossa separação de Deus, foi rasgado de cima para baixo; indicando que o acesso direto a\nDeus estava novamente disponível.\n      Ao contrário dos sacerdotes do Antigo Testamento, que tinham de passar horas se preparando\npara encontrá-lo, atualmente podemos chegar a Deus a qualquer instante.\n      A Bíblia diz: Podemos agora exultar em nosso maravilhoso novo relacionamento com Deus —\ntudo por causa do que nosso Senhor Jesus Cristo fez por nós, tornando-nos amigos de Deus.\n      Ter amizade com Deus só é possível por causa da graça de Deus e do sacrifício de Jesus. Tudo\nisso é feito por Deus, o qual, por meio de Cristo, nos transforma de inimigos em amigos dele.\n      Jesus disse: Já não os chamo servos, porque o servo não sabe o que O seu senhor faz. Em vez\ndisso, eu os tenho chamado amigos, porque tudo o que ouvi de meu Pai eu lhes tornei conhecido.\n      A palavra utilizada para \"amigo\" nesse versículo não significa uma relação superficial, mas um\nrelacionamento íntimo e de confiança. A mesma palavra é usada para se referir ao círculo de amigos\níntimos e de confiança de um rei.\n      Em uma corte real, os servos devem manter distância do rei, mas o círculo de amigos de\nconfiança desfruta de proximidade, acesso direto e informações confidenciais.\n      Deus deseja muito mesmo que o conheçamos profundamente. Na verdade, ele planejou o\nuniverso e orquestrou a história, incluindo os detalhes de nossa vida, para que nos tornássemos seus\namigos.\n      A Bíblia diz: Deus criou toda a raça humana e criou a terra habitável, com fartura de tempo e de\nespaço, a fim de que pudéssemos buscar a Deus; não só ficar como que apalpando no escuro, mas\nrealmente o encontrar.\n      É difícil imaginar uma amizade íntima entre um Deus perfeito, invisível e onipotente e um ser\nhumano limitado e pecador.\n\n                                                                                   Igreja de Vencedores\n\n    Não é tão difícil compreender um relacionamento de Mestre para servo, Criador para criatura ou\nmesmo de Pai para filho; mas o que quer dizer o fato de Deus me querer como amigo?\n    Olhando a vida dos amigos de Deus na Bíblia, aprendemos alguns segredos para uma amizade\ncom Deus.\n\n     I. Tornando-se amigo de Deus - Conversando constantemente.\n     Você jamais cultivará um relacionamento íntimo com Deus apenas indo à igreja uma vez por\nsemana ou mesmo tendo um período de busca diária.\n     Uma amizade com Deus é construída ao partilharmos com ele todas as nossas experiências.\n     É lógico que é importante estabelecer o hábito de um momento diário consagrado a Deus, mas ele\nquer mais que um compromisso na sua agenda. Ele quer ser incluído em todas as atividades, todas as\nconversas, todos os problemas e até mesmo em todos os pensamentos.\n     Você pode manter uma conversa contínua e ilimitada com ele ao longo do dia, conversando sobre\no que quer que você esteja fazendo ou pensando no momento.\n     Orar continuamente significa conversar com Deus enquanto faço compras, trabalho ou realizo\nqualquer outra tarefa diária.\n     A Bíblia nos diz: Orem continuamente.\n     Como isso é possível? Uma forma é utilizar \"orações de um fôlego\" ao longo do dia, como\nmuitos cristãos têm feito durante séculos.\n     Você escolhe uma frase curta que pode ser repetida para Jesus em uma respiração: \"Tu estás\ncomigo\"; \"Eu recebo a tua graça\"; \"Eu dependo de ti\"; \"Eu quero conhecer-te\"; \"Eu pertenço a ti\";\n\"Ajuda-me a confiar em ti\"; Você também pode usar uma frase curta da Bíblia: \"Para que eu viva em\nCristo\"; \"Jamais me deixarás\"; \"Tu és o meu Deus\".\n     Faça essas orações com a maior freqüência possível, de modo que fiquem profundamente\nenraizadas no seu coração. Apenas se assegure de que sua motiva ção é honrar a Deus, e não controlá-\nlo.\n     Praticar a presença de Deus é uma habilidade, um hábito que você pode desenvolver. Assim\ncomo os músicos praticam escalas diariamente, a fim de tocar belas músicas com facilidade, você deve\nse obrigar a pensar em Deus em diversos momentos do dia.\n     Você deve treinar sua mente a se lembrar de Deus.\n     Em primeiro lugar, você irá criar lembretes que restabeleçam regularmente a consciência de que\nDeus está com você naquele momento.\n     Comece dispondo lembretes visuais em torno de si. Você pode escrever pequenos bilhetes\ndizendo: \"Deus é comigo e por mim neste exato momento!\".\n     Em alguns momentos você sentirá a presença de Deus, em outros não.\n     Se você está buscando uma experiência com a presença de Deus por meio de tudo isso, então não\ncompreendeu o sentido disso tudo.\n     Nós não louvamos a Deus para nos sentirmos bem, mas para agirmos bem.\n     Seu objetivo não é uma sensação, mas uma consciência constante da realidade de que Deus está\nsempre presente.\n     Esse é o estilo da vida de adoração.\n\n      II. Através da meditação contínua.\n      A segunda forma de estabelecer amizade com Deus é pensar na sua Palavra durante todo o dia.\nIsso se chama meditação, e a Bíblia nos exorta repetidamente a meditar sobre quem Deus é, o que ele\nfez e o que ele disse.\n      É impossível ser amigo de Deus deixando de lado o conhecimento do que ele diz. Você não pode\namar a Deus a não ser que o conheça, e não pode conhecê-lo sem conhecer sua Palavra.\n\nA Bíblia diz que Deus se manifestava a Samuel... Pela palavra do Senhor, e Deus ainda hoje\nutiliza esse mesmo método.\n      Embora você não possa passar o dia inteiro estudando a Bíblia, pode pensar a seu respeito ao\nlongo do dia, recordar os versículos que leu ou decorou e refletir sobre eles.\n      A meditação é freqüentemente mal-interpretada como algum ritual misterioso e complicado,\npraticado por seitas e monges isolados. Mas meditar é simplesmente concentrar os pensamentos —\numa habilidade que pode ser adquirida por qualquer pessoa e posta em prática em qualquer situação.\n      Quando você se mantém pensando repetidamente sobre um problema, isso se chama\npreocupação.\n      Quando você se mantém pensando repetidamente na Palavra de Deus, isso se chama\nmeditação.\n      Se você sabe se preocupar, já sabe meditar! Basta que você desvie a atenção dos seus problemas\npara os versículos bíblicos.\n      Quanto mais você meditar na Palavra de Deus, menores serão suas preocupações.\n      A razão pela qual Deus considerava Jó e Davi amigos íntimos era o fato de eles valorizarem a sua\nPalavra acima de qualquer coisa e de pensarem nela continuamente durante todo o dia.\n      Jó reconheceu: Dei mais valor às palavras de sua boca do que ao meu pão de cada dia.\n      Davi disse: Como eu amo a tua lei! Medito nela o dia inteiro e Elas estão constantemente em\nmeus pensamentos. Não consigo parar de pensar nelas.\n      Amigos dividem segredos, e Deus irá partilhar com você os seus segredos, se você desenvolver o\nhábito de pensar em sua Palavra do princípio ao fim do dia.\n      Deus contou seus segredos a Abraão e fez o mesmo com Daniel, Paulo, os discípulos e outros\namigos.\n      Quando você ler a Bíblia ou á estuda, não cometa o erro de simplesmente \"deixar para lá\" e\nseguir em frente. Desenvolva a prática de ficar revisando a verdade em sua mente, pensando\ncontinuamente sobre ela.\n      Quanto mais tempo você repassar o que Deus disse, mais compreenderá os \"segredos\" desta vida\nque muitas pessoas deixam escapar.\n      A Bíblia diz: O Senhor é amigo chegado de quem o respeita e lhe obedece. A essas pessoas Ele\nrevela os segredos de seus planos.\n      Comece ainda hoje a praticar uma conversa constante com Deus e a meditar continuamente na\nsua Palavra.\n      As orações permitem que você fale com Deus; as meditações permitem que Deus fale com você.\nAmbas são essenciais para se tornar amigo de Deus.\n\n      III. Você está tão perto de Deus quanto imagina.\n      A exemplo de qualquer amizade, você deve se esforçar para desenvolver sua amizade com Deus.\nIsso não acontecerá por acidente.\n      É necessário querer, ter tempo e energia. Se você deseja um vínculo mais profundo e íntimo com\nDeus, deve aprender a partilhar de forma honesta com ele os seus sentimentos, ter confiança quando\nele lhe pedir para fazer algo, aprender a se importar com aquilo com que ele se importa e desejar sua\namizade mais do que qualquer outra coisa.\n      O primeiro elemento fundamental de uma amizade mais profunda com Deus é ser absolutamente\nsincero — a respeito de suas falhas e sentimentos.\n      Deus não espera que você seja perfeito, mas insiste em que você seja absolutamente sincero.\nNenhum dos amigos de Deus que aparecem na Bíblia era perfeito.\n      Se a perfeição fosse um requisito para a amizade com Deus, jamais poderíamos ser seus amigos.\nFelizmente, em virtude da graça de Deus, Jesus ainda é amigo de pecadores.\n\n                                                                                   Igreja de Vencedores\n\n      Na Bíblia, os amigos de Deus foram sinceros sobre seus sentimentos; frequentemente\nreclamando, criticando, acusando e discutindo com seu Criador.\n      Deus, entretanto, não parecia se aborrecer com sua franqueza; na verdade, ele a incentivava.\n      Deus permitiu que Abraão o questionasse e desafiasse a respeito da destruição de Sodoma.\nAbraão importunou a Deus sobre o que seria necessário para poupar a cidade, negociando desde\ncinquenta até somente dez pessoas justas.\n      Deus também escutou pacientemente a Davi, as muitas acusações de injustiça, traição e\nabandono.\n      Deus não destruiu Jeremias quando ele reclamou que Deus o havia enganado.\n      Jó pôde expressar sua amargura durante a provação, e no final Deus defendeu Jó por ser sincero e\nrepreendeu os amigos de Jó por serem falsos.\n      Deus lhes disse: Vocês não foram sinceros comigo ou a meu respeito; não da forma em que foi\nmeu amigo Jó... Meu amigo Jó agora orará por vocês e eu aceitarei sua oração.\n      Para ser amigo de Deus, você deve ser sincero com ele e dividir seus verdadeiros sentimentos, e\nnão o que você pensa que de
