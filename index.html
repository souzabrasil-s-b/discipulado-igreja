_______________\n\n4. Em que texto da Bíblia está registrado a única oração ensinada por Jesus?\n\n______________________________________________________________________________\n\n5. Qual a diferença entre orar e rezar?\n\n______________________________________________________________________________", "quiz": [{"q": "Qual é o texto bíblico-base da lição \"CONHECENDO O VALOR DA ORAÇÃO\"?", "options": ["Atos 2.41", "Tiago 5.17,18", "Atos 4.12", "2 Corintios 4.17"], "answer": 1}, {"q": "Qual destes é um dos tópicos estudados na lição \"CONHECENDO O VALOR DA ORAÇÃO\"?", "options": ["Exemplos De Pessoas Fiéis Nos Dizimos E Nas Ofertas", "Defina Ações Dos Demônios", "Vitórias Através Da Oração", "Estamos Debaixo De Que Autoridade Espiritual?"], "answer": 2}, {"q": "Qual destes tópicos NÃO faz parte da lição \"CONHECENDO O VALOR DA ORAÇÃO\"?", "options": ["O Que Significa Orar?", "Vitórias Através Da Oração", "Deus Utiliza Os Problemas Para Trazê-Lo Para Perto De Si", "Onde Orar?"], "answer": 2}]}, {"num": 6, "title": "O DISCIPULO E A FÉ", "verseRef": "Hebreus 11.1", "content": "TEXTO BÍBLICO\n\n     \"Ora, a fé é o firme firmamento das coisas que se esperam, e a prova das coisas que se não vêem\"\n(Hebreus 11.1).\n\n     COMENTÁRIO\n\n     INTRODUÇÃO\n\n      A melhor definição para fé é a do texto Bíblico que introduz este comentário. Nesta acepção, ela\né a base da esperança que faz o cristão seguir adiante, firmado nas promessas de Deus e deixando para\ntraz as dúvidas, incertezas e a incredulidade. Ela é o ponto de partida para o pecador conhecer ao\nSenhor e receber a salvação. Segundo o apostolo Paulo, a fé nasce na vida de cada um quando se ouve\na Palavra de Deus, que é também o alimento para que ela, a fé, se torne cada vez mais consolidada e\nrobustecida. Ter fé é vital para as relações do cristão com Deus. É impossível esta comunhão sem ela,\n\"porque é necessário que aquele que se aproxima de Deus creia que Ele existe, e que é galardoador dos\nque o buscam \"(Hebreus 11.6).\n\n1. A IMPORTÂNCIA DA FÉ\n\n     1. A fé no Antigo Testamento. Se você percorrer a Bíblia, de Gênesis a Apocalipse, vai\ndescobrir que ela é o livro que trata das relações do homem com Deus mediante a fé. A fé é de tal\nimportância que o capitulo 11 de Hebreus é considerado como a galeria dos heróis da fé. Eles viveram\nnos tempos do Antigo Testamento e estavam firmados nas promessas de Deus para o futuro. Leia\nHebreus 11.\n\n    Eles olhavam para a cruz, o divisor entre a velha e a nova aliança. Por causa de sua fé foram\nmassacrados, vituperados, perseguidos, mas em momento algum fraquejaram, pois estavam certos da\npromessa do nascimento de Jesus Cristo, não obstante a verem de longe.\n\n      2. A fé no Novo Testamento. Os cristãos da atualidade, segundo o escritor do mesmo livro\nbíblico citado acima, são mais bem-aventurados do que os do Antigo Testamento. No caso dos cristãos\nde hoje, a cruz já esta no passado, mas projeta com segurança o fato de que se Deus cumpriu a\npromessa que tanto os heróis da fé almejavam, mesmo que eles não a tenham fisicamente alcançado,\nDeus dará continuidade ao seu plano até que se consumem todas as coisas. Leia Hebreus 11.40.\n\n      Os servos de Deus do Antigo Testamento honraram a fé, e agora, como uma nuvem de\ntestemunhas [Hebreus 12.1], esperam que os cristãos de hoje, também, vão cumprir a sua parte. Só a fé\nos fez triunfar. Só a fé lhe fará triunfar.\n\n                                                                                   Igreja de Vencedores\n\n      3. A fé na vida cristã. Tudo quanto fizermos se não tiver a fé como base, não terá nenhum\nsentido. A Bíblia diz que aquilo que não se faz por fé constitui-se pecado (Romanos 14.23). \"Sem fé é\nimpossível agrada a Deus\" (Hebreus 11.6).\n\n      Por que a fé é tão importante na vida cristã? Porque se ela não estiver operando, a incredulidade\npredomina, gerando incertezas e fracassos. Quem duvida jamais realiza qualquer coisa para Deus. Este\nsentimento deixa o cristão indeciso, o que compromete o seu caminhar vitorioso, pois poderá agir\ncomo Pedro que, ao primeiro momento, deu passadas firmes sobre as águas do mar, mas logo começou\na afundar. A dúvida deixou-o sem saber se olha somente para Jesus ou para as circunstâncias adversas\nà sua volta.\n\n     4. O objeto da fé. Você vai aprender, agora, que a sua fé deve gravitar em torno da pessoa de\nJesus. O autor dos Hebreus, ao concluir a sua profunda reflexão sobre a fé, finaliza: \"Olhando para\nJesus, autor e consumador da fé, o qual pelo gozo que estava proposto suportou a cruz, desprezando a\nignomínia, e assentou-se à destra do torno de Deus\" (Hebreus 12.2).\n\n      A fé não pode esta direcionada para outro foco. Se for o caso, não é a fé legitima que se sustenta\nsó no filho de Deus. Por outro lado, não se trata da fé apenas por causa das obras que se realizou ou\npode realizar, mas daquela que se traduz na certeza pessoal dada a cada cristão não só para vencer\ncircunstâncias adversas, se esta for a sua vontade, mas também para você continuar a servi-lo, ainda\nque seja do agrado de Cristo que você passe pelo vale da sombra da morte. Neste caso, como disse\nPaulo, o morrer é ganho e significa o triunfo definitivo da fé. Foi a fé centrada na pessoa de Cristo que\nlevou os amigos de Daniel a enfrentarem a fornalha de fogo ardente. Eles criam no livramento, mas\ntambém criam que aquela circunstância poderia levá-los à presença de Deus. É tanto que disseram ao\nrei: \"Não necessitamos de te responder sobre este negocio. Eis que o nosso Deus, a quem nós servimos,\né que nos pode livrar; Ele nos livrará do forno de fogo ardente, e da tua mão, ó rei. E se não, fica\nsabendo, ó rei, que não servimos a teus deuses e nem adoraremos a estatua de ouro que levantaste\"\n(Daniel 3.17,18).\n\n      A visão de Nabucodonosor veio confirmar esta verdade. Ele viu o quarto homem na fornalha, que\nnão era outro senão o filho de Deus. Para os amigos de Daniel, então, não fazia diferença. Fora da\nfornalha tinham a proteção do Senhor, na fornalha Ele os acompanhava e se fossem levados para o céu,\nficariam para sempre na sua gloriosa e majestosa presença. Este é, portanto, é o foco da verdadeira fé:\nCristo.\n\nII. AS QUALIDADES DA FÉ\n\n     1. Fé para a salvação. Esta fé é aquela que leva o cristão a reconhecer os seus pecados e aceitar\no sacrifício de Cristo em seu lugar. Ela é o ponto de partida que introduz o cristão a vida ao novo\nnascimento. É como a centelha que da a partida para fazer funcionar o motor de qualquer veículo.\n\n     2. A fé vitoriosa. Você vai descobrir que, no exercício da vida cristã, a fé varia de intensidade. A\nBíblia fala de \"pouca fé\" (Mateus 6.30), \"tanta fé \"(Mateus 8.10), \"fé como um grão de mostarda\n\"(Mateus 17.20), \"homem cheio de fé\" (Atos 6.5) e sobre \"a medida da fé\" (Romanos 12.6). Isto\nexplica porque uns fazem coisas grandes para Deus, enquanto outros vivem uma vida cristã de menor\n\nintensidade. Significa que o trabalho de cada um será, também, proporcional ao tamanho de sua fé. Só\nfará grandes coisas para Deus quem tiver fé abundante e fundamentada nas promessas do Altíssimo.\n\n      3. Dom da fé. O dom da fé situa-se numa dimensão mais profunda. Trata-se de manifestação\nsobrenatural para a realização de maravilhas, sendo uma particularidade que o Espírito concede ao\ncristão para aquilo que for útil. Está entre os dons espirituais (1 Coríntios 12.11), assunto que você vai\nestudar mais detalhadamente na lição 11.\n\nIII. OS EFEITOS DA FÉ\n\n      1. A fé produz salvação. Já foi dito anteriormente que a fé é base para a salvação. Portanto, o\nponto focal da nossa responsabilidade, como cristão, é pregar o Evangelho para que os pecadores\nsejam tomados pela fé, reconheçam os seus pecados, confessem que Jesus é o filho de Deus e o\naceitem como único e suficiente salvador. Esta é a mensagem que você, como nova criatura, deve levar\naos seus amigos. Você precisa sentir a mesma ansiedade do apostolo Paulo, que afirmou: \"Ai de mim\nse não pregar o evangelho\". Ou seja, o amor de Cristo deve constrangê-lo a proclamar a palavra para\nproduzir fé nos ouvintes para salvação.\n\n      2. A fé produz segurança. Quem está em Cristo passa a viver em segurança, mesmo que as\ncircunstâncias à sua volta sejam adversas. Cabem, neste caso, as palavras do salmista: \"Pelo que não\ntemeremos, ainda que a terra se mude, e ainda que os montes se transportem para o meio dos mares;\nainda que as águas rujam e se perturbem, ainda que os montes se abalem por sua braveza. Há um rio\ncujas correntes alegram a cidade de Deus, o santuário das moradas do Altíssimo. Deus está no meio\ndela; não será abalada; Deus a ajudará ao romper da manhã\" (Salmos 46.2-5). Isto significa que, pela\nfé, sempre seremos vitoriosos sobre satanás. Se alguma circunstância levar você ao encontro do Pai, o\ninimigo estará vencido para sempre, pois já não poderá intentar nenhum mal contra os salvos.\n\n     Portanto, isto quer dizer: se você estiver com Cristo na terra ou no céu, satanás será sempre\nperdedor.\n\n      3. A fé não vê o fracasso. Aquilo que, na visão de muitos, aparenta fracasso, para o verdadeiro\ncristão é um meio de fortalecer a sua fé e passar a depender mais de Jesus. Quando o apostolo Paulo\nafirma que se considerava fraco, isto servia para ele entender que sem Cristo nada podia fazer. Isto o\nlevou, inclusive, a receber do Senhor o consolo: \"A minha graça te basta\". O fracasso eventual, quando\nolhado por este prisma, é fator de fortalecimento da fé para aprofundar a sua comunhão com Deus.\n\n      4. A fé conduz a vitória. Para concluir, vale lembrar: \"Enquanto a duvida olha para baixo, a fé\nolha para o alto; enquanto a duvida vê o perigo, a fé enxerga a segurança; enquanto a duvida resvala na\nincredulidade, a fé se abriga no esconderijo do Altíssimo; enquanto a duvida se afunda no desespero, a\nfé se agiganta na esperança; enquanto a duvida pergunta quem crê, a fé responde: \"eu creio!\"\n\n                                                                                      Igreja de Vencedores\n\nDISCIPULADO\n\n      Você aprendeu que a fé é o ponto vital de nossas relações com Deus. Descobriu, também, que ela\nse traduz na certeza pessoal que nos é dada por Cristo. Pôde, ainda, chega à conclusão, que só fará\ngrandes coisas para Deus quem tiver fé abundante e assentada nas promessas do altíssimo.\n\n     A partir de agora, deixe que a fé predomine em sua vida e torne-se vitorioso, apesar das\ncircunstâncias adversas. Procure fortalecê-la através da oração, leitura da Palavra de Deus e das\nexperiências de outros servos de Deus que já estão mais amadurecidos na fé.\n\n      Lembre-se que tanto a sua fé como as incredulidades podem contagiar outros que estão à sua\nvolta. Portanto, não se deixe levar pelas duvidas ou incertezas e não seja, com seus atos e palavras, um\npregador do caos que instile a incredulidade nos que o cercam. Mas seja, isto sim, um proclamador da\nfé verdadeira, dizendo como Paulo: \"Tudo posso naquele que me fortalece\".\n\n     Tenha fé que você irá ganhar toda a sua família e amigos para Jesus através da célula, geração e\nministério, pois você foi chamado para mudar situações e ser boca de Deus em sua casa.\n\nVERIFIQUE O QUE VOCÊ APRENDEU\n\n1. Qual a melhor definição para a fé?\n\n______________________________________________________________________________\n\n2. Por que em Hebreus 11 é considerado como a galeria dos heróis da fé?\n\n______________________________________________________________________________\n\n3. O que levou os heróis do Antigo Testamento a serem vitoriosos?\n\n______________________________________________________________________________\n\n4. Por que a fé é tão importante na vida cristã?\n\n______________________________________________________________________________\n\n5. O que é o dom da fé?", "quiz": [{"q": "Qual é o texto bíblico-base da lição \"O DISCIPULO E A FÉ\"?", "options": ["Hebreus 11.1", "Filipenses 2.8", "2\nCoríntios     5:14", "Atos 2.41"], "answer": 0}, {"q": "Qual destes é um dos tópicos estudados na lição \"O DISCIPULO E A FÉ\"?", "options": ["Defina O Catolicismo", "Diga A Deus Exatamente Como Você Se Sente", "O Espírito Santo Lhe Pergunda Agora:", "Os Efeitos Da Fé"], "answer": 3}]}, {"num": 7, "title": "O DISCIPULO E A OBEDIÊNCIA", "verseRef": "2 Timóteo 4.7", "content": "TEXTO BÍBLICO\n\n    \"Porém Samuel disse: Tem por ventura o Senhor, tanto prazer em holocausto e sacrifícios, como\nem que se obedeça à Palavra do Senhor? Eis que o obedecer é melhor do que o sacrificar, e o atender\nmelhor é do que a gordura de carneiros\". (1 Samuel 15.22).\n\n     COMENTÁRIO\n\n     INTRODUÇÃO\n\n     A obediência, segundo definem os dicionaristas, é o ato de submeter-se à vontade de alguém.\nNesta lição, porém, você vai aprender que, em se tratando do cristão, a obediência não é tão restrita,\ncomo querem os filólogos. Ela está profundamente ligada à fé, através da qual somos introduzidos à\npresença do Deus invisível, a quem voluntária e conscientemente nos submetemos. Por crermos na sua\nsoberania sobre todas as coisas, nos dispomos a viver em obediência à sua Palavra, à igreja e aqueles\nque Ele estabeleceu para ministrar sobre o seu povo.\n\nI. EXEMPLO DE OBEDIÊNCIA\n\n     A obediência é uma virtude exemplificada em todos os livros da Bíblia. Nela, você também\nencontra registros sobre a desobediência e suas trágicas consequências. Cabe-nos olhar para estes\nexemplos e tirarmos lições que nos ajudem a pôr em prática a obediência e a não repetir os erros dos\nque não souberam honrar a confiança de Deus.\n\n     1. A obediência de Abraão. Deus fez uma determinação ao patriarca, baseada em algumas\ncondições: Quais foram? Leia Gênesis 12.1.\n\n      Você descobriu que Abraão devia deixar a sua terra, a sua parentela, a casa de seus pais e seguir\npara uma terra distante, a qual não conhecia. Estas condições implicavam basicamente numa coisa: fica\nclaro, no texto, que ele dependeria exclusivamente da direção de Deus.\n\n     Você descobriu, ainda, que a obediência não impõe só condições, mas trás também privilégios.\n\n     Abraão seria pai de uma grande nação, abençoado, engrandecido e uma bênção para todas as\nfamílias da terra. E mais: aqueles que o abençoassem seriam abençoados; os que o amaldiçoassem,\namaldiçoados.\n\n     Vale lembrar, por conseguinte, que todas as vezes em que Deus determinou alguma coisa a\nalguém, o intuito não era o obedecer por obedecer, ou simplesmente para fazer valer a sua soberania.\nHavia um propósito preestabelecido. Neste caso, o propósito maior era formar uma nação pela qual o\nredentor, Jesus Cristo, viesse ao mundo. Se Abraão não obedecesse, ficaria privado de ter o privilegio\n\n                                                                                    Igreja de Vencedores\n\nde constar em sua biografia o registro de progenitor da raça judaica que trouxe o salvador da\nhumanidade.\n\n     Outro fato a destacar é que a obediência do patriarca não foi um ato robótico, como se não tivesse\npersonalidade. Ele fez por saber a quem estava obedecendo e movido pela fé. Por isso, seu nome\nconsta na galeria dos heróis da fé, em Hebreus 11.\n\n     Não obstante Abraão ser um exemplo de obediência houve um momento em sua vida cuja\nprecipitação trouxe consequências drásticas que repercutem até o dia de hoje. Foi quando Deus lhe\nprometeu um filho em sua velhice. Leia Gênesis 15.1-16; 16.1-16.\n\n     Induzido por Sara, sua mulher, que já não acreditava mais em sua capacidade de gerar, nem\nmesmo por intervenção divina, Abraão acabou tendo um filho com sua serva Agar, fora do plano de\nDeus. O resultado é que logo surgiram os conflitos, principalmente depois que nasceu Isaque, o filho\nda promessa. Pra resumir, ainda hoje as consequências aí estão, com as hostilidades entre árabes,\ndescendentes de Ismael, e israelenses descendentes de Isaque.\n\n      2. A obediência de Paulo. O apostolo certa vez declarou: \"Não fui desobediente a visão\ncelestial\" [Atos 26.19]. A frase, isolada, pode parecer simplista. Mas olhando-a sob a perspectiva da\nvida do apostolo, desde a sua conversão, verifica-se que ela reflete a realidade. Leia Atos 9.15.\n\n      Quando Deus ordenou a Ananias que visitasse o apostolo, após o encontro deste com Cristo, na\nestrada de Damasco, ficou claro, desde o inicio, o seu propósito para com o até então perseguidor do\nevangelho. Ele era um vaso escolhido para proclamar a salvação aos gentios.\n\n      Agora, faça você mesmo uma avaliação e veja se não foi isto mesmo que aconteceu com Paulo.\nForam três viagens missionárias, alcançando toda a Ásia e também a Europa. Em Roma, as paredes da\nprisão domiciliar não foram suficientes para impedir que realizasse o seu ministério [Atos 28.30]. Dali\nirradiou o evangelho não só através daqueles que o visitavam, mas por intermédio das diversas cartas\nque de lá escreveu, ao lado de outras escritas fora da prisão. Elas passaram a compor o cânon – a Bíblia\nSagrada – através do qual, hoje, eu e você somos abençoados.\n\n    O mundo todo foi beneficiado pela obediência de Paulo, que, ao fim da vida, pôde dizer:\n\"Combati o bom combate, acabei a carreia e guardei a fé\" (2 Timóteo 4.7).\n\nII. A QUEM DEVEMOS OBEDECER?\n\n     A parir dos exemplos acima, surge então a pergunta: a quem devemos obedecer? Nossa\nobediência é a Deus, em primeiro lugar. Mas como obedecer-lhe, sendo Ele invisível e transcendente?\n\n      1. Devemos obedecer a Deus através de sua Palavra. Não obstante a sua transcendência, ou\nseja, a sua elevada posição como criador de todas as coisas, que habita num alto e sublime trono, Deus\nse revelou a nós através de sua Palavra e de Jesus Cristo, seu Filho. Portanto, ao estudarmos a Bíblia,\ndescobrimos os princípios que Ele estabeleceu para reger a nossa vida, como cristão, neste mundo. A\nPalavra de Deus é a nossa regra áurea de fé, o padrão de obediência para com Deus. O Espírito Santo,\n\npor sua vez, ilumina a nossa mente e nos ajuda a descobrir como pôr em pratica em nosso cotidiano os\nmandamentos bíblicos. Ele é o melhor interprete das Escrituras.\n\n      2. Devemos obedecer à igreja. A igreja é fiel depositária do plano de salvação, na pessoa de\nJesus Cristo. A ela estamos ligados mediante o novo nascimento. Assim sendo, devemos obediência à\nigreja. No primeiro Concilio da igreja, em Jerusalém, para discutir a questão do legalismo, relatado em\nAtos 15, está claro que ela teve participação nas decisões sobre o que os gentios deviam ou não acatar.\n\n     É sempre bom lembrar que esta obediência é a luz da Palavra, e não ao contrário. Não é a igreja\nque estabelece o que a Bíblia ensina, mas a Bíblia que estabelece o que a igreja deve fazer. Tudo\nquanto ela faz ou ensina não pode basear-se em textos isolados, mas nos princípios gerais da Bíblia.\nUm princípio só pode ser assim considerado se tiver apoio em toda a Palavra de Deus. Se não, pode ser\numa boa opinião, mas não um princípio bíblico. O grande erro da igreja Romana, entre outros ao longo\nda história, foi que, para justificar suas heresias, inverteu o papel: Ela passou a ser mais importante do\nque a Bíblia e a arbitrar o que ela ensina. Devemos, portanto, ter em mente: a Palavra de Deus é\nsempre a base de nossa obediência.\n\n      3. Devemos obedecer aos nossos Pastores Ermeson e Leiane Souza e aos lideres da igreja. Se\na Bíblia é o nosso arbitro, ela determina que devemos também obedecer aos nossos Bispos e lideres da\nigreja, que esta escrito em Hebreus 13.17.\n\n     Não obstante ser a salvação individual, você descobriu que a responsabilidade de ministrar às\nnossas vidas é dos nossos Pastores Ermeson e Leiane Souza e lideres da igreja, de quem Deus vai\ncobrar a prestação de contas um dia. Cabe-lhes, portanto, expor a palavra para o nosso ensino e\ncrescimento espiritual.\n\n     Portanto nunca murmure contra os nossos Pastores e lideres, nunca aceite alguém falar mal deles\nou da igreja. Não tenha parte nesta maldição que é a desobediência, pois quem fala mal do ungido de\nDeus persegue o próprio Deus e isso irá acarreta em grandes consequências no futuro.\n\n      De nossa parte, como determina a Bíblia, cabe-nos atentar para os seus conselhos, ouvir-lhes as\nrecomendações e obedecer-lhe, sempre compulsando a Bíblia, pois este é um direito de todos os\ncristãos: ter acesso direto a Bíblia Sagrada para comparar o ensino que esta recebendo com a Palavra\nde Deus. Aqui vale a seguinte cautela. Se, por acaso, o seu pensamento está divergindo do que pensa a\nunanimidade da igreja, acenda uma luz de advertência. Pois o Espírito Santo não é capaz de divergir de\nsi próprio, dando-lhe uma iluminação diferente daquela concedida aos lideres e a igreja.\n\nIII. EFEITOS DA OBEDIÊNCIA\n\n     Para finalizar, veja, na Bíblia, os efeitos da obediência na vida dos que a praticam.\n\n     1. Os que obedecem a Deus têm o Espírito Santo. \"E nós somos testemunhas acerca destas\npalavras. Nós e também o Espírito Santo, que Deus deu àqueles que o obedecem\" (Atos 5.32).\n\n                                                                                      Igreja de Vencedores\n\n     2. Os que obedecem a Deus são inabaláveis. \"Todo aquele, pois, que escuta estas minhas\npalavras e as pratica, assemelhá-lo-ei ao homem prudente, que edificou a sua casa sobre a rocha\"\n(Mateus 7.24).\n\n     3. Os que obedecem a Deus são conhecidos. \"Quanto a vossa obediência é ela conhecida de\ntodos. Comprazo-me pois em vós, e quero que sejas sábios no bem, mas símplices no mal\" (Romanos\n16.19).\n\n      4. Os que obedecem a Deus o glorificam. \"Visto como, na prova desta administração,\nglorificam a Deus pela submissão que confessais quanto ao evangelho de Cristo, e pela liberdade de\nvossos dons para com eles, e para com todos\" (2 Coríntios 9.13).\n\n      5. Quem obedece a Deus é irrepreensível. \"De sorte que, meus amados, assim como sempre\nobedecestes, não só na minha presença, mas muito mais agora na minha ausência, assim também\noperarei a vossa salvação com temor e tremor... para que sejais irrepreensíveis e sinceros, filhos de\nDeus inculpáveis no meio de uma geração corrompida e perversa, entre a qual resplandeceis como\nastros no mundo\" (Filipenses 2.12-15).\n\nDISCIPULADO\n\n     1. Faça um propósito, a partir de agora, de ser um exemplo de obediência para aqueles que se\nconverteram depois de você. Lembre-se de que eles precisam ter um modelo de vida condizente com a\nPalavra de Deus e você pode ajudá-los com o testemunho de sua sujeição a Cristo.\n\n      2. Você deve estar em sintonia com os nossos Pastores e lideres da igreja, procurando obedecer-\nlhes à luz da Palavra de Deus, pois a eles Deus constituiu para apascentar o rebanho.\n\n      3. Evite as murmurações, não participe de grupos dissidentes e não siga o conselho dos\ndesobedientes, que não querem submeter-se às normas da igreja, rebelando-se contra ela. Cuidado com\no joio no meio do trigo.\n\n     4. Qualquer que seja a circunstancia, saiba que Deus é o dono da igreja e Senhor do tempo. Ele\ntomará, na hora oportuna, as providencias cabíveis.\n\n    5. Não obedeça apenas por obedecer, mas que sua submissão seja fruto de uma razão maior: a fé\nno Deus Todo-Poderoso.\n\nVERIFIQUE O QUE VOCÊ APRENDEU\n\n1. Quais privilégios Deus prometera a Abraão pela sua obediência?\n\n______________________________________________________________________________\n\n2. Quais foram as consequências da precipitação de Abraão, em não esperar o filho da promessa?\n\n______________________________________________________________________________\n\n3. Cite dois efeitos da obediência?\n\n______________________________________________________________________________\n\n4. A quem devemos obedecer segundo o estudo desta lição?\n\n______________________________________________________________________________\n\n5. Por que devemos obedecer aos nossos Bispos e lideres da igreja?\n\n______________________________________________________________________________\n\n                                                                                 Igreja de Vencedores\n          42", "quiz": [{"q": "Qual é o texto bíblico-base da lição \"O DISCIPULO E A OBEDIÊNCIA\"?", "options": ["Hebreus 11.1", "Tiago 4:7; I João 3:8; Efésios 4:27;", "Gênesis 32:30; II Samuel 12", "2 Timóteo 4.7"], "answer": 3}, {"q": "Qual destes é um dos tópicos estudados na lição \"O DISCIPULO E A OBEDIÊNCIA\"?", "options": ["Exemplo De Obediência", "Abra Sua Célula Ou Geração Ou Base, Não Enterre O Seu Chamado!", "Somos Uma Igreja Com Propósitos", "A Natureza Do Espirito Santo"], "answer": 0}, {"q": "Qual destes tópicos NÃO faz parte da lição \"O DISCIPULO E A OBEDIÊNCIA\"?", "options": ["Efeitos Da Obediência", "Exemplo De Obediência", "A Quem Devemos Obedecer?", "Uma Nova Vida Moral"], "answer": 3}]}, {"num": 8, "title": "O DISCIPULO E O DÍZIMO", "verseRef": "Malaquias 3.10", "content": "TEXTO BÍBLICO\n\n      \"Trazei todos os dízimos à casa do tesouro, para que haja mantimento em minha casa, e depois\nfazei prova de mim, diz o Senhor dos exércitos, se eu não vos abrir as janelas do céu, e não derramar\nsobre vós uma benção tal, que dela vos advenha maior abastança\" (Malaquias 3.10).\n\n     COMENTÁRIO\n\n     INTRODUÇÃO\n\n     O dízimo não é mera obrigatoriedade, mas é fruto de um coração grato a Deus. O dízimo é uma\nforma de você mostrar sua gratidão pelas bênçãos decorrentes da salvação. É torna-se participante com\nDeus na obra da evangelização do mundo. É o privilegio de tirar 10 por cento de toda renda pessoal e\ninvestir no Reino de Deus aqui na terra.\n\nI. O DÍZIMO NO ANTIGO TESTAMENTO\n\n     Dar ou pagar o dízimo, no Antigo Testamento, constituía-se em separar a décima parte do\nproduto da terra e dos rebanhos para o sustento do santuário de Deus e dos sacerdotes.\n\n     1. O dízimo nos dias de Abraão. A origem do dízimo perde-se no tempo, sendo anterior a\nMoises e Abraão. No entanto, a primeira referencia bíblica ao fato relaciona-se aos dias deste patriarca.\nEm Gênesis 14.20 está escrito que Abraão deu a Melquisedeque o dízimo de tudo, sendo que, neste\ncaso, não foi do produto da terra nem dos rebanhos, e sim do despojo da guerra, costume também\nobservado nos tempos antigos (leia Hebreus 7.2). Ora, quando o Novo Testamento reporta-se ao\nassunto, é porque algum ensino existe para os dias de hoje, como você terá a oportunidade de verificar\nmais adiante. Leia Levítico 27.30, 32,34 e Deuteronômio 12.5-6.\n\n      2. O dízimo nos dias de Jacó. Posteriormente, na progressão da história, você encontrará o\npatriarca Jacó seguindo o exemplo de Abraão, só que em outra circunstância; a de ser grato a Deus, se\neste lhe guardasse durante a sua jornada (leia Gênesis 28.18-22). É certo que a gratidão pelas bênçãos a\nserem alcançadas moveu o coração de Jacó, que, de forma espontânea, reconheceu a soberania de Deus\napós a experiência em Betel.\n\n     3. O dízimo nos dias de Moises. Nos dias de Moises, o dízimo passou a exercer importante papel\nna vida religiosa do povo israelita (leia Deuteronômio 26.1-15). Desta forma, não só a Casa de Deus\nera suprida, como também mantida a tribo levítica, responsável pelo sacerdócio. Quando o povo se\nencontrava fraco e afastado de Deus, o dízimo era negligenciado. Dar o dízimo é, portanto, um sinal de\navivamento, entre outros, quando provém da fé e de um coração que reconhece o senhorio de Deus\nsobre todas as coisas. Por isso, Malaquias chegou a chamar os roubadores de Deus àqueles que não\n\npagavam os seus dízimos (Malaquias 3.8-10), convocando-os a fazer prova do Todo-Poderoso, que\njamais deixará de cumprir suas promessas àqueles que lhe são fieis.\n\nII. O DÍZIMO NO NOVO TESTAMENTO\n\n      O dízimo não ficou restrito aos tempos do Antigo testamento. O escritor da epistola aos Hebreus\nestabelece uma vinculação direta entre esta pratica e o Novo Testamento, quando menciona o fato de\nAbraão ter dado o dízimo de tudo a Melquisedeque. Vale lembrar, inclusive, que o mesmo autor afirma\nser Cristo o sumo sacerdote segundo a ordem de Melquisedeque [Hebreus 5.10]. Ora, isto quer dizer\nque, se a ordem é a mesma, os deveres e privilégios continuam também os mesmos, sem alteração, e\nisto inclui o dízimo. Dar o dízimo, portanto, é dar seqüência, em Cristo, ao sacerdócio de\nMelquisedeque, que é \"sem pai, sem mãe, sem genealogia, não tendo principio de dias nem fim de\nvida, mas sendo semelhante ao Filho de Deus, permanece sacerdote para sempre\" (Hebreus 7.3).\n\n     1. Jesus e o dízimo. O próprio Cristo não passou ao largo do dízimo. Leia Mateus 23.23,24.\n\n     Você descobriu, entre outras coisas, que a pratica do dízimo entre os contemporâneos de Jesus\ntornou-se legalista e ostentatória de falsa espiritualidade. Os escribas e fariseus cumpriam esta\ndeterminação para serem vistos e honrados pelos homens, e não como fruto sincero de corações\nagradecidos. Era apenas aparência. Nada mais. Todo o texto de Mateus 23 enfatiza este lado da\narrogância, da falsa religiosidade, onde a hipocrisia se reveste de justiça para torna-se a gloria de\ncorações iníquos e apodrecidos.\n\n      Alguns podem pensar, à primeira vista, que Jesus estivesse condenando o dízimo. Porém, uma\nleitura mais acurada do texto (verso 23) revela que Ele estava reprovando a motivação errada. Foi isto\nque deixou claro ao afirmar. \"... pois que dizimais a hortelã, o endro e o cominho, e desprezais o mais\nimportante da lei, o juízo, a misericórdia e a fé\". Ou seja, uma coisa não pode existir sem a outra. É\ntanto que acrescentou. \"Deveis, porém, estas coisas [viver o juízo, a misericórdia e a fé], e não omitir\naquelas\" (dizimar a hortelã, o endro e o cominho). O que Jesus fez foi reforçar o conceito de que o\ndízimo, antes de ser uma mera obrigatoriedade, para aparentar justiça, é um ato de fé que produz\nobediência voluntária aos mandamentos da Palavra de Deus.\n\n     2. O dízimo nas epistolas. Ainda que a palavra dízimo não apareça nos ensinos do apostolo\nPaulo, esta implícita todas as vezes em que ele admoesta sobre a contribuição. Leia 1 Coríntios 16.2.\n\n     Duas coisas aparecem no texto: as contribuições eram feitas no primeiro dia da semana\n(domingo), proporcionalmente à prosperidade de cada um. O dízimo é exatamente isto. Quando se\npaga 10 por cento, ele sempre será proporcional. Em outras palavras, quanto mais o cristão prospera,\nmais contribui. O apostolo também reitera o conceito de que a contribuição sistemática, além de\nproporcional, deve ser oriunda da motivação correta. Ele afirma: \"Não com tristeza, ou por\nnecessidade; porque Deus ama ao que dá com alegria\" (2 Coríntios 9.7).\n\n                                                                                    Igreja de Vencedores\n\nIII. AS BÊNÇÃOS QUE ACOMPANHAM O DÍZIMO\n\n      1. Bênçãos para a igreja. Se todos os cristãos dessem o dízimo, não haveria a necessidade de a\nigreja local lançar mão de campanhas financeiras para a execução de sua tarefa. O que ocorre é\nexatamente o oposto. É pequeno o percentual dos que se dispõe a cumprir este mandamento, talvez por\nfalta de ensino e de ter a visão correta do que significa o dízimo.\n\n     Malaquias afirmou que o dízimo é para que haja \"mantimento na casa do Senhor\". Aplicando-se\nao contexto de hoje, é o meio que a igreja tem aqui na terra para realizar a evangelização, enviar\nmissionários, manter os seus obreiros, cuidar da assistência social, construir templos para abrigar o\npovo e suprir o dia-a-dia da administração. Por exemplo: como a igreja poderá ser abençoada com o\ncrescimento, se lhe faltam recursos para adquirir folhetos, enviar obreiros, dar suporte aos programas\nde evangelismo e ajudar no cuidado aos cristãos da igreja e da comunidade? O dízimo é para isso. Não\ntem outra finalidade.\n\n       2. Bênçãos para quem dar o dízimo. A promessa dada por Deus através de Malaquias impõe\numa condição: primeiros trazer os dízimos, depois fazer prova do Senhor, que garante derramar benção\ntal, trazendo maior abastança. Porém, é preciso que fique claro: isto não anula as aflições da vida, onde\npodem aparecer os momentos de sequidão. Agora, com certeza garante vitória aos que, com fidelidade\nem tudo, atravessam estas horas mais difíceis, pois a Palavra de Deus jamais cai por terra. Fazer prova\nnão é chantagear o Senhor, mas saber que Ele é recíproco para conosco, se cumprirmos a nossa parte.\n\"Se vós estiverdes em mim\", disse Ele, \"e as minhas palavras estiveres em vós\".\n\n     Veja algumas coisas que acontecem quando, motivado pela visão correta, o cristão paga o\ndízimo:\n\n     a) Sente-se recompensado por sentir-se parte ativa da obra de Deus;\n     b) Deus o socorre em tempos trabalhosos;\n     c) Torna-se exemplo para os demais cristãos;\n     d) Deus lhe é recíproco em proporções bem maiores;\n     e) Os recursos são mais abundantes para os projetos da igreja; e\n     f) A obra de Deus é realizada com maior rapidez.\n\nDISCIPULADO\n\n      Você aprendeu que o dízimo é uma doutrina que se fundamenta em toda a Bíblia, não sendo,\nportanto, uma imposição humana. Descobriu, também, que é um ato de fé, onde não há lugar para o\nlegalismo e a falsa religiosidade. Viu, ainda, que é fruto da gratidão pelas bênçãos do Altíssimo, que\nresulta na obediência voluntária aos mandamentos da Palavra de Deus. Finalmente, pôde perceber que\ndar o dízimo conduz, pelo menos, a duas coisas: a termos \"mantimentos na casa do Senhor\" e \"maior\nabastança\" em nossa vida pessoal.\n\n     Diante do exposto, cabe-lhe avaliar, como nova criatura, que existe segurança em seguir as\norientações bíblicas, devendo pôr em pratica os ensinamentos recebidos.\n\n     1. Se você ainda não teve a experiência de devolver o dízimo a Deus, comece a fazê-lo já este\nmês. Não olhe para o tamanho do seu salário, se ele é pequeno, mas para a grandeza de Deus a quem\nvocê esta servindo com a sua contribuição. Lembre-se que apenas 10 por cento de sua renda, uma\nquantia certamente menor do que aquela empregada, outrora, em coisas vãs.\n\n     2. Se você já vinha devolvendo o dízimo, mais com a motivação errada, mude de rumo: faça-o\npor amor a obra e como um ato de fé nas promessas de Deus, que resulta na obediência voluntária aos\nseus mandamentos, sem legalismo.\n\n     3. Saiba que sua decisão em investir na obra de Deus dependerão muitos projetos de sua igreja,\nprincipalmente os relacionados com a evangelização e a obra missionária.\n\n     4. Não se esqueça, também, de que seus irmãos em Cristo que estejam passando por alguma\nnecessidade, bem como os mais carentes da comunidade, poderão ser melhor abençoados se o seu\ndízimo for recolhido regularmente à casa do Senhor.\n\n     5. Lembre-se, finalmente, da promessa bíblica: \"Mais bem aventurada coisa é dar do que receber\"\n(Atos 20.35).\n\n                                                                                   Igreja de Vencedores\n\nVERIFIQUE O QUE VOCÊ APRENDEU\n\n1. O que significa dar o dízimo?\n\n______________________________________________________________________________\n\n2. O dízimo deve ser dar por mera obrigatoriedade ou como um ato de fé nas promessas de Deus?\n\n______________________________________________________________________________\n\n3. Em que circunstância o dízimo aparece pela primeira vez na Bíblia?\n\n______________________________________________________________________________\n\n4. Qual o profeta que chamou de roubadores de Deus aqueles que não davam os seus dízimos?\n\n______________________________________________________________________________\n\n5. Qual a utilidade do dízimo para a igreja local?", "quiz": [{"q": "Qual é o texto bíblico-base da lição \"O DISCIPULO E O DÍZIMO\"?", "options": ["Malaquias 3.10", "Salmo 139.2", "Efésios 2.19", "2 Timóteo 4.7"], "answer": 0}, {"q": "Qual destes é um dos tópicos estudados na lição \"O DISCIPULO E O DÍZIMO\"?", "options": ["O Dízimo No Antigo Testamento", "O Que É O Lar", "Siginificado E Finalidade Da Santa Ceia", "Seremos Avaliados Quanto Ao Nosso Amor"], "answer": 0}, {"q": "Qual destes tópicos NÃO faz parte da lição \"O DISCIPULO E O DÍZIMO\"?", "options": ["Conhecendo Deus, Jesus E O Espirito Santo", "O Dízimo No Novo Testamento", "O Dízimo No Antigo Testamento", "As Bênçãos Que Acompanham O Dízimo"], "answer": 0}]}, {"num": 9, "title": "O DISCIPULO E O ESPIRITO SANTO", "verseRef": "Atos 1.8", "content": "TEXTO BÍBLICO\n\n      \"Mas recebereis a virtude do Espírito Santo, que há de vir sobre vós; e ser-me-eis testemunhas,\ntanto em Jerusalém como em toda a Judéia e Samaria, e até os confins da terra\" (Atos 1.8).\n\n     COMENTÁRIO\n\n     INTRODUÇÃO\n\n      É impossível escrever sobre qualquer dos temas enfocados nestas lições, sem fazer referências,\nexplicita ou implícita, à pessoa e aos atos do Espírito Santo. Não obstante, se faz necessário tratar deste\nassunto com clareza, a fim de esclarecer quaisquer duvidas que, porventura, existam por parte do\ndiscípulo, sobre a terceira pessoa da Trindade.\n\n      As Escrituras dão muitas provas da personalidade do Espírito Santo. Ele não é apenas uma\ninfluência, força ativa ou energia cósmica, conforme ensinam as falsas religiões; mas, sim, um com o\nPai e o Filho. Ele é Deus (leia João 5.6,7).\n\nI. A NATUREZA DO ESPIRITO SANTO\n\n      Você aprendeu que o Espírito Santo convence o homem do seu estado pecaminoso e da\ncondenação eterna. Nesta lição, você aprenderá que o Espírito Santo é uma pessoa divina, tal como o\nPai e o Filho.\n\n     1. Provas bíblicas da sua divindade. Em Gênesis 1.2, você encontra a primeira referência ao\nEspírito Santo, o qual participou ativamente da criação.\n\n     O Espírito Santo é da mesma essência divina que o Pai e o Filho, pois possui os mesmos atributos\ndestes. Vejamos:\n\n      a) Onipotência: Igualmente como o Pai e o Filho, Ele possui este atributo. É onipotente: pode\ntodas as coisas.\n      b) Onisciência: Assim como o Pai e o Filho, o Espírito Santo tem pleno conhecimento de tudo.\nSeu saber é perfeito e infinito, em relação ao passado, presente e futuro. Ele é eterno: não tem principio\ne nem fim. Leia Salmos 139.2.\n      c) Onipresença: Você aprendeu que o Espírito Santo conhece todos os atos e pensamentos dos\ncristãos. Ele perscruta o seu entendimento, pois está presente em todo lugar, de modo pleno. Leia\nJeremias 23.23,24.\n\n                                                                                       Igreja de Vencedores\n\n      2. Provas da sua personalidade. O Espírito Santo, como já foi dito, é uma pessoa, e não uma\ninfluência ou energia cósmica; também não é a força ativa de Deus, como ensinam alguns, Ele possui\ncaracterísticas e personalidade. Veja os seus atributos pessoais: intelecto, volição (vontade) e\nsentimento (leia Romanos 8.27 e 1 Coríntios 2.10, 11,16), onde se observa, claramente, a sua\ncapacidade de examinar, conhecer e interceder.\n\n     Ele se entristece e, também, tem ciúme (zelo) de nós. Leia Tiago 4.5.\n\n     Considere, ainda, algumas atividades que atestam a personalidade do Espírito Santo:\n\n      a) Revela (2 Pedro 1.21). A Bíblia, revelação de Deus à humanidade, foi escrita por homens\ninspirados pelo Espírito Santo.\n      b) Ensina (João 14.26). O Senhor Jesus afirmou aos discípulos que o consolador os ensinaria\ntodas as coisas, e os faria lembrar de tudo quanto Ele (Jesus) havia dito.\n      c) Intercede (Romanos 8.26). O apostolo Paulo disse que o Espírito Santo \"intercede por nós com\ngemidos inexprimíveis\".\n      d) Ordena (Atos 13.2). A igreja da Antioquia da Síria foi a primeira a enviar obreiros ao campo\nmissionário. Porém, a ordem para isto foi dada pelo Espírito Santo.\n      e) Testifica de Cristo (João 15.26; 1 João 5.6,7). Ele testifica de Cristo. Se não fosse uma pessoa,\nseu testemunho seria nulo.\n      f) Fala à igreja (Apocalipse 2.7, 11, 17, 29; 3.6, 13, 22). Através dos ministros da Palavra e de\nvarias outras maneiras, Ele fala a igreja.\n      g) Convida à salvação (Apocalipse 22.17). Não só convence o pecador a aceitar a Cristo como\nSalvador, mas também, junto com a igreja, convida a todos à salvação.\n\nII. NOMES E SIMBOLOS DO ESPIRITO SANTO\n\n      Você aprendeu que o Espírito Santo é uma pessoa e não uma influência ou força ativa de Deus,\npois possui personalidade. É divino, porque a Ele são atribuídas às mesmas qualidades inerentes ao Pai\ne ao Filho, e também, é lhe dado, de acordo com as diversas funções, vários nomes. Veja, então, os que\nsão conferidos ao Espírito Santo e os seus principais símbolos.\n\n     1. Nomes conferidos ao Espírito Santo. Referente à pessoa do Espírito Santo, as Escrituras\nSagradas registram vários nomes, pelos quais é reconhecido ou representado. Veja:\n\n     a) O Espírito de Deus. Significa que Ele é executivo da divindade. Em Lucas 11.20, Jesus afirma\nque expulsara os demônios pelo \"dedo de Deus\".\n\n     b) O Espírito de Cristo. (Romanos 8.9). Este nome, conferido a terceira pessoa da Trindade,\nindica que o Espírito é enviado por Cristo, par o glorificar e habitar no salvo.\n\n     c) O Consolador (João 14.16,26; 16.7). Perto de findar o seu ministério terreno, o Senhor sabia\nque, brevemente, teria de deixar os seus discípulos. Contudo, eles não ficariam sozinhos, pois enviaria\no \"outro Consolador\", a fim de ficar com eles para sempre.\n\nd) O Espírito da Verdade (João 14.17; 16.13). O espírito do engano e do erro opera no mundo.\nPor isso, o Senhor enviou o Espírito da Verdade, para preservar os seus servos das ciladas de satanás.\n\n     e) O Espírito da Graça. A graça é concedida aos cristãos, a fim de viverem em santidade e\nvencerem as fraquezas, próprias da carne (leia 2 Coríntios 12.9).\n\n     f) O Espírito de Vida (Romanos 8.2). O poder do pecado e da morte não tem efeito sobre aqueles\nque receberam o Espírito de Vida. Neste versículo, o apostolo Paulo afirma: \"Porque a lei do Espírito\nde Vida, em Cristo Jesus, me livrou da lei do pecado e da morte\". Leia Romanos 8.11.\n\n     2. Símbolos do Espírito Santo. Eles indicam a ação divina da terceira pessoa da Trindade,\natravés dos vários ministérios que exerce em prol dos servos de Deus. Consideremos os principais:\n\n     a) Fogo. Este símbolo fala da ação purificadora do Espírito Santo, na vida do cristão. Ao mesmo\ntempo em que incinera a força do pecado dentro de nós, e consome tudo que representa palha, madeira\ne feno; o fogo do Espírito assinala a presença de Deus na vida do cristão, ao iluminá-lo e aquecê-lo.\n\n      b) Vento. No encontro com Nicodemos (João 3.8), o Senhor referiu-se à ação do vento, para\nilustrar a operação do Espírito Santo na obra de regeneração do pecador. É Ele quem convence a\npessoa da necessidade de arrepender-se dos seus pecados e receber, pela fé, mediante a graça divina, a\nsalvação consumada no sacrifício do Calvário, pelo Filho de Deus. O vento simboliza a obra\nregeneradora do Espírito Santo.\n\n     Tal como o vento, cuja presença é sentida, sem, no entanto, se poder tocar, assim é o Espírito\nSanto. Percebe-se a sua real operação na vida do cristão e da igreja, embora não se possa vê-lo tal\ncomo é. Seus atos independem da vontade humana, pois Ele é Deus, é Soberano.\n\n      c) Água. Jesus afirmou a Nicodemos que \"aquele que não nascer da água e do Espírito, não pode\nentrar no reino de Deus\". Neste versículo, a água simboliza a Palavra de Deus, que concede vida aos\nque estão mortos em seus delitos e pecados. Todavia, em João 7.37, o Senhor Jesus identifica-se como\na verdadeira fonte de água viva, isto é, da salvação consumada por Ele, e conferida aos que o\naceitaram, pelo Espírito Santo, Ele afirmou \"Se alguém tem sede, venha Amim, e beba. Quem crê em\nmim, como diz a escritura, rios d‘água viva correrão do seu ventre\". E João registra, ainda no versículo\n39. \"E isto disse ele do Espírito que haviam de receber os que nele cressem; porque o Espírito Santo\nainda não fora dado, por ainda Jesus não ter sido glorificado\".\n\n      d) Selo. Qualquer objeto que esteja selado, o identifica como propriedade exclusiva de alguém. O\nselo é a garantia de que o objeto não será confundido com qualquer outro, pois trata-se de uma marca\npessoal, intransferível.\n\n     O cristão é uma propriedade do Senhor. O selo do Espírito Santo, no ato da conversão, confere a\ngarantia de vida eterna ao novo membro da família de Deus. O Espírito Santo é o penhor da nossa\nsalvação (leia Efésios 1.13,14). Desta forma, a Bíblia ensina que todo cristão é selado com o Espírito\nSanto.\n\n                                                                                    Igreja de Vencedores\n\n      e) Azeite. É o mais conhecido dos símbolos atribuídos a terceira pessoa da Trindade. No Antigo\nTestamento, era usado para consagrar os sacerdotes e os reis de Israel. Ser ungido com o azeite\nsignificava estar revestido da autoridade de Deus, para determinada tarefa espiritual ou secular. A\nigreja primitiva, através dos presbíteros, ungia os enfermos, que saravam, após a oração da fé (leia\nTiago 5.14,15). Ainda se faz isto, em obediência a Palavra de Deus. Os resultados são positivos.\n\n      f) Pomba. Esta ave simboliza brandura, inocência, doçura, pureza, amabilidade e paz. Por ocasião\ndo batismo de Jesus, no rio Jordão, João Batista viu o Espírito Santo descer do céu, em forma corpórea\nde uma pomba, e pousar sobre o Filho de Deus, para identificar que aquele era o Messias. Isto não\nsignifica que a terceira pessoa da Trindade tenha esta aparência, pois, como espírito, não possui forma\nque se possa definir.\n\nIII. A OBRA DO ESPIRITO SANTO\n\n      1. No pecador. O Espírito regenera a natureza pecaminosa do homem, convence-o dos seus\ndelitos e pecados, leva-o ao arrependimento, à confissão e ao abandono dos mesmos, pela fé do\nsacrifício do Filho de Deus.. Deste modo, regenerado pelo Espírito, o pecador experimenta o novo\nnascimento, e torna-se uma nova criatura. Leia 2 Coríntios 5.17.\n\n     2. No cristão. A obra do Espírito é:\n\n       Consolar (leia João 14.16,17);\n       Conduzir, guiar em toda a verdade (leia João 16.13);\n       Ensinar todas as coisas e lembrar o que o Senhor ensinou (leia João 14.26);\n       Conceder poder para testemunhar de Cristo (leia Atos 1.8);\n       Interceder pelos cristãos em suas orações (leia Romanos 8.26);\n       Santificar. Esta é a principal tarefa do Espírito Santo nos cristão, pois sem santificação,\n\"ninguém verá o Senhor\" (Hebreus 12.14). Este processo é uma operação dinâmica e progressiva.\nComeça na conversão e aperfeiçoa-se gradativamente até a volta de Jesus. Leia 2 Coríntios 7.1 e\nFilipenses 1.6.\n      3. Na igreja. Considere as seguintes áreas, nas quais o Espírito Santo administra a igreja.\n      a) Na obra de missões. A começar pela igreja de Antioquia da Síria (leia Atos 13.14), até os dias\natuais, é o Espírito Santo que separa e ordena os obreiros e os envia ao campo missionário.\n      b) No ministério da pregação. Sem a unção do Espírito, nenhum pregador, por melhor que seja,\nlogrará êxito em sua pregação, pois sua mensagem é insípida, vazia e sem poder. Só há salvação de\nalmas, quando o Espírito unge a mensagem e o pregador, como aconteceu com Pedro, no Pentecoste.\nSob a convicção de que haviam pecado, por rejeitarem o Messias, o Salvador da humanidade, os\njudeus, compungidos em seus corações, arrependeram-se e foram salvos. Leia Atos 2.37,41.\n      c) Oração. O Espírito intercede pelos cristãos nas orações (leia Romanos 8.26). Ao escrever aos\ncristãos em Éfeso, Paulo convida-os a orar \"em todo o tempo com toda a oração e suplica no Espírito\"\n(Efésios 6.18). Leia Judas, versículo 20.\n      A sobrevivência da igreja só é possível sob a direção do Espírito Santo. Ele é o legitimo vigário\n(substituto) do Filho de Deus, na terra. Ninguém mais!\n\nDISCIPULADO\n\n        1. Pratique as obras da luz e produza o fruto do Espírito, conforme está registrado em     Gálatas\n5.22.\n\n    2. Busque, também, o batismo no Espírito Santo, a fim de que possa testificar o amor de Deus,\nem Cristo Jesus, a toda criatura, a começar pelos seus familiares, amigos e vizinhos.\n\n    3. Ensine aos que ainda não sabem que o Espírito Santo é Deus, e não uma influência ou energia\ncósmica; nem, tampouco, a força ativa de Deus.\n\n     4. Testifique a todos, em todo o tempo, que o Espírito Santo é o legitimo condutor da igreja de\nCristo, na terra.\n\n        5. Fale, também, que Ele nos ajuda em nossas orações, ao interceder por nós.\n\n     6. Jamais aceite ensinos contrários aos das Escrituras, pois o Espírito Santo é o seu verdadeiro\nguia e ensinador. Ele é o real interprete da Bíblia, pois inspirou os seus escritores [2 Pedro 1.20,21].\nPortanto, não se deixe enganar pelas astúcias de satanás.\n\n        7. Procure adquirir o livro Bom Dia Espírito Santo – Benny Hinn\n\nVERIFIQUE O QUE VOCÊ APRENDEU\n\n1. Cite a referência bíblica, onde o Espírito Santo é citado pela primeira vez\n\n______________________________________________________________________________\n\n2. Cite as características de personalidade do Espírito Santo.\n\n______________________________________________________________________________\n\n3. Cite os atributos que atestam a divindade do Espírito Santo.\n\n______________________________________________________________________________\n\n4. Quais os símbolos do Espírito Santo destacados nesta lição?\n\n______________________________________________________________________________\n\n5. Que tipo de obra o Espírito Santo realiza no cristão?\n\n                                                                                       Igreja de Vencedores\n            52", "quiz": [{"q": "Qual é o texto bíblico-base da lição \"O DISCIPULO E O ESPIRITO SANTO\"?", "options": ["Malaquias 3. 8 - 12", "Filipenses 2.8", "Marcos 16.15", "Atos 1.8"], "answer": 3}, {"q": "Qual destes é um dos tópicos estudados na lição \"O DISCIPULO E O ESPIRITO SANTO\"?", "options": ["A Armadura De Deus", "Os Resultados Da Cura Interior", "A Natureza Do Espirito Santo", "O Significado Do Batismo"], "answer": 2}, {"q": "Qual destes tópicos NÃO faz parte da lição \"O DISCIPULO E O ESPIRITO SANTO\"?", "options": ["A Natureza Do Espirito Santo", "Nomes E Simbolos Do Espirito Santo", "Você É Chamado Para Participar, Não Somente Para Crer", "A Obra Do Espirito Santo"], "answer": 2}]}, {"num": 10, "title": "O DISCIPULO VIVENDO CHEIO DO ESPIRITO", "verseRef": "Efésios 5.18", "content": "TEXTO BÍBLICO\n\n     \"E não vos embriagueis com vinho, em que há contenda, mas enchei-vos do Espírito\"\n(Efésios 5.18).\n\n     COMENTÁRIO\n\n     INTRODUÇÃO\n\n     Viver cheio do Espírito significa ser alegre, confiante, revestido do poder de Deus. Por\nintermédio desta virtude, muitos cristãos enfrentaram os perigos com destemor. Os que realmente eram\ncheios do Espírito Santo, jamais voltaram atrás. Aceitaram o martírio, cientes de que eram bem-\naventurados. Isso só foi possível, porque experimentaram uma vida repleta no Espírito!\n\nI. TODO O CRISTÃO RECEBE O ESPIRITO SANTO\n\n      1. No momento da conversão [Atos 19.2]. No momento em que você aceita Jesus como\nSalvador, recebe o Espírito Santo. Foi Ele quem, na hora de sua conversão, atuou em seu ser, para que\nse decidisse por Cristo. Ele lhe convenceu que era pecador e necessitava do arrependimento, para\nalcançar o perdão de Deus. No instante em que você fez a oração de aceitação, você sentiu uma alegria\nincontida, manifestada, às vezes, por lágrimas. É o momento em que a terceira pessoa da Trindade\npassa a habitar na vida do cristão, que se torna o templo do Deus Altíssimo.         Leia 1 Coríntios\n6.19.\n\n     2. Como promessa e garantia da salvação (1 Coríntios 1.22). Dentre as muitas funções do\nEspírito Santo e de que tudo que a Bíblia diz a respeito de sua Pessoa destaca-se o fato de ser Ele o\npenhor, ou seja, a garantia da nossa futura herança em Cristo: \"Em (Cristo) também vós estais, depois\nque ouvistes a palavra da verdade, o evangelho da vossa salvação; e, tendo nele também crido, fostes\nselados com o Espírito Santo da promessa; o qual é o penhor da herança, para redenção da possessão\nde Deus, para louvor da sua gloria\" (Efésios 1.13,14). É o Espírito Santo que, mediante a Palavra de\nDeus e por todos os meios da graça, nos capacita a atingir a gloria eterna de Deus. Este selo é o penhor\ndo futuro que nos aguarda aqui na terra e na eternidade.\n\nII. COMO SE RECEBE O BATISMO NO ESPRITO SANTO\n\n     1. Através da oração (Atos 1.14). Na despedida, antes de sua ascensão ao Céu, Jesus ordenou\naos discípulos que ficassem em Jerusalém, até a manifestação do poder de Deus. Eles já haviam\nrecebido, em suas vidas, a terceira pessoa da Trindade, quando Cristo, em um dos encontros com eles,\napós sua ressurreição, disse-lhes; \"Receberei o Espírito Santo\" (João 20.22).\n\nNo dia de pentecoste, os discípulos estavam sentados, talvez no período de descanso da oração de\njoelhos, quando \"todos foram cheios do Espírito Santo, e começaram a falar noutras línguas, conforme\no Espírito lhes concedia que falassem\" (Atos 2.4).\n\n     2. Por intermédio de Jesus (João 1.33). É Jesus quem batiza no Espírito Santo. João Batista\napareceu no cenário da Judéia e pregou o arrependimento de pecados, a fim de preparar os judeus para\nreceberem a Cristo. Ele se tornou conhecido imediatamente, por causa da dura mensagem que\ntransmitia.\n\n     Os sacerdotes e levitas mandaram perguntar-lhe quem era ele, e João Batista, prontamente,\nrespondeu que não era Cristo, mas a voz que clamava no deserto: \"Endireitai o caminho do Senhor,\ncomo disse o profeta Isaías\" (João 1.23). Declarou também que batizava com água, para o\narrependimento, mas o que vinha logo em seguida era maior do ele, e batizaria com o Espírito Santo.\n\n      Este, a quem João Batista se referia, é Jesus Cristo, o nosso Salvador. Se você ainda não é\nbatizado no Espírito Santo, ore peça insistentemente, e o Filho de Deus lhe revestirá do poder do alto.\n\nIII. O QUE É BATISMO NO ESPIRITO SANTO?\n\n     1. É uma promessa do Pai (Joel 2.28,29). Deus fez ao homem, aproximadamente oito mil\npromessas, sendo o batismo no Espírito Santo uma delas. No passado, o Espírito Santo manifestava-se\nde forma especifica. De acordo com a necessidade, Ele operava na vida dos servos de Deus (leia Êxodo\n35.30-35). No entanto, Deus prometeu derramar o seu Espírito sobre todos os homens, para que\nprofetizassem e tivessem sonhos. O batismo no Espírito Santo é uma bênção atual e que está ao alcance\nde todos os que crêem.\n\n     2. É um revestimento de poder (Marcos 16.17,18). Os discípulos, antes do batismo no Espírito\nSanto, eram tímidos e medrosos. Inclusive, no dia da prisão de Jesus, todos fugiram, com exceção de\nPedro, que acompanhou até o local onde o Filho de Deus foi julgado. Na casa do sumo sacerdote\nCaifás, o amigo de Cristo, que prometeu segui-lo até a morte, com medo de morrer, negou-o três vezes.\n\n      No entanto, no dia de pentecoste, revestido do poder de Deus, quando os judeus, atraído pelo\nbarulho das línguas estranhas que os discípulos falavam, declararam que os seguidores de Jesus\nestavam embriagados, Pedro respondeu: \"Varões judeus, e todos os que habitais em Jerusalém, seja-\nvos isto notório, e escutai as minhas palavras. Estes homens não estão embriagados, como vós pensais,\nsendo a terceira hora do dia. Mas isto é o que foi dito pelo profeta Joel\" (Atos 2.14-16). No termino de\nsua mensagem, quase três mil pessoas aceitaram a Jesus como salvador.\n\n     Com certeza, todos os revestidos do poder de Deus, são mais do que vencedores. Se você ainda\nnão é batizado no Espírito Santo, busque-o com fé, pois este revestimento também é seu.\n\n     3. É uma necessidade (Atos 19.6). Paulo, em sua terceira viagem missionária, encontrou, na\ncidade de Éfeso, alguns discípulos. O apostolo sempre considerou o batismo no Espírito uma\nnecessidade na vida do cristão. Por isso, ele perguntou àqueles discípulos, se eles já eram batizados no\nEspírito Santo. Responderam-lhe: \"Nós nem ainda ouvimos que haja Espírito Santo\" (Atos 19.2).\n\n                                                                                    Igreja de Vencedores\n\nPaulo, então, orou, impondo as mãos sobre eles, e Jesus batizou-os no Espírito Santo, e falavam\nlínguas e profetizavam.\n\n     Nos dias em que vivemos, o batismo no Espírito Santo é uma grande necessidade.\n\n      As muitas dificuldades que enfrentamos na atualidade e as forças do mal que atuam neste mundo\nlevam o homem aos vícios das drogas e da bebida, à prostituição, à violência, e a tantas coisas ruins\nque destroem a humanidade. Entretanto, o homem triste e desiludido, desenganado pela medicina e\nrejeitado pela sociedade, quando aceita Jesus, renova as suas forças, principalmente, depois que é\nbatizado no Espírito Santo.\n\nIV. DÁDIVAS DO ESPIRITO SANTO\n\n      1. Os dons espirituais (1 Coríntios 12.8-10). Mediante o batismo no Espírito Santo, recebemos\nos dons espirituais. São os seguintes: a palavra da sabedoria, a palavra da ciência, a fé, os dons de\ncurar, a operação de maravilhas, a profecia, o dom de discernir os espíritos, a variedade de línguas e a\ninterpretação de línguas.\n\n     Os dons espirituais são necessários para a edificação espiritual e o crescimento da igreja. São\nconcedidos gratuitamente e devem ser utilizados, também, de graça. Nós o recebemos mediante o\nnosso pedido a Deus. Se você deseja um ou mais destes dons, comece a buscá-los ainda hoje, com fé, e\no Senhor lhe concederá.\n\n      2. O fruto do Espírito (Gálatas 5.22). No momento da regeneração, o novo homem passa a ter a\nmente de Cristo e a produzir o fruto do Espírito, que podemos compara a uma laranja com nove gomos,\ncujos nomes diferem uns dos outros. São eles: caridade, gozo, paz, longanimidade, benignidade,\nbondade, fé, mansidão e temperança. Não são diversos frutos, mas um só, constituído por nove virtudes\ndiferentes. Jesus usou esta sublime oração: \"porque pelo fruto se conhece a árvore\" [Mateus 12.33].\nIsto significa dizer que se conhece a pessoa que realmente nasceu de novo, quando ela produz o fruto\ndo Espírito, manifestado nas nove virtudes que lhe são peculiares.\n\nIV. O ESPIRITO SANTO COMO LIDER\n\n      1. Ensina todas as coisas (João 14.26). Jesus declarou aos discípulos que, por causa de seu\nnome, eles seriam odiados e levados aos tribunais. Mas não se preocupassem, pois o Espírito Santo\nlhes ensinaria tudo o que eles deviam responder aos seus inimigos.\n\n     Hoje, também, o Espírito Santo nos ensina. Por nós mesmos, nada sabemos falar. Mas quando\nabrimos as nossas bocas, a terceira pessoa da Trindade nos enche de sabedoria e graça, para pregarmos\no evangelho de Cristo.\n\n      2. Santifica-nos (2 Tessalonicenses 2.13). O Espírito Santo é que nos regenera. A partir do\nmomento que aceitamos a Jesus, Ele inicia o processo de santificação. Logo após o novo nascimento,\ncomeçamos a crescer espiritualmente, até chegarmos à estatura de varões perfeitos (Efésios 4.13).\nRealmente, as três pessoas da trindade são responsáveis pela salvação do homem: o Pai enviou o Filho.\nEste, por sua morte, redimiu-nos, e o Espírito Santo tem a incumbência de nos santificar. Quando\n\npecamos, sentimos, por intermédio dele, a nossa culpabilidade. Arrependemo-nos, confessamos-lhe as\nnossas faltas e Ele, por intermédio do sangue de Jesus, purifica-nos de todo o pecado.\n\n      3. Dirige a igreja (João 16.13). No dia de pentecoste, o Espírito Santo assumiu a direção da\nigreja. Com a sua infinita sabedoria, Ele dirige os passos da Eleita de Cristo, desde a sua fundação, até\no dia do arrebatamento. No decorrer deste tempo, satanás investe contra a noiva do Cordeiro, mas\njamais foi bem sucedido, pois o Espírito Santo a protege de todo o mal. As portas do inferno não\nprevaleceram contra a igreja, porque o Espírito a dirige e protege das astutas ciladas do diabo. Leia\nMateus 16.18.\n\n     Por isso, viver cheio do Espírito Santo significa ser dirigido pela terceira pessoa da Trindade, com\na certeza de que o cristão marcha para gloria, seguro e confiante que chegará ao céu, pois não é\nconduzido por simples seres humanos, mas por uma pessoa divina.\n\n     DISCIPULADO\n\n     1. Nos dias atuais, viver cheio da graça de Deus é mais do que uma necessidade. É a promessa do\nrevestimento de poder está à disposição de todos os que creem. Se você ainda não é batizado no\nEspírito santo, não se preocupe, pois Jesus está desejoso de atender a todos os que nele esperam.\n\n     2. Frequente as reuniões de célula, geração, ministério, os cultos da congregação e participe do\nEncontro com Deus, e quando você menos esperar, falará novas línguas, como evidencia do batismo no\nEspírito Santo.\n\n     3. Após receber esta bênção, uma promessa de Deus para todos os que aceitam a Jesus como\nsalvador, você deve buscar, diligentemente, os dons espirituais, a fim de que seja um instrumento nas\nmãos de Deus para a edificação da igreja.\n\n      4. Cultive também o fruto do Espírito, para que os seus atos provem a todos que você é uma nova\ncriatura, possuidora da natureza de Cristo.\n\n                                                                                     Igreja de Vencedores\n\nVERIFIQUE O QUE VOCÊ APRENDEU\n\n1. Quando se recebe o Espírito Santo?\n\n______________________________________________________________________________\n\n2. O que é o batismo no Espírito Santo de acordo com a lição?\n\n______________________________________________________________________________\n\n3. Quais as dádivas do Espírito Santo?\n\n______________________________________________________________________________\n\n4. Qual a atuação do Espírito Santo como líder?\n\n______________________________________________________________________________\n\n5. Quais são os dons espirituais descritos em 1 Coríntios 12.8-10?\n\n______________________________________________________________________________", "quiz": [{"q": "Qual é o texto bíblico-base da lição \"O DISCIPULO VIVENDO CHEIO DO ESPIRITO\"?", "options": ["Efésios 5.18", "Malaquias 3.10", "1 Coríntios 9.16", "João 15.15"], "answer": 0}, {"q": "Qual destes é um dos tópicos estudados na lição \"O DISCIPULO VIVENDO CHEIO DO ESPIRITO\"?", "options": ["Tem Omitido Pecado (De Roubo, Sonegação De Impostos, Etc)?", "O Que É Batismo No Espirito Santo?", "Defina Paixão Ministerial", "Como Posso Dar Glória A Deus?"], "answer": 1}, {"q": "Qual destes tópicos NÃO faz parte da lição \"O DISCIPULO VIVENDO CHEIO DO ESPIRITO\"?", "options": ["Se Tornar Líder Em Treinamento", "O Que É Batismo No Espirito Santo?", "O Espirito Santo Como Lider", "Dádivas Do Espirito Santo"], "answer": 0}]}, {"num": 11, "title": "O DISCIPULO E OS DONS DO ESPIRITO SANTO", "verseRef": "1 Coríntios 12.1", "content": "TEXTO BÍBLICO\n\n     \"Acerca dos dons espirituais, não quero, irmãos, que sejais ignorantes\" (1 Coríntios 12.1).\n\n     COMENTÁRIO\n\n     INTRODUÇÃO\n\n      Os dons espirituais formam a base do crescimento espiritual e capacita o cristão para o serviço.\nSeu exercício é fundamental, tanto na adoração como na edificação da igreja. Eles podem ser\nclassificados em três grupos: primeiro: dons de revelação: palavra da sabedoria, palavra da ciência e\ndiscernimento dos espíritos. Segundo: dons de poder: fé, dons de cura e operação de maravilhas.\nTerceiro: dons de inspiração: profecia, variedades de línguas e interpretação de línguas.\n\nI. DONS DE REVELAÇÃO\n\n      São assim chamados porque concedem ao cristão poder para o saber. Ou seja, recebemos do\nEspírito Santo informações e revelações de forma sobrenatural, com a finalidade de tornar-nos capazes\nde conhecer o pensamento divino e a intenção dos opositores da obra divina, em certos momentos, ou\npara fins específicos.\n\n     1. A palavra da sabedoria e da ciência. A capacidade de saber e aplicar as revelações são as\nprincipais virtudes e finalidades da sabedoria e da ciência.\n\n     A Palavra da Sabedoria é conhecimento dado pelo Espírito que capacita o cristão a perceber, falar\ne agir em circunstâncias tais que os elementos naturais se tornam inúteis. Leia Tiago 3.17; e 1\nCoríntios 2.6-8.\n\n     A palavra da ciência ou do conhecimento também não provém de habilidades humanas. Não é\nadivinhação; fenômeno psíquico, perceptivo ou telepático (leia Deuteronômio 18.9-12) e nem tão\npouco é o resultado de um profundo conhecimento bíblico e teológico.\n\n   A palavra da ciência é uma revelação sobrenatural que Deus concede aos cristãos em certos\nmomentos de suas vidas, com a finalidade de socorrer os seus e manifestar sua glória e poder.\n\n     As palavras da Ciência e da Sabedoria se completam. A primeira permite conhecer os segredos\ndivinos; a segunda leva o cristão a aplicar corretamente os conhecimentos revelados.\n\n     2. Discernimentos de espíritos. Como as Palavras da Ciência e da Sabedoria, o dom de discernir\nos espíritos é uma capacitação sobrenatural do Espírito Santo que permite conhecermos a natureza e o\n\n                                                                                    Igreja de Vencedores\n\ncaráter dos espíritos. Ajuda o cristão a separar o falso do verdadeiro, o puro do impuro, o santo do\npecador, o joio do trigo e, especialmente, a intenção dos corações.          Leia 1 João 4.1.\n\n     a) Exemplo do Antigo Testamento. O profeta Eliseu, homem de Deus, desmascarou o espírito do\nengano em seu servo que desejou tomar de Naamã um talento de prata e duas mudas de roupas, como\npagamento de cura pela sua lepra. O pobre Geazi herdou apenas a lepra. Os que compram e vendem os\ndons de Deus morrem leprosos, mesmo que esta doença não seja visível no corpo, inunda a alma com a\nimundice deste pecado, chamado de simônia (2 Reis 5.20-27).\n\n     b) Exemplo do Novo Testamento. É no Novo Testamento que este dom se manifesta em todo o\nseu vigor, revelando os espíritos maus e enganadores dos últimos tempos. Em              Atos 16.16-\n18, Paulo enfrentou uma situação na qual precisou discernir os espíritos. Ele conheceu a origem\ndaquela bajulação e expulsou o demônio em nome de Jesus Cristo. Os cristãos precisam exercer este\ndom na atualidade, quando o espírito de mentira esta em muitos lábios, tanto ou mais que nos dias dos\napóstolos.\n\nII. DONS DE PODER\n\n      Os dons de poder são: dom da fé, dons de cura e operação de maravilhas. Eles concedem aos\ncristãos meios para realizar obras espirituais entre os homens.\n\n     1. Os dons de cura e a operação de maravilhas. Os dons de cura são concedidos como uma\nsolução divina capaz de amenizar o sofrimento humano, através da fé em Jesus Cristo. Todas as\nenfermidades estão sujeitas à cura divina. Deus, de um modo sobrenatural, comunica saúde e força aos\ncorpos afligidos.\n\n     a) Jesus deixou o exemplo. Ele dedicou grande parte do seu ministério para curar enfermos.\nPortanto, podia dizer aos seus discípulos; \"curai os enfermos\". Leia Tiago 5.16; e Atos 14.8-10.\n\n     Jesus tinha pleno conhecimento das condições do homem sem Deus. Corações quebrantados,\ncativos do pecado, cegos espirituais, oprimidos pelos demônios. Por isso, Ele disse em Lucas 4.18,19:\n\"O Espírito do Senhor é sobre mim, pois me ungiu para evangelizar os pobres, enviou-me a curar os\nquebrantados de coração, a apregoar liberdade aos cativos, e dar vista aos cegos; a por em liberdade os\noprimidos; a anunciar o ano aceitável do Senhor\".\n\n      b) Como operam os dons de cura? A Bíblia apresenta os métodos utilizados no uso dos dons de\ncurar. Você pode vê-los especialmente no ministério dos apóstolos Paulo e Pedro.\n\n     Nos casos da cura do paralitico de Betesda e de Enéias, tanto Jesus como Pedro usaram apenas\numa palavra de ordem, sem oração, imposição de mãos, ou qualquer outra atitude. Jesus apenas\nordenou: \"Levanta-te, toma a tua cama e anda\". Pedro declarou: \"Enéias, Jesus Cristo te dá saúde;\nlevanta-te e faze a tua cama\" [Atos 9.33,34]. Leia Atos 19.11-12; Marcos 8.23; e João 9.11-17.\n\n     c) Operação de maravilhas. O dom, também chamado de operação de milagres, prodígios e sinais,\nse constitui em manifestações especiais do poder de Deus que fogem às limitações humanas. São\nsuperiores e inexplicáveis. Ele demonstra o poder de Deus na realização de coisas miraculosas e\n\nextraordinárias. Na operação dos poderosos sinais que envolvem os milagres, o supremo Senhor,\napenas usa de forma que Ele quer as leis e forças por ele mesmo criadas em socorro dos seus filhos.\nIsso é milagre. Leia Gálatas 3.5.\n\n    2. O dom da fé. Implica na capacitação espiritual e sobrenatural que conduz o cristão a confiar\nem Deus, a fim de realizar proezas em nome do Senhor.\n\n     Existe a fé natural, exercitada nas atitudes comuns do dia-a-dia, como tomar um ônibus, um\navião, crendo que vai chegar ao destino. Todo mundo tem fé natural, cristãos e não cristãos.\n\n     Há a fé para conversão. Quando você creu em Cristo como o seu Senhor e Salvador, exercitou a\nfé que salva: \"Crê no Senhor Jesus Cristo e serás salvo, tu e tua casa\" (Atos 16.31). Há também a fé\n(crença) que se refere ao que o cristão crê e confessa, e se desenvolve através da meditação e do estudo\nda Palavra de Deus.\n\n    Mas, no caso do dom, é a fé sobrenatural capaz de movimentar os dons de curar e operações de\nmaravilhas\n\n     Estes dons dizem respeito à virtude do falar, não pela mente humana, mas pelo Espírito Santo.\n\n     1. Os dons de línguas e de interpretação. A Bíblia faz menção das línguas estranhas como sinal\ndo batismo no Espírito Santo e também como uma concessão especial, chamada de variedade de\nlínguas. Para que este edifique a igreja, é necessário que haja interpretação; caso contrário, só a pessoa\nque fala se edifica.\n\n     O dom de interpretar. Portanto, complementa o dom de variedade de línguas e deve seguir a esta\nmanifestação, para que toda igreja seja edificada. Leia 1 Co 14.13,18,28,39-40.\n\n      2. O dom de profecia. Profetizar, como dom, é falar aos homens em nome de Deus, com a\nfinalidade de edificar, exortar e consolar [leia 1 Coríntios 14.3]. O que fala em línguas fala a Deus, a\nnão ser que haja interprete; o que profetiza fala aos homens, da parte de Deus. A profecia é o único,\nentre os dons, sujeito ao julgamento da igreja. Leia 1 Coríntios 14.29.\n\n     a) As fontes da profecia. O motivo que faz o dom de profecia sujeito ao julgamento da igreja é,\nsem dúvida, as suas três fontes de inspiração: o espírito humano, o espírito imundo e mentiroso, e o\nEspírito Santo.\n\n     A profecia oriunda do espírito humano e suas possibilidades, você encontra especialmente nos\nseguintes textos: Jeremias 23.16, 21 e 25.\n\n     O dom de profecia não é um método humano de adivinhar a sorte, de prever o futuro, nem de\ntornar realidade os desejos dos cristãos. Leia 1 Crônicas 17.1-4; e Ezequiel 13.1-8.\n\n     A profecia do espírito imundo, cuja preocupação é imitar as obras de Deus e usar o espírito de\nadivinhação, pode muitas vezes passar despercebida pela sutileza de sua manifestação. É preciso estar\nem sintonia com Deus, para não cair no engano de satanás.\n\n                                                                                      Igreja de Vencedores\n\n      b) O propósito do dom de profecia. Sendo o propósito do dom de profecia, em primeiro lugar,\nedificar a igreja, é natural que o melhor lugar para o seu exercício seja no local onde os cristãos se\nreúnem para a adoração.\n\n    Para as finalidades de ensinar, instruir e dirigir, com vista ao aperfeiçoamento dos santos, Deus\nmesmo deu à igreja apóstolos, pastores, evangelistas e mestres (Efésios 4.11.12).\n\n      O dom de profecia não é para doutrinar a igreja, instruir os pastores e nem dirigir a vida dos\ncristãos, e sim para informar, dar a entender pelo Espírito, deixando as decisões com cada um segundo\na medida da fé.\n\n     c) A disciplina do dom de profecia. É uma bênção, quando usado com a disciplina que a Palavra\nde Deus recomenda:\n\n     - Todos podem profetizar (1 Coríntios 14.5).\n\n     - Em cada culto, apenas dois ou três devem profetizar (1 Coríntios 14.29).\n\n     - Dois cristãos não podem profetizar ao mesmo tempo, pois criam confusão e deixam dúvidas\nsobre quem Deus esta usando (1 Coríntios 14.30).\n\n     - Se um cristão estiver profetizando e um segundo começar a fazê-lo também, só vai criar uma\ncompetição entre profetas. A ordem é o segundo não iniciar, antes que o primeiro termine, e, se o fizer,\nque o primeiro se cale. O ensino é que até três podem profetizar, um após o outro, nunca ao mesmo\ntempo, pois Deus não é de confusão (1 Coríntios14.31,33).\n\n     - a prova de ser espiritual e profeta é aceitar o que diz a Bíblia (1 Coríntios 14.37-40).\n\n     DISCIPULADO\n\n     1. Ore a Deus, e peça os dons da sabedoria, da ciência e o discernimento de espíritos.\n\n     2. Tenha a sua mente controlada pelo Espírito Santo, a fim de viver sempre em busca dos dons,\nespecialmente os relacionados com o saber.\n\n      3. Peça a Deus para ser usado por Ele, mas lembre-se que exercício dos dons espirituais não o\ntorna super cristão, nem mais santo do que os outros. Seja apenas vaso de barro nas mãos de Deus.\n\n     4. Nunca permita que espírito mentiroso coloque dúvida no seu coração sobre a origem divina das\nlínguas, tanto como sinal do batismo no Espírito Santo ou, como dom de variedade de línguas. Seja\nsempre um vaso à disposição de Deus.\n\n     5. Procure participar dos ministérios (serviço) da igreja.\n\n     6. Use seus dons na Célula e Geração para ganhar novas pessoas para o Reino de Deus.\n\nVERIFIQUE O QUE VOCÊ APRENDEU\n\n1. Como os dons da ciência e da sabedoria se completam?\n\n______________________________________________________________________________\n\n2. O que o cristão pode fazer com os dons de poder?\n\n______________________________________________________________________________\n\n3. O que são operações de maravilhas?\n\n______________________________________________________________________________\n\n4. Qual o principal propósito do dom de profecia?\n\n______________________________________________________________________________\n\n5. Quem recebeu o dom de variedade de línguas que outro dom deve pedir a Deus?\n\n______________________________________________________________________________\n\n                                                                                 Igreja de Vencedores\n         62", "quiz": [{"q": "Qual é o texto bíblico-base da lição \"O DISCIPULO E OS DONS DO ESPIRITO SANTO\"?", "options": ["2 Tm 4.7", "Malaquias 3. 8 - 12", "Gálatas 5:1,4,5,13,14,16-25; Colossenses 3:5-10; II", "1 Coríntios 12.1"], "answer": 3}, {"q": "Qual destes é um dos tópicos estudados na lição \"O DISCIPULO E OS DONS DO ESPIRITO SANTO\"?", "options": ["Dons De Revelação", "Conhecendo Deus, Jesus E O Espirito Santo", "Homens Santos", "Os Livros Apócrifos"], "answer": 0}]}, {"num": 12, "title": "O DISCIPULO E O FRUTO DO ESPIRITO SANTO", "verseRef": "Gálatas 5.22,23", "content": "TEXTO BÍBLICO\n\n    \"Mas o fruto do Espírito é: amor, gozo, paz, longanimidade, benignidade, bondade, fé, mansidão,\ntemperança. Contra estas não há lei\" (Gálatas 5.22,23).\n\n     COMENTÁRIO\n\n     INTRODUÇÃO\n\n      Em contraste com as obras da carne, \"o fruto do Espírito\" possibilita ao cristão autêntico viver de\nmodo integro diante de Deus e dos homens. Naturalmente, o homem não consegue obter esta condição\npor esforço próprio. É necessário, portanto, submeter-se incondicionalmente ao Espírito de Deus. \"O...\nfruto...\" de Gálatas 5.22, conceituado como \"expressões do caráter cristão\", está no singular\nprovavelmente por tratar-se de uma única notável virtude implantada pelo Espírito Santo de uma só\nvez no cristão.\n\n     É através do fruto do Espírito que o cristão participa da natureza divina.\n\nI. A NATUREZA DO FRUTO DO ESPRITO\n\n      O que representa e em que consiste o fruto do Espírito na vida do cristão? O fruto do Espírito\nconsiste nas nove virtudes ou qualidades da personalidade de Deus implantada pelo Espírito de verdade\nno interior do cristão com a finalidade de conduzi-lo à perfeição, ou seja, à imagem de Cristo. Em\nsuma, o fruto do Espírito representa os atributos de Deus; os traços do seu caráter. O cristão precisa\nabsorvê-lo com a ajuda do Espírito Santo. O fruto tem sua manifestação na vida interior, vem de dentro\npra fora, é o desenvolvimento da semente que caiu em boa terra e produz para a gloria de Deus.\n\n      1. O fruto do Espírito representa \"expressões do caráter cristão\". O caráter cristão verdadeiro\nexpressa-se no fruto do Espírito que é resumido no amor. Do amor surgem todos os demais atributos\nde Deus que são desenvolvidos no cristão pelo Espírito Santo que nele habita. É por isso que o amor\naparece encabeçando a lista das virtudes cristãs geradas pelo Espírito de Deus, por ser a fonte\noriginária de todas as demais virtudes.\n\n      2. O fruto do Espírito representa a maturidade cristã. O Espírito Santo produz o fruto do\ncaráter cristão em nossa vida somente à medida que cooperamos com Ele. As línguas, a profecia, e até\nmesmo o conhecimento são úteis, e são dons maravilhosos do Espírito Santo, mas sua presença em\nnossa vida nem sempre é uma indicação de nossa maturidade cristã. A medida de nossa maturidade em\nDeus depende de quão bem temos permitido que o Espírito Santo produza os traços do caráter de Jesus\nem nossas vidas. A maturidade Espiritual envolve melhor entendimento do Espírito de Deus e das\nnecessidades das pessoas. \"O fruto do Espírito é resultado na vida dos que participam da natureza\ndivina, ou seja, dos que estão ligados a Cristo a ‗videira verdadeira‘ (João 15.1-15)\".\n\nMaturidade em Cristo envolve a união com Ele (v.1-2); a limpeza ou a poda (disciplina) pelo Pai\n(v.2); e a frutificação (v.5). Estas são as condições da frutificação e conseqüente vida cristã vitoriosa.\n\nII. VIRTUDES OU QUALIDADES DO FRUTO DO ESPIRITO\n\n      1. Qualidades universais (v.22). Amor, alegria e paz. São virtudes direcionadas ao nosso\nrelacionamento com Deus.\n\n     a) Amor. A palavra \"caridade\" ou \"amor\" neste trecho das Escrituras é a tradução da palavra\ngrega ágape. Este é um amor que flui diretamente de Deus: \"o amor de Deus está derramado em nossos\ncorações pelo Espírito Santo que nos foi dado\" (Romanos 5.5). É um amor de tamanha profundidade\nque levou Deus a dar seu único filho como sacrifício pelos nossos pecados [João 3.16]. É o amor de\nJesus por nós: conhecemos a caridade nisto: que deu a sua vida por nós, e nós devemos dar a nossa\npelos irmãos (leia 1 João 3.16; João 15.2-13).\n\n     É muito fácil amar os seus entes queridos, como os pais, filhos, conjugue, amigos, de tal forma\nque lhes deseje o bem e perdoe as suas ofensas, de todo o coração, para jamais se lembrar delas.\n\n     b) Gozo ou alegria. Trata-se daquela qualidade de vida que é graciosa e bondosa, caracterizada\npela boa vontade, generosa nas dádivas aos outros, resultante do senso de bem-estar, sobre tudo de\nbem-estar espiritual, por causa de uma correta relação com Deus. Apesar das dificuldades financeiras,\ndas enfermidades, das calúnias, pela atuação do Espírito Santo, o cristão esta cheio de gozo em sua\nalma, como os apóstolos Paulo e Silas, presos injustamente, por causa do evangelho. Em vez de\nmurmurarem, cantavam e oravam. Leia Atos 16.25.\n\n     c) Paz. Trata-se de uma qualidade espiritual produzida pela reconciliação, pelo perdão dos\npecados e pela conversão da alma transformada segundo a imagem de Cristo (Romanos 12.18). Leia\nRomanos 5.1.\n\n
