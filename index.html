rupo realize a avaliação espiritual. Peça que cada membro compartilhe com outra pessoa a\n     área que escolheram para trabalhar ,para que possam orar uns pelos outros:\n  AVALIAÇÃO:\n   VOCÊ JÁ ACEITOU JESUS COMO SEU SALVADOR? _________________________________\n  A) VOCÊ ORA DIARIAMENTE? ______________\n  B) VOCÊ LER A BILBIA DIARIAMNETE? _____________\n  C) VOCÊ PARTICIPA DA CÉLULA SEMANALMENTE? ___________\n  D) VOCE AJUDA NO MINISTÉRIO (SERVIÇO) DA CÉLULA? _____________\n  E) VOCÊ JÁ DESCOBRIU O SEU DOM?________ QUAL É O SEU DOM ? ________________\n  F) VOCÊ É BATIZADO COM O ESPIRITO SANTO? _____________________________________\n  G) VOCÊ É BATIZADO NAS ÁGUAS? _______________________________________________\n  H) VOCÊ JÁ GANHOU ALGUÉM PARA JESUS? ____________________________________\n  I) VOCÊ DA TESTEMUNHO COMO CRISTÃO? _______________________________________\n  J) VOCÊ É DIZIMISTA DA CASA DE DEUS?_______________________________\n  K) VOCÊ ESTÁ DISPOSTO A TRABALHAR AS AREAS QUE AINDA FALTAM EM VOCÊ? ___________________\n  DATA:\n\n  3. Façam com que cada membro se conecte com outra pessoa no grupo para apoio em oração, façam com que as\n     pessoas compartilhem coisas sobre as quais gostariam de orar, e que em pares eles perguntem uns aos outros\n     sobre seus respectivos pedidos regulamente. – FORME PARCEIROS DE ORAÇÃO (HOMEM/HOMEM E\n     MULHER/MULHER\n  DATA:\nMinistério\n  1. Façam um estudo de como Deus moldou de maneira única cada pessoa para servir - VIDEO DO CANAL NO YOU\n     TUBE DA NOSSA IGREJA (SOBRE ESCOLA DE VENCEDORES)\n  2. Encontrem uma maneira de servir os membros do pequeno grupo. Você poderiam lavar um carro ,cuidar do\n     quintal ou preparar uma refeição .Procurem maneiras de servir uns aos outros.\n  3. DATA\n  4. Separem uma noite para servirem a igreja fazendo um simples projeto juntos – DISTRIBUIR SOPA, DOAR UMA\n     CESTA BASICA, AJUDAR NO EVENTO PONTE DA IGREJA..... E OUTROS\n  DATA:\n  5. Separem um tempo com o grupo para refletirem sobre serviço cristão, ajude cada membro a descobrir seus\n     dons na igreja. Descubra também como esses dons poderiam ajudar no ministério da célula.\n  DATA:\nEvangelismo\n  1. Com grupo participe de uma AULA ON LINE de evangelismo - VIDEO DO CANAL NO YOU TUBE DA NOSSA IGREJA\n     (SOBRE ESCOLA DE VENCEDORES)\n  2. Façam com que cada pessoa do grupo selecione o nome de alguém da vizinhança que não conhece a Cristo e\n     comece a orar por essas pessoas.\n  DATA:\n  3. Separem um tempo juntos mapeando quem não conhece a Cristo .você poderia identificar em suas esferas de\n     influencia a quem poderia convidar para O CAFÉ DA MANHÃ DE DOMINGO DA CONGREÇÃO OU CÉLULA\n  DATA:\n  4. Identifique um grupo de pessoas não alcançadas pelo qual SUA CÉLULA SE comprometa orar.\n  DATA:\n\nPassos para Congregação e Células – Andar\n\nADORAÇAO\n  1. Façam com que os membros do grupo compartilhem coisas especificas pelas quais precisam orar ,e então orem\n     por elas. Uma pessoa pode orar por todos os pedidos ou cada membro ora por uma pessoa. Mantenham um\n     registro dessas orações e perguntem sobre elas semanalmente.\n  2. Convidem alguém para conduzir a adoração durante a reunião em grupo\n  3. Realize a santa ceia no grupo com a ajuda do vídeo de nosso pastor no canal da igreja no You Tube: MEGA\n     APRISCO.\n  4. Passem um tempo com grupo discutindo coisas que cada membro pode entregar a Deus . Lembrando o\n     sacrifício de Cristo ,lembrando que ele entregou a vida por nós.\nCOMUNHAO\n  1. Façam uma noite de incentivo ,onde cada pessoa se assenta no centro ,enquanto os membros do grupo\n     compartilham aquilo que apreciam naquela pessoa\n  2. Selecionem uma noite entre um estudo e outro para irem jantar ou ir ao cinema como grupo .Procurem\n     oportunidades para passarem tempos juntos.\n  3. Quando compartilharem suas necessidades ,encontrem maneiras de se apoiarem mutuamente .Há algumas\n     necessidades que não temos como suprir ,no entanto, façam tudo o que possível para ajudar.\n  4. Conheçam outros pequenos grupos em sua igreja .Talvez queiram reunir-se com outro pequeno grupo para\n     compartilhar.\nDISCIPULADO\n     1. Para sua próxima serie escolham um tópico para desafia-lo como grupo e deixar o grupo mais equilibrado\n         tentem estudar um tópico sobre estágios da vida ou hábitos espirituais ,tente estudar um livro da bíblia\n  2. Façam a avaliação de saúde espiritual como grupo ,que cada pessoa compartilhe seu ponto forte e área na qual\n     precisa melhorar ,separem pessoas por gênero ,baseadas por pontos fortes e fraquezas ,para orientarem umas\n     as outras.\n  3. Que seu grupo compartilhe mutuamente as lutas que tem em sua vida e uma maneira de se ajudarem a crescer.\n     Talvez vocês queiram que os homens fiquem em uma sala e as mulheres em outra para permitir discussões\n     abertas. Orem pelas necessidades uns dos outros e perseverem na ajuda visando o crescimento mutuo.\nMINISTERIO\n  1. Separem um tempo para trazer alguém da sua igreja em seu grupo para compartilhar algumas oportunidades de\n     ministério disponíveis ,baseadas no perfil dos membros do grupo\n  2. Que uma pessoa do grupo assuma o papel de melhorar o grupo ,estruturem esses papeis em torno de\n     propósitos para ajudar seu grupo a ser equilibrado. Alguém que queira cuidar da comida (comunhão),da oração\n     (adoração),ou do ensino (discipulado).Procurem maneiras de incluir todos .\n  3. Participem de um evento ministerial junto , talvez queiram oferecer-se para servir como voluntários em um dos\n     cultos da páscoa ou natal.\n  4. Que cada pessoa do grupo dedique tempo para servir em um ou dois ministérios na igreja para sentirem onde\n     podem servir melhor.\nEVANGELISMO\n  1. Identifique três pessoas por quem orar como grupo e comprometam a conversar regulamente sobre como\n     poderiam convida-las para o seu grupo.\n  2. Façam um grupo de estudo sobre evangelismo – VEJA NO NOSSO CANAL DO YOU TUBE MEGA APRISCO\n  3. Sirvam juntos em sua comunidade local vocês podem alimentar os necessitados nos feriados em uma missão\n     local especifica. Depois do trabalho ,saiam juntos e separem um tempo para compartilhar sobre a experiência\n  4. Como grupo faça uma classe de missões globais.\n\n                                                                                             Igreja de Vencedores\n\n                     Passos para Congregação e Células – Correr\nADORAÇAO\n  1. Separem um tempo para liderar seu grupo por um período de oração estruturada e de meditação\n  2. Façam do tempo da musica e de louvor uma arte normal do seu encontro de grupo. Vocês poderiam cantar a\n      capela, usar os talentos musicais dos membros de seu grupo que saibam tocar um instrumento ou usar um\n      vídeo –de adoração para ajuda-los a adorar juntos.\n  3. Lidere o seu grupo ou peçam a um membro que lidere um período de ceia COM A AJUDA DO VIDEO DE\n      REALIZAÇÃO DE SANTA CEIA COM O NOSSO PASTOR – CANAL DO YOU TUBE MEGA APRISCO. Façam disso algo\n      constante no grupo.\n  4. Concordem de jejuarem juntos. pode ser por um dia ou tempo especifico do dia, e pode ser de alimento ou de\n      outra coisa (aqueles com problemas físicos podem jejuar de outras coisas que não sejam alimentos).Passem\n      tempo juntos refletindo sobre dependência de Deus. Passem tempo agradecendo a Deus por tudo o que ele\n      tem feito por você e pelo que fará no futuro\nCOMUNHAO\n  1. Promova um retiro com o grupo ele poderia ser por finidade (casais,solteiros,etc.).Ou um retiro espiritual.\n     Arranjem tempo para estarem juntos.\n  2. Planejem uma viagem de fim de semana ou um acampamento juntos. Procure maneiras divertidas de\n     compartilhar a vida em grupo.\n  3. Façam a avaliação de saúde espiritual como grupo e descubram os pontos fortes de cada membro. Façam\n     também o plano de saúde em grupo e que membros supram algumas necessidades baseados nesses pontos\n     fortes.\n  4. Convidem alguém novo para participar do grupo. Talvez saibam de alguém que queiram convidar ,ou poderiam\n     conversar com lideres em sua igreja sobre quem esta procurando um grupo.\nDISCIPULADO\n  1. Planejem o seu material ou tópico de estudo com um ano de antecedência; Tente equilibrar o seu material de\n     estudo. Estabeleça um alvo de fazer no mínimo um estudo sobre um livro da bíblia (discipulado),um estudo\n     relacionado a estagio da vida (comunhão),um estudo sobre saúde –disciplinas espirituais (adoração),e um\n     estudo relacionado a missões (evangelismo-serviço).Façam com que seu material de estudo reflita o equilíbrio\n     que desejam para o grupo.\n  2. Façam com que o grupo realize a avaliação de saúde espiritual e então o pano de saúde em grupo juntos.\n     Procurem maneiras de estimular o compromisso do grupo baseado nos pontos fortes e nas paixões que\n     possuam com o fim em particular. estabeleçam alvos para equilibrar os propósitos nos próximos seis meses.\n  3. Tome os resultados da avaliação de saúde espiritual de cada pessoa, baseado em seus pontos fortes e em suas\n     fraquezas organizando as pessoas no grupo por gênero, com parceiros espirituais. Por exemplo (se eu sou fraco\n     no discipulado, devo ficar com quem é forte) isso permitira aos membros do seu grupo se relacionar de maneira\n     natural e a não serem vistos como mestres de obras tentando manter um projeto .Compartilhem regulamente\n     os resultados com o grupo.\n\nMINISTERIO\n  1. Como grupo, passem tempo compartilhando o perfil uns dos outros. Quais são algumas das maneiras pelas\n     quais cada membro pode contribuir para fortalecer o grupo, baseadas em um propósito em particular ?\n     Incentivem e busquem maneiras para que eles contribuam com a saúde do seu grupo, baseada em suas paixões\n     por uma área especifica de propósito.\n\n  2. Como grupo, busque maneiras de servir outros grupos. Talvez vocês possam descobrir quais são as\n     necessidades de outros grupos e tentar supre-las. Ou ofereçam cuidar dos filhos para que o grupo possa ter\n     uma noite de comunhão (exemplo cada grupo oferece apoio ao outro grupo no cuidado com crianças) Procure\n     maneiras de se conectar com outros grupos da igreja .\n  3. Encontre um ministério que seu grupo possa apoiar ou a qual possa servir regulamente. Faça uma lista de\n\noportunidades de sua igreja e escolha uma maneira de servir juntos como grupo.\n  4. Encorajem seus membros de grupo a servirem em algum tipo de ministério na igreja. Reflitam regulamente\n     como grupo sobre o que Deus esta fazendo por meio de cada pessoa enquanto servem e celebram\n\nMISSÕES\n  1. Escolha uma pessoa com quem partilhar sua fé esta semana. Retornem e relatem como foi à experiência. Talvez\n     desejem convidar essa pessoa para o seu grupo.\n  2. Convidem seus amigos que não conhecem a Cristo para uma festa do grupo e compartilhem um pouco sobre a\n     comunidade que vocês têm como grupo. Talvez descubram que alguns de seus amigos desejem frequentar o\n     grupo.\n  3. Escolham apoiar uma necessidade ou uma causa em sua comunidade local. Pode ser uma escola, uma missão,\n     etc. Procurem oportunidade de servir por meio do ministério de missões na igreja .\n  4. Com o grupo sejam voluntários de uma viagem missionária concentrada em um grupo de pessoas não\n     alcançadas pelo qual vocês têm orado.\n\n                                                                                           Igreja de Vencedores\n         98", "quiz": [{"q": "Qual é o texto bíblico-base da lição \"O DISCIPULO E AS ORDENANÇAS\"?", "options": ["Tiago 4:7; I João 3:8; Efésios 4:27;", "Atos 2.41", "2\nCoríntios     5:14", "Tiago 5.17,18"], "answer": 1}, {"q": "Qual destes é um dos tópicos estudados na lição \"O DISCIPULO E AS ORDENANÇAS\"?", "options": ["A Necessidade Do Batismo", "A Bíblia Fala De Ofertas Alçadas, O Que Vem A Ser Esta Oferta?", "Damos Glória A Deus Falando Dele Às Outras Pessoas", "Uma Nova Vida Moral"], "answer": 0}, {"q": "Qual destes tópicos NÃO faz parte da lição \"O DISCIPULO E AS ORDENANÇAS\"?", "options": ["Siginificado E Finalidade Da Santa Ceia", "Elementos Que Constituiem A Ceia", "Como O Cristão Deve Participar Da Santa Ceia", "Exemplos De Pessoas Fiéis Nos Dizimos E Nas Ofertas"], "answer": 3}]}, {"num": 18, "title": "AUTORIDADE ESPIRITUAL", "verseRef": "Filipenses 2.8", "content": "TEXTO BÍBLICO\n\n\"... tornando-se obediente até a morte, e morte de cruz.\" Filipenses 2.8\n\n       Porque Jesus tinha uma autoridade digna de admiração? Porque curava enfermos e expulsava\ndemônios? A resposta é que sempre viveu em perfeita obediência \"... tornando-se obediente até a\nmorte, e morte de cruz.\"\n\n        Para ter autoridade, é necessário está debaixo de autoridade, que em nosso caso é, estarmos\ndebaixo da autoridade dos nossos Pastores e pais espirituais Ermeson e Leiane Souza e esta autoridade\né representativa, ou seja, não é própria, e sim dada por Deus. (Rm 13.1)\n\n      Estamos debaixo da autoridade dos nossos Pastores Ermeson e Leiane Souza e devemos seguir\ntudo o que Deus colocar em seus corações, sabendo que fazendo isso estamos seguindo o desejo do\nSenhor Jesus para nossas vidas, pois a unção que está sobre nós veio primeiro sobre as vidas dos\nnossos Pastores Ermeson e Leiane Souza.\n\n      1. CASOS DE REBELDIA\n\n* Nadabi e Abiú (Lv 10. 1-10). Ora, Nadabi, e Abiú, filhos de Arão, tomaram cada um o seu\nincensário e, pondo neles fogo e sobre ele deitando incenso, ofereceram fogo estranho perante o\nSenhor, o que ele não lhes ordenara. Então saiu fogo de diante do Senhor, e os devorou; e morreram\nperante o Senhor. Disse Moisés a Arão: Isto é o que o Senhor falou, dizendo: Serei santificado\nnaqueles que se chegarem a mim, e serei glorificado diante de todo o povo. Mas Arão guardou\nsilêncio. E Moisés chamou a Misael e a Elzafã, filhos de Uziel, tio de Arão, e disse-lhes: Chegai-vos,\nlevai vossos irmãos de diante do santuário, para fora do arraial. Chegaram-se, pois, e levaram-nos\ncomo estavam, nas próprias túnicas, para fora do arraial, como Moisés lhes dissera. Então disse\nMoisés a Arão, e a seus filhos Eleazar e Itamar: Não descubrais as vossas cabeças, nem rasgueis as\nvossas vestes, para que não morrais, nem venha a ira sobre toda a congregação; mas vossos irmãos,\ntoda a casa de Israel, lamentem este incêndio que o Senhor acendeu. E não saireis da porta da tenda\nda revelação, para que não morrais; porque está sobre vós o óleo da unção do Senhor. E eles fizeram\nconforme a palavra de Moisés. Falou também o Senhor a Arão, dizendo: Não bebereis vinho nem\nbebida forte, nem tu nem teus filhos contigo, quando entrardes na tenda da revelação, para que não\nmorrais; estatuto perpétuo será isso pelas vossas gerações, não somente para fazer separação entre o\nsanto e o profano, e entre o imundo e o limpo...\n\nA rebeldia se manifesta quando a desarmonia com o resto do corpo (v.1).\n\n      A rebeldia se manifesta quando nos aproximamos de Deus como nós queremos, e não como\nDeus manda. Descuidar dos mandamentos de Deus é rebeldia (v.1).\n\n         Se nos apresentarmos diante de Deus com rebeldia, nos trará juízo (v.2) e (1 Co 11.17-29).\n\n         Devemos entender que é Deus quem estabelece as coisas (v.10).\n\n* Miriã e Arão (Nm 12). Ora, falaram Miriã e Arão contra Moisés, por causa da mulher cuchita que\neste tomara; porquanto tinha tomado uma mulher cuchita. E disseram: Porventura falou o Senhor\nsomente por Moisés? Não falou também por nós? E o Senhor o ouviu. Ora, Moisés era homem mui\nmanso, mais do que todos os homens que havia sobre a terra. E logo o Senhor disse a Moisés, a Arão\ne a Miriã: Saí vós da tenda da revelação. E saíram eles três. Então o Senhor desceu em uma coluna de\nnuvem, e se pôs à porta da tenda; depois chamou a Arão e a Miriã, e os dois acudiram. Então disse:\nOuvi agora as minhas palavras: se entre vós houver profeta, eu, o Senhor, a ele me farei conhecer em\nvisão, em sonhos falarei com ele. Mas não é assim com o meu servo Moisés, que é fiel em toda a\nminha casa; boca a boca falo com ele, claramente e não em enigmas; pois ele contempla a forma do\nSenhor. Por que, pois, não temestes falar contra o meu servo, contra Moisés? Assim se acendeu a ira\ndo Senhor contra eles; e ele se retirou; também a nuvem se retirou de sobre a tenda; e eis que Miriã se\ntornara leprosa, branca como a neve; e olhou Arão para Miriã e eis que estava leprosa. Pelo que\nArão disse a Moisés: Ah, meu Senhor! rogo-te não ponhas sobre nós este pecado, porque procedemos\nloucamente, e pecamos. Não seja ela como um morto que, ao sair do ventre de sua mãe, tenha a sua\ncarne já meio consumida. Clamou, pois, Moisés ao Senhor, dizendo: ó Deus, rogo-te que a cures.\nRespondeu o Senhor a Moisés: Se seu pai lhe tivesse cuspido na cara não seria envergonhada por sete\ndias? Esteja fechada por sete dias fora do arraial, e depois se recolherá outra vez. Assim Miriã esteve\nfechada fora do arraial por sete dias; e o povo não partiu, enquanto Miriã não se recolheu de novo.\nMas depois o povo partiu de Hazerote, e acampou-se no deserto de Parã.\n\n         As diferentes personalidades não devem levar-nos a questionar a autoridade, e sim orar por ela\n(v.1).\n\n         Deus delega sua autoridade soberanamente. Por Ele nós devemos crer que não agiríamos melhor\n(v.2).\n\n         Deus ouve a murmuração acerca de sua autoridade.\n\n         Deus mesmo sai em defesa da autoridade criticada (v.4).\n\n         Devemos ter temor em falar mal, e ir contra as autoridades que Deus levantou (v.8).\n\n         A murmuração acarreta juízo (v.10).\n\n                                                                                      Igreja de Vencedores\n\n* Coré, Datã e Abirão (Nm 16). Ora, Coré, filho de Izar, filho de Coate, filho de levi, juntamente com\nDatã e Abirão, filhos de Eliabe, e Om, filho de Pelete, filhos de Rúben, tomando certos homens,\nlevantaram-se perante Moisés, juntamente com duzentos e cinqüenta homens dos filhos de Israel,\npríncipes da congregação, chamados à assembléia, varões de renome; e ajuntando-se contra Moisés e\ncontra Arão, disseram-lhes: Demais é o que vos arrogais a vós, visto que toda a congregação e santa,\ntodos eles são santos, e o Senhor está no meio deles; por que, pois, vos elevais sobre a assembléia do\nSenhor? Quando Moisés ouviu isso, caiu com o rosto em terra; depois falou a Coré e a toda a sua\ncompanhia, dizendo: Amanhã pela manhã o Senhor fará saber quem é seu, e quem é o santo, ao qual\nele fará chegar a si; e aquele a quem escolher fará chegar a si. Fazei isto: Coré e toda a sua\ncompanhia, tomai para vós incensários; e amanhã, pondo fogo neles, sobre eles deitai incenso perante\no Senhor; e será que o homem a quem o Senhor escolher, esse será o santo; demais é o que vos\narrogais a vós, filhos de levi. Disse mais Moisés a Coré: Ouvi agora, filhos de levi! Acaso é pouco\npara vós que o Deus de Israel vos tenha separado da congregação de Israel, para vos fazer chegar a\nsi, a fim de fazerdes o serviço do tabernáculo do Senhor e estardes perante a congregação para\nministrar-lhe, e te fez chegar, e contigo todos os teus irmãos, os filhos de levi? Procurais também o\nsacerdócio? Pelo que tu e toda a tua companhia estais congregados contra o Senhor; e Arão, quem é\nele, para que murmureis contra ele? Então Moisés mandou chamar a Datã e a Abirão, filhos de\nEliabe; eles, porém responderam: Não subiremos. É pouco, porventura, que nos tenhas feito subir de\numa terra que mana leite e mel, para nos matares no deserto, para que queiras ainda fazer-te príncipe\nsobre nós? Ademais, não nos introduziste em uma terra que mana leite e mel, nem nos destes campos e\nvinhas em herança; porventura cegarás os olhos a estes homens? Não subiremos. Então Moisés irou-\nse grandemente, e disse ao Senhor: Não atentes para a sua oferta; nem um só jumento tenho tomado\ndeles, nem a nenhum deles tenho feito mal. Disse mais Moisés a Coré: Comparecei amanhã tu e toda a\ntua companhia perante o Senhor; tu e eles, e Arão. Tome cada um o seu incensário, e ponha nele\nincenso; cada um traga perante o Senhor o seu incensário, duzentos e cinqüenta incensários; também\ntu e Arão, cada qual o seu incensário. Tomou, pois, cada qual o seu incensário, e nele pôs fogo, e nele\ndeitou incenso; e se puseram à porta da tenda da revelação com Moisés e Arão. E Coré fez ajuntar\ncontra eles toda o congregação à porta da tenda da revelação; então a glória do Senhor apareceu a\ntoda a congregação. Então disse o Senhor a Moisés e a Arão: Apartai-vos do meio desta congregação,\npara que eu, num momento, os possa consumir. Mas eles caíram com os rostos em terra, e disseram:\nÓ Deus, Deus dos espíritos de toda a carne, pecará um só homem, e indignar-te-ás tu contra toda esta\ncongregação? Respondeu o Senhor a Moisés: Fala a toda esta congregação, dizendo: Subi do\nderredor da habitação de Coré, Datã e Abirão. Então Moisés levantou-se, e foi ter com Datã e Abirão;\ne seguiram-nos os anciãos de Israel. E falou à congregação, dizendo: Retirai-vos, peço-vos, das\ntendas desses homens ímpios, e não toqueis nada do que é seu, para que não pereçais em todos os seus\npecados. Subiram, pois, do derredor da habitação de Coré, Datã e Abirão. E Datã e Abirão saíram, e\nse puseram à porta das suas tendas, juntamente com suas mulheres, e seus filhos e seus pequeninos.\nEntão disse Moisés: Nisto conhecereis que o Senhor me enviou a fazer todas estas obras; pois não as\ntenho feito de mim mesmo. Se estes morrerem como morrem todos os homens, e se forem visitados\ncomo são visitados todos os homens, o Senhor não me enviou. Mas, se o Senhor criar alguma coisa\nnova, e a terra abrir a boca e os tragar com tudo o que é deles, e vivos descerem ao Seol, então\ncompreendereis que estes homens têm desprezado o Senhor. E aconteceu que, acabando ele de falar\ntodas estas palavras, a terra que estava debaixo deles se fendeu; e a terra abriu a boca e os tragou\ncom as suas famílias, como também a todos os homens que pertenciam a Coré, e a toda a sua fazenda.\nAssim eles e tudo o que era seu desceram vivos ao Seol; e a terra os cobriu, e pereceram do meio da\ncongregação, E todo o Israel, que estava ao seu redor, fugiu ao clamor deles, dizendo: não suceda que\na terra nos trague também a nós. Então saiu fogo do Senhor, e consumiu os duzentos e cinqüenta\nhomens que ofereciam o incenso. Então disse o Senhor a Moisés: Dize a Eleazar, filho de Arão, o\n\nsacerdote, que tire os incensários do meio do incêndio; e espalha tu o fogo longe; porque se tornaram\nsantos os incensários daqueles que pecaram contra as suas almas; deles se façam chapas, de obra\nbatida, para cobertura do altar; porquanto os trouxeram perante o Senhor, por isso se tornaram\nsantos; e serão por sinal aos filhos de Israel. Eleazar, pois, o sacerdote, tomou os incensários de\nbronze, os quais aqueles que foram queimados tinham oferecido; e os converteram em chapas para\ncobertura do altar, para servir de memória aos filhos de Israel, a fim de que nenhum estranho,\nninguém que não seja da descendência de Arão, se chegue para queimar incenso perante o Senhor,\npara que não seja como Coré e a sua companhia; conforme o Senhor dissera a Eleazar por intermédio\nde Moisés. Mas no dia seguinte toda a congregação dos filhos de Israel murmurou contra Moisés e\nArão, dizendo: Vós matastes o povo do Senhor. E tendo-se sublevado a congregação contra Moisés e\nArão, dirigiu-se para a tenda da revelação, e eis que a nuvem a cobriu, e a glória do Senhor apareceu.\nVieram, pois, Moisés e Arão à frente da tenda da revelação. Então disse o Senhor a Moisés: Levantai-\nvos do meio desta congregação, para que eu, num momento, a possa consumir. Então caíram com o\nrosto em terra. Depois disse Moisés a Arão: Toma o teu incensário, põe nele fogo do altar, deita\nincenso sobre ele e leva-o depressa à congregação, e faze expiação por eles; porque grande\nindignação saiu do Senhor; já começou a praga. Tomou-o Arão, como Moisés tinha falado, e correu\nao meio da congregação; e eis que já a praga havia começado entre o povo; e deitando o incenso no\nincensário, fez expiação pelo povo. E pôs-se em pé entre os mortos e os vivos, e a praga cessou. Ora,\nos que morreram da praga foram catorze mil e setecentos, além dos que morreram no caso de Coré. E\nvoltou Arão a Moisés à porta da tenda da revelação, pois cessara a praga.\n\n         Não devemos olhar para o homem, e sim de onde vem a autoridade com a qual está revestida\n(v.3).\n\n         Deus sempre sai em defesa daquele que Ele deu Autoridade (v.5).\n\n         A dúvida e a discórdia abrem a porta da rebeldia (v.9).\n\n         Atacar a autoridade é atacar o próprio Deus (v.11) e (Rm 13.1 e2).\n\n         O espírito de rebeldia é altamente contagioso, pois é o próprio espírito do diabo (v.19).\n\n         2. ATENTOS PARA AS MANIFESTAÇÕES DE REBELDIA\n\n       Nas palavras: Mt 12.34; Jd 1.8-10; Ef 5.6; 2 Pe 2.10-12 – amaldiçoar: significa dizer mal, falar\nmal e etc.\n\n       Na razão Rm 9.11-24. O homem sempre justifica sua rebeldia, assim como Adão justificou seu\nato, achando que a \"a culpa era da mulher\" ; \" que me deste\".Indiretamente a culpa era depositada em\nDeus, que lhe havia dado a mulher. Quando existem decisões das autoridades que não estão de acordo\ncom que pensamos, mesmo assim, devemos obedecer, pois sabemos que toda autoridade foi dada por\nDeus.\n\n      Quem se atreveria a discutir com Deus? Seguramente ninguém se atreveria se ele viesse em\nforma visível, cara-a-cara; porém somos rápidos para discutirmos sobre as autoridades que ele delegou.\nQuanto ao mais, irmãos, tudo o que é verdadeiro, tudo o que é honesto, tudo o que é justo, tudo o que\n\n                                                                                        Igreja de Vencedores\n\né puro, tudo o que é amável, tudo o que é de boa fama, se há alguma virtude, e se há algum louvor,\nnisso pensa. Filipenses 4.8\n\n       Os pensamentos: O pensamento se torna forte ao buscarmos uma justificativa, uma razão para\nnos valer, e logo se torna em palavras, e vem a murmuração e por isso temos que prendê-las a tempo,\nno pensamento. A solução é levar cativo nosso pensamento ao pensamento de Cristo, ou seja,\nconcentrar nosso pensamento em Deus e pedir que o Senhor tire toda murmuração do nosso coração,\npois foi isso que destruiu o povo de Israel no deserto...\n\n       3. TENHA A MESMA UNÇÃO DOS NOSSOS PAIS ESPIRITUAIS\n\n        Em Nm 11.16 e 17, \"Disse então o Senhor a Moisés: Ajunta-me setenta homens dos anciãos de\nIsrael, que sabes serem os anciãos do povo e seus oficiais; e os trarás perante a tenda da revelação,\npara que estejam ali contigo. Então descerei e ali falarei contigo, e tirarei do espírito que está sobre\nti, e o porei sobre eles; e contigo levarão eles o peso do povo para que tu não o leves só. A Bíblia nos\nfala que a grande unção que estava sobre Moisés, foi derramada sobre os setenta e eles profetizavam. O\nEspírito do Senhor veio sobre Moisés. O Senhor tomou o Espírito que estava nele e deu aos setenta\nanciões. Os setenta começaram a pensar como Moisés, agir como Moisés e discernir com Moisés. Deus\nhavia levantado Moisés como líder do povo e os setenta separados para acompanhá-lo e auxiliá-lo.\nAssim nós também somos os setenta dos Pastores Ermeson e Leiane Souza. Deus levantou e ungiu este\ncasal para serem Lideres e Pais Espirituais da Igreja de Vencedores e cada coordenador de base,\nauxiliar, líder de ministério, líder de geração, líder de célula, Deus os separou para serem os setenta dos\nPastores Ermeson e Leiane Souza e serem separados para acompanhá-lo e auxiliá-lo no que Deus\ncolocar em seus corações.\n\n       Quando agimos em submissão e obediência aos nossos lideres e pais espirituais, o nosso espírito\nse fortalece com a visão e a missão que nos foi entregue. Quando somos um com os nossos Pastores e\nnos identificamos com suas metas, com seu trabalho, com sua vida e coração não será difícil\ncumprirmos o nosso propósito aqui na terra.\n\n      Esta submissão aos nossos Pastores deve ser o primeiro objetivo: Ser um com o coração dos\nnossos pais espirituais. Com o passar do tempo, Deus recompensará essa fidelidade e submissão, como\nfez com Josué.\n\n     DISCIPULADO\n\n      A Bíblia nos fala que a grande unção que estava sobre Moisés, foi derramada sobre os setenta e\neles profetizavam. O Espírito do Senhor veio sobre Moisés. O Senhor tomou o Espírito que estava nele\ne deu aos setenta anciões. Os setenta começaram a pensar como Moisés, agir como Moisés e discernir\ncom Moisés. Deus havia levantado Moisés como líder do povo e os setenta separados para acompanhá-\nlo e auxiliá-lo (Nm 11.16 e 17).\n\n1. Assim nós também somos os setenta dos Pastores Ermeson e Leiane Souza. Deus levantou e\nungiu este casal para serem Lideres e Pais Espirituais da Igreja de Vencedores e lhe separou para ser\num dos setenta dos Pastores Ermeson e Leiane Souza a fim de acompanhá-lo e auxiliá-lo no que Deus\ncolocar em seus corações.\n\n     2. Comece por evangelizar as pessoas com as quais você está mais relacionado, por exemplo:\nseus familiares, vizinhos, amigos, colegas de trabalho ou da escola, etc. todos carecem da salvação e\nprecisam de Jesus.\n     3. Peça a Deus que lhe ajude a ganhar o maior número possível de almas para Cristo. Lembre-se:\nvocê é uma nova criatura e pertence à família de Deus; convide outras pessoas a fazer parte dela\ntambém. Deus vai abençoar grandemente o seu trabalho evangelístico e sua célula irá crescer em nome\nde Jesus. Amém.\n     4. Seja Fiel a Deus, aos nossos Pastores e a sua Igreja.\n\nVERIFIQUE O QUE VOCÊ APRENDEU\n\n1. Defina Autoridade Espiritual.\n\n______________________________________________________________________________\n\n2. Segundo a lição o que aconteceu com Nadabi e Abiú?\n\n______________________________________________________________________________\n\n3. Segundo a lição o que aconteceu com Miriã e Arão?\n\n______________________________________________________________________________\n\n4 Segundo a lição o que aconteceu com Coré, Datã e Abirão?\n\n______________________________________________________________________________\n\n5. Estamos debaixo de que autoridade espiritual?\n\n______________________________________________________________________________\n\n                                                                                  Igreja de Vencedores\n         104", "quiz": [{"q": "Qual é o texto bíblico-base da lição \"AUTORIDADE ESPIRITUAL\"?", "options": ["2 Coríntios 5.17", "Filipenses 2.8", "Mateus 6:9-15; Lucas 11:1-4; II Crônicas 7:14", "Marcos 16.15"], "answer": 1}, {"q": "Qual destes é um dos tópicos estudados na lição \"AUTORIDADE ESPIRITUAL\"?", "options": ["Mande Afastar As Cadeiras Ou Bancos Para Que Haja Mais Espaço", "A Ordem É Servir A Deus", "O Valor Da Unção", "Casos De Rebeldia"], "answer": 3}, {"q": "Qual destes tópicos NÃO faz parte da lição \"AUTORIDADE ESPIRITUAL\"?", "options": ["Tenha A Mesma Unção Dos Nossos Pais Espirituais", "Segundo A Lição O Que Aconteceu Com Nadabi E Abiú?", "Casos De Rebeldia", "Escola De Vencedores ( Classe Da Maturidade - Classes 101-501)"], "answer": 3}]}, {"num": 19, "title": "O DISCIPULO E O CHAMADO", "verseRef": "1 Timóteo 5.22", "content": "TEXTO BÍBLICO\n\n    \"A ninguém imponha precipitadamente as mãos. Não te tornes cúmplice de pecados de outrem.\nConserva-te a ti mesmo puro\" (1 Timóteo 5.22).\n\n     INTRODUÇÃO\n\n     Chamado – consciência: responsabilidades e privilégios inerentes ao chamado.\n\n     COMENTÁRIO\n\nI. A CONSCIÊNCIA DO SEU CHAMADO\n\n      O ato de impor as mãos tinha, e tem o significado de separação para o ministério. No caso em\nquestão, a exortação é feita por Paulo e dirigida a Timóteo, no sentido de que ele, no papel de bispo na\nigreja, tivesse muito cuidado ao separar alguém ministerialmente.\n\n     Mas, porque tanto cuidado ao simples fato de se impor as mãos e delegar autoridade ministerial a\nalguém?\n\n     Exatamente porque não é assim tão simples a separação para o ministério.\n\n     1. Primeiramente: Ele é fruto de uma escolha que vem de Deus.\n\n     \"Não fortes vós que me escolhestes a mim, pelo contrário, eu vos escolhi a vós outros e vos\ndesignei para que vades e deis frutos e o vosso fruto permaneça; a fim de que tudo quanto pedirdes ao\nPai em meu nome, Ele vo-lo conceda\" (Jo 15.16).\n\n     Quando você começou a caminhar com o Senhor, quando sentiu o desejo de se engajar\nministerialmente, quando foi despertado para a realidade espiritual de que estava sendo chamado para\nlogo mais na igreja, pois bem, quando tudo isso saltou às suas vistas, é porque Deus já o havia\nescolhido.\n\n     A escolha de Deus não está absolutamente baseada em qualquer tipo de mérito humano, pois\nDavi disse:\n\n      \"Os teus olhos viram a minha substância ainda informe, e no teu livro foram escritos os dias,\nsim, todos os dias que foram ordenados para mim, quando ainda não havia nem um deles.\" (Salmo\n139.16).\n\nQuando Deus fala a Jeremias para que pare de enxergar suas próprias limitações e passe a\nperceber o poderoso chamado profético de Deus em sua vida, nessa ocasião o Senhor lhe afirma:\n\n     \"Antes que eu te formasse no ventre materno, eu te conheci, e, antes que saísses da madre, te\nconsagrei, e te constituí profeta às nações\" (Jeremias 1.5).\n\n      Lembrando que Jeremias era filho de sacerdote, assim como a grande maioria dos profetas do\nAntigo Testamento e, portanto, consagrados desde o ventre por seus pais, o que abria caminho e os\nhabilitava para que Deus os chamasse.\n\n     Há muitos outros textos como estes na Palavra de Deus, os quais deixam claro o fato de que foi\nDeus quem nos chamou.\n\n      Firmada então essa verdade espiritual, entendemos o seguinte: Deus não baseou Seu chamado em\ncritérios humanos, mesmo porque, quais critérios poderiam haver de diferente entre uma criança ou\noutra? Assim também, entre nós que fomos chamados pelo Senhor, o que nos diferenciava de outras\npessoas, em termos humanos, quando ainda andávamos sem Cristo? Absolutamente nada, a não ser\nalgo que Deus, em Sua pré-ciência, enxergou e que não se explica em termos humanos, simplesmente\nse aceita ou não. E quando aceitamos, somos, então, eleitos para vivermos tudo aquilo que Ele tem.\n\n               MEMORIZE: Chamado aceito = pré-requisito par ser eleito por Deus!\n\n     Não há absolutamente nenhuma passagem bíblica na qual Deus pede a opinião do homem quando\no chama. É fácil entendermos o porquê:\n\n     Quando ainda não conhecíamos a Cristo, nossa vontade, assim como todos os nossos referenciais,\nestava completamente distorcida e deformada sob o ponto de vista espiritual e, certamente, se Deus nos\napresentasse o Seu plano nessa hora, diríamos um categórico \"NÃO!\"\n\n     2. Ele simplesmente nos chama.\n\n     É por isso que Ele nunca pergunta, mas sim, simplesmente nos chama e, se aceitamos esse\nchamado, aí então somos escolhidos e o Senhor nos elege, capacita e \"põe em nós tanto o querer\nquanto o realizar\" (Filipenses 2.13).\n\n     Veja essas verdades espirituais expressas no chamado de homens de Deus:\n\n     * Abrão (posteriormente chamado Abraão) – Gênesis 12.1-3;\n\n     * Moisés – Êxodo 3.10-22; 4.1-17;\n\n     * Josué – Josué 1.1-9;\n\n     * Gideão – Juízes 6.11-24;\n\n     * Eliseu – 1 Reis 19.19-21;\n\n                                                                                   Igreja de Vencedores\n\n     E assim, diversos outros servos de Deus, incluindo você e eu, os quais, sem que pudéssemos\n     supor, já havíamos sido separados por Deus para sermos os continuadores das obras de Jesus e\n     isso, de uma forma muito especial – como ministros de Deus e, porque aceitamos esse chamado,\n     usamos o nosso livre arbítrio e dissemos \"SIM\" ao Senhor; por isso somos escolhidos de Deus!\n     A vontade de Deus para Nós é que sejamos:\n     Líder de Célula\n     Líder de Geração\n     Líder de Ministério\n     Coordenador de base auxiliar\n     Coordenador de base\n     E desta forma ganharmos o mundo para Jesus Cristo aquele que nos Salvou e Chamou\n\n                             Você consegue entender esse privilégio?\n\nII. AS RESPONSABILIDADES                E   PRIVILÉGIOS        INERENTES        AO     CHAMADO\nMINISTERIAL\n\n     Apesar da imensa responsabilidade, esse chamado, na verdade, é um grande privilégio, pois entre\nmuitos, fomos chamados e escolhidos por Deus para um ministério santo, dentro de uma seleção\nsoberana e amorosa por parte do Pai.\n\n     1. Em segundo lugar, esse chamado se torna em uma eleição irrevogável e nos atribui\nresponsabilidades e privilégios.\n\n\"Porque os dons e a vocação de Deus são irrevogáveis\" (Romanos 11.29).\n\n      Outro aspecto igualmente importante, ao qual devemos nos ater, é quanto à eternidade da unção,\nda eleição e do chamado de Deus em nossas vidas.\n\n     Como tudo o mais que vivemos em nossas vidas desde que nos conhecemos como seres\npensantes, assim também ministerialmente, nossas vidas compreendem \"deveres\" e \"regalias\".\n\n     Quanto ao chamado ministerial especificamente, essas duas coisas são inseparáveis, visto que o\nnosso sagrado dever – servir a Deus – é também para nós, o maior privilégio de nossas vidas e nossa\ngrande fonte de prazer.\n\n     2. Chamado permanente, responsabilidade eterna.\n\n     É necessário que tenhamos a consciência de que, a partir do momento em que aceitamos Jesus\ncomo nosso Salvador e Senhor, nesse mesmo momento perdemos o nosso livre arbítrio quanto a\nquerermos ou não fazer a vontade de Deus e, mais do que realizarmos a obra, precisamos fazê-la com\namor.\n\nSó há uma forma de realizar a obra de Deus e cumprir com o nosso chamado: com amor,\nconforme a orientação bíblica, e debaixo das autoridades espirituais constituídas na igreja!\n\n     A esse respeito o Apóstolo Paulo escreveu:\n\n     \"Se anuncio o evangelho, não tenho do que me gloriar, pois sobre mim pesa essa obrigação;\nporque ai de mim se não pregar o evangelho! Se o faço de livre vontade, tenho galardão; mas, se\nconstrangido, é, então, a responsabilidade de despenseiro que me está confiada. Nesse caso, qual é o\nmeu galardão? É que, evangelizando, proponha, de graça, o evangelho, para não me valer do direito\nque ele me dá. Porque, sendo livre de todos, fiz-me escravo de todos, a fim de ganhar o maior numero\npossível\" (1 Coríntios 9.16-19).\n\n     O que há de tão maravilhoso nessa verdade?\n\n      É que, ao aceitarmos Jesus como nosso Senhor e Salvado, temos deveres e responsabilidades\nespirituais a serem cumpridas e todos nós sabemos que não há nada de extraordinário em realizarmos\nas nossas próprias tarefas e cumprirmos com nossas obrigações, pelo contrário, é comum ouvirmos a\nfrase: \"não fez mais do que a obrigação!\".\n\n     Em se tratando de Deus, porém, Ele enxerga essa questão com outros olhos e é disso que essa\npassagem trata: se cumprirmos aquilo que nos foi atribuído, simplesmente porque temos uma\nincumbência, estaremos, então, cumprindo nossas tarefas diante de Deus; se, porém, realizarmos a\nmesma obra com o coração aberto e grato, ainda seremos recompensados por Deus.\n\n     3. Além de tudo ainda há um galardão\n\n     Recompensados pelo que?\n\n     Pelo maior privilégio da terra que é poder servir a Deus?\n\n     Por estarmos na Sua maravilhosa presença?\n\n     Pela honra de realizarmos a obra que Ele não confiou nem mesmo aos seus anjos, os quais\nanelam fazer aquilo que Deus nos deu para fazermos?\n\n     Por isso tudo, e muito mais, é que ainda somos recompensados e realizamos com zelo a Sua obra.\n\n     É interessante observarmos um aspecto dessa palavra: o Apostolo fala de duas diferentes\npossibilidades em relação à realização da obra de Deus – fazê-la por entender que é uma obrigação ou,\nentão, realizá-la de todo o nosso coração. A terceira possibilidade que seria, por qualquer que fosse o\nmotivo, não realizar a obra, simplesmente não existe!\n\n     Exatamente por isso tudo, realizar a obra de Deus é uma incumbência santa que nos foi atribuída\ne que, não esqueça: nós aceitamos e, negligenciarmos essa incumbência traz consequências desastrosas\nsob o ponto de vista espiritual.\n\n                                                                                    Igreja de Vencedores\n\nIII. AUTORIDADE ESPIRITUAL\n\n     \"Todo homem esteja sujeito às autoridades superiores; porque não há autoridade que não\nproceda de Deus; e as autoridades que existem foram por Ele instituídas. De modo que aquele que se\nopõe à autoridade, resiste à ordenação de Deus; e os que resistem trarão sobre si mesmos\ncondenação\" (Romanos 13.1-2).\n\n     1. Terceiro aspecto: fomos chamados debaixo de autoridade.\n\n      A questão da autoridade espiritual é, também, de suma importância a todos os cristãos e, de forma\nparticularmente especial, a todos aqueles que são chamados para servir no Reino de Deus.\n\n      Em primeiro lugar, pelo que o próprio texto da Palavra de Deus nos diz: que toda autoridade é\nprocedente de Deus e que o se opor a elas representa, em ultima instância, opor-se ao próprio Deus,\nvisto que Ele mesmo as instituiu dessa forma (Romanos 13.1).\n\n     2. Por que Deus instituiu homens com autoridade sobre a sua igreja?\n\n     Em primeiro lugar, para que houvesse aperfeiçoamento e edificação do Corpo de Cristo:\n\n      \"E Ele mesmo concedeu uns para apóstolos, outros para profetas, outros para evangelistas,\noutros para pastores e mestres, com vistas ao aperfeiçoamento dos santos para o desempenho do seu\nserviço, para a edificação do Corpo de Cristo\" (Efésios 4.11-12).\n\n     * Ele também as constituiu para que, bem ajustado, o Corpo de Cristo crescesse fortalecido:\n\n     \"Edificados sobre o fundamento dos apóstolos e profetas, sendo ele mesmo, Cristo Jesus, a pedra\nangular; no qual todo edifício, bem ajustado, cresce para santuário dedicado ao Senhor\" (Efésios\n2.20-21).\n\n     * E, finalmente, Ele as constituiu para que, através dessas autoridades, a unção de Deus venha\n     sobre a igreja.\n\n      Imagine a unção como um guarda chuvas abertos, em cujo interior e diâmetro fluam as águas que\nsão derramadas do céu. Quando nos colocamos debaixo desse guarda chuvas aberto, recebemos dele\num fluir de águas e nos tornamos nós mesmos em canais que derramarão dessas águas sobre outros que\nestiverem sob a nossa cobertura espiritual (Célula, Geração, Ministério, Congregação, Área e os\nBispos). Agora, entendamos esse guarda chuvas maior como os sacerdotes, posto por Deus sobre as\nnossas vidas que são os Bispos Ermeson e Leiane Souza; as águas são a unção que é derramada sobre\neles na condição de sacerdotes. Pois bem, nós somos o segundo guarda chuvas: a unção só fluirá dentro\ndaquele diâmetro. Ou nós ficamos embaixo dele ou ele simplesmente não fluirá sobre nós e,\nconsequentemente, não estaremos habilitados a exercer autoridade também. É exatamente por essa\nrazão que nossa autoridade espiritual depende do nível de submissão que apresentamos na outra ponta.\n\nIV. AS CONSEQUENCIAS DA NEGLIGENCIA E DA OMISSÃO\n\n     \"Maldito aquele que fizer a obra do Senhor relaxadamente! Maldito aquele que retém a sua\nespada do sangue!\" (Jeremias 48.10).\n\n    1. Quarto aspecto: sempre há consequências desastrosas quando negligenciamos nosso\nchamado ou quando somos omissos.\n\n    Assim como há um galardão em realizar com zelo a obra do Senhor que nos foi confiada, há\ntambém uma maldição espiritual em fazermos de qualquer maneira ou, ainda, deixarmos de realizá-la.\n\n      Muitas pessoas não entendem isso e agem como se nunca tivessem sido chamadas e ungidas por\nDeus; de um momento para outro, decidem por conta própria (como se tivessem realmente o direito de\nfazer isso), que não irão mais na igreja ou a célula, que não querem mais servir, só querem ouvir a\nPalavra, que o tempo dela acabou aqui ou ali e, por isso, decidiu abandonar tudo e mudar para cá ou\npara lá.\n\n     Isso, simplesmente, é inadmissível sob o ponto de vista espiritual, pois uma vez ligado, não pode\nmais haver sequer a perspectiva do desligamento.\n\n    Para ilustrar isso, lembramo-nos daquilo que Deus disse a respeito da ligação existente entre\nAdão e Eva:\n\n     \"e por isso, deixa o homem pai e mãe e se une à sua mulher, tornando-se os dois uma só carne.\"\n(Gênesis 2.24). e como complemento dessa idéia, a analogia espiritual que o Apostolo Paulo faz de\nnossa ligação com Cristo, por meio de nosso chamado:\n\n     \"Ou não sabeis que o homem que se une à prostituta forma um só corpo com ela? Porque, como\nse diz, serão os dois uma só carne. Mas aquele que se une ao Senhor é um espírito com Ele.\" (1\nCoríntios 6.16-17).\n\n      Esse tipo de atitude, portanto, trás serias consequências, tanto para aquele que as pratica, quanto\npara os que estão ao redor e, de alguma forma, ligados ministerialmente a ele, assim como um peso\npara a igreja e a todo corpo de Cristo, os quais observarão a carga de trabalho que lhe cabia; além\ndisso, há ainda as pessoas que serão influenciadas pelo mau testemunho debaixo por aquele que\n\"abandona o barco\".\n\nGuarde em seu coração: \"Eu não posso parar e nem abandonar o barco, pois, se o fizer, eu\ndeixarei o Corpo de Cristo descoberto e isso acarretará maldição pessoal e familiar\"\n\n     Por que dizemos tudo isso?\n\n                                                                                     Igreja de Vencedores\n\n     Porque muitos ingressam com entusiasmo, porém, pela imaturidade e pela falta de\ncomprometimento pessoal com a obra, abrem mão dos preciosos valores de seu chamado, por causa\ndos momentos de instabilidade emocional, econômica e espiritual que atravessam, prejudicando assim,\nsensivelmente, o Corpo de Cristo.\n\n      É preciso que tenhamos em mente, de forma bem clara que, a partir do momento em que fomos\nchamados (e, lembre-se, isso não partiu de nós, mas sim, de Deus: não é opcional, mas sim, atribuído);\na partir desse momento, nossas ações não são mais ações isoladas, pois tudo aquilo que fazemos,\nafetará o Corpo. Há vidas que estão ligadas às nossas pela, Célula, Geração, Ministério e Congregação,\ne que de certa forma, dependem da firmeza de nossos posicionamentos.\n\n     \"para que não haja divisão no corpo; pelo contrário, cooperem os membros, com igual cuidado,\nem favor uns dos outros. De maneira que, se um membro sofre, todos sofrem com ele; e, se um deles é\nhonrado, com ele todos se regozijam. Ora, vós sois corpo de Cristo; e, individualmente, membros\ndesse corpo\" (1 Coríntios 12.25-27).\n\n     Por todas essas coisas, há que ter temor de Deus e, principalmente, aquele que foi Salvo e\nChamado para Servir ao Reino de Deus, deve ter um temor especial, sabendo que muitas vidas\ndependem do seu posicionamento.\n\n     DECLARE ASSIM: \"Senhor, eu entendo hoje a extensão e a importância da unção e do teu\nchamado em minha vida. Eu prometo jamais abandonar, trair ou negligenciar essa eleição\npreciosa; bem como, jamais permitir que a minha carne e os meus sentimentos me manipulem e\neu seja roubado desse chamado. Eu, porém, o honrarei e o porei sobre todas as coisas em minha\nvida, te servirei sendo um líder de célula, ou um líder de geração, ou um líder de ministério ou\num coordenador de base, tudo isto porque te amo e sou grato por ter me chamado de um mundo\nperdido, por isso eu te agradeço Senhor. Amém\".\n\n    DISCIPULADO\n\n     1. Como discípulo de Jesus e pregador do evangelho, você precisa está convicto que fora do\nevangelho não há esperança, não há remédio nem solução para as almas, e os cristãos tem esse poder.\nDeixar de partilhá-lo é contribuir para que as almas se percam.\n\n     2. Para podermos evangelizar apaixonadamente, precisamos ter a capacidade de ver as multidões\ncomo que através dos olhos de Jesus – como ovelhas sem pastor, desgarradas, errantes e sofredoras. Se\nassim não for, nosso trabalho de evangelização se tornará frio, rotineiro e secularizado, pecando por\nexcesso de organização por um lado, e, por outro, pela falta de amor e unção do Espírito Santo.\n\n     3. Se você não é um líder de célula ainda, comece nesta semana uma célula na casa de uma\npessoa que você ama e não quer ver nas garras do Diabo. Converse com seu líder de Geração ou\nCoordenador\n\n4. Ore e Jejue por três pessoas durante este mês e procure abrir uma célula na casa de cada uma\ndelas. Após as células abertas marque o discipulado em outro dia que não seja o da célula. Após a\nquarta lição marque o Encontro com Deus com ela.\n\nVERIFIQUE O QUE VOCÊ APRENDEU\n\n1. Defina o Chamado de Deus.\n\n______________________________________________________________________________\n\n2. Defina o chamado permanente de Deus.\n\n______________________________________________________________________________\n\n3. Defina autoridade espiritual.\n\n______________________________________________________________________________\n\n4. Defina o galardão de Deus.\n\n______________________________________________________________________________\n\n5. Defina a consequência de negligenciamos nosso chamado.\n\n______________________________________________________________________________\n\n                                                                                  Igreja de Vencedores\n         112", "quiz": [{"q": "Qual é o texto bíblico-base da lição \"O DISCIPULO E O CHAMADO\"?", "options": ["Tiago 4.8a", "2 Timóteo 4.7", "1 Timóteo 5.22", "1 João 4.1"], "answer": 2}, {"q": "Qual destes é um dos tópicos estudados na lição \"O DISCIPULO E O CHAMADO\"?", "options": ["Você Deve Formar A Equipe De Lideres Em Treinamento Com Propósitos", "Como O Cristão Deve Participar Da Santa Ceia", "As Consequencias Da Negligencia E Da Omissão", "O Processo Atos 5.42"], "answer": 2}, {"q": "Qual destes tópicos NÃO faz parte da lição \"O DISCIPULO E O CHAMADO\"?", "options": ["As Consequencias Da Negligencia E Da Omissão", "Autoridade Espiritual", "Devo Assimilar Sua Verdade", "A Consciência Do Seu Chamado"], "answer": 2}]}, {"num": 20, "title": "O DISCIPULO E A UNÇÃO", "verseRef": "Atos\n10.38", "content": "TEXTO BÍBLICO\n\n      \"como Deus ungiu a Jesus de Nazaré com o Espírito Santo e com poder, o qual andou por toda\nparte, fazendo o bem e curando a todos os oprimidos do diabo, porque Deus era com ele;\" (Atos\n10.38).\n\n     COMENTÁRIO\n\n     INTRODUÇÃO\n\n     No tema \"Autoridade espiritual\" abordamos alguns aspectos da questão da unção quando, então,\nvimos que ela se move e é derramada como de dentro de um guarda chuvas – à medida que nos\ntornamos discípulos e nos colocamos submissos (sob uma missão) às autoridades espirituais\nestabelecidas e à visão dada por Deus, estamos nos colocando na posição certa para receber a unção e\npara poder, posteriormente, passá-la adiante. Mas o que, afinal, é essa unção?\n\n     \"A unção é a testificação de algo que é planejado por Deus lá no céu e delegado a nós aqui na\nterra\".\n\n    Em outras palavras, a unção é a capacitação delegada por Deus para realizarmos tarefas e\ncumprirmos com Sua vontade.\n\n     A passagem bíblica acima mostra que o próprio Jesus foi ungido por Deus para realizar a obra\nque lhe estava proposta.\n\n     O símbolo dessa unção é o derramar do óleo, bem como o próprio significado da palavra \"ungir\",\nque quer dizer derramar óleo.\n\n     Por que o óleo?\n\n      Porque o óleo é o símbolo de uma pessoa – o Espírito Santo de Deus. Sendo assim, o derramar do\nóleo é o princípio de uma habilitação espiritual, mas não o fim dela, pois, se o Espírito vem sobre nós\nna tipificação do óleo que é derramado no momento de nossa unção, sendo nós pessoas com vontades,\npersonalidade e anseios, Ele só permanece se lhe propiciarmos ambiente adequado em nossas vidas.\nEssa é a habilitação que cabe a nós.\n\nI. O VALOR DA UNÇÃO\n\n      O desejo pela unção surge rapidamente na vida daquele que aceita Jesus como Salvador e Senhor\ne é fácil entendermos o porquê.\n\n     A unção é a ideia de se ter poder espiritual e, simplesmente, fascinante mesmo porque não se faz\nnada verdadeiro e frutífero no Reino de Deus sem ela e, com a unção ao lado, nos tornamos pessoas\nevidentemente especiais diante dos homens, e a grande maioria das pessoas quer isso. É por essa razão\nque a unção desperta tanto interesse nos corações das pessoas, porém, há que se entender: a unção tem\num valor!\n\n     1. Em primeiro lugar, precisamos pagar um preço pela unção.\n\n     Qual é o valor da unção?\n\n     O valor da unção é a soma da nossa fidelidade ao Senhor, da sinceridade dos nossos propósitos na\nobra de Deus e da abnegação pessoal que fazemos em função dos valores do Reino de Deus. O preço\nda unção, antes de qualquer coisa, é a nossa entrega à vontade de Deus.\n\n     Vimos, no texto bíblico acima, que Deus ungiu a Jesus de Nazaré para realizar a sua obra.\n\n     Analisemos agora: qual era a condição de entrega de Jesus com relação aos propósitos do Pai?\n\n     A entrega era total!\n\n     Isso fica claro no texto que veremos a seguir:\n\n      \"Tende em vós o mesmo entendimento que houve também em Cristo Jesus, pois ele, subsistindo\nem forma de Deus, não julgou como usurpação o ser igual a Deus; antes, a si mesmo se esvaziou,\nassumindo a forma de servo, tornado-se em semelhança de homens; e, reconhecido em figura humana,\na si mesmo se humilhou, tornando-se obediente até à morte e morte de cruz. Pelo que também Deus o\nexaltou sobremaneira e lhe deu o nome que está acima de todo nome, para que ao nome de Jesus se\ndobre todo joelho, nos céus, na terra e debaixo da terra, e toda língua confesse que Jesus Cristo é o\nSenhor, para glória de Deus Pai.\" (Filipenses 2.5-11).\n\n     2. Qual é o preço a ser pago pela unção?\n\n     Novamente: Qual é o valor da unção?\n\n     No caso de Jesus, foi o Seu próprio sangue, derramado na cruz, para que se cumprissem assim, os\npropósitos de Deus que consistiam em salvação e remissão de pecados. No nosso caso, é a entrega do\nnosso querer para o Senhor.\n\n     É certo que você deseja a unção do Espírito Santo para poder realizar, com sucesso, aquilo que\nDeus colocou em suas mãos, mas será que você está disposto a pagar o preço por ela?\n\n                                                                                   Igreja de Vencedores\n\n     O preço não é baseado em méritos ou recursos humanos. Não há relação alguma estabelecida em:\nmuitos talentos naturais – muita unção; muitos recursos intelectuais – muita unção; muitos recursos\nfinanceiros – muita unção. Simplesmente não há.\n\n     Deus pode, sim, usar nossos talentos naturais, recursos intelectuais e financeiros e impulsioná-los\ncom a unção do Espírito Santo, porém, eles jamais serão pré-requisito para recebermos a unção do\nSenhor em nossas vidas e, pensar o contrário disso, nos faz correr risco de até mesmo ofendermos o\nEspírito Santo de Deus, conforme aquilo que aconteceu com o mago Simão. Veja:\n\n     \"Vendo, porém, Simão que, pelo fato de imporem os apóstolos as mãos, era concedido o Espírito\nSanto, ofereceu-lhes dinheiro, propondo: Concedei-me também a mim esse poder, para que aquele\nsobre quem eu impuser as mãos receba o Espírito Santo. Pedro, porém, lhe respondeu: O teu dinheiro\nseja contigo para a perdição, pois julgaste adquirir, por meio dele, o dom de Deus. Não tens parte\nnem sorte neste ministério, porque o teu coração não é reto diante de Deus. Arrepende-te, pois, da tua\nmaldade e roga ao Senhor; talvez te seja perdoado o intento do coração; pois vejo que estás em fel de\namargura e laço de iniquidade.\" (Atos 8.18-23 RA).\n\n     Por que será que a proposta de Simão foi tão indecente aos olhos de Deus? Porque, por mais\ndinheiro que aquele homem oferecesse isso jamais pagaria o valor da unção, pois o seu valor só se\npaga com uma vida entregue diariamente no altar do Senhor!\n\nII. NÍVEIS DE ENTREGA E RENÚNCIA – A UNÇÃO PROVENDO HABILITAÇÃO\n\n      \"logo, já não sou eu quem vive, mas Cristo vive em mim; e esse vive que, agora, tenho na carne,\nvivo pela fé no filho de Deus, que me amou e a si mesmo se entregou por mim.\"      (Gálatas 2.20 ).\n\n     Entregar a própria vida a Deus pode parecer algo muito custoso para quem está chegando agora,\nmas como todas as outras coisas no Reino de Deus são na verdade, grandiosos privilégios que vamos\ndescobrindo a cada dia da nossa caminhada com Cristo e é aquilo que nos provê habilitação par o\nexercício da unção.\n\n     1. Em segundo lugar, a unção precisa ser habilitada através da nossa entrega.\n\n     Caminhamos um passo adiante e, agora, já estamos falando sobre habilitação da unção através da\nentrega.\n\n     Mas, a unção não é tudo o que precisamos para realizar a obra de Deus?\n\n     Certamente que sim, mas essa unção precisa estar em atividade. Um vulcão adormecido continua\nsendo um vulcão, porém, aos olhos de quem o vê, não passa de uma montanha até que entre novamente\nem erupção e, então, sua força seja reconhecida e ele passe a ser visto como um vulcão.\n\n     O mesmo se dá com a unção de Deus em nossas vidas, não importa o quanto tenhamos dela\narmazenada em nosso interior; ela só terá utilidade quando se manifesta e só se manifestará quando\nposta em atividade. A essa atividade da unção chamamos habilitação!\n\n2. Tudo é uma questão de habilitação.\n\n      É fácil entendermos os mecanismos da habilitação da vida cristã. Vamos recorrer à nossa vida\ncotidiana:\n\n     Você pode ter um carro guardado em sua garagem, mas o que lhe possibilita usufruir e utilizar-se\ndesse carro será uma pequena carteira chamada: C. N. H. – Carteira Nacional de Habilitação.\n\n     E não importa qual seja a qualidade do carro que está parado em sua garagem, se ele é grande ou\npequeno, novo ou velho, bonito ou feio; só há uma coisa que torna você apto a retirá-lo de lá e fazer\nuso dele – a habilitação. Sem ela, nada feito e, se você o fizer, não será de forma legal e legitima e\npoderá até sofrer punições por isso.\n\n     Exatamente a mesma coisa se dá no caso da unção. Independentemente do \"tamanho\" dela em\nnossas vidas, precisamos ter habilitação para usá-la e sermos usados por ela.\n\n      No caso do carro, a habilitação está restrita a um pequeno documento – a C. N. H.; já no caso da\nunção, ela representa a nossa própria vida diante de Deus e, em ambos os casos, o risco de tentarmos\nfazer uso sem a devida habilitação é muito grande, podendo nos acarretar muitos prejuízos. Veja:\n\n      \"E alguns judeus, exorcistas ambulantes, tentaram invocar o nome do Senhor Jesus sobre\npossessos de espíritos malignos, dizendo: Esconjuro-vos por Jesus, a quem Paulo prega. Os que\nfizeram isto eram sete filhos de um judeu chamado Ceva, sumo sacerdote. Mas o espírito maligno lhes\nrespondeu: Conheço a Jesus e sei quem é Paulo; mas vós, quem sois? E o possesso do espírito\nmaligno saltou sobre eles, subjugando a todos, e, de tal modo prevaleceu contra eles, que, desnudos e\nferidos, fugiram daquela casa. Chegou este fato ao conhecimento de todos, assim judeus como gregos\nhabitantes de Éfeso; veio temor sobre todos eles, e o nome do Senhor era engrandecido.\" (Atos 19.13-\n17).\n\n     3. A habilitação que dá retaguarda legal.\n\n     Assim como existe uma lei no mundo natural para nos assegurar a integridade caso andemos de\nacordo com ela, assim também no mundo espiritual – existem leis espirituais estabelecidas, as quais\nnão podemos simplesmente ignorar, sob pena de sofrermos suas conseqüências.\n\n     Aqueles sete jovens conheciam Jesus e Paulo de ouvir falar e acharam que isso seria suficiente\npara que pudessem entrar com sucesso e autoridade no mundo espiritual e para terem autoridade sobre\ndemônios.\n\n     O que lhes faltou?\n\n     Habilitação!\n\n     O que, afinal, é essa habilitação e como se chega a ela?\n\n                                                                                   Igreja de Vencedores\n\n    A habilitação é, em síntese, o histórico da nossa vida com Deus e ele passa por apenas um\ncaminho – o da entrega e da renúncia. Jesus disse:\n\n      \"E todo aquele que tiver deixado casas, ou irmãos, ou irmãs, ou pai, ou mãe ou mulher, ou\nfilhos, ou campos, por causa do meu nome, receberá muitas vezes mais e herdará a vida eterna.\"\n(Mateus 19.29).\n\n     4. Nos habilitamos diariamente, a todo instante.\n\n     A cada dia, e mesmo a cada momento de nossas vidas, estamos fazendo escolhas entre seguir a\nCristo ou seguir ao \"eu\". A somatória dessas inúmeras decisões forma a nossa história com Deus.\n\n      Como foi dito, o nome do caminho para a habilitação na vida cristã já está determinado e se\nchama entrega. Não podemos nos habilitar espiritualmente por nenhuma outra via que não seja essa,\nmas podemos determinar a velocidade com que caminharemos nesse caminho. Quanto mais\nrapidamente vencermos nossas resistências pessoais, quanto mais rapidamente caminharmos no sentido\nde uma entrega e quanto mais renunciarmos às nossas deformações e estabelecermos uma relação de\nobediência com relação a Deus, tanto mais estaremos habilitados para o exercício da unção, de modo\ncada vez mais legítimo, sendo, aí sim, reconhecidos no mundo espiritual, tanto por anjos quanto por\ndemônios, como servos ungidos do Senhor, podemos ligar e desligar nos céus e exercendo autoridade\nespiritual.\n\n      Deus está esperando de nós atitudes que tomemos e que nos habilitem, através da unção, a\nrealizarmos a Sua obra. Ele mesmo é o maior interessado em nos ungir com poder, pois glorificaremos\no Seu Nome.\n\n      Quando nos habilitamos na unção, podemos chegar a níveis extraordinários de realização. Jesus\nreferiu-se a isso em João 14.12:\n\n      \"Em verdade, em verdade vos digo que aquele que crê em mim fará também as obras que eu faço\ne outras maiores farão, porque eu vou para junto do meu Pai.\" (João 14.12).\n\n     Sabe o que isso significa?\n\n     Que tudo aquilo que Jesus realizou através da unção do Espírito Santo, não é encerramento\ndaquilo que Deus pode fazer, mas o começo!\n\n     5. Não se desanime, comece, ela é processual!\n\n      Obviamente que não se alcança o mais profundo nível de entrega e, consequentemente, de\nhabilitação espiritual, do dia para a noite; é um caminhar e um processo, mas a medida que vamos\ncaminhando e fazendo entregas conscientes ao Senhor, vamos nos habilitando para vivermos a\nconstituição do Senhor em nossas vidas.\n\nIII. A HABILITAÇÃO PARA VIVERMOS A CONSTITUIÇÃO\n\n     \"Assim, já não sois estrangeiros e peregrinos, mas concidadãos dos santos, e sois da família de\nDeus, edificados sobre o fundamento dos apóstolos e profetas, sendo ele mesmo, Cristo Jesus, a pedra\nangular; no qual todo o edifício, bem ajustado, cresce para santuário dedicado ao Senhor, no qual\ntambém vós juntamente estais sendo edificados para habilitação de Deus no Espírito.\" (Efésios 2.19-\n22).\n\n     1. Terceiro aspecto: a habilitação espiritual que é a unção em exercício nos leva a vivermos\na constituição da vida cristã.\n\n     Essa é a terceira palavra que encontramos no processo de Deus para a nossa vida espiritual. As\noutras duas foram: unção e habilitação e, agora, constituição.\n\n     Se tivéssemos que identificar cada um desses termos com palavras análogas, essas palavras\nseriam:\n\n        Unção – o poder de Deus em nossas vidas;\n        Habilitação – o exercício desse poder, a unção em atividade;\n        Constituição – é a verdadeira essência da formação espiritual, é a manifestação do propósito\n         para o qual a pessoa foi formada espiritualmente.\n\n     Constituição, então, é edificação!\n\n     Edificação de que?\n\n     Tanto de nós mesmo quanto da obra que realizamos através da unção.\n\n     2. Constituição é edificação.\n\n     À medida que vamos realizando a obra de Deus através da unção do Espírito Santo, vamos\ndeixando um rastro de edificação atrás de nós – edificação de vidas humanas e de estruturas que, no\ncaso especifico do Aprisco Igreja de Vencedores e de sua visão, servirão para restaurar e reedificar\noutras vidas humanas.\n\n     Além disso, sem que nos apercebamos, à medida que caminhamos nessa trilha com Cristo, vamos\nsendo edificados pessoalmente em nosso caráter cristão pelo próprio Deus, como diz a Palavra:\n\n     \"E todos nós, com o rosto desvendado, contemplando, como por espelho, a glória do Senhor,\nsomos transformados, de glória em glória, na sua própria imagem, como pelo Senhor, o Espírito.\" (2\nCoríntios 3.18).\n\n     ...e mais adiante:\n\n                                                                                  Igreja de Vencedores\n\n     \"também vós mesmos, como pedras que vivem, sois edificados casa espiritual para serdes\nsacerdócio santo, a fim de oferecerdes sacrifícios espirituais agradáveis a Deus por intermédio de\nJesus Cristo.\" (1 Pedro 2.5).\n\n    \"Mas o fruto do Espírito é: amor, alegria, paz, longanimidade, benignidade, bondade, fidelidade,\nmansidão, domínio próprio. Contra estas coisas não há lei.\" (Gálatas 5.22-23).\n\n     O que é esse fruto do Espírito? É o resultado do trabalhar do Espírito Santo em nosso interior,\ntravés das entregas que fazemos à medida que caminhamos com Cristo e realizamos a Sua obra.\n\n     3. Constituição – a carreira da entrega\n\n      Muitos dos que começam a servi no Reino de Deus preocupam-se, excessivamente, com a\nquestão da ascensão ministerial. Alguns desses, ansiosos ficam pelo caminho, desanimam-se quando\nesse crescimento aparente não vem da forma e no tempo em que planejavam. Mas, é necessário que se\nentenda: o crescimento espiritual é nada mais do que a consequência natural da nossa constituição no\nReino de Deus. Precisamos nos habilitar em nosso trabalho como cristão e, simplesmente, esperar e\nsaber que a constituição vem em seguida, como consequência natural disso.\n\n      Os encargos existentes na igreja, em nível ministerial, são apenas a testificação exterior diante\ndos homens daquilo que já deve ter acontecido processualmente em seu interior, ou seja, a constituição\nespiritual.\n\n     Além disso, outra função digna de fazermos uma auto-análise é acerca das motivações que nos\nlevam a desejar uma ascensão ministerial. Isso é de extrema importância, até para que tenhamos um\nministério bem sucedido sempre.\n\n     Pode-se até galgar posições no Reino de Deus tendo-se motivações equivocadas, porém,\ncertamente, chegará o momento da encruzilhada, no qual percebemos que o Reino de Deus não era\naquilo que imaginávamos e, simplesmente, desistimos – conforme já dissemos, as consequências são\ndesastrosas; ou então, adequamos as nossas motivações no meio do caminho.\n\n      Não há nada de errado em se ter um desejo por crescimento no Reino de Deus, pelo contrário,\nisso é louvável, conforme nos diz o Apóstolo Paulo:\n\n     \"Fiel é     a   palavra:   Se   alguém    aspira   ao   episcopado,   excelente   obra     almeja\"\n1 Timóteo 3.1.\n\n     De qualquer forma, é essencial que analisemos nossas motivações.\n\n     Analise suas motivações – o Reino de Deus não é poder e nem fama, mas serviço e\nabnegação! Você está disposto?!\n\n     4. O crescimento do reino de Deus na Igreja de Vencedores\n\nA propósito, você sabe quais são os encargos na Igreja de Vencedores?\n\n     Então vamos a elas:\n\n      Pastor – Efésios 4.11 / 1 Coríntios 12.28/1 Pedro 5.1-4 / 1 Pedro 2.25/1 Timóteo 3.2 / Tito\n       1.7\n\n     Em primeiro lugar, obviamente, temos os Pastores que, em nosso caso, são os Pastores Ermeson e\nLeiane Souza.\n\n     Os Pastores são os líderes fundadores da Igreja de Vencedores, eles são chamados, habilitados e\nconstituídos por Deus e foi confiada tanto a visão de Deus quanto a missão de levá-la adiante.\n\n     Os Pastores são pessoas que foram provados e aprovados, que detêm uma grande carga de\nresponsabilidades, inclusive administrativas, e que respondem diretamente a Deus por toda igreja.\n\n      Coordenador de base\n\n     A função coordenador de base é a aliança estabelecida com a igreja no geral. O coordenador de\nbase é aquele que, apascenta as ovelhas, tem a função de cuidar, proteger, potencializar e preservar a\nvisão e a unção dos nossos Pastores em uma determinada área; em uma área possui de uma a seis\nbases.\n\n     As bases estão localizadas nos bairros, as quais estão sujeitas e compõem as áreas. Por exemplo:\ntemos em um bairro um número de 6 bases ; pois bem, todas essas bases juntas compõem uma área,\nestando sujeitas ao coordenador de base.\n\n      Coordenador de base auxiliar\n\n     A unção de coordenador de base auxiliar é, naturalmente, uma função mais voltada para a parte\norganizacional e administrativa da base.\n\n     É a primeira unção daquele que ingressa na vida ministerial desejando servir a Deus totalmente.\n\n      O coordenador de base auxiliar deve cuidar do bom andamento dos cultos e da base, zelar\npela base e por seus pertences e ajuda o coordenador na tarefa de cuidar dos membros da base.\n\n      Líderes de Célula e Geração\n\n     É o inicio de uma caminhada ministerial. Eles cuidam dos pequenos grupos de pessoas da base.\n\n     Líder de Célula cuida de três a doze pessoas.\n\n     Líder de Geração cuida de três a cento e quarenta e quatro pessoas.\n\n                                                                                   Igreja de Vencedores\n\n      Líder de Ministério\n\n     É aquele que cuida de grupos homogêneos e heterogêneos da igreja. Apascenta pessoas com os\n     mesmos dons e as mesmas finalidades.\n\n    Essas sãs as nomenclaturas que usamos na Igreja de Vencedores para os encargos do Reino de\nDeus:\n\n     Algo importante: essas divisões citadas acontecem somente em caráter administrativo, para que\nse possa ter um melhor controle e gestão da obra do Senhor, porém, a visão da Igreja de Vencedores é\nde um único corpo, tendo todos uma única visão indivisível porque ela parte de Deus.\n\n     Um detalhe importante em tudo isso é palavra do Apóstolo Paulo a Timóteo, administrador e\nbispo de igrejas, dizendo que o ministro deve ser primeiramente provado e se mostrar-se irrepreensível,\nexercer o ministério – 1 Timóteo 3.6, 7, 10, 11.\n\n5. CARACTERÍSTICAS DA UNÇÃO – ELA PERMANECE, ENSINA E QUEBRA                                          O\n   JUGO\n\n     Quando o Apóstolo João escreveu sua primeira carta, ele disse o seguinte:\n\n     \"Quanto a vós outros, a unção que dele recebestes permanece em vós, e não tendes necessidade\nde que alguém vos ensine; mas, como a sua unção vos ensina a respeito de todas as coisas, e é\nverdadeira, e não é falsa, permanecei nele, como também ela vos ensinou.\"        (1 João 2.27).\n\n    1. Quarto aspecto: ela por si mesma, agindo em nós, nos ensina, quebra o jugo do inimigo e\npermanece.\n\n     Em outras palavras, significa dizer que ela não sai.\n\n     Imagine uma tatuagem que você tenha em seu corpo. A partir do momento que você faz essa\ntatuagem, ela o acompanhará para onde quer que você vá, em qualquer lugar, em qualquer\ncircunstância; além disso, ela será uma marca de reconhecimento em sua vida – sua tatuagem jamais o\nabandonará independentemente do seu estado de espírito e do momento pelo qual você possa passar\nem sua vida – bom ou ruim.\n\n     Assim é a unção e o chamado de Deus em sua vida, com uma diferença apenas: se você quiser\napagar sua tatuagem, você pode submeter-se a uma cirurgia plástica e ela se tornará quase\nimperceptível e as pessoas, quando olharem para você, provavelmente, não saberão que um dia, no\npassado, você foi uma mulher ou um homem tatuado.\n\n      Se, por outro lado, você quiser abandonar ou fugir ao seu chamado, se você traí-lo ou tentar negá-\nlo, ele jamais poderá ser apagado, pois não está gravado em seu corpo, mas sim em seu espírito. O\nMaximo que você fará, será anulá-lo e, então, você se tornará infrutífero; e, ao contrário da tatuagem\napagada, quando as pessoas olharem para você, elas logo perceberão que você um dia teve um\n\nministério, um encargo no Reino de Deus, que um dia foi uma bênção, que um dia exerceu um\nchamado, foi o que Jesus descreveu:\n\n     \"Vós sois o sal da terra; ora, se o sal vier a ser insípido, como lhe restaurar o sabor? Para nada\nmais presta senão para ser lançado fora e pisado pelos homens\" (Mateus 5.13).\n\n     O fato de nosso chamado e nossa unção serem permanentes em nossas vidas nos traz dois\naspectos:\n\n      No lado positivo, a garantia de que nada poderá nos separar de nossa eleição;\n      No lado negativo, esse chamado se tornará um peso, caso não seja exercido, caso não seja um\n       instrumento de bênçãos em nossas vidas – ele próprio nos julgará.\n\n     Ensina o que exatamente?\n\n     A Palavra de Deus é contundente – \"ela nos ensina todas as coisas!\"\n\n     A unção, em si mesma, é apta para isso, pois procede de Deus.\n\n      Isso não quer dizer, absolutamente, que não devamos buscar do conhecimento, do aprimoramento\ne, principalmente, da submissão aos líderes colocados por Deus sobre as nossas vidas, sob pretexto de\nque a unção nos torna auto-suficientes. Devemos nos ater para, sob nenhum pretexto, entrarmos em\natitude de rebeldia, o que traria, certamente, uma grande defasagem em nossa caminhada ministerial.\n\n      O foco da unção em nós é moldar o nosso caráter como servos de Deus. Quando a Palavra diz\nque ele nos ensinará todas as coisas, não havendo necessidade de que alguém nos ensine, esse texto\nrefere-se às coisas pertinentes à nossa vida pessoal com Deus, por exemplo: \"Será que eu posso fazer\ntal coisa?\", \"Será que eu devo tomar essa atitude?\", \"Será que eu devo falar alguma coisa nessa\nsituação?\" – a unção do Espírito que opera em você, lhe ensinará todas essas coisas.\n\n     2. Conhecendo a Palavra, conhecendo o poder\n\n      Outro extremo equivocado em que, muitas vezes, as pessoas caminham é aquele de pensarem que\na unção, por si só, os torna tão preparados para o serviço cristão, que eles dispensam qualquer forma de\nestudo e aprofundamento no conhecimento, refutando-o até mesmo com vaidade e não querem\nparticipar do discipulado e de outros Seminários da Visão da igreja.\n\n     Pra tais, é comum frases do tipo: \"Para mim o importante é ter unção, eu não preciso estudar!\", \"o\nque importa é o poder e não a letra\", \"Eu já fui ungido por Deus – não me importo com os homens\".\n\n     Tudo isso demonstra entre outras coisas, a falta de conhecimento bíblico, o que pode levar\npessoas, que verdadeiramente tenham a unção, a cometerem Erros e heresias terríveis contra o próprio\nCorpo de Cristo a que defendem. Jesus disse:\n\n     Respondeu-lhes Jesus: Errais, não conhecendo as escrituras nem o poder de Deus.           (Mateus\n22.29).\n\n                                                                                    Igreja de Vencedores\n\n     O que isso quer dizer?\n\n     Ambas as coisas são importantes – tanto o conhecimento como, também, o poder de Deus: uma é\no complemento da outra, uma não anula a outra e, por fim, a unção do Senhor nos fornece as duas\ncoisas. Busque esta unção!\n\n     Antes de concluirmos esse assunto, vejamos o importante exemplo comparativo de dois apóstolos\ndo Senhor, Pedro e Paulo.\n\n     Há uma declaração importante de Paulo para meditarmos:\n\n     \"Bem que eu poderia confiar também na carne. Se qualquer outro pensa que pode confiar na\ncarne, eu ainda mais: circuncidado ao oitavo dia, da linhagem de Israel, da tribo de Benjamim,\nhebreu de hebreus; quanto à lei, fariseu, quanto ao zelo, perseguidor da igreja; quanto à justiça que\nhá na lei, irrepreensível. Mas o que, para mim, era lucro, isto considerei perda por causa de Cristo.\nSim, deveras considero tudo como perda, por causa da sublimidade do conhecimento de Cristo Jesus,\nmeu Senhor; por amor do qual perdi todas as coisas e as considero como refugo, para ganhar a Cristo\ne ser achado nele, não tendo justiça própria, que procede de lei, senão a que é mediante a fé em\nCristo, a justiça que procede de Deus, baseada na fé;\" (Filipenses 3.4-9).\n\n     ...e mais à frente:\n\n     \"Quando vieres, traze a capa que deixei em Trôade, em casa de Carpo, bem como os livros,\nespecialmente os pergaminhos.\" (2 Timóteo 4.13).\n\n     O que há de importante nessas passagens?\n\n      A primeira delas mostra a bagagem cultural-teológica que Paulo já possuía, mesmo porque era\nfariseu, o que indicava que era estudioso da lei e, além disso, fazia parte do sinédrio, composto pelos\nchamados doutores da lei. Paulo deixa bem claro que o conhecimento de Cristo lhe vale infinitamente\nmais que toda a bagagem apenas teórica que possuía a respeito de Deus. Esse é um ponto. Não\nobstante, vemos que o interesse de Paulo pelos livros, pelo aprimoramento e pelo estudo das coisas\nespirituais, jamais fora anulado porque ele havia tido um encontro com Cristo, pelo contrário, agora o\nobjetivo desse aprimoramento era servir melhor a Deus.\n\n     3. Deus usará aquilo que tivermos\n\n     Pedro, por sua vez, mesmo sendo um pescador, foi poderosamente usado por Deus, a ponto de\nsua própria sombra curar os enfermos e expulsar demônios. Porém, vemos Pedro restrito em seus\nprocedimentos em áreas que Paulo já estava muito além, como por exemplo, no caso da evangelização\ndos gentios.\n\n     A suma de tudo isso é que Pedro, mesmo sendo um grande Apóstolo de Cristo, um dos principais,\nnos deixou duas epístolas como legado. Em contrapartida, Paulo, o apóstolo dos gentios – assim como\n\nnós – deixou um legado de treze epístolas, além de ter sido o responsável pela evangelização de todo o\nmundo gentílico conhecido na época.\n\n     O que diferenciava esses dois homens? A unção?\n\n     Certamente que não. Ambos tinham uma poderosa unção do Espírito Santo, cada qual conforme a\nsua missão; o que os diferenciou, porém, foi o quanto Deus tinha para usar em cada um deles por meio\nda unção.\n\n     RETENHA EM SEU CORAÇÃO: a unção do santo te ensina todas as coisas – como agir,\ncomo pensar, como sentir e como falar, porém Deus usará tudo aquilo que você tiver e\ndisponibilizar em suas mãos, portanto, procure enriquecer-se, ter muito e, principalmente\nconsagrar tudo isso para o uso do Senhor!\n\n     Medite: \"Eu entendo mais do que todos os meus professores porque medito nos teus\nensinamentos.\" (Salmos 119.99 RA).\n\n     4. Essa unção também despedaça todo jugo\n\n     A unção, além de todo o restante, ainda faz isso – quebra todo o jugo.\n\n     Você sabe o que é jugo?\n\n     Você já viu uma junta (dupla) de bois andando juntas no trabalho da terra?\n\n      Caso já tenha visto, talvez você tenha também notado um forte pedaço de madeira que eles levam\nsobre o pescoço e que os une para que não se separem e assim, a força de trabalho é multiplicada por\ndois.\n\n     Pois bem, esse jugo é algo que prende esses bois, independentemente de sua vontade e que, além\nde tudo, pesa bastante sobre eles.\n\n     Espiritualmente falando, o jugo também é isso – algo que nos prende a uma estrutura escravizante\ne que pesa sobre as nossas vidas.\n\n      A Palavra de Deus diz que a unção do Senhor quebra, também, o nosso jugo. E não somente o\nnosso, mas agindo em nossas vidas, quebram também o jugo na vida de outras pessoas, conforme\nIsaías 10.27.\n\n     \"Acontecerá naquele dia que o peso será retirado de todo teu ombro, e o seu jugo do teu\npescoço, jugo que será despedaçado por causa da gordura (unção)\".\n\n     DECLARE ASSIM: \"Eu entendo hoje o valor e a profundidade da unção que me tem sido\nconcedida pelo Senhor. Eu prometo honrar essa unção e caminhar de acordo com aquilo que ela orienta\n\n
