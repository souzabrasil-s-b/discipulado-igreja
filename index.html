veria sentir ou dizer.\n      É provável que você precise confessar alguma raiva ou ressentimento escondido em relação a\nDeus em certas áreas de sua vida, nas quais você se sentiu enganado ou decepcionado.\n      Até que tenhamos amadurecido o suficiente para compreender que Deus usa todas as coisas para\no nosso bem, abrigamos ressentimentos em relação a Deus por causa de nossa aparência, formação,\norações não-respondidas, mágoas do passado e outras coisas que mudaríamos se fôssemos Deus.\n      As pessoas frequentemente culpam a Deus por mágoas provocadas por outras pessoas. Isso cria o\nque problemas ocultos com Deus.\n      A amargura é a maior de todas as barreiras para a amizade com Deus.\n      O antídoto, é claro, é crer que Deus sempre age no seu melhor interesse; mesmo quando é\ndoloroso e você não compreende. Mas liberar-se de seus ressentimentos e revelar seus sentimentos é o\nprimeiro passo para a cura.\n      Do mesmo modo que tantas pessoas na Bíblia, diga a Deus exatamente como você se sente.\n      Para nos instruir na honestidade sincera, Deus nos deu o livro de Salmos — um manual de\nadoração, cheio de discursos descontrolados, delírios, dúvidas, medos, ressentimentos e sofrimentos\nintensos combinados com ação de graças, louvores e declarações de fé.\n      Todas as emoções possíveis estão catalogadas no livro de Salmos. Quando você lê as confissões\nemocionadas de Davi e de outros, percebe que é assim que Deus quer que você o adore — sem reter\nabsolutamente nada do que sente.\n      Você pode orar como Davi: Derramo diante dele as minhas queixas e conto-lhe todos os meus\naborrecimentos. Estou totalmente abatido.\n      É animador saber que todos os amigos íntimos de Deus — Moisés, Davi, Abraão, Jó e outros —\ntiveram momentos de dúvidas. Mas, em vez de mascarar seus receios com frases feitas, eles os\nexpressaram sincera, aberta e publicamente.\n       Exprimir as dúvidas às vezes é o primeiro passo em direção ao próximo nível de intimidade com\nDeus.\n\n     IV. Devo optar por obedecer a Deus na fé.\n     Todas as vezes que você confia na sabedoria de Deus e faz tudo o que ele diz, mesmo sem\ncompreender, você aprofunda sua amizade com ele.\n     Normalmente, não consideramos a obediência como característica da amizade; ela é reservada\npara o relacionamento com pai ou chefe; não um amigo.\n      Entretanto, Jesus deixou claro que a obediência é uma condição para obter intimidade com Deus.\nEle disse: Vocês serão meus amigos, se fizerem o que eu lhes ordeno.\n\nObedecemos a Deus, não por obrigação, medo ou imposição, mas porque o amamos e confiamos\nque ele sabe o que é melhor para nós. Queremos seguir a Cristo em virtude da gratidão que sentimos\npor tudo que ele nos fez, e quanto mais de perto nós o seguimos, mais intensa a nossa amizade se torna.\n      Os incrédulos normalmente pensam que os cristãos obedecem por obrigação, culpa ou medo de\nser punidos, mas o oposto é que é verdadeiro.\n      Por termos sido perdoados e libertos, obedecemos por amor — e nossa obediência nos traz\ngrande alegria!\n      Jesus disse: Como o Pai me amou, assim eu os amei; permaneçam no meu amor. Se vocês\nobedecerem aos meus mandamentos, permanecerão no meu amor, assim como tenho obedecido aos\nmandamentos de meu Pai e em seu amor permaneço. Tenho lhes dito estas palavras para que a minha\nalegria esteja em vocês e a alegria de vocês seja completa.\n      Repare: Jesus espera que façamos somente o que ele fez com o Pai. Seu relacionamento com o\nPai é o modelo para nosso relacionamento com ele.\n      Jesus fez tudo que o Pai pediu que ele fizesse graças ao amor.\n      Quando Jesus nos pede que amemos os outros, ajudemos os necessitados, dividamos nossos\nrecursos, conservemos nossa vida limpa, perdoemos e levemos outros a ele, o amor nos estimula a\nobedecer imediatamente.\n      Somos frequentemente desafiados a fazer \"grandes coisas\" para Deus. Na realidade, Deus fica\nmais satisfeito quando fazemos pequenas coisas para ele por amor.\n      Elas podem passar despercebidas de outras pessoas, mas Deus as observa e as considera atos de\nadoração.\n      Grandes oportunidades podem acontecer uma única vez durante toda a vida, mas pequenas\noportunidades nos cercam todos os dias. Mesmo por um simples ato, como dizer a verdade, ser gentil e\nanimar os outros, trazemos um sorriso à face de Deus.\n\n      V. Devo optar por valorizar o que Deus valoriza.\n      Isso que os amigos fazem — importam-se com o que é importante para a outra pessoa. Quanto\nmais você se torna amigo de Deus, mais se importa com as coisas com as quais ele se importa, sofre\ncom as coisas por que ele sofre e se alegra com as coisas que lhe dão prazer.\n      Paulo é o melhor exemplo disso.\n      As prioridades de Deus eram as suas prioridades, e os desejos de Deus eram seus: O que me deixa\ntão transtornado é preocupar-me tanto com vocês — esse é o zelo de Deus que queima dentro de mim!\n       Davi se sentia da mesma forma: O zelo pela tua casa me consome, e os insultos daqueles que te\ninsultam caem sobre mim.\n      O que importa mais para Deus? A redenção de seu povo. Ele quer que todos os seus filhos\nperdidos sejam achados! Esse é o único motivo pelo qual Jesus veio à terra.\n      A coisa mais preciosa ao coração de Deus é a morte de seu Filho. A segunda coisa mais preciosa\né quando seus filhos comunicam essas novas a outras pessoas.\n      Para ser amigo de Deus, você deve se interessar por todas as pessoas ao seu redor, com as quais\nDeus se importa. Amigos de Deus contam aos seus amigos a respeito de Deus.\n\n      VI. Mais do que qualquer outra coisa, devo desejar ser amigo de Deus.\n      Os salmos estão cheios de exemplos desse desejo. Davi, acima de tudo, desejou apaixonadamente\nconhecer a Deus; ele usou palavras como \"anelo\", \"anseio\", \"sede\", \"fome\".\n      Ele almejava a Deus. Ele disse: Há uma coisa que realmente desejo do Senhor; o privilégio de\nviver durante toda a minha vida na sua presença, para descobrir a cada dia um pouco mais da sua\nperfeição e amor.\n      Em outro salmo, ele disse: O teu amor é melhor do que a vida.\n\n                                                                                    Igreja de Vencedores\n\n      O desejo de Jacó pelas bênçãos de Deus na sua vida era tão intenso que ele lutou durante toda a\nnoite com Deus, dizendo: Não te deixarei ir, a não ser que me abençoes. A parte mais maravilhosa\ndessa história é que Deus, que é todo-poderoso, deixou Jacó vencer!\n      Deus não fica ofendido quando \"lutamos\" com ele, porque lutar exige contato pessoal e nos traz\npara perto dele! Lutar também é uma atitude apaixonada, e Deus gosta quando estamos apaixonados\npor ele.\n      Paulo foi outro homem apaixonado por sua amizade com Deus. Nada era mais importante; era a\nsua primeira prioridade, objeto de sua total concentração e o mais importante objetivo de sua vida.\n      Esse é o motivo pelo qual Deus usou Paulo de forma tão grandiosa.\n      A verdade é: você está tão perto de Deus quanto escolhe estar.\n      Amizade íntima com Deus é uma escolha, não um fato fortuito; você deve buscá-la\nintencionalmente.\n      Você realmente a quer — mais do que qualquer coisa? Qual a importância disso para você? Vale\na pena desistir de outras coisas por causa dela? Ela vale o esforço de desenvolver os hábitos e\nhabilidades necessários?\n      Você pode ter sido apaixonado por Deus no passado, mas perdeu aquele desejo. Esse foi o\nproblema dos cristãos de Laodicéia -— haviam perdido o primeiro amor.\n      Faziam todas as coisas corretamente, mas por obrigação, e não por amor.\n      Se você estiver passando por abalos espirituais, não se surpreenda quando Deus permitir\nsofrimentos na sua vida.\n      O sofrimento é o combustível da paixão — ele nos dá energia com tal intensidade que transforma\no que normalmente não possuímos.\n      \"O sofrimento é o megafone de Deus\". É a forma de Deus nos sacudir da sonolência espiritual.\n      Os nossos problemas não são uma punição; são chamadas de despertamento de um Deus\namoroso.\n      Deus não está louco com você, ele está louco por você, e fará o que for necessário para trazê-lo\nde volta à comunhão com ele. Mas há uma forma mais fácil de reacender a paixão por Deus.\n      Comece a pedir que ele lhe dê essa paixão e continue pedindo até que você a tenha. Faça esta\noração ao longo do seu dia: \"Querido Jesus, mais do qualquer outra coisa, quer conhecê-lo\nintimamente\".\n      Deus disse aos cativos na Babilônia: Se vocês seriamente me buscarem e me quiserem mais que a\ntodas as coisas, garanto que não ficarão desapontados.\n\n      VII. Seu relacionamento mais importante\n     Não há nada — absolutamente nada — mais importante do que desenvolver uma amizade com\nDeus.\n     Esse é o relacionamento que durará para sempre.\n     Paulo disse a Timóteo: Algumas destas pessoas perderam a coisa mais importante da vida — elas\nnão conhecem a Deus. Você perdeu a coisa mais importante da vida?\n     Você pode fazer algo a respeito disso a partir de agora.\n     Lembre-se: a escolha é sua. Você está tão perto de Deus quanto escolheu estar.\n\n     VIII. Deus quer você por inteiro.\n     Deus não quer apenas uma parte de sua vida. Ele pede todo o seu coração, toda a sua alma, toda a\nsua mente e toda a sua força.\n     Deus não está interessado em um comprometimento tímido, em uma obediência parcial ou em\nsobras de seu tempo e dinheiro.\n     Ele deseja sua total devoção, e não pequenos pedaços de sua vida.\n\nIX. Deus se agrada quando nossa adoração é autêntica.\n     Quando Jesus disse que você deveria \"adorar em espírito\", ele não estava se referindo ao Espírito\nSanto, mas ao seu espírito. Feito à imagem de Deus, você é um espírito que habita em um corpo, e\nDeus concebeu esse espírito para que se comunicasse com ele.\n     Adoração é seu espírito correspondendo ao Espírito de Deus.\n     Quando Jesus disse Ame o Senhor, o seu Deus, de todo o seu coração, de toda a sua alma, ele\nqueria dizer que a adoração deveria ser genuína e sincera.\n     Não é apenas uma questão de utilizar as palavras corretas; você deve querer dizer o que diz. O\nlouvor sem sentimentos não é em absoluto louvor! Não vale nada e é um insulto a Deus.\n     Quando adoramos, Deus olha para além de nossas palavras para ver a postura de nossos corações.\n     A Bíblia diz: O homem vê a aparência, mas o Senhor vê o coração.\n     Visto que adoração envolve regozijar-se em Deus, ela mobiliza as emoções. Deus lhe deu\nemoções para que você pudesse adorá-lo com intensidade — mas essas emoções devem ser\ngenuínas, não fingidas.\n     Deus odeia a hipocrisia. Ele não quer exibicionismo, fingimento ou falsidade na adoração.\n     Ele deseja o seu amor sincero e verdadeiro. Podemos adorar a Deus de modo imperfeito, mas não\npodemos adorá-lo sem sinceridade.\n     Logicamente, só a sinceridade não é suficiente, você pode estar sinceramente errado. É por isso\nque tanto o espírito como a verdade são necessários.\n      A adoração deve ser precisa e autêntica. A adoração agradável a Deus é profundamente\nemocional e profundamente doutrinária; usamos tanto o coração quanto a cabeça.\n     Conclusão\n     - Adoração sem ação é fanatismo.\n     - Ação sem Adoração é mundanismo.\n     - Adoração com ação é cristianismo.\n\n    COMENTE O QUE MAIS CHAMOU A SUA ATENÇÃO:\n    ______________________________________________________________________________\n__________________________________________________________________________________\n__________________________________________________________________________________\n\n                                                                                   Igreja de Vencedores\n         152", "quiz": [{"q": "Qual é o texto bíblico-base da lição \"SENDO AMIGO DE DEUS\"?", "options": ["Gênesis 32:30; II Samuel 12", "Tiago 4.8a", "Salmo 139.2", "João 15.15"], "answer": 3}, {"q": "Qual destes é um dos tópicos estudados na lição \"SENDO AMIGO DE DEUS\"?", "options": ["Deus Se Agrada Quando Nossa Adoração É Autêntica", "A Armadura De Deus", "Tem Sido Sensual, Indecente, Defraudador? (I Co 6:18)", "O Que Dirige Sua Vida?"], "answer": 0}, {"q": "Qual destes tópicos NÃO faz parte da lição \"SENDO AMIGO DE DEUS\"?", "options": ["Tornando-Se Amigo De Deus - Conversando Constantemente", "Proibição Em Doar Sangue", "Você Está Tão Perto De Deus Quanto Imagina", "Devo Optar Por Valorizar O Que Deus Valoriza"], "answer": 1}]}, {"num": 25, "title": "INTIMIDADE COM DEUS", "verseRef": "Salmo 139.2", "content": "INTRODUÇÃO\n\n       Deus é real, independente de como você se sinta.\n      É fácil adorar a Deus quando as coisas vão bem — quando ele provê comida, amigos, família,\nsaúde e situações felizes. Mas as circunstâncias não são sempre agradáveis. E como então você irá\nadorar a Deus?\n      O que você faz quando Deus parece estar a milhões de quilômetros?\n      A mais profunda adoração é louvar a Deus a independente da dor, dar graças durante a provação,\nmanter a confiança nele em meio à tentação, render-se a ele durante um sofrimento e amá-lo quando\nele parece distante.\n      Amizades são frequentemente testadas por separação e silêncio; ou você é separado por uma\ndistância física, ou está impossibilitado de conversar.\n      Na sua amizade com Deus, não será sempre que você se sentirá próximo dele.\n      Para amadurecer a amizade, Deus irá testá-la com períodos de aparente separação — épocas em\nque se tem o sentimento de que Deus nos abandonou ou esqueceu.\n      Tem-se a impressão de que Deus está a quilômetros de distância.\n      Existem momentos em que ele parece ter desaparecido de nossa vida sem deixar pistas.\n      Exemplo: Certo dia você acorda e percebe que todas as suas sensações de comunhão espiritual se\nforam.\n      Você ora, mas nada acontece.\n      Você repreende o Diabo, mas isso não muda nada.\n      Você faz exercícios espirituais... seus amigos oram por você... você confessa cada pecado que\nconsegue imaginar, e então sai por aí pedindo perdão a todos que conhece.\n      Você jejua... E nada ainda.\n      Você começa a se perguntar quanto tempo essa depressão espiritual irá durar. Dias? Semanas?\nMeses? Será que ela vai acabar?... você tem a impressão de que suas orações simplesmente batem no\nteto e voltam.\n      Em absoluto desespero, você grita: \"Qual é o meu problema?\"\n      A verdade é que não há nada de errado com você. Trata-se de uma parte normal da provação e\namadurecimento de sua amizade com Deus.\n      Todo cristão passa por isso ao menos uma vez, e normalmente várias vezes.\n      É doloroso e perturbador, mas absolutamente vital para o desenvolvimento da sua fé.\n      Ter conhecimento disso deu esperança a Jó quando não podia sentir a presença de Deus em sua\nvida.\n      Ele falou: Se vou para o Oriente, lá ele não está; se vou para o Ocidente, não o encontro.\nQuando ele está em ação no Norte, não o enxergo; quando vai para o Sul, nem sombra dele eu vejo!\nMas ele conhece o caminho por onde ando; se me puser à prova, aparecerei como o ouro.\n      Quando Deus parece distante, você pode pensar que ele está zangado ou o está punindo por\nalgum pecado. E na verdade o pecado realmente o desliga de uma amizade íntima com Deus.\n      Nós entristecemos o Espírito de Deus e sufocamos nossa amizade com ele ao desobedecer, entrar\nem conflito com outras pessoas, nos ocupar ou ter amizade com o mundo, além de outros pecados.\n      Mas frequentemente esse sentimento de abandono e afastamento de Deus não tem nenhuma\nrelação com o pecado.\n\nÉ um teste de fé que todos devemos enfrentar.\n      Será que você continuará a amar, confiar, obedecer e adorar a Deus, mesmo quando não sente a\nsua presença nem há evidência visível da ação divina em sua vida?\n      Nos dias de hoje, o erro mais comum que os cristãos cometem ao adorar é buscar uma\nexperiência em vez de buscar a Deus.\n      Eles buscam sensações e, se elas ocorrerem, concluem que foram bem-sucedidos em adorar.\nErrado! Na realidade, Deus em geral afasta as nossas sensações para não dependermos delas.\n      Buscar uma sensação — mesmo uma sensação de proximidade com Cristo — não é adoração.\n      A onipresença de Deus e a manifestação de sua presença são coisas diferentes. Uma é um fato; a\noutra é frequentemente uma sensação.\n      Deus está sempre presente, mesmo que você não perceba sua presença, e sua presença é muito\nprofunda para ser medida por uma mera emoção.\n      Sim, ele quer que você sinta a sua presença, porém ele está mais interessado que você confie, e\nnão tanto que o sinta.\n      Fé, e não sentimentos, agrada a Deus.\n      As situações que mais põem à prova a sua fé são aquelas em que a vida desanda e Deus não pode\nser achado.\n      Isso aconteceu com Jó. Em um único dia, ele perdeu tudo — sua família, seus negócios, sua saúde\ne tudo o que possuía. E, o que é pior, ao longo de 37 capítulos, Deus não disse nada!\n      Como louvar a Deus quando você não compreende o que está acontecendo na sua vida e Deus\nestá em silêncio?\n      Como permanecer em comunhão em meio a uma crise e sem nenhum contato?\n      Como manter os olhos em Jesus quando eles estão cheios de lágrimas?\n      Você faz o que fez Jó: Então prostrou-se, rosto em terra, em adoração, e disse: Saí nu do ventre\nda minha mãe, e nu partirei. O Senhor o deu, o Senhor o levou; louvado seja o nome do Senhor.\n\n     I. Diga a Deus exatamente como você se sente.\n     Derrame seu coração perante ele. Descarregue todos os seus sentimentos.\n     Jó fez isso quando disse: Por isso, não posso ficar calado. Estou aflito, tenho de falar, preciso me\nqueixar, pois o meu coração está cheio de amargura. Quando Deus lhe pareceu distante, ele clamou:\nComo tenho saudade dos dias do meu vigor, quando a amizade de Deus abençoava a minha casa.\n     Deus pode lidar com suas incertezas, sua raiva, seu sofrimento, sua confusão e suas indagações.\n     Você sabia que admitir seu desespero para Deus pode ser uma declaração de fé!\n     Confiando em Deus e sentindo desespero ao mesmo tempo, Davi escreveu: Cri, por isso falei:\nEstou completamente arruinado.\n     Isto parece uma contradição: confiar em Deus, mas se sentir destruído!\n     A franqueza de Davi na verdade revela uma profunda fé.\n     Primeiro, ele acreditava em Deus.\n     Segundo, ele acreditava que Deus ouviria sua oração. E, terceiro, ele acreditava que Deus o\ndeixaria dizer como se sentia, e ainda assim o amaria.\n\n     II. Concentre-se em quem Deus é — sua natureza imutável.\n     Independentemente das circunstâncias e de como você se sente, apegue-se ao caráter imutável de\nDeus.\n     Lembre-se daquilo que é eternamente verdadeiro a respeito de Deus: ele é bom, ele me ama, está\ncomigo, sabe por que coisas estou passando, ele se importa e tem um bom plano para minha vida.\n     Quando a vida de Jó se desfez e Deus permaneceu em silêncio, Jó ainda achou os seguintes\nmotivos para louvar a Deus:\n\n                                                                                      Igreja de Vencedores\n\n     • ele é bom e amoroso;\n     • ele é todo-poderoso;\n     • ele repara em cada detalhe da minha vida;\n     • ele está no controle;\n     • ele tem um plano para minha vida;\n     • ele vai me salvar.\n\n      III. Confie que Deus cumprirá as promessas.\n      Em tempos de seca espiritual, você deve confiar pacientemente nas promessas de Deus, e não nas\nemoções.\n      Deve perceber que ele o está levando a um nível mais profundo de maturidade.\n      Uma amizade baseada em emoções é na verdade inútil.\n      Então, não fique preocupado com os problemas. As circunstâncias não podem mudar o caráter de\nDeus.\n      A graça de Deus ainda está a plena força; ele ainda é a seu favor, mesmo que você não possa\nsenti-lo.\n      Na ausência de circunstâncias confirmativas, Jó se apegou à Palavra de Deus.\n      Ele disse: Não me afastei dos mandamentos dos seus lábios; dei mais valor às palavras de sua\nboca do que ao meu pão de cada dia.\n      Essa confiança na palavra de Deus fez que Jó permanecesse fiel, ainda que nada fizesse sentido.\n      Sua fé foi forte em meio à dor: Embora ele me mate, ainda assim esperarei nele.\n      Quando você se sente abandonado por Deus e mesmo assim mantém sua confiança nele, você o\nestá adorando da forma mais profunda.\n\n      IV. Viver consiste em amar.\n      Uma vez que Deus é amor, a lição mais importante que ele quer que você aprenda na terra é\ncomo amar.\n      É quando amamos que somos mais parecidos com ele, de modo que o amor é o fundamento de\ntodos os mandamentos que ele nos deu: Toda a lei pode ser resumida neste único mandamento: \"Ame\naos outros como você ama a si mesmo\".\n      É por isso que temos toda uma vida para aprender. É lógico que Deus quer que amemos a todos,\nmas ele se interessa especialmente por que aprendamos a amar as outras pessoas que fazem parte de\nsua família.\n      Por que Deus insiste em que devemos dar amor e atenção especial aos outros cristãos?\n      Por que eles devem ser priorizados?\n      Porque Deus quer que sua família seja conhecida pelo seu amor, mais do que por qualquer outra\ncoisa.\n      Jesus disse que nosso amor uns pelos outros — e não nossas crenças doutrinárias — é o nosso\nmaior testemunho perante o mundo.\n      Ele disse: Esse profundo amor que vocês tiverem uns pelos outros provará ao mundo que vocês\nsão meus discípulos.\n      No céu, desfrutaremos da família de Deus para sempre, mas primeiro temos algum trabalho duro\npara fazer aqui na terra, a fim de nos prepararmos para uma eternidade de amor.\n      Deus nos educa dando \"responsabilidades familiares\", e a principal é a prática de amarmos uns\naos outros.\n      É da vontade de Deus que você tenha uma associação íntima e constante com os outros cristãos,\npara que possa desenvolver a habilidade de amar.\n      O amor não pode ser aprendido solitariamente.\n\nVocê tem de ter pessoas por perto — pessoas irritantes, imperfeitas e frustrantes.\n\n      V. Seremos avaliados quanto ao nosso amor.\n      A razão para tornar o aprendizado do amor o objetivo de sua vida é que seremos avaliados com\nbase nele na eternidade.\n      Uma das formas pelas quais Deus mede nossa maturidade espiritual é pela qualidade de nossos\nrelacionamentos.\n      No céu, Deus não dirá \"Fale-me de sua carreira, de sua conta bancária e de seus passatempos\".\n      Em vez disso, vai rever como você tratou as outras pessoas, especialmente as necessitadas.\n      Jesus disse que a forma de amá-lo é amar a família dele e cuidar de suas necessidades práticas:\nDigo-lhes a verdade: O que vocês fizeram a algum dos meus menores irmãos, a mim o fizeram.\n      Quando partir para a eternidade, você deixará todo o resto para trás.\n      É por isso que a Bíblia diz: Porque em Cristo Jesus nem circuncisão nem incircuncisão têm efeito\nalgum, mas sim a fé que atua pelo amor.\n      Tendo conhecimento disso, sugiro que, ao se levantar pela manhã, você se ajoelhe ao lado da\ncama, ou se sente na beirada, e ore desta forma: \"Deus, conseguindo ou não realizar qualquer outra\ncoisa no dia de hoje, quero ter certeza de que terei tempo para amá-lo e para amar as outras pessoas —\nporque é nisso que a vida consiste. Não quero desperdiçar este dia\".\n\n     VI. A melhor expressão do amor é o tempo\n     A importância das coisas pode ser medida pelo tempo que estamos dispostos a investir.\n     Quanto maior o tempo dedicado a alguma coisa, mais você demonstra a importância e o valor\nque ela tem para você.\n     Se você quiser conhecer as prioridades de uma pessoa, observe a forma como ela utiliza o\ntempo.\n     O tempo é sua dádiva mais importante, pois você só recebeu uma quantidade fixa dele.\n     Você pode fazer mais dinheiro, mas não pode fazer mais tempo.\n     Quando você dedica seu tempo a alguém, você está dedicando uma porção de sua vida que\njamais irá recuperar.\n     O seu tempo é a sua vida.\n     É por isso que o maior presente que você pode dar a alguém é o seu tempo.\n     Não é o bastante dizer que relacionamentos são importantes; nós devemos provar essa posição\ninvestindo tempo neles.\n     Em si tratando de amor, palavras não têm muito significado.\n     Meus filhinhos, o nosso amor não deve ser somente de palavras e de conversa. Deve ser um amor\nverdadeiro, que se mostra por meio de ações.\n     Relacionamentos tomam tempo e esforço, e a melhor maneira de soletrar amor é               t-e-m-\np-o.\n     A essência do amor não é o que pensamos, fazemos ou proporcionamos aos outros, mas quanto\ndamos de nós mesmos.\n     O mais desejado presente de amor não são diamantes, rosas ou chocolate; é a atenção\nconcentrada.\n     O amor se concentra tão atentamente na outra pessoa que por um momento você se esquece de si.\n     A atenção diz: \"Eu valorizo você o bastante para lhe dar meu mais precioso bem — meu tempo\".\n     Sempre que você dá seu tempo, está fazendo um sacrifício, e o sacrifício é a essência do amor.\n     Quando vamos à igreja, geração, célula ou até mesmo discipulamos alguém, estamos\ndemostrando amor.\n\n                                                                                     Igreja de Vencedores\n\n     Jesus foi um exemplo disso: Sejam cheios de amor pelos outros, seguindo o exemplo de Cristo,\nque amou vocês e se entregou a Deus como sacrifício a fim de tirar os seus pecados.\n\n     Você pode dar sem amar, mas não pode amar sem dar.\n     Porque Deus tanto amou o mundo que deu...\n     Amar significa abrir mão — ceder minhas preferências, conforto, objetivos, segurança,\ndinheiro, energia ou tempo para o benefício de outra pessoa.\n\n      VII. O melhor momento para amar é agora\n      A Bíblia enfatiza isso repetidamente.\n      Ela diz: Portanto, enquanto temos oportunidade, façamos o bem a todos. Aproveite cada chance\nque tiver para fazer o bem. Sempre que puder, ajude os necessitados. Não diga ao seu vizinho que\nespere até amanhã, se você pode ajudá-lo hoje.\n      Por que agora é o melhor momento para expressar amor?\n      Porque você não sabe até quando terá oportunidade. As circunstâncias mudam, as pessoas\nmorrem, os filhos crescem.\n      Você não tem nenhuma garantia do amanhã.\n      Se você quiser expressar seu amor, é melhor que o faça agora.\n      Tendo consciência de que algum dia ficará perante Deus, eis algumas questões que você precisa\nlevar em consideração.\n      Como você explicará aqueles momentos em que projetos e coisas foram mais importantes para\nvocê do que as pessoas?\n      Com quem você precisa começar a passar mais tempo?\n      O que você precisa eliminar de sua agenda para tornar isso possível?\n      Que sacrifícios você precisa fazer?\n      A melhor utilidade que pode se dar à vida é amar.\n      A melhor expressão do amor é o tempo.\n      O melhor momento para amar é agora.\n\n      VIII. Você é chamado para participar, não somente para crer.\n      Mesmo no mais perfeito e imaculado ambiente do Éden, Deus disse: Não é bom que o homem\nesteja só.\n      Fomos criados para viver em comunidade, moldados para o companheirismo e formados para\numa família; e nenhum de nós pode cumprir os propósitos de Deus sozinho e sem ajuda.\n      A Bíblia não apresenta nenhum santo solitário que vivesse isolado dos outros cristãos, privado de\ncompanhia.\n      A Bíblia diz que fomos ajuntados, reunidos, juntamente edificados, juntamente tornados\nmembros, juntamente feitos herdeiros, combinados, mantidos juntos e que seremos juntamente\narrebatados.\n      Você não está mais por conta própria.\n      Embora seu relacionamento com Cristo seja pessoal, Deus nunca quis que fosse particular.\n      Na família de Deus, você está unido a todos os outros cristãos, e faremos parte uns dos outros por\ntoda a eternidade.\n      A Bíblia diz: Em Cristo nós, que somos muitos, formamos um corpo, e cada membro está ligado\na todos os outros.\n      A palavra \"membro\" é de origem cristã, mas foi esvaziada de seu significado original.\n      Lojas oferecem descontos a \"membros\", e os anunciantes usam os nomes desses membros para\ncriar listas de mala-direta.\n\nNas igrejas, tornar-se membro significa simplesmente adicionar o seu nome a uma lista, sem\nnenhum requisito ou expectativa.\n      Para Paulo, ser \"membro\" da igreja significava ser um órgão vital de um corpo vivo, parte\nindispensável e interconectada a todo o corpo de Cristo.\n      Precisamos restabelecer e praticar o significado bíblico dessa palavra.\n      A igreja é um corpo, não um edifício; um organismo, não uma organização.\n      Para que os órgãos de seu corpo cumpram o seu propósito, eles precisam estar conectados ao\ncorpo.\n      O mesmo ocorre com você como parte do corpo de Cristo.\n      Você foi criado para uma função específica, mas irá perder esse propósito para a sua vida se não\nestiver ligado à igreja.\n      Você descobre o seu papel nesta vida pelo relacionamento com os outros.\n      A Bíblia diz: Cada parte tem seu sentido no corpo como um todo, e não ao contrário. O corpo de\nque falamos é o corpo de Cristo, formado pelos escolhidos. Cada um de nós acha o seu significado e\nfunção como membro desse corpo. Mas, como um dedo amputado ou um dedão arrancado não somos\ngrande coisa, não é mesmo?\n      Se um órgão é de alguma forma desligado do corpo, ele murcha e morre.\n\n     Ele não pode existir por si mesmo, nem você. Desligado e arrancado do sangue vital da\nigreja, sua vida espiritual morre e acaba por deixar de existir.\n     É por isso que o primeiro sintoma de declínio espiritual é normalmente o comparecimento\nirregular aos cultos, gerações, células e a falta do dizimo ao Senhor.\n\n     Sempre que nos tornamos descuidados com a igreja, todo o resto também começa a desmoronar.\n     Ser membro da família de Deus requer envolvimento de corpo, alma e espírito.\n     A igreja é o plano de Deus para o mundo. Jesus disse:\n     Edificarei a minha igreja, e as portas do inferno não prevalecerão contra ela.\n     A igreja é indestrutível e existirá eternamente. Ela sobreviverá ao universo, assim como sua\nfunção nele.\n     A pessoa que diz \"Eu não preciso da igreja\" é tanto arrogante quanto ignorante.\n     A igreja é tão importante que Jesus morreu na cruz por ela.\n     Cristo amou a igreja e entregou-se por ela.\n     A Bíblia chama a igreja de \"a noiva de Cristo\" e de o corpo de Cristo. Eu não posso imaginar\nalguém dizendo para Jesus \"Eu te amo, mas não gosto de tua esposa\" ou: \"Eu te aceito, mas rejeito teu\ncorpo\". Mas é isso que fazemos quando desprezamos e depreciamos a igreja, ou reclamamos dela.\n     Em vez disso, Deus nos manda amar a igreja, tanto quanto Jesus a amou.\n     A Bíblia diz: Amem a sua família espiritual. Lamentavelmente, muitos cristãos usam a igreja,\nmas não a amam.\n\n      IX. Sua comunidade local\n      Salvo em poucas e importantes exceções, como quando alude a todos os cristãos ao longo da\nhistória, quase todas as vezes que a palavra \"igreja\" é utilizada na Bíblia, ela se refere a uma\ncongregação visível e local.\n      O Novo Testamento parte do princípio de que o membro pertence à congregação local.\n      Os únicos cristãos que não pertenciam a grupos locais eram aqueles sob a disciplina da igreja, os\nquais eram removidos de entre a irmandade por causa de pecados públicos.\n      A Bíblia diz que o cristão sem igreja local é como o órgão sem o corpo, a ovelha sem o rebanho\nou a criança sem a família. É uma situação anormal.\n\n                                                                                     Igreja de Vencedores\n\n     A Bíblia diz: ... e pertencem à casa de Deus como todos os outros cristãos.\n\n      Os valores de hoje, que advogam a independência e o individualismo, criaram muitos órfãos\nespirituais — o \"macaco\", que fica saltando de uma igreja para outra, sem filiação, sem geração, sem\ncélula, sem ministério sem responsabilidade ou compromisso.\n      Muitos creem que é possível ser um \"bom cristão\" sem estar unido ou mesmo sem frequentar\numa igreja local, mas Deus discordar disso.\n\n    COMENTE O QUE MAIS CHAMOU A SUA ATENÇÃO:\n    ______________________________________________________________________________\n__________________________________________________________________________________\n__________________________________________________________________________________", "quiz": [{"q": "Qual é o texto bíblico-base da lição \"INTIMIDADE COM DEUS\"?", "options": ["Eclesiastes 3.11", "2 Coríntios 5.17", "Salmo 139.2", "Mt18.19-20"], "answer": 2}, {"q": "Qual destes é um dos tópicos estudados na lição \"INTIMIDADE COM DEUS\"?", "options": ["A Vida Cristã No Lar", "Sua Comunidade Local", "Se Quisermos Permanecer Sãos (Gl 5:1)", "Defina O Estagio Da Célula – Evangelismo"], "answer": 1}, {"q": "Qual destes tópicos NÃO faz parte da lição \"INTIMIDADE COM DEUS\"?", "options": ["Seremos Avaliados Quanto Ao Nosso Amor", "Viver Consiste Em Amar", "Diga A Deus Exatamente Como Você Se Sente", "Entendendo O Que É Cura Interior"], "answer": 3}]}, {"num": 26, "title": "A FAMILIA DE DEUS", "verseRef": "Efésios 2.19", "content": "INTRODUÇÃO\n     Fazer parte da igreja ajuda a desenvolver músculos espirituais.\n     Você jamais chegará à maturidade apenas comparecendo aos cultos de Celebração ou somente\nindo a Célula e Geração.\n     Somente a plena participação nas atividades da igreja local desenvolve músculos espirituais.\n     A Bíblia diz: À medida que cada parte realiza o seu trabalho, ela coopera para o crescimento\ndas outras partes, para que todo o corpo esteja saudável, crescendo e cheio de amor.\n     As expressões \"uns com os outros\" e \"entre si\" são usadas mais de cinquenta vezes no Novo\nTestamento.\n     Somos ordenados a amar uns aos outros, a orar uns pelos outros, a incentivar uns aos outros, a\nadmoestar uns aos outros, a saudar uns aos outros, a servir uns aos outros, a ensinar uns aos outros, a\naceitar uns aos outros, a honrar uns aos outros, a carregar os fardos uns dos outros, a perdoar uns aos\noutros, a nos submeter uns aos outros, a ser dedicados uns aos outros, além de muitas outras\nobrigações mútuas.\n     Isso é ser um membro, do ponto de vista bíblico! Essas são suas \"responsabilidades familiares\",\nque Deus espera que você cumpra na comunidade local. Com quem você vem agindo dessa forma?\n     Pode parecer mais fácil ser santo quando não há mais ninguém por perto para frustrar suas\npreferências, mas essa é uma santidade falsa.\n     Precisamos mais do que a Bíblia para crescer; precisamos de outros cristãos.\n     Crescemos mais fortes e mais rapidamente aprendendo uns com os outros e sendo responsáveis\nuns pelos outros.\n     Quando os outros compartilham o que Deus os está ensinando, também aprendemos a progredir.\n\n      I. O corpo de Cristo precisa de você.\n      Deus tem uma função específica para você desempenhar na sua família. Isso se chama\n\"ministério\", e Deus lhe concedeu talentos para esta missão: Um dom espiritual é dado a cada um de\nnós, visando ajudar a toda a igreja.\n      A congregação é o lugar que Deus planejou para que você descobrisse, desenvolvesse e utilizasse\nseus talentos.\n      Você até pode ter um ministério mais amplo, mas adicionalmente ao seu serviço no corpo local.\n      Jesus não prometeu edificar seu ministério; prometeu edificar a igreja dele.\n\n     II. Você participará na missão de Cristo no mundo.\n     Enquanto Jesus andou sobre a terra, Deus trabalhou por meio do corpo físico de Cristo; nos dias\nde hoje, ele usa seu corpo espiritual.\n     A igreja é o instrumento de Deus na terra. Não devemos apenas ser exemplo do amor de Deus ao\nnos amarmos uns aos outros; devemos transmiti-lo em conjunto para o resto do mundo.\n     Esse é um privilégio incrível que foi concedido a todos nós.\n     Como membros do corpo de Cristo, nós somos suas mãos, seus pés, seus olhos e seu coração.\n     Ele trabalha no mundo por meio de nós, e cada um de nós tem uma contribuição a dar.\n     Paulo nos diz: Porque somos criação de Deus realizada em Cristo Jesus para fazermos boas\nobras, as quais Deus preparou antes para nós as praticarmos.\n\n                                                                                    Igreja de Vencedores\n\n     III. A família de Deus irá impedi-lo de decair.\n     Nenhum de nós está imune à tentação.\n     Nas circunstâncias apropriadas, você e eu somos capazes de qualquer pecado.\n     Deus sabe disso, então nos atribuiu individualmente a responsabilidade de mantermos uns aos\noutros no caminho certo.\n     A Bíblia diz: Encorajem-se uns aos outros todos os dias... De modo que nenhum de vocês seja\nendurecido pelo engano do pecado.\n     \"Não é da sua conta\" não é uma frase cristã. Somos chamados e ordenados a nos envolver na vida\nuns dos outros.\n     Se você conhece pessoas que estão vacilando espiritualmente neste exato momento, é sua a\nresponsabilidade de ir atrás delas e trazê-las de volta para a comunhão.\n     Tiago nos diz: Se vocês conhecerem pessoas que se desviaram da verdade de Deus, não as\ndesprezem. Procurem-nas e tragam-nas de volta.\n     Um benefício de pertencer à igreja é que ela também proporciona a proteção espiritual.\n     Deus dá aos nossos Pastores Ermeson e Leiane Souza a responsabilidade de guardar, proteger,\ndefender e cuidar do bem estar espiritual de seus fiéis.\n     Foi-nos dito: A responsabilidade deles é zelar por suas almas, e eles sabem que devem prestar\ncontas disso à Deus.\n     Satanás adora cristãos afastados, desligados da vida no corpo, isolados da família de Deus e\nincompreensíveis para os líderes espirituais; porque ele sabe que eles são indefesos e impotentes contra\nsuas estratégias.\n\n     IV. Está tudo na igreja\n     Sempre que uma criança nasce, torna-se automaticamente parte da família universal dos seres\nhumanos. Mas essa criança também se torna membro de uma família específica, onde será nutrida,\ncuidada e crescerá forte e saudável.\n     O mesmo ocorre do ponto de vista espiritual. Quando você nasce de novo, torna-se\nautomaticamente parte da família de Deus, mas também precisa se tornar membro de uma igreja local\nda família de Deus.\n\n     A diferença entre visitar a igreja e ser membro da igreja está no comprometimento.\n     Visitantes são espectadores que ficam à parte; membros se envolvem no ministério.\n     Visitantes consomem; membros contribuem.\n     Visitantes querem os benefícios que a igreja traz, sem participar das responsabilidades.\n\n     São como casais que querem viver juntos sem se casar.\n     Por que é importante se juntar a uma igreja?\n     Porque isso prova que você está de fato comprometido com seus irmãos e irmãs espirituais, não\nsomente de forma teórica.\n     Deus quer que você ame pessoas reais, e não pessoas ideais.\n     Você pode passar a vida inteira buscando a igreja perfeita, porém jamais irá encontrá-la.\n     Você foi chamado para amar pecadores imperfeitos, assim como Deus faz.\n     Em Atos dos Apóstolos, os cristãos de Jerusalém eram bem específicos em seus compromissos\nuns com os outros.\n     Eles eram dedicados à comunidade.\n     A Bíblia diz: Eles se dedicavam ao ensino dos apóstolos e à comunhão, ao partir do pão e às\norações.\n\nHoje, Deus espera que você se comprometa com as mesmas coisas.\n     A vida cristã é mais do que apenas um compromisso com Cristo; ela inclui compromisso com os\noutros cristãos.\n     Os cristãos da Macedônia compreenderam isso. Paulo disse: Primeiro, eles deram a si mesmos ao\nSenhor e depois, pela vontade de Deus, eles se deram a nós também.\n     Tornar-se membro de uma igreja é o passo que vem naturalmente a seguir, uma vez que você\ntenha se tornado filho de Deus. Você se torna cristão ao se comprometer com Cristo, mas se torna\nmembro de uma igreja ao se comprometer com um grupo específico de cristãos.\n     A primeira decisão traz a salvação, a segunda traz a comunhão.\n\n      V. A vida foi feita para ser partilhada.\n      Deus quer que vivamos juntos.\n      A Bíblia chama essa experiência compartilhada de comunhão.\n      Hoje em dia, entretanto, a palavra perdeu grande parte de seu significado bíblico. \"Comunhão\" ou\n\"confraternização\" hoje se refere normalmente a uma conversa casual, uma atividade social, comida e\ndiversão.\n      A pergunta \"Onde você busca comunhão (congrega)?\" significa \"Qual igreja você frequenta?\".\n      A real comunhão significa muito mais do que apenas aparecer nos cultos. É ter vida em comum.\n      Ela inclui servir nas necessidades práticas, ser generoso com o sacrifício de si mesmo, consolar\ncompassivamente e todas as outras orientações \"uns aos outros\" encontradas no Novo Testamento.\n      Quando se trata de comunhão, o tamanho importa: quanto menor melhor. Você pode adorar no\nmeio de uma multidão, mas não pode ter comunhão com ela.\n      Quando um grupo se torna algo maior do que doze pessoas, alguém deixa de participar —\nnormalmente o mais pacato —, e umas poucas pessoas acabam dominando o grupo.\n      Jesus ministrou no contexto de um pequeno grupo de discípulos. Ele podia ter escolhido mais,\nporém sabia que doze era o número máximo de pessoas que uma célula pode conter para que todos\npossam participar.\n      O corpo de Cristo, assim como seu próprio corpo, é na verdade um conjunto de muitas pequenas\ncélulas.\n      A vida do corpo de Cristo, tal qual o seu corpo, está contida no interior das células. Por essa\nrazão, todo cristão deve estar envolvido em uma célula dentro da igreja.\n       É ali que ocorre a verdadeira comunhão, e não nas grandes reuniões.\n      Se você imaginar sua igreja como um navio, as células são os botes salva-vidas presos a ela.\n      Infelizmente, mesmo está em uma célula ou Ministério não lhe garante experimentar uma\ncomunhão real é preciso está vivendo os 5 propósitos de Deus na sua vida. Adoração, Comunhão,\nDiscipulado, Ministério e Missões.\n\n     VI. É sua função proteger a unidade de sua igreja.\n     A unidade da igreja é tão importante que o Novo Testamento dá mais importância a isso do que\nao céu ou ao inferno.\n     Deus deseja profundamente que experimentemos unidade e harmonia uns com os outros.\n     A unidade é a alma da comunhão.\n     Destrua-a, e estará rasgando o coração do corpo de Cristo.\n     É a essência, o âmago de como Deus pretende que experimentemos a vida conjunta na igreja.\n     Nosso modelo supremo de unidade é a Trindade. O Pai, o Filho e o Espírito Santo são totalmente\nunidos em um.\n     O próprio Deus é o maior de todos os exemplos de amor sacrificial, altruísmo e harmonia\nperfeita.\n\n                                                                                   Igreja de Vencedores\n\n     Assim como qualquer pai, nosso Pai celestial tem prazer em ver os filhos em harmonia uns com\nos outros.\n     Em seus últimos momentos, antes de ser preso, Jesus orou apaixonadamente pela nossa unidade.\n     Era nossa união que estava em primeiro lugar em sua mente naquelas horas agonizantes.\n     Nada na terra é mais valioso para Deus que sua igreja. Ele pagou o mais alto preço por ela e a\nquer protegida, especialmente dos danos devastadores causados pelas divisões, conflitos e\ndiscordâncias.\n     Se você é parte da família de Deus, é sua responsabilidade preservar a unidade na Célula e Igreja.\n     Você foi encarregado por Jesus de fazer todo o possível para preservar a unidade, proteger a\ncomunhão e promover a harmonia na sua igreja e entre todos os cristãos.\n     A Bíblia diz: Façam todo o esforço para conservar a unidade do Espírito pelo vínculo da paz.\n     Como podemos fazer isso?\n\n      VI. Concentre-se no que temos em comum, não em nossas diferenças.\n      Paulo nos diz: Portanto, concentremo-nos nas coisas que contribuem para a harmonia e no\ncrescimento de nossa comunhão conjunta?\n      Como cristãos, partilhamos um Senhor, um corpo, um propósito, um Pai, um Espírito, uma\nesperança, uma fé, um batismo e um amor.\n      Partilhamos a mesma salvação, a mesma vida e o mesmo futuro — fatores muito mais\nimportantes do que as diferenças que poderíamos enumerar.\n      É nesses temas, e não em nossas diferenças pessoais, que devemos nos concentrar.\n      Devemos nos lembrar que foi Deus que escolheu nos dar diferentes personalidades, formações,\nraças e preferências; logo, deveríamos apreciar essas diferenças, e não simplesmente tolerá-las.\n      Deus quer unidade, não desigualdade. Mas, para o bem da unidade, não devemos deixar que\nnossas diferenças nos dividam jamais. Precisamos nos manter concentrados no que mais importa —\naprender a amar uns aos outros como Cristo nos amou e cumprir os cinco propósitos de Deus para cada\num de nós e sua igreja.\n      O conflito é normalmente sinal de que o foco foi desviado para assuntos menos importantes.\n      Quando nos concentramos em personalidades, preferências, interpretações, estilos ou métodos, a\ndivisão sempre acontece. Mas, se nos concentramos em amar uns aos outros e em cumprir os\npropósitos de Deus, chegamos à harmonia.\n      Paulo implorou por isso: Irmãos, em nome de nosso Senhor Jesus Cristo suplico a todos vocês\nque concordem uns com os outros no que falam, para que não haja divisões entre vocês; antes, que\ntodos estejam unidos num só pensamento e num só parecer.\n\n      VIII. Seja realista em suas expectativas.\n      Você deve amar apaixonadamente a igreja, a respeito de suas imperfeições. Desejar o ideal em\nvez de critica o real.\n      Maturidade é conviver com essa tensão. Outros cristãos irão decepcioná-lo e desiludi-lo, mas isso\nnão é desculpa para deixar de congregar com eles.\n      Eles são a sua família, mesmo quando não agem desse jeito, e você não pode simplesmente\nabandoná-los.\n      Em vez disso, Deus nos disse: Sejam pacientes uns com os outros, fazendo concessões às faltas\ndos outros por causa do amor que há em vocês.\n      As pessoas ficam desiludidas com a igreja por muitas razões compreensíveis.\n      A lista poderia ser bastante longa: conflitos, mágoas, hipocrisia, negligência, mesquinharias,\nlegalismo e outros pecados.\n\nEm vez de ficarmos abalados e surpresos, devemos lembrar que a igreja é feita de pecadores de\nverdade, inclusive nós mesmos. Por sermos pecadores, magoamos uns aos outros, às vezes\nintencionalmente e às vezes sem querer.\n      Mas, em vez de deixarmos a igreja, precisamos ficar e solucionar o que for de alguma forma\npossível.\n      A reconciliação, não a fuga, é a estrada para um caráter mais forte e para uma comunhão mais\nprofunda.\n      Divorciar-se da igreja ao primeiro sinal de decepção ou desilusão indica imaturidade. Deus tem\ncoisas que quer ensinar a você e aos outros também.\n      Além do mais, não há nenhuma igreja perfeita para onde escapar. Toda igreja tem seu próprio\nconjunto de fraquezas e problemas, e você logo ficará novamente desapontado.\n      Se uma igreja deve ser perfeita para satisfazê-lo, essa mesma perfeição irá excluí-lo dentre seus\nmembros, porque você não é perfeito!\n      Quanto mais rápido renunciarmos à ilusão de que uma igreja deve ser perfeita para que a\namemos, mais rápido deixaremos de fingir e admitiremos que somos todos imperfeitos e precisamos da\ngraça de Deus.\n      Esse é o início da verdadeira comunidade.\n      Toda igreja deveria fixar uma placa: \"Pessoas perfeitas não precisam entrar. Este é um lugar\nsomente para os que admitem ser pecadores, precisam da graça de Deus e querem crescer\".\n      Nós devemos agradecer diariamente pela congregação onde fomos colocados, mesmo quando as\ncoisas não estão indo como queremos, pois, quando murmuramos e nos queixando de que tudo é ruim\ne insignificante, nós estamos impedindo Deus de fazer crescer a igreja.\n\n      IX. Prefira incentivar do que criticar.\n      É sempre mais fácil ficar de lado e atirar pedras naqueles que estão servindo do que se envolver e\ncontribuir.\n      Deus nos adverte repetidamente que não critiquemos, comparemos ou julguemos uns aos outros.\n      Quando você critica o que outro cristão está fazendo na fé e com sincera convicção, está\ninterferindo nos assuntos de Deus: Que direito você tem de criticar o servo de alguém?\n      Somente Deus pode decidir se ele está fazendo o que é certo.\n\n     Sempre que eu julgo outro cristão, quatro coisas acontecem instantaneamente: perco minha\ncomunhão com Deus, exponho meu próprio orgulho e insegurança, coloco-me em uma situação\npela qual serei julgado por Deus e prejudico a comunhão da igreja.\n\n     A Bíblia chama Satanás de acusador dos nossos irmãos.\n     Culpar e criticar os membros da família de Deus queixando-se deles é trabalho do Diabo.\n     No momento em que fazemos o mesmo, estamos sendo ludibriados para fazer o trabalho de\nSatanás.\n     Todo tempo que desperdiçamos comparando ou criticando outros cristãos é um tempo que\ndeveríamos ter usado na edificação da unidade da igreja.\n\n     X. Recuse dar ouvidos a fofocas.\n     Fofocar é transmitir informações quando você nem é parte do problema nem parte da solução.\n     Você sabe que espalhar fofocas é errado, e não deve nem ouvi-las se quiser proteger a igreja.\n     Ouvir uma fofoca é como comprar mercadoria roubada; isso o faz igualmente culpado pelo crime.\n     Quando alguém começar a fofocar em seu ouvido, tenha a coragem de dizer: \"Por favor, pare.\nNão preciso saber disso. Você já falou diretamente com a pessoa?\".\n\n                                                                                     Igreja de Vencedores\n\n     Pessoas que fofocam para você também irão fofocar sobre você. Tais pessoas não são confiáveis.\n     Se você dá ouvidos a fofocas, Deus diz que você é um criador de casos. Criadores de caso ouvem\ncriadores de caso.\n     Esses são os que dividem igrejas.\n     É triste ver no rebanho de Deus, que as maiores feridas venham das outras ovelhas, e não de\nlobos.\n     Paulo alertou sobre os cristãos canibais, que devoram uns aos outros e destroem a comunhão.\n     A Bíblia diz que esse tipo de encrenqueiro deveria ser evitado: A difamação revela segredos.\nPortanto, fique longe de quem é falador.\n     A forma mais rápida de pôr fim a um conflito, seja em uma igreja, seja em uma célula, é\ncarinhosamente enfrentar os que estão fofocando e insistir em que parem.\n     Salomão destacou que: Uma fogueira se apaga quando acaba a lenha; da mesma maneira, as\nbrigas acabam quando o brigão e implicante é separado do grupo.\n\n      XI. Pratique os métodos de Deus para a solução de conflitos.\n      Se o seu irmão pecar contra você, vá e, a sós com ele, mostre-lhe o erro. Se ele o ouvir, você\nganhou seu irmão. Mas, se ele não o ouvir, leve consigo mais um ou dois outros, de modo que qualquer\nacusação seja confirmada pelo depoimento de duas ou três testemunhas.\n      Se ele se recusar a ouvi-los, conte à igreja.\n      Em meio a um conflito, temos a tentação de nos queixar a terceiros, em vez de corajosamente\nfalar a verdade de maneira amorosa à pessoa com quem estamos aborrecidos.\n      Isso só torna o assunto mais grave. Em vez disso, você deve ir diretamente à pessoa envolvida.\n      O confronto em particular é sempre o primeiro passo, e você deve tomá-lo o mais rapidamente\npossível.\n      Se você não for capaz de resolver as coisas somente entre os dois, o próximo passo é levar uma\nou duas testemunhas para ajudarem a confirmar o problema e reconciliar o relacionamento.\n      E o que fazer se a pessoa ainda persistir teimosamente? Jesus ordena que se leve o assunto à\nigreja. E, se a pessoa ainda assim se recusar a escutar, você deve tratá-la como a um incrédulo.\n\n      XII. Apoie os nossos Pastores Ermeson e Leiane Souza e aos lideres da igreja.\n      Não existe um líder perfeito, mas Deus dá aos líderes a responsabilidade e a autoridade para que\nmantenham a unidade da igreja.\n      Os nossos Pastores algum dia estarão perante Deus e terão de prestar contas de como zelaram por\nvocê. Eles cuidam de vocês como quem deve prestar contas.\n      Mas você também terá de prestar contas. Você prestará contas a Deus sobre a forma que seguiu\nseus Pastores.\n      A Bíblia dá aos nossos Pastores instruções específicas sobre como lidar com pessoas\ndesagregadoras no meio da congregação.\n      Eles devem evitar discussões e ensinar gentilmente o contrário, enquanto oram para que elas\nmudem.\n      Devem admoestar os que são polêmicos, rogar por harmonia e unidade, repreender os que forem\ndesrespeitosos com a liderança e remover os desagregadores da igreja, caso não considerem os dois\navisos.\n      Protegemos a igreja quando honramos os que nos servem como líderes. Os nossos pais espirituais\nnecessitam de nossas orações, incentivos, apreço e amor. Recebemos as seguintes orientações: Agora\nlhes pedimos, irmãos, que tenham consideração para com os que se esforçam no trabalho entre vocês,\nque os lideram no Senhor e os aconselham. Tenham-nos na mais alta estima, com amor, por causa do\ntrabalho deles.\n\nEu o desafio a aceitar a responsabilidade de proteger e promover a união em sua congregação.\nEmpenhe-se nisso com todo o seu esforço, e Deus irá se agradar.\n      Nem sempre será fácil. Algumas vezes você terá de fazer o que é melhor para o corpo, e não para\nsi mesmo, mostrando preferência pelos outros.\n      Este é um dos motivos pelos quais Deus nos colocou em uma família eclesiástica: para\naprendermos o abandono do nosso \"EU\".\n      Em comunidade, aprendemos a dizer \"nós\" em vez de \"eu\" e \"nosso\" em vez de \"meu\". Deus\ndiz: Não pensem só em seu próprio bem. Pensem nos outros cristãos e no que é melhor para eles.\n      Deus abençoa igreja unida.\n      O que você está fazendo no plano pessoal para tornar a igreja mais aconchegante e amorosa?\n      Existem muitas pessoas em seu bairro que estão procurando amor e um lugar ao qual pertencer.\n      A verdade é que todo o mundo precisa e quer ser amado e, quando as pessoas acham uma igreja\nonde os membros verdadeiramente amam e se importam uns com os outros, elas vão dar um jeito de\nentrar ainda que as portas estejam trancadas.\n\n    COMENTE O QUE MAIS CHAMOU A SUA ATENÇÃO:\n    ______________________________________________________________________________\n__________________________________________________________________________________\n__________________________________________________________________________________\n\n                                                                                   Igreja de Vencedores\n         166", "quiz": [{"q": "Qual é o texto bíblico-base da lição \"A FAMILIA DE DEUS\"?", "options": ["Malaquias 3.10", "Atos 2.41", "Gênesis 17:2; Isaías 60:22; Marcos 16:15", "Efésios 2.19"], "answer": 3}, {"q": "Qual destes é um dos tópicos estudados na lição \"A FAMILIA DE DEUS\"?", "options": ["Atitudes Que Você Pode Tomar No Encontro", "Prefira Incentivar Do Que Criticar", "A Natureza Do Espirito Santo", "A Primeira Divisão Da Igreja Católica"], "answer": 1}, {"q": "Qual destes tópicos NÃO faz parte da lição \"A FAMILIA DE DEUS\"?", "options": ["A Família De Deus Irá Impedi-Lo De Decair", "As Bênçãos Que Acompanham O Dízimo", "Pratique Os Métodos De Deus Para A Solução De Conflitos", "Concentre-Se No Que Temos Em Comum, Não Em Nossas Diferenças"], "answer": 1}]}, {"num": 27, "title": "SENDO SEMELHANTE A CRISTO", "verseRef": "Colossenses 2.6", "content": "INTRODUÇÃO\n      Deus já sabia o que ele faria desde o início. Ele decidiu desde o princípio moldar a vida daqueles\nque o amam com os mesmos parâmetros da vida de seu Filho.\n      Você foi criado para se tornar semelhante a Cristo.\n      Desde o princípio, o plano de Deus tem sido fazê-lo à semelhança de seu Filho, Jesus. Esse é o\nseu destino e o propósito para sua vida.\n      Deus anunciou sua intenção na criação: Então disse Deus: Façamos o homem a nossa imagem,\nconforme a nossa semelhança.\n      Em toda a criação, somente o homem foi feito \"à imagem de Deus\". Esse é um grande privilégio,\nque nos honra sobremaneira.\n      Não sabemos tudo que essa frase abrange, mas conhecemos alguns dos aspectos que ela inclui: tal\ncomo Deus, somos seres espirituais — nosso espírito é imortal e sobreviverá ao nosso corpo terreno;\nsomos inteligentes — podemos pensar, avaliar e solucionar problemas; como Deus, nós nos\nrelacionamos — podemos dar e receber amor verdadeiro e somos dotados de consciência moral —\npodemos discernir entre o certo e o errado, o que nos torna responsáveis diante de Deus.\n      A Bíblia diz que todas as pessoas, e não apenas os cristãos, detêm parte da imagem de Deus.\n      Mas a imagem está incompleta, tendo sido danificada e distorcida pelo pecado. Então Deus\nenviou Jesus para restaurar a plena imagem que havíamos perdido.\n\n      I. Tornar-se semelhante a Cristo é um lento e longo processo de crescimento.\n      A maturidade espiritual não é instantânea nem automática; é um desenvolvimento que durará o\nresto de sua vida.\n      A respeito desse processo, Paulo disse: Isso irá continuar até que sejamos maduros como Cristo é,\ne seremos iguais a ele.\n      Você é um trabalho em execução.\n      Sua transformação espiritual, no que se refere a desenvolver o caráter de Jesus, durará o resto de\nsua vida, e mesmo assim não será completada aqui na terra.\n      Ela só estará terminada quando você for para o céu ou quando Jesus voltar.\n      A Bíblia diz que quando finalmente formos capazes de ver a Jesus em perfeição, nos tornaremos\nperfeitos como ele: Não podemos sequer imaginar como seremos quando Cristo voltar.\n      Porém sabemos que, quando ele aparecer, seremos semelhantes a ele, pois o veremos como\nrealmente é.\n\n     II. Deus quer que você cresça.\n     O objetivo do Pai celestial é que você amadureça e desenvolva as características de Jesus Cristo.\n     Lamentavelmente, milhões de cristãos envelhecem, mas nunca crescem.\n     Emperram numa perpétua infância espiritual, permanecendo de fraldas e sapatinhos de crochê.\n     O motivo é que nunca pretenderam crescer.\n     Crescimento espiritual não é algo automático. É necessário que haja um compromisso voluntário.\n     Você deve querer crescer, decidir crescer, fazer um esforço para crescer e persistir em crescer.\n\n     O discipulado — o processo de se tornar semelhante a Cristo — sempre começa com uma\ndecisão DE QUERER CRESCER ESPIRITUALMENTE.\n\nJesus nos chama, e nós respondemos: \"Venha, seja meu discípulo\", Jesus lhe disse. Então Mateus\nlevantou-se e o seguiu.\n     Quando os primeiros discípulos escolheram seguir a Jesus, não compreendiam todas as\nimplicações da decisão que haviam tomado. Simplesmente atenderam ao convite de Jesus.\n     Isso é tudo de que você precisa para começar: decidir tornar-se um discípulo.\n\n     Nada molda mais sua vida que os compromissos que você escolhe fazer.\n     Seus compromissos podem desenvolvê-lo ou destruí-lo, mas de qualquer forma serão\ndeterminantes para você. Diga-me com o que você está comprometido, e eu lhe direi onde você\nestará em um ano.\n\n      Tornamo-nos aquilo com que estamos comprometidos.\n      É nesse estágio do comprometimento que a maioria das pessoas perde o propósito de Deus para a\nvida delas.\n      Muitos têm medo de se comprometer com qualquer coisa e simplesmente ficam vagando pela\nvida.\n      Outros assumem compromissos superficiais, com valores conflitantes, o que leva à frustração e à\nmediocridade. Outros se comprometem inteiramente com objetivos seculares, como enriquecer ou ficar\nfamoso, e acabam desapontados e amargos.\n      Toda escolha tem consequências eternas; logo, é melhor que você escolha sabiamente.\n      Pedro adverte: E assim, já que tudo ao nosso redor se derreterá, que vidas santas e piedosas nós\ndevemos viver!\n\n      III. A parte de Deus e a sua parte.\n      Tornar-se semelhante a Cristo é o resultado de fazer escolhas em conformidade com ele,\ndependendo de seu Espírito para ajudá-lo a consumar essas escolhas.\n      Uma vez que tenha decidido seriamente se tornar semelhante a Cristo, você deve começar a agir\nde maneira diferente.\n      Você precisará se livrar de alguns procedimentos antigos, desenvolver novos hábitos e\nintencionalmente mudar sua forma de pensar.\n      Esteja certo de que o Espírito Santo o ajudará nessas mudanças.\n      A Bíblia diz: Ponham em ação a salvação de vocês com temor e tremor, pois é Deus quem efetua\nem vocês tanto o querer quanto o realizar, de acordo com a boa vontade dele?\n      Esse versículo mostra as duas partes do crescimento espiritual: ponham em ação e efetua em\nvocês.\n      O ponham em ação é o nosso dever, e o efetua em vocês é o papel de Deus.\n      Crescimento espiritual é um esforço de cooperação entre você e o Espírito Santo.\n      O Espírito de Deus trabalha conosco, e não apenas em nós.\n      Esse versículo, direcionado aos cristãos, não é sobre como ser salvo, mas sobre como crescer.\n      Não trata de trabalhar pela salvação, porque você não pode somar nada ao que Jesus já realizou.\n      Quando \"põe em ação\" seu corpo, você se exercita para desenvolvê-lo, não para conseguir um\ncorpo.\n      Quando \"põe em ação\" sua mente, para resolver um quebra-cabeça, você já possui todas as peças\n— sua tarefa é juntá-las.\n      Fazendeiros trabalham a terra não para a obter, mas para desenvolver o que já possuem.\n      Deus lhe deu uma nova vida; agora você é responsável por desenvolvê-la \"com temor e tremor\".\nIsso significa levar seu crescimento espiritual a sério!\n\n                                                                                   Igreja de Vencedores\n\n     Quando as pessoas são desleixadas com seu crescimento espiritual (faltam os cultos por qualquer\nmotivo, saem da igreja por qualquer coisa, passam dias sem lerem a bíblia e não praticam a oração\ndiária ou deixam de dizimar por qualquer imprevisto.\n\n      IV. Alterando seu piloto automático.\n      Para mudar sua vida, você deve mudar sua forma de pensar.\n      Por trás de tudo que você faz, há um pensamento.\n      Todo comportamento é motivado por uma crença, e toda ação é estimulada por uma atitude.\n      Deus revelou isso a milhares de anos antes de os psicólogos terem essa compreensão: Tenha\ncuidado com o que você pensa, pois a sua vida é dirigida pelos seus pensamentos.\n      Imagine-se viajando em uma lancha, em um lago, com um piloto automático ajustado para o\nLeste.\n      Se você decidir dar a volta e rumar para Oeste, haverá duas formas possíveis de mudar a direção\ndo barco.\n      Uma forma é agarrar a roda do leme e forçá-la fisicamente a rumar para o lado oposto do ajuste\ndo piloto automático.\n      Com pura e simples força de vontade, você poderia vencer o piloto automático, mas sentiria\nconstantemente uma resistência.\n      Seus braços acabariam por se cansar do esforço, você soltaria a roda do leme e a lancha\ninstantaneamente voltaria a rumar para o leste, da forma em que estava programada.\n      É isso que acontece quando você tenta mudar sua vida com força de vontade.\n      Você diz: \"Vou me forçar para comer menos [...] fazer mais exercícios [...] deixar de me atrasar e\nde ser desorganizado\". Sim, a força de vontade pode produzir mudanças em curto prazo, mas cria uma\npressão interna constante, porque você não lidou com a causa básica.\n      A mudança não é natural, então você acaba por desistir, sai da dieta e deixa de se exercitar.\n      Você rapidamente retorna aos padrões anteriores.\n      Há uma forma melhor e mais rápida: altere o ajuste do piloto automático — sua forma de pensar.\n      A Bíblia diz: Deixem que Deus os transforme em nova pessoa, mudando a maneira de vocês\npensarem.\n      Seu primeiro passo em direção ao crescimento espiritual é começar a mudar sua forma de pensar.\n      Toda mudança deve sempre ocorrer primeiro em sua mente.\n      Sua forma de pensar determina sua forma de sentir, e o que você sente influencia sua forma de\nagir.\n      Paulo disse: Deve haver uma renovação espiritual de seus pensamentos e atitudes.\n      Para ser semelhante a Cristo, você deve desenvolver a mente de Cristo.\n      O Novo Testamento chama esse desvio mental de arrependimento, que em grego quer dizer\nliteralmente \"mudar de idéia\".\n      Você se arrepende sempre que muda sua maneira de pensar, ao adotar a forma de Deus pensar —\nsobre si mesmo, sobre o pecado, sobre Deus, sobre as outras pessoas, sobre a vida, sobre seu futuro e\nsobre tudo mais.\n      Você assume a perspectiva e o enfoque de Cristo.\n      Recebemos a seguinte ordem: Tenham entre vocês o mesmo modo de pensar que Cristo Jesus\ntinha.\n      Isso se divide em duas partes.\n      A primeira metade dessa alteração mental é parar de ter pensamentos imaturos, os quais são\negocêntricos e egoístas.\n      A Bíblia diz: Deixem de pensar como crianças.\n      Com respeito ao mal, sejam crianças; mas, quanto ao modo de pensar, sejam adultos.\n\nOs bebês são por natureza completamente egoístas. Eles só pensam em si mesmos e em suas\nnecessidades.\n     São incapazes de dar; só conseguem receber. Isso é uma forma imatura de pensar.\n     Infelizmente, muitas pessoas nunca crescem além desse tipo de pensamento.\n     A Bíblia diz que o pensamento egoísta é a fonte do comportamento pecaminoso: Os que vivem\nsegundo o próprio ego pecaminoso só pensam nas coisas que seu ego pecaminoso deseja.\n     A segunda parte da mudança que leva a pensar como Jesus é começar a ter pensamentos maduros,\nos quais se concentram nos outros, e não em você mesmo.\n     Em seu grande capítulo sobre o que é o verdadeiro amor, Paulo concluiu que pensar nos outros é\na marca da maturidade: Quando eu era menino, falava como menino, pensava como menino e\nraciocinava como menino.\n     Quando me tornei homem, deixei para trás as coisas de menino.\n\n      Hoje, muitas pessoas presumem que a maturidade espiritual é medida pela quantidade de\ninformação bíblica e de doutrinas que conhecem.\n      Embora conhecimento seja uma das dimensões da maturidade, isso não é toda a história.\n      A vida cristã é muito mais do que credos e convicções; ela inclui conduta e caráter.\n      Nossos atos devem ser coerentes com nossa fé, e nossas crenças devem ser respaldadas por um\ncomportamento cristão.\n      O cristianismo não é uma religião ou uma filosofia, mas um relacionamento e um estilo de\nvida.\n\n     A essência desse estilo de vida, como Jesus disse, é pensar nos outros, e não em nós mesmos.\n     A Bíblia diz: Devemos pensar no bem deles e tentar ajudá-los, fazendo coisas que agradam a eles.\n     Nem mesmo Cristo tentou agradar a si mesmo.\n\n      V. A verdade nos transforma.\n      O crescimento espiritual é o processo no qual substituímos as mentiras pelas verdades.\n      Jesus orou: Santifica-os na verdade; a tua palavra é a verdade.\n      Santificação exige revelação.\n      O Espírito de Deus usa a Palavra de Deus para nos tornar semelhantes ao Filho de Deus. Para nos\ntornar semelhantes a Jesus, devemos preencher nossa vida com a sua Palavra.\n      A Bíblia diz: Por meio da Palavra, somos unidos e moldados para as tarefas que Deus tem para\nnós.\n       A Palavra de Deus é diferente de qualquer outra palavra. Ela é viva.\n      Jesus disse: As palavras que eu lhes disse são espírito e vida.\n      Quando Deus fala, as coisas mudam. Tudo ao seu redor — toda a Criação — existe porque disse\nDeus.\n      Foi pelas suas palavras que tudo veio a existir. Sem elas, você nem estaria vivo.\n      Tiago observa: Deus decidiu nos dar vida pela palavra da verdade, de modo que sejamos a mais\nimportante de todas as coisas que ele fez.\n      A Bíblia é muito mais do que um manual de doutrinas.\n      A Palavra de Deus gera a vida, cria a fé, produz mudanças, afugenta o Diabo, realiza milagres,\ncura feridas, edifica o caráter, transforma as circunstâncias, transmite alegria, supera a adversidade,\nderrota a tentação, infunde esperança, libera poder, limpa nossas mentes, cria as coisas e nos garante o\nfuturo eterno!\n      Não podemos viver sem a Palavra de Deus! Nunca subestime o valor dela.\n      Você deve considerá-la tão essencial para sua vida como a comida.\n\n                                                                                     Igreja de Vencedores\n\n      VI. Devo assimilar sua verdade.\n      Não basta acreditar na Bíblia; devo preencher minha mente com ela, de forma que o Espírito\nSanto possa me transformar com a verdade.\n      Existem cinco maneiras de fazer isso: você pode recebê-la, lê-la, pesquisá-la, relembrá-la e\nrefletir sobre ela.\n\n     Primeira: você recebe a Palavra de Deus quando a ouve e aceita com uma postura aberta e\nreceptiva.\n     A parábola do semeador ilustra como nossa receptividade determina se a Palavra de Deus irá ou\nnão criar raízes em nossa vida e dar frutos.\n\n      Segunda: por mais de dois mil anos na história da igreja, somente os sacerdotes podiam ler a\nBíblia pessoalmente, mas agora milhões têm acesso a ela.\n      Apesar disso, muitos cristãos são mais dedicados à leitura do jornal diário do que à leitura da\nBíblia.\n      Não é de admirar que não cresçamos. Não podemos assistir a televisão por três horas, ler a Bíblia\ntrês minutos e esperar crescer.\n      Muitos que afirmam crer na Bíblia \"de capa a capa\" jamais a leram de uma capa a outra. Mas, se\nvocê separar quinze minutos de seu dia para a leitura da Bíblia, a lerá inteiramente uma vez por ano.\n      Se você cortar um programa diário de televisão que dure trinta minutos e ler a Bíblia no lugar,\nlerá a Bíblia inteira duas vezes por ano.\n      A leitura diária da Bíblia o manterá ao alcance da voz de Deus.\n      Foi por isso que Deus orientou o rei de Israel a sempre manter por perto uma cópia de sua\nPalavra: Trará sempre essa cópia consigo e terá de lê-la todos os dias da sua vida. Mas não se limite a\nmantê-la perto de você; leia a Bíblia regularmente!\n\n      Terceira: pesquisar ou estudar — a Bíblia — é outra forma prática de permanecer na Palavra de\nDeus.\n      A diferença entre ler e estudar a Bíblia está em dois exercícios que se adicionam ao da simples\nleitura: fazer perguntas sobre o texto e anotar suas impressões.\n      Você não estudou realmente a Bíblia, se não escreveu seus pensamentos no papel ou no\ncomputador.\n\n      Quarta: Permanecer na Palavra de Deus - é relembrá-la. A capacidade de lembrar é dom de\nDeus.\n      Você pode pensar que tem memória fraca, mas a verdade é que há milhões de ideias, verdades,\nfatos e imagens memorizados.\n      Você lembra o que é importante para você. Se a Palavra de Deus é importante, você usará seu\ntempo para relembrá-la.\n      Existem enormes benefícios na memorização de versículos bíblicos. Eles o ajudam a resistir à\ntentação, decidir sabiamente, diminuir a pressão, ganhar confiança, dar bons conselhos e partilhar sua\nfé com os outros.\n      Sua memória é como um músculo. Quanto mais você a usa, mais forte ela se torna, e memorizar\nas Escrituras ficará mais fácil.\n      Você deve começar selecionando uns poucos versículos bíblicos do estudo das Campanhas da\nIgreja, Estudo das Células, Gerações e Ministério que o sensibilizaram, escrevendo-os em um pequeno\ncartão que possa ser levado consigo. Então releia em voz alta durante o dia.\n\nVocê pode memorizar as Escrituras em qualquer lugar: enquanto trabalha, se exercita, dirige,\nespera ou na hora de dormir.\n     Os três segredos para a memorização das Escrituras são: relembrar, relembrar e relembrar!\n\n     Quinta: Permanecer na Palavra de Deus - é refletir sobre ela, o que a Bíblia chama de\n\"meditação\".\n     Para muitos, a ideia de meditar invoca imagens de alguém esvaziando a mente e deixando-a\nvaguear. Isso é exatamente o oposto da meditação bíblica.\n     Meditação é pensamento concentrado.\n     É necessário esforço verdadeiro. Você escolhe um versículo e reflete sobre ele repetidamente.\n     Se você sabe se preocupar, já sabe meditar. Preocupação é o pensamento concentrado em algo\nnegativo. A meditação é o mesmo, porém voltado para a Palavra de Deus, e não para algum problema.\n     Não há outro hábito que seja tão eficaz na transformação de sua vida ou em torná-lo mais\nsemelhante a Jesus do que a reflexão diária nas Escrituras.\n\n     VII. Devo aplicar seus princípios.\n\n      Podemos receber, ler, pesquisar, relembrar e refletir na Palavra de Deus; mas tudo será inútil\nse falharmos em pô-la em prática.\n\n      Devemos nos tornar praticantes da palavra. Esse é o passo mais difícil de todos, porque Satanás\ncombate com muita intensidade. Ele não se importa se você frequenta célula ou participa do Encontro\ncom Deus, contanto que não faça nada com o que aprendeu.\n      Enganamos a nós mesmos quando presumimos que, apenas por termos ouvido, lido ou estudado a\nverdade, nós a assimilamos.\n      Na verdade, você pode está tão ocupado indo para a célula ou para as Campanhas da Igreja que\nnão tem tempo de pôr em prática o que aprendeu.\n      Você esquece o que aprendeu a caminho do próximo estudo.\n      Sem o pormos em prática, qualquer estudo bíblico é inútil. Jesus disse: Portanto, quem ouve estas\nminhas palavras e as pratica é como um homem prudente que construiu a sua casa sobre a rocha.\n      Jesus também destacou que as bênçãos de Deus vêm de obedecer à verdade, e não apenas de\nconhecê-la.\n      Ele disse: Agora que vocês sabem estas coisas, felizes serão se as praticarem.\n      A melhor forma de tornar-se um \"praticante da Palavra\" é colocar no papel uma atitude efetiva\nresultante da leitura, estudo ou reflexão sobre a Palavra de Deus.\n\n     Desenvolva o hábito de anotar de forma precisa o que você pretende fazer. Essa atitude efetiva\ndeverá ser pessoal (envolvendo você), prática (algo que você possa fazer) e verificável (com um\nprazo final para ser feita).\n\n     Toda aplicação deve envolver o seu relacionamento com Deus, seu relacionamento com os\noutros, e o seu caráter pessoal.\n     Pense nesta pergunta: \"O que Deus já falou para você fazer por meio de sua Palavra que você\nainda não começou?\". Então escreva algumas instruções práticas que o ajudarão a agir no que você já\nestabeleceu.\n\n     Você pode contar aos membros da sua célula para que eles possam ajudá-lo.\n\n                                                                                    Igreja de Vencedores\n\n    A Bíblia não nos foi dada para aumentar nosso conhecimento, mas para mudar nossa vida.\n\n    COMENTE O QUE MAIS CHAMOU A SUA ATENÇÃO:\n    ______________________________________________________________________________\n__________________________________________________________________________________\n__________________________________________________________________________________", "quiz": [{"q": "Qual é o texto bíblico-base da lição \"SENDO SEMELHANTE A CRISTO\"?", "options": ["Colossenses 2.6", "João 15.15", "Atos 4.12", "Eclesiastes 3.11"], "answer": 0}, {"q": "Qual destes é um dos tópicos estudados na lição \"SENDO SEMELHANTE A CRISTO\"?", "options": ["Os Demônios Nos Desenhos Animados", "Defina Hierarquias Espirituais Dos Demônios", "Deus Quer Que Você Cresça", "A Adoração Não É Parte De Sua Vida; Ela É A Sua Vida"], "answer": 2}, {"q": "Qual destes tópicos NÃO faz parte da lição \"SENDO SEMELHANTE A CRISTO\"?", "options": ["Deus Quer Que Você Cresça", "A Parte De Deus E A Sua Parte", "Compreendendo Algumas Realidades Espirituais", "A Verdade Nos Transforma"], "answer": 2}]}, {"num": 28, "title": "VENCENDO A PROVAÇÃO", "verseRef": "2 Corintios 4.17", "content": "INTRODUÇÃO\n      Deus tem um propósito por trás de cada problema.\n      Ele usa as circunstâncias para desenvolver nosso caráter. Na verdade, ele se utiliza mais das\ncircunstâncias para nos tornar semelhantes a Jesus do que da nossa leitura da Bíblia.\n      A razão é óbvia: você se defronta com as circunstâncias da vida 24 horas por dia.\n      Jesus nos alertou dizendo que teríamos problemas no mundo. Ninguém está imune à dor ou livre\nde sofrer; e ninguém tem a oportunidade de atravessar a vida sem problemas.\n      Pedro nos assegura de que problemas são normais: Queridos amigos, não se assustem nem se\nadmirem quando vocês passarem pelas provas ardentes que estão para vir, pois isto não é coisa\nestranha nem fora do comum que lhes vai acontecer.\n\n     I. Deus utiliza os problemas para trazê-lo para perto de si.\n     A Bíblia diz: O Senhor está perto dos que têm o coração quebrantado e salva os de espírito\nabatido.\n     Suas mais íntimas e profundas experiências de adoração ocorrerão provavelmente nos dias mais\nsombrios — quando seu coração estiver partido, você se sentir abandonado, não tiver mais nenhuma\nopção, a dor for intensa — e você buscar somente a Deus.\n\n     É durante períodos de sofrimento que aprendemos a fazer nossas orações mais sinceras,\nautênticas e honestas para com Deus.\n     Quando sentimos dor física ou emocional, não temos disposição para orações superficiais.\n\n      Quando a vida é um mar de rosas, podemos passar o tempo adquirindo conhecimentos sobre\nJesus, imitando-o, citando-o e falando sobre ele. Mas é somente ao sofrer que conheceremos Jesus.\n      No sofrimento, aprendemos coisas a respeito de Deus que não podemos aprender de nenhuma\noutra forma.\n      Deus podia ter mantido José fora da cadeia, Daniel fora da cova dos leões, evitado que Jeremias\nfosse lançado em um poço de lama, impedido os três naufrágios de Paulo, evitado que os três jovens\nhebreus fossem jogados na fornalha em chamas — mas não o fez.\n      Ele deixou que esses problemas ocorressem, e, em decorrência deles, cada um desses homens foi\ntrazido para mais perto de Deus.\n      Os problemas nos forçam a olhar para Deus e a depender dele em vez de confiar em nós mesmos.\n      Paulo testificou desse benefício: Sentimos que estávamos condenados à morte e percebemos\ncomo éramos fracos demais para socorrermos a nós mesmos; isso, porém, foi bom, porque assim nós\ncolocamos tudo nas mãos de Deus, o único que poderia salvar-nos, pois é capaz até de levantar os\nmortos.\n      Independentemente da causa, nenhum de seus problemas poderia acontecer sem a permissão de\nDeus.\n      Tudo o que ocorre a um filho de Deus é filtrado por ele, e ele pretende usar tudo isso para o bem,\nmesmo que Satanás e outros planejem usar para o mal.\n\n                                                                                     Igreja de Vencedores\n\n     Uma vez que Deus está soberanamente no controle, acidentes são apenas circunstâncias do plano\nde Deus para você.\n     Como todos os dias de sua vida foram escritos no calendário de Deus antes que você nascesse,\ntudo que acontece com você tem significado espiritual.\n\n      II. Não existem atalhos para chegar à maturidade.\n      Precisamos de vários anos para chegar à idade adulta, e é necessária toda uma estação para que\numa fruta cresça e amadureça.\n      O mesmo se dá com o fruto do Espírito. O desenvolvimento do caráter cristão não pode ser\napressado.\n      O crescimento espiritual, assim como o físico, requer tempo.\n      Por que demora tanto tempo?\n      Embora Deus possa transformar-nos instantaneamente, ele escolheu nos desenvolver\nvagarosamente.\n      Jesus é cauteloso no desenvolvimento de seus discípulos. Assim como Deus permitiu que os\nisraelitas se apoderassem da Terra Prometida aos poucos, para que eles não fossem sobrepujados, ele\nprefere trabalhar gradualmente em nossa vida.\n      Por que levamos tanto tempo para mudar e crescer?\n      Existem várias razões.\n      Aprendemos lentamente.\n      É comum termos de aprender uma lição quaren
