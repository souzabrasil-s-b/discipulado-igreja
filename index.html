<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Discipulado • Igreja de Vencedores</title>
<meta name="theme-color" content="#152140">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icon-192.png">
<style>
  :root{
    --navy-950:#0d1730;
    --navy-900:#152140;
    --navy-800:#1c2c52;
    --navy-700:#243766;
    --gold-500:#c9972c;
    --gold-400:#dbaf4f;
    --gold-300:#e8c778;
    --cream-100:#faf6ec;
    --cream-200:#f2ecda;
    --ink:#232012;
    --green-ok:#3f8a5a;
    --red-no:#b1473f;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    font-family: 'Iowan Old Style','Palatino Linotype',Georgia, serif;
    background: var(--cream-100);
    color: var(--ink);
    overscroll-behavior-y: contain;
  }
  .sans{ font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }

  #app{ max-width:560px; margin:0 auto; min-height:100vh; background:var(--cream-100); position:relative; padding-bottom: 40px;}

  /* ---------- HEADER ---------- */
  .topbar{
    background: linear-gradient(160deg, var(--navy-900), var(--navy-950) 70%);
    color: var(--cream-100);
    padding: 22px 20px 26px;
    position: sticky; top:0; z-index: 20;
    box-shadow: 0 6px 18px rgba(13,23,48,0.25);
  }
  .topbar .crumbs{
    font-family: 'Iowan Old Style', Georgia, serif;
    font-size: 12px; letter-spacing: 2px; text-transform: uppercase;
    color: var(--gold-300); opacity:0.9; margin-bottom:4px; cursor:pointer;
    display:flex; align-items:center; gap:6px;
  }
  .topbar h1{
    font-size: 26px; margin: 2px 0 2px; font-weight: 600; letter-spacing:0.2px;
  }
  .topbar .sub{ font-family: 'Segoe UI', sans-serif; font-size:13px; color:#c7cfe6; }

  .progress-wrap{ margin-top:16px; }
  .progress-row{ display:flex; justify-content:space-between; font-family: sans-serif; font-size:11.5px; color:#b9c2de; margin-bottom:6px; letter-spacing:0.3px;}
  .progress-track{ height:7px; border-radius:5px; background: rgba(255,255,255,0.12); overflow:hidden;}
  .progress-fill{ height:100%; background: linear-gradient(90deg, var(--gold-500), var(--gold-300)); border-radius:5px; transition: width .4s ease;}

  /* ---------- HOME ---------- */
  .continue-card{
    margin: 18px 18px 6px;
    background: linear-gradient(135deg, var(--navy-800), var(--navy-700));
    border-radius: 14px;
    padding: 16px 18px;
    color: var(--cream-100);
    display:flex; align-items:center; justify-content:space-between; gap:14px;
    cursor:pointer;
    box-shadow: 0 8px 20px rgba(20,30,60,0.18);
  }
  .continue-card .label{ font-family:sans-serif; font-size:11px; letter-spacing:1.5px; text-transform:uppercase; color: var(--gold-300); margin-bottom:4px;}
  .continue-card .title{ font-size:17px; font-weight:600; line-height:1.25;}
  .continue-card .arrow{ font-size: 22px; color: var(--gold-400); flex-shrink:0;}

  .phase{ margin: 26px 18px 6px; }
  .phase-head{ display:flex; align-items:baseline; gap:10px; margin-bottom:10px;}
  .phase-num{ font-family: sans-serif; font-size:11px; color: var(--gold-500); border:1px solid var(--gold-500); border-radius:20px; padding:2px 9px; letter-spacing:1px;}
  .phase-title{ font-size:19px; font-weight:600; color: var(--navy-900);}
  .phase-desc{ font-family:sans-serif; font-size:12.5px; color:#7a7462; margin: -4px 0 12px 0;}

  .lesson-card{
    background:#fff; border-radius:12px; padding:13px 14px; margin-bottom:9px;
    display:flex; align-items:center; gap:12px;
    border:1px solid #ece4cf; cursor:pointer;
    transition: transform .12s ease, box-shadow .12s ease;
  }
  .lesson-card:active{ transform: scale(0.98); }
  .lesson-card.done{ border-color: #d8e6da; background:#fbfdfb; }
  .lesson-num{
    width:34px; height:34px; border-radius:50%; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    font-family:sans-serif; font-weight:700; font-size:13px;
    background: var(--cream-200); color: var(--navy-800);
  }
  .lesson-card.done .lesson-num{ background: var(--green-ok); color:#fff; }
  .lesson-info{ flex:1; min-width:0; }
  .lesson-title{ font-size:14.5px; font-weight:600; color:var(--ink); line-height:1.3;}
  .lesson-meta{ font-family:sans-serif; font-size:11px; color:#9a9482; margin-top:3px; display:flex; gap:8px; align-items:center;}
  .quiz-badge{ font-family:sans-serif; font-size:10.5px; padding:2px 7px; border-radius:20px; background:#f1ead7; color:#8a6d1f; font-weight:600;}
  .quiz-badge.good{ background:#e2f1e5; color:#2e6a45;}
  .chev{ color:#c9c2ac; font-size:18px; flex-shrink:0;}

  /* ---------- LESSON VIEW ---------- */
  .lesson-header{ padding: 18px 20px 4px; }
  .lesson-eyebrow{ font-family:sans-serif; font-size:11.5px; letter-spacing:1.5px; text-transform:uppercase; color:var(--gold-300);}
  .lesson-header h2{ font-size:23px; margin: 4px 0 0; line-height:1.25;}

  .verse-card{
    margin: 16px 18px; padding:16px 18px; border-radius:12px;
    background: var(--navy-900); color: var(--cream-100);
    border-left: 4px solid var(--gold-500);
  }
  .verse-text{ font-size:15.5px; line-height:1.55; font-style:italic;}
  .verse-ref{ font-family:sans-serif; font-size:11.5px; color:var(--gold-300); margin-top:8px; letter-spacing:0.4px;}

  .lesson-content{ padding: 4px 22px 20px; font-size:15.5px; line-height:1.7; color:#2b2717;}
  .lesson-content p{ margin: 0 0 14px; }
  .lesson-content .head{ font-weight:700; color:var(--navy-800); margin: 22px 0 8px; font-size:15.5px; letter-spacing:0.2px;}

  .action-bar{
    position:sticky; bottom:0; background:var(--cream-100);
    border-top:1px solid #e8e0c9; padding:12px 18px 16px;
    display:flex; gap:10px;
  }
  .btn{
    font-family:sans-serif; font-weight:600; font-size:14px;
    border:none; border-radius:10px; padding:13px 16px; cursor:pointer;
    flex:1; text-align:center;
  }
  .btn-primary{ background: var(--gold-500); color:#fff; }
  .btn-primary:active{ background: var(--gold-400); }
  .btn-outline{ background:#fff; border:1.5px solid var(--navy-800); color:var(--navy-800); }
  .btn-outline.on{ background: var(--green-ok); border-color:var(--green-ok); color:#fff;}

  .backbtn{ background:none; border:none; color:var(--cream-100); font-family:sans-serif; font-size:14px; cursor:pointer; padding:0; display:flex; align-items:center; gap:5px;}

  /* ---------- QUIZ ---------- */
  .quiz-progress{ font-family:sans-serif; font-size:12px; color:#9a9482; padding: 16px 20px 0; }
  .quiz-q{ padding: 8px 20px 4px; font-size:17px; font-weight:600; line-height:1.4; color:var(--navy-900);}
  .quiz-opts{ padding: 14px 18px; display:flex; flex-direction:column; gap:10px;}
  .quiz-opt{
    font-family:sans-serif; text-align:left; font-size:14.5px; line-height:1.4;
    background:#fff; border:1.5px solid #e2dac2; border-radius:10px; padding:13px 14px;
    cursor:pointer;
  }
  .quiz-opt.correct{ background:#e5f4e9; border-color:var(--green-ok); color:#265b3c; font-weight:600;}
  .quiz-opt.wrong{ background:#fbeae8; border-color:var(--red-no); color:#7a2e28; font-weight:600;}
  .quiz-opt.disabled{ pointer-events:none; opacity:0.55;}
  .quiz-opt.disabled.correct, .quiz-opt.disabled.wrong{ opacity:1;}

  .quiz-result{ padding: 40px 24px; text-align:center;}
  .quiz-result .score{ font-size:52px; font-weight:700; color:var(--navy-900); margin-bottom:6px;}
  .quiz-result .msg{ font-family:sans-serif; font-size:15px; color:#6b654f; margin-bottom:30px;}

  .empty-note{ font-family:sans-serif; font-size:12.5px; color:#9a9482; text-align:center; padding: 30px 20px;}

  .search-wrap{ padding: 0 18px 6px; }
  .search-box{
    width:100%; font-family:sans-serif; font-size:14px; padding:11px 14px;
    border-radius:10px; border:1px solid #e2dac2; background:#fff;
  }
  ::selection{ background: var(--gold-300); }
  a{ color: inherit; }

  /* ---------- REGISTER ---------- */
  .register-screen{
    min-height:100vh; display:flex; flex-direction:column; justify-content:center;
    background: linear-gradient(160deg, var(--navy-900), var(--navy-950) 70%);
    color: var(--cream-100); padding: 30px 28px;
  }
  .register-screen .cross{ font-size:34px; color:var(--gold-400); text-align:center; margin-bottom:10px;}
  .register-screen h1{ text-align:center; font-size:26px; margin:0 0 4px;}
  .register-screen .sub{ text-align:center; font-family:sans-serif; font-size:13px; color:#b9c2de; margin-bottom:34px;}
  .register-screen label{ font-family:sans-serif; font-size:12px; color:var(--gold-300); letter-spacing:0.5px; display:block; margin-bottom:6px;}
  .register-screen input{
    width:100%; font-family:sans-serif; font-size:15px; padding:13px 14px; margin-bottom:18px;
    border-radius:10px; border:none; background: rgba(255,255,255,0.08); color:#fff;
  }
  .register-screen input::placeholder{ color:#8b93b0; }
  .register-screen .btn-primary{ width:100%; padding:15px; font-size:15px; margin-top:6px;}
  .register-error{ font-family:sans-serif; color:#f3a79f; font-size:12.5px; margin: -10px 0 14px;}
  .regImageBtn{
    display:block; margin: 10px auto 0; width:150px; cursor:pointer;
    border-radius:12px; box-shadow: 0 10px 26px rgba(0,0,0,0.35);
    transition: transform .12s ease;
  }
  .regImageBtn:active{ transform: scale(0.96); }
  .regImageLabel{ text-align:center; font-family:sans-serif; font-size:12px; color:var(--gold-300); letter-spacing:1px; text-transform:uppercase; margin-top:12px;}

  /* ---------- ADMIN / WHATSAPP ---------- */
  .wa-card{
    margin: 18px; background:#25382f; color:#eafbf0; border-radius:14px; padding:16px 18px;
    display:flex; align-items:center; justify-content:space-between; gap:12px; text-decoration:none;
  }
  .wa-card .t{ font-family:sans-serif; font-weight:600; font-size:14.5px;}
  .wa-card .s{ font-family:sans-serif; font-size:11.5px; color:#a9d6ba;}
  .admin-trigger{
    display:flex; align-items:center; justify-content:center;
    width:34px; height:34px; margin: 26px auto 18px; border-radius:50%;
    color:#d8d2bd; font-size:14px; opacity:0.55; cursor:pointer;
    -webkit-user-select:none; user-select:none;
  }
  .admin-trigger:active{ opacity:0.9; }
  .admin-panel-link{ margin:0 18px 18px; }
  .stat-row{ display:flex; gap:10px; padding: 4px 18px 4px; }
  .stat-card{ flex:1; background:#fff; border:1px solid #ece4cf; border-radius:12px; padding:14px 10px; text-align:center;}
  .stat-card .n{ font-size:24px; font-weight:700; color:var(--navy-900);}
  .stat-card .l{ font-family:sans-serif; font-size:10.5px; color:#8a8468; letter-spacing:0.3px; margin-top:2px;}
  .user-row{ background:#fff; border:1px solid #ece4cf; border-radius:12px; margin:0 18px 9px; padding:13px 14px; cursor:pointer;}
  .user-row .top{ display:flex; justify-content:space-between; align-items:center; font-family:sans-serif;}
  .user-row .name{ font-weight:600; font-size:14px; color:var(--ink);}
  .user-row .meta{ font-size:11px; color:#9a9482; margin-top:2px;}
  .user-row .dot{ width:8px; height:8px; border-radius:50%; background:#c9c2ac; display:inline-block; margin-right:6px;}
  .user-row .dot.online{ background: var(--green-ok); }
  .user-access-list{ font-family:sans-serif; font-size:12px; color:#5c5744; margin-top:10px; border-top:1px dashed #e2dac2; padding-top:10px; max-height:220px; overflow-y:auto;}
  .user-access-list div{ padding:3px 0;}
  .admin-wa-edit{ margin:18px; background:#fff; border:1px solid #ece4cf; border-radius:12px; padding:16px;}
  .admin-wa-edit label{ font-family:sans-serif; font-size:12px; color:#8a8468; display:block; margin-bottom:6px;}
  .admin-wa-edit input{ width:100%; font-family:sans-serif; font-size:14px; padding:11px 12px; border-radius:8px; border:1px solid #e2dac2; margin-bottom:10px;}
  .admin-wa-edit .row{ display:flex; gap:8px;}
  .section-title{ font-family:sans-serif; font-weight:700; font-size:12px; letter-spacing:1px; text-transform:uppercase; color:#8a8468; margin: 22px 18px 10px;}
</style>
</head>

<script>
const LESSONS = [{"num": 1, "title": "CONHECENDO A BÍBLIA", "verseRef": "Salmos 119.105", "content": "TEXTO BÍBLICO\n\n      \"Lâmpada para os meus pés é a tua palavra e, luz para o meu caminho\" (Salmos 119.105).\n\nCOMENTÁRIO\n\nINTRODUÇÃO\n\n      Você já deve ter em suas mãos a Bíblia sagrada. Não é um escrito qualquer, pois é o livro dos\nlivros. É diferente, porque só nele você encontra tudo o que Deus fez para dar a salvação e a vida\neterna às pessoas. Através dele, você sabe qual é a vontade de Jesus para a sua vida, agora que tomou a\ndecisão de não somente tê-lo como Salvador, mas também, como o seu Senhor: Por isso, A Bíblia é\nchamada de a Palavra de Deus.\n\nI. A BÍBLIA EM SUAS MÃOS\n\n      Dê uma olhada rápida neste livro que está em suas mãos. Provavelmente, veio à sua mente a\npergunta: o que é a Bíblia? Para você descobrir a resposta, primeiro, tem de entender que este vocábulo\nquer dizer \"livros\". Isto é, vários livros juntos em um só. Há uma página em sua Bíblia, logo nas\nprimeiras folhas, onde estão escritos os nomes de todos os livros que a formam. Procure-a e dê uma\nlida neles. Não se preocupe, se alguns deles forem estranhos e difíceis para se ler pela primeira vez.\n\n      Bem cedo, em sua vida cristã, você concluirá que não se pode ser cristão sem a Palavra de Deus.\nPor isso, os autênticos cristãos carregam, lêem e estudam a Bíblia.\n\n    A Bíblia é a palavra de Deus, porque, através dela, o Senhor se dá a conhecer aos homens. Isso se\nchama revelação divina.\n\n     Deus fala conosco através da Bíblia. Lendo-a, você começa a conhecer o Senhor, a entendê-lo e a\nobedecer às orientações dele para a sua vida particular e participação na igreja da qual você faz parte.\n\n     A revelação de Deus, a qual se encontra a Bíblia, foi escrita por cerca de 40 pessoas, em dois\nidiomas, o hebraico e o grego, bem diferentes do português.\n\n      Isto aconteceu há muitos anos. Uns eram profetas, outros reis, sacerdotes, pescadores, criadores\nde gado e até cobrador de impostos. Deus escolheu estas pessoas e as usou, apesar de suas\nimperfeições e seus diferentes conhecimentos da vida humana. Este é o lado maravilhoso da Bíblia.\nApesar dos livros serem escritos por pessoas diferentes, em épocas bem distantes, e depois unidos num\nlivro só, a Bíblia é completa e perfeita em unidade e harmonia.\n\n     Deus inspirou estas pessoas para escreverem a Bíblia, capacitando-as a receber e transmitir o\nensino sem mistura ou erro. A inspiração divina é também a garantia de que as pessoas escolhidas\n\nescreveram apenas o que Deus queria, sem os sinais das fraquezas e dos erros, próprios da natureza\nhumana. Leia a seguir o que disse Paulo, um dos escritores da Bíblia. Ele falou: \"Toda a escritura é\ndivinamente inspirada...\" (2 Timóteo 3.16a).\n\nII. COMO USAR A BÍBLIA NA IGREJA\n\n    A primeira parte da Bíblia, a qual começa com o livro de Gênesis e termina com o de Malaquias,\nchama-se Antigo Testamento ou simplesmente AT. São, ao todo, 39 livros.\n\n     Depois de Malaquias, o ultimo livro do Antigo Testamento, inicia-se o Novo Testamento,\nconhecido pelas letras iniciais NT e tem 27 livros.\n\n      Você aprendeu que as duas divisões da Bíblia são o Antigo e o Novo Testamento. Juntos, somam\n66 livros. Um detalhe interessante, no entanto, é saber que os 66 livros não estão arrumados pela ordem\nde data em que foram escritos. A preocupação de Deus não foi contar uma história, mas, sim, revelar o\nseu plano para salvar todos os homens.\n\n      Para que o cristão encontre facilmente um texto, cada livro da Bíblia é dividido em capítulos e\nversículos. O numero em tamanho grande, no lado esquerdo das palavras impressas, indica o capítulo,\ne o menor, o versículo. Encontre em sua Bíblia João 3.16. O número 3 é o capítulo e o 16 é o versículo.\n\n     Antes do inicio de cada capítulo, ou de alguns grupos de versículos, você encontra o titulo do\nassunto. É bom você saber que os escritores da Bíblia não escreveram os seus livros, separando os\nassuntos por títulos, capítulos, versículos, e nem usavam a pontuação, como o ponto e vírgula (;) e o\nponto final (.). Todos estes recursos foram adotados muitos anos depois, para facilitar a leitura e o\nestudo da Bíblia.\n\n      As Bíblias que estão nas mãos dos cristãos, para leitura e estudo, são escritas em diversas versões.\nAs versões são resultantes de atualizações de uma tradução. A tradução significa passar tudo que foi\nescrito em um idioma para o outro; no caso da Bíblia, passou-se tudo que estava escrito em hebraico e\ngrego para o português. A tradução principal, utilizada no Brasil, é a de João Ferreira de Almeida.\nDesta tradução, existem as versões que apresentam diferenças, não na mensagem, mas nas palavras.\nVeja um exemplo: numa versão, você tem, em 1 Coríntios 13, \"caridade\" e em outra, publicada mais\nrecentemente, \"amor\". A questão é que, com o passar do tempo, o vocábulo \"caridade\" tomou outro\nsentido, e não é tão forte como o termo \"amor\". Por causa das diferentes versões, você escuta as\npessoas lerem o mesmo versículo de maneira diferente, quando fazem isso juntas em voz alta na igreja.\n\n     Será interessante você logo usar uma versão escrita no português mais recente.\n\n     Você deve levar consigo a Bíblia para os cultos e sempre que alguém for fazer uma leitura de um\nou mais versículos, procure-os e acompanhe silenciosamente quem está lendo. Logo, você aprenderá a\nencontrar com facilidade e rapidez os livros, capítulos e versículos anunciados nos cultos.\n\n      Você é capaz de encontrar, em sua Bíblia, Sl 23. 1-6? Pare um pouco a leitura desta lição e leia\neste texto.\n\n                                                                                      Igreja de Vencedores\n\nIII. COMO USAR A BÍBLIA NO DIA-A-DIA\n\n      Você não deve usar a Bíblia só quando for aos cultos promovidos por sua igreja. Se limitar o uso\ndela somente a estes momentos, o seu crescimento espiritual acontecerá lentamente. O desejo de Deus\né que você seja um adulto espiritual e não uma criança. Leia 1 Coríntios 13.11; 14.20 e Efésios 4.15.\n\n      1. A leitura. É claro que você também deseja crescer espiritualmente, através da Bíblia. Para que\nisso aconteça, o primeiro passo a ser dado é ler a Bíblia.\nConscientize-se de que precisa ler a Bíblia. Todo o dia, você tem de comer algum alimento, para não\nmorrer de fome. Assim também precisa se alimentar da Palavra de Deus. Ninguém permanecerá vivo\nespiritualmente, se não se alimentar lendo a Bíblia Sagrada. Veja Jeremias 15.16 e Mateus 4.4.\n      Manuseie a Bíblia todos os dias. Não basta lê-la uma vez ou outra, ou só aqueles textos soltos\nmais conhecidos, como Salmos 23 e 91, João 3.16 e 1 Coríntios 13. A Bíblia não se resume neles; se\nvocê não a examinar diariamente, só vai saber os textos mais falados entre os cristãos e jamais provará\nalimentos mais saborosos!\n      Além de ler diariamente, você deve tomar a decisão de estudar a Bíblia toda. Já falamos que é na\nBíblia onde Deus se revela ao homem. Mas a revelação não esta completa em um livro só; você\nconhece um pouco em Gênesis, em outra passagem, e assim vai até o ultimo livro da Bíblia, o\nApocalipse, que significa revelação.\n\n      2. A memorização de versículos. O segundo passo que você deve dar, para crescer\nespiritualmente, é memorizar os textos bíblicos.\n\n      Quando você memoriza os textos da Bíblia, está guardando, escondendo e fazendo habitar em si a\nPalavra de Deus. O que está escrito na Bíblia, definitivamente, não foi para ficar só registrado em um\nlivro. A leitura apenas lhe dá condições de se lembrar de 15% do que leu, depois de 24 horas. Mas a\nmemorização lhe permite lembrar 100%.\n\n      3. O estudo. Outro passo que você deve dar, para crescer espiritualmente, é estudar a Palavra de\nDeus. Estudar é mais do que ler cuidadosamente. Ler é mais rápido do que estudar, mas estudar ajuda a\npensar e a lembrar.\n      Devem acompanhar você no estudo da Bíblia os seguintes materiais:\n      a) A Bíblia. Se possível, use várias versões existentes em português, para consulta comparativa;\n      b) Uma concordância Bíblica. Ajuda a localizar palavras, assuntos e suas referencias bíblicas,\nlivro por livro da Bíblia;\n      c) Chave Bíblica. Trazem esboços dos livros da Bíblia e também introdução, autores, histórias e\ndatas;\n      d) Dicionário Bíblico. Para a explicação de palavras e assuntos bíblicos;\n      e) Dicionário de português. Para saber o significado das palavras pouco conhecidas por você;\n      f) Manual de Temas Bíblicos. Traz assuntos para estudos mais aprofundados;\n      g) Um caderno. Para anotações das observações, correlações, interpretações e aplicações do seu\nestudo.\n      4. O momento de meditação. O ultimo passo que lhe ajudará a crescer espiritualmente, é ter um\nmomento de meditação na Palavra de Deus. Leia Salmos 1.1-3 e medite:\n\n\"Bem aventurado o varão que não anda segundo o conselho dos ímpios, nem se detém no\ncaminho dos pecadores, nem se assenta na roda dos escarnecedores. Antes tem o seu prazer na lei do\nSenhor e na sua lei medita de dia e noite. Pois será como a árvore plantada junto a ribeiros de águas, a\nqual dá o seu fruto na estação própria, e cujas folhas não caem, e tudo quanto fizer prosperará\".\n     É preciso que você se dedique a meditação diariamente. Selecione um momento especifico,\nescolha uma hora diária a sós com Deus. É bom que tenha um plano de estudo que se constitua de\npassos bem simples.\n\nDISCIPULADO\n\n      1. Abra a sua Bíblia na pagina do \"índice dos livros da Bíblia\" e leia o nome de cada um deles em\nvoz alta, pelo menos duas vezes, para começar a memorizar;\n      2. Pegue uma folha de papel e tente escrever o nome de cada livro, sem consultar a lista\nmencionada anteriormente. Faça isto, quantas vezes você achar necessário;\n      3. Mencione um por um, de memória, e em voz alta. Isto é, aparentemente, difícil, mas lhe será\nmuito útil para o desenvolvimento do seu conhecimento bíblico e o relacionamento com os cristãos da\nsua igreja, os quais já usam a Bíblia há mais tempo do que você;\n      4. Diariamente, estude um pouco a Bíblia. A quantidade de texto, o tempo gasto com a leitura e\nquantas vezes você vai lê-la toda, depende exclusivamente de você;\n      5. O ideal é que você leia a Bíblia toda, pelo menos uma vez por ano. Se ainda não o fez, comece\npelo Novo Testamento.\n\n                                                                                    Igreja de Vencedores\n\nVERIFIQUE O QUE VOCÊ APRENDEU\n\n1. Mencione, pelo menos, três títulos dado a Bíblia?\n_____________________________________________________________________________\n\n2. Em quais idiomas a Bíblia foi escrita?\n_____________________________________________________________________________\n\n3. O que significa o vocábulo Bíblia?\n_____________________________________________________________________________\n\n4. Qual o nome do mais conhecido tradutor da Bíblia para o português?\n_____________________________________________________________________________\n\n5. Quantos escritores, ao todo, escreveram a Bíblia?\n_____________________________________________________________________________", "quiz": [{"q": "Qual é o texto bíblico-base da lição \"CONHECENDO A BÍBLIA\"?", "options": ["Mateus 6:9-15; Lucas 11:1-4; II Crônicas 7:14", "Efésios 5.18", "Salmos 119.105", "Mt18.19-20"], "answer": 2}, {"q": "Qual destes é um dos tópicos estudados na lição \"CONHECENDO A BÍBLIA\"?", "options": ["Como Usar A Bíblia Na Igreja", "Conhecendo Deus, Através Dos Aspectos Do Seu Caráter", "Defina Ações Dos Demônios", "O Sucessor: Joseph Franklin Rutherford"], "answer": 0}, {"q": "Qual destes tópicos NÃO faz parte da lição \"CONHECENDO A BÍBLIA\"?", "options": ["Utilize Músicas Que Enfatizem A Presença E O Batismo No Espírito Santo", "A Bíblia Em Suas Mãos", "Como Usar A Bíblia No Dia-A-Dia", "Como Usar A Bíblia Na Igreja"], "answer": 0}]}, {"num": 2, "title": "CONHECENDO DEUS", "verseRef": "Tiago 4.8a", "content": "TEXTO BÍBLICO\n\"Chegai-vos a Deus, e Ele se chegará a vós\" (Tiago 4.8a)\nCOMENTÁRIO\nINTRODUÇÃO\n\n      Conforme está escrito em Efésios 2.12, no tempo em que você não era cristão, vivia sem Deus no\nmundo. Por isso, todo novo cristão deve, imediatamente, após aceitar a Cristo como Salvador de sua\nvida, começar a conhecer o seu Senhor: É sempre nesta ordem: primeiro, vem o ato de fé, depois, a\nbusca do conhecimento de Deus. Do ponto de vista humano, você teria de conhecê-lo bem antes, para\ndepois crer nEle. Mas, no caso do cristão, é diferente, ele nasce e vive espiritualmente pela fé em Deus.\nOs seus conhecimentos deverão se submeter à fé. Nunca ao contrário.\n      Deus deseja que você agora entregue a Ele todas as áreas de sua vida e confie plenamente nEle.\nIsso só é possível, se conhecê-lo bem. Então, tenha o desejo de obter o conhecimento divino.\n      Para entender o mundo em que vive, ter senso de direção e edificar-se interiormente e saber qual\na sua missão nesta vida, você tem de conhecer Deus. Você talvez tenha várias ideias a respeito do\nSenhor, mas elas devem corresponder àquilo que é dito sobre o Criador. E mais, a compreensão que o\ncristão pode ter sobre quem é o Todo-Poderoso, é consequência da revelação que o Onipotente deu a si\nmesmo. Você já estudou, na lição anterior, que a revelação de Deus se deu através da Bíblia. Uma\nmanifestação com linguagem compreensível a todas as pessoas. Mas já mais alguém teve a\ncompreensão total do Onipotente, pois o que se pode conhecer de Deus está além da capacidade\nhumana.\n      Esta lição se propõe a lhe ajudar nesta aprendizagem, a qual deve durar por toda a sua vida.\n\nI. CONHECENDO DEUS, ATRAVÉS DE SUAS QUALIDADES\n\n    Deus tem muitas qualidades, através das quais ele se identifica com os homens, e, ao mesmo\ntempo, torna-se diferente de todos os seres espirituais.\n     Você descobre quais são as qualidades de Deus, ao conhecer os seus nomes.\n     Deus mesmo se revela, faz-se conhecer, ao proclamar o seu nome (leia Êxodo 6.2 e 3). O Senhor\nqueria ser reconhecido pelo povo de Israel, através de seus feitos.\n      Por que conhecer o Senhor pelo nome? No caso de Deus, é muito mais do que o conjunto de\nletras do português ou de qualquer outro idioma. É o nome que revela aos homens as qualidades do\nCriador. Além disso, é uma maneira de se responder quem é o Todo-Poderoso.\n\n      O seu nome deve ser invocado na adoração (leia Gênesis 12.8);\n      O seu nome deve ser temido (leia Deuteronômio 28.58);\n      O seu nome deve ser louvado (leia 2 Samuel 22.50);\n      O seu nome deve ser glorificado (leia Salmo 86.9);\n      O seu nome não pode ser tomado em vão (leia Êxodo 20.7);\n\n                                                                                     Igreja de Vencedores\n\n      O seu nome não pode ser profanado, nem blasfemado (leia Levítico 18.21; 24.16);\n      O seu nome deve ser santificado e bendito (leia Mateus 6.9);\n     Na Bíblia, os nomes de Deus mais comuns são:\n     Deus – Quando você o encontra no texto bíblico, ele fala do seu poder criativo e total.\n     Senhor ou Jeová – É Deus relacionado com as pessoas, para ajudá-las e salva-las.\n     O vocábulo Deus, com outras combinações, como \"altíssimo\", \"suficiente\", \"eterno\", e\n\"conosco\", revela as qualidades do Senhor e mostra a sua maneira de agir entre as pessoas.\n     Senhor – no sentido de governador e dominador, é aquele que exige o serviço e a lealdade do seu\npovo.\n     Pai – mostra que todas as coisas e o ser humano foram criados por Ele e estão debaixo de\nproteção.\n\nII. CONHECENDO DEUS, ATRAVÉS DOS ASPECTOS DO SEU CARÁTER\n      Você também conhece Deus, ao estudar o que Ele é em si próprio, e em relação ao universo e aos\nseres por Ele criados. Tudo isso é chamado de atributos divinos, ou seja, aspectos do seu caráter.\n     Existem os aspectos que só Deus possui e nada há que os lembre nos homens ou nos outros seres\npor Ele criados.\n     O primeiro deles é a Soberania. Significa que Deus é o chefe, maioral ou supremo. No universo\nem que está a terra, só há um dirigente: o Todo-Poderoso. Para você, isto é encorajador, porque tem a\nsegurança de que nada esta fora do controle do Senhor, e os seus planos são, de fato, realizados. Leia\nSalmos 103.19.\n      O segundo aspecto é a Eternidade. Nunca houve um tempo em que Deus não existisse. Ele não\nteve principio e jamais terá fim. Não se limita ao tempo. Porque é eterno, vê o passado e o futuro de\nmodo tão claro como contempla o presente. Nesta perspectiva, Ele sabe o que é melhor para a vida do\ncristão. Você pode confiar nEle. Leia Isaías 44.6.\n     A Onisciência é o terceiro aspecto divino. Deus possui todo o conhecimento que existe. Nada o\npega de surpresa. A Onisciência do Senhor permite que Ele tenha conhecimento de tudo antes e depois\nda salvação de cada ser humano. Ele perdoa os pecados do homem e o aceita em sua família. Leia\nHebreus 4.13.\n     O quarto aspecto divino é a Onipresença. Significa que Deus é infinito e esta presente em todo\ntempo e espaço. Ninguém pode se esconder de sua face. Mas a presença do Senhor deve ser\nexperimentada em todo o tempo, para se receber as suas bênçãos de uma maneira bem real. Leia\nJeremias 23.24. Deus tem mais do que o poder necessário para realizar todas as coisas. Isto que dizer\nque Ele é Onipotente, o seu quinto aspecto divino. O cristão tem certeza de sua salvação, porque o\nSenhor é Todo-Poderoso. Esta força se manifesta no Evangelho de Cristo, para a salvação dos homens.\nVeja o que diz a Bíblia em Romanos 1.16: \"Porque não me envergonho do evangelho de Cristo, pois é\no poder de Deus para salvação de todo aquele que crê\".\n\nDeus mostra a sua Onipotência, através do seu poder de criar. \"No principio criou Deus os céus e\na terra\" (Gênesis 1.1).\n    O Criador preserva todas as coisas, cuida e manifesta a sua providência para o cristão, pela sua\nOnipotência. Leia Hebreus 1.3 e Filipenses 3.20-21.\n     O sexto aspecto divino diz que Ele é imutável. Jamais muda em sua natureza e aspectos. Será\nsempre bom, justo e verdadeiro. Você pode crer nas suas promessas, porque Ele cumpre todas. Nele,\npodemos confiar. \"Deus não é homem, para que minta; nem filho do homem, para que se arrependa:\nporventura diria ele, e não o faria? Ou falaria, e não o confirmaria?\" (Números 23.19).\n     Existem, também, os aspectos vistos no relacionamento de Deus com o homem. Eles se\nmanifestam de forma limitada nos outros seres criados.\n     O primeiro aspecto é a retidão. É impossível Deus fazer algo errado. Por causa da sua retidão, Ele\nexige perfeição em todos os que desejam estar em sua presença. Leia Mateus 5.48.\n     É um estilo de vida para ser vivido pela graça de Deus, pois é humanamente impossível ao\nhomem ter a perfeição total de Deus. O segundo aspecto é a justiça. Deus jamais age com\ndesonestidade. A justiça divina é manifestada no livramento do inocente, na condenação do pecador,\nno perdão para quem se arrepende, no castigo do ímpio, na salvação do homem e na vitória às causas\ndo seu povo. Leia 2 Timóteo 4.8.\n      O amor é outro aspecto divino. Na verdade, Deus é amor. Esta virtude do Senhor é perfeita e\ninfinita.\n     A maior demonstração de amor de Deus foi a de conceder o seu próprio filho para morrer em\nnosso lugar, através do seu sacrifício na cruz do Calvário.\n     O ultimo aspecto tratado nesta lição é a verdade. Deus é a verdade absoluta. O homem deseja\nardentemente encontrá-la. Porém, muitos a procuram em outras fontes. Como você já veio a Jesus, sua\nbusca terminou, pois Cristo é a verdade. Leia João 8.32.\nIII. CONHECENDO DEUS, JESUS E O ESPIRITO SANTO\n     O Pai, Jesus Cristo e o Espírito Santo existem em unidade e são Três pessoas reais e distintas,\nporém, conscientes uma da outra. Elas trabalham juntas em favor do ser humano.\n     Em João 15.16, a afirmação de Jesus: \"Mas, quando vier o Consolador, que eu da parte do Pai\nvos hei de enviar, aquele Espírito de verdade, que procede do Pai, ele testificará de mim\", significa que\na unidade entre o Pai, Jesus Cristo e o Espírito Santo de tal forma que os três são um só Deus. A\nunidade é resumida em 1 Coríntios 8.4: \"Não há outro Deus, senão um só\".\n     O Pai, Jesus Cristo e o Espírito Santo existem em um só Deus. Leia Mateus 3.16,17.\n     Entre o Pai, Jesus Cristo e o Espírito Santo há distinções, sem que isto signifique que eles\ndiscordem um do outro, deixem de cooperara entre si em favor dos homens. Eles são distintos, mas em\nunidade. Leia 1 Coríntios 13.13.\n\n                                                                                     Igreja de Vencedores\n\nDISCIPULADO\n     1. Tenha agora um momento de oração a Deus. Agradeça por tudo e peça para ajudá-lo, durante\n     toda a sua vida cristã, a temer, louvar, glorificar e bem dizer o seu nome poderoso.\n     2. Faça uma reflexão por alguns minutos e descubra em quais áreas de sua vida Deus precisa ser\n     soberano.\n     3. Pense, pelo menos, em três pessoas que ainda não passaram pelo Encontro com Deus, e fale a\n     elas sobre o grande amor de Jesus por elas.\n     4. Pare e pense sobre a sua vida na semana que passou. Descubra em que momento você praticou\n     a retidão, a justiça, o amor e a verdade. Tome a decisão de demonstrar estes aspectos divinos em\n     você na semana seguinte. Deus o ajude.\n     5. Assuma um compromisso com Deus de sempre procurar conhecê-lo melhor, através da sua\n     Palavra, em oração e em uma vida dedicada ao serviço do Senhor.\n\nVERIFIQUE O QUE VOCÊ APRENDEU\n1. Por que Deus pode ser conhecido pelos seus nomes?\n__________________________________________________________________________\n\n2. Quais são, na Bíblia, os nomes mais comuns de Deus?\n__________________________________________________________________________\n\n3. O que significa Onisciência?\n__________________________________________________________________________\n\n4. O que significa Onipresença?\n__________________________________________________________________________\n\n5. O que significa Onipotência?\n__________________________________________________________________________", "quiz": [{"q": "Qual é o texto bíblico-base da lição \"CONHECENDO DEUS\"?", "options": ["Tiago 4.8a", "Mateus 10:38; 16:24; Gálatas 2:20; 5:24; 6:14", "2 Tm 4.7", "1 Coríntios 9.16"], "answer": 0}, {"q": "Qual destes é um dos tópicos estudados na lição \"CONHECENDO DEUS\"?", "options": ["Conhecendo Deus, Jesus E O Espirito Santo", "A Necessidade Da Salvação", "A Doutrina Da Trindade E As Tjs", "O Que Você Não Pode Fazer Com O Dízimo:"], "answer": 0}, {"q": "Qual destes tópicos NÃO faz parte da lição \"CONHECENDO DEUS\"?", "options": ["Conhecendo Deus, Através De Suas Qualidades", "Conhecendo Deus, Através Dos Aspectos Do Seu Caráter", "Níveis De Entrega E Renúncia – A Unção Provendo Habilitação", "Conhecendo Deus, Jesus E O Espirito Santo"], "answer": 2}]}, {"num": 3, "title": "CONHECENDO A SALVAÇÃO", "verseRef": "Atos 4.12", "content": "TEXTO BÍBLICO\n\"E em nenhum outro a salvação, porque também debaixo do céu nenhum outro nome há, dado entre os\nhomens, pelo qual devamos ser salvos\" (Atos 4.12).\n\nCOMENTÁRIO\nINTRODUÇÃO\n     Você agora é salvo. A salvação é a maior benção que o ser humano pode receber e, ao mesmo\ntempo, a primeira experiência espiritual. A salvação é o tema principal da Bíblia. Todo cristão deve\nconhecê-la bem e falar dela aos que ainda não aceitaram a Cristo, para que também sejam salvos.\n\nI. O QUE É A SALVAÇÃO\n      A princípio, pode se afirmar que ela é o resultado da morte expiatória de Jesus Cristo, na Cruz do\nCalvário, que livra o homem da condenação eterna, causada pelo pecado. Leia Efésios 1.7; 2.1. A\nsalvação é:\n      1. Um ato soberano de Deus. A salvação é um ato da soberana vontade de Deus, que em seu\nfilho nos reconciliou consigo mesmo. 2 Coríntios 5.18,19 diz \"E tudo provém de Deus, que nos\nreconciliou consigo mesmo por Jesus Cristo, e nos deu o ministério da reconciliação; isto é, Deus\nestava em Cristo reconciliando consigo o mundo, não lhes imputando os seus pecados...\". Observe que\na salvação é demonstração do grande amor de Deus em favor da humanidade, condenada pelo pecado.\nLeia Romanos 3.10, 11, 23. Ela é oferecida a todos, sem exceção. Em Cristo, todos podem ser salvos,\nlibertos do pecado, tornando-se, assim, filhos de Deus. Leia João 1.12.\n      2. Um ato da infinita misericórdia de Deus.\n      Você aprendeu que a salvação é um ato soberano do Senhor, porque só Ele pode salvar. É,\ntambém, um ato da infinita misericórdia de Deus, porque é dada graciosamente, mediante a fé, e não\natravés dos nossos próprios méritos ou boas obras.\n      O próprio criador tomou a decisão de reconciliar consigo o homem, que, pela desobediência,\nhavia se afastado dele, tornando-se escravo do pecado e inimigo de quem o criara.\n      Você precisa saber, também, que a sua salvação custou um alto preço: o sangue de Jesus Cristo, o\nCordeiro de Deus (João 1.29), imolado pelos nossos pecados, na cruz do Calvário, conforme a profecia\nde Isaías 53.4-7; porém aos homens foi concedida graciosamente, segundo a misericórdia infinita de\nDeus. Jamais você pagaria tal resgate para a sua salvação, pois ela não depende de qualquer mérito\nhumano, nem de boas obras. Leia Efésios 2.8,9.\n\nII. A NECESSIDADE DA SALVAÇÃO\n      No tópico anterior, você aprendeu que, \"todos pecaram\" e o salário do pecado é a morte [leia\nRomanos 6.23]. Deste modo, todos necessitam da salvação. Todos precisam arrepender-se dos seus\npecados, confessá-los a Deus e abandoná-los definitivamente, aceitando o dom gratuito de Deus.\n      1. A origem do pecado. Como o pecado entrou no mundo, como isto aconteceu? Em Gênesis\n1.26,27, lemos que Deus criou o homem a sua imagem e semelhança e o colocou no Jardim do Éden,\n\n                                                                                    Igreja de Vencedores\n\npara o lavrar e o guardar. Disse-lhe que todo o fruto ele podia comer, porém, daquele da arvore do\nconhecimento do bem e do mal, o Senhor lhe proibiu que provasse, pois no dia em que o comesse,\ncertamente morreria. Tratava-se de uma prova de obediência, e Adão devia ser fiel ao Criador. Feito a\nimagem e semelhança de Deus, o homem possuía livre-arbítrio. Estava capacitado a discernir o bem e\no mal, o certo e o errado; não era um robô nas mãos do Todo-Poderoso. Obediência incondicional foi a\nexigência única imposta a criatura humana. Enquanto obedecesse, viveria. Todavia, apesar de usufruir\nas delícias do Éden e conviver em perfeita harmonia com o Criador, o homem, tentado, pecou e foi\ndestituído da glória com que fora criado, perdendo, assim, a comunhão com Deus. Como representante\nda raça humana, ele transmitiu a toda a sua descendência o estigma do pecado e a condenação da\nmorte. A desobediência de Adão afetou toda a criação, a qual geme e chora sob o peso da maldição\n(leia Romanos 8.22); nele todos pecaram, e por ele entrou a morte no mundo. A desobediência dele\noriginou o pecado e condenou à morte toda a sua geração.\n      2. A herança do pecado. Você aprendeu que a salvação é a obra redentora de Deus, por meio de\nseu filho Jesus Cristo, que livra o homem da condenação eterna. Noutras palavras: salvação é a vida\neterna em Cristo Jesus, visto que só Ele pode salvar o homem da condenação da morte eterna, causada\npelo pecado do próprio homem. Veja o que diz a Bíblia: \"Porque todos pecaram e destituídos estão da\nglória de Deus\" (Romanos 3.23). \"Pelo que, como por um homem entrou o pecado no mundo, e pelo\npecado a morte, assim também a morte passou a todos os homens; por isso, que todos pecaram\"\n(Romanos 5.12). Esta é uma revelação terrível! \"A morte passou a todos os homens...\" Deste modo, o\npecado foi a herança maldita deixada a todos os homens.\n      Como escapar desta condenação? Veja a importância da salvação: você estava morto em delitos e\npecados, conforme Efésios 2.1,5 e Colossenses 2.13; e nada podia fazer para escapar do juízo divino.\nPorém, Deus em seu filho o libertou da condenação da morte eterna. Leia João 5.24.\n      Você, agora, não precisa temer o juízo final, pois Jesus, mediante a sua morte na Cruz do\nCalvário, condenou o pecado e concedeu a vida eterna a todos quantos nEle crer. Leia Romanos 8.1.\nCristo anulou, por sua morte e ressurreição, os efeitos do pecado, que é a morte eterna. O alvo foi\natingido.\n      3. Os efeitos do pecado. O pecado afetou o homem nas esferas físicas, mental, moral e espiritual\n(leia Romanos 3.10-18). Os efeitos são todos negativos. Toda causa tem as suas consequências.\nConsidere os efeitos detalhadamente:\n      a) A auto justificação, tipificadas nas vestes de folha de figueira, ao perceber que tinham pecado\n[Gênesis 3.7];\n      b) O medo. Gênesis 3.8-10 registra pela primeira vez que a criatura, ao ouvir a voz do Criador,\nsentiu medo e escondeu-se;\n      c) A maldição sobre a terra e o trabalho, com pesados esforços físicos e dores, todos os dias de\nsua vida (Gênesis 3.17,18);\n      d) A morte. O homem retornaria ao pó da terra, do qual havia sido formado (Gênesis 3.19);\n      e) A expulsão do Éden, para que não comesse da arvore da vida e vivesse eternamente no pecado\n(Gênesis 3.22,23);\n      f) A violência e o homicídio, sendo Caim o primeiro assassino, pois matou seu irmão Abel\n(Gênesis 4.8). Desde então, a violência tem sido constante e a criminalidade aumenta cada vez mais;\n\ng) A corrupção geral do gênero humano. A maldade do homem se multiplicou por toda a terra\n(Gênesis 6.5, 11, 12). Não obstante o castigo de Deus, pelo dilúvio, o homem não deixou de praticar a\nmaldade;\n    h) Enfermidades. Isaías 1.6 fala do estado lastimável do pecador.\n\nIII. ASPECTOS DA SALVAÇÃO\n      São três os aspectos da salvação:\n      1. Justificação. \"Como se justificaria o homem para com Deus?\" (Jó 9.2). O homem, morto em\nseus delitos e pecados, não tinha como se justificar-se perante o Todo-Poderoso. Porém, mediante a\nmorte expiatória e substitutiva de Jesus, tornou possível a justificação do transgressor. Como é possível\nisto? Veja: justificação é um termo judicial que lembra um tribunal, onde Deus, o Supremo juiz,\nabsolve o pecador das suas transgressões e o declara justo, isto é, justificado. Desta forma, Deus, o\nofendido, reconcilia consigo mesmo o homem, o ofensor.\n      O que o homem não pôde fazer Deus o fez por ele. A justiça de Cristo, o justo, é concedida ao ser\nhumano, mediante a graça divina (Romanos 5.17-19).\n      2. Regeneração. Trata-se de uma mudança de condição: antes, no pecado, o homem era inimigo\nde Deus e servo do Diabo; agora, feito justo, pela justiça de Cristo que lhe foi concedida, ele se torna\nmembro da família divina, adotado como filho de Deus (João 1.12).\n      O homem, morto em seus delitos e pecados, nasce de novo. Este novo nascimento é efetuado pelo\nEspírito Santo em seu interior, mediante ao arrependimento e a fé na graça divina (leia João 3.3-8). O\ntermo ilustra uma cena em família, da qual o transgressor fora banido, tornando-se inimigo dela.\nMediante o seu arrependimento e o conseqüente perdão, ele é restaurado ao convívio familiar.\n      3. Santificação. Uma vez restaurado à comunhão com Deus, o homem abandona as práticas\npecaminosas do passado e separa-se (santifica-se) para o serviço do Senhor. A santificação é um ato do\nEspírito Santo, no interior do cristão, que se reflete nos seus atos exteriores (leia o que afirma a Bíblia\nem 2 Coríntios 5.17). Portanto, justificação, regeneração e santificação são os três aspectos simultâneos\nda salvação plena em Cristo Jesus.\n      Pode-se, então, afirma que os resultados da salvação resumem-se em:\n      a) Possuir uma fé viva em Cristo (Gálatas 2.20; 3.11);\n      b) Obter vitória sobre o mundo e o pecado ( 1 João 5.4,5);\n      c) Torna-se membro da família de Deus (Efésios 2.19).\n\n                                                                                       Igreja de Vencedores\n\nDISCIPULADO\n\n      Ao ascender ao céu, o Senhor Jesus ordenou aos seus discípulos que realizassem a obra que Ele\niniciara em seu ministério terreno. Desde então, todos os que aceitam a Cristo, como seu Senhor e\nSalvador, cumprem o \"ide\", a fim de ganhar as almas para o Reino de Deus (Mc 16.15).\n      1. Você, também, está incumbido desta tarefa gloriosa. Não importa se ainda não foi para o\nEncontro com Deus. Você é um discípulo de Jesus, e deve cumprir o que Ele ordenou.\n      2. Comece por evangelizar as pessoas com as quais você está mais relacionado, por exemplo:\nseus familiares, vizinhos, amigos, colegas de trabalho ou da escola, etc. todos carecem da salvação e\nprecisam de Jesus.\n      3. Peça a Deus que lhe ajude a ganhar o maior número possível de almas para Cristo. Lembre-se:\nvocê é uma nova criatura e pertence à família de Deus; convide outras pessoas a fazer parte dela\ntambém. Deus vai abençoar grandemente o seu trabalho evangelístico e sua célula irá crescer em nome\nde Jesus. Amém.\n\nVERIFIQUE O QUE VOCÊ APRENDEU\n\n1. Conforme Romanos 3.23, por que a salvação é necessária?\n\n______________________________________________________________________________\n\n2. Através de quem o pecado entrou no mundo?\n\n______________________________________________________________________________\n\n3. Qual a principal consequência do pecado?\n\n______________________________________________________________________________\n\n4. Quem pode salvar o homem da condenação eterna?\n\n______________________________________________________________________________\n\n5. Conforme Efésios 2.8,9, como se pode obter a salvação?\n\n______________________________________________________________________________", "quiz": [{"q": "Qual é o texto bíblico-base da lição \"CONHECENDO A SALVAÇÃO\"?", "options": ["1 Coríntios 9.16", "2 Tm 4.7", "Atos 4.12", "Atos 1.8"], "answer": 2}, {"q": "Qual destes é um dos tópicos estudados na lição \"CONHECENDO A SALVAÇÃO\"?", "options": ["As Brechas Espirituais Por Onde Entram As Maldições (Rm 3:13)", "Crescer É Quase Sempre Doloroso E Assustador", "Aspectos Da Salvação", "Encontro Com Jesus"], "answer": 2}, {"q": "Qual destes tópicos NÃO faz parte da lição \"CONHECENDO A SALVAÇÃO\"?", "options": ["Aspectos Da Salvação", "Veja-Se Em Cada Momento Da Gestação", "A Necessidade Da Salvação", "O Que É A Salvação"], "answer": 1}]}, {"num": 4, "title": "CONHECENDO A IGREJA DE VENCEDORES", "verseRef": "Efésios 2.19", "content": "INTRODUÇÃO\n     Para compreendermos apropriadamente o termo Igreja de Vencedores, precisamos verificar um\nconceito fundamental. Que um vencedor está sempre agradecido, mais nunca satisfeito.\n\n    Portanto o vencedor não se limita apenas na salvação, mas ele quer também conquistar as\npromessas de Deus. Ele quer a Cura, a Libertação, a Prosperidade e ser Cheio do Poder de Deus. O\nVencedor não se conforma com uma vida de mesmice ou ser mais um em meio à multidão.\n\n      Ele crê que a promessa foi feita para ele, e ele foi feito para a promessa. E é crendo nisto que Deus\nnestes dias está levantando uma igreja de vencedores, para impactar está geração, levando um evangelho\nde vitórias e conquistas pelo seu Poder.\n\n     Como membro da Igreja de Vencedores é importante que, em um primeiro momento, você se\nfamiliarize com o inicio deste ministério maravilhoso, que tem revolucionado a vida de muitos cristãos\nque não sabiam o que era viver o verdadeiro evangelho de Jesus Cristo e que tem resgatado príncipes\nvalorosos do Senhor que estavam perdidos por este mundo.\n\n     I. Os primeiros vencedores\n\n     A partir da primeira reunião pública conduzida pelos pastores Ermeson e Leiane Souza, nasceu a Igreja de Vencedores.\n\n      Neste momento enquanto você está estudando está lição, o Reino de Deus cresceu mais uma vez,\npois mais um vencedor surgiu. Você nasceu espiritualmente para ganhar seus familiares e seus amigos\npara Jesus. Você é uma pessoa Salva, liberta, curada, prospera e cheia do poder de Deus para impactar\nestá geração.\n\n     II. DECLARAÇÃO DE PROPÓSITO DA IGREJA DE VENCEDORES\n\n     Trazer pessoas a Jesus para serem membros de sua família, fazer com que amadureçam à\nsemelhança de Cristo, equipá-las para seu ministério na igreja e sua missão de vida no mundo, a fim\nde que exaltem o nome de Deus.\n\n     III. O que motiva a nossa igreja?\n\n     1. Devemos começar olhando para tudo o que a nossa igreja faz, através da ótica dos propósitos\ncolocados pelo Novo Testamento e ver como Deus deseja que ela seja equilibrada em todos eles.\n\n     Vejamos (At 2.42-47: 42). E perseveravam na doutrina dos apóstolos e na comunhão, no partir do\npão e nas orações. 43) Em cada alma havia temor; e muitos prodígios e sinais eram feitos por\n\n                                                                                      Igreja de Vencedores\n\nintermédio dos apóstolos. 44)Todos os que creram estavam juntos, e tinham tudo em comum. 45)\nVendiam as suas propriedades e bens, distribuindo o produto entre todos, à medida que alguém tinha\nnecessidade. 46) Diariamente perseveravam unânimes no templo, partiam pão de casa em casa, e\ntomavam as suas refeições com alegria e singeleza de coração, 47) louvando a Deus, e contando com a\nsimpatia de todo o povo. Enquanto isso, acrescentava-lhes o Senhor, dia a dia, os que iam sendo salvos\".\n\n     A partir do texto percebemos cinco propósitos para a igreja: Adoração; Comunhão;\nDiscipulado; Ministério e Missões. Igrejas fortes são construídas sobre um propósito. Enfocando\nigualmente todos os cinco propósitos, nossa igreja tem desenvolvido um equilíbrio sadio, que tem\nproduzido um crescimento duradouro. \"Muitos são os planos do coração do homem, mas é o propósito\ndo Senhor que permanecerá (Pv 19.21).\n\n         2. Os cinco grandes propósitos da igreja\n\n        Uma igreja com propósitos está comprometida com os cinco aspectos constantes no texto do\ngrande mandamento e da grande comissão:\n\n         a)Amar a Deus de todo coração:\n\n         Adoração\n\n         Adorar a Deus é o primeiro propósito da igreja! A igreja existe para adorar a Deus. Adorar\nvem antes de servir!\n\n          b)Amar ao próximo como a si mesmo:\n\n          Ministério\n\n           A igreja existe para ministrar ao povo. Ministério é demonstrar o amor de Deus aos outros.\nCada vez que tocamos alguém com amor estamos ministrando. A igreja deve ministrar a todos os tipos\nde necessidades: físicas, emocionais e espirituais! A igreja deve preparar os santos para a obra do\nministério (Ef 4.12).\n\n          c)Ir e fazer discípulos de Jesus:\n\n          Missões\n\n          A igreja existe para comunicar a Palavra de Deus. Nossa missão é evangelizar o mundo (2 Co\n5.20). A evangelização é tão importante que Jesus comissionou os discípulos em cinco ocasiões: Mt\n28.19-20; Mc 16.15; Lc 24.47-49; Jo 20.21; At 1.8.\n\n          d)Batizar os que foram feitos discípulos:\n\n          Comunhão\n\n           O batismo introduz na comunhão e identifica o novo convertido com o corpo de Cristo.\nComo cristãos somos membros de um corpo; somos chamados a participar. Batismo é a visualização da\nintegração no corpo de Cristo (Ed 2.19). [Lembremos que no início da igreja cristã o batismo acontecia\n\napós a confissão de fé] ou seja após a pessoa ter aceitado Jesus em sua vida (TER TIDO UM\nECONTRO COM DEUS).\n\n          e)Ensinar a obedecer:\n\n          Discipulado\n\n           A igreja existe para educar e edificar o povo de Deus. Em seu sentido literal Mt 28.19 que\nquer dizer: \"indo, batizando e ensinado\". Estes três aspectos são os elementos essenciais no processo de\nformar discípulos de Jesus. Ensino e obediência estão intimamente ligados (Ef 4.12-13; Cl 1.28).\n\n        2.3 Os circo do compromisso\n\n     Os círculos de Compromisso\n\n                                                                                    Igreja de Vencedores\n\n     O objetivo de nossa igreja é levar as pessoas do círculo externo (baixo-compromisso/ maturidade)\npara o círculo interno (alto compromisso/ maturidade). Esse processo é denominado \"levar as pessoas da\ncomunidade para o núcleo\".\n\n     A COMUNIDADE\n\n     A comunidade é o seu ponto de partida. É o conjunto de não-cristãos que vivem a certa distancia\nda igreja e não têm nenhum compromisso com Jesus Cristo ou alguma igreja. São os sem-igreja que\nvocê precisa alcançar. Sua comunidade é onde o propósito do evangelismo acontece. Esse círculo é\nmaior porque contém o maior número de pessoas.\n\n     Se você visitar quatro vezes nossa igreja e se identificar no cartão de confirmação ou no envelope\nde ofertas, seu nome irá para o banco de dados. Estes são nosso alvo evangelísticos mais prováveis.\n\n     A MULTIDÃO\n\n      O círculo seguinte, um pouco menor, representa o grupo de pessoas que chamamos \"multidão\", e\ninclui todos os que frequentam os cultos de domingo. São nossos frequentadores regulares. A multidão é\ncomposta de cristãos e não-cristãos. Todos têm em comum o compromisso de assistir regularmente ao\nnosso culto de celebração. Não é um grande compromisso, mas já é um bom começo. Quando alguém se\ntransfere da comunidade para a multidão, você alcançou um grande progresso com relação a essa\npessoa.\n\n      Mesmo que um não-cristão possa adorar de verdade, ele assiste à adoração dos cristão. Se o não-\ncristão se compromete a participar regulamente de nossos cultos, acredito que é apenas uma questão de\ntempo até ele aceitar Cristo. Depois que isso acontecer, nosso alvo é levá-la para o nível seguinte de\ncompromisso, a \"congregação\".\n\n     A CONGREGAÇÃO\n\n     A congregação é o grupo oficial de membros de nossa igreja. Eles foram batizados e assumiram o\ncompromisso de participar da família de nossa igreja \"a FAMÍLIA DE VENCEDORES\". Agora são\nmais que meros frequentadores: estão comprometidos com o propósito da comunhão. Esse é o\ncompromisso de suma importância. A vida cristã não é só questão de crenças; significa também\npertencer à família. Depois de assumir um compromisso com Cristo, é preciso haver encorajamento para\no passo seguinte: o envolvimento com o corpo de Cristo, a igreja. Em nossa comunidade, somente os\nque 1. receberam Cristo, 2. foram batizados, 3. participaram do curso de Membresia e 4. assinaram o\npacto de Membresia são considerados parte da congregação (Membresia).\n\n      Sempre tomamos providencia para que não haja membros inativos na congregação, o que resulta\nna exclusão de dezenas de nomes a cada ano. Não estamos interessados numa grande lista, e sim num\nrol verdadeiro, com pessoas genuinamente ativas e envolvidas.\n\nNESSE MOMENTO VOCÊ FARÁ O PACTO DE MEMBRESIA DA IGREJA DE\nVENCEDORES:\n\n   ATENÇÃO! ESSE É SEU PACTO DE MEMBRESIA\n\n                                                      Igreja de Vencedores\n\n     OS COMPROMETIDOS\n\n     Há em nossa igreja pessoas consagradas, que estão crescendo e levam a sério sua fé, mas que, por\nalguma razão, não estão servindo em algum ministério da igreja, nós chamamos essas pessoas de\n\"comprometidos\". Elas oram, são dizimista e ofertastes da casa do Senhor. Dedicam-se ao crescimento\npelo discipulado, mas ainda não se envolveram no ministério.\n\n     Em nossa igreja, consideramos parte desse grupo aqueles que fizeram ou estão fazendo os\nSeminários sobre Vida Cristã e Serviço da igreja de vencedores (As Classes), e assinaram o Cartão de\nCompromisso. O cartão indica um compromisso com três hábitos espirituais: ter um momento a sós com\nDeus diariamente, dar o dízimo e ser ativo em uma célula. Esses três hábitos são essenciais ao\ncrescimento espiritual.\n\n     O NÚCLEO\n\n    O núcleo é o menor grupo, por representar o nível de compromisso mais profundo. É formado por\numa minoria de trabalhadores e Servos dedicados ao Reino de Deus, comprometidos com o ministrar\n\naos outros. É o grupo que serve em vários ministérios de nossa igreja, Anfitrião de células e outros. Sem\neles, nossa igreja teria estagnado. Os trabalhadores do núcleo constituem o coração da igreja.\n\n     O que acontece quando uma pessoa chega ao núcleo? Nós o mandamos de volta à comunidade,\npara ministrar!\n\n     IV. SOMOS UMA IGREJA COM PROPÓSITOS\n\n      As células são a nossa estratégia para produzir seguidores de Cristo saudáveis (discípulos). Não\ntemos nenhum outro plano; não temos nenhum outro sistema de comunicação. Acreditamos que esse\nseja o caminho mais eficaz de fazer discípulos e de orientar pessoas para que vivam vidas saudáveis e\nequilibradas. Não somos uma igreja com células; somos uma igreja de células.\n\n     Igreja com Células                     Igreja de Células\n\n     Nosso ministerio de células não é apenas outro programa. Ele é parte integrante e integrada de tudo\no que fazemos como igreja. É nossa infraestrutura. É onde se dá o cuidado. É nosso sistema de\ncomunicação para toda formação espiritual; é nosso método para equilibrar os propositos bíblicos e\nformar vidas saudáveis.\n\n     V. Classes (C.L.A.S.S. – Chistian Life and Service Seminars: Seminarios sobre Vida Cristã e\nServiço)\n\n      Todos os nossos membros devem passar pelas classes dos Seminários sobreVida Cristã e Serviço,\nessas classes dá aos nossos membroso o lado cognitivo dos cinco propósitos bíblicos. As classes e suas\ndescrições são as seguintes:\n\n     101 - Esta introdução básica à nossa família da igreja é feita para explicar com clareza a membros\nem pontencial quem e o que a nossa igreja é. Os participantes aprendem a respeito de nossas crenças\nsobre salvação, nossas declarações de propósito e a estratégia e a estrutura de nossa igreja. Nós também\ncontamos a ele a história de nossa comunidade, como os cinco propósitos bíblicos são necessários para\n\n                                                                                     Igreja de Vencedores\n\ncumprir o chamado de Deus para a sua vida e os planos para o futuro da Igreja de Vencedores. Ao final\ndesse curso, os participantes recebem a oportunidade de decidir se completam o processo de filiação\npreenchendo e assinando a aliança de membresia (no final desta classe acontecerá o batismo nas\náguas).\n\n      201 - Os participantes são auxiliares a desenvolver os hábitos que necessitam para o seu\ncrescimento espiritual. Ela fornece uma visão geral do tempo diário com Deus (hora silenciosa, oração\ne estudo da Bíblia – Relogio da Oração),da contribuição financeira e da comunhão.\n\n     301 - Esta classe apresenta os participantes ao conceito. S.H.A.P.E – Spiritual Gifts (Dons\nEspirituais). Qual é o seu dom? Heart (Coração), Quais são suas paixões? Abilities (Habilidades). O\nque você naturalmente faz melhor que os outros? Personality (Personalidade). Como Deus lhe equipou\npara navegar pela vida? Experinces (Experiência). Por onde você tem andado e o que tem aprendido?\n\n     O modo como ajudamos pessoas a encontrar seu ponto privilegiado é colaborando para que\ndescubra a sua S.H.A.P.E. (em português, FORMA).\n\n     401 - Participantes são auxiliados na descoberta da missão de sua vida, e em como podem ser parte\ndo plano de Deus para alcançar o mundo. Participantes nessa classe são ensinados a:\n\n      Como desenvolver uma perspectiva pessoal da mensagem do evangelho;\n      Como desenvolver uma história pessoal de como Deus tem trabalhado em sua vida;\n      Como gerar confiança ao compartilhar sua história;\n      Como o Plano P.E.A.C.E. funciona e como eles podem ser parte dele.\n\n     501 - O participante aprenderá ser Comprometido com a Adoração.\n\n     VI. O Processo Atos 5.42\n\nNós usamos um visual de funil para retratar como podemos melhorar a participação e o\nentendimento dos cinco propósitos bíblicos.\n\n     ESTABELECER. Nós estabelecemos os cincos propósitos bíblicos durante os cultos de finais\nde semana.\n\n     EXPLICAR. Explicamos os propósitos em nosso sistema de CLASSES.\n\n     EXPERIMENTAR. As pessoas experimentam os cincos propósitos bíblicos em nossas células.\n\n     EXPRESSAR. As pessoas expressam os propósitos bíblicos em sua vida diária.\n\n     Agora olhe para a ilustração do processo ATOS 5.42. Note a linha que cruza entre as CLASSES e\nCÉLULAS. Acima da linha (Fim de Semana e Classes) está o conhecimento cognitivo – a cabeça.\nAbaixo da linha ( Células e Vida) é onde ocorre a aplicação – o coração. Onde muitas pessoas erram é\nquando pregam sobre células ou sobre os propósitos e têm classes que explicam, porém não encorajam\noutros a viverem abaixo da linha cognitiva, na área do coração.\n\n                                                                                 Igreja de Vencedores\n\n     É importante que as pessoas não somente entendam os propósitos, como também os vivam por\nmeio das células a fim de que sejam por fim expostos em sua vida pessoal. Não pare acima da linha ou\nsimplesmente explique os propósitos, mas experimente a oportunidades de vivê-los com intensidade.\n\n     VII. A CÉLULA\n\n      A vida não é para ser vivida só. Deus quer que experimentemos a vida juntos, e é por isso que na\nIgreja de Vencedores, nós encorajamos você a entrar em uma célula.\n           Uma célula é um encontro semanal de três ou mais pessoas que se reúnem em uma casa. A\nfinalidade da célula é estudar a Palavra e fortalecer cada membro.\n           Existe células de todas as formas e tamanhos - casais, solteiros, homens, mulheres, crianças,\nsem crianças, locais de trabalho, menos de 20 anos, mais de 40 - a lista é longa! Não importa onde você\nestá na vida, há uma célula para você.\n      Assim como a célula é a vida no corpo humano. A célula espiritual é a vida da nossa igreja, tudo\ngira em torno da célula.\n      Cada célula está ligada a um SERVIÇO (MINISTÉRIO).\n      EXEMPLO 1: a célula reuni na terça, mas no domingo o serviço desta célula é distribuir alimento\nna comunidade.\n      EXEMPLO 2: a célula reuni na quinta, mas no domingo ou em algum evento ponte da igreja ela\napresenta o teatro.\n      EXEMPLO 3: a célula reuni na segunda, mas no sábado o serviço desta célula é trabalhar com\njovens da comunidade.\n\n    O alvo dessas células não é somente a comunhão, apesar de ser impossível um grupo se reunir\nsemanalmente e não criar comunhão.\n\n     O alvo é a conquista de almas para o Senhor Jesus Cristo, a consolidação desses novos cristãos e o\npreparo para que eles possam fazer o mesmo com outras pessoas.\n\n     VIII. ANFITRIÕES E LÍDERES\n     O anfitrião e o líder devem ter o coração de servo.\n     Eles têm um coração disposto.\n     Eles tomam a iniciativa de tornarem as suas células, em células com propósitos.\n     Eles farão mais do que a igreja diz para fazer.\n     Eles pensarão em como aplicar novas habilidades a suas células.\n     Eles seguirão até o fim.\n     A igreja pode contar com eles.\n     Eles estão dispostos a realizar tarefas menores.\n     Eles têm de estarem dispostos a meter a mão na massa.\n     O SERVIÇO DELES É MOTIVADO PELO AMOR. I Co 13.1-13\n\n1.       No inicio da caminhada de um anfitrião de célula só é necessário ele:\n      Ter o coração para pessoas.\n      Abrir o seu lugar (encontro em uma casa, em uma cafeteria, restaurante ou local de trabalho)\n      Servir um lanche.\n      Conectar seu celular em grupo de Whats App da Célula ou assistir a célula através do nosso\ncanal no You Tube - Mega Aprisco – plalist Estudo da célula\n\nCOMENTE ABAIXO O QUE MAIS LHE CHAMOU A TENÇÃO NESTA LIÇÃO\n\n__________________________________________________________________________________\n__________________________________________________________________________________\n__________________________________________________________________________________\n__________________________________________________________________________________\n__________________________________________________________________________________\n__________________________________________________________________________________\n__________________________________________________________________________________\n_________________________________________________\n\n                                                                                  Igreja de Vencedores\n         28", "quiz": [{"q": "Qual é o texto bíblico-base da lição \"CONHECENDO A IGREJA DE VENCEDORES\"?", "options": ["Tiago 4:7; I João 3:8; Efésios 4:27;", "Salmo 139.2", "Efésios 2.19", "1 Coríntios 9.16"], "answer": 2}, {"q": "Qual destes é um dos tópicos estudados na lição \"CONHECENDO A IGREJA DE VENCEDORES\"?", "options": ["O Nosso Estilo De Oração", "Níveis De Entrega E Renúncia – A Unção Provendo Habilitação", "O Que Motiva A Nossa Igreja?", "Conquistar Cidade"], "answer": 2}, {"q": "Qual destes tópicos NÃO faz parte da lição \"CONHECENDO A IGREJA DE VENCEDORES\"?", "options": ["Declaração De Propósito Da Igreja De Vencedores", "Anfitriões E Líderes", "O Que Motiva A Nossa Igreja?", "Não Existe Luta Entre Deus E O Diabo"], "answer": 3}]}, {"num": 5, "title": "CONHECENDO O VALOR DA ORAÇÃO", "verseRef": "Tiago 5.17,18", "content": "TEXTO BÍBLICO\n\n      \"Elias era homem sujeito as mesmas paixões que nós, e, orando, pediu que não chovesse, e, por\ntrês anos e seis meses, não choveu sobre a terra. E orou outra vez, e o céu deu chuva, e a terra produziu\no seu fruto\" (Tiago 5.17,18).\n\n     COMENTÁRIO\n\n     INTRODUÇÃO\n\n     Através da oração, você alcança grandes vitórias. Todos os que oram e confiam a Deus os seus\nproblemas, difíceis de solução, são recompensados pelo Todo-Poderoso. Nesta lição, você vai conhecer\no quanto é bom orar, e aprender que tudo quanto se pede ao Senhor, com fé, mediante sua vontade, se\nrecebe.\n\nI. O QUE SIGNIFICA ORAR?\n\n     1. É conversar com Deus. É o dialogo que mantemos com o Pai celestial. Falamos-lhe quais são\nas nossas necessidades, enfermidades e dificuldades. Mas, antes de tudo, devemos agradecer por mais\num dia de vida que Ele nos concedeu. Então, sentimos no coração a resposta, através do nosso espírito,\nque se comunica com o Espírito de Deus. Leia Romanos 8.16.\n\n      Daniel alcançou grandes vitórias em sua vida, porque sempre viveu em oração. Apesar de residir\ndistante de sua pátria, orava três vezes ao dia, voltado para Jerusalém, a cidade de Deus [Daniel 6.10].\nPor causa disso, lançaram-no na cova dos leões, que nada lhe fizeram. Então, o rei Dario, seu grande\namigo, não dormiu naquela noite, ao imaginar que Daniel havia sido devorado pelas feras. Porém ao\ncontrário do que pensava, o jovem profeta de Israel estava bem vivo e glorificava a Deus por ter\nfechado a boca dos leões [leia Daniel 6.20]. Vale ou não a pena conversar com Deus?\n\n      2. É ter comunhão com Deus. A Bíblia registra em Gênesis 5.21, que Enoque, quando estava\ncom 65 anos, passou a ter comunhão com Deus, Através da oração. A cada dia, ele se aproxima mais e\nmais do seu Criador, por intermédio desta sublime prática. Trezentos anos depois, não foi mais visto,\npois o Senhor o tomou para si.\n\n      Você só sentirá, realmente, a presença de Deus em sua vida, se for através da oração. Ela faz com\nque a pessoa sinta a comunhão real com seu Criador e Pai celestial. Seria possível para os cristãos, no\ndecorrer da história da igreja, enfrentar os tribunais, as arenas, as fogueiras, os pelotões de fuzilamento,\nas prisões, a fome, a sede, a perseguição, a incompreensão, e tantos outros males, se não fosse a certeza\nde que não estavam sozinhos, mas sentiam uma mão que lhes segurava e uma voz suave a lhes dizer:\n\"coragem meus amigos, pois estou aqui para lhes conceder a vitória, e logo mais estareis comigo!\"\n\n3. Não é rezar. Como já foi dito anteriormente, orar é conversar com Deus é dialogar com Ele. É\num processo que flui normal e espontaneamente. O Espírito Santo nos inspira as palavras que são ditas\nem cada oração que fazemos. De acordo com as nossas necessidades, usamos termos que jamais\nempregamos em petições anteriores. É isto que agrada a Deus: a nossa fuga das vãs repetições.\n\n      Os discípulos pediram a Jesus que lhes ensinasse a orar. O Mestre, de pronto, lhes respondeu:\n\"Pai nosso, que estais nos céus, santificado seja o teu nome; venha o teu reino, seja feita a tua vontade,\nassim na terra como no céu; o pão nosso de cada dia nos dá hoje; e perdoa-nos as nossas dividas, assim\ncomo nós perdoamos aos nossos devedores; e não nos induzas a tentação; mas livra-nos do mal; porque\nteu é o reino, e o poder, e a glória, para sempre. Amém\" [Mateus 6.9-13].\n\n      Esta é a única oração ensinada por Jesus e utilizada pelas igrejas nos dias atuais. As demais,\nempregada pela igreja Católica Romana em seus cultos, são consideradas rezas, citações elaboradas\npor alguém, repetidas milhões de vezes por seus devotos.\n\nII. COMO ORAR?\n\n     1. De joelhos (Efésios 3.14). Certo pastor enfrentava grande luta em sua igreja, e não sabia como\nvencê-las. Encontrava-se, em certa ocasião, numa praça, e pediu a um engraxate que lhe limpasse os\nsapatos. O jovem, de imediato, ajoelhou-se e iniciou o seu oficio. O pastor, com pena dele, perguntou\npor que ele não se sentava no caixote. Ao que o rapaz respondeu: \"De joelhos é melhor!\" O pastor,\nintimamente, começou a chorar, e agradeceu a Deus pela mensagem recebida, através do jovem\nengraxate. Colocou a igreja em oração, de joelhos, e logo alcançou a vitória que tanto almejava.\nCompôs, inclusive, o hino, \"De joelhos é melhor\", cantado em diversas denominações evangélicas.\n\n     Muitos consideram esta a melhor maneira de se conversar com Deus, pois é uma demonstração\nde submissão, reverencia e humildade.\n\n     2. De pé (2 Crônicas 20.5,6). Este texto refere-se a Josafá, rei de Judá, que, em pé, diante do\npovo, orou a Deus, e recebeu a resposta imediatamente. Os Cristãos costumam orar em pé, no inicio,\ndurante e no fim dos cultos, e tem recebido grandes vitórias.\n\n      O importante é a sua disponibilidade! Se o templo esta lotado, e não há mais espaço para o povo\nse ajoelhar, além dos visitantes não convertidos, que se inibem facilmente, o orar em pé, ou sentados\n[os velhos e os enfermos], é aceito de bom grado por Deus, pois o que vale é a sua intenção.\n\n     3. Deitado (2 Reis 20.2,3). Esta passagem registra a enfermidade de Ezequias, rei de Judá.\nAcamado, recebeu a visita do profeta Isaías que lhe transmitiu o recado de Deus a respeito de sua\nmorte iminente: \"morrerás, e não viverás\". Deitado, Ezequias virou o rosto para a parede e orou. O\nSenhor o ouviu e concedeu-lhe mais 15 anos de vida.\n\nIII. ONDE ORAR?\n\n     1. No templo (Mateus 21.13). Biblicamente, todo o templo evangélico, dedicado a Deus, torna-\nse uma casa de oração. Nelas, os cristãos se reúnem para buscar a presença de Deus e receber as suas\nbênçãos. Cultos na congregação, reuniões de célula, reuniões de geração e ministério são reuniões já\n\n                                                                                      Igreja de Vencedores\n\ntradicionais em nossas igrejas, ocasiões em que Jesus nos batiza com o Espírito Santo, cura nossas\nenfermidades e resolve os nossos problemas.\n\n     2. Em particular (Mateus 6.6). Jesus, em seu Sermão da Montanha, enfatizou que a oração feita\nem particular é ouvida pelo Senhor, que vê secretamente. É a melhor maneira do cristão está a sós com\nDeus e contar para Ele as suas angustias e necessidades da vida, sem que ninguém saiba pelo que\npassa. É a oportunidade que você tem de confiar somente ao Senhor um problema de difícil solução.\n\n      3. Em família (Atos 12.12). A igreja em Jerusalém enfrentava uma das maiores lutas de sua\nhistória. Herodes, rei dos judeus, prendeu dois dos seus principais lideres: Tiago e Pedro. A\npopularidade deste monarca estava baixa. Ele julgou que a perseguição aos cristãos iria ajudá-lo a\nrecobrar o seu prestigio. Mandou matar primeiramente, a Tiago, para sentir a reação do povo. Foi um\n\"sucesso\"! Todo mundo o parabenizou. Então, ele marcou a data da morte de Pedro: um dia após o\nencerramento da Páscoa, quando todos os judeus se preparavam para retorna aos seus países de origem.\nCom este acontecimento, Herodes conseguiria o ápice da sua popularidade. Atos 12.5 registra: \"Pedro,\npois, era guardado na prisão; mas a igreja fazia continua oração por ele a Deus\". Aqueles primeiros\ncristãos ainda não tinham um templo-sede para se reunirem. Utilizavam as casas dos irmãos em Cristo,\npara cultuarem ao Senhor. Oravam exatamente na residência de Maria, mãe do evangelista Marcos\n[escritor do segundo evangelho], quando um anjo de Deus, em resposta as suas orações, visitou o\ncárcere, onde estava preso o apostolo Pedro, e o libertou. Leia Atos 12.12.\n\n      Hoje, nós chamamos esta reunião de Culto familiar, ou seja, entre pais e filhos. Os lares\nevangélicos que se reúnem diariamente, para orar, são felizes e harmoniosos. Os cônjuges são unidos,\nos filhos obedientes, além da saúde e prosperidade que desfrutam.\n\n      Você já realizou seu culto familiar? Se ainda não, comece hoje, e desfrute as bênçãos que Deus\nquer lhe conceder!\n\nIV. QUANDO ORAR?\n\n     1. Ao deitar-se. Depois de um dia estafante, principalmente em uma cidade grande, onde se\nenfrenta muitos perigos, é dever do cristão orar ao deitar, à noite, e agradecer a Deus os grandes\nlivramentos, ou seja, a proteção contra os assaltos, as batidas de carro no trânsito, os atropelamentos;\npela saúde e por tudo que lhe aconteceu, pois a Bíblia recomenda: \"Dando sempre graças por tudo a\nnosso Deus e Pai, em nome de nosso Senhor Jesus Cristo\" (Efésios 5.20).\n\n      2. Ao levantar-se. As nossas vidas são entregues nas mãos de Deus. Por isso, é nosso dever, ao\niniciarmos o novo dia, orar, para que o Senhor mande os seus anjos, a fim de nos livrar de todos os\nperigos, conforme lemos no Salmo 91.11: \"Porque aos seus anjos dará ordem a teu respeito, para te\nguardarem em todos os teus caminhos\".\n\n      3. Sempre. (1 Tessalonicenses 5.17). Quem vive em total dependência de Deus, através da\noração, é sempre vitorioso. Orar sempre significa viver às 24 horas do dia em constante comunhão com\nDeus. É deitar-se, levantar-se, trabalhar, viajar, etc., com o pensamento voltado para as coisas\nespirituais.\n\nV. VITÓRIAS ATRAVÉS DA ORAÇÃO\n\n     1. Nas tentações (Mateus 4.2,3). Jesus só venceu as muitas tentações que enfrentou, porque\nsempre viveu em oração. O diabo não dava trégua: tentava o filho de Deus noite e dia, mas foi\nderrotado pela comunhão de Cristo com o Pai Celestial. Até no calvário, Satanás tentou convencer\nJesus a descer da cruz, mas não conseguiu, por causa do efeito da oração.\n\n      2. Nas enfermidades. Doenças incuráveis foram repreendidas pelo poder da oração. Até mortos\nressuscitam, quando a igreja ora, pois nada é impossível para Deus. Os apóstolos Pedro e João foram\nao Templo, em Jerusalém, orar. Na passagem pela porta chamada Formosa, depararam-se com um\ncoxo de nascença. Este estendeu a mão e pediu-lhes uma esmola. Pedro, então, respondeu: \"Não tenho\nprata nem ouro; mas o que tenho isso te dou. Em nome de Jesus Cristo, o Nazareno, levanta-te e anda\".\nIsto só foi possível, porque os apóstolos viviam em constante oração.\n\n    3. Nas dificuldades. (Atos 27.34). Paulo e 275 companheiros de viagem para Roma\npermaneceram 14 dias perdidos no mar Adriático, fustigados por uma tempestade interminável.\n\n     O navio, açoitados pelas fortes ondas, não naufragou, de imediato, porque o apostolo estava entre\nos passageiros. Ele rogou a Deus, em oração, pelas vidas de seus companheiros. Em resposta, um anjo\ntrouxe-lhe a seguinte mensagem: \"Paulo, não temas: importa que seja apresentado a César, e eis que\nDeus te deu todos quantos navegam contigo\". Ele, então, reuniu todos os passageiros e tripulantes e\ndeclarou-lhes: \"Portanto, exorto-vos a que comais alguma coisa, pois é para vossa saúde; porque\nnenhum cabelo caíra da cabeça de qualquer de voz\". Na verdade, a embarcação foi destruída, mas\ntodos os seus ocupantes se salvaram.\n\n      A oração, portanto, é a chave da vitória. Todos os que enfrentam grandes lutas, mas confiam no\npoder de Deus, foram vitoriosos. Orar é um habito que se adquire gradativamente. Todos os que se\nprontificaram a orar ao Senhor, tiveram, no inicio, a contrariedade da carne. Mas a mortificaram e\ndisciplinaram-na a tal ponto, que ficavam horas e horas de joelhos, sem perceberem o tempo passar.\nTornaram-se grandes pregadores e ganharam milhares de almas para Cristo. Venceram a todas as\ntentações e provocações e, agora, aguardam, no Paraíso, o momento de receberem o novo corpo, para\nviverem eternamente com Jesus.\n\nDISCIPULADO\n\n     Você aceitou a Jesus como salvador. Agora, é um discípulo de Cristo, ou seja, aluno do Mestre\ndos mestres. Conforme estudamos nesta lição, Ele venceu todas as tentações, porque viveu sempre em\noração. Se você deseja alcançar muitas vitórias em sua vida, é hora de buscar a Deus!\n\n     São tradicionais, em todas as igrejas evangélicas espalhadas pelo Mundo, Encontro com Deus e\nCultos de Oração.\n\n    Frequente-os assiduamente. Busque o batismo no Espírito Santo, se ainda não é batizado, e seja\numa bênção nas mãos do Senhor!\n\n                                                                                   Igreja de Vencedores\n\nVERIFIQUE O QUE VOCÊ APRENDEU\n\n1. O que significa orar?\n\n______________________________________________________________________________\n\n2. Por que a oração de joelhos é preferida pela maioria dos cristãos?\n\n______________________________________________________________________________\n\n3. O que significa orar sempre?\n\n_______________________________________________________________
