são da vossa carne, vos deu vida juntamente com Ele,\nperdoando todos os nossos delitos; tendo cancelado o escrito de dívida, que era contra nós e que\nconstava de ordenanças, o qual nos era prejudicial, removeu-o inteiramente encravando-o na cruz; e,\ndespojando os principados e as potestades, publicamente os expôs ao desprezo, triunfando deles na\ncruz.‘‘\n\n      Jesus é a única pessoa que pode sarar os males de nossas lembranças e dores, e Ele o fará, por\nmeio da cura interior.\n\n          1. Se quisermos ser libertos do domínio de Satanás (I Jo 3:8b);\n          2. Se quisermos que nossa mente seja curada (Fp 4:8);\n          3. Se quisermos ficar integralmente sãos (I Ts 5:23);\n          4. Se quisermos permanecer sãos (Gl 5:1).\n       \"Jesus Cristo é o mesmo ontem, hoje, e o será para sempre‘‘ (Hb 13:8). O tempo e o espaço não\nsignificam nada. Ele pode voltar ao nosso passado e tocar aqueles pontos em que fomos feridos. Ele\nquer que lhe entreguemos nosso passado. O verso de Filipenses 3:13 nos diz para esquecermos o\npassado, e olharmos para adiante, para o que está à nossa frente.\n\n       Algumas pessoas parecem gostar de viver no passado, repassando e revivendo sofrimentos\nantigos, sofrendo como mártires. A essas pessoas Jesus não cura, pois elas mesmas não querem. Mas,\nse realmente quisermos ser integralmente curados, se quisermos essa paz interior, Ele pode concedê-la\na nós. Lemos em Colossenses 1:13-14 o seguinte: ‗‘Ele nos libertou do império das trevas e nos\ntransportou para o reino do Filho do seu amor, no qual temos a redenção, a remissão dos pecados\".\n\n       A operação da cura interior não é apenas voltar ao passado e desenterrar de lá os detalhes mais\nsórdidos. Não é procurar ver qual a quantidade de lixo de que nos lembramos; mas é jogar fora todo o\nlixo que ali encontrarmos. É deixar que Jesus faça brilhar sua luz divina em todos os recantos escuros\nonde Satanás escondeu as mágoas e lembranças dolorosas. É andar de mãos dadas com Jesus, em todos\nos segundos de nossa vida, e deixar que Ele fique bem ali conosco durante as situações desagradáveis.\n\nMuitas vezes pensamos: ‗‘Ah! Deus me livre! Não quero nem pensar nestas coisas ruins. Que\nfiquem longe da vista, longe da lembrança‘‘, com relação a essas recordações indesejáveis. Mas este\nraciocínio é semelhante ao ato de ir acumulando objetos dentro de um armário. Depois que fechamos a\nporta, não vemos o amontoado, mas se continuarmos a colocar coisas ali, chegará um momento em que\nelas rolarão para fora.\n\n        Esse mesmo princípio se aplica à nossa mente. Vamos empilhando na mente toda sorte de\n‗‘lixo‘‘ (medos, ressentimentos, culpa), pensando que essas coisas não vão incomodar-nos, mas elas\nficam lá, no fundo de nosso subconsciente, e sem dúvida alguma irão afetar nossas emoções e\ninfluenciar o modo como agimos e reagimos. A raiva reprimida, os ressentimentos ou o medo às vezes\nse manifestam nos momentos em que menos esperamos.\n\n      6. OS RESULTADOS DA CURA INTERIOR\n\n       Se fôssemos descrever os resultados da cura interior com apenas uma palavra, essa palavra seria\npaz. Lembremos algumas personalidades da Bíblia que tiveram problemas graves, mas depois\nreceberam essa paz interior. Quando pensamos em Saulo de Tarso e em todos os cristãos que ele matou\nantes de tornar-se cristãos, podemos imaginar a dor do arrependimento que ele deve ter sentido. Mas\nDeus o perdoou, encheu seu coração de paz interior, e ele acabou se tornando um gigante espiritual –\num grande apóstolo.\n       Consideremos a mulher apanhada em adultério. Sem dúvida alguma ela deve ter sentido muita\nvergonha e auto condenação, mas Jesus lhe disse: ‗‘... nem eu tão pouco te condeno; vai, e não peques\nmais.‘‘ (Jo 8:11). E Davi não apenas cometeu adultério, mas também mandou que o marido de Bate-\nSeba fosse morto. O filho recém-nascido, ilegítimo, morreu. Na certa, Davi deve ter-se sentido sobre\ncarregado de lembranças dolorosas. Contudo, o Senhor concedeu-lhe a cura interior, e ele se tornou um\nhomem segundo o coração de Deus. Ele escreveu o seguinte, no Salmo 16:9: ‗‘Alegra-se, pois, o meu\ncoração, e o meu espírito exulta; até o meu corpo repousará seguro. \"Davi havia alcançado genuína\nalegria de coração, o que vale dizer: alcançara paz mental. Pedro sentiu vergonha também, por haver\nnegado a Cristo, mas recebeu o perdão e a paz, e tornou-se uma pessoa tão bem ajustada, que Jesus o\nchamou de ‗‘pedra‘‘.\n       O Senhor deseja dar-nos essa mesma paz interior, por meio da cura interior. A Bíblia nos\npromete isso em Filipenses 4:7: ‗‘E a paz de Deus, que excede todo entendimento, guardará os vossos\ncorações e as vossas mentes em Cristo Jesus.‘‘\n       Lemos em Isaías 26:3 o seguinte: ‗‘Tu, Senhor, conservarás em perfeita paz aquele cujo\npropósito é firme; porque ele confia em ti.‘‘ E Efésios 2:14 afirma: ‗‘Porque Ele é a nossa paz...‘‘\n       É necessário conscientizar a pessoa de que precisa perdoar e sentir-se perdoada, para que possa\nprosperar na vida. Deus a ajudará nisso. É preciso tirar do coração aquele sentimento de que Deus é\nculpado por lhe deixar passar por experiências amargas. Declare a libertação do seu coração para amar\na Deus, e para aceitar a revelação de que o Senhor sempre quis o melhor, e sempre trabalhará pelo\nmelhor para as nossas vidas. A chave para a cura interior e para as lembranças amargas é o perdão.\nDeus passará o seu bálsamo sobre as suas dores.\n       Diga aos encontristas para declararem uns aos outros:\n       ‗‘Estou aberto ao que Deus vai fazer em minha vida‘‘.\n       ‗‘Toda minha cura interior e libertação da minha alma depende da cruz‘‘.\n\n                                                                                   Igreja de Vencedores\n\n      O remédio para a humanidade está na cruz. É preciso passar pela cruz e ter compromisso com\nDeus. Precisamos renunciar a nós mesmos para sermos libertos. Estamos numa guerra onde mesmo\nque tenhamos encerrado o argumento do diabo, ele vai querer fazer reivindicações. Não podemos\npermitir que o diabo tenha legalidades sobre nós. Hoje Deus começara a curar as feridas.\n\n      Fim da lição\n      ORIENTAÇÕES PARA O MINISTRADOR\n\n       a) Sugestão para esse momento de confissão:\n       Coloque uma música de adoração. Alguns momentos de música levarão as pessoas a lembranças\namargas e arquivadas na memória.\n       1. Afaste os bancos para que haja espaço no auditório.\n       2. Avise que, durante a ministração, não há problema se a pessoa quiser chorar, gritar, berrar, se\nencolher no chão, etc. Ela pode ficar à vontade. Não deve observar ou importar-se com ninguém.\n       3. Diga-lhes para tentar visualizar cada situação que será ministrada a partir deste momento.\n       4. Durante todo esse processo, os intercessores devem estar orando em tom baixo, sem\ninterromper as pessoas. A música deve estar tocando suavemente.\n       Fale lentamente, observando cada fase da vida, pois os encontristas estarão sendo tratados pelo\nEspírito Santo de Deus.\n\n       Peça a cada um que:\n       1. Tente visualizar o encontro do espermatozóide do seu pai com o óvulo de sua mãe. Ali Deus\njá planejava cada momento da sua vida. (Cite trechos do Salmo 139).\n       2. Veja-se no útero materno, sendo formado...\n       3. Veja-se em cada momento da gestação...\n       4. Tente lembrar os sentimentos que recebeu: amor, ódio, rejeição, tentativa de aborto, perigo de\nvida por conta de doenças, insegurança quanto ao nascimento...\n       5. Veja-se nascendo, sendo recebido por sua mãe. Saiba que nesse momento Jesus também\nestava recebendo e te amando (Talvez seu pai não estivesse lá, mas Jesus estava). Jesus lhe recebeu e\nlhe colocou no colo...\n       6. Veja-se crescendo:\n           - com um ano de idade...\n           - dois...\n           - três...\n       Obs.: em cada faixa etária, desde a infância até a vida adulta, o ministrador deverá instruir os\nencontristas a se lembrarem de momentos difíceis, amargos, traumatizastes, etc.\n       7. Libere perdão a:\n           - pai;\n           - mãe;\n           - irmãos;\n           - familiares.\n       8. Não prenda pessoas no mundo espiritual. Jesus lhe perdoou, perdoe-os também. Talvez as\npessoas que lhe magoaram não sabiam que estavam lhe maltratando; talvez eles não conheciam a Jesus\nCristo naquele tempo.\n\n      b) Após estas etapas deixe passar 10 minutos e comece a nova etapa:\n      1. Cada pessoa do grupo deve escolher um parceiro para confessar as dores.\n\n2. Obs.: Caso o ministrador decida seguir esta sugestão, pode fazer com que a escolha e a\nprocedente arrumação se dê antes de começar a palestra propriamente dita. O ministrador também\nnão deve esquecer de providenciar uma música de fundo. A música deve ser orquestrada e não\nconter uma letra, para que a atenção não se volte para a mensagem da letra. Sugere-se usar uma\nlouvor lento, suave, ou que contenha ruído de mar ou de passarinhos.\n       3. As duplas sentam-se de frente, par a par ( elas não devem se conhecer) e devem imaginar o\nofensor ou ofendido.\n       4. O ministrador dá 10 minutos para o primeiro parceiro confessar suas dores. Caso ele use\napenas 1 minuto deverá ficar os outros nove minutos em silêncio.\n       5. O parceiro ouvinte não pode dizer coisa alguma, a não ser \"hum, hum...\" Isto se faz para que\nnão aconteça de ser feita alguma observação imprópria. É proibido ao ouvinte aconselhar qualquer\ncoisa. Deve limitar-se apenas a demonstrar que está ouvindo, prestando atenção. Durante o suposto\nsilêncio daquele que desabafa, o ouvinte pode permanecer junto, pode abraçar, tocar na mão,\ndemonstrar que está com o outro.\n       6. Ao fim dos dez minutos o ministrador dirá com voz suave: Vez do próximo\n       7. Inverte-se os papéis. O parceiro que confessou, agora ouvirá, durante dez minutos, e só\ndepois desse tempo repetirá com o ministrador a oração.\n       8. Agora o ministrador ora por todos.\n       Após o momento de confissão:\n       Cada encontrista pede perdão a Deus pelos seus pecados.\n       a) Orar ministrando a cada pessoa, uma a uma (são necessários vários ministradores).\n       b) Abraçar aqueles que necessitam sentir-se amados. (receber abraço de Jesus)\n       A música deve continuar tocando durante todo esse processo.\n       O preletor, no momento adequado, retorna a Palavra e pede para que uns abracem uns aos\noutros e, pouco a pouco, voltem para os seus lugares.\n       Alguns lenços de papel deverão ser repassados às pessoas que precisem.\n       O preletor declara em voz alta que o Espírito Santo está começando uma obra de cura interior\nnas vidas.\n       Logo em seguida pede que cada um volte ao seu lugar e inicia a preleção sobre a cruz.\n\n     Comente o que mais chamou a sua atenção:\n__________________________________________________________________________________\n__________________________________________________________________________________\n__________________________________________________________________________________\n_________________________________________________________________________________\n\n                                                                                   Igreja de Vencedores\n         306", "quiz": [{"q": "Qual é o texto bíblico-base da lição \"Tema: CURA INTERIOR\"?", "options": ["Salmo 139.2", "1 João 4.1", "Tiago 4.8a", "Salmo 32; Oséias 2:14; Jeremias 17:9-10; 24:7"], "answer": 3}, {"q": "Qual destes é um dos tópicos estudados na lição \"Tema: CURA INTERIOR\"?", "options": ["Se Quisermos Ficar Integralmente Sãos (I Ts 5:23);", "Damos Glória A Deus Falando Dele Às Outras Pessoas", "Como Posso Dar Glória A Deus?", "Trabalhadores Comuns E Servos"], "answer": 0}, {"q": "Qual destes tópicos NÃO faz parte da lição \"Tema: CURA INTERIOR\"?", "options": ["Os Resultados Da Cura Interior", "Entendendo O Que É Cura Interior", "Espírito – Elemento Com O Qual Falarmos Com Deus;", "Tudo Começa Com Deus"], "answer": 3}]}, {"num": 42, "title": "INDO À CRUZ", "verseRef": "Mateus 10:38; 16:24; Gálatas 2:20; 5:24; 6:14", "content": "INTRODUÇÃO\n       Por que a cruz? Jesus Cristo disse: ‗‘Quem não toma a sua cruz, e vem após mim não é digno de\nmim.‘‘ (Mt 10:37). Devo negar-me a mim mesmo, crucificar a minha carne e render-me ao Espírito\nSanto. O meu propósito é estar na cruz todos os dias. Eu não posso descer da cruz.\n\n      O propósito da cruz é:\n         - pagar as nossas dívidas;\n         - trazer-nos reconhecimento de pecados;\n         - trazer-nos arrependimento genuíno;\n         - anular a maldição;\n         - dar-nos a remissão dos pecados pelo sangue;\n         - receber a vida eterna com Deus.\n      Toda a vida da humanidade depende da cruz: governos, saúde, moralidade, liberdade, paz,\nsegurança, prosperidade, santidade, etc.\n      Nunca podemos deixar de mencionar a cruz. A cruz é o antes e o depois da História.\n\n      1. A CRUZ APRESENTA DIFERENTES SIGNIFICADOS\n          a) A cruz para o mundo:\n      - Loucura (I Co 1:18-20).\n\n     b) A cruz para nós:\n     - Poder de Deus para a salvação (I Co 1:18-20).\n     - Estamos crucificados com Cristo (Gl 2:19-20).\n     - Crucificamos a carne com as suas paixões (Gl 5:24).\n     - Todo escrito de dívida que era contra nós foi cravado na cruz: não devemos mais nada!\nEstamos livres!\n\n      2. A CRUZ FALA DE CONQUISTAS\n\n      a) A cruz bloqueia a maldição na terra\n\n     Na cruz está a solução completa para nossa vida pessoal e para a Humanidade inteira. Tudo\nmuda pelo sacrifício da cruz. Foi lá que Jesus abriu o caminho de acesso a Deus. Na cruz toda\n\nmaldição é quebrada, todo argumento do diabo é encerrado. Ainda na cruz Jesus disse: ‗‘Está\nconsumado‘‘.\n\n       Eu só posso fechar a porta da legalidade para o pecado permanecendo na cruz. Quando eu vou à\ncruz, deixo lá meus pecados. Por isso, preciso permanecer crucificado na cruz de Cristo.\n\n      A cruz é um lugar de dor, de sangue, de renúncia, mas somente pela cruz é que somos\nredimidos.\n\n      b) A cruz me leva ao perdão\n\n      Eu recebo o perdão e a capacidade de perdoar. Deixo tudo na cruz. O que eu fiz e o que fizeram\ncomigo. Perdão é uma decisão, mas o ressentimento é um caminho para eu voltar ao pecado. Libere os\nofensores. Deixe tudo na cruz. O sacrifício da cruz é o princípio e o fim da restauração na sua vida.\n\n      3. O PROCESSO DA CRUZ\n\n      Orientações para o ministrador:\n\n       Este talvez seja o momento mais lindo e importante de todo o Encontro. Os encontristas\npoderão sentir um pouco da dor de ir à cruz, como Jesus Cristo sentiu. O ministrador deverá pedir\nque todos fechem os olhos e imaginem-se sendo transportados para Jerusalém. Eles estarão assistindo\ntudo, acompanhando cada momento, sentindo as afrontas e as dores. Lá eles morrerão para si e\nentenderão pelo menos parte daquilo que Jesus Cristo sentiu. Permita aos encontristas se\nquebrantarem diante da obra completa de Jesus, deixando-os livres para esse momento íntimo com\nEle.\n       - O ministrador deverá mostrar bastante seriedade e profundo pesar em cada momento que\nestiver narrando os acontecimentos que se relacionam com a cruz. Deve falar pausadamente.\n\n      - Uma música de adoração deverá estar sendo tocada ao fundo.\n\n      - As cadeiras deverão estar afastadas para que as pessoas tenham espaço.\n\n      - O ministrador aconselhará que ninguém ore em voz alta ou em línguas, apenas em português.\nNesse momento, deve-se permitir que expressem apenas chorando, ou até mesmo gritando, como\nacontece em alguns casos.\n\n      - Deverá pedir para que todos fiquem de braços abertos e fiquem com a lista de pecados em\nsuas mãos.\n\n     - Deverá iniciar a palestra pedindo a cobertura do sangue do Cordeiro sobre sua vida e então\ncomeçar a narrar os seguintes acontecimentos:\n\n      Veja Jesus levado por Maria e José ao templo para ser apresentado a Deus.\n      Veja-o crescendo em graça, sabedoria e estatura, diante dos homens e diante de Deus.\n\n                                                                                  Igreja de Vencedores\n\n       Veja Jesus curando as milhares de pessoas: os cegos enxergando, os paralíticos andando e\nsaltando de alegria, os mortos ressuscitando, as pessoas maravilhadas... Ninguém jamais vira coisa\nigual.\n\n      Veja Jesus no monte das bem-aventuranças ministrando para uma multidão sedenta e atenta.\n\n      Durante a época da Páscoa, Jesus foi ao Getsêmani com seus discípulos e lá suou gotas de\nsangue.\n\n      Veja Judas beijando Jesus e entregando – o aos soldados. Veja Jesus amarrado e levado à\ncasa de Caifás.\n\n      Veja Jesus calado ante insultos da multidão. Imagine que você está no meio da multidão.\n\n      Veja Jesus sendo vestido com vestes reais e sendo coroado com coroa de espinhos.\n\n      Veja Jesus sendo despido e recebendo sobre seus ombros uma pesada cruz de madeira.\n\n      Veja Jesus sendo levado para fora da cidade, saindo em direção ao Gólgota, o Lugar da\nCaveira. Ele fez tudo isso por você.\n\n      Veja Jesus caindo algumas vezes por causa do peso dos seus pecados. Ele está muito cansado\ne com sede.\n\n      Veja os soldados cravando as mãos de Jesus com cravos enormes; eles cravam também os\nseus pés e Ele sente muita dor. Jesus sangra... sangra muito.\n\n      Agora a dor aumenta porque estão levantando a cruz e fixando-a verticalmente. Jesus foi à\ncruz por minha causa, por sua causa, pelo mundo inteiro.\n\n      Você está no meio da multidão que assiste tudo. Eles não estão calados, Eles blasfemam,\ngritam.\n\n      Imagine Jesus dizendo a você: Não foram os romanos que me crucificaram, não foram os\njudeus... Eu estou aqui por causa de você, (repita esta frase pelo menos três vezes); foram os seus\npecados que me trouxeram à cruz...\n\n      Veja o céu escurecer. Ouça o que Jesus está gritando:\n\n      ‗‘Eli, Eli, lamá sabactâni... Deus meu, Deus meu, por que me desamparaste?‘‘\n\n      Depois Jesus grita novamente com grande voz: ‗‘Pai , nas tuas mãos entrego meu espírito!‘‘.\n\n      Agora Jesus morreu. Ele está morto. (Dê um pequenino intervalo para que haja reflexão no\nauditório).\n\n      Veja o soldado furando o lado do Senhor e de lá saindo sangue e água.\n\nJesus é tirado da cruz e é envolvido em um lençol de linho fino. José de Arimatéia sepulta-o\nnum túmulo novo.\n\n         A porta do sepulcro é fechada com uma grande pedra.\n\n         A multidão se retira, eles têm pressa, porque o Sábado está começando.\n\n         Você se retira também.\n\n      Leve todos para a frente da fogueira e logo em seguida deve ser jogada a lista de pecados\nna fogueira.\n\n         Três dias se passaram.\n\n      A notícia se espalha: Jesus Nazareno ressuscitou! Você ouviu? Jesus ressuscitou por você e\npor mim.\n\n         Agora que Jesus está vivo, ponha-se debaixo da cruz e sinta o sangue do Senhor caindo sobre\nvocê.\n\n         Receba a remissão dos seus pecados, receba o perdão do Senhor Todo-Poderoso.\n\n         O túmulo está vazio: não há mais condenação para os que estão em Cristo Jesus.\n\n         Você ressuscitou com Cristo. A morte e o pecado não mais têm domínio sobre você.\n\n         Jogue a lista de pecados na fogueira ( At 19.19)\n\n         Celebre com palmas, abrace seu irmão e dê gritos de vitórias: Jesus ressuscitou!\n\n         Após esse momento, peça que todos se sentem e tomem um papel para as orientações que serão\ndadas.\n\n         4 – INSTRUÇÕES:\n\n         CAMINMHANDO PARA A FOGUEIRA\n\n       - Enquanto o ministrador dirige a oração, a equipe de apoio do Encontro deverá acender a\nfogueira, previamente montada em um lugar seguro, sem que os encontristas percebam.\n       - O ministrador deverá também informar que peças de roupa que tenham símbolos da Nova Era,\ncartas de pessoas com quem tiveram relacionamento ilícito, presentes de origem ilícita, CDs\nmundanos, crucifixos, revistas pornográficas, cigarros, preservativos (Jovens solteiros) e todos os\nobjetos que se relacionam com algum pecado, devem ser queimados. As pessoas podem ir ao\ndormitório pegar os objetos para que sejam destruídos. Todo argumento de Satanás deverá ser anulado.\n\n                                                                                     Igreja de Vencedores\n\n      - Diga-lhes que Deus já os perdoou, e que devem pegar o papel, bem como os objetos, e\nqueimá-los na fogueira, testificando que renunciam a tudo isso e ao que significam.\n\n     - Próximo à fogueira. Eles deverão jogar ao fogo os papéis e objetos, e juntos gritarem:\n\n                          \"ESTÃO ANULADOS TODOS OS ARGUMENTOS\n                                   SOBRE A MINHA VIDA!‘‘\n\n     - Deve-se cantar um cântico de vitória, e, em comunhão, abraçarem-se uns aos outros.\n\n                                                                  Deus é tremendo!!!\n\n     Comente o que mais chamou a sua atenção:\n__________________________________________________________________________________\n__________________________________________________________________________________\n__________________________________________________________________________________\n_________________________________________________________________________________", "quiz": [{"q": "Qual é o texto bíblico-base da lição \"Tema: INDO À CRUZ\"?", "options": ["Mateus 10:38; 16:24; Gálatas 2:20; 5:24; 6:14", "2 Tm 4.7", "Malaquias 3. 8 - 12", "Tiago 4:7; I João 3:8; Efésios 4:27;"], "answer": 0}, {"q": "Qual destes é um dos tópicos estudados na lição \"Tema: INDO À CRUZ\"?", "options": ["Exemplos De Pessoas Fiéis Nos Dizimos E Nas Ofertas", "Defina Hierarquias Espirituais Dos Demônios", "O Processo Da Cruz", "Procure Ainda Nesta Semana Se Envolver Em Algum Ministério"], "answer": 2}, {"q": "Qual destes tópicos NÃO faz parte da lição \"Tema: INDO À CRUZ\"?", "options": ["O Processo Da Cruz", "As Qualidades Da Fé", "A Cruz Fala De Conquistas", "A Cruz Apresenta Diferentes Significados"], "answer": 1}]}, {"num": 43, "title": "ORAÇÃO COMO ESTILO DE VIDA", "verseRef": "Mateus 6:9-15; Lucas 11:1-4; II Crônicas 7:14", "content": "Quando oramos, estamos falando com o Senhor. Há princípios para a oração eficaz, para vermos\naquilo que desejamos sendo cumprido em nossas vidas.\n       Aprenda a buscar a Deus por três motivos principais:\n          1. Pelo que Ele é (adoração)\n          2. Pelas suas necessidades\n          3. Pela necessidade do seu próximo\n\n      1. PRINCÍPIOS PARA A ORAÇÃO\n\n       1.1. Não devemos orar como uma forma de ostentação e sim para que nós sejamos ministrados\npor Deus. Orar para que Deus ouça, não para que pessoas ouçam. É preciso se humilhar na oração e\nnão se exaltar (Mt 23:14; Lc 18:11-14).\n\n     1.2. A oração é algo particular entre nós e Deus. Precisamos ser sinceros diante do Senhor. Não\npodemos ser superficiais na conversa.\n\n      1.3. Deve-se manter um devocional pessoal diário. Isto gera intimidade com Deus (Mt 6:6; Sl\n25:14). Deve-se gastar nisso pelo menos 30 minutos por dia. Temos que estabelecer um tempo de\noração pessoal.\n\n      1.4. Temos que estabelecer um tempo de oração para a família.\n\n      1.5. Não se deve usar de vãs repetições. Ex.: Rezas, novenas.\n\n        1.6. Devemos ter propósitos na oração – o Espírito Santo colocará nos nossos lábios as palavras\ncertas, se esperamos nEle.\n\n       1.7. A oração deve ser acompanhada de fé, sem a fé não há respostas (Hc 11:6). Não precisamos\nver para crer, mas crer para ver (Jo 11:40; 20:29).\n\n      1.8. Devemos estar plenamente convictos de que Deus está atento ao que falamos, pois Ele ouve\nnossas orações. (Ef 3:20)\n\n                                                                                    Igreja de Vencedores\n\n      2. O NOSSO ESTILO DE ORAÇÃO\n\n      Estilo é o conjunto das qualidades de expressão, características de alguém. Veremos em alguns\npersonagens bíblicos seu estilo de oração:\n      2.1. Quanto ao local – Em qualquer lugar\n\n      Gn 3:8 – Deus buscava a comunhão com o homem no jardim.\n\n      Mt 14:23 – Jesus subiu ao monte para orar.\n\n      Dn 6:10 – Daniel orava no quarto em direção a Jerusalém.\n\n      2.2. Quanto ao tempo – Conforme a sua necessidade e do derramar do Espírito.\n\n      Gn 24:63 – Isaque medita no cair da tarde.\n\n      Sl 119:63 – Davi ora à meia-noite.\n\n      Ef 6:18 – Paulo ora em todo o tempo.\n\n      3. DEZ ITENS QUE JESUS ESTABELECEU NA ORAÇÃO (Mt 9:6-14)\n\n      1º REDENÇÃO – Pai nosso\n\n     - Por que chamá-lo de Pai? Porque só os convertidos, só os que receberam a Jesus, podem\nchamá-lo de Pai (Jo 1:12; 10:30). Porque Ele nos deu vida quando estávamos mortos (Ef 2:1; Gl 2:20).\n\n      - Deus nos deu promessas, e por elas nos fez participantes da natureza divina (II Pe 1:4).\n\n      2º AUTORIDADE – Que está nos céus\n\n         -   Ele é o Senhor: Soberano, Criador, Todo-Poderoso.\n         -   Ele nos deu autoridade e poder (Mc 16:17; Lc 10:19).\n         -   Ele nos deu senhorio na Terra (Gn 1:28; Ef 1:22-23).\n\n      3º ADORAÇÃO – Santificado seja o teu nome\n\n      - O Senhor procura verdadeiros adoradores que o adorem em espírito e em verdade (Jo 4:23-24).\n\n      4º GOVERNO – Venha a nós o teu reino\n\n- Todo o poder nos céus e na terra foi dado a Jesus... isto é uma herança para nós também (Mt\n28:18; Ef 1:22-23).\n\n      - Deus governa todo o Universo e governa também a minha vida.\n\n      - O governo de Deus implica em impactar o mundo através do Evangelho (At 17:6).\n\n       - Estabelecer o governo de Deus aqui na terra implica em obedecer o mandamento que Paulo\nregistrou em I Timóteo 2:1-4 - orar por todas as autoridades constituídas.\n\n      5º EVANGELIZAÇÃO – Seja feita a tua vontade assim na Terra como no céu\n\n        A implantação do reino de Deus diz respeito ao desejo que Deus tem de colocar todas as coisas\nem ordem com a Sua Palavra revelada: que todos sejam salvos, que sejam santos, que não haja\ninjustiça ou corrupção, etc.\n\n      A vontade de Deus é que todo pecador se arrependa, então, precisamos evangelizar o mundo.\n\n      Sete condições para ser um evangelista:\n\n            a) Ser salvo (Rm 3:24).\n            b) Capacitar-se biblicamente (Pv 2:1-5).\n            c) Ter compaixão pelos perdidos. Amá-los e não criticá-los (Mc 6:34; Mt 14:14).\n            d) Ser cheio do Espírito Santo (At 1:8; 2:4; 14:16).\n            e) Ser membro ativo de uma Igreja (Hc 13:17).\n            f) Ter um bom testemunho (êx 18:21).\n            g) Testificar a outros o que Deus fez em sua vida.\n       - Por isso tem uma vida segundo o padrão de Deus: não bebe, não fuma, não usa drogas, não se\nprostitui, etc . (Jo 4:28-30; I Ts 4:3-4).\n\n      6º PROVISÃO – O pão nosso de cada dia dá-nos hoje\n\n      - Deus garante a provisão necessária para uma vida sem carências, sem miséria.\n\n      - Dependência de Deus, confiança, fé (Hc 11:1).\n\n      7º PERDÃO – Perdoa as nossas dívidas assim como perdoamos\n\n      - \"Ah! Senhor me perdoa...‘‘ Você já perdoou seu irmão? (Mt 6:12; 18:21-22).\n\n      - O seu coração não pode estar cheio de mágoas (Ef 4:31).\n\n                                                                                  Igreja de Vencedores\n\n      8º PROTEÇÃO – Não nos deixes cair em tentação\n\n      - É necessário fortalecer-se no Senhor e vestir-se de toda a armadura de Deus (Ef 6:10-13).\n\n      - Precisamos resistir nos dias maus, e estarmos firmes diante das circunstâncias (II Co 4:17).\n\n      9º LIBERTAÇÃO – Mas livra-nos do mal\n\n      - Só está livre quem é redimido por Cristo (Jo 8:32).\n\n      - Quem é livre tem autoridade em nome de Jesus (Mc 16:17).\n\n      - Para ser livre sempre, é necessário caminhar na direção que o Espírito Santo dá (Gl 5:25).\n\n      10º SEGURANÇA – Pois teu é o reino, o poder e a glória para sempre\n\n      - Pode-se chegar com confiança diante do trono da graça (Hc 4:16; Sl 91).\n\n      Conclusão\n      Mt 26:41 ‗‘Vigiai e orai, para que não entreis em tentação; o espírito, na verdade, está pronto,\nmas a carne é fraca.‘‘\n          - Oração sem ação é fanatismo.\n          - Ação sem oração é mundanismo.\n          - Oração com ação é cristianismo.\n\n      Fim da Palestra\n      ORIENTAÇÃO PARA O MINISTRADOR\n\n      Já que a palestra estimula a oração como estilo de vida, promova um gostoso tempo de oração\ncom o grupo.\n\n     Comente o que mais chamou a sua atenção:\n__________________________________________________________________________________\n__________________________________________________________________________________\n__________________________________________________________________________________\n_________________________________________________________________________________", "quiz": [{"q": "Qual é o texto bíblico-base da lição \"Tema: ORAÇÃO COMO ESTILO DE VIDA\"?", "options": ["Eclesiastes 3.11", "Colossenses 2.6", "Mateus 6:9-15; Lucas 11:1-4; II Crônicas 7:14", "2 Coríntios 5.17"], "answer": 2}, {"q": "Qual destes é um dos tópicos estudados na lição \"Tema: ORAÇÃO COMO ESTILO DE VIDA\"?", "options": ["Dádivas Do Espirito Santo", "Você Foi Planejado Para Agradar A Deus", "Defina Autoridade Espiritual", "Pela Necessidade Do Seu Próximo"], "answer": 3}, {"q": "Qual destes tópicos NÃO faz parte da lição \"Tema: ORAÇÃO COMO ESTILO DE VIDA\"?", "options": ["Pelo Que Ele É (Adoração)", "Pela Necessidade Do Seu Próximo", "Dez Itens Que Jesus Estabeleceu Na Oração (Mt 9:6-14)", "Defina Os Aspectos Da Consolidação"], "answer": 3}]}, {"num": 44, "title": "A NOVA VIDA EM CRISTO", "verseRef": "Gálatas 5:1,4,5,13,14,16-25; Colossenses 3:5-10; II", "content": "INTRODUÇÃO\n       \"E assim, se alguém está em Cristo, é nova criatura: as coisas antigas já passaram; eis que se\nfizeram novas\" (II Co 5:17).\n       Obs. Uma breve peça teatral.\n\n       1. NA NOVA VIDA EM CRISTO DEVO ELIMINAR AS OBRAS DA CARNE\n       Prostituição, impureza, lascívia, idolatria, feitiçaria, inimizade, porfia, emulações, iras, pelejas,\ndissenções, heresias, invejas, homicídios, bebedices, glutonarias e coisas semelhantes (ler Gl 5:19-21; I\nTs 4:4; Cl 3:8-10).\n\n       Obs.: Falar explícita e detalhadamente sobre cada obra da carne.\n\n       a) Nós éramos pecadores que carregávamos o fardo do pecado (Mt 11:28-30).\n       - Alguém pode servir para ilustração de um novo convertido carregando um fardo.\n       - Outra pessoa pode fazer a figura do inimigo trazendo mais fardos (I Pe 5:8).\n\n      b) Quando nos encontramos com Jesus Cristo, Ele nos liberta (Jo 8:36).\n      - Alguém, coberto com um lençol branco, como se fosse o Espírito Santo, vem e tira o fardo da\npessoa.\n\n       c) Quando nos encontramos com Jesus, o Espírito Santo nos mostra os nossos pecados.\n       A nova criatura não pode agradar a Deus se não andar em santidade (Rm 6:4b; Rm 8:8). O\nEspírito Santo começa a nos mostrar onde estamos errados ou a revelar pecados escondidos (Jo 16:7-\n8). Como Ele fez aqui no Encontro, Ele continuará fazendo (Fl 1:6).\n       - A pessoa que representa o novo convertido deve ter em seu bolso pedaços de papéis\nrecortados, onde estejam escritas, em cada um, as obras da carne.\n       - A pessoa que representa o Espírito Santo vai apresentando os papéis (pecados) um a um, com\na explicação do ministrador. O ministrador dirá que o Espírito Santo nos revelará cada pecado, passo a\npasso. Nesse Encontro o Espírito Santo revelará os pecados para remover toda obra da carne.\n       - Na área espiritual: idolatria e feitiçaria.\n       A pessoa tira do bolso uma vela e um cordão do bolsoe objetos místicos, então, descreve-se os\npactos: macumba, despachos, banhos, nova era, gnose, yoga (I Jo 3:8b).\n       - Na área de relacionamento: inimizades, ciúmes (no namoro, no casamento, nas atitudes), iras\n(temperamento agressivo, estupidez, grosseria), distensões (confusão por tudo), facções (brigas\npartidárias), inveja, vícios (álcool, fumo, drogas) (Fl 2:15). (A pessoa tira dos bolsos carta amassada,\ncigarro, retratos rasgados, etc).\n\n                                                                                        Igreja de Vencedores\n\n       - Na área sexual: prostituição, impureza, conversas maliciosas, lascívia (filmes pornográficos,\ndesejos, sonhos eróticos, revistas). (A pessoa tira dos bolsos uma revista mundana, como fotonovela,\npor exemplo) (I Jo 3:8b).\n       - Se não resistirmos e dermos brecha, o diabo entra (Tg 4:7).\n       - Se nos desviarmos vêm mais 7 demônios (Lc 11:24-26).\n       - Precisamos vigiar para que satanás não encontre brecha para agir em nós, através de nós e\ncontra nós (I Pe 2:1-2).\n       O Final da peça: O cristão se reconcilia com Deus novamente.\n\n         2. NA NOVA VIDA EM CRISTO EU DEVO SER FIEL\n         Fiel ao cônjuge, nos negócios, no trabalho, fiel às autoridades espirituais, fiel nos dízimos, nas\nofertas, etc. ‗‘Ora, além disso o que se requer dos despenseiros é que cada um deles seja encontrado\nfiel.‘‘ (I Co 4:2).\n         Jesus há muito tempo preparou esse Encontro para você. Entenda que você foi alcançado pela\nmisericórdia de Deus e, por isso, não vive mais no passado: agora é nova criatura.\n\n       Fim da Palestra\n       ORIENTAÇÕES PARA O MINISTRADOR\n\n       - Fomos chamados para dar frutos de multiplicação.\n       - Precisamos guardar os ensinamentos aqui recebidos para poder derramar a vida de Deus sobre\noutras pessoas. Precisamos firmar nosso compromisso com Deus.\n       - Mencionar cada fruto da carne e rejeitá-los (pedindo que eles repitam a oração com você).\n       - Orar pela nova vida em Cristo Jesus.\n       - Ao final, mande-os declarar em voz alta:\n       - EU SOU LIVRE! (Cl 1:13-14).\n       - EU TENHO UMA NOVA VIDA EM CRISTO! (II Co 5:17).\n\n     Comente o que mais chamou a sua atenção:\n__________________________________________________________________________________\n__________________________________________________________________________________\n__________________________________________________________________________________\n_________________________________________________________________________________", "quiz": [{"q": "Qual é o texto bíblico-base da lição \"Tema: A NOVA VIDA EM CRISTO\"?", "options": ["Gálatas 5:1,4,5,13,14,16-25; Colossenses 3:5-10; II", "Gênesis 17:2; Isaías 60:22; Marcos 16:15", "1 Coríntios 12.1", "1 João 4.1"], "answer": 0}, {"q": "Qual destes é um dos tópicos estudados na lição \"Tema: A NOVA VIDA EM CRISTO\"?", "options": ["Todo O Cristão Recebe O Espirito Santo", "Defina A Armadura De Deus", "Na Nova Vida Em Cristo Devo Eliminar As Obras Da Carne", "Seja Fiel A Deus, Aos Nossos Pastores E A Sua Igreja"], "answer": 2}]}, {"num": 45, "title": "VISÃO DA IGREJA DE VENCEDORES", "verseRef": "Gênesis 17:2; Isaías 60:22; Marcos 16:15", "content": "A visão da Igreja de Vencedores é fácil, prática e possível. Não é mais uma igreja nova, mas um\nmodelo de evangelização que traz crescimento, multiplicação e muita responsabilidade com a igreja\nlocal. O alvo da visão é fazer de cada membro da igreja um discípulo do Senhor Jesus, e um líder na\nVisão da Igreja de Vencedores. Essa visão veio para nos levar a fazer exatamente o que Jesus mandou\nque fizéssemos: discípulos de todas as nações da terra. (Mt 28:19)\n       A igreja passou muito tempo fazendo coisas que eram boas, mas não davam fruto. Isso retardou\no processo da evangelização. Com a Visão da Igreja de Vencedores vamos resgatar essa área e haverá a\nmaior colheita de todos os tempos.\n       Tudo que envolve a visão relacionado com ganhar vidas, pois para isso Jesus veio, para isso\nJesus morreu, para isso Ele ressuscitou e para isso Ele vai voltar. A visão não tem um cunho\ndoutrinário, pois ela é devocional; é uma estratégia que atrai um resultado que todos podem\nexperimentar e reconhecer que, de fato, só Deus dá tamanho crescimento. ‗‘De modo que, nem o que\nplanta é alguma coisa, nem o que rega, mas Deus, que dá o crescimento.‘‘ (I Cor. 3:7).\n       Quando a visão é implantada na igreja ela gera uma restauração completa. Os líderes sentem\nalegria em compartilhar a Palavra numa dimensão ainda maior, as pessoas são treinadas para ganharem\noutras vidas, a dinâmica nas reuniões, tanto nos cultos principais quanto nas células, nas gerações,\nredes ministeriais e congregações, vem com uma explosão de alegria e todos os nossos objetivos são\nalcançados.\n       Gostaríamos de estimular os queridos irmãos a participarem da Visão para conhecerem e\ntambém nos ajudarem a ganhar mais vidas para Deus.\n\n       A escada de sucesso tem quatro degraus e cada um corresponde a uma etapa muito fundamental\nna Visão. A Escada do Sucesso poderá ser cumprida por qualquer veterano na igreja ou novo\nconvertido. Ela é processada de uma forma que além de trazer muito conteúdo bíblico, prepara a\npessoa numa velocidade muito grande e, num tempo hábil, forma um líder de sucesso.\n       Deus está trabalhando em nossa geração, nesses últimos dias, preparando um exército de santos,\nequipados para a conquista de cidades e territórios. A nuvem de Deus é dinâmica, ela move-se de\nmaneiras diferentes no decorrer dos tempos. Precisamos entender qual é a estratégia de Deus para a sua\nvolta.\n\n                                                                                   Igreja de Vencedores\n\n      1 - Escada do sucesso\n\n      Esta visão tem quatro pilares, que conhecemos como \"Escada do Sucesso\":\n\n       Enviar\n\n      Treinar\n\n      Consolidar\n\n      Ganhar\n\n        Ganha-se vidas por meio do evangelismo pessoal, por meio das Células, das Gerações, dos\nMinistérios e através dos Cultos de Celebração por perfil.\n\n      Consolida-se as vidas principalmente através do Discipulado ( encontro semanal do novo\nconvertido com seu discipulador para estudarem juntos o Discipulado) e do Encontro com Deus.\n\n      Treina-se as vidas através da Escola de Vencedores e da participação nas Células como líder\nem Treinamento.\n\n      Envia-se as vidas quando já estão preparadas para dirigirem suas próprias Células, Gerações,\nCongregações ou quando forem designadas para implantar a visão em outros territórios da nação.\n\n      O PROCESSO\n\n      Ganhar\n\n      1.Oração e Jejum por três (30 dias)\n\n      2. Evangelismo pessoal\n\n       3. Participar do culto de Celebração por perfil, Célula, Geração, Ministério e etc (anotar o nome\ne o endereço do visitante para fazer a visita ou a fonovisita).\n\nConsolidar\n\n      4.Fonovisita ou Visita em 24 horas ( Para saber o que a pessoa achou da reunião, o que ela\nmais gostou e etc..)\n\n      5.Contato Pessoal - Visita em 7 dias - para Marcar o Discipulado.\n\n      6. Ao iniciar o discipulado Marcar o Encontro com Deus.\n\n      7. Escola de Vencedores ( Classe da Maturidade - classes 101-501)\n\n      8. Se tornar Líder em Treinamento\n\n      Treinar\n\n      9. Escola de Vencedores ( Classe Regular - discipulado)\n\n      10. Oração e Jejum por três (30 dias)\n\n      11. Evangelismo pessoal\n\n      12. Iniciar sua própria Célula\n\n      13. Iniciar sua própria Geração\n\n      Enviar\n\n      14. Iniciar uma Congregação (Base)\n\n      15 Conquistar Bairro\n\n      16. Implantar Células na nova Congregação\n\n      17. Implantar Gerações na nova Congregação\n\n      18. Implantar Ministérios na nova Congregação\n\n     19. Implantar Cultos de Celebração por perfil, Oração, Culto das Gerações e Escola de\nVencedores na nova Congregação\n\n      20. Conquistar Cidade\n\n                                                                              Igreja de Vencedores\n\n      Células\n\n      2 - Dois níveis de desenvolvimento da visão: multiplicação e edificação.\n\n      2.1 - Multiplicação\n\n      Se dá por meio das células, Gerações e Congregações: as chamadas \"células e Gerações\".\n\n      O que são células\n\n       As células são as reuniões de pessoas, já integrantes do Corpo de Cristo, e de pessoas que\ndesejamos alcançar com o Evangelho. As reuniões das células possuem um objetivo de evangelismo;\nnelas, outras células são geradas, logo, são um excelente lugar para convidarmos as pessoas não\nconvertidas\n\n       Cada célula é composta de, no mínimo, Três componentes e o Máximo Doze, tal como o corpo\nque se desenvolve por meio da multiplicação celular, no entanto, entendemos que, aliada à praticidade\ndo G12, cada célula não deve ultrapassar o número de Doze componentes, pois tendo a assistência de\ntal número, já é possível a multiplicação.\n\n      Como se dá a multiplicação de células?\n\n       Sugerimos que a multiplicação da célula proceda da seguinte maneira: a metade permanece na\ncélula original enquanto os outros passam a reunir-se separadamente, dando início a outra célula.\nApartir de seis pessoas já é possível a multiplicação.\n\n      Onde as células se reúnem?\n\n       As células reúnem-se semanalmente em lares, em escritórios, em fábricas, em escolas, em\nestacionamentos, em restaurantes, enfim, em qualquer lugar fixo e com horário previamente\ncombinado.\n\n      O alvo é que células comecem a crescer e a multiplicar-se abundantemente por todos os lugares\nda nossa cidade, do nosso Estado, da nossa nação e até além fronteiras (Mt 28:19-20).\n\n      Qual o objetivo das células?\n\n        O objetivo é ganhar vidas, salvar famílias, conquistar cidades. É necessário um método\norganizado para ganhar almas, e as células, bem como a oração estratégica dos cultos de celebração por\nperfil, aliadas à consolidação, são a metodologia adotada numa Igreja em células.\n\n       A oração por três é uma estratégia fantástica para auxiliar nesse processo de multiplicação, pois\nela, de fato, quebra fortalezas e define alvos em curto prazo, dando excelentes resultados. Essa\nestratégia deve ser utilizada nas células e também nas Gerações.\n\n      Qual a ênfase das reuniões das células?\n\nA ênfase das células é a evangelização (o crescimento espiritual vem através do discipulado e do\nEncontro com Deus).\n\n       As células ainda não são maduras, portanto nas reuniões de células é necessário que se evitem\nmanifestações (dos dons espirituais) desconhecidas dos não convertidos, pois dada a falta de\nmaturidade dos participantes da célula, talvez não houvesse um julgamento eficaz das profecias, de\nlínguas, de visões, revelações, etc. Essas manifestações e unção são incentivadas nas reuniões de\noração.\n\n      Quem lidera as células?\n\n      As células são lideradas pelos membros que concluíram o discipulado ou a classe da maturidade\n– Escola de Vencedores.\n\n      Gerações\n\n      3 - Dois níveis de desenvolvimento da visão: multiplicação e edificação.\n\n      3.1 - Multiplicação\n\n      Se dá por meio das células, Gerações e Congregações: as chamadas \"células e Gerações\".\n\n      O que são gerações ?\n\n      As células também se agrupam por Gerações, tal como, no corpo as células se juntam para\nformar tecidos e órgãos.\n\n      As gerações são as reuniões de todas as células de um determinado líder. As reuniões das\ngerações possuem um objetivo de evangelismo; nelas, outras gerações são geradas, logo, são um\nexcelente lugar para convidarmos os não convertidos.\n\n      Cada geração é composta de no mínimo, uma célula e o Maximo Doze células, tal como o nome\n– G12: Geração com 12 Células.\n\n      Como se dá a multiplicação da geração?\n\n       Sugerimos que a multiplicação da geração proceda da seguinte maneira: a metade das células\npermanece na geração original enquanto a outra metade passem a reunir-se separadamente, dando\ninício a outra geração. Apartir de três células já é possível a multiplicação.\n\n      Onde as gerações se reúnem?\n\n       As gerações reúnem-se semanalmente em lares, em escritórios, em fábricas, em escolas, em\nestacionamentos, em restaurantes, enfim, em qualquer lugar fixo ou móvel e com horário previamente\ncombinado.\n\n                                                                                   Igreja de Vencedores\n\n       O alvo é que as gerações comecem a crescer e a multiplicar-se abundantemente por todos os\nlugares da nossa cidade, do nosso Estado, da nossa nação e até além das fronteiras (Mt 28:19-20).\n\n      Qual o objetivo das gerações?\n\n       O objetivo é ganhar vidas, salvar famílias, conquistar cidades. É necessário um método\norganizado para ganhar almas, e as gerações, bem como a oração estratégica dos cultos de celebração\naliadas à consolidação, são a metodologia adotada numa Igreja em células.\n\n       A oração por três é uma estratégia fantástica para auxiliar nesse processo de multiplicação, pois\nela, de fato, quebra fortalezas e define alvos em curto prazo, dando excelentes resultados. Essa\nestratégia deve ser utilizada nas células e também nas Gerações.\n\n      Qual a ênfase das reuniões das gerações?\n\n      A ênfase das gerações é a evangelização (o crescimento espiritual vem através do discipulado e\ndo Encontro com Deus).\n\n       As gerações ainda não são maduras, portanto nas reuniões de gerações é necessário que se\nevitem manifestações (dos dons espirituais) desconhecidas dos não convertidos, pois dada a falta de\nmaturidade dos participantes da geração, talvez não houvesse um julgamento eficaz das profecias, de\nlínguas, de visões, revelações, etc. Essas manifestações e unção são incentivadas nas reuniões de\noração.\n\n      Quem lidera as gerações?\n\n       As gerações são lideradas pelos lideres de geração que tiveram bom êxito na visão e concluíram\no discipulado ou a classe da maturidade – Escola de Vencedores.\n\n      Congregações\n\n      3 - Dois níveis de desenvolvimento da visão: multiplicação e edificação.\n\n      3.1 - Multiplicação\n\n      Se dá por meio das células, Gerações e Congregações:\n\n      O que são Congregações ?\n\n       As Congregações são as igreja locais. As reuniões das congregações são: Culto de Celebração,\nCulto de Oração, Culto das Gerações e Redes Ministeriais.\n\n      Cada Congregação é composta de no mínimo, duas Geração e o Maximo Seis Gerações.\n\n      Como se dá a multiplicação da Congregação?\n\nSugerimos que a multiplicação da Congregação proceda da seguinte maneira: a metade da\nCongregação original permanece no local e enquanto a outra metade passem a reunir-se separadamente\nformando assim uma nova Congregação. A partir de duas gerações já é possível a multiplicação da\nCongregação.\n\n      Onde as Congregações se reúnem?\n\n      No inicio pode ser na casa de uma pessoa de paz ( pessoa que ajuda cedendo sua casa, sendo o\nprimeiro dizimista naquele local e auxilia em tudo o que for preciso a obra de Deus. Neste período a\ncongregação ajuntará recursos para a compra do terreno ou do prédio da mesma).\n\n       Se no inicio tiver um número razoável de irmãos naquele local, a congregação poderá reunir se\nem um prédio alugado, mas nunca deverá perder o foco de ajuntar recursos para ter o terreno ou o\nprédio próprio.\n\n      Geralmente se leva de 6 a 12 meses para ajuntar recursos para a compra do terreno ou prédio.\n\n       O alvo é que as Congregações comecem a crescer e a multiplicar-se abundantemente por todos\nos lugares da nossa cidade, do nosso Estado, da nossa nação e até além das fronteiras         (Mt\n28:19-20). E formem uma área ( local onde possuem de 2-6 Congregações que se multiplicaram umas\ndas outras).\n\n      Qual o objetivo da Congregação?\n\n       O objetivo é ganhar vidas, salvar famílias, conquistar cidades. É necessário um método\norganizado para ganhar almas, e as congregações, bem como a oração estratégica dos cultos de\ncelebração aliadas à consolidação ( pegar o nome de todos os visitantes para marca uma visita em\n24hs e na semana seguinte marcar o discipulado e prepará-lo para o Encontro com Deus), são a\nmetodologia adotada numa Igreja em células.\n\n       A oração por três é uma estratégia fantástica para auxiliar nesse processo de multiplicação, pois\nela, de fato, quebra fortalezas e define alvos em curto prazo, dando excelentes resultados. Essa\nestratégia deve ser utilizada nas células, Gerações e Congregações.\n\n       A ênfase da Congregação é a evangelização (o crescimento espiritual vem através do\ndiscipulado e do Encontro com Deus).\n\n      Quem lidera as congregações?\n\n      As congregações são lideradas pelos Dirigentes de Congregações e os Auxiliares da Palavra .\n\n                                                                                    Igreja de Vencedores\n\n      As redes Ministeriais\n\n      A maioria dos cristãos deseja servir. A maioria sabe que deve servir. Mas muitos cristãos não\nsabem como podem servir da melhor maneira possível. Este é o propósito da Rede Ministerial.\n   A Rede Ministerial foi criada para auxiliá-lo a identificar tudo o que Deus lhe proporcionou para\nservir (sua paixão ministerial, seus dons espirituais e seu estilo pessoal - chamado o Perfil de Servo),\nde forma que você possa dar sua contribuição única ao Corpo de Cristo num lugar de serviço\nsignificante. Aos olhos de Deus, cada um é \"nota 10\" em alguma área! Você Sabe qual é a área em que\nvocê é \"nota 10\"?\n\n      Da mesma forma que o corpo humano não poderia funcionar bem se os olhos, ouvidos e mãos\nnão estivessem cumprindo seus papéis, o Corpo de Cristo, a Igreja, não poderá funcionar da forma que\nDeus planejou se cada cristão não fizer sua parte. Quando você desempenhar sua parte, construirá\nrelacionamentos duradouros e fará uma diferença para o Reino com sua vida.\n   A Rede Ministerial pode ajudá-lo a colocar as PESSOAS CERTAS, nos LUGARES CERTOS,\npelas RAZÕES CERTAS. Para isso há um processo de três passos: primeiro passo: Descoberta;\nsegundo passo: Gabinete e terceiro: Serviço.\n\n     DESCOBERTA\n\n    A Descoberta da Rede Ministerial serve para que você possa entender melhor o plano de Deus\npara sua vida, ou seja, quem você é, qual o propósito da sua Igreja e o papel singular que você pode\ndesempenhar no Corpo de Cristo. Com isto você descobrirá:\n\n      A Paixão ministerial que Deus lhe deu, indicando onde você deve servir.\n\n      Os Dons espirituais que Deus lhe deu, indicando o que você deve fazer.\n\n      O Estilo pessoal que Deus lhe deu, indicando como você deve servir. Juntos, esses itens formam\nseu Perfil de Servo e indicam o que você pode fazer de melhor no Corpo de Cristo.\n\n     GABINETE\n\n     Após a identificação da sua paixão, seus dons e seu estilo pessoal (Perfil de Servo), através da\nDescoberta da Rede Ministerial, você terá a oportunidade de conversar com seu dirigente. Ele o\najudará a encontrar opções de ministério na congregação, de acordo com seu Perfil de Servo. Você\npoderá conversar sobre os vários ministérios existentes e conhecê-los melhor. Existirá um, com o qual\nvocê realmente se identificará.\n\n     SERVIÇO\n\n     O alvo da Rede Ministerial é o serviço. Não apenas a descoberta do seu perfil ou até mesmo a\nconversa com o dirigente, mas o serviço. Você tem um ministério a desempenhar no Corpo de Cristo,\nalgo singular que somente você pode fazê-lo.\n\n\"Pois somos feituras dEle, criados em Cristo Jesus para as boas obras, as quais Deus de antemão\npreparou para que andássemos nelas.\" (Ef.2.10).\n\nA PAIXÃO MINISTERIAL\n\n       Quando conhecermos a nossa paixão saberemos aonde deveremos investir nosso tempo.\nImportamo-nos com algumas coisas mais que outras, e desejamos fazer diferença em algum lugar.\nDentre outros fatores, a paixão é um desejo emocional forte que nos direciona a causar impacto com\ngrupos de pessoas (crianças, adolescentes, jovens, mulheres, homens, casais, famílias; louvor,\nteatro, danças, retiros espirituais, Ensino, área social, dirigente de congregação, intercessão e\netc.).\n\nOS DONS ESPIRITUAIS\n\n     Os dons espirituais são habilidades divinas dadas pelo Espírito Santo para cada cristão, segundo o\ndesígnio e a graça de Deus. Ele tem um propósito para cada um de nós.\n\nO ESTILO PESSOAL\n\n      O estilo pessoal que Deus nos deu indica a maneira como nós preferimos nos relacionar com o\nmundo e com as pessoas ao nosso redor. Enquanto há muitos modelos disponíveis hoje, para nos\najudar a entender os temperamentos, as personalidades ou os estilos pessoais, veja estes dois elementos\npráticos e essenciais para obter um desempenho máximo. O primeiro: considere como as pessoas são\nmotivadas. O Segundo: considere como elas se organizam.\n\n      Quanto à motivação, num extremo estão aquelas pessoas que são motivadas pelos\nrelacionamentos e por estarem prioritariamente envolvidos com pessoas. No outro extremo há aquelas\npessoas que são motivadas pelas tarefas.\n\n     Quanto à organização, existem aquelas pessoas que organizam seu mundo com estruturas, outros\norganizam seu mundo sem muitas estruturas. As pessoas \"estruturadas\" gostam de terminar as coisas\nAGORA!!! As \"não estruturadas\" preferem deixar as opções em aberto para ver o que acontecerá,\ntomando decisões e terminando os trabalhos no último momento possível.\n\n     Cada pessoa é um ministro com dons e chamado divino. As pessoas fazem relativamente pouco\npara o Reino. Dons e chamados são liberados através do envolvimento com outras pessoas,\nespecialmente em grupos pequenos, onde existem relacionamentos comprometidos e\nsaudáveis. Portanto o Ministério é um grupo de pessoas com o mesmo sonho e o mesmo propósito.\n\n     Deus tem mandado um recado insistente para você: Ele quer que você seja um servo, e que seus\ndons e conhecimentos sejam usados na sua obra.\n\n     Hoje é o dia de você descobrir seu chamado ministerial, em qual desses ministérios você se\nencaixa melhor?\n\n                                                                                    Igreja de Vencedores\n\nREDES MINISTERIAIS\n\n     Redes Ministeriais são as organizações de equipes homogêneas e heterogenias, com objetivos\nespecíficos, promovendo uma interação maior daqueles que estiverem envolvidos ou que se forem\nchegando para a família cristã; direcionados para atingirem os alvos propostos pela igreja.\n\n     Rede Ministerial Homogenia: Rede Composta Pelo Mesmo Grupo - crianças, adolescentes,\njovens, mulheres, homens, casais, famílias e etc..\n\n     Rede Ministerial Heterogenia: Rede Mista em Grupo - louvor, teatro, danças, retiros espirituais,\nEnsino, área social, dirigente de congregação, intercessão e etc.\n\n     Se porventura não exista um grupo funcionando conforme o dom da pessoa isso não impede\nque seja criado um novo grupo conforme o dom da mesma.\n\n     Escolha ainda hoje um grupo que seja conforme seu dom, sua paixão e seu ministério, e\nsirva a Deus com amor e intensidade...\n\n     *PESSOAS CERTAS, nos LUGARES CERTOS, pelas RAZÕES CERTAS.\n\n   * PARE UM POUCO E PENSE EM QUAL GRUPO VOCÊ GOATARIA DE ATUAR\nPARA SERVIR MELHOR O SENHOR?\n\n       \"Servi uns aos outros, cada um conforme o dom que recebeu, como bons despenseiros da\nmultiforme graça de Deus... se alguém serve, faça-o na força que Deus supre, para que em todas as\ncousas seja Deus glorificado...” (1 Pe 4: 10, 11)\n\n      Os 12\n\n      Por que \"doze\"?\n\n       \"E levou-me em espírito a um grande e alto monte, e mostrou-me a santa cidade de Jerusalém,\nque descia do céu da parte de Deus, tendo a glória de Deus; e o seu brilho era semelhante a uma pedra\npreciosíssima, como se fosse jaspe cristalino; e tinha um grande e alto muro com doze portas, e nas\nportas doze anjos, e nomes escritos sobre elas, que são os nomes das doze tribos dos filhos de Israel.\n\n      Ao oriente havia três portas, ao norte três portas, ao sul três portas, e ao ocidente três portas. O\nmuro da cidade tinha doze fundamentos, e neles estavam os nomes dos doze apóstolos do Cordeiro. E\naquele que falava comigo tinha por medida uma cana de ouro, para medir a cidade, as suas portas e o\nseu muro.\n\nA cidade era quadrangular; e o seu comprimento era igual à sua largura. E mediu a cidade com a\ncana e tinha ela doze mil estádios; e o seu cumprimento, largura e altura eram iguais. Também mediu o\nseu muro, e era de cento e quarenta e quatro côvados, segundo a medida de homem, isto é, de anjo.\n\n       O muro era construído de jaspe, e a cidade era de ouro puro, semelhante a vidro límpido. Os\nfundamentos do muro da cidade estavam adornados de toda espécie de pedras preciosas. O primeiro\nfundamento era de jaspe; o segundo, de safira; o terceiro, de calcedônia; o quarto, de esmeralda; o\nquinto, de sardônica; o sexto, de sárdio; o sétimo, de crisólito; o oitavo, de berilo; o nono, de topázio; o\ndécimo, de crisópraso; o undécimo, de jacinto; o duodécimo, de ametista. As doze portas eram doze\npérolas: cada uma das portas era de uma só pérola; e uma praça da cidade era de ouro puro,\ntransparente como vidro. Nela não vi santuário, porque o seu santuário é o Senhor Deus Todo-\nPoderoso, e o Cordeiro.\n\n       A cidade não necessita nem do sol, nem da lua, para que nela resplandeçam, porém a glória de\nDeus a tem alumiado, e o Cordeiro é a sua lâmpada. As nações andarão à sua luz; e os reis da terra\ntrarão para ela a sua glória. As suas portas não se fecharão de dia, e noite ali não haverá; e a ela trarão a\nglória e a honra das nações.\n\n      E não entrará nela coisa alguma impura, nem o que pratica abominação ou mentira; mas\nsomente os que estão inscritos no livro da vida do Cordeiro. E mostrou-me o rio da água da vida, claro\ncomo cristal, que procedia do trono de Deus e do Cordeiro.\n\n        No meio da sua praça, e de ambos os lados do rio, estava a árvore da vida, que produz doze\nfrutos, dando seu fruto de mês em mês; e as folhas da árvore são para a cura das nações. Ali não haverá\njamais maldição. Nela estará o trono de Deus e do Cordeiro, e os seus servos o servirão, e verão a sua\nface; e nas suas frontes estará o seu nome.\n\n      E ali não haverá mais noite, e não necessitarão de luz de lâmpada nem de luz do sol, porque o\nSenhor Deus os alumiará; e reinarão pelos séculos dos séculos.\" (Ap 21:1-27 e 22: 1-5)\n\n       Doze é o número que fala da ciência e da totalidade perfeita; na economia de Deus é a perfeição\nna ciência, no conhecimento.\n\n       Um dia tem doze horas, uma noite outras doze. O sol rege doze horas e a lua reflete o brilho do\nsol por mais doze horas.\n\n       Israel tinha doze estandartes quando saiu do Egito (Nm 10:11-28). Jacó teve doze filhos dos\nquais saíram as doze tribos de Israel (Ex 28:21). Josué separou doze pedras, e nelas escreveu os nomes\ndas doze tribos (Js 4:1-10). Doze homens foram espiar a Terra Prometida. Quantos profetizaram em\nIsrael no tempo de Moisés? Seis grupos de doze. Davi tinha doze chefes das tribos de Israel (1 Cr\n29:6), Salomão tinha doze chefes, chamados príncipes (1 Rs 4:7). Os guerreiros eram organizados em\ndoze pelotões. Para formar uma comunidade legal em Israel, era necessário doze homens (dez homens\nalém do oficiante e da autoridade rabínica). Doze eram os pães e doze os peixes usados para o, milagre\nda multiplicação, doze foram os cestos recolhidos. Doze anos permaneceu doente a mulher\n\n                                                                                        Igreja de Vencedores\n\nhemorrágica, até que encontrou a Cristo; também doze anos tinha a filha de Jairo quando foi\nressuscitada por Jesus.\n\n       Quantas portas tem a Nova Jerusalém? Doze. Quantos tronos? Doze. Quantos anos tinha Jesus\nquando ascendeu a Jerusalém para fazer o \"BarMitshvah\" (Lc 2:42)? Doze. Quantos eram os discípulos\nde Jesus? Doze (Lc 6:13). Quantos apóstolos foram ungidos? Doze (Mt 10:3 e   At 6-2).\n\n       Na pedagogia moderna diz-se que a melhor quantidade para formar uma classe, a fim de facilitar\no aprendizado, é doze. Doze é o número da ciência pedagógica, doze é o número do governo perfeito,\ndoze é o número do equilíbrio e da funcionalidade, doze é o número que fala da harmonia, do\nequilíbrio e dos resultados. No Didaquê o número doze significa administração e acompanhamento\nqualitativo.\n\n      Billy Graham, Ralph Neighbor, Laurence Kong, David Yong Cho, aprovam a visão dos 12 e o\nestimulam, pois essa é a linguagem para a nova fase da igreja do Senhor Jesus neste tempo.\n\n      A visão dos 12 deve estar no peito. (Ex 28:15-21). A visão dos 12 nos devolve o sacerdócio, nos\ndá uma equipe eficiente (Ex 28:3). Cada um dos doze é uma pedra preciosa de valor.\n\n      Qual a função da visão dos 12 e Como se forma uma visão dos 12?\n\n      A visão dos 12 trabalham para conquistar as Células:\n\n       A Geração tem como meta 12 células. No inicio é 1 célula que se multiplica em 3 ...          as 3\ncélulas se multiplicam em 6... as 6 células se multiplicam em 12 .... e as 12 células se multiplicam em\numa nova geração..., ao atingirem 12 células a geração se multiplica formando assim 2 gerações (\nApartir de 3 células a geração poderá se multiplicar).\n\n       O sucesso das multiplicações está na preparação dos líderes em treinamento. Se não houver\nlideres em treinamento não haverá multiplicação.\n\n      O discipulado com novos convertidos e pessoas enviadas para o Encontro com Deus são peças\nfundamentais para a multiplicação.\n\n      Qual o objetivo da visão dos 12?\n\n       O objetivo da visão dos 12 é fazer de cada membro um líder, é possibilitar que toda a igreja seja\nministrada na mesma linguagem, que todos sejam acompanhados individualmente. O objetivo\nfuncional é que todos os componentes da visão dos 12 passem pela Escola de Vencedores ( Classe da\nMaturidade) e pelo Discipulado junto com o Encontro com Deus, pois, nessa visão, todos são\nconvocados a serem líderes e precisam de treinamento.\n\n      Jesus era disciplinado em oração. Ele orou a noite toda para escolher seus doze discípulos, para\nformar ses grupo de 12 (Lc 6:12-16). É necessário orar por cada um dos seus! É necessário gerá-los e\nconsolidá-los: esse é o objetivo que fará com que se tenha grupos sadios.\n\n      Quais os cuidados que se deve tomar na implantação da visão dos 12?\n\nA visão dos doze é por demais zelosa, não se a pode macular, pois dessa forma atrapalharia o\ncrescimento. Uma vez abraçando-a, não se deve envolver com movimentos que não tenham o objetivo\nde nutrir a visão, pois o Senhor nos chama emergencialmente para conquistarmos territórios, com\nmuitíssima qualidade. Não se pode perder tempo com o que não dá fruto. É tempo de qualidade com\nquantidade!\n\n      O que se pode esperar da visão dos 12?\n\n       A visão dos 12 é organizada e inteligente, mas demanda tempo, envolvimento e compromisso.\nA visão dos 12 gera uma profunda amizade. Foi na convivência cotidiana que Jesus obteve o melhor\nrelacionamento com os seus discípulos. A visão dos 12 traz credibilidade no relacionamento, pois as\nvidas são vistas como um verdadeiro tesouro. Debaixo desta visão é desenvolvida um grande senso de\nresponsabilidade de uns para com os outros, e isso sem sobrecarga, mas com alegria.\n\n       Na visão dos 12 não há competição; todos se alegram com a multiplicação. Nosso maior\ninteresse é ganhar vidas, consolidá-las, treiná-las e enviá-las, dentro do discipulado. A unção da\nmultiplicação é maior que a competitividade.\n\n      A visão dos 12 atrai a unção. Quando nos envolvemos no mesmo objetivo, temos um resultado\nem comum, e atraímos a glória de Deus. Nessa visão, as reuniões ministeriais, ou as de celebração,\nlevam-nos a ver o que Deus tem feito em quantidade e qualidade, por isso há muita alegria com a\nmultiplicação e com o sucesso do outro.\n\n      A visão dos 12 nos torna responsável pela visão da igreja: nele há oportunidade para que todos\nsejam bem doutrinados e nutram uma só linguagem e vivam os propósitos de Deus. O sucesso da visão\ndepende de persistirmos nela e de envolvermos todo o Corpo em unidade.\n\n      A visão dos 12 não é um ministério de oportunidade, porém de chamado, e, devido ao chamado\nde Deus, todos têm a oportunidade de obter excelentes resultados através dele.\n\n      Como ter sucesso na visão?\n\n      • Entender que não devemos andar pelo método, mas pela unção.\n\n      • Estar disposto a pagar o preço, pois essa visão é fácil, mas não é relapsa.\n\n      • Lutar contra as fortalezas do inferno, e enfrentarmos o principado da cidade, para\nconquistarmos o território.\n\n     • Nutrir zelo pela visão. Quando cremos que A visão dos 12 é o melhor de Deus para nossa vida,\ndevemos zelar por ela e não enfraquecermos no processo de crescimento da visão.\n\n      • Renunciar a muitas coisas no nosso ministério pessoal, principalmente, renunciar a tudo aquilo\nque Deus nunca pediu que fizéssemos.\n\n                                                                                      Igreja de Vencedores\n\n       • Realizar exatamente tudo aquilo que Deus pede que façamos.\n\n       • Ter uma vida santa e irrepreensível.\n\n       A visão dos 12 não se capta pelo método, mas pela unção.\n\n                         GANHAR – CONSOLIDAR – TREINAR – ENVIAR\n\nESCADA DO SUCESSO\n    GANHAR                   CONSOLIDAR                    TREINAR               ENVIAR\n\nOrar e Jejuar por três    Fonovisita ou Visita em Escola de Vencedores Iniciar Uma\npessoas (30dias)          24 h                     (Classe da Maturidade) Congregação –\n                                                                          CONQUISTAR\n                                                                          BAIRRO\nEvangelismo pessoal       Contato pessoal (visita Orar e Jejuar por três  Implantar Células e\n                          em sete dias – marca o pessoas (30dias)         Gerações na nova\n                          discipulado)                                    congregação\nParticipar de Célula e    Ao iniciar o discipulado Evangelismo pessoal    Implantar Ministérios e\nGeração                   Marcar o Encontro com                           Cultos de Celebração\n                          Deus                                            por perfil (REDES),\n                                                                          Oração, Cultos das\n                                                                          Gerações\nParticipar Celebração     Escola de Vencedores Iniciar uma célula         Multiplicar\npor perfil (REDES)        (Classe da Maturidade)                          Congregação\nParticipar Culto de       Líder em Treinamento Iniciar uma Geração        Implantar Área\nCelebração\n                                                                          CONQUISTAR\n                                                                          CIDADE\n\n       Fim da palestra\n\n       ORIENTAÇÃO PARA O MINISTRADOR\n\n      Orar e mencionar os pontos que foram explanados, levando-os a desejar seguir o comando do\nSenhor e multiplicar.\n\n       Ministre a unção de multiplicação e de conquista.\n\n     Comente o que mais chamou a sua atenção:\n__________________________________________________________________________________\n__________________________________________________________________________________\n__________________________________________________________________________________\n_________________________________________________________________________________", "quiz": [{"q": "Qual é o texto bíblico-base da lição \"Tema: VISÃO DA IGREJA DE VENCEDORES\"?", "options": ["Gênesis 17:2; Isaías 60:22; Marcos 16:15", "Efésios 5.18", "Eclesiastes 3.11", "Salmo 139.2"], "answer": 0}, {"q": "Qual destes é um dos tópicos estudados na lição \"Tema: VISÃO DA IGREJA DE VENCEDORES\"?", "options": ["Quais São Os Cinco Propósitos De Uma Igreja Bíblica?", "O Que É Batismo No Espirito Santo?", "Oração E Jejum Por Três (30 Dias)", "Damos Glória A Deus Ao Nos Tornar Como Cristo"], "answer": 2}, {"q": "Qual destes tópicos NÃO faz parte da lição \"Tema: VISÃO DA IGREJA DE VENCEDORES\"?", "options": ["Se Tornar Líder Em Treinamento", "Defina Igreja Em Células", "Evangelismo Pessoal", "Implantar Células Na Nova Congregação"], "answer": 1}]}, {"num": 46, "title": "BATISMO NO ESPÍRITO SANTO", "verseRef": "Atos 1.8", "content": "\"Mas recebereis poder, ao descer sobre vós o Espírito Santo, e ser-me-eis testemunhas, tanto\nem Jerusalém, corno em toda a Judéia e Samária, e até os confins da terra.\" (At 1.8)\n\n      O Batismo no Espírito é a experiência de se receber um revestimento de poder (Lc. 24:49), um\nbatismo com fogo (Mt. 3:11), onde a pessoa é preenchida, é envolvida pela glória de Deus. O batismo\nno Espírito significa a plenitude do Espírito possuindo a plenitude do homem.\n\n      Ninguém pode ser 100% feliz na vida ministerial se não for cheio do Espírito Santo.\n\n      • É para todos os que professam a fé em Jesus (Jo 14:12-17).\n\n      • É um dos alvos principais de Cristo (Mt. 3:1 1).\n\n      • Significa experimentar a plenitude (At 1:5 e 2:4).\n\n      1 - O propósito do batismo no Espírito Santo.\n\n      \"...concernente a Jesus de Nazaré, como Deus o ungiu com o Espírito Santo e com poder; o\nqual andou por toda parte, fazendo o bem e curando a todos os oprimidos do Diabo, porque Deus era\ncom ele.\" (At 10:38)\n\n      • Manifestar o Espírito a cada um, individualmente, visando uma atuação útil na obra de Deus.\nUma manifestação do Espírito Santo na qual a Sua presença, a Sua glória, e a Sua operação fazem-se\npresentes através de cada um dos seus colaboradores. (1 Co. 12:7).\n\n      • Capacitar para realização de grandes obras em nome de Jesus (Jo. 14:12,16- l 8 / Jo. 16:14).\n\n      • Capacitar para um testemunho eficaz, testemunho com poder (At. 1:8).\n\n       • Dar a identidade de filhos, herdeiros e co-herdeiros com Cristo. O selo do Espírito Santo é\nnossa identidade no mundo espiritual (Ef. 1:13). Quando estamos cheios do Espírito Santo o mundo\ndas trevas nos identifica e teme. O revestimento do Espírito é uma poderosa arma contra satanás, é um\nrevestimento total.\n\n                                                                                    Igreja de Vencedores\n\n       • Para sermos cristãos tivemos que nascer do Espírito de Deus. Para vivermos como cristãos e\nalcançarmos a maturidade depois do novo nascimento, devemos ser guiados constantemente pelo\nEspírito Santo. Através do Espírito Santo somos elevados a um plano de vida sobrenatural.\n\n       • Na história da Igreja, no decorrer do tempo, muitos receberam o mover do Espírito, mas não\naproveitaram esse presente, não fizeram uso desse dom. Mas, hoje vivemos em meio a uma geração\nprofética e Deus derramará do Seu Espírito sobre toda a carne. \"Porque a terra se encherá do\nconhecimento da glória do Senhor, como as águas cobrem o mar.\" (Is 11:9).\n\n      2 - Os resultados do batismo no Espírito Santo\n\n      • Mais sensibilidade contra o pecado. (Jo 16:8)\n\n      • Uma vida que glorifica a Jesus Cristo. (Jo 16:13,14; At 4:33)\n\n      • Mensagens proféticas e louvores. (At 2:4-17; 1 Co 14:2 e 15)\n\n      • Visões da parte do Espírito. (Ap 1:9-20)\n\n      • Manifestação de dons espirituais. (1 Co 12:4-10)\n\n      • Maior desejo de orar e interceder. (At 2:41,42; Rm 8:26)\n\n      O Espírito Santo foi a única fonte de poder no ministério de Jesus. Foi a unção de Deus que\nlevou Davi à vitória contra Golias. Assim também em nós, é a unção de Deus em nossas vidas que\nforma a identidade de guerreiros do Senhor.\n\n      3 - Condições para receber o \"batismo\" no Espírito Santo\n\n      • Aceitar a Jesus corno Senhor e Salvador. (At 2:38-40)\n\n      • Buscar e obedecer a Deus. (At 5:32)\n\n      • Consagrar-se e dedicar-se a Ele. (2 Tm 2:21)\n\n      • Desejar esse batismo. O Cristão deve ter grande fome e sede pelo batismo do Espírito. (Jo\n7:37-39; Mt 5:6)\n\n      • Pedir a Deus em oração. (Lc 11: 13 / Rm 8:14-17)\n\n      4 - Falar em línguas é uma das evidências do batismo no Espírito Santo (At 2:4; 10:44,46; 19:6).\n\n      • Falar em línguas é uma manifestação sobrenatural do Espírito Santo.\n\n      • É uma expressão vocal inspirada pelo Espírito, mediante a qual o crente fala numa língua que\nnunca aprendeu (At 2:4; 1 Co. 14:14-15).\n\n      • As línguas podem ser humanas (At 2:6) ou desconhecidas na terra (1 Co. 13:1; 14:2).\n\n• Falar em línguas pode ser um sinal externo do batismo no Espírito Santo, mediante o qual o\nespírito do Cristão e o Espírito Santo se unem em louvores, orações ou profecias.\n\n      • Falar em línguas é um dom (1 Co. 12:4-10)\n\n      Tem dois propósitos:\n\n      Falar em línguas com interpretação para edificação (1 Co. 14:5,6,13-17)\n\n       Falar em línguas como devoção entre o Cristão e Deus, para edificação pessoal (1 Co.\n14:2,4,14).\n\n      5 - A necessidade de se estar cheio do Espírito Santo\n\n       • O propósito de Deus é que a sua igreja esteja sempre abastecida com o óleo do Espírito, esteja\ncheia do Espírito Santo (Mt 25:1-13).\n\n      • O enchimento traz nova graça e novo ânimo.\n\n      • O Espírito Santo nos adestra.\n\n      • O Espírito Santo traz luz sobre o nosso entendimento (Ef. 1: 18).\n\n       • O batismo no Espírito é uma conquista de Jesus para que a Sua igreja viva em plenitude (Jo\n16:7; Lc 24:49).\n\n      • Somos ungidos para vencer as hostes de satanás, e nunca para sermos vítimas de seus ardis.\n\n      6 - Conclusão\n\n       Todos nós precisamos ser cheios do Espírito Santo, necessitamos ser renovados Nele. Não\nduvidemos de milagres, porque quando vivemos no mover do Espírito Santo, tudo pode acontecer em\nnossa vida. Neste momento, ministraremos esse batismo, através de Jesus, que é Aquele que batiza no\nEspírito Santo.\n\n      Fim da palestra\n\n      ORIENTAÇÃO PARA O MINISTRADOR\n\n      1. Mande afastar as cadeiras ou bancos para que haja mais espaço.\n\n      2. Comece louvando e exaltando o nome do Senhor Jesus.\n\n      3. Utilize músicas que enfatizem a presença e o batismo no Espírito Santo.\n\n       4. Comece a ministrar em cada pessoa o batismo no Espírito Santo. Permita que aqueles que\noram em línguas orem livremente, e que os que ainda não oram, sejam ministrados, para que recebam\nesse sinal.\n\n                                                                                    Igreja de Vencedores\n\n       Obs.: Nesse momento muitos serão cheios do Espírito Santo, estarão orando em línguas e o\nEspírito Santo se moverá livremente. Deixe-os serem ministrados por Deus.\n\n      MOMENTO SURPRESA\n\n       1. Após a oração e ministração do batismo no Espírito Santo os encontristas são convidados a\nvoltarem a sentar-se, fecharem os olhos por algum tempo e permanecerem orando.\n\n      2.      Diga para que todos sentem se no chão e não abra os olhos, pois irão receber algo do\nSenhor.\n\n      3. Nesse instante as lembranças-surpresa são arrumadas em uma mesa ou no palco. Toda a\nequipe que trabalhou no Encontro deve ficar alinhados um ao lado do outro, na frente, impedindo que\nos encontristas vejam as lembranças. As mesmas devem estar identificadas com o nome de cada\nencontrista, de forma bem legível.\n\n      4. Pede-se que ninguém abra as lembranças até que todos as recebam. Duas pessoas passam a\nchamar os encontristas pelo nome, enquanto outras vão entregando os presentes. Quando todos\nreceberem. O ministrador deverá pedir para que todos abram seus presentes.\n\n      5. Coloca-se uma música ao fundo, enquanto eles abrem os presentes. Este é um momento\nmuito especial e deve ser preparado pela Equipe do Correio.\n\n      6. Deixe-os a vontade: uns choram, outros riem, outros lêem as cartas emocionados, etc.\n\n      7.    Após este momento o líder espiritual pode perguntar: Como é o Encontro? Todos\nresponderão: É TREMENDO!!!\n\n      8. Este é o momento para lembrar aos encontristas que terão a responsabilidade de:\n\n      • Irem Escola de Vencedores – Classe da Maturidade (obrigatoriamente).\n\n      • Concluir o Discipulado.\n\n       9. Finalize o Encontro com uma oração breve de agradecimento a Deus, despedindo-os em paz e\ndizendo que os aguardará à noite para o culto de celebração na Igreja. A condução deve deixar o grupo\nna porta da igreja, o que facilita que cheguem do encontro e possam ir direto para o culto de\ncelebração.\n\n* Entrega dos relógios e Celulares das pessoas.\n\n     Comente o que mais chamou a sua atenção:\n__________________________________________________________________________________\n__________________________________________________________________________________\n__________________________________________________________________________________\n_________________________________________________________________________________\n\nIgreja de Vencedores", "quiz": [{"q": "Qual é o texto bíblico-base da lição \"Tema: BATISMO NO ESPÍRITO SANTO\"?", "options": ["Lucas 12.43,44", "Atos 1.8", "Tiago 5.17,18", "2 Timóteo 4.7"], "answer": 1}, {"q": "Qual destes é um dos tópicos estudados na lição \"Tema: BATISMO NO ESPÍRITO SANTO\"?", "options": ["Comece Louvando E Exaltando O Nome Do Senhor Jesus", "Mariolatria", "Por Que E Quando Devemos Evangelizar", "Efeitos Da Obediência"], "answer": 0}, {"q": "Qual destes tópicos NÃO faz parte da lição \"Tema: BATISMO NO ESPÍRITO SANTO\"?", "options": ["Utilize Músicas Que Enfatizem A Presença E O Batismo No Espírito Santo", "Mande Afastar As Cadeiras Ou Bancos Para Que Haja Mais Espaço", "Comece Louvando E Exaltando O Nome Do Senhor Jesus", "Defina O Discipulado"], "answer": 3}]}];
