ta ou cinqüenta vezes para realmente captá-la. O\nproblema se repete periodicamente, e pensamos \"De novo, não! Eu já aprendi isso!\", mas Deus é quem\nde fato sabe o de que precisamos.\n      A história de Israel demonstra quão depressa nos esquecemos das lições que Deus nos ensina e a\nrapidez com que retornamos aos velhos padrões de comportamento.\n      Temos medo de humildemente encarar a verdade sobre nós.\n      Já destaquei que a verdade nos libertará, mas com freqüência nos torna, antes de tudo, infelizes.\n      O medo do que poderíamos descobrir se encarássemos honestamente os defeitos de nosso caráter\nnos mantém aprisionados, negando a realidade.\n      Somente quando se permite que Deus brilhe a luz de sua verdade sobre nossas faltas, fracassos e\ntraumas é que podemos começar a trabalhar neles.\n      É por isso que não podemos crescer sem uma postura de humildade dis posta para a instrução.\n\n      III. Crescer é quase sempre doloroso e assustador.\n      Não há crescimento sem mudanças, não existem mudanças sem medo ou perdas e não há perda\nsem dor.\n      Toda mudança envolve perda de algum tipo.\n      Você deve se livrar dos velhos hábitos para experimentar os novos.\n      Hábitos levam tempo para se desenvolver. Lembre-se de que seu caráter é a soma total de seus\nhábitos.\n      Você não pode se dizer gentil, a menos que seja habitualmente gentil; você demonstra gentileza\nsem nem mesmo pensar nisso.\n      Você não pode afirmar que é integro, a menos que tenha o hábito de ser honesto.\n      Só há uma maneira de desenvolver os hábitos do caráter semelhante ao de Cristo: praticá-los; e\nisso leva tempo!\n      Não existem hábitos instantâneos.\n      Paulo exortou Timóteo: Pratique essas coisas. De dique sua vida a elas, para que todos possam\nver seu progresso.\n\nCom tempo de prática, você fica bom em qualquer coisa.\n     A repetição é a mãe do caráter e da habilidade.\n     Os hábitos que constroem o caráter são em geral chamados \"disciplinas espirituais\", e é para isso\nque existe o Discipulado (o Discipulado não tem fim na vida cristã ).\n     Não se apresse à medida que você cresce em direção à maturidade espiritual, existem várias\nformas de cooperar com Deus durante o processo.\n     Creia que Deus está operando em sua vida,mesmo quando você não o sente.\n     O crescimento espiritual é um trabalho às vezes tedioso, que progride um passo por vez. Conte\ncom uma melhora gradual.\n     A Bíblia diz: Tudo na terra tem seu próprio tempo e sua própria estação.\n     Na vida espiritual, também existem estações.\n     Às vezes você terá uma curta e intensa explosão de crescimento (estação da primavera), seguida\npor um período de estabilidade e provações (outono e inverno).\n\n      IV. Mantenha um caderno ou um diário com as lições aprendidas.\n      Não se trata de um diário dos acontecimentos, mas de um registro do que você aprendeu. Anote\nos discernimentos e lições de vida que Deus lhe ensina sobre ele, sobre você, sobre a vida, sobre\nrelaciona mentos e sobre tudo o mais.\n      Registre-os para que você possa revisá-los, relembrá-los e passá-los para a próxima geração.\n      A razão pela qual devemos reaprender as lições é que as esquecemos. Reler seu diário espiritual\nregularmente pode lhe poupar muito sofrimento e desgosto desnecessários.\n      A Bíblia diz: É crucial que prestemos muita atenção no que ouvimos, de modo que não nos\ndesviemos.\n      Você foi criado para servir a Deus.\n      A Bíblia diz: [Deus] nos criou para que fizéssemos as boas obras que ele já havia preparado para\nnós.\n      Essas \"boas obras\" são o seu serviço.\n      Sempre que você serve às pessoas de alguma forma, você está na verdade servindo a Deus e\ncumprindo um de seus propósitos.\n      O que Deus disse para Jeremias também vale para você: Antes que o fizesse no útero de sua mãe,\neu o escolhi.\n      Antes que você nascesse, eu o separei para uma obra especial?\n      Você foi posto neste planeta para uma missão especial.\n      Você foi salvo para servir a Deus.\n      A Bíblia diz: Foi ele quem nos salvou e nos escolheu para o seu santo trabalho, não porque\nmerecêssemos, mas porque esse era o seu plano muito antes do princípio do mundo — mostrar o seu\namor e a sua bondade para conosco por meio de Cristo.\n      Deus o redimiu para que você pudesse exercer sua \"santa vocação\".\n      Você não foi salvo pelo serviço, mas foi salvo para o serviço.\n      No Reino de Deus você tem um lugar, um propósito, um papel e uma função a cumprir.\n      Isso dá a sua vida enorme importância e valor.\n      Comprar sua salvação custou a Jesus a própria vida.\n      A Bíblia nos recorda: Vocês foram comprados por alto preço. Portanto, glorifiquem a Deus com o\nseu próprio corpo.\n      Não servimos a Deus por causa de culpa, medo ou mesmo obrigação, mas pela alegria e profunda\ngratidão pelo que ele fez por nós.\n      Nós lhe devemos a vida. Pela salvação, nosso passado foi perdoado, nosso presente faz sentido e\nnosso futuro é seguro.\n\n                                                                                    Igreja de Vencedores\n\n     À luz dessas incríveis vantagens, Paulo concluiu:\n     Por causa da grande misericórdia divina, peço que vocês se ofereçam completamente a Deus\ncomo um sacrifício vivo, dedicado ao seu serviço.\n     O apóstolo João ensinou que nossos préstimos amorosos às outras pessoas mostram que somos\nverdadeiramente salvos.\n     Ele disse: Sabemos que já passamos da morte para a vida porque amamos nossos irmãos.\n\n    Se não tenho nenhum amor pelos outros, nenhum desejo de ajudar as pessoas e me preocupo\nsomente com minhas necessidades, deveria questionar se Cristo está realmente na minha vida.\n    Um coração salvo é um coração que deseja servir.\n\n     Outro termo relativo a servir a Deus que é mal compreendido pela maioria das pessoas é a palavra\nministério.\n     Quando a maioria das pessoas escuta \"ministério\", pensa em pastores, igrejas e etc..., mas Deus\ndiz que cada membro de sua família é um ministro.\n     Na Bíblia, as palavras servo e ministro são sinônimas, assim como serviço e ministério.\n     Se você é cristão, é um ministro e, quando está servindo, está ministrando.\n     Quando a sogra de Pedro, enferma, foi curada por Jesus, ela instantaneamente se levantou e\ncomeçou a servi-lo, usando seu novo dom de saúde.\n     É exatamente isso que devemos fazer.\n     Somos curados para ajudar aos outros.\n     Somos abençoados para ser uma bênção.\n     Somos salvos para servir, e não para ficar sentados esperando pelo céu.\n     Você nunca se perguntou por que Deus não nos leva para o céu, imediatamente após aceitarmos\nsua graça?\n     Por que ele nos deixa em um mundo decadente?\n     Ele nos deixa aqui para cumprir seus propó sitos.\n     Uma vez que você esteja salvo, Deus pretende usá-lo para seus objetivos.\n     Deus tem para você um ministério na igreja e uma missão no mundo.\n     Por isso que no Aprisco Igreja de Vencedores nosso lema é: Nosso Encargo é Edificar Uma\nIgreja de Vencedores, Onde Cada Membro é Um Ministro (Cada Membro Está Envolvido em Um\nMinistério) e Cada Casa Uma Extensão da Igreja (Cada Casa Uma Célula).\n\n     V. Você é chamado para servir a Deus.\n     Enquanto crescia, você deve ter pensado que ser \"chamado\" por Deus era algo que somente\nmissionários, pastores, e outros obreiros \"de tempo integral\" experimentavam, mas a Bíblia diz que\ntodo cristão é chamado para servir.\n     Seu chamado para ser salvo incluiu o chamado para servir; ambos são o mesmo chamado.\nIndependentemente de seu emprego ou carreira, você é chamado para ser um cristão servindo em\ntempo integral.\n     Não existe \"cristão não-servo\".\n     A Bíblia diz: Deus nos salvou e nos chamou para sermos o seu povo. Não foi por causa do que\ntemos feito, mas porque este era o seu plano e por causa da sua graça.\n     Pedro acrescenta: Vocês foram escolhidos para falar sobre as excelentes qualidades de Deus, que\nos chamou.\n     Sempre que você faz uso das habilidades que Deus lhe concedeu para ajudar os outros, você está\ncumprindo o seu chamado.\n     A Bíblia diz: Vocês [...] agora pertencem a ele [...] para [...] ter uma vida útil no serviço de Deus.\n\nQuanto do seu tempo vem sendo utilizado a serviço de Deus?\n      Em algumas igrejas na China, dão-se as boas-vindas a novos cristão dizendo: \"Jesus agora tem\num novo par de olhos para ver, novos ouvidos para escutar, novas mãos com as quais ajudar e um novo\ncoração para amar os outros\".\n      Uma razão pela qual você precisa estar vinculado a uma igreja, é o cumprimento do seu chamado\npara servir a outros cristãos de maneira prática.\n      A Bíblia diz: Todos vocês, juntos, são o corpo único de Cristo, e cada um de vocês é um membro\nseparado e necessário a ele.\n      O seu serviço é desesperadamente necessário no corpo de Cristo — basta perguntar na igreja do\nDirigente ou do Pastor\n      Cada um de nós tem um papel a desempenhar, e cada um deles é importante.\n      Não existe serviço pequeno para Deus; tudo importa.\n      Do mesmo modo, não existem ministérios insignificantes na igreja.\n      Alguns são visíveis e alguns são desempenhados nos bastidores, mas todos são valiosos.\n      Ministérios pequenos ou escondidos fazem freqüentemente uma grande diferença.\n      Não há uma correlação exata entre tamanho e importância.\n      Todo ministério é importante, porque todos dependemos uns dos outros para funcionar.\n\n      O que acontece quando uma parte do seu corpo deixa de funcionar?\n      Você adoece. O resto do seu corpo sofre.\n      Imagine se seu fígado decidisse começar a viver por conta própria: \"Eu estou cansado! Não\nquero mais servir este corpo!\n      Quero um ano de folga, só me alimentando.\n      Eu tenho de pensar no que é melhor para mim!\n      Deixe que outra parte do corpo assuma\". O que aconteceria? O seu corpo iria morrer.\n      Hoje em dia, milhares de igrejas estão morrendo por causa de cristãos que não têm vontade de\nservir.\n      Eles ficam assistindo de lado, e o corpo sofre.\n\n      VII. A ordem é servir a Deus.\n      Jesus foi categórico: A atitude de vocês deve ser igual à minha, porque eu, o Messias, não vim\npara ser servido, mas para servir, e dar a minha vida por muitos.\n      Para os cristãos, servir não é questão de opção, não é algo a ser encaixado em nossas agendas\ncaso haja tempo disponível.\n      Servir é o núcleo da vida cristã.\n      Jesus veio para \"servir\" e para \"dar\" — esses dois verbos também devem servir para definir sua\nvida na Terra.\n      Nós crescemos para nos doar.\n      Seguir aprendendo mais e mais não é o suficiente.\n\n     Precisamos agir de acordo com o que sabemos e pôr em prática o que afirmamos acreditar.\n     Impressão sem expressão causa depressão. Estudar sem trabalhar leva à estagnação espiritual.\n     A última coisa que muitos cristãos precisam hoje em dia é participar de outro estudo bíblico.\n\n      Eles já sabem muito mais do que põem em prática.\n      O que eles precisam é de experiências em servir, nas quais possam exercitar seus músculos\nespirituais. E esta é a razão das Campanhas da Igreja, célula, geração e ministério.\n      Servir é contrário à nossa inclinação natural.\n\n                                                                                   Igreja de Vencedores\n\n      Na maior parte do tempo, estamos mais interessados em nos servir do que no serviço. Dizemos\n\"Estou procurando uma igreja que atenda as minhas necessidades e me abençoe\", e não \"Estou\nprocurando um lugar onde possa servir e ser abençoado\".\n      Esperamos que os outros nos sirvam, e não ao contrário. Mas, à medida que amadurecemos\nem Cristo, o foco de nossa vida deve ser deslocado progressivamente, para termos uma vida de\nserviço.\n      Um seguidor de Jesus maduro deixa de perguntar \"Quem irá alcançar minhas necessidades?\"\ne começa a perguntar: \"As necessidades de quem eu vou alcançar?\".\n\n      Você alguma vez já fez essa pergunta?\n      A Bíblia diz: Cada um de nós prestará contas de si mesmo a Deus.\n      Pense nas implicações disso.\n      Algum dia Deus irá comparar quanto tempo e energia gastamos conosco, em relação ao que\nutilizamos para servir aos outros.\n      Nesse momento, todas as nossas desculpas para o egoísmo soarão vazias: \"Eu estava muito\nocupado\", ou \"Eu tinha meus próprios objetivos\", ou \"Eu estava preocupado em trabalhar, me divertir\nou em preparar minha aposentadoria\".\n      A todas as desculpas, Deus responderá: \"Sinto muito, resposta errada. Eu o criei, salvei, chamei e\nordenei a você que tivesse uma vida de serviços aos outros.\n      Qual parte você não entendeu?\".\n      A Bíblia alerta os que não creem: Ele derramará a sua ira e o seu castigo sobre os que vivem para\nsi mesmos — mas para os cristãos isso significará a perda das recompensas eternas.\n      Nós só estamos completamente vivos quando ajudamos os outros.\n      Jesus disse: Se você insistir em salvar a sua própria vida, você a perderá.\n      Somente aqueles que põem de lado a sua vida por minha causa e por causa da Boa Nova é que\nsaberão realmente o que significa viver.\n      Você foi moldado para servir a Deus.\n      Deus formou cada criatura neste planeta com uma qualificação especial.\n      Alguns animais correm, outros saltam, alguns escavam e outros voam.\n      Cada um tem um papel especial para cumprir conforme foram moldados por Deus.\n      O mesmo se dá com os humanos.\n      Cada um de nós foi concebido, ou \"moldado\", com exclusividade para a realização de\ndeterminadas tarefas.\n      Antes de os arquitetos projetarem um novo prédio, eles primeiro perguntam: \"Para que propósito?\nComo será usado?\".\n      A função pretendida sempre determina a forma do prédio.\n      Antes de Deus o criar, ele decidiu que papel queria que você desempenhasse na terra.\n      Ele planejou exatamente como queria que você o servisse, então o moldou para essas tarefas.\n      Você é da forma que é porque foi feito para um ministério específico.\n      A Bíblia diz: Porque somos criação de Deus realizada em Cristo Jesus para fazermos boas obras.\n      Você não foi feito em uma linha de montagem de produção em massa, sem ter sido objeto de\nreflexão.\n      Você é uma obra-prima exclusiva e feita sob medida.\n      Deus propositadamente moldou e formou você para servi-lo de um modo que torne seu ministério\nsingular.\n      Ele cuidadosamente misturou o coquetel de DNA que o criou.\n\nDavi louvou a Deus por essa magnífica atenção pessoal aos detalhes: Tu fizeste tudo com\ndelicadeza, as partes íntimas de meu corpo, e as uniste no ventre de minha mãe.\n\n      Obrigado por me teres feito de maneira tão maravilhosamente complexa!\n      O teu trabalho é maravilhoso.\n      Deus não apenas o moldou antes de seu nascimento, mas planejou cada dia de sua vida para\nfavorecer seu processo de formação.\n      Davi continua: Cada dia de minha vida foi gravado no teu livro.\n      Cada momento foi determinado antes mesmo que um só dia tivesse acontecido.\n      Isso significa que nada que tenha ocorrido em sua vida é insignificante.\n      Deus usa toda a sua vida a fim de moldá-lo para seu ministério com relação aos outros e formá-lo\npara seu serviço perante ele.\n      Deus jamais desperdiça coisa alguma.\n      Ele não lhe daria habilidades, interesses, talentos, dons, personalidade e experiências de vida, a\nmenos que pretendesse usá-las para sua glória.\n      Identificando e compreendendo esses fatores, você pode descobrir a Vontade de Deus para sua\nvida.\n      A Bíblia diz que você é \"especial e admirável\".\n      Você é uma combinação de múltiplos fatores.\n\n    COMENTE O QUE MAIS CHAMOU A SUA ATENÇÃO:\n    ______________________________________________________________________________\n__________________________________________________________________________________\n__________________________________________________________________________________\n\n                                                                                     Igreja de Vencedores\n         180", "quiz": [{"q": "Qual é o texto bíblico-base da lição \"VENCENDO A PROVAÇÃO\"?", "options": ["João 15.15", "Tiago 4:7; I João 3:8; Efésios 4:27;", "2 Corintios 4.17", "1 Timóteo 5.22"], "answer": 2}, {"q": "Qual destes é um dos tópicos estudados na lição \"VENCENDO A PROVAÇÃO\"?", "options": ["Seria Pedro O Fundador Da Igreja?", "Não Existem Atalhos Para Chegar À Maturidade", "Damos Glória A Deus Ao Nos Tornar Como Cristo", "Renovação Comunitária"], "answer": 1}, {"q": "Qual destes tópicos NÃO faz parte da lição \"VENCENDO A PROVAÇÃO\"?", "options": ["Deus Utiliza Os Problemas Para Trazê-Lo Para Perto De Si", "Mantenha Um Caderno Ou Um Diário Com As Lições Aprendidas", "Sua Comunidade Local", "A Ordem É Servir A Deus"], "answer": 2}]}, {"num": 29, "title": "ENTENDENDO SEU PROPOSITO", "verseRef": "I Pedro 4.10", "content": "INTRODUÇÃO\n      Somente você pode ser você.\n      Deus projetou cada um de nós de modo que não houvesse réplica em todo o mundo.\n      Ninguém tem exatamente a mesma composição de fatores que o tornam exclusivo.\n      Isso significa que ninguém mais na terra será capaz de desempenhar o papel que Deus planejou\npara você.\n      Se você não fizer sua contribuição individual para o corpo de Cristo, ela não será feita.\n      A Bíblia diz: Existem tipos diferentes de dons [...] Existem maneiras diferentes de servir [... e] Há\ndiferentes habilidades para realizar o trabalho.\n\n     1. Aplicando seus recursos pessoais\n     Seus recursos pessoais são os talentos naturais com os quais você nasceu.\n     Algumas pessoas têm uma habilidade natural com as palavras: já nascem falando!\n     Outras têm habilidades atléticas naturais, destacando-se em agilidade física.\n     Outras ainda são boas em matemática, música ou mecânica.\n     Quando Deus quis criar o Tabernáculo e todos os utensílios para adoração, cuidou para que\nhouvesse artistas e artesãos que fossem formados com destreza, habilidade e plena capacidade artística\npara desenhar [...] e executar todo tipo de obra artesanal.\n     Hoje em dia, Deus ainda concede essas habilidades, bem como milhares de outras, para que as\npessoas possam servi-lo.\n\n     2. Todas as suas habilidades vêm de Deus.\n     Até mesmo habilidades usadas para o pecado foram dadas por Deus; estão apenas sendo usadas\npara o mal ou de forma imprópria.\n\n     A Bíblia diz: Deus dá a cada um de nós habilidade para fazer bem determinadas coisas?\n     Visto que suas capacidades naturais vieram de Deus, elas são tão importantes e \"espirituais\"\nquanto seus dons espirituais.\n     A única diferença é que você as recebeu no nascimento.\n     Uma das desculpas mais comuns que as pessoas dão para não servir é: \"Eu simplesmente não\ntenho nenhuma aptidão a oferecer\".\n     Isso é ridículo. Você tem dezenas, provavelmente centenas de habilidades inexploradas,\ndesconhecidas e ociosas, que estão latentes dentro de você.\n     Vários estudos revelaram que uma pessoa comum tem de quinhentas a setecentas capacidades\ne habilidades — muito mais do que você imagina.\n     Por exemplo: o cérebro pode armazenar 100 trilhões de fatos.\n     Sua mente pode lidar com 15 mil decisões por segundo, como ocorre quando seu sistema\ndigestivo está trabalhando.\n     Seu olfato pode perceber até 10 mil odores diferentes.\n     Seu tato pode detectar um elemento com um mícron de espessura e sua língua pode detectar o\ngosto de uma parte de quinino em dois milhões de partes de água.\n     Você é um conjunto de habilidades incríveis, uma maravilhosa criação de Deus.\n\nParte da responsabilidade da igreja é identificar e disponibilizar essas habilidades para servir a\nDeus.\n\n      3. Deus quer que eu faça aquilo que sou capaz de fazer.\n      Você é a única pessoa na terra que pode usar suas habilidades.\n      Ninguém mais pode assumir o seu papel, porque ninguém mais possui a configuração exclusiva\nque Deus lhe deu.\n      A Bíblia diz que Deus equipa você com tudo o que [você necessita] para fazer a sua vontade.\n      Para descobrir a vontade de Deus para sua vida, você deve examinar seriamente em que você é\nbom e para que não tem habilidade.\n      Se Deus não lhe deu a habilidade de cantar bem, não esperará que você seja cantor de ópera.\n      Deus jamais lhe pedirá que dedique a vida a uma tarefa para a qual você não tem talento.\n      No entanto, as habilidades que você efetivamente tem são um forte indício do que Deus quer que\nvocê faça com sua vida.\n      São pistas para que você conheça a vontade de Deus para você.\n      Se você for bom em projetar, recrutar, desenhar ou organizar, é seguro supor que os planos de\nDeus para sua vida incluem tal habilidade de alguma forma.\n      Deus não desperdiça habilidades; ele combina nosso chamado com nossas habilidades.\n      Suas habilidades não foram concedidas apenas para que você ganhe a vida; Deus as concedeu\npara que você exerça seu ministério.\n      Pedro disse: Deus deu a cada um de vocês algumas capacidades especiais; estejam certos de as\nestarem utilizando para se ajudarem mutuamente, transmitindo aos outros as muitas espécies de\nbênçãos de Deus.\n      A Bíblia nos dá um monte de provas de que Deus usa todos os tipos de personalidades.\n\n     Pedro era sangüíneo.\n     Paulo era colérico.\n     Jeremias era melancólico.\n     Abraão era fleumático.\n     Não existe temperamento \"certo\" ou \"errado\" para o ministério.\n     Todos os tipos de personalidades são necessárias para equilibrar a igreja e lhe dar sabor.\n\n      O mundo seria um lugar muito chato se fôssemos todos apenas baunilha.\n      Felizmente, as pessoas vêm em mais de 31 sabores.\n      Seu modo de ser ou personalidade afetará como e onde você usará suas habilidades e dons\nespirituais.\n      Por exemplo: duas pessoas podem ter o dom de evangelização, mas, se uma é introvertida e a\noutra é extrovertida, esse dom será expresso de formas distintas.\n      Quando você é forçado a ministrar de forma contrária ao seu temperamento, cria-se tensão e\ndesconforto, exigem-se quantidades extras de esforço e energia e os melhores resultados não são\natingidos.\n      É por isso que copiar o ministério de outra pessoa nunca funciona; você não detém a\npersonalidade da outra pessoa.\n      Além do mais, Deus o fez para ser você!\n      Você pode aprender a partir do exemplo de outras pessoas, mas deve filtrar o que aprende através\nde sua própria forma.\n\n                                                                                   Igreja de Vencedores\n\n      I. Utilizando suas áreas de experiência\n      Você foi formado pelas experiências que teve na vida, estando a maioria delas além de seu\ncontrole.\n      Deus as permitiu para o seu propósito na sua formação.\n      Ao determinar sua forma para servir a Deus, você deve examinar ao menos seis tipos ou áreas de\nexperiências de seu passado:\n      • Experiências familiares: O que você aprendeu sendo criado por sua família?\n      • Experiências educacionais: Quais eram suas matérias favoritas na escola?\n      • Experiências vocacionais‘. Em quais empregos você foi mais eficiente e de que mais gostou de\ntrabalhar?\n      • Experiências espirituais. Qual foi sua época mais significativa com Deus?\n      • Experiências no ministério: Como você serviu a Deus no passado?\n      • Experiências árduas: Com quais problemas, mágoas, espinhos e provações você aprendeu?\n      É a última categoria, experiências árduas, que Deus mais usa para prepará-lo para o ministério.\n      Deus jamais desperdiça uma dor! Na verdade, é muito provável que seu maior ministério surja de\nsua maior dor.\n      Quem poderia ministrar melhor aos pais de uma criança com câncer do que outro casal que tenha\num filho padecendo do mesmo mal?\n      Quem poderia ajudar melhor na recuperação de um alcoólatra do que alguém que tenha\ncombatido esse demônio e tenha achado a liberdade?\n      Quem poderia confortar melhor uma esposa que tenha sido trocada por uma amante do que uma\nmulher que tenha passado pela mesma agonia?\n      Deus intencionalmente permite que você passe por experiências árduas, a fim de capacitá-lo a\nministrar às outras pessoas.\n      A Bíblia diz: Ele nos conforta em todos os nossos problemas, de modo que podemos confortar a\noutros.\n      Quando alguém estiver atribulado, seremos capazes de dar-lhe o mesmo conforto que recebemos\nde Deus.\n      Se você realmente deseja ser usado por Deus, deve entender uma verdade poderosa: as mesmas\nexperiências que lhe trouxeram mais arrependimento e ressentimento na vida — aquelas que você\nqueria esconder e esquecer são as que Deus quer usar para ajudar aos outros.\n      Elas são seu ministério!\n      Para que Deus utilize suas experiências dolorosas, você deve estar disposto a partilhá-las.\n      Você tem de parar de encobri-las e deve admitir honestamente suas faltas, fracassos e temores.\n      Fazer isso provavelmente tornará seu ministério mais eficiente.\n      As pessoas se sentem mais estimuladas quando lhes contamos como a graça de Deus nos ajudou\nna fraqueza do que quando fazemos alarde sobre nossa força.\n\n     II. Descubra sua forma\n     A Bíblia diz: Não procedam imprudentemente, mas procurem descobrir e fazer tudo que o Senhor\nquer que vocês façam.\n     Não deixe que se passe outro dia.\n     Comece a averiguar e a esclarecer o desejo Deus para a sua vida.\n     Comece avaliando seus dons e habilidades.\n     Analise de forma demorada e honesta em que você é bom e em que não é.\n     Paulo aconselhou: ... procurem fazer um juízo correto de suas capacidades.\n     Faça uma lista.\n     Peça às outras pessoas uma opinião justa.\n\nDiga-lhes que quer descobrir a verdade, não ganhar elogios.\n      Dons espirituais e habilidades naturais são sempre confirmadas pelos outros.\n      Se você pensa ser talentoso para ensinar ou cantar, mas ninguém mais concorda, adivinhe!\n      Se você quiser saber se tem o dom de liderança, basta olhar por cima do ombro! Se ninguém o\nestiver seguindo, você não é líder.\n      Faça perguntas assim: \"Onde pude ver frutos em minha vida que foram confirmados por outras\npessoas?\n      Onde já fui bem-sucedido?\"\n      A melhor maneira de descobrir seus dons e capacidades é experimentar diferentes áreas de\nocupação.\n      \"Descubra seu dom espiritual, e então saberá a qual ministério deve se dedicar\". Isso na verdade\nfunciona de forma exatamente oposta.\n      Comece a servir, experimentando diferentes ministérios, e então você descobrirá seus dons.\n      Enquanto não estiver efetivamente envolvido em servir, não saberá em que é realmente bom.\n      Você tem dezenas de habilidades escondidas e dons que desconhece porque nunca os pôs à prova.\n      Por isso, eu incentivo a tentar fazer coisas que nunca fez anteriormente.\n      Não tente entender seus dons até ser voluntário para servir em algum lugar.\n      Tão-somente comece a servir.\n      Você descobre seus dons ao se envolver no ministério.\n      Tente ensinar, liderar, organizar, tocar um instrumento ou trabalhar com adolescentes.\n      Você nunca saberá em que é bom enquanto não tentar.\n      Quando não der certo, chame de \"experiência\", não de fracasso.\n      Em algum momento, você irá descobrir no que é bom.\n\n     III. Os verdadeiros servos prestam atenção às necessidades.\n     Os servos estão sempre atentos a formas de ajudar os outros.\n     Quando veem uma necessidade, agarram a oportunidade de auxiliar, exatamente como a Bíblia\nnos ordena: Portanto, enquanto temos oportunidade, façamos o bem a todos, especialmente aos da\nfamília da fé.\n     Quando Deus põe alguém em situação de necessidade bem a sua frente, ele está lhe dando a\noportunidade de crescer como servo.\n     Repare que Deus diz que as necessidades de sua família na igreja devem ter preferência, não\ndevem ser colocadas no fim de sua lista de coisas a fazer.\n     Deixamos escapar muitas oportunidades para servir porque nos falta sensibilidade e\nespontaneidade.\n     Grandes oportunidades para servir nunca duram muito.\n     Elas passam rapidamente, e algumas vezes nunca voltam a ocorrer.\n     Você provavelmente terá apenas uma chance de auxiliar aquela pessoa; então, aproveite a\noportunidade.\n     Não diga ao seu vizinho que espere até amanhã, se você pode ajudá-lo hoje.\n     Você pode começar procurando pequenas tarefas que ninguém mais quer fazer.\n     Faça essas pequenas coisas como se fossem grandes coisas, pois Deus está observando.\n\n     1. Os verdadeiros servos fazem o melhor que podem com o que têm à mão.\n     Servos não dão desculpas, não deixam para a última hora, nem esperam circunstâncias melhores.\n     Nunca dizem \"Quando for a hora certa\".\n\n                                                                                   Igreja de Vencedores\n\n      Simplesmente fazem o que precisa ser feito.\n      A Bíblia diz: Se você ficar esperando as condições perfeitas, nunca fará nada.\n      Deus espera que você faça o que puder, com o que você tem e onde quer que você esteja.\n      Um serviço não tão perfeito é sempre melhor que a melhor das intenções.\n      Uma razão que impede muitas pessoas de servir é que elas temem não serem boas o suficiente\npara servir.\n      Acreditaram na mentira de que servir a Deus é somente para pessoas altamente talentosas e bem-\nsucedidas.\n\n     2. Pequenas tarefas muitas vezes demonstram um grande coração.\n     Seu coração de servo se revela em pequenos atos que outros nem pensam em fazer, como quando\nPaulo reuniu gravetos para acender um fogo a fim de que todos se aquecessem após um naufrágio.\n     Ele estava tão exausto como qualquer outro, mas fez aquilo de que todos precisavam.\n     Nenhuma tarefa está abaixo de você quando você tem coração de servo.\n     As grandes oportunidades estão normalmente camufladas entre as tarefas menores.\n     As pequenas coisas da vida determinam as grandes.\n     Não busque realizar grandes tarefas para Deus.\n     Tão-somente faça as coisas não tão grandes, e Deus o designará para qualquer coisa que ele\nqueira que você faça. Mas antes de tentar o extraordinário, tente servir normalmente.\n     Sempre haverá mais pessoas dispostas a fazer \"grandes\" coisas para Deus do que pessoas\ndispostas a fazer pequenas coisas.\n     A corrida para a liderança está cheia de candidatos, mas o campo é amplo para os dispostos a ser\nservos.\n\n     IV. Os verdadeiros servos mantêm a discrição.\n     Servos não se promovem nem chamam a atenção para si mesmos. Em vez de agir para\nimpressionar e se vestir para o sucesso, eles usam um avental de humildade para servir uns aos outros!\n     Sendo reconhecidos por seus serviços, eles humildemente aceitam, mas não admitem que a\nnotoriedade os distraia, desviando a atenção de seu trabalho.\n\n     1. Você foi feito para uma missão.\n     Deus está atuando no mundo e quer que você se junte a ele.\n     Essa atribuição é conhecida como sua missão.\n     Deus quer que você tenha tanto um ministério no corpo de Cristo quanto uma missão no mundo.\n     Seu ministério é seu serviço junto aos que creem, e sua missão é seu serviço junto aos que não\ncreem.\n     Cumprir sua missão no mundo é o propósito de Deus para sua vida.\n     A missão de sua vida é tanto comum quanto específica.\n     Parte dela é uma responsabilidade compartilhada com todos os outros cristãos, e a outra parte é\numa tarefa separada exclusivamente para você.\n\n      2. Sua missão é uma continuação da missão de Jesus sobre a terra.\n      Como seus seguidores, devemos continuar o que Jesus começou.\n      Jesus não nos chama apenas para vir a ele, mas também para ir por ele.\n      Sua missão é tão importante que Jesus a repetiu cinco vezes, de cinco formas diferentes, em cinco\nlivros diferentes da Bíblia.\n      É como se ele estivesse dizendo: \"Eu realmente quero que você leve isso a sério\"!\n\nNa Grande Comissão, Jesus disse: Vão e façam discípulos de todas as nações, batizando-os em\nnome do Pai, do Filho e do Espírito Santo, ensinando-os a obedecer a tudo o que eu lhes ordenei.\n     Essa incumbência foi dada a todos os seguidores de Jesus, não somente aos dirigentes de\ncongregação, lideres de geração, lideres de células e discipuladores.\n     Esse é o seu compromisso com Jesus, e não se trata de algo opcional.\n     As palavras de Jesus não são a \"Grande Sugestão\".\n     Se você faz parte da família de Deus, sua missão é obrigatória.\n     Desprezá-la seria um ato de desobediência.\n     Você talvez não esteja ciente de que Deus o pôs como responsável pelos incrédulos que vivem a\nsua volta.\n     A Bíblia diz: Você deve adverti-los para que eles possam viver.\n     Se você não falar, não advertir os ímpios a parar de praticar o mal, eles morrerão em seus\npecados, mas eu colocarei sobre você a responsabilidade pela morte deles.\n     Você pode ser o único cristão que algumas pessoas conhecem, e sua missão é contar a eles sobre\nJesus.\n\n      V. Quanto lhe custará cumprir sua missão\n      Cumprir sua missão irá exigir que você abandone seus planos pessoais e assuma os planos de\nDeus para sua vida.\n      Você não pode apenas acumulá-la com todas as outras coisas que gostaria de fazer.\n      Você deve dizer, tal qual disse Jesus: Pai [...] não seja feita a minha vontade, mas a tua.\n      Submeta seus privilégios, expectativas, sonhos, planos e ambições a Deus.\n      Pare de fazer orações egoístas como: \"Deus, abençoe o que quero fazer\".\n      Em vez disso, ore: \"Deus, ajude-me a fazer o que estás abençoando\"!\n      Entregue a Deus uma folha em branco, com seu nome assinado embaixo e peça para ele\npreencher.\n      A Bíblia diz: Antes entreguem-se inteiramente a Deus — o corpo todo — pois que vocês\nvoltaram da morte e desejam ser instrumentos nas mãos de Deus, usados para seus bons propósitos.\n      Comprometendo-se com a realização de sua missão, aconteça o que acontecer, você irá\nexperimentar a bênção de Deus de uma forma que poucas pessoas já experimentaram.\n      Não há quase nada que Deus não faça pelo homem ou mulher que se comprometer em servir o\nReino de Deus.\n      Jesus prometeu: [Deus] lhes dará tudo de que precisam no dia-a-dia se vocês viverem para ele e\nfizerem do Reino de Deus a sua preocupação primária.\n\n     1. \"Mais um para Jesus\"\n     O pai do Pastor Rick Warren, foi pastor por mais de cinquenta anos, servindo principalmente\nem igrejas pequenas da zona rural.\n     Ele era um simples pregador, mas era um homem com uma missão.\n     Sua atividade favorita era levar equipes de voluntários ao exterior, a fim de erguer igrejas para\npequenas congregações.\n     Durante sua vida, ele ergueu mais de 150 igrejas por todo o mundo.\n     Em 1999, ele morreu de câncer. Na última semana de vida, a doença o mantinha acordado em\nestado de semiconsciência, quase 24 horas por dia.\n     Quando sonhava, falava alto sobre o que estava sonhando.\n     Sentado ao lado de sua cama, o pastor Rick Warren aprendeu muito sobre seu pai, apenas\nescutando seus sonhos.\n     Ele revivia seus projetos de construção, um após o outro.\n\n                                                                                   Igreja de Vencedores\n\n      Certo dia, já próximo ao fim, enquanto o pastor Rick Warren estava ao seu lado, ele ficou\nsubitamente agitado e tentou levantar-se da cama. Logicamente, ele estava muito fraco. Mas ele\ninsistia em tentar sair da cama, então a esposa do pastor Warren acabou por perguntar: \"Jimmy, o\nque você está querendo fazer?\".\n      Ele respondeu: \"Tenho de salvar mais um para Jesus!\n      Tenho de salvar mais um para Jesus!\n      Tenho de salvar mais um para Jesus!\".\n      Ele começou a repetir essa frase sem parar.\n      Na hora que se seguiu, ele provavelmente repetiu a mesma frase mais de cem vezes.\n      \"Tenho de salvar mais um para Jesus!\"\n      Quando o pastor Rick Warren se sentou mais próximo, com as lágrimas escorrendo, ele\ninclinou a cabeça para agradecer a Deus pela fé de seu pai.\n      Naquele momento, seu papai estendeu o braço, pôs sua frágil mão sobre sua cabeça e disse,\ncomo se estivesse lhe comissionando:\n      \"Salve mais um para Jesus!\n      \"Salve mais um para Jesus!\".\n      O pastor Rick Warren fez isso seu lema de vida.\n\n      Se você quer ser usado por Deus, deve se importar com o que mais importa para Deus; e o que\nmais importa para ele é a redenção das pessoas que ele fez.\n      Ele quer que seus filhos perdidos sejam encontrados!\n      Nada interessa mais a Deus; a cruz prova isso.\n      Oro para que você esteja sempre atento, a fim de alcançar \"mais um para Jesus\", de maneira que,\nno dia em que você estiver diante de Deus, você possa dizer: \"Missão cumprida\".\n      A Bíblia diz: Pois o amor de Cristo nos constrange, porque estamos convencidos de que um\nmorreu por todos.\n      Sempre que você se sentir apático sobre sua missão no mundo, passe algum tempo pensando\nsobre o que Jesus fez por você na cruz.\n      Você deve se preocupar com os que não crêem, porque Deus se preocupa.\n      O amor não lhe dá outra escolha.\n      A Bíblia diz: No amor não há medo; o amor que é totalmente verdadeiro afasta o medo.\n      Um pai se lançaria para dentro de um prédio em chamas a fim de salvar o filho, porque seu amor\npor aquele filho é maior que seu medo.\n      Se você tem medo de partilhar o evangelho de Deus com aqueles que estão ao redor, peça a Deus\nque encha seu coração de amor por essas pessoas.\n      A Bíblia diz: [Deus] não quer que ninguém se perca, as que todas as pessoas mudem seu coração\ne sua vida.\n      Assim que você conhece uma pessoa que não conheça a Cristo, você precisa começar a orar por\nela, servindo-a com amor e partilhando as boas-novas.\n      E, enquanto existir uma única pessoa em sua rua ou seu bairro que não faça parte da família de\nDeus, sua célula e geração precisam insistir em buscá-lo.\n      A célula e geração que não quer crescer está dizendo ao mundo: \"Vocês podem ir para o inferno\".\n      O que você está disposto a fazer para que as pessoas que você conhece possam ir para o céu?\n      Convidá-las a vir à célula?\n      Contar sua história?\n      Presentear-lhes o pão diário ou o devocional da campanha que a igreja está passando no\nmomento?\n      Levá-las para jantar?\n\nOrar por elas diariamente até que sejam salvas?\n     Seu campo missionário está ao seu redor.\n     Não perca as oportunidades que Deus está lhe dando.\n     A Bíblia diz: Aproveitem o máximo das suas oportunidades para contar a Boa-Nova aos outros.\n     Sejam sábios em todos os seus contatos com eles.\n     Alguém irá para o céu por sua causa?\n     Será que alguém no céu poderá lhe dizer \"Eu gostaria de lhe agradecer. Estou aqui porque você\nse importou o suficiente para me falar do evangelho\"?\n     Imagine a alegria de encontrar no céu pessoas que você ajudou a chegar lá.\n     A salvação eterna de uma única vida é mais importante que tudo o mais que você possa conseguir\nna vida.\n     Somente as pessoas irão durar para sempre.\n\n      VI. A Grande Comissão é sua comissão.\n      Você tem uma escolha a fazer.\n      Ou você é um cristão da melhor qualidade, ou é um cristão mundano.\n      Cristãos mundanos buscam principalmente a satisfação pessoal.\n      Eles estão salvos, mas são egoístas.\n      Adoram comparecer a reuniões de louvor e a seminários edificantes, mas você jamais os achará\nem conferências sobre missões, porque não estão interessados.\n      Suas orações se concentram em suas próprias necessidades, bênçãos e felicidade.\n      É a fé do \"eu primeiro\": \"Como Deus pode tornar minha vida mais confortável?\".\n      Eles querem usar a Deus para seus propósitos, em vez de serem usados por Deus para os\npropósitos dele.\n      Os cristãos de primeira classe, em contrapartida, sabem que foram salvos para servir e feitos para\numa missão.\n      Os cristãos de primeira classe são as únicas pessoas totalmente vivas neste planeta.\n      Acordam a cada manhã na expectativa de que Deus opere por meio deles de formas novas.\n      Que tipo de cristão você quer ser?\n      Deus o convida a participar na mais magnífica, ampla, multiforme e importante causa da história\n— o seu Reino.\n      A história é sua história.\n      Ele está formando sua família para a eternidade.\n      Nada é mais importante e nada durará tanto.\n      Por meio do livro de Apocalipse, sabemos que a missão global de Deus será cumprida.\n      Algum dia, a Grande Comissão se tornará a Grande Consumação.\n      Nos céus, uma enorme multidão de pessoas de todas as nações, tribos, povos e línguas, estará um\ndia perante Jesus Cristo para adorá-lo.\n      Envolver-se como cristão de primeira classe lhe permitirá experimentar um pouco do céu\nantecipadamente.\n      Quando Jesus ordenou aos seus seguidores \"irem por todo o mundo e pregarem o evangelho a\ntodas as pessoas\", o pequeno bando de pobres discípulos do Oriente Médio ficou pasmado.\n      Eles deveriam ir a pé ou cavalgar pequenos animais?\n      Era tudo que tinham para o transporte, e não existiam barcos capazes de atravessar um oceano;\nlogo, existiam verdadeiras barreiras físicas que os impediam de ir por todo o mundo.\n      Hoje, temos aviões, trens, ônibus e automóveis.\n      No final, é um mundo pequeno, que encolhe a cada dia.\n\n                                                                                     Igreja de Vencedores\n\n      Você pode voar sobre o oceano em questão de horas e estar em casa no dia seguinte, se for\nnecessário.\n      As oportunidades para que cristãos normais, do nosso dia-a-dia, possam se envolver em missões\ninternacionais de curta duração são praticamente ilimitadas.\n      Cada canto do mundo está ao seu alcance — pergunte à industria do turismo! Não temos\ndesculpas para não espalharmos o evangelho.\n      Agora, com a Internet, o mundo está ficando ainda menor. Além dos telefones e aparelhos de fax,\nqualquer cristão com acesso à Internet pode se comunicar pessoalmente com pessoas de praticamente\ntodos os países do mundo.\n      Todo o planeta está na ponta dos seus dedos!\n      Até mesmo os mais remotos vilarejos têm acesso a e-mail, portanto, você pode hoje entabular\nconversas evangelísticas com pessoas do outro lado do mundo, sem nem ao menos sair de casa!\n      Nunca na história foi tão fácil cumprir a incumbência de ir por todo o mundo.\n      Os maiores obstáculos já não são a distância, o custo ou o transporte.\n      O único obstáculo é nossa forma de pensar.\n      Para ser cristão de primeira classe, você deve se dispor a algumas mudanças mentais.\n      Sua perspectiva e suas atitudes devem mudar.\n\n      1. Deixe de raciocinar de forma restrita e raciocine de forma global.\n      Deus é um Deus global.\n      Ele sempre se preocupou com o mundo inteiro. Deus tanto amou o mundo... Desde o início, ele\nquis membros para sua família de todas as nações que criou.\n      A Bíblia diz: De um só homem ele criou todas as raças humanas para viverem na terra.\n      Antes de criar os povos, Deus marcou para eles os lugares onde iriam morar e quanto tempo\nficariam lá.\n      Ele fez isso para que todos pudessem procurá-lo e talvez encontrá-lo.\n      Grande parte do mundo já pensa de forma global.\n      Os maiores conglomerados de comunicação e negócios são multinacionais.\n      Nossa vida e a vida de pessoas em outras nações se tornam cada vez mais entrelaçadas, à medida\nque compartilhamos moda, entretenimento, música, esportes e etc...\n      É provável que a maioria das roupas que você está vestindo e grande parte do que você come hoje\nem dia tenham sido produzidos em outro país.\n      Nós estamos mais unidos do que percebemos.\n      Estamos vivendo dias emocionantes.\n      Atualmente, existem mais cristãos sobre a terra do que em qualquer outra época.\n      Paulo estava certo: A mesma boa-nova que chegou até vocês está saindo pelo mundo todo.\n      Ela está transformando vidas em todas as partes, tal como transformou a de vocês....\n       A melhor forma de começar a pensar de maneira global é começar a orar por países específicos.\n      Cristãos de primeira classe oram pelo mundo.\n      Consiga um Atlas ou um mapa e ore pelos países por nome.\n      A Bíblia diz: Se você me pedir, eu darei a você as nações; todos os povos da terra serão seus.\n      A oração é a ferramenta mais importante na sua missão no mundo.\n      As pessoas podem recusar nosso amor ou rejeitar nossa mensagem, mas não têm defesas contra\nnossas orações.\n      Como um míssil intercontinental, você pode apontar uma oração para o coração de uma pessoa,\nesteja você a um metro ou a 16 mil quilômetros de distância.\n      Qual deveria ser o alvo das suas orações?\n\nA Bíblia diz que devemos orar por oportunidades para testemunhar, por coragem para falar, por\naqueles que irão crer, para que a mensagem se espalhe rapidamente e por mais obreiros.\n     As orações o tornam parceiro de muitas outras pessoas ao redor do mundo.\n     Você também deve orar pelos missionários e por todas as outras pessoas envolvidas na colheita\nao redor do mundo.\n\n      VII. Transmita aos outros aquilo que você sabe.\n      Se você quer continuar crescendo, a melhor forma de aprender mais é transmitir o que já\naprendeu ( Campanhas da Igreja, Células, Geração e Ministérios).\n      O livro de Provérbios diz: Quem abençoa os outros é abundantemente abençoado; os que ajudam\nos outros serão ajudados.\n      Aqueles que passam adiante suas percepções obtêm ainda mais de Deus.\n      Agora que compreende o propósito da vida, você tem a responsabilidade de levar essa mensagem\naos outros.\n      Deus o está chamando para ser seu mensageiro.\n      Paulo disse: Agora, quero que você diga essas mesmas coisas a seguidores confiáveis para que as\npossam dizer aos outros.\n      Em outra palavra Paulo disse: Agora quero que você discipule outras pessoas para que elas\ndiscipule ainda outras.\n\n     Você provavelmente conhece centenas de pessoas que não sabem qual o propósito da vida.\n     Compartilhe essas verdades com seus filhos, amigos, vizinhos e aqueles com quem trabalha.\n     Tiago disse: Quem sabe que deve fazer o bem e não o faz comete pecado.\n     Porém, transmitir o propósito da vida é mais do que uma obrigação; é um dos grandes privilégios\nda vida.\n     Imagine como o mundo seria diferente se todos conhecessem seu propósito.\n     Paulo disse: Se você transmitir essas instruções aos irmãos, será um bom ministro de Cristo Jesus.\n\n    COMENTE O QUE MAIS CHAMOU A SUA ATENÇÃO:\n    ______________________________________________________________________________\n__________________________________________________________________________________\n__________________________________________________________________________________\n\n                                                                                    Igreja de Vencedores\n         190", "quiz": [{"q": "Qual é o texto bíblico-base da lição \"ENTENDENDO SEU PROPOSITO\"?", "options": ["João 15.15", "I Pedro 4.10", "Romanos 11.36", "Tiago 4:7; I João 3:8; Efésios 4:27;"], "answer": 1}, {"q": "Qual destes é um dos tópicos estudados na lição \"ENTENDENDO SEU PROPOSITO\"?", "options": ["Hierarquia Espiritual Dos Demônios", "Um Paralelo Entre Pedro E Os Papas De Hoje:", "Você É Chamado Para Servir A Deus", "Descubra Sua Forma"], "answer": 3}, {"q": "Qual destes tópicos NÃO faz parte da lição \"ENTENDENDO SEU PROPOSITO\"?", "options": ["A Grande Comissão É Sua Comissão", "Defina A Armadura De Deus", "Utilizando Suas Áreas De Experiência", "Descubra Sua Forma"], "answer": 1}]}, {"num": 30, "title": "IGREJA COM PROPÓSITOS", "verseRef": "2\nCoríntios     5:14", "content": "TEXTO BÍBLICO\n\n\"O amor de Cristo nos constrange...\" 2 Coríntios 5:14\n\n      A Base Bíblica de uma Igreja com Propósitos\n\n     Uma Igreja com Propósitos é aquela que está baseada nas bases fundamentais da Bíblia, como o\nGrande Mandamento e na Grande Comissão.\n\n     O Grande Mandamento foi dado por Jesus em resposta a uma pergunta. Um dia, pediram que\nJesus identificasse o mandamento mais importante. Ele respondeu dizendo: \"Aqui está todo o Velho\nTestamento em uma declaração. Eu vou dar a vocês o resumo da Palavra de Deus. Toda a Lei e os\nProfetas podem ser condensados em duas tarefas: Amar a Deus de todo o seu coração e ao próximo\ncomo a si mesmo.\"\n\n      Mais tarde, em uma de suas últimas instruções aos seus discípulos, Jesus deu-lhes a Grande\nComissão e entregou-lhes mais tarefas: Ir fazer discípulos, batizá-los e ensiná-los a obedecer tudo\nquanto ele tinha ensinado.\n\n     Juntas, estas duas passagens resumem os cinco propósitos de uma igreja bíblica:\n\n      Adoração - Você foi planejado para agradar de Deus.\n\n      Comunhão - Você foi formado para fazer parte da família de Deus.\n\n      Discipulado - Você foi criado para se tornar semelhante a Cristo.\n\n      Ministério - Servir - Você foi moldado para servir a Deus.\n\n     A Grande Comissão: Mateus 28: 19 - 20.\n\n      \"Portanto ide, fazei discípulos de todas as nações, batizando-os em nome do Pai, e do Filho, e do\nEspírito Santo, ensinando-os a observar todas as coisas que vos tenho mandado.\"\n\n      Uma célula nunca será saudável, se verdadeiramente não for dirigida pelos propósitos deixados\npor Jesus para as nações.\n\n       Deus deu a cada cristão, em todas as células, uma missão: ir ao mundo e comunicar as Boas\nNovas sobre Jesus. Por quê? Por que devemos nos preocupar o suficiente com os outros a ponto de lhes\ndizer como ir para o céu? Esse pode ser um conceito difícil de ensinar em nossas congregações. Como\nmotivar a compartilhar as Boas Novas? A Bíblia diz que \"o amor de Cristo nos constrange\" (2\nCoríntios     5:14).     O     nosso     amor      por      Jesus      completa    nossa     missão.\n\nTodos importam para Deus. Deus nunca fez uma pessoa que não amasse. Deus fez algumas\npessoas que eu não amo, e Deus fez algumas muitas de quem eu nem ao menos gosto. Mas Deus as\nama. A pessoa mais desprezível que você pode imaginar ainda é amada por Deus. E porque Deus se\nimporta, devemos nos importar.\n\n     Você não muda as pessoas por meio de protestos. Você pode mudá-las por meio do amor. Deus\ntem colocado pessoas específicas em sua vida, e Ele espera que você divida as Boas Novas com elas.\nVocê pode ser o único cristão que algumas pessoas conhecem.\n\n      Deus vai nos cobrar pelas vidas daqueles que colocou em nosso caminho para que lhes\nfalássemos das Boas Novas. Não é só família, amigos e parentes, mas todas as pessoas com quem você\nentra em contato.\n\n      Isso pode assustar alguns membros. O Espírito Santo não quer que você tenha medo de pessoas,\nmas que seja sábio e forte, ame-os e goste de estar com elas. Se você assumir o seu propósito, não vai\nter medo de falar com os outros sobre o Senhor. A Bíblia diz que o antídoto do medo é o amor. A razão\npela qual os membros da sua célula não compartilham as Boas Novas é que não amam as pessoas o\nsuficiente para quererem vê-los no céu. Se eles as amassem o suficiente iriam dividir com elas as Boas\nNovas.\n\n      Se o meu filho estivesse em um edifício em chamas, eu não me importaria com o tamanho das\nchamas; eu iria atrás dele. Não me importaria em me machucar. Não me importaria se outras pessoas\nfalassem que eu estava louco. Ainda sim entraria no prédio! Agarraria o meu filho e o traria para fora.\nEu talvez ficasse queimado e marcado. Então, as pessoas diriam: \"Você é corajoso!\" Não, eu não teria\nsido     bravo     ou     corajoso    ou     louco;    eu     estava     motivado      pelo      amor.\n\n      Quando realmente amarmos os membros da nossa família o suficiente, teremos coragem para\nfalar com eles sobre Jesus. E não como se estivéssemos tentando lhes transmitir câncer! Você lhes está\ndando a melhor notícia do mundo, sobre o perdão das coisas passadas, poder e propósito para o\npresente e uma morada no céu no futuro.\n\n      Muitas pessoas podem lhe indagar sobre como deveriam compartilhar a fé. Você pode fazê-lo de\nduas formas: mostrando e compartilhando. Se você alguma vez já esteve presente em um julgamento\nou assistiu a algum caso na televisão, sabe que uma ferramenta da defesa é desacreditar as testemunhas\nda acusação. Se eles o conseguem, então o caso está vencido. Já vimos isso diversas vezes. As\ntestemunhas acabam sendo viciadas em drogas, ou descobrimos que já mentiram em outras\nexperiências, ou têm o mesmo problema que o acusado.\n\n      Podemos manter pessoas fora do céu pela maneira como vivemos. O fato é que você está sendo\nvisto pelo seu chefe, pelos seus vizinhos, pelos seus empregados, pelos seus filhos e parentes. Toda\nconversa que você tem, toda ação que você pratica, cada palavra que você fala tem implicações\neternas. Que tremenda responsabilidade!\n\n      Temos de mostrar o amor e a vida de Deus de maneira que traga honra ao nome dEle. Como nós\nvivemos influencia o lugar onde as pessoas vão passar sua eternidade: céu ou inferno.\nPreciso mostrar a mensagem. Preciso contá-la. \"Aproveite todas as suas chances para dizer aos outro\nsobre as Boas Novas\" (Colossenses 4:5).\n\n                                                                                    Igreja de Vencedores\n\n     Algumas pessoas dizem: \"Eu não preciso dizer às pessoas, o meu testemunho é a minha vida.\"\nVocê percebe a viagem do ego nisso? Até mesmo Jesus contou sobre a salvação, e Ele era perfeito.\n\n       Eles podem não saber por que você é bom. Dizemos: \"Meu testemunho é minha vida.\" Isso\nsignifica que você entra numa sala, todas as pessoas olham para você e, automaticamente, se prostram\ne aceitam a Cristo. Duvido! Nós temos de contar.\n\n       Nossa missão é a mesma, não importa onde estamos no mundo. É convidar Deus para nossa\nfamília. Desafio você a desafiar a sua célula a se comprometer em compartilhar as Boas Novas com as\npessoas que Deus colocou na vida delas. Pergunte-lhes: \"Tem alguém indo para o céu por sua causa?\"\n\n       Antes de iniciar o processo de crescimento de sua célula, você precisa entender qual vai ser o\n seu verdadeiro papel como líder nessa caminhada de crescimento. Há essencialmente três fases para\n a célula que cresce, e sua função como líder deve mudar em cada fase.\n\n       Falando do ponto de vista de uma estrutura básica, há três tipos de células: células-simples,\n múltiplas-células e gerações. Como você vai liderar em cada uma dessas situações?\n       Na estrutura células-simples, há apenas uma célula, isto é, um grupo de pessoas que formam a\n célula. Geralmente, esse tipo de célula tem menos de 5 membros e um líder.\n       As múltiplas-células tende a ter entre 5 a 12 membros e tem o líder e os líderes em\n treinamento. Neste tipo de célula, há várias pessoas que dariam para formarem duas ou três novas\n células.\n       Na geração, há células dentro dela. A geração pode ter até 144 ou mais membros tendo cada\n geração 12 células e elas possuem um líder de geração, líderes de células e lideres em\n treinamento.\n       Em cada uma dessas fases de crescimento, sua função como líder (ou líder ministerial) tem de\n mudar para suprir as necessidades de mudanças em sua célula.\n       Numa célula baseada em células-simples, o líder é manda-chuva operacional. Ele faz,\n sozinho, a maior parte do trabalho: evangeliza, canta, prega, trás o lanche. Ele é o empreendedor.\n       Numa Múltipla Célula o líder deve estar desejando mudar de chefe operacional para\n supervisor, gerente. Neste nível, é necessário ter novos membros como líderes em treinamento. Seu\n papel é supervisionar e gerenciar as pessoas que trabalham com você.\n       Então, quando a célula cresce além dos 12 membros (geração), o líder deve ter o papel de\n executivo. Você sabe o momento de estar nesse nível quando você chama líderes em treinamento\n para trabalhar com você, alguém que cuide dos detalhes para você (cante, traga o lanche, faça o\n quebra gelo e etc.\n       Nesse você lidera, alimenta e permite que outros cuidem dos detalhes menores. A função\n chave do líder nesse estágio é a de visionário.\n       A chave para o crescimento é a adição de novas células e novos Líderes em Treinamento.\n Você começa a expandi-las e aumenta o número de células, mas células, mais células \"tudo isso vai\n ajudar sua células a crescer e se transformar em uma geração.\n       Um dos pontos chave nas células-múltiplas é que a reunião da célula melhore. Numa célula\n simples, as pessoas enfrentam uma série de problemas com as reuniões. O cantor não canta num tom\n confortável, as crianças correm entre os bancos. Enfrentamos esses problemas naturalmente porque\n somos apenas \"uma família\", isto é, \"apenas nós mesmos\".\n Mas uma vez que você alcance 6 a 12 membros, você descobre que as pessoas não frequentam a\n célula pelas mesmas razões. De modo geral, as pessoas vão a célula simplesmente por causa dos\n laços de amizade. Mas ao passar dos 6 membros, esses laços não são os mesmos \"daí as razões\n\nporque as pessoas que frequentam são diferentes das razões quando a célula tinha apenas 6 pessoas\nnas reuniões da célula.\n\n      Antes, vinham por causa da amizade. Agora, eles frequentam para fazerem uma avaliação: A\ncélula é boa? A reflexão é boa? Quem fica com as crianças?\nEsta é a razão porque, nesse estágio, você precisa melhorar a célula. A celebração precisa ser\nafinada, culturalmente relevante, dirigida às pessoas que você está tentando atingir. No terceiro\nnível \"gerações (quando você tem 12 ou mais frequentadores) -- então a chave para isso é o\ngerenciamento da equipe. Muitos líderes em treinamento. Quanto maior a célula fica, mais lideres\nem treinamento precisam surgir.\n     Para que sua célula cresça do nível célula-simples para célula-múltipla ou de célula múltipla\npara geração, você precisa estar apto para responder positivamente às necessidades de mudanças por\nmudar primeiramente o seu próprio papel de líder.\n\n1. Renovação pessoal\n\n      Renovação pessoal aparece quando seu coração se aquece na intimidade com Jesus, você se\ntorna mais sensível à presença de Cristo e o Espírito Santo enche a sua vida. Isso pode ser chamado\nde vida mais profunda, vida cheia do Espírito, consagração, re-dedicação. Não importa como você\nchame, mas é exatamente aí onde a coisa vai começar, em seu coração \"o coração do líder \" e assim\nnos corações dos líderes em treinamento e daí nos corações das pessoas.\n      Renovação pessoal é a primeira coisa que deve acontecer. Se você tentar mudar a sua célula\nsem sua renovação pessoal, levando isso ao coração das pessoas, esse tipo de renovação não vai\ndurar muito.\n\n2. Renovação Comunitária\n\n       Renovação comunitária vem depois da renovação pessoal. Você percebe quando o corpo de\nCristo começa a ficar \"aquecido\". As pessoas começam a amar umas às outras e a fazer a coisa certa\numa para a outra. Restituições são feitas, pecados confessados e barreiras derrubadas. Existe uma\ncomunhão deliciosamente amorosa na célula que está sendo renovada.\nComo você sabe que a sua célula está sendo renovada como comunidade? Pode parecer engraçado,\nmas há um sinal muito simples: as pessoas começam a cantar melhor! As pessoas cantam melhor\nquando sentem que a célula está viva, quando a célula está \"em fogo\". Quando sentem a presença de\nDeus nas celebrações.\n\n3. Renovação de Propósitos\n\n      A renovação de propósitos (ou missão) é quando a célula começa a descobrir que: Nós\nestamos aqui para muito mais do que passarmos bem; temos uma missão, um objetivo, um\npropósito. É quando as pessoas dizem: \"Não estamos aqui apenas como um grupo para receber uma\npequena bênção; estamos aqui com uma missão e por uma razão.\"\n       Os dois primeiros tipos de renovação pessoal e comunitária\" ocorrem frequentemente em\nmuitas células, mas infelizmente paramos por aí e não vamos adiante na busca do terceiro e do\nquarto níveis.\n\n                                                                                 Igreja de Vencedores\n\n 4. Renovação estrutural\n\n        Quando você consegue a renovação pessoal, a comunitária e a renovação de propósitos\n (missão), inevitavelmente a célula começa a crescer. Mas, quando começa a crescer, você\n eventualmente vai precisar fazer algumas mudanças organizacionais porque você não pode colocar\n vinho novo em vasilhames velhos. Se você insiste com os velhos vasilhames vai abafar o\n crescimento.\n       É isto que acontece, literalmente, com milhares e milhares de células. Você precisa dessa\n renovação estrutural porque não existem mudanças duradouras sem mudanças organizacionais.\n       Agora, veja muito bem isso que vou dizer: Você não pode começar com esse quarto tipo de\n renovação. Se você começar tentando mudar sua estrutura sem ter a renovação pessoal, comunitária\n e de propósitos, vai ser levado à guilhotina! As pessoas não gostam de mudanças a não ser que seus\n corações tenham sido conquistados e preparados para mudar.\n \"Uma mesma medida não cabe em todos\".\n       Como eu disse, para sua célula continuar crescendo, sua estrutura precisa crescer, mas não há\n uma única estrutura que sirva de modelo e funcione bem em sua célula para todo o sempre. Quantas\n vezes uma célula deveria se re-estruturar. \"Aproximadamente todas as vezes que completar 45% de\n seu crescimento\".\n       Jesus disse que você não pode colocar vinho novo em odres velhos (Lucas 5:37). Nada pode\n se expandir sem uma estrutura flexível, isso significa que você precisa mudar e adaptar sua estrutura\n ao crescimento. Somente aí, as barreiras serão derrubadas e você continuará indo em frente na\n conquista da visão de Deus.\n\n       Napoleão uma vez apontou para o mapa da China e disse: \"Ali está um gigante adormecido. Se\ndespertar será imbatível.\" Nos dias de hoje o Igreja de Vencedores compara-se ao gigante adormecido.\n      Os membros ativos na maioria das células simplesmente significam aqueles que frequentam\nregularmente. Não muito mais do que isso é esperado. Mas Deus tem uma expectativa muito maior\npara cada cristão. Ele espera que todo cristão use os dons e talentos no ministério. Se pudermos\ndespertar e libertar os talentos reprimidos, recursos pessoais, criatividade e energia, encontradas numa\ncélula simples, o cristianismo vai explodir num crescimento como nunca visto. Creio que a maior\nnecessidade das células é incentivar os membros para um ministério. 10% dos membros das células\nestão ativos em algum tipo de rede ministerial; 40% de todos os membros expressaram interesse em\nparticipar de alguma rede ministerial ou gostariam de estar envolvidos na rede ministerial, mas nunca\nforam convidados, nem sabem como ingressar.\n       Acho que um líder saudável nutre uma célula saudável por criar um sistema intencional bem\nplanejado de descoberta, mobilização e sustento dos dons e talentos dos membros da célula. É preciso\ndar às pessoas instruções de um processo simples que possam seguir, que os leve a um compromisso\nprofundo e possam servir mais ao Senhor. Precisam de uma trilha na qual possam caminhar para frente.\nEnvolva-os no jogo!\n      Devemos envolver cada membro na igreja, no discipulado, no Encontro com Deus, nas redes\nministeriais, na geração, na célula, no culto de oração, culto das gerações, celebração e etc.\n\nEstruturando sua célula para crescer e não para a estagnação\n\n 1. Você deve desenvolver uma inabalável convicção acerca do crescimento\n\nInicialmente, e isso é muito importante, você deve colocar claramente a ideia de que Deus\n quer que sua célula cresça. Ele não deseja que pare de crescer! Você nunca deve pedir desculpas por\n desejar que sua célula cresça. Deus quer que sua célula cresça; é o desejo dEle e também Seu\n mandamento. A razão porque as células devem crescer é o fato de que muitas pessoas estão indo\n para o inferno sem Jesus Cristo. Na medida em que houver pessoas na vizinhança de sua célula e\n que      não       conheçam        a      Jesus,      você      deve      continuar      crescendo.\n\n 2. Você deve mudar seu papel primário de membro para ser um líder\n\n      Você pode ajudar a célula a crescer até 12 membros com habilidades pessoas ou habilidades\n ministeriais, mas quando o crescimento excede os 12 membros isso requer habilidades de líder.\n Como um líder, você deve aprender a comunicar sua visão de uma maneira muito pessoal e prática.\n Deve também aprender a motivar sua célula através dos estudos e oração e entender que é mais fácil\n motivar um grupo do que motivar indivíduos. Um líder também equipa outros para o ministério. De\n outro modo, você vai se esgotar e a célula não vai crescer. Aqueles que programam a agenda devem\n subscrever essa agenda e devem aprender a organizar o tempo.\n\n 3. Você deve organizar baseado nos dons das pessoas de sua célula\n\n      A equipe que Deus lhe deu vai lhe mostrar como estruturar. Organizar, baseado nos dons, vai\n permitir que a célula se concentre no ministério e não na manutenção. Uma célula baseada nos dons\n vai encorajar toda a equipe. Isso também facilita o uso dos talentos nas atividades programadas\n (afinal de contas, por que Deus colocou esses talentos em sua célula?).\n\n     Construindo sua estrutura baseada nos dons e talentos, promoverá criatividade dentro da célula e\n permitirá o crescimento espontâneo. Os dons estão visíveis aos olhos e não se pode esperar a\n reunião de uma junta para dissecar cada possibilidade. As decisões tomadas se tornam mais\n eficientes enquanto a estrutura cresce estável.\n\n4. Você deve formar a equipe de Lideres em Treinamento com propósitos\n\n    Constrói-se uma equipe adicionando primeiro os generalistas e depois os especialistas. Primeiro\nvocê convida pessoas que saibam fazer muitas coisas porque você só tem um auxiliar. Daí, na\nmedida em que for avançando, poderá convidar mais e mais especialistas.\n\nQuando você precisa convidar pessoas para sua equipe? Tão logo você possa imediatamente, tanto\nquanto possível. Você vai convidar o quanto de voluntários possíveis e, desse modo, convidar pessoas\npara sua equipe tão rápido quanto você puder. A qualquer momento que você convidar alguém para\nsua equipe, será um passo de fé e permitirá que a célula cresça para um próximo nível. (VOCÊ DEVE\nCONVIDAR PESSOAS NÃO CONVERTIDAS).\n\n5. Você deve abrir mais de uma célula e cada uma delas ter mais de uma reunião por semana\n(Reunião de Célula e Reunião da Geração).\n\n                                                                                   Igreja de Vencedores\n\n      Obviamente para expandir a estrutura, você deve multiplicar e multiplicar, precisa abrir mais\ncélulas e cada uma com mais de uma reunião. Por quê? Porque quanto mais anzóis na água, mais\npeixes você pode fisgar.\n\n      Quando você deve abrir outra célula? Diria que é quando você tem no mínimo 6 a 12 pessoas na\ncélula. Se você está tentando alcançar novas pessoas, você tem de ter uma grande multidão de modo\nque as pessoas novas não se sintam menosprezadas, achando que ninguém olha para elas. (ABRIR AS\nCÉLULAS PARA SE FORMAREM AS GERAÇÕES)\n\n6. Você deve criar células de afinidade para aumentar a comunidade.\n\n      Quanto mais afinidade existir entre as células, melhores oportunidades vão surgir para a conexão\nentre as pessoas.\n\n7. Você deve intencionalmente quebrar a barreira da frequência nos dias especiais.\n\n     Multidão atrai multidão! As pessoas gostam de estar na multidão. Quando você tiver dias\nespeciais e grandiosos, como o Jantar da Amizade ou outro dia especial , provavelmente receberá mais\nde 12 pessoas (ou mais 50) e que vai expandir a visão de sua célula. Eles veem o que a célula pode ser,\ne veem com que se parece. Esses dias especiais ajudam sua célula a se ver tão grande, tão crescente e\ntão vibrante.\n\n8. Você deve avaliar seu progresso continuamente.\n\n       Dê uma olhada honesta e regular no que está acontecendo em sua célula (e para onde sua célula\nestá indo). Se você tentar estudar todas as coisas que quer empreender, decida buscar três ou quatro\nnúmeros significantes como, por exemplo, a frequência das Pessoas na Célula.\n\n       Então compare os números de onde você está agora com os números anteriores e qual são\nas projeção de seu planejamento futuro. Não se compare a si mesmo com a célula em\nfuncionamento. Francamente, isso não ajuda na avaliação da saúde de sua célula.\nFinalmente, decida por um padrão de medida da saúde de sua célula e trabalhe nisso. O processo é\nconstante; você pode atingir o alvo que estabeleceu, mas amanhã é um novo dia. Avalie continuamente\nseu progresso e faça os ajustes necessários para crescer saudável, enquanto os números aumentam.\n\nDISCIPULADO\n     1. Tenha agora um momento de oração a Deus. Agradeça por tudo e peça para ajudá-lo, durante\n     toda a sua vida cristã, a temer, louvar, glorificar e bem dizer o seu nome poderoso.\n     2. Faça uma aliança no reino espiritual para que você nunca venha murmurar contra nossa igreja,\n     contra nossos Pastores e contra a liderança, pois esta é a família que Deus lhe deu e aqui está a\n     sua certidão de nascimento espiritual, é a Igreja onde você nasceu para Deus.\n     3. Pense, pelo menos, em três pessoas que ainda não passaram pelo Encontro com Deus, e fale a\n     elas sobre o grande amor de Jesus por elas.\n     4. Procure ainda nesta semana se envolver em algum Ministério.\n     5. Procure abrir uma Célula, Geração ou uma Congregação.\n     Adquira o livro: Pequenos Grupos com Propósitos – Steve Gladen\n\nVERIFIQUE O QUE VOCÊ APRENDEU\n\n1. Quais são os cinco propósitos de uma igreja bíblica?\n\n______________________________________________________________________________\n\n2. O que é o \"Ide\" de Jesus?\n\n______________________________________________________________________________\n\n3. Defina células-simples.\n\n______________________________________________________________________________\n\n4. Defina múltiplas-células.\n\n______________________________________________________________________________\n\n5. Defina gerações.\n\n______________________________________________________________________________\n\n                                                                                   Igreja de Vencedores\n         198", "quiz": [{"q": "Qual é o texto bíblico-base da lição \"IGREJA COM PROPÓSITOS\"?", "options": ["Gálatas 5:1,4,5,13,14,16-25; Colossenses 3:5-10; II", "Gálatas 5.22,23", "2\nCoríntios     5:14", "Mateus 6:9-15; Lucas 11:1-4; II Crônicas 7:14"], "answer": 2}, {"q": "Qual destes é um dos tópicos estudados na lição \"IGREJA COM PROPÓSITOS\"?", "options": ["Renovação Comunitária", "Processos De Libertação", "Você Foi Planejado Para Agradar A Deus", "Defina O Estagio Da Célula – Edificação"], "answer": 0}, {"q": "Qual destes tópicos NÃO faz parte da lição \"IGREJA COM PROPÓSITOS\"?", "options": ["Renovação Pessoal", "Renovação De Propósitos", "Veja-Se Crescendo:", "Você Deve Formar A Equipe De Lideres Em Treinamento Com Propósitos"], "answer": 2}]}, {"num": 31, "title": "REDE MINISTERIAL", "verseRef": "1 Pe 4: 10, 11", "content": "TEXTO BÍBLICO\n\n     \"Servi uns aos outros, cada um conforme o dom que recebeu, como bons despenseiros da\nmultiforme graça de Deus... se alguém serve, faça-o na força que Deus supre, para que em todas as\ncousas seja Deus glorificado...\" (1 Pe 4: 10, 11)\n\n     Rede Ministerial\n\n      A maioria dos cristãos deseja servir. A maioria sabe que deve servir. Mas muitos cristãos não\nsabem como podem servir da melhor maneira possível. Este é o propósito da Rede Ministerial.\n   A Rede Ministerial foi criada para auxiliá-lo a identificar tudo o que Deus lhe proporcionou para\nservir (sua paixão ministerial, seus dons espirituais e seu estilo pessoal - chamado o Perfil de Servo),\nde forma que você possa dar sua contribuição única ao Corpo de Cristo num lugar de serviço\nsignificante. Aos olhos de Deus, cada um é \"nota 10\" em alguma área! Você Sabe qual é a área em que\nvocê é \"nota 10\"?\n\n      Da mesma forma que o corpo humano não poderia funcionar bem se os olhos, ouvidos e mãos\nnão estivessem cumprindo seus papéis, o Corpo de Cristo, a Igreja, não poderá funcionar da forma que\nDeus planejou se cada cristão não fizer sua parte. Quando você desempenhar sua parte, construirá\nrelacionamentos duradouros e fará uma diferença para o Reino com sua vida.\n   A Rede Ministerial pode ajudá-lo a colocar as PESSOAS CERTAS, nos LUGARES CERTOS,\npelas RAZÕES CERTAS. Para isso há um processo de três passos: primeiro passo: Descoberta;\nsegundo passo: Gabinete e terceiro: Serviço.\n\n     DESCOBERTA\n\n    A Descoberta da Rede Ministerial serve para que você possa entender melhor o plano de Deus\npara sua vida, ou seja, quem você é, qual o propósito da sua Igreja e o papel singular que você pode\ndesempenhar no Corpo de Cristo. Com isto você descobrirá:\n\n      A Paixão ministerial que Deus lhe deu, indicando onde você deve servir.\n\n      Os Dons espirituais que Deus lhe deu, indicando o que você deve fazer.\n\n      O Estilo pessoal que Deus lhe deu, indicando como você deve servir. Juntos, esses itens formam\nseu Perfil de Servo e indicam o que você pode fazer de melhor no Corpo de Cristo.\n\n     GABINETE\n\n    Após a identificação da sua paixão, seus dons e seu estilo pessoal (Perfil de Servo), através da\nDescoberta da Rede Ministerial, você terá a oportunidade de conversar com seu líder. Ele o ajudará a\n\nencontrar opções de ministério na base, de acordo com seu Perfil de Servo. Você poderá conversar\nsobre os vários ministérios existentes e conhecê-los melhor. Existirá um, com o qual você realmente se\nidentificará.\n\n     SERVIÇO\n\n     O alvo da Rede Ministerial é o serviço. Não apenas a descoberta do seu perfil ou até mesmo a\nconversa com o líder, mas o serviço. Você tem um ministério a desempenhar no Corpo de Cristo, algo\nsingular que somente você pode fazê-lo.\n\n     \"Pois somos feituras dEle, criados em Cristo Jesus para as boas obras, as quais Deus de antemão\npreparou para que andássemos nelas.\" (Ef.2.10).\n\nRede Ministerial na Base.\n\nPara a Base, a Rede Ministerial servirá como uma preciosa ferramenta para despertar o valor do servir\ne    mobilizar     voluntários    em     ministérios  frutíferos,   conforme     o     mandamento:\n\"Servi uns aos outros, cada um conforme o dom que recebeu, como bons despenseiros da multiforme\ngraça de Deus... se alguém serve, faça-o na força que Deus supre, para que em todas as cousas seja\nDeus glorificado...\"\n\n(1 Pe 4: 10, 11)\n\n     De acordo com a Parábola dos Talentos (Mt.25), podemos entender que Deus espera um retorno\ndo seu investimento. Como cristão, Deus tem nos dado a oportunidade - e a responsabilidade - de levar\ntodos à descoberta do Seu plano para cada um. Na verdade, é a nossa fidelidade em capacitar os santos\npara o desempenho de seu serviço que pode nos levar a ter discípulos frutíferos e realizados no Corpo\nde Cristo.\n\n      Os cristãos eficazes devem identificar e desenvolver nas pessoas ao seu redor as qualidades que\nreflitam as características que Deus as deu, as quais são cruciais para o cumprimento da missão. Jesus\nconseguiu ver algo em Pedro que ninguém tinha visto ainda. Ao ajudá-lo a compreender melhor como\nDeus o havia feito, Pedro foi liberto para ser um dos líderes mais dinâmicos da história. Para ajudá-lo\nneste processo, a REDE MINISTERIAL procura então colocar as pessoas em um ministério de\nacordo com as características que Deus as deu. Ou seja, todos devem servir de acordo com o seu Perfil\nde Servo, o plano de Deus para cada cristão no que diz respeito ao serviço no Corpo de Cristo. Este\nPerfil é composto de três elementos: a PAIXÃO MINISTERIAL, os DONS ESPIRITUAIS e o\nESTILO PESSOAL.\n\n                                                                                    Igreja de Vencedores\n\nA PAIXÃO MINISTERIAL\n\n       Quando conhecermos a nossa paixão saberemos aonde deveremos investir nosso tempo.\nImportamo-nos com algumas coisas mais que outras, e desejamos fazer diferença em algum lugar.\nDentre outros fatores, a paixão é um desejo emocional forte que nos direciona a causar impacto com\ngrupos de pessoas (crianças, adolescentes, jovens, mulheres, homens, casais, famílias; louvor,\nteatro, danças, retiros espirituais, Ensino, área social, dirigente de congregação, intercessão e\netc.).\n\nOS DONS ESPIRITUAIS\n\n     Os dons espirituais são habilidades divinas dadas pelo Espírito Santo para cada cristão, segundo o\ndesígnio e a graça de Deus. Ele tem um propósito para cada um de nós.\n\nO ESTILO PESSOAL\n\n      O estilo pessoal que Deus nos deu indica a maneira como nós preferimos nos relacionar com o\nmundo e com as pessoas ao nosso redor. Enquanto há muitos modelos disponíveis hoje, para nos\najudar a entender os temperamentos, as personalidades ou os estilos pessoais, veja estes dois elementos\npráticos e essenciais para obter um desempenho máximo. O primeiro: considere como as pessoas são\nmotivadas. O Segundo: considere como elas se organizam.\n\n     Quanto à motivação, num extremo estão aquelas pessoas que são motivadas pelos\nrelacionamentos e por estarem prioritariamente envolvidos com pessoas. No outro extremo há\naquelas pessoas que são motivadas pelas tarefas.\n\n     Quanto à organização, existem aquelas pessoas que organizam seu mundo com estruturas,\noutros organizam seu mundo sem muitas estruturas. As pessoas \"estruturadas\" gostam de terminar\nas coisas AGORA!!! As \"não estruturadas\" preferem deixar as opções em aberto para ver o que\nacontecerá, tomando decisões e terminando os trabalhos no último momento possível.\n\n     Cada pessoa é um ministro com dons e chamado divino. As pessoas fazem relativamente pouco\npara o Reino. Dons e chamados são liberados através do envolvimento com outras pessoas,\nespecialmente em grupos pequenos, onde existem relacionamentos comprometidos e\nsaudáveis. Portanto o Ministério é um grupo de pessoas com o mesmo sonho e o mesmo propósito.\n\n     Deus tem mandado um recado insistente para você: Ele quer que você seja um servo, e que seus\ndons e conhecimentos sejam usados na sua obra.\n\n     Hoje é o dia de você descobrir seu chamado ministerial, em qual desses ministérios você se\nencaixa melhor?\n\nREDES MINISTERIAIS\n\n     Redes Ministeriais são as organizações de equipes homogêneas e heterogenias, com objetivos\nespecíficos, promovendo uma interação maior daqueles que estiverem envolvidos ou que se forem\nchegando para a família cristã; direcionados para atingirem os alvos propostos pela igreja.\n\n     Rede Ministerial Homogenia: Rede Composta Pelo Mesmo Grupo - crianças, adolescentes,\njovens, mulheres, homens, casais, famílias e etc..\n\n     Rede Ministerial Heterogenia: Rede Mista em Grupo - louvor, teatro, danças, retiros espirituais,\nEnsino, área social, dirigente de congregação, intercessão e etc.\n\n     Se porventura não exista um grupo funcionando conforme o dom da pessoa isso não impede\nque seja criado um novo grupo conforme o dom da mesma.\n\n     Escolha ainda hoje um grupo que seja conforme seu dom, sua paixão e seu ministério, e\nsirva a Deus com amor e intensidade...\n\n     *PESSOAS CERTAS, nos LUGARES CERTOS, pelas RAZÕES CERTAS.\n\n   * PARE UM POUCO E PENSE EM QUAL GRUPO VOCÊ GOATARIA DE ATUAR\nPARA SERVIR MELHOR O SENHOR?\n\n     \"Servi uns aos outros, cada um conforme o dom que recebeu, como
