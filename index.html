// ---------------- USUÁRIO / CADASTRO ----------------
const UID_KEY = 'discipulado_uid';
const NAME_KEY = 'discipulado_user_name';

function getLocalUser(){
  const uid = localStorage.getItem(UID_KEY);
  const nameRaw = localStorage.getItem(NAME_KEY);
  if(!uid || !nameRaw) return null;
  try{ return { uid, ...JSON.parse(nameRaw) }; }catch(e){ return null; }
}

function makeUid(){
  if(window.crypto && crypto.randomUUID) return crypto.randomUUID();
  return 'u_' + Date.now() + '_' + Math.random().toString(36).slice(2,10);
}

let currentUser = getLocalUser();
let whatsappLink = '';
let isAdmin = false;

function registerUser(firstName, lastName){
  const uid = makeUid();
  const profile = { firstName: firstName.trim(), lastName: lastName.trim() };
  localStorage.setItem(UID_KEY, uid);
  localStorage.setItem(NAME_KEY, JSON.stringify(profile));
  currentUser = { uid, ...profile };
  if(FIREBASE_READY && db){
    db.ref('users/'+uid).update({
      firstName: profile.firstName,
      lastName: profile.lastName,
      createdAt: firebase.database.ServerValue.TIMESTAMP
    });
  }
  logAccess();
}

function logAccess(){
  if(!FIREBASE_READY || !db || !currentUser) return;
  const ts = firebase.database.ServerValue.TIMESTAMP;
  db.ref('users/'+currentUser.uid+'/lastSeen').set(ts);
  db.ref('users/'+currentUser.uid+'/firstName').set(currentUser.firstName);
  db.ref('users/'+currentUser.uid+'/lastName').set(currentUser.lastName);
  db.ref('users/'+currentUser.uid+'/accesses').push(ts);
}

function heartbeat(){
  if(!FIREBASE_READY || !db || !currentUser) return;
  db.ref('users/'+currentUser.uid+'/lastSeen').set(firebase.database.ServerValue.TIMESTAMP);
}

function loadWhatsappLink(cb){
  if(!FIREBASE_READY || !db) return;
  db.ref('config/whatsappLink').once('value').then(snap => {
    whatsappLink = snap.val() || '';
    if(cb) cb();
  });
}

function saveWhatsappLink(link){
  whatsappLink = link;
  if(FIREBASE_READY && db){
    if(link){ db.ref('config/whatsappLink').set(link); }
    else{ db.ref('config/whatsappLink').remove(); }
  }
}

function getLesson(num){ return LESSONS.find(l => l.num === num); }

function overallStats(){
  const total = LESSONS.length;
  const studied = LESSONS.filter(l => progress[l.num] && progress[l.num].studied).length;
  return { total, studied, pct: Math.round((studied/total)*100) };
}

function firstUnstudied(){
  const l = LESSONS.find(l => !(progress[l.num] && progress[l.num].studied));
  return l || LESSONS[0];
}

// ---------------- ROUTER ----------------
let route = currentUser ? { view:'home' } : { view:'register' };

function nav(newRoute){
  route = newRoute;
  render();
  window.scrollTo(0,0);
}

function render(){
  const app = document.getElementById('app');
  if(route.view === 'register') app.innerHTML = renderRegister();
  else if(route.view === 'home') app.innerHTML = renderHome();
  else if(route.view === 'lesson') app.innerHTML = renderLesson(route.num);
  else if(route.view === 'quiz') app.innerHTML = renderQuizStart(route.num);
  else if(route.view === 'admin'){
    app.innerHTML = renderAdminLoading();
    loadAdminData();
  }
  attachHandlers();
}

function renderHome(filter){
  const stats = overallStats();
  const fu = firstUnstudied();
  filter = (filter||'').toLowerCase();

  let phasesHtml = '';
  PHASES.forEach((ph, pi) => {
    const items = LESSONS.filter(l => l.num >= ph.range[0] && l.num <= ph.range[1] &&
      (!filter || l.title.toLowerCase().includes(filter) || String(l.num).includes(filter)));
    if(filter && items.length === 0) return;
    phasesHtml += `<div class="phase">
      <div class="phase-head"><span class="phase-num">FASE ${pi+1}</span><span class="phase-title">${ph.label}</span></div>
      <div class="phase-desc">${ph.desc}</div>
      ${items.map(l => lessonCard(l)).join('')}
    </div>`;
  });

  return `
    <div class="topbar">
      <div class="crumbs">✟ Igreja de Vencedores</div>
      <h1>Discipulado</h1>
      <div class="sub">Classe da Maturidade — 46 lições completas</div>
      <div class="progress-wrap">
        <div class="progress-row"><span>${stats.studied} de ${stats.total} lições concluídas</span><span>${stats.pct}%</span></div>
        <div class="progress-track"><div class="progress-fill" style="width:${stats.pct}%"></div></div>
      </div>
    </div>
    <div class="continue-card" data-nav="lesson" data-num="${fu.num}">
      <div>
        <div class="label">${stats.studied===0 ? 'Começar' : 'Continuar'} a jornada</div>
        <div class="title">Lição ${fu.num} · ${fu.title}</div>
      </div>
      <div class="arrow">›</div>
    </div>
    <div class="search-wrap" style="margin-top:20px;">
      <input class="search-box" id="searchInput" placeholder="Buscar lição por número ou título..." value="${filter||''}">
    </div>
    ${phasesHtml || '<div class="empty-note">Nenhuma lição encontrada.</div>'}
    ${whatsappSectionHtml()}
    <div class="admin-trigger" id="adminTrigger" title="">🔒</div>
  `;
}

function lessonCard(l){
  const p = progress[l.num] || {};
  const done = !!p.studied;
  let quizBadge = '';
  if(p.quiz && typeof p.quiz.correct === 'number'){
    const good = p.quiz.correct === p.quiz.total;
    quizBadge = `<span class="quiz-badge ${good?'good':''}">Quiz ${p.quiz.correct}/${p.quiz.total}</span>`;
  } else {
    quizBadge = `<span class="quiz-badge">Quiz pendente</span>`;
  }
  return `
    <div class="lesson-card ${done?'done':''}" data-nav="lesson" data-num="${l.num}">
      <div class="lesson-num">${done ? '✓' : l.num}</div>
      <div class="lesson-info">
        <div class="lesson-title">${l.title}</div>
        <div class="lesson-meta">${quizBadge}</div>
      </div>
      <div class="chev">›</div>
    </div>
  `;
}

// ---------------- LESSON ----------------
function formatContent(raw){
  // strip leading TEXTO BÍBLICO / COMENTÁRIO boilerplate lines already mostly clean
  let text = raw;
  text = text.replace(/^TEXTO BÍBLICO[\s\S]*?\)\.?\s*\n/, ''); // remove leading verse block (shown separately)
  text = text.replace(/^\s*"[^"]*"\s*\([^)]*\)\s*\n/, '');
  text = text.replace(/^COMENTÁRIO\s*\n/, '');
  const lines = text.split('\n');
  let html = '';
  let para = [];
  function flush(){
    if(para.length){
      html += `<p>${para.join(' ').trim()}</p>`;
      para = [];
    }
  }
  lines.forEach(line => {
    const t = line.trim();
    if(!t){ flush(); return; }
    if(/^[IVX]{1,5}\.\s+.{2,80}$/.test(t) || /^\d{1,2}\.\s+[A-ZÀÁÂÃÉÊÍÓÔÕÚÇ][^a-z]{2,60}$/.test(t) || /^(INTRODUÇÃO|CONCLUSÃO)$/i.test(t)){
      flush();
      html += `<div class="head">${t}</div>`;
    } else {
      para.push(t);
    }
  });
  flush();
  return html || `<p>${text}</p>`;
}

function renderLesson(num){
  const l = getLesson(num);
  const p = progress[l.num] || {};
  const done = !!p.studied;
  return `
    <div class="topbar" style="padding-bottom:18px;">
      <button class="backbtn" data-nav="home">‹ Todas as lições</button>
      <div class="lesson-header" style="padding:14px 0 0;">
        <div class="lesson-eyebrow">Lição ${l.num} de ${LESSONS.length}</div>
        <h2>${l.title}</h2>
      </div>
    </div>
    <div class="verse-card">
      <div class="verse-text">${l.verseRef && verseText(l) ? '"'+verseText(l)+'"' : 'Leia o texto-base abaixo.'}</div>
      <div class="verse-ref">${l.verseRef || ''}</div>
    </div>
    <div class="lesson-content">${formatContent(l.content)}</div>
    <div class="action-bar">
      <button class="btn btn-outline ${done?'on':''}" data-toggle-studied="${l.num}">${done ? '✓ Estudada' : 'Marcar como estudada'}</button>
      <button class="btn btn-primary" data-nav="quiz" data-num="${l.num}">Fazer Quiz →</button>
    </div>
  `;
}

function verseText(l){
  const m = l.content.match(/"([^"]{5,400})"/);
  return m ? m[1] : '';
}

// ---------------- QUIZ ----------------
let quizState = null;

function renderQuizStart(num){
  const l = getLesson(num);
  quizState = { num, i:0, correct:0, answered:false, selected:null };
  return renderQuizQuestion();
}

function renderQuizQuestion(){
  const l = getLesson(quizState.num);
  const quiz = l.quiz;
  if(quizState.i >= quiz.length){
    return renderQuizResult();
  }
  const q = quiz[quizState.i];
  return `
    <div class="topbar" style="padding-bottom:14px;">
      <button class="backbtn" data-nav="lesson" data-num="${l.num}">‹ Sair do quiz</button>
      <div class="lesson-header" style="padding:14px 0 0;">
        <div class="lesson-eyebrow">Quiz · Lição ${l.num}</div>
        <h2 style="font-size:19px;">${l.title}</h2>
      </div>
    </div>
    <div class="quiz-progress">Pergunta ${quizState.i+1} de ${quiz.length}</div>
    <div class="quiz-q">${q.q}</div>
    <div class="quiz-opts">
      ${q.options.map((opt,idx) => `<button class="quiz-opt" data-opt="${idx}">${opt}</button>`).join('')}
    </div>
  `;
}

function renderQuizResult(){
  const l = getLesson(quizState.num);
  const quiz = l.quiz;
  const score = quizState.correct;
  const total = quiz.length;
  progress[l.num] = progress[l.num] || {};
  progress[l.num].quiz = { correct: score, total: total };
  saveProgress(progress);
  const pct = Math.round((score/total)*100);
  let msg = 'Continue estudando!';
  if(pct === 100) msg = 'Excelente! Você domina esta lição.';
  else if(pct >= 60) msg = 'Muito bom! Revise os pontos que errou.';
  return `
    <div class="topbar" style="padding-bottom:14px;">
      <button class="backbtn" data-nav="lesson" data-num="${l.num}">‹ Voltar à lição</button>
      <div class="lesson-header" style="padding:14px 0 0;">
        <div class="lesson-eyebrow">Resultado · Lição ${l.num}</div>
        <h2 style="font-size:19px;">${l.title}</h2>
      </div>
    </div>
    <div class="quiz-result">
      <div class="score">${score}/${total}</div>
      <div class="msg">${msg}</div>
      <div class="action-bar" style="border:none; justify-content:center;">
        <button class="btn btn-outline" data-nav="lesson" data-num="${l.num}">Voltar à lição</button>
        <button class="btn btn-primary" data-nav="quiz" data-num="${l.num}">Refazer Quiz</button>
      </div>
    </div>
  `;
}

// ---------------- ADMIN DASHBOARD ----------------
function renderAdminLoading(){
  return `
    <div class="topbar" style="padding-bottom:14px;">
      <button class="backbtn" data-nav="home">‹ Voltar</button>
      <div class="lesson-header" style="padding:14px 0 0;">
        <div class="lesson-eyebrow">Painel do Administrador</div>
        <h2 style="font-size:21px;">Acessos e alunos</h2>
      </div>
    </div>
    <div class="empty-note">Carregando dados...</div>
  `;
}

function loadAdminData(){
  if(!FIREBASE_READY || !db){
    document.getElementById('app').innerHTML = renderAdminNoFirebase();
    attachHandlers();
    return;
  }
  db.ref('users').once('value').then(snap => {
    const usersObj = snap.val() || {};
    const users = Object.keys(usersObj).map(uid => ({ uid, ...usersObj[uid] }));
    document.getElementById('app').innerHTML = renderAdminDashboard(users);
    attachHandlers();
  }).catch(err => {
    document.getElementById('app').innerHTML = `<div class="empty-note">Erro ao carregar dados: ${err.message}</div>`;
  });
}

function renderAdminNoFirebase(){
  return `
    <div class="topbar" style="padding-bottom:14px;">
      <button class="backbtn" data-nav="home">‹ Voltar</button>
      <div class="lesson-header" style="padding:14px 0 0;">
        <div class="lesson-eyebrow">Painel do Administrador</div>
        <h2 style="font-size:21px;">Configuração pendente</h2>
      </div>
    </div>
    <div class="empty-note">O Firebase ainda não foi configurado neste arquivo (firebaseConfig no início do script). Assim que configurar, os acessos, cadastros e o link do WhatsApp passam a funcionar automaticamente.</div>
  `;
}

function renderAdminDashboard(users){
  const now = Date.now();
  const ONLINE_MS = 3*60*1000;
  const WEEK_MS = 7*24*60*60*1000;
  const MONTH_MS = 30*24*60*60*1000;

  let online=0, week=0, month=0;
  users.forEach(u => {
    const last = u.lastSeen || 0;
    if(now - last < ONLINE_MS) online++;
    if(now - last < WEEK_MS) week++;
    if(now - last < MONTH_MS) month++;
  });

  users.sort((a,b) => (b.lastSeen||0) - (a.lastSeen||0));

  const userRows = users.map(u => {
    const accessesObj = u.accesses || {};
    const accessTimes = Object.values(accessesObj).sort((a,b)=>b-a);
    const isOnline = (now - (u.lastSeen||0)) < ONLINE_MS;
    const lastSeenStr = u.lastSeen ? new Date(u.lastSeen).toLocaleString('pt-BR') : '—';
    const accessListHtml = accessTimes.slice(0,60).map(t => `<div>${new Date(t).toLocaleString('pt-BR')}</div>`).join('') || '<div>Nenhum acesso registrado.</div>';
    return `
      <div class="user-row" data-toggle-user="${u.uid}">
        <div class="top">
          <div class="name"><span class="dot ${isOnline?'online':''}"></span>${(u.firstName||'')} ${(u.lastName||'')}</div>
          <div class="meta">${accessTimes.length} acesso(s)</div>
        </div>
        <div class="meta">Último acesso: ${lastSeenStr}</div>
        <div class="user-access-list" style="display:none;" id="acc-${u.uid}">${accessListHtml}</div>
      </div>
    `;
  }).join('');

  return `
    <div class="topbar" style="padding-bottom:14px;">
      <button class="backbtn" data-nav="home">‹ Voltar</button>
      <div class="lesson-header" style="padding:14px 0 0;">
        <div class="lesson-eyebrow">Painel do Administrador</div>
        <h2 style="font-size:21px;">Acessos e alunos</h2>
      </div>
    </div>
    <div class="stat-row">
      <div class="stat-card"><div class="n">${online}</div><div class="l">ONLINE AGORA</div></div>
      <div class="stat-card"><div class="n">${week}</div><div class="l">NA SEMANA</div></div>
      <div class="stat-card"><div class="n">${month}</div><div class="l">NO MÊS</div></div>
    </div>
    <div class="section-title">Alunos cadastrados (${users.length})</div>
    ${userRows || '<div class="empty-note">Nenhum aluno cadastrado ainda.</div>'}
    ${whatsappSectionHtml()}
  `;
}

// ---------------- EVENT HANDLING ----------------
function attachHandlers(){
  document.querySelectorAll('[data-nav]').forEach(el => {
    el.addEventListener('click', () => {
      const view = el.getAttribute('data-nav');
      const num = el.getAttribute('data-num');
      nav({ view, num: num ? parseInt(num) : undefined });
    });
  });

  const toggleBtn = document.querySelector('[data-toggle-studied]');
  if(toggleBtn){
    toggleBtn.addEventListener('click', () => {
      const num = parseInt(toggleBtn.getAttribute('data-toggle-studied'));
      progress[num] = progress[num] || {};
      progress[num].studied = !progress[num].studied;
      saveProgress(progress);
      render();
    });
  }

  document.querySelectorAll('[data-opt]').forEach(el => {
    el.addEventListener('click', () => {
      if(quizState.answered) return;
      const idx = parseInt(el.getAttribute('data-opt'));
      const l = getLesson(quizState.num);
      const q = l.quiz[quizState.i];
      quizState.answered = true;
      quizState.selected = idx;
      const correct = idx === q.answer;
      if(correct) quizState.correct++;
      document.querySelectorAll('.quiz-opt').forEach((b,i) => {
        b.classList.add('disabled');
        if(i === q.answer) b.classList.add('correct');
        else if(i === idx) b.classList.add('wrong');
      });
      setTimeout(() => {
        quizState.i++;
        quizState.answered = false;
        document.getElementById('app').innerHTML = renderQuizQuestion();
        attachHandlers();
        window.scrollTo(0,0);
      }, 1100);
    });
  });

  const searchInput = document.getElementById('searchInput');
  if(searchInput){
    searchInput.addEventListener('input', (e) => {
      const val = e.target.value;
      document.getElementById('app').innerHTML = renderHome(val);
      attachHandlers();
      document.getElementById('searchInput').focus();
      const s = document.getElementById('searchInput');
      s.setSelectionRange(s.value.length, s.value.length);
    });
  }

  // registro
  const regSubmit = document.getElementById('regSubmit');
  if(regSubmit){
    regSubmit.addEventListener('click', () => {
      const first = document.getElementById('regFirst').value.trim();
      const last = document.getElementById('regLast').value.trim();
      if(!first || !last){
        document.getElementById('app').innerHTML = renderRegister('Preencha nome e sobrenome para continuar.');
        attachHandlers();
        return;
      }
      registerUser(first, last);
      nav({ view:'home' });
    });
  }

  // gatilho do painel admin (clique no ícone de cadeado)
  const adminTrigger = document.getElementById('adminTrigger');
  if(adminTrigger){
    adminTrigger.addEventListener('click', () => {
      const pass = prompt('Senha do administrador:');
      if(pass === 'Atlanta'){
        isAdmin = true;
        nav({ view:'admin' });
      } else if(pass !== null){
        alert('Senha incorreta.');
      }
    });
  }

  // expandir histórico de acessos de um aluno
  document.querySelectorAll('[data-toggle-user]').forEach(el => {
    el.addEventListener('click', () => {
      const uid = el.getAttribute('data-toggle-user');
      const listEl = document.getElementById('acc-'+uid);
      if(listEl) listEl.style.display = (listEl.style.display === 'none') ? 'block' : 'none';
    });
  });

  // salvar / excluir link do whatsapp (admin)
  const waSaveBtn = document.getElementById('waSaveBtn');
  if(waSaveBtn){
    waSaveBtn.addEventListener('click', () => {
      const val = document.getElementById('waLinkInput').value.trim();
      saveWhatsappLink(val);
      alert('Link salvo com sucesso.');
      render();
    });
  }
  const waDeleteBtn = document.getElementById('waDeleteBtn');
  if(waDeleteBtn){
    waDeleteBtn.addEventListener('click', () => {
      if(confirm('Remover o link do grupo do WhatsApp?')){
        saveWhatsappLink('');
        render();
      }
    });
  }
}

// ---------------- INICIALIZAÇÃO ----------------
if(currentUser) logAccess();
loadWhatsappLink(() => { if(route.view === 'home' || route.view === 'admin') render(); });
setInterval(heartbeat, 60000);

render();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./service-worker.js');
  });
}
</script>
