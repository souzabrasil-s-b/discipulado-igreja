32:5).\n      - Pecado tem nome. Não basta dizer: Ah, eu pequei muito! Deve – se dizer o pecado pelo\nnome. O Espírito Santo vai trazer consciência a você. Hoje é Peniel. É um encontro face a face com\nDeus, onde você vai lutar e prevalecer.\n\n       5. CONCLUSÃO\n       No início, talvez o pecado pareça agradável e prazeroso, mas, concluída a sua trajetória, fica o\nseu rastro de destruição, angústia e perdas. O único caminho de livramento é a volta para Deus, com\narrependimento e fé na morte expiatória de Jesus Cristo.\n       \"Enquanto eu calei o meu pecado, meu organismo sofreu as conseqüências\" (Sl 32:3).\n       - Houve um tempo de aparências – às vezes dizemos que está tudo bem quando tudo vai mal.\nA alegria só lhe foi devolvida quando confessou.\n       - O pecado nos tira do centro das decisões, já não sabemos decidir. Deus quer que vejamos os\natropelos do passado para que possamos romper com eles.\n       - O pecado destrói as nossas finanças. O reino de Davi entrou em deficiência financeira e não\nconseguiu romper com a locusta. No pecado não há cobertura espiritual.\n       - Davi se arrependeu! O que é arrependimento? (Pv 28:13). Não é remorso. No remorso há\nchoro, há sofrimento, mas depois volta e faz tudo de novo. No arrependimento há entrega total,\nrendição total, não há contra – argumentos. O arrependimento não é ressentimento, é uma dor profunda\nque vem por se reconhecer que pecou contra o Senhor, que foi cometido um ato terrível. É não querer\nnunca mais voltar a cometer o ato.\n       - Para a mudança acontecer tem que haver arrependimento. O arrependimento é uma dor\nprofunda que nos faz decidir nunca mais voltar ao pecado. Todas as vezes que recebemos a proposta do\npecado (tentação), nos lembramos da dor do nosso arrependimento e dizemos \"não\" ao pecado.\n       - Jesus se opõe a qualquer pessoa tolerante para com o pecado (I Co 5:2; Gl 5:21).\n       - Somos santos que odiamos e aborrecemos o pecado. Deus quer que cresçamos com Ele e é\npreciso ter arrependimento hoje. Quando o pecado é lembrado com dor, há cura. Em Peniel você terá\num encontro face a face com Deus. Chore em Sua presença. Hoje é dia de romper com o passado. Jesus\ndeseja riscar o escrito da dívida que é contra nós (Cl 2:12-15).\n\n      Fim da lição\n      ORIENTAÇÕES PARA O MINISTRADOR\n\n      1. Comunique que este é um tempo entre os encontristas e Deus: podem chorar, gritar,\narrepender-se em Sua presença.\n\n      2. Deve-se dizer que os pecados deverão ser confessados um a um, nome por nome, sem\nesquecer nada, inclusive as épocas em que ocorreram.\n\n      3. Ao fundo deverá estar tocando a música escolhida para esses momentos.\n\n       4. Este é um tempo que toma no mínimo 40 minutos (20 minutos em pé e 20 minutos de\njoelhos), até que todos sejam convencidos pelo Espírito Santo sobre seus pecados. (Deixe a música\n\n                                                                                    Igreja de Vencedores\n\ntocando e ore por entre o povo. Os intercessores devem Ter lenços de papel nas mãos para auxiliarem\naqueles que necessitarem caso estejam chorando).\n\n      5. Após o tempo de quebrantamento, orar por todos e por tudo que ainda irá acontecer nos dias\nvindouros no Encontro.\n\n       6. Mencionar que não devem conversar com ninguém antes, durante e após a refeição. O\nEspírito Santo estará ministrando a eles sobre várias situações de pecado. As conversações tiram a\natenção daquilo que Deus quer nos dizer.\n\n     Comente o que mais chamou a sua atenção:\n__________________________________________________________________________________\n__________________________________________________________________________________\n__________________________________________________________________________________\n_________________________________________________________________________________", "quiz": [{"q": "Qual é o texto bíblico-base da lição \"Tema: PENIEL\"?", "options": ["Gênesis 32:30; II Samuel 12", "2\nCoríntios     5:14", "Tiago 4:7; I João 3:8; Efésios 4:27;", "Colossenses 2.6"], "answer": 0}, {"q": "Qual destes é um dos tópicos estudados na lição \"Tema: PENIEL\"?", "options": ["Tem Omitido Pecado (De Roubo, Sonegação De Impostos, Etc)?", "O Lar Como Extensão Da Igreja", "Na Nova Vida Em Cristo Devo Eliminar As Obras Da Carne", "Se Quisermos Ser Libertos Do Domínio De Satanás (I Jo 3:8B);"], "answer": 0}, {"q": "Qual destes tópicos NÃO faz parte da lição \"Tema: PENIEL\"?", "options": ["Uma Nova Vida Espiritual", "Tem Omitido Pecado (De Roubo, Sonegação De Impostos, Etc)?", "Tem Sido Sensual, Indecente, Defraudador? (I Co 6:18)", "Somos Conduzidos Ao Arrependimento (Pv 28:13)"], "answer": 0}]}, {"num": 38, "title": "O QUE O SENHOR FAZ DURANTE O ENCONTRO", "verseRef": "Amós 4:12b ;João 4:1-42; Tiago 1:21-22", "content": "Veremos dois tipos de encontro:\n      Encontro com o mundo (Tg 4:4).\n      Encontro com Deus (Cl 1:13).\n\n        1. ENCONTRO COM O MUNDO\n        Precisamos nos conscientizar de que um dia nós nos encontramos com o mundo e esse encontro\nnos deixou com muitas sequelas. Só o Encontro com Jesus pode tirar as sequelas do encontro com o\nmundo. O encontro com o mundo somente ministra destruição.\n        O ficar calado no Encontro significa reflexão sobre as sequelas que o encontro com o mundo\ndeixou. O encontro com o mundo busca seus próprios interesses, a felicidade própria. O mundo tenta\nnos impedir de encontrarmos com Jesus: certamente muitos tiveram dificuldades de chegarem aqui\n(citar algumas, se for o caso).\n\n       - Os homens seguem os caminhos que o mundo oferece.\n       Passam por cima dos outros, buscam seus próprios interesses, denigrem a imagem uns dos\noutros, mentem, enganam, etc.\n\n      - Os homens buscam a felicidade e satanás se aproveita para encantá-los.\n      Nada há de errado em procurar a felicidade. Mas, por onde andamos e o que fazemos para\nconseguir o que pensamos ser a nossa felicidade? As pessoas só pensam em si, só elas são prioridade\nna busca da felicidade. Um dia nós fomos assim e andamos por muitos caminhos tortuosos, julgando\nsempre estar buscando a felicidade.\n\n      - Os homens buscam a fama, o dinheiro, o prazer (isto é o encontro com o mundo).\n      Tudo isso inicia um processo de destruição, pois as pessoas buscam a felicidade nos lugares\nerrados. Acham que ter fama, prazer, dinheiro, é tudo.\n\n       1.1. As ilusões do mundo\n       a) A fama – desejo de ser conhecido por todos, de ser admirado. A fama é uma das maiores\nmentiras da vida do homem. Desde criança o diabo trabalha para gerar em nós um desejo pela fama,\npelo estrelato. Os artistas, os heróis, as modelos passam a ser os ídolos – é assim mesmo que os\nchamamos no mundo. Deixamo-nos iludir tanto quanto os próprios ídolos deste mundo.\n       b) O dinheiro – O desejo pelo mundo gera situações estranhas: pessoas dão R$ 15,00 num\ncartão de bingo mas não dão oferta na Igreja; filhos matam os pais por causa de herança; pessoas\njogam tudo o que têm e não conseguem nada, etc. A bíblia diz que não devemos amar o dinheiro (I Tm\n6:10). Se o dinheiro for mal canalizado ele trará infelicidade. Nem sempre o dinheiro vai comprar\n\n                                                                                Igreja de Vencedores\n\nsaúde, respeito, carinho, amor, honra e etc. Mas no mundo é assim: se amanhã você não mais tiver\ndinheiro, as pessoas não o respeitarão. Deus deve ser o centro do nosso amor, não o dinheiro. O\ndinheiro é uma bênção quando bem aplicado e quando abençoa outros, mas é uma maldição quando\nchega com maus desígnios ao coração (Mt 6:21).\n       c) O prazer – Muitas pessoas, quando no mundo, só vivem em função de buscar prazer.\nInúmeros casamentos são destruídos porque se busca prazer sexual em uma terceira pessoa.\nGeralmente, não interessa, ao homem do mundo, se sua esposa se satisfaz sexualmente, desde que ele\nobtenha o seu prazer pessoal. Pessoas pagam para se prostituir. Suas relações sexuais só servem para\nterem prazer físico, como se homens e mulheres fossem animais; nunca pensam que os seus parceiros\nsão a imagem de Deus.\n\n        1.2. Resultados do encontro com o mundo\n        Todos os três itens acima referem-se a coisas superficiais. Ainda que consigamos fama, dinheiro\ne prazer passageiro, não temos garantida a \"felicidade\". Este é o resultado do encontro com o mundo;\nisto foi o que o diabo programou para você: uma grande frustração.\n            - Hoje viemos aqui para buscar algo diferente.\n            - Nós que buscávamos coisas superficiais, hoje estamos buscando uma nova felicidade.\n        - Concluímos, então: a felicidade tem nome: Jesus. Ele lhe dará aquilo que o diabo nunca lhe\ndeu. Ele lhe proporcionará tudo o que você tem necessidade.\n\n       2. ENCONTRO COM JESUS\n                        \"... saíram, pois, da cidade e foram ter com ele\" (João 4:1-30).\n       a) É necessário sair para encontrar-se com Jesus\n       Quando encontramos com Jesus a nossa vida muda para melhor (II Co 5:17).\n           - Saímos da cidade para termos um Encontro com Ele.\n       - Abraão, Moisés, Jesus... saíram da cidade. Nós também precisamos sair da agitação para nos\nencontrarmos com Deus.\n       - Temos muitas preocupações no mundo. Por isso, durante esses dias, estamos sem celular,\nsem telefone, etc. É preciso um despojar, um esvaziar de nós mesmos para encontrarmos com Jesus.\n           - A mulher disse: \"Venham, vamos sair da cidade para nos encontrar com Ele!\"\n           - Jesus deu a oportunidade para que aquela mulher encontrasse com Ele.\n       - Por mais que Satanás utilizasse suas forças, para nos impedir de estar aqui, o inimigo não\nprevaleceu, pois Jesus quer encontrar-se conosco.\n\n       b) Neste Encontro a sua vida é transformada\n       Exemplificar: No intervalo vá ao espelho, olhe-se como está, veja toda sujeira que está em você\ne depois do Encontro olhe-se de novo e você verá a limpeza maravilhosa que Deus operou. O Senhor\nvai nos limpar e nos dar nova vida.\n       Todos que se encontraram com Jesus mudaram de vida.\n       Se disserem que você está diferente, concorde. Se perguntarem \"O que você tem?\" Responda:\n\"Eu tive um Encontro com Jesus!\"\n       c) Seu coração será renovado\n       Suas emoções serão renovadas. Toda ociosidade, ansiedade, tristeza, serão tiradas. Hoje Jesus\nCristo trará libertação e livramento. Teremos o coração de Jesus Cristo e o Seu sangue em toda a nossa\nvida. Hoje o Senhor nos dará um novo coração, não sairemos os mesmos. O Encontro com Jesus Cristo\ntraz mudança de vida. O Senhor tem se preocupado com a nossa vida, não podemos nos deixar\ncorromper. Quem está com Deus, não tem o corpo para depósito de dor, tristeza, etc. Somos um vaso\nnovo que todos os dias o Espírito Santo estará enchendo.\n\n- Exemplo da águia – esta é uma ave que sempre se recicla. De tempos em tempos ela sobe aos\nmontes e fica lá, sua plumagem é renovada e o seu bico também é trocado. Assim somos nós quando\nesperamos no Senhor. \"Os que esperam no Senhor renovam suas forças\" (Is 40:31).\n       Seja como a mulher samaritana (Jo 4:9-12) que se despojou, abandonou tudo, e deixou-se ser\nministrada por Ele; a partir disso ela levou a multidão consigo.\n       - Você está em um Encontro a partir do qual multidões lhe seguirão. Você vai trazer vidas,\nfrutos do que este Encontro lhe proporcionou, e as multidões, como fruto do seu trabalho, também\nvirão a estes Encontros.\n       - Neste Encontro você receberá a fortaleza de Jesus – satanás é um gigante vencido. \"Posso\ntodas as coisas em Cristo que me fortalece\" (Fp 4:13). Deus sempre faz mais do que pedimos.\n\n        3. LEMBRETES IMPORTANTES\n        a) Algumas coisas impedem o Encontro.\n        - Não diga: \"Ah, eu não mereço, fiz muitas coisas erradas\". Não deixe o diabo trazer acusação –\nrejeite. (Rm 8:1).\n        - Não diga: \"Já aceitei a Jesus, mas nada mudou. Acho que Deus está longe por causa dos meus\npecados\". Deus se importa com você. Você precisa de um Encontro com Jesus Cristo, e Ele vai de fato\nmudar toda a sua vida. Seu pecado não repele a Deus, pelo contrário, Deus se volta para lhe curar.\nOnde abundou o pecado, superabundou a graça (Rm 5:20).\n        b) A Bíblia afirma que:\n        - Jesus Cristo está interessado em ter um Encontro conosco.\n        Ele disse: \"Eis que estou à porta e bato\" (Ap 3:20). Ele está à nossa disposição.\n        - Somos, em Cristo, a imagem de Deus (Gn 1:26), somos da linhagem santa, somos geração de\nDeus (I Pe 2:9).\n        - Se você aceitou a Jesus Cristo, Ele certamente entrou no seu coração e você tornou-se seu\nfilho.\n        - Temos tudo o que o nosso Pai tem. Qual o filho que não se parece com o pai?\n\n       LEMBRE-SE!!!\n       Nunca mais pergunte para Deus \"Oh, onde estás?\". Ele diz: \"Eu estou aqui!\"\n       Ele é maior que seus problemas. Estamos aqui hoje porque Jesus Cristo nos escolheu para\nestarmos aqui. Somos muito importantes para Ele. Quando nos escolheu, Ele não viu o que éramos,\nmas o que nós seríamos e o que faríamos.\n         Jesus Cristo disse a Paulo: \"Por que me persegues\"? Você hoje será confrontado com tudo\n     que fez, inclusive com o que fez a Jesus Cristo. Paulo passou por essa experiência, mas toda a\n                        maldição de sua vida Jesus Cristo transformou em bênção.\n\n      Tudo o que impede o meu coração de ter uma relação mais profunda com Deus deve ser\nremovido. Temos que receber a Palavra de Deus, a qual é poderosa para mudar nossas vidas (Cl 3:8-\n10). Às vezes não estamos abertos para o que Deus quer nos falar – há resistência. Aqui no Encontro\nDeus está ministrando ao nosso espírito, está trabalhando no nosso caráter.\n\n      1. O QUE ACONTECE DURANTE O ENCONTRO\n      Observação para o ministrador: Ler João 4:1-42 em alto e bom som.\n      Aqui vemos um genuíno Encontro com o Senhor. Um momento de Encontro onde uma mulher:\n          recebe a Palavra;\n          abre o coração;\n          é liberta;\n\n                                                                                    Igreja de Vencedores\n\n           torna-se uma grande missionária.\n      1.1. Jesus Cristo mostra nossos pecados\n      Jesus mostrou à mulher samaritana que ela teve cinco \"Maridos\" e que agora estava confusa. Ele\nmostrou que todos os homens pelos quais ela tinha passado não a fizeram feliz, e que o que ela tinha\nnaquele momento pertencia a outra. Esta era a ferida daquela mulher, e também a tornava infeliz.\n      1.2. Jesus Cristo restaura a vida familiar (Cite Jo 4:17-18)\n      Quando temos um encontro com Jesus, Ele restaura a área familiar. Ele diz que vai nos abençoar\nalém do que pedimos.\n      - Deus criou uma Eva para cada Adão e um Adão para cada Eva. O Cônjuge (esposo ou esposa)\nque Deus lhe deu é único: ame-o, respeite-o, cubra-o de atenção, dê-lhe segurança. Gn 2:18 mostra que\nDeus fez uma mulher para Adão, não duas. Ela seria auxiliadora.\n\n      1.3. Jesus Cristo restaura a vida religiosa\n      Jesus Cristo mencionou o principal problema daquela mulher. Quando isso aconteceu, ela\nreconheceu que Ele era Profeta. Ela entendeu que Ele era o Senhor (v. 20). Depois de entender que\nJesus Cristo era Profeta, ela começou um assunto na área religiosa: Como suprirei minha outra\nnecessidade: a necessidade de adorar? (ir a Jerusalém). Jesus Cristo respondeu sua dúvida: os\nverdadeiros adoradores adoram em espírito e em verdade. Você pode adorá-lo em todo momento, em\nqualquer lugar e não só quando Ele suprir alguma necessidade do seu coração.\n\n      1.4. Jesus Cristo se dá a conhecer\n      \"Sou Eu que falo contigo\". Às vezes os ministradores falam de forma que não nos agrada;\nparece até que estão apontando nossos erros. Mas é que a Bíblia é a Palavra viva de Deus, e Ele quer\nnos mudar para melhor (Hc 4:12).\n\n       1.5. Jesus Cristo põe em ordem todas as áreas da nossa vida (sentimental, espiritual,\nsexual, financeira, etc).\n       A mulher abriu o coração e recebeu a Palavra com mansidão, recebeu a correção com alegria.\n\"E deixando seu cântaro foi ao povo...\" Aquela mulher era uma adúltera, não tinha respaldo nem\ncredibilidade na sociedade, mas desejava a mudança. Ela teve um Encontro com Jesus, e, então, largou\no que era do passado e foi chamar os outros – com firmeza, determinação e ousadia (II Co 5:17).\n\n       1.6. Jesus Cristo restaura o nosso testemunho\n       Você testifica a outros que teve um Encontro com Jesus quando deixa totalmente o seu passado\n(v. 39 e 30). Essa foi a primeira coisa que a mulher samaritana resolveu fazer. Ela disse: \"Vinde e vede\no homem... poderia ser este o Cristo\". Exponha a outros a sua experiência. A mulher não se omitiu,\nentendeu o Encontro que teve e declarou que Ele era o Cristo. Ela pôde dizer: Essa mudança na minha\nvida aconteceu porque eu encontrei o Cristo, que é Jesus. Se você testemunhar muitos crerão em Jesus.\nNão tenha receio: o sangue de Jesus nos limpa e purifica, dando uma nova vida (Jo 4:39). A mulher foi\nà cidade e deu muitos frutos, levou muitos à presença de Jesus.\n\n       2. NO ENCONTRO, NOSSOS SONHOS TOMAM NOVAS DIMENSÕES\n       2.1. Jesus restaura nossos sonhos\n       Quando Lázaro morreu, com ele morreram seus sonhos. Mas Jesus não quer que seus sonhos\nmorram. Há coisas que Deus quer que morram em sua vida, mas não os sonhos que Ele tem para você.\nJesus quer que você faça morrer sua natureza pecaminosa. Ele disse: \"Lázaro morreu... Eu me alegro\nporque ele morreu...\" (Jo 11:14). Jesus permitiu que Lázaro morresse, para demonstrar aos discípulos o\npoder da fé (Jo 11:25).\n\n2.2. Os sonhos de Deus para nós precisam ser ressuscitados\n       Podemos melhorar a nossa qualidade de vida se permitirmos que Jesus ressuscite nossos sonhos.\nPrecisamos Ter sonhos nas áreas moral, física e espiritual. Sabemos, em cada área, o que precisamos.\n       - Esta unção de vida e ressurreição precisa vir sobre nós para que cheguemos à estatura de varão\nperfeito (Ef 4:13). Sabemos que Jesus Cristo veio para transferir da vida dEle a nós (Rm 8:11). Ele traz\nvida, porque é o autor da vida.\n       - Deus quer que nós sonhemos, pois Ele é sonhador. Mas há um inimigo, um pesadelo (satanás),\nque vai trabalhar para apagar os seus sonhos.\n       - Você tem sonhos para sua vida? Muitos dos seus sonhos foram esquecidos, engavetados?\nNossos sonhos morrem, porque deixamos entrar o que não devia e, então, não mais podemos sonhar.\n       - Quantos sonhos maravilhosos morreram porque ficamos com medo de enfrentar a guerra. Às\nvezes somos covardes, tentamos nos convencer de que a nossa desistência tem motivos justificáveis.\nAs nossas justificativas estão sempre sendo reafirmadas. Talvez convençamos a muita gente, mas não a\nnós mesmos. Deus odeia lamúrias. Só seremos curados se assumirmos nossas dificuldades.\n       2.3. Jesus Cristo motiva-nos a sonhar\n       Muitos dos nossos sonhos estão mortos, mas Jesus diz: Eu irei despertá-los (v. 12).\n       - Não seja como os espias de Jericó. Eles também disseram \"não\" ao sonho de conquistar a terra\nprometida. Dos doze espias somente dois disseram sim.\n       - Há muralhas? Vamos derrubá-las.\n       - Não seja como José, que contou seu sonho para os irmãos e estes quiseram matá-lo.\nCompartilhe seus sonhos apenas com pessoas que sejam um com você, que caminhem na mesma visão.\n       ATENÇÃO!\n       Não compartilhe o seu sonho com quem não sonha ou sonha menos do que você. Quem sonha\ncom você se animará. Não permita que seu sonho seja sepultado. Este tipo de pessoa incrédula, não\napoia, não ajuda. Procure o gêmeo do seu sonho.\n\n       IMPORTANTE!\n       Jesus estava certo que Lázaro haveria de ressuscitar. Seu sonho já havia sido conquistado. Tudo\no que acontece no mundo natural tem que ser conquistado primeiramente no mundo sobrenatural.\n       Precisamos ressuscitar o prazer de viver. Posso ser melhor do que sou hoje. Posso resgatar\nminha felicidade! A Bíblia diz que o coração alegre aformoseia o rosto (Pv 15:13). Deus quer\nressuscitar a possibilidade se sermos felizes.\n\n       2.4. Identificando um inimigo do sonho – a incredulidade\n       - A condição para se manter no Reino é nutrir a fé (Hc 11:6). Se houver incredulidade, os\nsonhos serão obstruídos. Os traumas matam o sonho e sepultam a visão.\n       - A incredulidade traz desesperança e tristeza. Marta, Maria e os discípulos estavam\ndesesperançosos e tristes. Mas, Jesus Cristo disse: \"Se creres verás a glória de Deus\". Marta disse\n\"sim\", mas, na verdade, não creu (Jo 11:40).\n\n       2.5. Como responder adequadamente ao chamamento de Jesus para ressuscitar as causas\nmortas? Tendo fé (Hc 10:23).\n       - As causas mortas, diante de Jesus Cristo, recebem vida e ressurreição. Ainda que alguns\nestejam de luto, Jesus Cristo possibilita a esperança de que Ele realizará o sonho. \"Aquele que crê em\nmim ainda que esteja morto viverá\" (Jo 11:25).\n       - No dia da sua dor, Marta foi ao Encontro de Jesus (Jo 11:20). Ela sempre ofertava coisas boas\npara o Mestre; era uma excelente ofertante. Mas Jesus nunca se encontrou com o coração de Marta,\nporque ela estava sempre ocupada (Lc 10:41). Naquele dia certamente ela mudou por completo.\n\n                                                                                    Igreja de Vencedores\n\n        3. ATITUDES QUE VOCÊ PODE TOMAR NO ENCONTRO\n        - Entender que foi alcançado pela graça e misericórdia divinas, então, não há necessidade de se\nsentir inferior, ou de continuar preso ao passado.\n        - Crer que Deus não o lançará fora, não o rejeitará jamais.\n        - Vigiar, porque o diabo vai querer prender-lhe no passado.\n        Você vai dizer: \"Satanás, cale a boca! Eu sou nova criatura!\".\n        - Crer que Jesus é o Cristo ungido de Deus, e que Ele está disponível para você (Jo 20:31).\n        - Receber e fazer uso do poder e da autoridade do nome de Jesus. Você deve agir sempre na\nautoridade e poder do nome de Jesus. Todas as vezes que Satanás vier, repreenda-o no nome de Jesus\nCristo.\n        - Decidir multiplicar sempre. Fomos chamados por Deus para darmos frutos de multiplicação.\nEstamos sendo adestrados para treinar nossos discípulos, e estes para reproduzirem frutos de\nmultiplicação com qualidade.\n        - Guardar os ensinamentos recebidos, refletindo tudo o que está sendo ensinado, para o bem de\noutros. Já estamos recebendo o sonho de Deus para nós.\n        Deus não nos deixará até que tenha cumprido todo Seu propósito em nós (Gn 28:10-16). Ele vai\ntrabalhar para que você consiga realizar seu sonho. O sonho de Deus para sua vida, será alcançado, se\nvocê quiser.\n\n       4. CONCLUSÃO\n       - Jacó recebeu a palavra específica de Deus através de um sonho. Ele estava num momento de\ndeserto; saiu da cidade como você. Na consolidação Deus já lhe deu o sonho de vir a um Encontro com\nEle.\n       - Jacó lutou com um anjo (Gn 32:22-23). Houve luta porque Jacó perseguia seu sonho. Ele sabia\nque deveria Ter mais um Encontro com Deus, para testificar aquele Encontro do passado. Desse\nEncontro, Jacó saiu marcado (na coxa). O Anjo mudou o nome de Jacó para Israel. Deus veio, o\nabençoou e o seu sonho foi cumprido.\n       As coisas só mudam para melhor na nossa história de vida, se temos um Encontro com Jesus\nCristo e as situações mortas são sepultadas e nova vida é ressuscitada.\n       Quando corremos ao Encontro de Jesus, Ele ressuscita os nossos sonhos. Na cruz Ele\nconquistou os nossos sonhos. Ele modifica as nossas vidas e nos faz viver de uma maneira melhor.\n       Persiga o seu sonho. Permita que Deus faça e complete a obra dEle em você, através de um\ngenuíno Encontro em sua vida.\n\n      Fim da Palestra\n      ORIENTAÇÕES PARA O MINISTRADOR\n      - Orar mencionando os pontos principais que foram explanados.\n      - Levar os participantes do Encontro a um genuíno arrependimento e quebrantamento.\n      - Orar ministrando sobre os encontristas.\n      - Não esquecer da música de fundo.\n\n     Comente o que mais chamou a sua atenção:\n__________________________________________________________________________________\n__________________________________________________________________________________\n__________________________________________________________________________________\n_________________________________________________________________________________", "quiz": [{"q": "Qual é o texto bíblico-base da lição \"Tema: O QUE O SENHOR FAZ DURANTE O ENCONTRO\"?", "options": ["Marcos 16.15", "Efésios 2.19", "Gênesis 32:30; II Samuel 12", "Amós 4:12b ;João 4:1-42; Tiago 1:21-22"], "answer": 3}, {"q": "Qual destes é um dos tópicos estudados na lição \"Tema: O QUE O SENHOR FAZ DURANTE O ENCONTRO\"?", "options": ["Prestando Conta De Uma Boa Mordomia", "Compreendendo Algumas Realidades Espirituais", "Quero Me Prostituir? (I Co 3:16; 6:18-20)", "Lembretes Importantes"], "answer": 3}, {"q": "Qual destes tópicos NÃO faz parte da lição \"Tema: O QUE O SENHOR FAZ DURANTE O ENCONTRO\"?", "options": ["No Encontro, Nossos Sonhos Tomam Novas Dimensões", "Conclusão", "Os Intercessores Deverão Atuar De Duas Formas:", "O Que Acontece Durante O Encontro"], "answer": 2}]}, {"num": 39, "title": "LIBERTAÇÃO", "verseRef": "Tiago 4:7; I João 3:8; Efésios 4:27;", "content": "INTRODUÇÃO\n     Inicie com uma oração de cobertura sobre todos os encontristas. Levante a mão e declare:\n\"Toda maldição está renunciada!\"\n\n       1. CONSIDERAÇÕES INICIAIS\n       Começar a fazer comentários sobre a possibilidade de cristãos terem atitudes demonizadas, e\nsobre a constatação de que isto é real (Ef 4:27).\n       A maldição repousa na 1ª, 2ª, 3ª e até 4ª geração (Dt 11:26; 30:19). A maldição se instala no\ntempo e no espaço (Ef 5:15-16), mas ela se encerra na 4ª geração.\n       Libertação fala de ficarmos livres de algo que nos prendeu. Há maldições que nos acompanham\ne que nós temos que rejeitá-las. A maldição se infiltra por uma legalidade e abre portas para que\ndemônios venham sobre a vida da pessoa.\n       - Jeremias 23:10 – O povo da terra na qual repousa a maldição chora por isto. Há um complô\nno reino espiritual (das trevas), para que a Terra continue debaixo de maldições e, consequentemente,\nseja mantida infestada de demônios.\n       - Malaquias 4:6 – A maldição será removida da Terra. Para isto, é necessário que haja\nconversão no coração, uma nova atitude (I Co 5:17).\n       - Hebreus 6:8 – A Terra está amaldiçoada também por causa da nossa boca. Citar Tiago 3:10.\nSomos responsáveis por chamar à existência todo nível de bênção.\n       A manifestação de maldições revela a presença e atuação de demônios nas vidas. Precisamos\nentender inicialmente sobre as maldições.\n\n      2. COMO SURGEM AS MALDIÇÕES\n      Todo pecado é uma quebra de comunhão com Deus. Cada nível de pecado libera uma\nquantidade de demônios; cada pecado atrai uma maldição. O pecado é que dá legalidade para a ação de\ndemônios (I Pe 5:8; Gn 4:6-7).\n      Toda infidelidade é pecado e atrai maldição. Se formos infiéis seremos amaldiçoados. Sonegar\ndízimo é infidelidade e a Bíblia diz claramente que isto traz maldição (Ml 3:6-8). Não devemos abrir\nprecedentes (Lv 27:30-31).\n\n         Exemplos de pecados na vida de cristãos:\n         - Alguns bons pais de família, que amam esposa e os filhos, mas que adulteram (Hc 13:4; Pv\n6:32).\n         - Alguns líderes na igreja que aparentam dar bom fruto, mas que são mentirosos (Mt 5:37; Ef\n4:25).\n\n                                                                                  Igreja de Vencedores\n\n      - Pessoas que fora de casa são um exemplo, mas em casa agridem o cônjuge ou os filhos (Mt\n23:27).\n      - Pessoas que são muito trabalhadoras na igreja, mas que são imorais: em qualquer coisa que\nolham, voltam a atenção para a carne (I Co 15:33; I Jo 2:16-17).\n      - Pessoas que na igreja são uma coisa, mas, em casa, são outra. Que vivem uma vida de\ncontradição, que falam uma coisa mas fazem diferente (Tg 1:8).\n      - Pessoas que começam a fazer várias coisas, mas nunca terminam – são inconstantes.\n      - Pessoas maledicentes (Cl 3:5-9) – falam por trás, semeiam a desconfiança.\n\n       Tudo isto mostra que estas pessoas estão debaixo de maldição. Qualquer um que peca, abre a\nporta para satanás entrar (Tiago 4:7). São pessoas cristãs, mas podem estar dando lugar ao diabo (Ef\n4:27; I Pe 5:9).\n\n       2.1. Decidindo entre a bênção e a maldição\n       Deuteronômio 11:26 diz: \"Coloco diante de ti a bênção e a maldição\". O Senhor nos dá a\nsugestão: \"Meu filho, escolhe a bênção para que você viva\".\n       A maldição só faz visitação, se nós deixarmos (Êx 20:5; Nm 14:16; Dt 5:9). Há cristãos que\nvivem um dia com Jesus e outro com a maldição; vêm à casa de Deus e oram, mas no outro dia estão\nenvolvidos em práticas pecaminosas; não são nem frios, nem quentes: são mornos. Jesus disse que a\nesses vomitaria, tal seu nojo por esse procedimento (Ap 3:16).\n       O nosso comportamento diz quem somos no Reino. Não adianta tentar dissimular, fazer com\nque todo o mundo pense que está tudo bem conosco. Satanás certamente vai nos pegar, se\ncontinuarmos agindo de maneira que atraia a maldição. Há muitos cristãos que pecaram, então foram\ntragados pelo diabo e a maldição recaiu sobre eles.\n\n       2.2. Quebrando toda maldição\n       Não há maldição que não possa ser quebrada e não há pessoa que não possa mudar de vida.\nRemova a maldição da sua vida hoje, pois aqui mesmo ela pode ser quebrada (Pv 28:13). Deus irá\nquebrar toda a maldição da sua vida. Vamos andar vigilantes. A herança espiritual é uma realidade e\nsatanás sempre aguarda uma brecha para vir e destruir sua vida. Aqui no Encontro toda herança\nmaldita será renunciada, e todo o argumento do diabo será cancelado.\n       Um homem chorava pelo filho que era maconheiro e lamentava-se dizendo que em sua família\nninguém tinha feito isso antes. Mas o pai não se dava conta de que ele semeou isso sendo um fumante.\nHavia um pecado em sua vida: o vício. A maldição do vício era a mesma, só mudou a droga.\n       É preciso que haja, antes, arrependimento pelo pecado do vício do cigarro. A maldição\nhereditária vem por níveis diferentes e, através das gerações, ela manifesta-se no mal corrente da\népoca. (Êx 20:5b).\n\n       2.3. Um exemplo bíblico de maldição familiar\n       A vida do rei Davi (I Sm 12:7-14)\n       Nesse episódio o rei Davi é confrontado por Deus, através do profeta Natã, pelos seus pecados\nde adultério e homicídio. O Senhor diz a Davi: \"Agora, portanto, a espada jamais se apartará da tua\ncasa, porque me desprezaste e tomaste a mulher de Urias, o heteu, para ser tua mulher. Assim diz o\nSenhor: Eu suscitarei da tua própria casa o mal sobre ti, e tomarei tuas mulheres perante os teus olhos,\ne as darei ao teu próximo, o qual se deitará com elas, à plena luz do dia\". (I Sm 12:10-12). II Samuel\n16:22 conta que essa palavra se cumpriu: \"Portanto, estenderam para Absalão uma tenda no terraço, e\nentrou ele às concubinas de seu pai, à vista de todo o Israel\". (ver Dt 28:30).\n\nQuando Davi pecou, ele não somente deu lugar à maldição de adultério em sua própria vida,\nmas permitiu que a imoralidade sexual entrasse na vida da sua família. Em II Samuel 13, você pode\nverificar o drama da família de Davi, quando seu filho Amnon possuiu a sua irmã Tamar.\n\n       3. COMPREENDENDO ALGUMAS REALIDADES ESPIRITUAIS\n       3.1. Anjos\n       Os anjos são seres espirituais criados por Deus e a Bíblia fala sobre este assunto em 34 livros. A\npalavra anjo ocorre cerca de 275 vezes nas Escrituras. A criação dos anjos está implícita, no texto de\nColossenses 1:16, em um tempo antes da criação do mundo (Jó 38:4-7). Eles foram criados em pleno\nestado de santidade (Jd 6). Os anjos existem em grande quantidade e foram criados para diversas\nfunções determinadas por Deus (Cl 1:10; Hc 1:13). Mesmo os anjos rebelados têm funções diversas e\ntrabalham em áreas específicas.\n\n     - Hierarquia angelical – organização:\n     Anjos – mensageiros – Gabriel (Dn 9:21; Lc 1:26)\n     Arcanjos – príncipes de Deus, anjos de guerra, protetores – Miguel (Dn 12; Jd 9)\n     Serafins – ligados à adoração (Is 6:1-3)\n     Querubins – ligados à santidade e em guardar o trono de Deus (Gn 3:22-24)\n     Os anjos podem se manifestar aos homens. Os anjos do Senhor, quando se apresentam aos\nhomens, podem se apresentar como são ou tomam forma humana (Gn 18:2; 19:1; Sl 34:7).\n\n       3.2. Demônios\n       São seres espirituais. O demônio que é citado em Mateus 17:18 é chamado de espírito imundo\nno relato paralelo de Marcos 9:25. Eles conhecem a Jesus (Mc 1:24), conhecem seu próprio destino\nfinal (Mt 8:29), e conhecem o plano da salvação (Tg 2:19). Veja também Efésios 6:12.\n       Lúcifer era um querubim, segundo Ezequiel 28:14-16. Ele era responsável pela música, pelos\nlouvores (Is 14; Ez 28). Deus não criou Lúcifer para ser um espírito maligno. O problema deste anjo\ncaído estava em querer ser igual a Deus e maior que Deus (Is 14:12). Acabou se tornando o ser\nmaligno que é, o diabo. A Terça parte dos anjos do céu caiu com Lúcifer. Deus fez o inferno para\nsatanás e seus anjos.\n       Almejar ser o que a Palavra não nos promete, é malignidade; não ser o que a Palavra promete, é\nmediocridade (Tg 4:2-3).\n       Os demônios ou os anjos caídos (II Pe 2:4), para manifestarem-se, ou usam uma forma que não\né deles (pois são mentirosos) ou manifestam-se através de:\n       - Pessoas – endemoninhado de Gadara. Quanto mais brechas tem a pessoa possessa, mais\nlegalidade tem satanás para agir.\n       - Animais – Mc 5:11\n       Os demônios não têm interesse em animais e sim nos homens e nos territórios. Os demônios\nentram em lugares pelos pecados do homem (I Pe 5:8). Pelo pecado eles podem levar uma pessoa à\npossessão. O objetivo de satanás é instalar a maldição no homem, através do pecado.\n       Maldição é a permissão dada ao diabo para causar dano à vida das pessoas. Essa permissão pode\nser dada por alguém que exerce autoridade sobre outrem ou por si mesmo. Às vezes lançamos\nmaldição através de nossas palavras, de prognóstico negativo (conhecido como \"rogar praga\") e não\ntemos consciência da seriedade disso. Da nossa boca só deve sair bênção (Tg 3:8-10). A maldição vem\ncomo conseqüência do pecado de não ouvir, não obedecer e não guardar as ordens do Senhor, e de se\nmisturar com outros deuses (Dt 28:15). A maldição se instala porque pecamos (Lm 5:7-10).\n       Satanás é o príncipe dos demônios. Ele possui uma hierarquia bem organizada. \"Porque a nossa\nluta não é contra o sangue e a carne, e, sim, contra os principados e potestades, contra os dominadores\n\n                                                                                     Igreja de Vencedores\n\ndeste mundo tenebroso, contra as forças espirituais do mal, nas regiões celestes\" (Ef 6:12). Os\ndemônios agem por territórios (Js 1:3; I Pe 5:8). Satanás se apodera dos territórios ou por consagração\nou pela legalidade do pecado.\n\n       - Principado – significa território ou jurisdição de um príncipe, ou país que dá título a um\npríncipe.\n       - Potestade – significa autoridade. No grego é a palavra \"exousia\" (autoridade sobre o lugar).\n       - Forças do mal nas regiões celestes – são poderes que só têm um objetivo: O MAL (Ef 6:12).\n       4. AS BRECHAS ESPIRITUAIS POR ONDE ENTRAM AS MALDIÇÕES (Rm 3:13)\n       a) Maldição hereditária – se instala através dos pais ou antepassados que abriram legalidades\ntais como:\n           - idolatria (Êx 20:5b)\n           - prostituição (I Co 6:15)\n           - rebeldia a Deus (I Sm 15:7)\n           - feitiçaria (I Sm 15:7)\n           - mentira (Ef 4:25)\n           - adultério (Pv 6:32)\n\n     b) Maldição voluntária – quando a pessoa decide pecar. Exemplo: Eu mesmo me dispus a ir à\nmacumba, a adulterar, etc. (Sl 51:3).\n\n       c) Maldição da nação – Exemplo do Brasil: nossa colonização nos trouxe diversas maldições:\nhomens de má índole (bandidos) foram enviados de Portugal para o Brasil, a fim de povoar esta terra.\nEstes, como também nossos colonizadores saquearam, praticaram abuso sexual, abuso físico\n(escravidão, violência), e extermínio contra os índios nativos. Muitos negros que vieram para o Brasil\nforam entregues pelos de sua própria raça (rejeição), ou trocados, ou mesmo forçados a vir para o\nBrasil sob violência. Esses africanos implantaram aqui suas práticas de feitiçaria, e assim se instalou\numa aliança entre a idolatria de Portugal e a feitiçaria da África. O desenrolar da nossa história revela\natrocidades cometidas, pela própria população que aqui habitava as quais atraíram maldições sobre a\nnossa nação. Essas maldições só podem ser quebradas, e estão sendo, pelo Nome de Jesus, pela\neficácia do seu sangue já derramado para a remissão de pecados e pela proclamação do povo brasileiro\nque crê na libertação que Jesus pode fazer.\n\n        d) Maldição involuntária - quando os pais ou autoridades sobre determinada pessoa a leva\npara terreno de macumba, batismo na igreja católica, etc. Exemplo: Quando os pais fazem pactos pelos\nfilhos (Ef 6:4).\n\n      4.1. O mal proveniente dos traumas\n      Alguns demônios entram pelos traumas na infância, adolescência, maturidade ou atitudes que\npartem de nós (Js 32 e 36). Por exemplo:\n      Rejeição / abuso sexual / violência / medo / brigas / acidentes / abandono / falta de amor /\npalavras duras / drogas / ausência dos pais / divórcio / namoros ilícitos / adultério / aborto.\n      Só podemos curar o trauma através da cruz de Jesus (Gl 3:13). Só seremos libertos se\npermitirmos que o Filho do Homem o faça.\n\n      4.2. Palavras proferidas carregadas de sementes do mal\n\nPalavras são sementes que, uma vez plantadas, irão frutificar. Palavras edificam ou destróem.\nAs palavras são responsáveis pelas guerras, separações, mortes, inimizades, desgraças (Pv 15:1).\nSeremos justificados ou condenados pelas nossas palavras (Mt 12:36-37; I Co 15:3).\n       O pecado de maledicência gera uma maldição instalada pela palavra maldita. Davi pediu que\nDeus guardasse seus lábios (Sl 141:3). O complexo de inferioridade vem por causa de palavras\nmalditas: escárnio, zombarias, etc. Deus abomina o escarnecedor (Pv 13:3).\n       A língua desenfreada pode causar danos irreparáveis, os quais só Jesus pode consertar (Tg 3:7-\n12). Às vezes pais oprimem seus filhos chamando-os de \"gays\", de imprestáveis, de vagabundos, e\nassim os filhos acabam sendo (Pv 18:21). Na verdade é um dizer profético negativo sobre alguém (Pv\n26:2). Palavras são sementes e estas podem dar legalidade a demônios.\n\n      4.3. Pecados ministeriais\n          - Tradições com o fim de manter o homem afastado de Deus (Lc 11:37-44).\n          - Adultério (Mt 5:27-28)\n          - Fraudes, roubos (Ef 4:28).\n\n      4.4. Males para o mal que se instalaram no Brasil (Ap 21:8)\n          - Idolatria (Dt 18:10-14).\n          - Feitiçaria (Dt 18:10-14).\n          - Bruxaria (Dt 18:10-14).\n      - Prostituição, etc. (I Co 6:15-16).\n\n      5. PROCESSOS DE LIBERTAÇÃO\n      Todo cristão deve Ter sobre sua vida:\n      INTEGRIDADE – ter bom caráter (Jó 1:8).\n      SANTIDADE – ser separado do mundo (I Pe 1:14-16).\n      SINCERIDADE – chamar de pecado o pecado. \"Enquanto não enumerei os meus pecados,\nadoeci\" (Sl 32:3). \"A minha alegria se transformou em tristeza\" (Sl 51:12).\n\n      5.1. O principal elemento necessário para ser liberto é o genuíno arrependimento. Mas, o que é\narrependimento?\n      ARREPENDIMENTO (Atos 3:19)\n      Sentir dor profunda.\n      Confessar o pecado, abandoná-lo completamente.\n      \"Ah! Senhor! Eu ofendi a tua santidade. Isto dói... Não vou mais pecar nessa área, ajuda-me!\"\n      REMORSO (Tg 4:7)\n      Traz ressentimento.\n      \"Pôxa, não deveria ter feito\" (mas volta a fazer novamente).\n      Justifica a atitude pecaminosa. \"Ah! É por causa disso e daquilo...\"\n\n       5.2. Compreendendo se preciso de libertação\n       Sou cristão, mas por que ainda:\n             1.      Assisto filmes demoníacos, filmes de terror e filmes pornográficos? (II Co 6:15)\n             2.      Quero me prostituir? (I Co 3:16; 6:18-20)\n             3.      Quero ver o que não devo? (Tg 4:4)\n             4.      Sinto desejo de pecar? (Rm 7:15).\n       Porque ainda não houve genuíno arrependimento. O verdadeiro arrependimento gera genuína\nlibertação (Pv 28:13).\n\n                                                                                  Igreja de Vencedores\n\n       A pessoa arrependida sente verdadeira dor pelo pecado porque sabe que, enquanto durou o\npecado, sua comunhão com Deus foi estragada.\n       Para qualquer mudança acontecer, precisamos sentir uma dor profunda. Essa dor deve-se ao\nreconhecimento de que, como filho de Deus, ofendeu ao Pai, e também às pessoas envolvidas, com o\npecado (Lc 22:44). Quando o pecado é lembrado com dor, aí há cura. A cura não elimina as\nlembranças, mas remove a dor.\n       Pecados têm que ser declarados um a um: \"Eu fiz ‗isto‘, ‗desta‘ forma, ‗x‘ vezes‘‘ (Sl 32:3-4).\n       Davi disse: \"Todos os meus pecados eu te declarei\" (Sl 32:5; Sl 51).\n       Quando o marido comete pecado e confessa, a esposa questiona: \"Como? Onde? Por quê? Que\nhoras? Com quem?\", etc. Com Deus também é assim, temos que detalhar. Não podemos pecar a varejo\ne pedir perdão no atascado.\n       Todo pecado tem que ser renunciado (Tg 4:7). Lembra onde está a brecha? Então, para que essa\nbrecha seja fechada, é necessário que haja uma renúncia. Precisamos aprender a viver como santos. É\npreciso cortar a raiz de maldição que entrou pelo pecado.\n       Mesmo tendo sido uma maldição que entrou através do pai, avô, bisavô, etc, precisa ser fechada.\nSatanás quer manipular esta geração (Jl 1:1-27; Tg 4:4-5).\n\n      Deve-se chamar à existência o oposto:\n        - Prostituição – Santidade (I Pe 1:14-16).\n        - Ódio – Amor (Rm 13:8).\n        - Rebeldia – Submissão (Fl 2:5-8).\n        - Mentira – Verdade (Ef 4:25).\n\n       Chame à existência a libertação, pedindo ao Espírito Santo que venha sobre você com Sua\nsantidade, amor, submissão (I Pe 1:14-16), tendo cuidado com o que expõe à sua mente. O diabo quer\nter acesso à sua mente todo o tempo (Fl 4:8; I Co 2:16).\n\n      6. PRINCÍPIOS PARA RECEBER A MINISTRAÇÃO DE LIBERTAÇÃO\n      1º - Sentir necessidade – reconheça que precisa de libertação (Sl 51:3).\n      2º - Arrepender-se do pecado cometido por si próprio ou por seus antepassados.\n      3º - Não ter medo do processo de libertação – o medo amarra você, impedindo a sua libertação\n(II Tm 1:7; I Jo 4:4).\n      4º - Lutar pela sua libertação – se os demônios tentarem dificultar a libertação, lute; não deixe\nque sua mente fique vagando, pense em sua necessidade de libertação (Ef 6:12).\n      5º - Lembrar dos pactos e qualquer nível de envolvimento com o pecado rejeitá-los.\n\n      7. ORAÇÃO DE LIBERTAÇÃO\n\n      Fim da Palestra\n      ORIENTAÇÕES PARA O MINISTRADOR\n\n       1. Afaste para as laterais as cadeiras ou bancos, para que todos estejam livres no centro do\nauditório e para que os ministradores possam passar por entre as pessoas.\n       2. Chame, para que fiquem mais á frente, as pessoas que tiveram qualquer tipo de contato com o\nocultismo – elas devem ser ministradas especificamente.\n       3. Os intercessores deverão atuar de duas formas:\n       a) uma equipe fará um círculo ao redor das pessoas que estão sendo ministradas no auditório\n(cobertura de oração);\n\nb) outra equipe ministrará especificamente a cada pessoa, quebrando os pactos e as maldições,\nconforme a direção do Espírito Santo. Se alguém ficar possesso, duas ou três pessoas, no máximo,\ndevem usar de autoridade para a libertação, e os outros não deverão se distrair com o processo. Devem\ncontinuar ministrando aos demais.\n      4. Declare libertação no período de fecundação, no período de gestação, até o nascimento.\nLembre-se que temos pessoas que foram consagradas antes de serem geradas pelos pais (I Jo 3:8b).\nMinistre em cada geração desde a 1ª, 2ª, 3ª e 4ª ........ até a que pessoa se encontra.\n\n       5. Declare a quebra de maldição pela legalidade da Palavra (Gl 3:13-14; II Cor. 5:21; Rm 8:1-3).\n       OBS.: TODOS, SEM EXCEÇÃO, DEVERÃO SER MINISTRADOS\n       Busque uma cobertura espiritual para os ministradores e o local:\n           a) Tome a armadura de Deus. (Ef 6:13-18)\n           b) Tome posse do poder do sangue de Jesus que nos limpa de todo pecado (I Jo 1:7).\n       c) Tome posse da autoridade dada por Jesus (Mc 16:17-18; Lc 10:19). Entre em oração sobre\ncada fase da vida das pessoas: em cada geração desde a 1ª até a 4ª (Êx 20:5), e, até a 10ª geração caso\nsejam filhos gerados fora da aliança do casamento (conforme Dt 23:2-6).\n       6. Ore pedindo o poder do Espírito Santo enchendo o lugar que ficou vazio na libertação (Is\n61:1-4). Declare que a partir de hoje e para sempre o único espírito com autorização legal para agir em\nnosso espírito é o Espírito Santo de Deus (I Pe 2:9).\n       7. Ao final faça uma oração de agradecimento e leve todos a confessarem que são livres e a\nterem um tempo de celebração na presença do Senhor.\n       8. Leve as pessoas a declararem em voz alta que estão livres.\n       Peça que repitam:\n           - Eu estou livre. (3x)\n           - Eu estou perdoado. (3x)\n           - Eu estou curado. (3x)\n\n        ATENÇÃO!\n        A brecha é fechada na cruz. Satanás só se torna ilegal se você fechar a legalidade.\n        Se não, ele está agindo na legalidade, porque todos, sem Cristo, estão debaixo da maldição da\nlei, ou seja da maldição do pecado.\n\n      Observação:\n      Após uma ministração de libertação é comum o cansaço físico, pois no mundo espiritual houve\numa batalha e o nosso espírito esteve envolvido diretamente nisto, ocasionando assim uma fraqueza em\nnosso corpo. Para que haja uma recuperação física acelerada é necessária a ingestão de alimentos ricos\nem proteínas, para a reposição imediata no organismo. Beba bastante líquido: suco, água de coco, água\nmineral.\n\n     Comente o que mais chamou a sua atenção:\n__________________________________________________________________________________\n__________________________________________________________________________________\n__________________________________________________________________________________\n_________________________________________________________________________________\n\n                                                                                    Igreja de Vencedores\n         288", "quiz": [{"q": "Qual é o texto bíblico-base da lição \"Tema: LIBERTAÇÃO\"?", "options": ["Tiago 5.17,18", "Atos 4.12", "Romanos 11.36", "Tiago 4:7; I João 3:8; Efésios 4:27;"], "answer": 3}, {"q": "Qual destes é um dos tópicos estudados na lição \"Tema: LIBERTAÇÃO\"?", "options": ["Sinto Desejo De Pecar? (Rm 7:15)", "Se Quisermos Ficar Integralmente Sãos (I Ts 5:23);", "Abusos Sexuais", "A Necessidade Do Batismo"], "answer": 0}, {"q": "Qual destes tópicos NÃO faz parte da lição \"Tema: LIBERTAÇÃO\"?", "options": ["Quero Me Prostituir? (I Co 3:16; 6:18-20)", "Prefira Incentivar Do Que Criticar", "Compreendendo Algumas Realidades Espirituais", "Como Surgem As Maldições"], "answer": 1}]}, {"num": 40, "title": "ROUBADORES DE DEUS", "verseRef": "Malaquias 3. 8 - 12", "content": "Em Malaquias 3.8 - 12 temos a palavra profética a respeito de um povo que era infiel a Deus em\nsuas finanças, eles deixaram de devolver os dízimo e ofertas, atraindo para si a maldição que pesa\nsobre os desobedientes e infiéis, \"com maldição sois amaldiçoados, porque me roubais, diz o Senhor\"\n(Ml 3.9). É muito sério essa coisa de maldição, pois ela atrai também o devorado, que destrói\nimpiedosamente o infiel. Como diz Paulo: Porque a nossa luta não é contra a carne e o sangue, mas\nsim, contra os principados e potestades do ar. ( Ef 6. 10 - 12)\n\n      1. DÍZIMO\n\n      O que é o Dízimo?\n\n     A palavra hebraica para \"dízimo\" (aser) significa literalmente \"a décima parte\" de um todo, o\ndízimo antes da Lei de Moisés já era praticado (Gn 14. 18 - 20).\n\n      Todo Cristão nascido de novo tem a obrigação de contribuir com seus dízimos para manter a\nobra de Senhor tanto local, quanto no campo missionário.\n\n      O que acontece quando eu deixo de devolver o dízimo?\n\n      * Eu me torno um ladrão (Ml 3.8) - porque eu estarei roubando a Deus.\n\n     * Sou amaldiçoados - em (Ml 3. 6 - 12) lemos a palavra profética que seremos amaldiçoados\nquando não devolvemos o que é de Deus.\n\n      * Deixo de crer nas bênçãos provenientes da Palavra (Ml 3. 10 e 11) - Deus promete que quando\ndamos o dízimo, ele nos orienta a fazer prova dEle, pois, Ele promete abrir as janelas dos céus e\nderramar um bênção de maior abastança.\n\n      * Torno-me desobediente (Ml 3.10) - Quando não dizimamos estamos desobedientes a Deus,\npois é uma ordem \"trazei o dízimo e oferta\" quando não cumprimos, somos desobedientes e com isso\nsomos responsáveis pelas conseqüências que com certeza virão.\n\n2. TIPOS DE GAFANHOTOS (Joel 1.4)\n\n       Cortador: É o tipo de gafanhoto que mora na lavoura, nunca sai, quando o agricultor tenta\nmatá-lo, geralmente perde grande parte da lavoura, pois ele morre com a lavoura, mas o estrago não é\ntotal.\n\n        Migrador: É o tipo de gafanhoto que não mora na lavoura, ele é inconstante, pois vive\nmigrando de lavoura em lavoura, mas todas as vezes que vem sobre uma lavoura sempre pega o\nagricultor de surpresa e causa grandes prejuízos, pois leva uma grande parte da lavoura.\n\n       Devorador: É o tipo de gafanhoto quando vem, vem com propósito definido de devorar toda a\nlavoura, quando o agricultor não cuida rápido. Ele às vezes perde 100% da lavoura.\n\n       Destruidor: É o tipo de gafanhoto mais perigoso que existe, pois ele tem a ferroada equivalente\nao escorpião, quando ele ataca a lavoura, se o agricultor não abandonar a lavoura, ele pode morrer,\npois, quando esse tipo vem, vem para destruir tudo até o agricultor.\n\n       3. COMO OS GAFANHOTOS AGEM NA VIDA DAS PESSOAS\n\n        Gafanhoto Cortador: Essa legião de demônios \"o cortador\". Ele age na vida do homem 24hs\npor dia. Ele come parte do seu dinheiro através dos vícios. Ele come através dos jogos de azar. Ele da\npequenos prejuízos diários (estragando comidas, quebrando pratos e copos). O homem faz de tudo para\nse livrar desses gafanhotos, mas ele não sai. Ele tem legalidade porque você não é dizimista.\n\n      Gafanhoto Migrador: Essa legião de demônios \"o migrador\". Ele ataca de 2 em 2 meses, 4\nem 4 meses ou 2 vezes ao ano, mas quando ele ataca ele causa prejuízos grandes e de surpresa que o\nhomem nem espera. Ele é que causa acidentes de carros, promove incêndios nas casas. Ele deixa o\nhomem desesperado, chorando e sem entender o que aconteceu.\n\n        Gafanhoto Devorador: Essa legião de demônios \"o devorador\". Ele é mais poderoso que as\nduas primeiras legiões. Quando ele ataca, ele deixa o homem passando fome, sem condições de pagar\nágua, luz, telefone, S P C, SERASA e etc. ele faz o homem perder o emprego e não deixa ele arranjar\noutro. O homem perde casa, carro e os amigos, o rastro é miséria e tristeza, acompanhada de muita dor\ne angustia, pois o homem não entende porque isto está acontecendo e mesmo assim, ele não consegue\nobservar que é falta de dar o dízimo.\n\n       Gafanhoto Destruidor: Essa legião de demônios \"o destruidor\". É a mais perigosa e terrível de\ntodas as legiões, pois ela leva o homem ao mais completo desespero, ele arrasa a família, as finanças e\nos amigos arrasando a vida do homem. Seu objetivo é levar o homem a morte, através do suicídio.\nQuando essa legião geralmente chega, vem acompanhada de um rastro de negligencias e falta de\ncompromisso do homem com os amigos, vizinhos, parentes e etc., pois o homem deixa de honrar os\nseus compromissos financeiros com todas as pessoas e mesmo assim, muitos ainda não reconhecem\nque a falta do compromisso com Deus tem aberto a porta para o destruidor, pois o único remédio é o\ndízimo.\n\n                                                                                    Igreja de Vencedores\n\n    4. ESSAS QUATRO LEGIÕES NÃO RESPEITAM POSIÇÕES. ELAS AGEM NAS\nVIDAS DE ALGUNS.\n\n      * Lideres de Geração\n\n      * Lideres de Célula\n\n      * Lideres em Treinamento\n\n      * Membros\n\n      * Homens, Mulheres e Jovens\n\n      * E em todas as pessoas que são infiéis ao Senhor nos dízimos e ofertas\n\n      5. ORAÇÃO NÃO EXPULSA ESTAS LEGIÕES\n\n       O Senhor tem prazer de abençoar o cristão fiel, a Bíblia diz em Sl 34. 7, que ao redor do fiel está\no anjo do Senhor para nos proteger e ao derredor está satanás e seus demônios, buscando brechas e\nlegalidades para destruir o servo de Deus.\n\n      6. COMO VENCER ESTAS LEGIÕES\n\n       As fidelidades nos dízimos expulsam estes demônios. Leiam todos Ml 3. 10 e 11. A sua\nfidelidade no dízimo afastam estes demônios de sua vida e patrimônios. E Deus vai abrir a janela dos\ncéus sobre a sua vida.\n\n      7. O ESPÍRITO SANTO LHE PERGUNDA AGORA:\n\n      * Por que sua conta bancaria está sempre no vermelho?\n\n      * Por que as portas de emprego estão sempre fechadas para você?\n\n      * Por que seu comércio e empreendimento não dão mais lucros?\n\n      * Por que os empregados estão sempre lhe roubando?\n\n      * Por que tudo o que você ganha, é gasto com remédios?\n\n      * Por que seu carro, moto, bicicleta só vivem quebrando?\n\n      * Por que no seu emprego você nunca pega promoção?\n\n8. O QUE VOCÊ NÃO PODE FAZER COM O DÍZIMO:\n\n     * O Cristão não pode dar o dízimo do Senhor para fazer caridade.\n\n     * Não pode enviar o dízimo para outra Igreja que não seja a que ele congrega.\n\n      * Não pode ser guardado por muito tempo em casa, deve ser entregue o mais rápido possível na\nCasa do Senhor.\n\n     * Não devo me preocupar com o que a Casa do Senhor vai fazer com o meu dízimo, pois o meu\ndízimo é de Deus e o meu papel é somente devolver para Ele.\n\n     * Não é para dar para profetas levadores de recado.\n\n     * Não devo deixe acumular o meu dízimo.\n\n     9. EXEMPLOS DE PESSOAS FIÉIS NOS DIZIMOS E NAS OFERTAS\n\n     ABRAÃO: Deu o dízimo a Melquizedeque e foi abençoado.\n\n     JACÓ: (Gn 28. 20 - 22) Leiamos.\n\n      WILLIAN COLGATE: Quando estava começando na vida conheceu um velho capitão da\nmarinha que lhe aconselhou a montar uma fabrica de sabão, ser honesto em seus negócios e dar o\ndízimo de tudo para a Casa do Senhor. Colgate agiu exatamente como foi aconselhado. E Deus o\nabençoou. Colgate foi dizimista durante toda sua longa e bem sucedida vida comercial. Ele não se\ncontentou com 10% do seu tudo, mas ele prosperou tanto que resolveu dar 20%... e depois 30%.... e\ndepois 50% e depois 90%... Ele se tornou dono e fundador da Colgate & Company,           Colgate-\nPalmolive e Colgate College uma importante universidade norte-americana. Guilherme Colgate sentiu\na necessidade de dar o dízimo de tudo para a Casa do Senhor porque reconheceu que Deus era doador\nde tudo quanto possuía, não somente da oportunidade em crescer como empresário, mas até mesmo\ndos elementos que eram usados na fabricação de seus produtos.\n\n       ROBERT TOUNEAN: Este homem de Deus fez algo curioso com Deus quando começou os\nseus negócios, ele fez um voto com Deus de inverter o sistema dos dízimos. Ele daria 90% a Deus e\nficaria com 10% da renda.\n\n     A sua indústria é a maior do mundo no ramo e sempre procurou ser fiel ao seu voto (ele é dono\ndas empresas Motores Cartepillar).\n\n     O DIZÍMO É 10% DE TUDO O QUE EU GANHO:\n\n     R$ 10,00 - R$1,00 é o meu dízimo.\n\n     R$ 100,00 - R$10,00 é o meu dízimo.\n\n     R$ 500,00 - R$50,00 é o meu dízimo.\n\n                                                                                     Igreja de Vencedores\n\n     R$ 1000,00 - R$100,00 é o meu dízimo.\n\n    A CASOS QUE A PESSOA FAZ UM VOTO COM DEUS E ELA ESTIPULA O VALOR DO\nSEU DIZIMO SENDO MAIOR QUE 10% COMO NOS EXEMPLOS.\n\n     10. OFERTAS\n\n     PORQUE DEUS ACEITOU OFERTA DE ABEL E A DE CAIM NÃO?\n\n     * Abel escolheu o melhor que tinha para dar ao Senhor Deus.\n\n     * Ele escolheu dos primogênitos.\n\n     * Os primeiros entre as suas ovelhas\n\n     * As mais saudáveis\n\n     * As mais gordas\n\n     * Pois Abel sabia o verdadeiro significado da oferta, ele queria da fato agradar a Deus.\n\n     * Caim, não escolheu o melhor para ofertar ao seu Deus. A bíblia não fala que foi as\nprimícias (Gn 4. 3 - 5), logo entendemos que Caim não deu o melhor, o mais importante para\nDeus.\n\n     * A oferta de Deus deve ser dada do melhor que possuímos.\n\n     * Do melhor que temos.\n\n     * E não do que sobra, ou do resto, pois Deus na vida do ofertante tem que ser a pessoa mais\nespecial.\n\n   COMO VOCÊ TEM OFERTADO AO SEU DEUS?                        DO MELHOR OU APENAS DO QUE\nSOBRA?\n\n      Não se esqueça que Deus aceitou a Abel e sua oferta, por outro lado, rejeitou a de Caim e sua\noferta. Deus não somente rejeita a oferta, mais o ofertante, quando esse não está com as motivações\ncorretas.\n\n     ESTA É A RAZÃO DE MUITOS CRISTÃOS HOJE NÃO SEREM ABENÇOADOS.\n\n     11. A BÍBLIA FALA DE OFERTAS ALÇADAS, O QUE VEM A SER ESTA OFERTA?\n(Ml 3.8)\n\n* Ofertas alçadas significa literalmente ofertas de valor, ofertas elevadas, ofertas grandes que\nrequer do ofertante sacrifício de amor, portanto a nossa oferta deve ser do mesmo valor do nosso\ndízimo a Deus ou até maior (Lc 21. 1 - 4), podemos ver no caso da viúva: Ela deu uma oferta que lhe\ncustou o sacrifício pois era tudo que ela tinha e como esta oferta recebeu elogios do Senhor e as\nbênçãos.\n\n     12. A LEI DA SEMEADURA, O QUE VEM A SER ISTO?\n\n      Esta é a lei do investimento (2 Co 9.6), quando o apostolo Paulo usou este exemplo; ele referia-se\nexatamente a questão das ofertas. Só vamos colher aquilo que plantamos pois isto é a lei da\nsemeadura, só se colhe o que se planta. Não tenha medo de plantar, plante, pois Deus lhe dará uma boa\ncolheita. Se você der com alegria como diz a Bíblia (2 Co 9.7), Deus lhe acrescentará com fartura, toda\na suficiência e abundancia. Ele vai multiplicar as suas sementes e Ele diz que serás abençoado\npoderosamente. Alguns Cristãos não tem recebido bênçãos na área financeira porque não tem\ncontribuído da maneira correta, Outros contribuem da maneira correta, mas não tem se apropriado do\nque Deus prometeu. Deus não falha, quem falha muitas vezes somos nós, sejamos fieis, nisso, no dar\nem abundancia para recebermos em abundancia.\n\n     Comente o que mais chamou a sua atenção:\n__________________________________________________________________________________\n__________________________________________________________________________________\n__________________________________________________________________________________\n_________________________________________________________________________________\n\n                                                                                    Igreja de Vencedores\n         294", "quiz": [{"q": "Qual é o texto bíblico-base da lição \"Tema: ROUBADORES DE DEUS\"?", "options": ["1 Coríntios 9.16", "Malaquias 3. 8 - 12", "1 Timóteo 5.22", "Tiago 4:7; I João 3:8; Efésios 4:27;"], "answer": 1}, {"q": "Qual destes é um dos tópicos estudados na lição \"Tema: ROUBADORES DE DEUS\"?", "options": ["Tem Sido Sensual, Indecente, Defraudador? (I Co 6:18)", "Escola De Vencedores ( Classe Regular - Discipulado)", "O Dízimo No Novo Testamento", "O Espírito Santo Lhe Pergunda Agora:"], "answer": 3}, {"q": "Qual destes tópicos NÃO faz parte da lição \"Tema: ROUBADORES DE DEUS\"?", "options": ["Oração Não Expulsa Estas Legiões", "A Cruz Fala De Conquistas", "O Que Você Não Pode Fazer Com O Dízimo:", "Ofertas"], "answer": 1}]}, {"num": 41, "title": "CURA INTERIOR", "verseRef": "Salmo 32; Oséias 2:14; Jeremias 17:9-10; 24:7", "content": "(O Ministrador deverá distribuir os papeis para os encontristas. E eles devem anotar os seus\npecados no papel).\n       Preparação dos participantes:\n       - Posição o mais confortável possível\n       - Registro apenas dos sentimentos e idéias que ocorrem durante a ministração, em relação ao\nparticipante.\n\n      Atitudes mentais:\n      - Abertura;\n      - Atenção a si mesmo e não ao outro.\n\n       1. ENTENDENDO O QUE É CURA INTERIOR\n       Cura interior é a cura de nosso homem interior: da mente, emoções, lembranças desagradáveis,\nsonhos. É o processo pelo qual, por meio da oração, e de um processo de conscientização da nossa\nsituação, somos libertos de sentimentos de ressentimento, rejeição, auto piedade, depressão, culpa,\nmedo, tristeza, ódio, complexo de inferioridade, auto condenação, senso de desvalor, etc.\n       Em Romanos 12:2, lemos o seguinte: \" E não vos conformeis com este século, mas transformai-\nvos pela renovação da vossa mente...\"\n       A cura interior é a renovação de nossa mente.\n\n       Jesus disse: \"Eu estou deixando-lhes uma dádiva – paz de espírito e de coração! E a paz que eu\ndou não é frágil como a paz que o mundo dá. Portanto, não se aflijam nem tenham medo\"              (Jo\n14:27). Há inúmeras pessoas, hoje, que não possuem essa paz interior. Muitas delas são cristães, mas,\napesar de tudo, acham-se emocionalmente enfermas, embora estejam em boas condições físicas. Jesus\ndeseja que sejamos sãos em todo o nosso ser. Em Isaías 53:5 vemos como a Bíblia prediz a obra de\nJesus: \"... Ele foi traspassado pelas nossas transgressões e moído pelas nossas iniquidades; o castigo\nque nos traz a paz estava sobre Ele, e pelas suas pisaduras fomos sarados.\" Ele quer salvar-nos de\nnossos pecados (cura espiritual), quer que tenhamos paz (cura interior), quer que fiquemos livres de\ndores e doenças (cura física). Ele quer que todo o nosso ser seja perfeito!\n\n      2. COMO SABER SE TENHO FERIDAS\n\n      2.1. Dando crédito à Bíblia, que afirma necessitarmos de renovação da mente.\n\n      I Tessalonicenses 5:23 mostra que somos compostos de Três elementos:\n      1. Espírito – elemento com o qual falarmos com Deus;\n\n2. Alma, ou mente, ou psique – elemento com o qual contactamos a Humanidade (Eu e os\nOutros).\n\n      3. Corpo – elemento com o qual contactamos o mundo físico (matéria).\n\n        \"Rogo-vos pois, irmãos, pela compaixão de Deus, que apresenteis os vossos corpos como um\nsacrifício vivo, santo e agradável a Deus, que é o vosso culto racional. E não vos conformeis a este\nmundo, mas transformai-vos pela renovação da vossa mente, para que experimenteis qual seja a boa,\nagradável, e perfeita vontade de Deus‘‘ (Rm 12:1-2).\n\n      O uso da palavra ‗‘irmãos‘‘ referindo-se às pessoas a quem o texto estava sendo dirigido,\nimplica que essas pessoas já haviam recebido a Jesus, por isso se tornaram filhas de Deus, o que as fez\nirmãs entre si (João 1:12). Esse processo de se tornar filho de Deus só acontece por força do novo\nnascimento que ocorre no espírito humano, conforme João 3:4-8.\n\n       O que ocorre no espírito é o novo nascimento, onde tudo se faz novo (II Co 5:17), porque ao\nreceber a Jesus toda a velharia do pecado é perdoada, e o espírito é vivificado, tornando-se nova\ncriatura.\n\n       Quando o apóstolo diz \"irmãos‘‘, entendemos que fala aos que Têm espíritos vivificados,\nespíritos novos.\n\n      Então, o texto de I Tessalonicenses 5:23 nos explica como apresentar íntegros os três elementos:\n\n      - Espírito – Pelo novo nascimento (Jo 3:4-8).\n\n       - Alma – Pela renovação da mente, assumindo a mente de Cristo, manifesta na Palavra de Deus\n(I Co 2:16; II Co 5:17).\n\n      - Corpo – Pelo sacrifício e domínio próprio (I Co 9:27).\n\n      ‗‘Esmurrar‘‘ o corpo implica:\n\n      - não dar vazão a apetites carnais;\n\n      - só comer o que é sadio;\n\n      - não permitir que sono, cansaço, apetites, nos dominem;\n\n      - fazer atividades físicas.\n\n      Isso porque o corpo não nasceu de novo; ele só será glorificado quando na volta de Jesus (I Co\n15:53-54), quando não mais será corruptível.\n\n      A alma (ou mente) compõe-se de:\n\n      - sentimento\n\n      - vontade\n\n                                                                                    Igreja de Vencedores\n\n      - pensamento\n\n      - consciência\n\n       Nestas áreas todos nós somos feridos pela instrumentalidade de outro ser humano, ficando,\nassim com a mente ferida, ou adoecida. A alma, como o corpo, não nasceu de novo. Tudo nela ainda é\nvelho, envelhecido.\n\n       Os que passaram pelo processo do novo nascimento, que se tornaram irmãos, ainda têm pela\nfrente dois outros processos:\n\n      - Sacrifício do corpo;\n\n      - Renovação da mente.\n\n       Ainda que alguém ache que não tem feridas e que, por isso mesmo, não necessita de cura, ao se\ndeparar com a ordem ‗transformai-vos pela renovação da vossa mente‘, é obrigado a entender, através\nda crença na Palavra, que precisa de renovação.\n\n      2.2. Percebendo a dor de lembranças\n\n      Se ao lembrar um assunto sente-se dor, é porque a ferida ainda não cicatrizou. Dor na alma se\napresenta de diversas formas: nojo, raiva, angústia, ansiedade, medo, vergonha...\n      Exemplo 1: Sinto muita inveja, ou raiva, do irmão que minha mãe preferia.\n\n      Exemplo 2: Sinto nojo ao lembrar que fui estrupada.\n\n      2.3. Percebendo ‗‘comportamentos limitadores‘‘ ou sintomas\n\n       Há feridas para as quais não percebemos uma dor consciente, mas podemos classificar como\n‗‘limitador‘‘ um comportamento pouco sadio na área em que fomos feridos.\n       Exemplo1: Embora não sinta raiva do irmão que era preferido da minha mãe, não tenho muito\nassunto para conversar com ele; entre nós há uma certa indiferença visível.\n\n      Exemplo 2: Embora não sinta nojo (ou raiva) ao lembrar do estrupo, não consigo manter firme\num relacionamento afetivo.\n\n      Alguns tipos de feridas na alma, expressas por comportamentos limitadores:\n\n         -   Viver ameaçando\n         -   Viver chantageando\n         -   Sentir-se constantemente confuso\n         -   Jamais admitir erros\n         -   Racionalizar todas as situações\n         -   Sentir prazer no infortúnio do outro\n         -   Desqualificar o sucesso do outro\n\n-    Não ter sonhos, aspirações\n           -    Desconfiar sempre e de todos\n           -    Ser hipocondríaco\n           -    Ser ciumento\n           -    Ser triste\n           -    Ser risonho demais\n           -    Comparar-se compulsivamente\n           -    Possuir dinheiro e não usufruir dele\n           -    Gastar o que não tem\n           -    Ter dificuldade para dizer não\n           -    Sentir-se sem mérito, diante de elogios\n           -    Viver sob angústia\n           -    Ter vontade enfraquecida\n           -    Pensar que o mundo arquiteta contra si\n           -    Ter timidez paralisaste\n           -    Ter pesadelos constantes\n           -    Não ter prazer sexual no casamento\n           -    Masturbar-se compulsivamente\n\n        3. SITUAÇÕES QUE NOS FEREM EMOCIONALMENTE\n\n        A família é a nossa base. Se a sua base foi desestruturada, você também pode ser desestruturado.\nTalvez aconteceram muitas coisas no período em que você ainda estava no ventre de sua mãe, e\ndurante a sua infância e adolescência, que lhe afetaram diretamente. Talvez, feridas se instalaram em\nvocê através dos seus pecados e dos de sua família. Nossa alma e nosso coração são totalmente\nafetados pelo pecado. Talvez você esteja enfermo na alma porque seus pais pecaram, ou porque você\npecou.\n        O Senhor tem poder para curar os seus traumas, sua feridas interiores e até as sua doenças. Jesus\nveio para isto. Hoje Ele vai começar a fazer uma cirurgia em você, tirando o que foi plantado e não\npresta.\n\n        Temos alguns exemplos de homens que tinham doenças na alma e que precisam ser curados por\nDeus:\n\n       1. Moisés – tinha dificuldades na fala (língua pesada); talvez por isso achava-se incapaz de ser o\nlibertador do povo de Israel (Êx 4:10).\n\n     2. Elias – um poderoso profeta, mas que sentiu-se inferior e incapaz de enfrentar Jezabel.\nAchava que era o único que havia restado; queria morrer (I Reis 19:1-21).\n\n      3. Mirian (irmã de Moisés) – sentia-se inferior a Moisés e quis sobrepujar a situação fazendo\ncobranças e afirmando ser tão usada por Deus como Moisés. Como conseqüência ficou leprosa (Nm\n12:1-16).\n\n      4. Os 10 espias (enviados a Canaã com Josué e Calebe) – sentiram-se inferiores ao povo\ninimigo e por isso não herdaram a terra prometida (Nm 13:25-33).\n\n                                                                                     Igreja de Vencedores\n\n      Vejamos algumas portas que podem ser abertas, gerando feridas emocionais:\n\n      1. Rejeição\n\n       É um sentimento de que não somos amados, aceitos ou bem-vindos, antes somos rejeitados, e\nignorados por aqueles que nos rodeiam. Um sentimento de inferioridade e de auto piedade cerca a\npessoa. Às vezes tem muito potencial mas o mesmo acaba sendo menosprezado. A pessoa rejeitada\nsempre interpreta mal as atitudes das outras pessoas. Elas sempre têm a sensação de que as pessoas à\nsua volta criam situações para desprezá-las. A pessoa rejeitada, quando ama alguém, é como um\naspirador de pó : suga completamente a pessoa amada. A pessoa rejeitada diz ‗‘sim‘‘ quando deveria\ndizer ‗‘não‘‘ e ‗‘não‘‘ quando deveria dizer ‗‘sim‘‘; ela tem medo do que os outros pensam ou que as\npessoas a amarão menos. Na nossa vida a rejeição é uma das maiores portas de acesso a cadeias,\ncorrentes, grilhões e demônios. A rejeição vem através de várias situações, tais como:\n       a) O nome próprio. Ex.: Novalgina de Almeida, ou mesmo um outro nome não tão esquisito,\nmas a pessoa que o tem se sente humilhado (citar alguns outros nomes).\n\n      b) Morte do pai, da mãe ou de ambos. Inconscientemente a pessoa toma como rejeição a si.\n\n      c) Gravidez indesejada. Talvez seja fruto do relacionamento da mãe com um namorado que a\nabandonou.\n\n      d) Rejeição do marido quando soube que a mulher estava grávida, rejeitando a ela e a criança.\n\n      e) Divórcio dos pais.\n\n       f) Preferência dos pais. O pai dá preferência a um filho mais inteligente, bonito, descontraído,\nbrincalhão e esquece o outro filho. Os melancólicos podem se encaixar nesta situação por não serem\ntão comunicativos.\n\n       g) Rejeição no casamento. Ex.: o marido rejeita a esposa porque está gorda, fala coisas\ndesagradáveis para ela, há adultério, há humilhações. Na relação sexual só o marido se satisfaz (a\nesposa não tem orgasmo e o marido não se importa com isso), a mulher se sente usada, o marido\nsubestima a inteligência e a capacidade da esposa.\n\n      h) Abandono da mãe. A mãe que deixa o filho com a avó ou o pai, para ir trabalhar em outra\ncidade, ou morar com outro homem, ou vice-versa.\n\n        i) Profecias auto-realizadoras. A mãe ou o pai que lançou palavras de maldição sobre os\nfilhos, chamando-os de burro(a), prostituta, gay; dizendo que os filhos não deveriam Ter nascido, não\nprestavam para nada, não valiam nada, não iam dar para nada. Palavras desse tipo geram maldições,\ntraumas. Palavras são sementes que, uma vez semeadas pela nossa família ou autoridade, começam a\ncrescer e a dar frutos através de nós, isto quando não temos Cristo e uma consciência para fecharmos\nas brechas.\n\n      PALAVRAS QUE AMALDIÇOAM:\n\n      - Ah, você nunca vai prestar para nada.\n      - Você é pobre, conforme-se com isto, nunca vamos sair desta.\n\n- Você é um burro, nunca vai conseguir nada.\n\n       - Você vai virar uma prostituta se continuar assim.\n       - Você é um drogado e vai morrer assim.\n       - Seu casamento será uma porcaria, igual ao meu.\n       - Os homens nunca prestam, não confie neles.\n       - Você deve sempre ter três mulheres ou mais – uma, a mãe dos seus filhos, outra, a sua amante,\ne outra um caso à parte.\n       - Homem que é homem não chora.\n       - Todo homem, para provar sua masculinidade, precisa ter relações sexuais antes de se casar.\n       - Você vai virar homossexual se não arrumar namorado(a).\n\n        j) Apelidos referindo-se a possíveis deformações (orelhudo, nariz de bruxa, boca de cabide,\netc).\n\n        l) Xingamentos (palavrões).\n\n      m) Carência afetiva. O pai ou a mãe nunca lhe disseram que o amava, nunca lhe fizeram\ncarinho.\n\n        n) Desinteresse do pai ou da mãe (através de morte, excesso de trabalho, descaso).\n\n      o) Vícios dos pais. O pai ou a mãe foram alcoólatras, drogados, prostitutos, e isto trouxe muitos\ntraumas, muitas mágoas, e até vergonha para os filhos.\n\n        p) Suicídio de um dos pais.\n\n        q) Ensino sem disciplina. Fruto de lar sem liderança, sem controle, sem equilíbrio.\n\n        r) Discriminação racial, sexual, cultural.\n\n        2. Auto-rejeição\n\n           a) Deficiência física.\n           b) Magreza excessiva.\n       c) Obesidade (algumas pessoas aceitam como padrão de beleza um manequim que nunca\nalcançarão e criam complexos por causa disso; vivem em academias tentando alcançar um corpo\nperfeito).\n\n        d) Seios muito grandes (mulheres); pênis aparentemente pequeno demais (homens).\n\n        e) Cravos e espinhos em excesso, especialmente na adolescência.\n\n        f) Doenças constantes.\n\n                                                                                     Igreja de Vencedores\n\n      3. Culpa\n\n       Culpa por ter abortado ou pago o aborto de alguém; por homicídio; por espancar filhos ou\nirmãos mais novos, etc; por roubar; por ter enganado; por não ter cuidado dos filhos; por ter usado\nalguém sexualmente; por ter sido alguém de ‗‘programa\"; por ter sido abusado sexualmente ou ter\nestrupado a alguém; por não ser mais virgem; por ter sido homossexual; por ter adulterado, etc.\n\n      Por isso hoje você é:\n\n      Inseguro, medroso, birrento, rancoroso, magoado, melindrado, assustado, odioso, tímido,\ninconstante, solitário.\n\n      4. Abusos sexuais\n\n     Abusos de vizinhos, pai, mãe, tio, primo, prima, empregada, etc. A maioria dos abusos sexuais\nno mundo acontece no seio familiar, por parentes próximos.\n\n      5. Desvios sexuais\n\n     Estes podem acontecer como fruto de distúrbios psicológicos ou por intervenção direta de\ndemônios, ocasionando as seguintes situações que geram distúrbios na alma:\n     - Anafrodisia, frigidez e erotismo: são diminuição do instinto sexual, sendo a primeira no\nhomem e a segunda na mulher. Erotismo é o aumento desordenado do instinto sexual.\n\n     - Auto-erotismo ou coito psíquico. Não há necessidade do contato com o(a) parceiro(a).\nSomente um retrato, escultura ou a presença de alguém desencadeiam grande estimulação sexual.\n\n       - Narcisismo: admiração exagerada pelo próprio corpo; às vezes gera com indiferença pelo\noutro sexo.\n\n      - Exibicionismo: Obsessão de exibir os genitais.\n\n      - Fetichismo: fixação do interesse sexual em uma parte do corpo ou em objetos (da pessoa\namada ou não). Alguns se satisfazem só em tocar ou admirar. Outros têm que se masturbar\nconstantemente.\n\n      - Bestialismo ou zoofilia: atração sexual por animais (Lv 18:23).\n\n       - Masoquismo: prazer sexual com o próprio sofrimento físico ou agressão moral. O(a)\nparceiro(a) tem que bater, chicotear, xingar, humilhar, etc. (I Co 3:16).\n\n      - Pedofilia: atração sexual por crianças.\n\n      - Homossexualismo: atração sexual por pessoas do mesmo sexo (Lv 18:22).\n\n      - Transexualismo: o indivíduo não aceita o seu sexo, e deseja mudá-lo. Geralmente nega que\ntem uma prática homossexual (Lv 20:13).\n\n- Travestismo: prazer em trajar-se como o sexo oposto. Não necessariamente tem relações\nhomossexuais, mas sente prazer de estar travestido. Mudança de identidade sexual (Rm 1:26-27).\n\n      4. A CURA INTERIOR E A CURA DO CORPO\n\n       Devemos dar graças a Deus pelos médicos e enfermeiros cristãos. Lucas era médico, e foi\ninspirado pelo Espírito Santo para escrever a história de Jesus. Deus deu ao homem a inteligência e a\ncapacidade de criar os remédios e fazer uso deles. Os médicos tratam dos doentes, mas é Jesus quem os\ncura. Na maioria dos casos, a ciência médica trata dos sintomas; Jesus quer curar a causa das\nenfermidades.\n       Os médicos, psicólogos e psiquiatras cristãos confiam no Senhor, e louvamos a Deus pela\nexistência deles. A cura interior pode envolver psicoterapia mais a operação de Deus. Segundo o nosso\nprisma, a bênção máxima de Deus para nós é a cura, mas temos que entender que Deus é o soberano\nsobre nossas vidas. Jesus curou a muitos, mas não a todos. Há a necessidade de um investimento de fé\npor parte da pessoa, do ministrador e do auditório. Nos submetemos ao relatório final do Senhor, mas\nmanteremos finalmente a confissão da esperança (Hc 10:23).\n\n       Jesus é o maior dos médicos – o maior psicólogo que pode haver. Somente Ele pode curar-nos\nintegralmente. Ele deseja sarar nossas tristezas e mágoas. Onde havia confusão de espírito, ele quer\nintroduzir serenidade. Onde houve medo, ele está ansioso para conceder-nos uma mente sã (I Co 2:16).\nEle quer restabelecer relacionamentos destruídos; quer reerguer casamentos desmoronados. Quer que\nsejamos capazes de amar os outros do modo como gostaríamos de ser amados; e perdoar da forma\ncomo desejamos ser perdoados. Ele quer que sejamos aquele indivíduo que Ele tinha em mente quando\nnos criou.\n\n          5. COMO CURAR FERIDAS\n      1º - Admitindo que se precisa de cura.\n\n      2º - Acreditando que qualquer comportamento limitador pode ser modificado.\n      3º - Entrando em contato com lembranças dolorosas.\n\n      4º - Externando lembranças dolorosas e comportamentos limitadores.\n\n      5.1. Externar o quê e como\n\n      Externar dores (angústia, nojo, raiva, medo, tristeza, ódio, etc.) diante de outrem (Tg 5:16).\n      É importante que antes de receber oração por cura da alma, se expresse, em forma de confissão,\no material doloroso, limitador. Só após a confissão a oração deve ser feita.\n\n      Para que haja a cura interior são necessários dois passos:\n\n          1) Romper o domínio de Satanás sobre nós e tomar posse do que é nosso por direito.\n\n                                                                                  Igreja de Vencedores\n\n           2) Receber a cura das lembranças passadas.\n      É bom pensar nesse primeiro passo como sendo uma \"cirurgia espiritual\", em que Jesus cura\ntodos os tumores que estão \"crescendo\" em nosso interior – medo, ódio, ira, ciúme, autopiedade, etc.\nDepois, então, pela oração de cura das lembranças guardadas em nossa mente, Jesus penetra em nosso\npassado e cura todas as mágoas. Ele toma um \"apagador espiritual\" e desmancha todas as recordações\ndolorosas.\n\n       Talvez Ele não apague totalmente a lembrança delas, mas remove a dor e o aguilhão. Ele\nanestesia a dor e a ferida profunda. Depois unge com o óleo do Espírito Santo, e cura os locais onde\nhavia a ferida. Ele nos purifica e nos dá sua paz. O texto de Colossenses 2:11-15 descreve\nmaravilhosamente essa cirurgia espiritual:\n\n        ‗‘Nele também fostes circuncidados, não por intermédio de mãos, mas no despojamento do\ncorpo da carne, que é a circuncisão de Cristo; tendo sido sepultados com Ele juntamente no batismo,\nno qual igualmente fostes ressuscitou dentre os mortos. E a vós outros, que estáveis mortos pelas\nvossas transgressões, e pela incircunci
