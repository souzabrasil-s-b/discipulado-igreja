s. Na maioria das vezes, o pecado abre esta oportunidade, e como você sabe \"todos\npecaram\".\n\n     4. Satanás e seus demônios (demonologia)\n\n      Satanás estava no céu, e era um anjo de Deus, querubim ungido do Senhor. Era um anjo perfeito,\naté que um dia se engrandeceu diante de Deus, querendo ser semelhante ao altíssimo:\n\n          \"... Assim diz o Senhor Deus: Tu eras o selo da perfeição, cheio de sabedoria e perfeito em\n    formosura. Estiveste no Éden, jardim de Deus; cobrias-te de toda pedra preciosa: a cornalina, o\ntopázio, o ônix, a crisólita, o berilo, o jaspe, a safira, a granada, a esmeralda e o ouro. Em ti se faziam\n os teus tambores e os teus pífaros; no dia em que foste criado foram preparados. Eu te coloquei como\n       o querubim da guarda; estiveste sobre o monte santo de Deus; andaste no meio das pedras\n afogueadas. Perfeito eras nos teus caminhos, desde o dia em que foste criado, até que em ti se achou\n  iniqüidade. Pela abundância do teu comércio o teu coração se encheu de violência, e pecaste; pelo\n   que te lancei, profanado, fora do monte de Deus, e o querubim da guarda te expulsou do meio das\npedras afogueadas. Elevou-se o teu coração por causa da tua formosura, corrompeste a tua sabedoria\n por causa do teu resplendor; por terra te lancei; diante dos reis te pus, para que te contemplem. Pela\nmultidão das tuas iniqüidades, na injustiça do teu comércio, profanaste os teus santuários; eu, pois, fiz\n sair do meio de ti um fogo, que te consumiu a ti, e te tornei em cinza sobre a terra, à vista de todos os\n                                   que te contemplavam\". (Ez 28. 2 - 17)\n\n        No capitulo 28 de Ezequiel, encontramos a descrição deste anjo:\n\n         * Ele era o modelo da perfeição (v.12).\n\n         * Ele estava no Éden jardim de Deus (v.13).\n\n* Ele foi criado e não nascido (v.13,15).\n\n         * Ele era um anjo (v.14).\n\n         * Ele estava no monte santo de Deus (v.14,16).\n\n         Este anjo é identificado em apocalipse 12. 7 - 9\n\n         \"Então houve guerra no céu: Miguel e os seus anjos batalhavam contra o dragão. E o dragão\n   e os seus anjos batalhavam, mas não prevaleceram, nem mais o seu lugar se achou no céu. E foi\n precipitado o grande dragão, a antiga serpente, que se chama o Diabo e Satanás, que engana todo o\n             mundo; foi precipitado na terra, e os seus anjos foram precipitados com ele\".\n\n          Este anjo rebelado passou a se chamar satanás, que literalmente quer dizer \"lançar um\ncontra o outro\", isto é, \"semeador de contendas ou caluniador\". No hebraico significa \"satã\", que\nalem de \"adversário\" tem também o sentido de \"acusador\". Antes de sua queda, esse anjo rebelde era\nconhecido como \"estrela da manhã, filha da alva\" (Is 14.12). Na versão vulgata é traduzido por\n\"Lúcifer\" que significa \"anjo de luz ou portador de luz\". Alem desses nomes, satanás tem seus titulo e\nfunções:\n\n          * O príncipe deste mundo (Jo 12.31; 14.30; 16.11)\n\n          * O deus deste século (2 Co4.4)\n\n          * A antiga serpente (Ap 12.9; 2Co 11.13)\n\n          * O grande dragão (Ap 12.3,9)\n\n          * Enganador (Ap 12.9; 20.3)\n\n          * Acusador de nossos irmãos (Ap 12.10)\n\n         * Tentador (Mt 4.3; 1Ts 3.5)\n\n         * O vosso adversário (1Pe 5.8)\n\n         * Homicida (Jo 8.44)\n\n         * Mentiroso e pai da mentira (Jo 8.44)\n\n         * desagregador de igrejas (1 Co 1.10 - 17)\n\n           O principal pecado que levou satanás a sua queda, foi o orgulho (Ez 28.17; 1Tm3.6). Isaías\n14.13 descreve o seu orgulho demonstrado em sua rebelião contra Deus. Cinco vezes satanás disse:\n\n          * \"Eu subirei..., (eu) exaltarei..., (eu) me assentarei...,\n\n          * (eu) subirei..., (eu) serei...\".\n\n                                                                                   Igreja de Vencedores\n\n        5. Entendendo mais sobre demônios\n\n         Apesar de satanás ter sido um querubim ungido, com a rebelião ele levou consigo muitos\nanjos (inclusive arcanjos), os quais se tornaram demônios, desta forma teriam sido destruídos de seus\ncorpos angelicais. Agora tais demônios necessitam de corpos para se manifestarem neste mundo.\n\n        * São seres inteligentes: Mt 8.29,31\n\n        * São seres espirituais: Lc 9. 38,39 e 42\n\n        * São espíritos destituídos de seus corpos: Mt 12.43 e 44\n\n       6. Hierarquia espiritual dos demônios\n\n        \"pois não é contra carne e sangue que temos que lutar, mas sim contra os principados, contra\nas potestades, contra os príncipes do mundo destas trevas, contra as hostes espirituais da iniqüidade\nnas regiões celestes\". ( Ef 6.12)\n\n       O texto acima talvez possa ser chamado de áureo da batalha espiritual, pois aqui Paulo nos dá\ngrandes ensinamentos:\n\n      * Principados:\n\n      Principados: De acordo com o dicionário, principado significa: \"território ou estado governado\npor um príncipe ou princesa\". No grego, apalavra principado é arche – \"autoridade\", \"governante\",\n\"domínio\" e \"esfera de influencia\".\n\n      A Bíblia nos traz um bom exemplo de batalha espiritual, a nível de principado:\n\n     \"Mas o príncipe do reino da Pérsia me resistiu por vinte e um dias; e eis que Miguel, um dos\nprimeiros príncipes, veio para ajudar-me, e eu o deixei ali com os reis da Pérsia\"    (Dn 10.13).\n\n     O príncipe da Pérsia lutava contra o arcanjo Miguel (também príncipe), para impedir a resposta\ndo homem de Deus.\n\n       No caso de Daniel, ele orava por uma nação inteira, por isso envolveu principados.\n\n       Observe a resposta do arcanjo Miguel:\n\n       \"Ainda disse ele: Sabes por que eu vim a ti? Agora tornarei a pelejar contra o príncipe dos\npersas; e, saindo eu, eis que virá o príncipe da Grécia\". (Dn 10.20)\n\n      * Potestades (sub príncipes):\n\nNo grego potestade significa, eksousia – \"autoridade\", \"poder\" no sentido de autoridade\ndelegada são governantes subordinado aos principados, por isso também são chamados de sub\npríncipes.\n\n      Existem milhares e milhares de potestades espalhada sobre a face da terra, assumindo\nresponsabilidades por estados, cidades, bairros, ruas e etc...\n\n      * Dominadores (demônios de baixa grandeza) :\n\n       Do grego kosmokrator, que literalmente significa \"governante mundial\", também são milhares e\nmilhares e são responsáveis pelo andamento de projetos idealizados pelos principados. Atuam como\nguias, orixás, mensageiros ou operários.\n\n      A palavra governante mundial não é porque eles estão no comando geral, mas porque seus atos\ninfluenciam o destino da humanidade.\n\n     São demônios de baixa grandeza são as conhecidas \"entidades\", que na umbanda são conhecidas\npor diversos nomes: Zé Pilintra, Exu Caveira, Pomba Gira, Preto Velho e etc. Eles são destinados a\npossessões, onde entram nas vidas das pessoas e destroem tudo.\n\n    * Forças espirituais (hostes):\n\n     Do grego, pneumatikos \"seres malignos\", \"força do mal\" são demônios de menor hierarquia, que\ntrabalha em legiões, auxiliando nos trabalhos de possessões.\n\n      * Legiões demoníacas:\n\n      \"mas esta casta de demônios não se expulsa senão à força de oração e de jejum\"               (Mt\n17.21).\n\n       A casta são centenas de demônios (legiões) em uma única pessoa. Quando se expulsa um, entra o\noutro. Quando se tira o outro, entra mais um...\n\n      Existem algumas legiões de demônios conhecidas principalmente no Brasil e no continente\nafricano. Foram trazidas para o Brasil através dos escravos, com suas seitas e religiões que trouxeram\npara nossa cultura formas de invocação e pacto para nossa terra.\n\n    Quando os padres jesuítas proibiram os escravos de adorar seus deuses e eles deveriam adorar os\n\"santos\" da igreja católica, foi criado então o sincretismo, de forma que as legiões poderiam ser\nadoradas através dos \"santos\" da igreja católica.\n\n    Prova disso é que em diversas cidades brasileiras, praticantes de umbanda, candomblé e igreja\ncatólica, se encontram nas portas dos templos, normalmente para adorar os tais \"santos\" ou \"legiões\".\n\n                                                                                   Igreja de Vencedores\n\n              LEGIÃO                                IGREJA CATOLICA\n               Ogum                                        São Jorge\n               Oxossi                           São Sebastião / Santo Expedito\n   Obaluaê / Omulú (rei do cemitério)               São Lazaro / São Roque\n               Xangô                         São João / São Pedro / São Jerônimo e\n\n                                                        Santo Antônio\n                 Oxum                                  N. S. da Conceição\n                  Iansã                                  Santa Barbara\n                Iemanjá                      N. S. do Rosário / Carmo/ Aparecida e\n\n                                                        dos Navegantes\n                 Oxalá                                        Jesus\n\n   Veja alguns nomes de legiões conhecidas pelo povo brasileiro:\n\n   EXUS: Zé Pilintra Tranca Rua, Sete Facadas, Pomba Gira, Rosa Vermelha, Maria Padilha, As de\nCopa, Sete Saias, Sete Esquinas, Capa Preta e etc.\n\n   Talvez você esteja se perguntando: \"sempre pensei que estes nomes acima fossem demônios, mas\nsão legiões?\n\n    Sim como pode uma Pomba Gira, por exemplo, manifestar em vários lugares ao mesmo tempo?\nSão legiões, que se manifestam pelo mesmo nome. Exemplo existe a legião da Pomba Gira (Centenas,\nMilhares de Pombas Giras), assim como milhares de cada um dos outros demônios.\n\n      Muitas cidades do Brasil são oferecidas a \"santos\" e imagens. Esta é uma maldição para a terra,\npois por traz de toda idolatria, se esconde uma legião de demônios.\n\n     * Pirapora: Cidade de São Paulo Cheia de idolatria e feitiçaria.\n\n     * São Paulo: Estado repleto de templos budistas.\n\n     * Brasília: Afetada pelo misticismo e nova era.\n\n     * Blumenau: espírito de suicídio.\n\n     * Nordeste do Brasil: Região afetada pela idolatria católica.\n\n     * Rio de Janeiro: Existe uma grande imagem de braços abertos denominada por \"cristo redentor\".\nNão se deve confundir esta imagem com o nosso Senhor Jesus Cristo. Por traz de toda idolatria existe\num demônio. Esta imagem está em uma posição estratégica, com o propósito de amaldiçoar toda a\ncidade. (que tem sido marcada pela violência, adultério e prostituição.\n\n    Algumas legiões:\n\nAbaddon - (demonio hebreu) o destruidor.\n     Adramelech - demonio sumeriano.\n     Ahpuch - demonio maia.\n     Ahriman - demonio mazdeano\n     Amon - demonio egipcio da vida e reprodução, com cabeça de carneiro\n     Apollyon - sinônimo grego para Satan, o arquidemonio.\n     Asmodeus - demonio hebreu da sensualidade e luxuria, originalmente \"criatura do julgamento\".\n     Astaroth - demonio fenício da lascívia, equivalente da Ishtar babilônica.\n\n     Balaam - demonio grego da avareza e cobiça.\n     Baphomet - adorado pelos Templários como símbolo de Satan.\n     Bast - demonio egípcio do prazer e sedução representada pelo gato.\n     Baal - Principado dos povos cananeus. O culto a Baal era uma constante tentação para os\nisraelitas. (Juízes 6:25).\n\n     Beelzebuth - (demonio hebreu) senhor das moscas, tomada do simbolismo do escaravelho.\n     Behemoth - personificação hebraica de Satan na forma de um elefante.\n     Beherit - nome sirio para Satan.\n     Bile - demonio celta do inferno.\n\n      Belial - Maligno, indignidade. No seu uso comum significa o que é vil, indigno e inútil, quer se\ntrate de coisas (Sl 41.8), ou de uma pessoa ou classe de pessoas.\n\n    Chemosh - demonio nacional dos Moabites.\n    Cimeries - demonio que tem a figura montado em um cavalo negro e rege a África.\n\n    Dagon - demonio filisteu vingativo do mar.\n    Damballa - demonio serpente do Vodu.\n    Diabolus - (demonio grego) \"fluindo para baixo\".\n    Drácula - nome romenio para demonio.\n\n     Emma-O - principado japonês do inferno.\n     Euronymous - principe grego da morte.\n\n     Gorgo - diminutivo de Demogorgon, nome grego para demônio.\n\n    Haborym - sinônimo grego para Satan.\n    Hecate - demônio grego do mundo subterrâneo e feitiçaria.\n\n  Ishtar - demônio babilônica da fertilidade.\n\n  Loki - demônio teutônico.\n\n  Leviatã - Grande animal marinho, possivelmente um crocodilo ou uma serpente marinha            (Jó\n41.1).\n\n                                                                                      Igreja de Vencedores\n\n   Mammon - demônio aramaico da riqueza e do lucro (avareza).\n   Marduk - principado da cidade de Babilônia.\n   Metzli - demônio azteca da noite.\n   Mictian - demônio azteca da morte.\n   Midgard - filho de Loki, descrito como uma serpente.\n   Milcom - demônio amonita.\n   Moloch - demônio fenicio e canaanita (Tradicionalmente entendido como o nome de um deus\npagão, cujo ritual incluía o sacrifício de crianças, que eram queimadas (Lv 18.21).\n   Naamah - demônio feminino grego da sedução.\n   Nergal - demônio babilônico do Hades.\n   Nija - demônio polaco do mundo subterrâneo.\n\n  O-Yama - nome japonês para Satan.\n\n  Pluto - demônio grego do mundo subterrâneo.\n  Proserpine – principado grego do mundo subterrâneo.\n\n Sabazios - demônio frigio, identificado com Dyonisus, adorado como serpente.\n Samnu - demônio da Ásia Central.\n Sekhmet - demônio egípcio da vingança.\n Set - demônio egípcio.\n Shiva - o destruidor.\n Supay - demônio inca do mundo subterrâneo.\n\n Thoth - demônio egipcio da magia.\n\n    Yaotzin - demônio azteca do inferno.\n    Yen-lo-Wang - principado chinês do inferno.\n\n    7. Os demônios nos desenhos animados\n\n     Muitos demônios são invocados pelos desenhos:\n\n      Thundercats: Onde o personagem egípcio representante do mal diz \"Antigos espíritos do mal,\ntransforme esta forma decadente em Mon há\". Ao proferir tais palavras o personagem se transforma\nem um demônio. Agora imagine um grupo de crianças brincando e uma delas imita o Mon há. Eis uma\ninvocação.\n\n   He man: O jovem príncipe diz uma palavra: \"pelos poderes de Grayscow, eu tenho a força\". Ele\nadquire a força e se transforma, graças ao poder da caveira cinza.\n\n8. Através de palavra de maldição\n\n    \"Muitas são as mães que repetem palavras como: \"esse menino é um capetinha\", \"moleque\nmalvado\" – moleque significa moloque (Tradicionalmente entendido como o nome de um demonio,\ncujo ritual incluía o sacrifício de crianças, que eram queimadas -Lv 18.21). \"burro\"... essas palavras\nsão como nomes, que invocam os demônios para cumprir o significado das palavras na vida das\npessoas.\n\n   9. Anjos do Senhor\n\n    Hierarquia:\n\n    * Os arcanjos: A palavra arcanjo representa a mais elevada posição na hierarquia angelical. A\npalavra \"arc\" vem do grego \"arch\" que significa chefe, um príncipe, um primeiro ministro.     (Dn\n12.1)\n\n    * Os querubins: Essa classe de anjos se destaca pela ligação com o trono de Deus. A palavra\nquerubim, no hebraico \"querub\", tem o sentido de guardar, cobrir... (Gn 3.24)\n\n     * Os serafins: A palavra serafim vem do vocábulo \"saraph\" e significa ardente, refulgente ou\nbrilhante. (Is 6.2)\n\n      10. O jejum na batalha espiritual\n\n      Um dos segredos do sobrenatural é o jejum, o jejum fortalece o espírito humano e o homem\ninterior se volta para Deus, nos tornamos aptos a ouvir a voz do Espírito Santo, e entender os mistérios\nde Deus.\n\n      As batalhas espirituais que os discípulos não venciam, Jesus vencia. Não se esqueça que Jesus\nCristo se despiu de sua gloria. O poder que ele usou para realizar curas e libertação foi mediante ao\nEspírito Santo que estava sobre ele. Este mesmo poder foi delegado a nós.\n\n    Jesus Cristo jejuava constantemente. Após o batismo ele jejuou 40 dias e desta formas conseguiu\nvencer o diabo.\n\n       11. A armadura de Deus\n\n          \"Portanto tomai toda a armadura de Deus, para que possais resistir no dia mau e, havendo\n  feito tudo, permanecer firmes. Estai, pois, firmes, tendo cingidos os vossos lombos com a verdade, e\n   vestida a couraça da justiça, e calçando os pés com a preparação do evangelho da paz, tomando,\nsobretudo, o escudo da fé, com o qual podereis apagar todos os dardos inflamados do Maligno. Tomai\ntambém o capacete da salvação, e a espada do Espírito, que é a palavra de Deus; com toda a oração e\n súplica orando em todo tempo no Espírito e, para o mesmo fim, vigiando com toda a perseverança e\n                              súplica, por todos os santos\" (Ef 6.13- 18).\n\n                                                                                    Igreja de Vencedores\n\n         Aproveitando que estamos falando armadura de Deus na batalha espiritual, é importante\nlembrar. Quando entramos em batalha espiritual, dependendo do nível de batalha é normal sentirmos\nnosso corpo cansado e dolorido isto é normal, o corpo humano acaba refletindo o resultado da batalha\nespiritual que estamos enfrentando.\n\n       Não é aconselhável, portanto ministrar libertação em jejum. O jejum deve ser um habito do\ncristão.\n\n      12. Ações dos demônios\n\n     Opressão: A opressão demoníaca é a presença de demônios afetando a mente de uma pessoa,\nsem possuí-la. É um passo antes da possessão. Também é consequência do pecado.\n\n    Sintomas da Opressão: Nervosismo excessivo; Dores constantes de cabeça; Insônia; Medo;\nDesmaios; Vontade de morrer; Doença que os médicos não descobrem; Visões / Audições e etc.\n\n      Possessão: A possessão acontece após a opressão, porem neste estagio o demônio (ou legião),\npossui completamente a vida da pessoa, podendo usar o seu corpo como bem quiser.\n\n      Sintomas da Possessão: Olhar vago e distante; Força extrema; Cheiro de podridão; Cheiro de\nrosas; Som de instrumentos musicais (sem haver nenhum no local) e etc...\n\n       Ataques mentais e espirituais: Pesadelos; Opressão durante a noite; Enforcamento durante o\nsono; Sentimento de aperto no peito e etc.\n\n      Ataques físicos e materiais: Perda de emprego por perseguição; Diversos tipos de perseguição;\nViolência; Enfermidades e etc.\n\n13. Portas de entrada de domínios nas Casas\n\n     \"Não meterás, pois, uma abominação em tua casa, para que não sejas anátema, semelhante a\nela; de todo a detestarás, e de todo a abominarás, pois é anátema\". (Dt 7.26)\n\n    * bruxinhas; anjos; duendes; bonequinhas de porcelana ou outro material         (Ex 20.4)\n\n    * velas aromática; incensos; aromas e etc.(Is 1.3)\n\n    * Imagens de santo; Jesus e outros (Is 57.13)\n\n    * CDs e DVDs de cantores mundanos e blasfemadores (Mt 12.31)\n\n    * jogos satânicos; revistas pornográficas; revistas de ocultismo e prostituição (2Co 2.11; 1Co 1.30)\n\n* quadro com imagens exotéricas ou místicas.\n\n    * Qualquer vicio, cigarro; bebida e etc..\n\n    * falar mal da igreja; do pastor; murmurar; fofocar, não dizimar e etc..\n\n\"Portanto tomai toda a armadura de Deus, para que possais resistir no dia mau e, havendo feito\ntudo, permanecer firmes. Estai, pois, firmes, tendo cingidos os vossos lombos com a verdade, e\nvestida a couraça da justiça, e calçando os pés com a preparação do evangelho da paz, tomando,\nsobretudo, o escudo da fé, com o qual podereis apagar todos os dardos inflamados do Maligno.\nTomai também o capacete da salvação, e a espada do Espírito, que é a palavra de Deus; com toda a\noração e súplica orando em todo tempo no Espírito e, para o mesmo fim, vigiando com toda a\nperseverança e súplica, por todos os santos\"\n\nDISCIPULADO\n\n     1. Oração e Jejum por três pessoas durante um mês resultará em libertação.\n\n     2. Célula ou Geração forte (evangelismo pessoal).\n\n     3. Inicie o discipulado e consolide o discípulo\n\n     4. Envie três pessoas para o Encontro com Deus parta concluir a libertação.\n\n          5. “pois não é contra carne e sangue que temos que lutar, mas sim contra os principados,\ncontra as potestades, contra os príncipes do mundo destas trevas, contra as hostes espirituais da\niniqüidade nas regiões celestes”.(Ef 6.12) “Portanto tomai toda a armadura de Deus, para que possais\nresistir no dia mau e, havendo feito tudo, permanecer firmes. Estai, pois, firmes, tendo cingidos os\nvossos lombos com a verdade, e vestida a couraça da justiça, e calçando os pés com a preparação do\nevangelho da paz, tomando, sobretudo, o escudo da fé, com o qual podereis apagar todos os dardos\ninflamados do Maligno. Tomai também o capacete da salvação, e a espada do Espírito, que é a\npalavra de Deus; com toda a oração e súplica orando em todo tempo no Espírito e, para o mesmo fim,\nvigiando com toda a perseverança e súplica, por todos os santos”\n\n     6. Procure adquirir o livro Casa Favorita – Tommy Tenney\n\n                                                                                   Igreja de Vencedores\n\nVERIFIQUE O QUE VOCÊ APRENDEU\n\n1. Defina Batalha Espiritual.\n\n______________________________________________________________________________\n\n2. Defina Hierarquias espirituais dos demônios.\n\n______________________________________________________________________________\n\n3. Defina a armadura de Deus.\n\n______________________________________________________________________________\n\n4. Defina ações dos demônios.\n\n______________________________________________________________________________\n\n5. Defina portas de entrada de domínios nas Casas.\n\n______________________________________________________________________________", "quiz": [{"q": "Qual é o texto bíblico-base da lição \"BATALHA ESPIRITUAL\"?", "options": ["Gálatas 5:1,4,5,13,14,16-25; Colossenses 3:5-10; II", "Efésios 5.18", "2 Tm 4.7", "1 João 4.1"], "answer": 2}, {"q": "Qual destes é um dos tópicos estudados na lição \"BATALHA ESPIRITUAL\"?", "options": ["O Significado Do Batismo", "A Vida De Charles T. Russell", "Inicie O Discipulado E Consolide O Discípulo", "Fazendeiros E Mercadores"], "answer": 2}, {"q": "Qual destes tópicos NÃO faz parte da lição \"BATALHA ESPIRITUAL\"?", "options": ["A Armadura De Deus", "A Natureza Do Espirito Santo", "Satanás E Seus Demônios (Demonologia)", "Não Existe Luta Entre Deus E O Diabo"], "answer": 1}]}, {"num": 36, "title": "RELIGIÕES, SEITAS E HERESIAS", "verseRef": "1 João 4.1", "content": "TEXTO BÍBLICO\n\n     HERESIAS – CATOLICISMO\n\n     INTRODUÇÃO\n\n      Nesta lição iremos abordar afirmações, dogmas , pensamentos e práticas de religiões heréticas\nque são verdadeiras pontes que jamais poderão ligar o homem a Deus , porque são pontes quebradas\npor : Falsidade e deturpação da verdade bíblica. No Brasil os evangélicos leigos , estão em constante\nconflito ideológico e doutrinário com as seguintes heresias : Catolicismo romano, Islamismo,\nAstrologia, Hinduísmo, Budismo,          Maçonaria, Espiritismo, Vodu, Mormonismo, Igreja\nMessiânica Mundial, Seicho-no-ie, Hare Krisna, Igreja da Unificação Testemunha de Jeová,\nAdventista do sétimo dia e etc. A seguir esboçaremos alguns pontos heréticos e como refutá-los\nbiblicamente.\n\n     CATOLICISMO ROMANO\n\n     Como toda igreja de ramificação cristã, a Igreja Católica Apostólica Romana, afirma que sua\nfundação se deu no ano 33 d.C , porém o desenvolvimento de sua organização como Igreja ( Entidade\nCivil) e doutrina foi se firmando aos poucos e não de uma vez.\n\n     1. INÍCIO DO DESVIO\n\n       A Igreja Católica não começou a sua História como é hoje, mas desde o início da Igreja Cristã\napós o pentecoste, a Igreja conviveu com todo tipo de perseguição, discriminação e injustiças\npraticadas pelo Judaísmo (em suas seitas), outras religiões gentílicas, governos e o império romano. –\nO calor das perseguições, fez com que a Igreja guardasse sua pureza e fidelidade.\n     Graças a ousadia e coragem dos pais da Igreja e dos famosos defensores da fé cristã o combate da\nIgreja às heresias que surgiram neste período (33 à 196 d.C. iniciaram algumas heresias veladas no seio\nda Igreja , até o ano 300 d.C. –     No final do 3º século , houve a ascensão de Constantino como\nImperador do Império Romano , que apoiou o Cristianismo e o fez religião oficial no ano 312\nd.C. , mal feitor do Cristianismo.\n     Com sua conversão ao Cristianismo, houveram \"pseudo conversões à Cristo e a Igreja\" de\nmilhares de pessoas, sem experimentar uma real conversão. Pessoas que continuavam adorando a seus\ndeuses e também à Cristo.\n\n                                                                                    Igreja de Vencedores\n\nNeste período, como a Igreja já era estatal e perdia cada vez mais o temor de Deus, muitos cidadãos\nbuscavam cargos na Igreja como meio de obter influência social e política, ou para gozar dos\nprivilégios e do sustento que o Estado Imperial dava ao clero.\n\n    2.ORIGEM DO PAPADO\n\n     Desde o ano 200 a.C. até o ano 376 d.C. os imperadores romanos haviam ocupado o posto e o\ntítulo de Sumo Pontífice da Ordem Babilônica. Depois que o imperador Graciano se negara a liderar\nessa religião não Cristã, Damaso, o bispo da igreja Cristã em Roma foi nomeado para esse cargo\nem 378 d.C. Uniram-se numa só pessoa todas as funções de um sumo sacerdote apóstata com os\npoderes dum bispo Cristão.\n     Com essa unificação em Roma da Igreja Católica com a \"Ordem Babilônica\", onde duas\npotestades idólatras eram fundidas ( Rainha do céu- Jr. 7:18 e Diana dos Efésios - At.19:27) . O\ndiabo abriu nova brecha de idolatria, desta vez com a mãe de Jesus (Maria) que faleceu exatamente em\nÉfeso, onde já havia a fusão entre a Rainha do céu e Diana; agora bastava \"cristianizar\" o nome da\n\"potestade\" adorada. Em seguida iniciou o período chamado: \"idade das trevas\", onde surgiram\nabsurdos romanos quanto à pessoa piedosa de Maria, A Mãe de Jesus.\n\n      3. A PRIMEIRA DIVISÃO DA IGREJA CATÓLICA\n\n      Os bispos e líderes sediados em Constantinopla (Hoje Istambul Turquia), não aceitaram mais\ndesvios doutrinários, e, então houve a separação de fato e direito em 1054 d.C.- A Igreja Ocidental\ncontinuava com sede em Roma e a Oriental em Constantinopla. A Igreja Oriental guardou a primazia\nsobre os patriarcados em Jerusalém, Antioquia a Alexandria.\n\n      4. AFIRMAÇÃO E DOUTRINAS HERÉTICAS DO ROMANISMO\n\n      O conteúdo dos desvios doutrinários do Romanismo é muito extenso, por isso nos deteremos\nnaqueles que são mais gritantes e vergonhosos, que como outros, não têm conotação bíblica.\n\n      São eles:\n\n     * Pedro é realmente fundador da Igreja? Recebeu ele as chaves dos céus?\n\n     * Mariolatria. Maria continua virgem? Não teve filhos? É a mãe de Deus? É intercessora     hoje?\n\n     * A infabilidade do Papa da Igreja Católica Romana; Purgatório e a missa Católica;\n\n     * A Tradição Cristã em justaposição com a Bíblia e os livros Apócrifos.\n\n    5. SERIA PEDRO O FUNDADOR DA IGREJA?\n\nBaseada no texto de Mateus 16:16-19, a Igreja Católica Romana considera o apóstolo Pedro, a\npedra fundamental sobre a qual Cristo edificou a sua Igreja; para fundamentar esse ensino, tira as\nseguintes conclusões do texto citado:\n\n   1)Pedro é a rocha sobre a qual a igreja está edificada;\n\n   2)A Pedro foi dado o poder das chaves, portanto, só ele pode abrir a porta do Reino dos céus;\n\n     3)Toda autoridade foi conferida a Pedro, até nossos dias, através da linhagem de bispos e papas,\ntodos vigários de Cristo na terra.\n\n    * Basta olharmos um pouco as regras da Hermenêutica (Arte de interpretar textos) para vermos os\nabsurdos doutrinários da Igreja Romana.\n\n    4)A primeira regra de hermenêutica bíblica é : \"Á Bíblia explica a própria Bíblia\".\n\n       * No verso 18, vemos duas palavras, diferentes que a Igreja Romana Traduz da mesma forma:\n\n    Tu és Pedro (Petros)... Que quer dizer pedra pequena (fragmento) e móvel.\n    Sobre está Pedra (Petra) edificarei... Petra designa \"Rocha\" grande e firme.\n    Seria incoerência do Senhor, edificar a sua Igreja sobre uma rocha pequena e móvel.\n    Com a interpretação correta do texto, nota-se que houve má fé na interpretação romana, portanto, a\nIgreja de Cristo jamais poderia repousar sobre Pedro \"Petros\".\n\n   QUEM ENTÃO É A PEDRA SOBRE A QUAL A IGREJA CATÓLICA ESTÁ\nEDIFICADA?\n\n   6. CRISTO, EM TODA A BÍBLIA, É A PEDRA-ROCHA GRANDE E FIRME:\n\n    1)Isaías profetizou que Deus colocaria em Sião a pedra (Petra) de esquina leira e preciosa; e quem\nnela crer não será confundido.Is. 28:16 Isso se cumpre em Cristo.Mc.16:16; Rm.9:33(As pedras de\nesquina eram as mais firmes,que os construtores usavam, pois as mesmas eram capazes de suportar o\npeso de uma grande estrutura. Deus colocou Cristo como alicerce na grande construção de sua\nIgreja).\n\n     2)Em Daniel 2:34, Ele é a Pedra (Petra) que foi cortada em mão. Daniel afirma no verso 44 que\naquela pedra (Petra) é o representante do Reino que será estabelecido para sempre;\n     3)Apóstolo Paulo diz que Cristo é a Pedra (Petra) angular. Ef.2:20;\nO próprio apóstolo Pedro ensinou que Cristo é a Pedra (Petra) foi rejeitada e se tornou Pedra (Petra)\nAngular. At. 4.11- O apóstolo ainda escreve que Cristo é a Pedra (Petra) Viva, eleita por Deus e\npreciosa. 1 Pe. 2:5.\n\n    7. UM PARALELO ENTRE PEDRO E OS PAPAS DE HOJE:\n\n                                                                                   Igreja de Vencedores\n\n      Pedro, o Apóstolo                   O Papa de 608 a 2010 d.C.\n      Pedro era financeiramente pobre.     Administrador de uma das\n      At3:6                                maiores     fortunas     mundiais\n      Pedro era casado. Mt 8:14,15         (Vaticano e seu banco).\n      Era humilde e não aceitou ser        Tem que fazer o voto de\n      Adorado. At.10:25                    castidade (Celibatário).\n      Pedro      foi    um      homem      Considera-se junto com a Igreja\n      repreensível Gl 2:11-14              infalível.\n                                           Aceita adoração dos homens e\n                                           canoniza homens para serem\n                                           adorados por homens.\n\n    CONCLUSÃO SOBRE A PEDRA FUNDAMENTAL DA IGREJA:\n\n     Pedro não era o \"príncipe dos apóstolos\" como a Igreja católica Romana ensina, pois a Bíblia\naponta um pastor da Comunidade Cristã em Jerusalém que era Tiago, irmão do Senhor. Visto também\nque Pedro foi \"Papa\" como ensinam, ele não se submeteria ao conselho da Igreja em Jerusalém sobre a\nIgreja gentílica At.15:7. E Paulo ainda documenta que as colunas da Igreja eram: Tiago, Céfas e João.\nGl 2:9.,portanto, concluímos que:\n\n   1)Pedro não é a Pedra sobre a qual está fundada a Igreja, mas como nós Cristão; ele foi uma simples\ne pequena pedra (petros) que compõem o corpo da construção que é a Igreja.\n\n   2)Pedro não tem as chaves do céu. As chaves de autoridade foram dadas à Igreja do Senhor.\n\n   3)Pedro não foi o primeiro Papa, pois é remota a possibilidade que o mesmo tenha estado e firmado\nbispado em Roma.\n\n    4)Cristo é a Rocha Firme, sobre a qual sua Igreja está fundada e diante dessa Igreja, que tem este\nalicerce, as portas do inferno não prevalecerão.\n\n    5)Quer nos parecer que, quando Cristo faz menção que: \"Sobre está pedra edificarei a minha\nIgreja\", Ele estava se reportando a verdade que Pedro acabara de dizer, ou seja: \"Tu és o Cristo, o\nfilho do Deus vivo\" . Mt16:16 – e, mais tarde, nos escritos petrinos, paulinos e joaninos, aprendemos\nque, sobre este nome: \"Jesus Cristo\", as portas do inferno jamais prevalecerão.Fl.2:10-11; Pe. 5:10-\n11;Ap.11:15-17.\n\n      8. MARIOLATRIA\n\n      \"Salve a agraciada; o Senhor é contigo... (Lc.1:28)... Bendita sois vós entre as mulheres e\nbendito o fruto do vosso ventre! Lc 1:42b. Estes textos são bíblicos. O primeiro foi falado por\nGabriel e o segundo foi falado por Isabel, uma mulher cheia do Espírito Santo.\n\nCom a junção dos dois textos acima, a Igreja Católica Romana, fez de uma oração à Maria, que\nno ano 431 d.C declarou Maria mãe de Deus. Assim toda oração (reza) ficou: parte bíblica e parte\npagã, herética e idolátrica, da seguinte forma:\n\n       Ave Maria cheia de graça, O Senhor é convosco. Bendita sois vós entre as mulheres e bendito é\no fruto do vosso ventre: Jesus. Santa Maria, mãe de Deus, rogai por nós pecadores. Agora e na hora\nda nossa morte amém.\n\n      Se você já foi católico, já sabe que \"Maria\" tem mais valor e proteção que o nome do próprio\nCristo, não é?! – Seria este um simples \"desvio Cristão\", ou um claro abandono do cristianismo e um\nassumir do paganismo de vez? – Sim, porque ser Cristão implica em ter apenas um Senhor, que é\nCristo. Não uma senhora e, muito menos que seja a Mãe de Deus.\n\n    No compêndio do Vaticano II, página 103, registra:\"... os fiéis devem venerar também a memória\nprimeiramente da gloriosa sempre Virgem Maria, mãe de Deus e de nosso Senhor Jesus Cristo\". –\nSempre virgem? Mãe de Deus?Intercessora (rogai por nós)?\n\n    9. MARIA NUNCA FOI E NUNCA SERÁ: \"SEMPRE VIRGEM\".\n\n     1) Maria, com o parto como qualquer mulher, deixou de ser virgem. E após o nascimento de Jesus,\nela passou a ter relacionamentos sexuais normais com José, que lhe trouxeram pelo menos: mais 07\nfilhos. Mt 1:25; 13:54-56; Mc 6:3.\n\n    2) Seria estultícia imaginar que uma mulher que estivesse coabitando normalmente com seu marido\ne obtendo 04 filhos homens e pelo menos 03 mulheres, continuasse virgem.\n\n    3) A Igreja romana, freqüentemente quer fazer mal uso da bíblia dizendo que, quando a Bíblia fala\nde irmãos de Jesus, ela quer dizer: irmãos de fé ou primos. Mas graças à Deus Martinho Lutero,\ntraduziu a Bíblia do latim para a língua do povo e nós podemos ler sem ajuda os textos citados, e\nperceber que bobagem nos ensinaram.- Além desses textos ainda existem outros que se referem aos\nirmãos de Jesus. Veja: Mt.12:46;Mc 3:31; Lc 8:19; Jo. 7:3, 5,10; 1 Co.9.5;Gl 1:19.\n\n    4) Percebe-se porque a Igreja Católica proibiu a leitura bíblica e fazia as sua missas em latim.\n\n    5) Quando o novo testamento se refere à primos ele usa a palavra \"primo\" mesmo!Lc 1:36.\n\n     * Como diz as Escrituras, Maria realmente teve concepção virgem de Jesus porque era obra do\nEspírito Santo. Os demais filhos foram legítimos de Maria e José. Mt 1:25; 13:55.\n\n     10. MARIA NÃO É A MÃE DE DEUS\n\n    A intenção diabólica de perverter os Cristãos através do paganismo, não teve limites. A igreja\nromana proclamou que Maria é a \"Mãe de Deus\" no ano 431 d.C.\n\n                                                                                      Igreja de Vencedores\n\n       Mais tarde em 609 d.C. Um ano após o início do papado, foi estabelecido por lei na igreja que\n   Maria teria que ser cultuada e a invocação de mortos santos seria plenamente aceitos.\n\n        Não é necessário dizer que daí para frente, o nome Cristianismo tornou-se apenas um título e na\n   verdade o nome da igreja romana deveria ser: \"Igreja Católica Mariana Romana pagã\" , pois na\n   verdade ela era universal (aberta a todos os credos); dava e dá mais ênfase à Maria; o seu principado e\n   governo está em Roma e tem hoje mais doutrinas e costumes pagãos do que Cristãos.\n\n        O início do culto das imagens veio mais tarde por volta do ano 780 d.C.\n\n        A Bíblia é clara e farta em ensinar que Deus não tem princípio e nem fim, por tanto não tem Mãe,\n   muito menos humana. Sl 90:2; Gn.1:1- Se Maria é a Mãe de Deus porque este Deus não criou o\n   homem à imagem de Maria, mais criou à sua imagem? Gn. 1:26\n\n       Maria não é culpada pelos desmandos e desvios da Igreja Católica, pois foi fiel e crente no\n   propósito de Deus. Ela nos deixou um conselho: \"Fazei tudo que ele (Jesus) vos disser. Jo. 2:5.\n\n       11. O PURGATÓRIO\n\n       A doutrina do purgatório começou a ser ensinada no ano 593 d.C. – O Purgatório quer dizer:\n   lugar de purificação das almas dos justos antes de serem admitidas no Paraíso.\n\n       Foi introduzido pelo Papa Gregório I. Apesar de não constar até então na doutrina romanista, era\n   um pensamento já crido pelo povo. \"Dizia o seguinte: \" Entre o Céu e o Inferno há um fogo purificador\n   para onde eram enviadas as almas daqueles que não eram tão maus para merecerem o inferno, porém\n   não eram tão bons para merecerem o Céu. O fogo então fazia a alma capaz de encontrar-se com Deus.\"\n\n       A Igreja Romana utiliza alguns textos bíblicos para fundamentar a sua falsa doutrina:\n\n      1.\"Digo-te que não saíras dali enquanto não pagares o derradeiro centavo.\"Lc.12:59.\n\n        2. \"...Se a obra de alguém queimar sofrerá ele dano; mas esse mesmo será salvo, todavia, como que\natravés do fogo\".I Co.3:15.\n\n       Outros textos são, também mencionados como Mt.12:32 e 36. (Estes nitidamente sem nexo).\n\n       O primeiro verso(Lc.12:59), fala a respeito de contenda e tratamento jurídico e civil da época.\n\n         O segundo (I Co.3:15), fala a respeito do julgamento de Cristo em seu tribunal com a Igreja e\n   não da morte de cada Cristão. Trata das obras de cada cristão feitas no corpo para recompensá-lo e não\n   para purificá-lo, pois somente irão ao tribunal de Cristo aqueles que já tiverem sido purificados e\n   salvos através do Sangue de Jesus. II Co.5:12;Rm 5:8-11;Ap. 1:5.\n\n\n12. OS LIVROS APÓCRIFOS\n\n     O QUE SÃO OS LIVROS APÓCRIFOS?\n\n      A palavra apócrifa, segundo o dicionário da língua portuguesa, quer dizer: \"Sem\nautenticidade, ou cuja autenticidade não esta aprovada\" – Literalmente significa \"Oculto\".\n\n       O termo Cânon é derivado da palavra grega Kânon, que quer dizer \"vara reta, beira reta, régua\".\nEm literatura, cânone veio significar aquelas obras escritas que se conformam com a regra ou\npadrão de inspiração a autoridade divina. Nas escrituras hebraicas há trinta e nove livros que os\njudeus aceitam como canônicos. Os mesmos que foram aceitos pela Igreja apostólica, e pelas Igrejas\nProtestantes desde os dias da reforma. A estes a Igreja Romana adiciona 14 escritos (livros ou\nporções de livros), que são Apócrifos, e os considera como tendo igual autoridade aos demais.\n\n       Vê-se que, Canônico e Apócrifo são antônimos. A primeira diz respeito ao conjunto de livros\ninspirados e aceitos da Bíblia e, a Segunda, diz respeito ao conjunto ou porções da Bíblia incluídas no\nCânon da Bíblia Católica no ano 1573 d.C. - A Igreja Católica somente estabeleceu a canonicidade\ndos livros apócrifos, porque os Protestantes da Reforma adotaram o \"o Cânon hebraico Palestiniano\ndo antigo testamento\" que nunca constou os livros Apócrifos.\n\n        O Cânon Palestiniano é o mais antigo e conta com a aprovação e uso dos eruditos\nhebraicos. – No Cânon é perceptível a inspiração divina além de ser aprovado pela Igreja\nApostólica. - Então, a Igreja Protestante não tirou livros da Bíblia; a Igreja Católica que acrescentou\n7 livros e mais algumas porções no Antigo Testamento da Bíblia.\n\n      13. QUAIS SÃO OS LIVROS E TEXTOS APÓCRIFOS?\n\n       Livros completos:                        Complementos aos livros:\n       1) Tobias                                7) 2º livro dos Macabeus\n       2) Judite                                8) Acréscimo ao livro de Ester\n       3) Sabedoria de Salomão                  9) Cântico dos três santos filhos-\n       4) Eclesiástico                          Acréscimos no livro de Daniel.\n       5) Baruque                               10) História de Suzana – Acréscimo\n       6) 1º livro dos Macabeus                 no livro de Daniel\n                                                11) Bel e o Dragão – Acréscimo no\n                                                livro de Daniel\n\n    12) 1 Esdras (Não reconhecido no Concílio de Trento-1545 à 1563 d.C.)\n\n    13) 2 Esdras (Não reconhecido no Concílio de Trento – 1545 à 1563)\n\n    14) A Oração de Manasses (Não reconhecido no Concílio de Trento – 1545 à 1563 d.C.)\n\n                                                                                    Igreja de Vencedores\n\n   14. PORQUE OS LIVROS ACIMA SÃO APÓCRIFOS E NÃO CANÔNICOS?\n\n   1) Eles nunca fizeram parte do Cânon hebraico e nem foram citados no Antigo Testamento;\n\n   2) José foi, o historiador judeu, não cita nenhum dos livros apócrifos em seus escritos;\n\n   3) Nenhum cita ter orientação de Deus para ser escrito e não reclama inspiração divina;\n\n   4) Contém históricos,geográficos e cronológicos;\n\n   5) Ensinam e apóiam ensinos contrários ao Ensino geral da escrituras;\n\n   6) A literatura desses livros contém misturas de fábulas e lendas de outros povos;\n\n   7) Jesus e os Apóstolos jamais os citaram em seus ensinos;\n\n    8) Dos mais famosos Pais da Igreja Primitiva, nenhum deles jamais se reportaram a eles como\nfonte inspiradora de seus ensinos;\n\n   9) Eles foram escritos e aceitos muito tempo após encerrado o Cânon do Antigo Testamento.\n\n      HERESIAS – ISLAMISMO\n\n      Uma religião mundial que se originou no oriente Médio, fundada em cerca de 600 d.C. por\n   Maomé, seu principal profeta. O que se observa facilmente é que o Islamismo é uma religião que\n   mistura tradições árabes, judaísmo, superstições e até traços do cristianismo atrasado.\n\n       O islamismo reivindica suas origens desde os patriarcas hebreus, especialmente Abraão.\nSegundo os islamitas, Ismael era o verdadeiro filho da promessa e não Isaac, portanto, os árabes e não\nos judeus são o verdadeiro povo de Deus e, consequentemente, os donos da Terra Santa.\n\n      A base da religião é o livro sagrado do Alcorão, que supostamente foi revelado por Deus a\nMaomé. Segundo o Islamismo, o Alcorão é o único livro que apresenta os verdadeiros ensinamentos de\nDeus (Alá), do seu profeta maior, Maomé, e de Jesus Cristo, um dos profetas de Alá.\n\n       Todas áreas da vida de um mulçumano são dominados por sua religião. Não se separa a vida\nreligiosa da vida social, política, militar ou econômica.\n\n       O Islamismo, por ser legalista, ritualista, militante, intensamente zeloso e \"evangelístico\",\nrepresenta um dos maiores perigos à fé cristã. Os Cristãos muitas vezes são perseguidos e assassinados\nnos países mulçumanos, especialmente nos mais radicais.\n\n      É a religião que mais cresce mundialmente.\n\n       Alá significa \"Deus\". Islamismo significa \"submissão à vontade de Alá\". Mulçumano é aquele\nque se submete a Alá.\n\n      Crenças Básicas:\n\nAlá é o único Deus verdadeiro e o ser supremo. Ele não pode ser conhecido pessoalmente pelo\nser humano. Tanto o bem quanto o mal procede de Alá. Ele se caracteriza mais pela justiça e castigo do\nque por sua misericórdia e graça. Não existe trindade no islamismo e Jesus foi apenas um homem\nsanto, não Deus.\n\n      O Islamismo concentra-se em ensinar sobre a punição por desobedecer aos ensinamentos de\nAlá. A adesão ao islamismo é freqüentemente motivada pelo temor mais do que por fé na suposta\nverdade do Alcorão.\n\n       Embora seja repleto de passagens bíblicas, especialmente do Antigo Testamento, o Alcorão é\nconsiderado o único e verdadeiro livro que revela os verdadeiros ensinamentos de Alá. Segundo o\nislamismo, a Bíblia foi distorcida pelos judeus e cristãos, de modo que o Alcorão permanece como a\núnica revelação verdadeira.\n\n       Jesus Cristo é considerado apenas um homem comum que foi um dos profetas de Alá. O\nIslamismo ignora ou zomba dos milagres de Jesus, da sua morte e especialmente da sua ressurreição.\n\n      Para ao islamismo, o homem não possui natureza pecaminosa básica, mas apenas comete\npecado, na medida em que ele desobedece às leis de Alá, escritas no Alcorão. Salvação não tem nada a\nver com perdão de pecados, mas sim com obediência cega às leis do Alcorão. O céu é para aqueles que\nobedecem a Alá, e eles viverão num paraíso repleto de satisfação sexual.\n\n        Práticas Básicas:\n\n         O Islamismo é regido pelos Cincos Artigos de Fé:\n\n        Alá é o único verdadeiro Deus.\n        Os anjos são mensageiros e o Espírito Santo é um anjo.\n        O Alcorão é a escritura Suprema.\n        Maomé é o último e o maior dos profetas do islamismo.\n        O dia do juízo final virá quando aqueles que obedeceram a Alá irão para o paraíso e aqueles que\n         não o obedeceram irão para o inferno.\n\nOs cincos pilares da fé mulçumana são:\n\n         Recitar o credo islâmico\n         Recitar orações e louvores a Alá cinco vezes ao dia, voltados para Meca, na Arábia Saudita.\n         Dar esmolas aos pobres.\n         Jejuar um mês durante o ano.\n         Fazer pelo menos uma peregrinação à Meca durante a vida inteira.\n\n         O casamento e a família são partes importantes da vida islâmica, mas eles permitem a poligamia\n         e o divórcio. As mulheres possuem poucos direitos ou quase nenhum (dependendo do país).\n\n       Os mulçumanos incentivam a \"Jirad\" (guerra santa) para defender territórios islâmicos, fazer\nprosélitos ou combater outras religiões.\n\n                                                                                     Igreja de Vencedores\n\n       Existem três seitas dentro do islamismo: Os Xiitas, que misturam religião e política de forma\nveemente e explosiva; os Sunitas, que separam a religião da política e seguem o costume de Maomé;\nos Sufi, que se concentram no ascetismo e na abnegação.\n\n      Escritos e Observâncias:\n\n       O Alcorão é o mais reverenciado livro do islamismo e funciona como a Bíblia deveria funcionar\npara os cristãos. No entanto, há outros livros que explicam a fé mulçumana, embora estejam cheios de\nerros.\n\n       As principais observâncias do mulçumano são: esmolas, jejuns, orações e peregrinações. O\nislamismo é uma religião ritualística, portanto, tudo é observado segundo regras estreitas.\n\n       HERESIAS – HINDUISMO\n\n     É uma religião de origem oriental e que se iniciou entre 1200-600 a.C. na Índia. O hinduísmo é\n   uma religião complexa, politeísta, sincrética e mística.\n\n      O objetivo principal da religião é tornar-se um com a realidade final do universo por meio de\numa série de reencarnações.\n\n      Crenças Básicas:\n\n       Por ser politeísta, o hinduísmo crê em vários deuses. No entanto, há um ser supremo e eterno\nchamado Brama, que é três deuses em um. Esse Deus não é um ser pessoal, mas apenas uma força\nespiritual da qual tudo e todos fazem parte. Portanto, é possível ser politeísta, panteísta, ateu e ao\nmesmo tempo ser hinduísta.\n\n      Os hindus reconhecem a Jesus Cristo como um grande profeta, um Deus entre muitos deuses,\nmas não o filho de Deus, o Unigênito do Pai. Jesus Cristo não é visto como Salvador, Redentor ou\nMessias.\n\n       Não existe pecado, no sentido cristão, no hinduísmo. Portanto, também não há necessidade de\nsalvação. \"Ser Salvo\" no hinduísmo é atingir a unidade mística com Brama, se tornar um com ele,\natravés de uma série de reencarnações.\n\n       Se uma pessoa for boa ou má durante sua última existência determinará se ela será um animal\nou ser humano na próxima reencarnação, ou seja , se ela possuíra uma vida mais ou menos elevada. Na\nmedida em que o hindu se desenvolve moralmente através de sucessivas reencarnações, ele se tornará\napto para atingir o Nirvana, o estado de gozo e identificação com o Brama, encerrando assim o ciclo\nde reencarnações. É preciso melhorar o caráter em cada reencarnação para obter esta \" salvação\neterna\".\n\n      Práticas Básicas:\n\nHá muitas práticas e rituais no hinduísmo, de modo que não podemos precisar quais são todas\nelas. No entanto, nós podemos identificar algumas características destas práticas. As práticas religiosas\nhinduístas são caracterizadas por:\n\n     Rituais\n     Cânticos monótonos ou mantras\n     Meditação\n     Adoração da vaca sagrada como fonte de vida\n     Negação dos prazeres e possessões\n     Reconhecimento de um rígido sistema de castas que primordialmente coloca uma pessoa em\n      dado nível, na ordem social, nesta vida em particular. Esse sistema de casta possui 4 níveis:\n   1. Homens santos\n   2. Governantes e guerreiros\n   3. Fazendeiros e mercadores\n   4. Trabalhadores comuns e servos\n\n        Escritos e Observâncias\n\n       O Bhagavad-Gitá é o principal livro do hinduísmo, mas há milhares de outros escritos que\nprescrevem a crença, o comportamento e os rituais hindus.\n\n       As observâncias são tantas que nem é bom começar a citá-las!\n\n       HERESIAS – MORMONISMO\n\n       É conhecida como Igreja de Jesus Cristo dos Santos dos Últimos Dias. Seu fundador foi Joseph\nSmith. Tal senhor afirma ter recebido o \"livro de Mórmon\" da parte de Deus, por meio de um anjo, e\nque este livro contém os verdadeiros ensinamentos de Deus ao homem. Os mórmons se consideram a\núnica e verdadeira Igreja – como muitas outras seitas!\n\n       O mormonismo atrai muita gente por causa do alto e rigoroso valor que eles dão a uma vida\nmoral reta e piedosa, sua forte ênfase nos valores familiares e também por causa de suas falsas\npromessas de perdão e salvação baseados em ensinamentos errados.\n\n       Crenças Básicas:\n\n       Os mórmons crêem que Deus é um ser de carne e osso, um homem como nós que atingiu a\ndivindade. Portanto segundo eles, nós também podemos alcançar a divindade! Eles não crêem na\ntrindade, mas sim em três deuses distintos: Pai, Filho e Espírito Santo.\n\n       Entre os diversos ensinamentos errados sobre Deus, destacam-se as seguintes aberrações:\n\n    Deus possui diversas esposas eternas; Eva foi uma delas.\n    Deus, o Pai, teve relação sexual com Maria, da qual nasceu Jesus.\n\n                                                                                     Igreja de Vencedores\n\n    Deus esta sempre se desenvolvendo.\n    Há muitos deuses, mas o Pai é o maior deles.\n    Deus não é Onipresente.\n\n       Os Mórmons crêem que Deus já foi como é o homem, e que o homem será como hoje é Deus.\n\n       Para os Mórmons, a Bíblia só é inspirada e útil quando ela é corretamente traduzida e\ninterpretada. O livro de Mórmons é um livro mais perfeito que a Bíblia. Outros livros mómons também\nsão inspirados e importantes, considerados como \"palavra de Deus\".\n\n       Segundo os mórmons, Jesus Cristo:\n\n      Não é o filho de Deus.\n      Não é completamente Deus e nem homem.\n      É o primeiro filho espiritual de Deus que nasceu pela relação sexual de Deus com Maria.\n      É o maior que todos os outros filhos de Deus, mas é apenas um homem especial que atingiu a\n       divindade por meio do seu nascimento especial, obediência e devoção.\n\n     Para os Mórmons, todos os homens serão finalmente salvos. Não há inferno ou punição eterna.\nTodos serão salvos, embora os níveis de salvação e divinação sejam diferentes. Para ser salva segundo\no mormonismo, a pessoa deve:\n\n      Crer em Cristo\n      Ser batizado por imersão na Igreja Mórmon.\n      Receber a imposição de mãos para a recepção do Espírito Santo.\n      Obedecer às leis e ordenanças do mormonismo.\n\n       Vida eterna, segundo o mormonismo, é o poder para atingir a divindade e de ter filhos no céu\npor toda eternidade.\n\n       Práticas Básicas:\n\n       As principais práticas dos mórmons são:\n\n    Batismo pelos mortos, ou seja, se um ente querido seu morreu, você pode ser batizado no lugar\n     dele, para tirá-lo do inferno.\n    A poligamia, ainda que de forma enrustida, por ser proibida na maioria dos países.\n    Procriação eterna e celestial pelo casamento.\n\n       Escritos e Observâncias:\n\n      O livro de Mórmon é a principal fonte de autoridade escrita do mormonismo. Outros livros\nimportantes são: Doutrinas e Pactos, e a Pérola de Grande Valor.\n\n       As principais observâncias são o batismo pelos mortos e o casamento como meio de procriação\neterna e celestial.\n\nHERESIAS - TESTEMUNHAS DE JEOVÁ\n\n        As testemunhas de Jeová, ou Russelitas, são uma das seitas que mais crescem no Brasil. Tem\nsua forma de trabalho com muita \"consolidação\" e treinamento de seus adeptos. Seu fundador Charles\nTraze Russel, que nasceu em 1854 no estado da Pensilvânia USA, e faleceu no dia 09/11/1916, sendo\nsubstituído pelo juiz Joseph Franklin Rutherford.\n\n       Russell, tem sua origem de fé na Igreja Presbiteriana escocesa e irlandesa. As doutrinas das\npenas eternas (inferno – 2º morte) o assustava e perturbava. Tornou-se convertido ao Adventismo do\nSétimo dia de onde recebeu a maioria de suas doutrinas heréticas e judaizantes. – Em 1878, eles\nse separaram. – Depois que a amizade terminou, Russell, lançou no ano de 1879 seus escritos: \"Torre\nde Vigia de Sião e Arauto da presença de Cristo\".\n\n      1. A VIDA DE CHARLES T. RUSSELL\n\n        Russell vivia em freqüentes choques com as autoridades e tribunais, dos quais nem sempre se\nsaía bem. Censurou as igrejas e a seus líderes como porta vozes do engano e como instrumentos do\ndiabo chegou a escrever uma obra intitulada \"Estudos nas Escrituras\", sobre a qual o próprio Russell\ndeclarou ousadamente que seria melhor que ela fosse lida do que lida a Bíblia sozinha. Contudo, mais\ntarde, ele mesmo chamou de imaturos alguns de seus escritos.\n\n       2. O SUCESSOR: JOSEPH FRANKLIN RUTHERFORD\n\n       Rutherford, que era advogado e juiz especial na ausência do juiz regular do Tribunal do 8º\nCircuito Judicial de Booenville, Missouri USA, até 1909. Foi escolhido por unanimidade para suceder\no pastor Russell como presidente da Sociedade Torre de Vigia; editando Bíblias e tratados. Ocupou\nessa posição até a sua morte em 08/01/1942 com idade de 72 anos.\n\n       Rutherford com alguns de seus funcionários, passaram nove meses na cadeia por alegadas\n\"atividades não americanas\" no início da entrada dos USA na 1º guerra mundial.\n\n      Ao sair da penitenciária, o juiz encontrou a sua presidência embaraçada por dissensões interna e\nperseguições externas. Verificaram-se vários rompimentos continuando os dissidentes sob vários\nnomes. Por causa dessas dissensões, em 1931 no Congresso anual em Columbus, Ohio, foi adotado o\nnome atual de Testemunhas de Jeová. A partir essa organização tem crescido de forma vigorosa.\n\n       3. AS OBRAS MAIS CONHECIDAS E PUBLICADAS\n\n       Uma das grandes vantagens dessa seita é que conta com um grande parque gráfico em Nova\nYork USA e publica tudo de forma atraente. Dentre as suas principais publicações encontra-se: O livro:\nSeja seu nome santificado – 1º Edição, 1961 com 1 milhão de exemplares;\nA Bíblia \"Tradução do Novo Mundo das Sagradas Escrituras\"- Primeira publicação em 1955.\nRevistas quinzenais: A Torre de Vigia (tiragem atual de mais de 5º milhões de exemplares).\nDespertai (tiragem atual de mais de 5º milhões de exemplares).\n\n                                                                                   Igreja de Vencedores\n\n      4. SISTEMA DE CORREÇÃO PSICOLÓGICA\n\n       As Testemunhas de Jeová, demonstram um zelo incomum ao tornar conhecidas as suas\ndoutrinas, pelo que se dedicam ao máximo a venda de livros e revistas, de porta em porta. Além de\ndedicarem-se com afinco a esse trabalho, quase todos dão uma parcela de cooperação na disseminação\ndas doutrinas da seita. W.J. Schenell, \"ex-testemunha\", diz que as testemunhas ficam sob constante\npressão e com medo de seus líderes. Por exemplo: Se não venderem suficiente literatura, serão\nrebaixados à \"classe de servos maus\" ou \"servos inúteis\".\n\n       5. ATAQUES AS DOUTRINAS CRISTÃS\n\n      As TJs, usam a maior parte de seus esforços para alcançar pessoas recém convertidas de\nIgrejas Evangélicas, cujas mentes (sem consolidação) ainda não tem formação doutrinária de base.\nVocê que é líder de Célula ou geração já deve orientar para que os novos convertidos sequer\nrecebam visitas das \"Testemunhas de Jeová\" enquanto os mesmos não forem consolidados e se\nmatricularem na Escola Bíblica Dominical.\n\n        6. A DOUTRINA DA TRINDADE E AS TJs\n\n       As TJs querem de forma banal e leviana afirmar que não há base na Bíblia para dizer que o\nnosso Deus subsiste em três pessoas, mas apenas em um, que é Jeová.\n       A palavra Jeová, como querem que seja o nome de Deus, foi um nome que foi adotado por\ncomposição do tetragrama: YHWH, que ficou sem pronúncia por causa do cuidado que os judeus\ntiveram com o nome de Deus.- Com a nação enfraquecida pelos exílios e os empréstimos de línguas\ne dialetos dos povos vizinhos a nação judaica, outros nomes foram usados em substituição, tais\ncomo: Adonai, Yawhé, e os TJs, usando uma incorreta versão, usam o nome de Deus como:\"Jeová\",\nsendo que esta palavra tem uma tradução primária de :\"Senhor\". Será que podemos perguntar se: A\nexpressão \"Testemunha de Jeová\" existe na Bíblia? Não, essa expressão não existe!Então, os\ninventores não são Cristãos!\n       Devemos ter em mente que descobrir uma verdade não é a mesma coisa que inventar a\nverdade. A verdade não se inventa, se descobre.\n\n      7. A TRINDADE NA BÍLBLIA\n\n      A Bíblia mostra a Trindade, ou seja, as três pessoas: Pai, Filho e o Espírito Santo em várias\npassagens juntas, vejam:\n\n   1) Na criação do homem, o verbo(nós) está na primeira pessoa do plural. Gn. 1:6;\n\n      1) Na conclusão divina quanto a capacidade do conhecimento do homem a respeito do bem e do\nmal, o pronome é da primeira pessoa do plural. Gn 3:22;\n\n      2) Na confusão de línguas em Babel, o verbo (nós) também está no plural. Gn.11:7;\n\n3) Na visão e chamado de Isaías. O pronome para Deus está na primeira pessoa do plural.\nIs.6:8;\n\n      4) No batismo de Jesus. O Filho em Jesus, o Espírito em forma de Pomba e a voz do Pai. Mt\n3:16-17;\n\n          5) Na grande comissão da Igreja. O batismo deveria ser em nome das três Pessoas.           Mt\n28:19;\n\n          6) Na distribuição dos Dons Espirituais. Espírito, Senhor e Deus. 1 Co.12:4-6.\n\n      As testemunhas de Jeová, Além de não aceitarem os textos acima para se converterem, ainda\nnão perceberam os títulos divinos que são aplicados a cada uma dessas pessoas da Trindade.\n\n          * A respeito do Pai – Êxodo 20:2;\n\n          * A respeito do Filho – Jo 1:1;20:28;\n\n          * A respeito do Espírito Santo – At.5:3-4.\n\n          8. ATAQUES DAS TJs A CRISTO\n\n       Russel depois que se afastou do Adventismo, passou a atacar a Divindade de Cristo e do\nEspírito Santo, afirmando que apenas o Pai é Deus, e tem o nome de Jeová. Como já ficou provado o\ncontrário pelas referências citadas no tópico anterior a respeito de cada pessoa do Ser de Deus, apenas\ncolocaremos aqui as afirmações acerca de Cristo e a refutação bíblica necessária:\n\n       Para os TJs Cristo não é Deus, não é todo poderoso, foi criado pelo Pai e não é o autor da\ncriação vejamos alguns textos e afirmações bíblicas em contrário:\n\n       1)     Jesus Cristo é Deus e sempre O foi – Jo. 1:1; Cl.1:15e 2:9\n       2)     Jesus Cristo é Todo Poderoso – Mt 28:18;Ap.1:8,Etc...\n       3)     Cristo não foi criado, pois é eterno – Jo.8:58;1:18;6:57...\n       4)     Cristo é o autor da criação – Jo.1:3;Cl.1:16\n       Além de todos estes atributos, o nome de Cristo é adorado e obedecido tanto por anjos, como\npor demônios e enfermidades. 1Tm.3:16, Lc.10:17; Mc.16:18. – E, no dia marcado por Deus, todo o\njoelho se dobrará e toda língua confessará que Jesus Cristo é o Senhor. Fl.2:10-11. Por estas razões e\noutras mais é que afirmamos: Se Cristo não é Deus, então ninguém é mais.\n       A Bíblia ensina que somente devemos nos prostrar diante de Deus. Ex.20:45. O mesmo Deus\ninspirou Paulo a escrever que todo joelho se dobrará diante de Jesus; então: Ele é Deus!!!\n\n          9. A ATRAPALHADA ESCATÓLOGICA\n\n          A VOLTA DE CRISTO E O ESTABELECIMENTO DE SEU REINO\n\n                                                                                     Igreja de Vencedores\n\n       \"Cristo veio, não em forma humana, mas como criatura espiritual e gloriosa... ele vem,\nportanto, desta vez, não humilhação, não na semelhança dos homens, mas em sua glória, e todos os\nanjos com ele\".\n\n      Refutação: A Bíblia afirma que Cristo voltará visivelmente, todo olho o verá Mt 24:30.\n\n      Ele virá com o mesmo corpo ressurreto e será reconhecido. Zc12:10.\n\n      As TJ, fizeram previsão de que Cristo voltaria à terra em 1914.Como a previsão não se\ncumpriu; começaram a pregar que Cristo já voltou à terra invisivelmente em 1914, quando a batalha\ndo Armagedon terminou e o governo de Cristo começou a reinar.\n\n      Refutação: a bíblia diz que o dia e a hora ninguém sabe, nem os anjos do céu sabem, mas\nsomente Deus. Mt 24:36 – A sua pretensão deixou clara a sua falsidade, que após ver sua previsão de\npaz mundial com a volta de Cristo se tornar na 1ª Guerra Mundial, mudou a previsão para um caráter\nmaterial ou visível.\n\n      O JUÍZO FINAL\n\n      No escrito: \"Seja Deus verdadeiro\" às páginas 248, lê-se \"... na primavera de 1918, veio o\nSenhor e começou o juízo primeiro da \"Casa de Deus\" e depois das nações deste mundo\".\n\n       Refutação: A Bíblia afirma que o julgamento final, será visível cabal e notório a todos os seres\nviventes, mesmo se estiverem mortos. Ap. 20:11:15.\n\n       Se o juízo já aconteceu, então também já aconteceu o arrebatamento da Igreja; O Tribunal de\nCristo; A grande Tribulação; A Batalha do Armagedon; A manifestação de Cristo em Glória com os\nseus Santos e os Anjos; O Julgamento da Nações; A Prisão de Satanás por 1000 anos; O Reino\nMilenar; A soltura de Satanás; A Guerra de Gogue e Magogue; A segunda Ressurreição. Mas, como\nnão aconteceu nada disso ainda, Russell é um falso profeta e enganador.\n\n       10. A TRAPALHADA DOUTRINÁRIA\n\n             Existe uma desordem e negações ao longo dos anos das Testemunhas de Jeová, que\ntrataremos aqui de apenas algumas, tais como;\n\n             1.     A Alma do Homem; 2. O Inferno; 3.O Total final da Igreja Celeste em 144 mil;\n             2.     Proibição em doar sangue.\n\n      A Alma do Homem\n\n              No livro: Seja Deus verdadeiro, aparecem as seguintes afirmações: \"Os cientistas e\ncirurgiões não foram capazes de encontrar no homem nenhuma prova determinante de imortalidade.\nNão podem encontrar nenhuma evidência indicativa de que o homem possui uma alma imortal... Assim\nvemos que a pretensão de que o homem possui uma alma imortal, e que, portanto, difere das bestas,\nnão é bíblico\".\n\nRefutação: Estas afirmações têm como pano de fundo de que os TJs ensinam que a alma\né o sangue do homem. – A palavra nephesh (alma) que sempre trás a idéia de \"Vida\" tem significado\nvariado na Bíblia.\n\n                 1.   Pode significar vida – Lv 17:11-14    2. Alma como pessoa em si mesma – Gn\n46:22\n\n       3.Como o Espírito e Coração – Dt. 2:30 4. Elemento que constitui o homem –                    Hb\n4:12; 1 Ts 5:23:\n\n       Afirmam os TJs: \"A Alma é o sangue\"(Lv 17:11,14). Nesta passagem a palavra alma tem\nsignificado claro de \"Vida\", ou seja, tirou todo o sangue da carne tira-se a vida dela.\n\n       Refutação: A partir desta idéia é que as TJs não permitem a doação de sangue. – Todos sabem\nque o sangue é um órgão do ser humano, incapaz por si só de gerar vida. Apenas Deus pode dar vida. –\nA afirmação, embora tenha um \"fundo bíblico\" é de uma infantilidade mortal. É notório que uma\npessoa ou animal pode morrer sem derramar uma gota de sangue.\n\n      Concluindo, a alma como elemento constitucional do homem (corpo, alma e espírito). É um\nelemento eterno no homem que estarão na eternidade, em glória, ou no desprezo eterno. Dn 12:2.\n\n           O Inferno\n\n          As TJs afirmam que as palavras traduzidas por \"Inferno\" tem o significado de \"sepultura\" e,\nesta afirmação é, num mínimo mentirosa, pois as palavras: Hebraicas e Gregas traduzidas para\nInferno, nunca poderiam ser traduzidas por \"sepultura\".\n\n           Refutação: A palavra \"Inferno\" na Bíblia tem significado que variam de acordo com o texto\nque é citado. Há 4 palavras na edição revista e atualizada, que são traduzidas por inferno:\n\n           1) Sheol – O mundo dos Mortos. Dt:32:22;Sl 9:17\n\n          2) Hades – É a forma Grega do Hebraico\"Sheol\", e significa o lugar das almas que partiram\n   deste mundo. Mt 11:23;Lc:10:15; Ap 6:8;\n\n           3) Gehena – Termo usado para designar um lugar de suplício eterno. Mt 5:22,29,30;         Lc\n   12:5;\n\n           4) Tártaro - O mais profundo abismo, e significa encerrar no suplício eterno. 2 Pe. 2:4\n\n          Nenhuma das palavras acima significa \"sepultura \" a palavra Hebraica para\n   \"sepultura\" é \"Queber\". Gn 50:5 e a palavra Grega é \"memeion\". – A \"Sheol\", algumas vezes\n   foi traduzida por \"sepulcro\" ou \"sepultura\" em nossas bíblias em português, mas isso foi\n   unicamente por erro .\n\n         No livro: Seja Deus Verdadeiro: \"A doutrina do Inferno ardente onde os iníquos depois da\n   morte são torturados para sempre, não pode ser verdadeira, principalmente por 4 razões:\n\n                                                                                    Igreja de Vencedores\n\n            1)    Porque está inteiramente fora das Escrituras;\n            2)    Porque é irracional;\n            3)    Porque é contrária ao amor de Deus;\n            4)    Porque é repugnante à justiça.\n\n        Refutação: respondamos com textos bíblicos a cada uma dessas afirmações diabólicas:\n\n        1)A doutrina de uma punição eterna é largamente ensinada na Bíblia Dt 32:22; Sl\n  9:17;Pv5:55; Dt 12:2; Os 13:14; Mt 5:29-30;9:47;10:28; Lc 16:23; 2 Pe 2:4; Ap 6:8; 20:14, etc...\n\n        2) A Doutrina da condenação é absolutamente racional, Rm 3:4;8:19;\n\n       3) A condenação do Inferno não é um caminho seguido por aqueles que atendem o\n  amor de Deus, Jo 3:16; Dt 30:19; Ap 20:11-15.\n\n        4) Todo condenado diz foi injustiçado, Is 30:18; Rm 6:23.\n\n        11. O TOTAL FINAL DA IGREJA CELESTE EM 144 MIL\n\n         Com o início a seita, foi inventada a história que o número de 144 mil testemunha de Jeová\n  iriam para o Céu. O grande problema é que esse número foi ultrapassado antes do ano de 1960 e\n  depois disso arrumaram texto para colocar o resto das testemunhas de Jeová na terra, no Paraíso.\n\n        Os textos mais usados para estas doutrinas são os seguintes: Ap 7:2-8;Is 35;65:13-25.\n\n          Refutação: 144 mil TJs – O primeiro texto de Ap 7:2-8, é claro pelo nome das tribos, que é\n  um ato de Deus em preservar Israel em meio a Grande Tribulação, cumprido sua promessa feita a\n  Israel . Is 65:8;Jr 5:18; Rm 9:27. Estes 144 mil serão preservados na terra não no Céu. O texto de\n  Ap. é bem claro nisso e dos textos da promessa de Deus também. - O número dos salvos no céu\n  será incontável.\n\nDISCIPULADO\n\n      1. \"Mas o Espírito expressamente diz que em tempos posteriores alguns apostatarão da fé, dando\nouvidos a espíritos enganadores, e a doutrinas de demônios, pela hipocrisia de homens que falam\nmentiras e têm a sua própria consciência cauterizada, proibindo o casamento, e ordenando a\nabstinência de alimentos que Deus criou para serem recebidos com ações de graças pelos que são\nfiéis e que conhecem bem a verdade...\" (1 Timóteo 4.1-3)\n\n   2. \"Sede sóbrios, vigiai. O vosso adversário, o Diabo, anda em derredor, rugindo como leão, e\nprocurando a quem possa tragar\". (I Pedro 5.8)\n\n    3. \"Conjuro-te diante de Deus e de Cristo Jesus, que há de julgar os vivos e os mortos, pela sua\nvinda e pelo seu reino; prega a palavra, insta a tempo e fora de tempo, admoesta, repreende, exorta,\ncom toda longanimidade e ensino. Porque virá tempo em que não suportarão a sã doutrina; mas,\ntendo grande desejo de ouvir coisas agradáveis, ajuntarão para si mestres segundo os seus próprios\ndesejos, e não só desviarão os ouvidos da verdade, mas se voltarão às fábulas. Tu, porém, sê sóbrio\nem tudo, sofre as aflições, faze a obra de um evangelista, cumpre o teu ministério\". (II Timóteo 4. 1-\n5)\n\n   4. Faça a obra de Deus, abra o Maximo de células que puder, o Maximo de geração que conseguir, o\nMaximo de congregações que alcançar, pois \"sê sóbrio em tudo, sofre as aflições, faze a obra de um\nevangelista, cumpre o teu ministério\" Abrir células... Abrir Gerações... Abrir Base... e etc.\n\n                                                                                   Igreja de Vencedores\n\nVERIFIQUE O QUE VOCÊ APRENDEU\n\n1. Defina o catolicismo.\n\n______________________________________________________________________________\n\n2. Defina o islamismo.\n\n______________________________________________________________________________\n\n3. Defina o hinduísmo.\n\n______________________________________________________________________________\n\n4. Defina as testemunhas de Jeová.\n\n______________________________________________________________________________\n\n5.Defina o mormonismo.\n\n... Vi a Deus face a face, e a minha vida foi salva.\n                  Gênesis 32.30\n                                                 Igreja de Vencedores\n270", "quiz": [{"q": "Qual é o texto bíblico-base da lição \"RELIGIÕES, SEITAS E HERESIAS\"?", "options": ["2 Tm 4.7", "1 João 4.1", "2 Timóteo 4.7", "João 15.15"], "answer": 1}, {"q": "Qual destes é um dos tópicos estudados na lição \"RELIGIÕES, SEITAS E HERESIAS\"?", "options": ["Concentre-Se Em Quem Deus É — Sua Natureza Imutável", "Cristo, Em Toda A Bíblia, É A Pedra-Rocha Grande E Firme:", "A Parte De Deus E A Sua Parte", "Transmita Aos Outros Aquilo Que Você Sabe"], "answer": 1}, {"q": "Qual destes tópicos NÃO faz parte da lição \"RELIGIÕES, SEITAS E HERESIAS\"?", "options": ["Mariolatria", "A Vida De Charles T. Russell", "Tipos De Gafanhotos (Joel 1.4)", "Seria Pedro O Fundador Da Igreja?"], "answer": 2}]}, {"num": 37, "title": "PENIEL", "verseRef": "Gênesis 32:30; II Samuel 12", "content": "INTRODUÇÃO\n\n       Peniel é um lugar de encontro com Deus (Gn 32:30).\n\n          - Lugar de sentir profunda dor pelos pecados.\n          - Lugar de confronto consigo mesmo e com Deus. Em Peniel Deus mostrará quem você é.\n          - Lugar de luta, de arrependimento, de guerra, de choro, de pranto. Em Peniel você irá\n   ouvir claramente a voz de Deus. Jamais esquecerá Peniel.\n      Peniel tem como objetivos principais:\n          1. Levá – lo ao arrependimento – nós nos tornamos seres ... desprovidos de humildade.\n          2. Levá – lo ao propósito certo – fazemos muitas coisas que Deus não nos mandou fazer.\n          3. Levá – lo a estar face a face com Deus – tudo muda quando vimos a Deus.\n\n      Jacó esteve em Peniel e toda a sua vida foi mudada. Seu nome foi mudado de Jacó para Israel.\nSeu caráter foi mudado (ele era usurpador e seu nome de fato significava USURPADOR, MAU\nCARÁTER). Jacó sentiu profunda dor nesse lugar. Você também sentirá essa dor, porém sairá daqui\ncompletamente curado e com uma nova identidade (II Co 5:17). Comente sobre a experiência de Jacó\nem Peniel.\n\n       ATENÇÃO!\n       Você pode achar que a sua vida está bem, mas Deus irá mostrar se você está realmente bem ou\nnão.\n\n       VEJAMOS O QUE ACONTECE EM PENIEL:\n       1. SOMOS CONFRONTADOS\n       - Quando eu peco, abro uma porta de legalidade para Satanás entrar na minha vida. Satanás\nentra com seu propósito: MATAR, ROUBAR E DESTRUIR (Jo 10:10).\n       - Todo confronto, quando há arrependimento genuíno, gera cura e libertação.\n       - Em Peniel você será confrontado com os princípios divinos que você quebrou. Você poderá\navaliar a sua vida como Deus a avalia.\n\n      2. SOMOS CONDUZIDOS AO ARREPENDIMENTO (Pv 28:13)\n      - Diante da realidade dos nossos pecados, não podemos nos arrepender pela metade.\n      - Não podemos pensar que o sangue de Jesus é como um cartão de crédito que usamos sem\nresponsabilidade (I Jo 1:7; Hb 6:4-6).\n      - Precisamos ser genuínos e sinceros diante do arrependimento (I Jo 1:8-9).\n\n- Nós jamais enganaremos a Deus (Sl 139).\n      - Arrependimento sem dor não é arrependimento. Precisamos sentir dor pelo pecado que\ncometemos. Quando o pecado é lembrado com dor, há cura.\n      - Arrepender-se é reconhecer o erro e decidir não fazê-lo mais (Sl 51:2-3). Quando renunciamos\no pecado, arrancamos os argumentos do diabo (Cl 2:12-15).\n\n      3. SOMOS DESMASCARADOS DIANTE DE ALGUMAS MENTIRAS NAS QUAIS\nVIVEMOS\n           1. Você tem mentido? (Ef 4:25; Zc 8:16-17).\n           2. Contado piadas indecentes? (I Co 15:33; Pv 26:18-19).\n           3. Tem omitido pecado (de roubo, sonegação de impostos, etc)?\n           4. Tem cobiçado (marido/esposa alheio (a), roupa, casa, bens, emprego, carro, etc? (Êx\n   20:17).\n           5. Tem se prostituído, se masturbado, tido pensamentos impuros, traído seu cônjuge,\n   fornicado (imoralidade sexual)? (I Co 6:9-10).\n           6. Tem sido grosso no falar, respondão, falador, maldizente, brigão? (Cl 3:8-9).\n           7. Tem sido sensual, indecente, defraudador? (I Co 6:18).\n           8. Tem tratado o cônjuge e os filhos com violência, com espancamento? (Ef 4:31-32).\n           9. Tem sido glutão, insubmisso, rebelde, murmurado, falar mal das autoridades espirituais e\n   desobedecê-las? Não importa o que você fez, Deus lhe aceita em Peniel.\n      Muitos de nós somos doentes no físico por causa de problemas na alma (Sl 32:3). Só\nconseguiremos ser totalmente curados e libertos se confessarmos tudo. Você não pode confessar pela\nmetade, nem confessar os pecados de só um tempo da sua vida. Você precisa confessar todas as coisas\n– desde a infância até ao dia de hoje. Lembre-se que você tem uma aliança com Jesus.\n\n      O processo de arrependimento começa através de um quebrantamento diante da presença de\nDeus: sentimos dores profundas por havermos ofendido ao Pai. Não se trata de remorso, trata-se de um\nsentimento interior, de um coração impulsionado a dar a volta, a retornar o caminho correto de acordo\ncom a vontade do Pai, tal como fez o filho pródigo.\n\n       Observe:\n       Quando um marido trai uma esposa e chega em casa confessando o que fez, a reação da esposa é\na melhor possível, não é assim que acontece? Claro que não. Ela diz: \"Como? Com quem? Por quê?\nOnde? Quantas vezes isso aconteceu? \"Ela fica completamente insatisfeita. Assim é quando pecamos\ncontra Deus. Ele sente dor, fica triste.\n       Você deve sentir a dor do seu pecado e confessar tudo ao Senhor (Sl 51:1-4). O verdadeiro\narrependimento acontece quando nos conscientizamos que, ao pecarmos, perdemos algo, e fazemos\ntudo para recuperar.\n\n       4. SOMOS COMPARADOS COM ALGUNS EXEMPLOS BÍBLICOS E\nCONFRONTADOS POR CAUSA DE NOSSOS PECADOS:\n       Atenção, ministrador:\n       Pergunte quantos querem ser segundo o coração de Deus.\n       Relate claramente os fatos abaixo:\n       Davi era um homem segundo o coração de Deus; tinha liderança desde pequeno; o pai confiou o\nseu rebanho a ele; Davi cuidava com fidelidade dos negócios de seu pai.\n\n                                                                                   Igreja de Vencedores\n\n       - Davi tinha uma visa exemplar. Ele também era um adorador, descobriu o poder do louvor.\nPreservou a comunhão com o Senhor e foi colocado como rei. Este homem, com todas as suas\ncaracterísticas naturais, subiu ao trono por uma decisão do Senhor (Deus nos faz ser o que Ele deseja\nque sejamos). Para alguém ser rei tinha que enfrentar guerras e voltar vencedor.\n       - Hoje não passamos por batalhas físicas, mas por guerra espiritual (Ef 6:10-18). Todos nós\nfomos chamados para a mesma guerra e só é aprovado quem for à batalha e sair vencedor.\n       - Muitos líderes caem porque não estão em guerra constante. Não podemos ser apanhados de\nsurpresa (Mt 26:41).\n       - Temos um inimigo que não dorme, não descansa, que traça planos diários para nossa derrota,\nmas, diz a Bíblia: \"não deis lugar ao diabo\". Nunca podemos baixar as armas, pois se subestimarmos o\ninimigo perderemos a guerra. Nas vezes em que perdemos, é porque estamos fazendo coisas que Deus\nnunca nos pediu. Temos que cumprir o Seu propósito. Nada de ficar de férias de Jesus, ou de almejá-\nlas.\n       - Davi era um homem segundo o coração de Deus. Venceu guerras e, sozinho, matou um\ngigante, mas pecou, pois deixou de fazer o que Deus mandou. Ele instruiu e treinou os soldados, mas\nnão foi para a guerra. Cuidado com as \"pausas\" na vida cristã, pois todos que as fizeram sofreram\nconseqüências danosas.\n       - Davi ficou em casa dormindo até à tarde (II Sm 11:2). O diabo aproveitou as \"férias\" de\nDavi e lhe armou uma cilada de adultério com Bate – seba, mulher de Urias. Urias, pelo contrário, se\nrecusava a ficar em casa, sabendo que seus companheiros estavam no campo de guerra.\n       - Enquanto o povo estava em guerra, Davi estava em férias cobiçando e adulterando. Nesta\n\"pausa\", Davi ficou no palácio. Qual é o seu palácio, o lugar em que você descansa?\n       - O pecado é como uma bola de neve: começa pequeno e depois causa uma catástrofe. Por\ncausa do adultério começou a desgraça para a vida de Davi. Ele planejou a morte de Urias, desviou o\nfoco da visão de Deus e viveu debaixo de miséria. Instalou a maldição na casa da família real: incesto,\nhomicídio entre irmãos, imoralidade, traição do seu próprio filho, etc.\n       - Davi esqueceu que deveria estar em constante guerra. Satanás lança argumentos e nos\ndetém. Hoje Deus quer acabar com isso. Geralmente caímos por causa da \"pausa\". Em nada somos\ndiferentes dos outros, nossa carne é carne. Estamos em luta, na linha de frente, e tudo que Satanás quer\né nos derrubar. Qualquer pecado não coberto pelo sangue de Jesus é propriedade legal de Satanás.\n       - Satanás trabalha em nossas preferências tentando nos fazer parar. A psicologia chama de\nfantasias, mas a Bíblia chama de carnalidade. Os argumentos que o diabo usa devem ser quebrados\nagora, liberando nossa vida para tudo o que Deus quer fazer.\n       - As preferências vêm pelas janelas da alma – os órgãos do sentido. Esta geração tem os olhos\ncarregados de adultério. O que Deus quer de nós? Que sejamos livres (I Jo 2: 15-16).\n       - Na época de Isaías o povo estava contaminado pelo que falava. Isaías teve seus lábios\npurificados (citar Isaías 6:7). Temos que fazer diferença. Se somos santos, o povo verá nossos lábios\npurificados.\n       - Deus só enviou Isaías depois que seus lábios foram purificados. Deus só nos usará quando\nformos purificados. Deus só nos usará quando formos purificados. Ele mesmo trará cura a nós.\n       - O pecado nunca é instantâneo. Ele é progressivo. Temos que renunciá – lo, pois ele quer nos\nseduzir sempre. Davi olhou pecaminosamente, alimentou o pecado e contaminou – se. Às vezes o lugar\nonde vivemos é o objeto de nossa contaminação. Quantos de nós já estamos contaminados! Nunca\nesconda seus pecados, confesse sempre, pois o Salmo 42:7 (citar) diz que um abismo chama outro\nabismo.\n       - Qual a consequência do pecado? (Rm 6:23). A bênção é obstruída, perdida. Davi perdeu\nfamília, finanças, glória nos céus e guerras. Os argumentos do diabo voltaram. A maldição instalou –\nse na família dele (II Sm 12 e 13). Ás vezes erramos e pecamos, mas não nos arrependemos. Enquanto\n\nnão confessarmos que erramos não há arrependimento genuíno. Precisamos nos arrepender, pois Deus\nnos ama e abomina o pecado.\n      - Davi perdeu a paz. A nossa intranquilidade é sinal de pecado. O pecado é perdoado, mas as\nconsequências perduram. \"Pequei contra Deus!\". Esta foi a visão de Davi: \"Eu feri a vontade de Deus\".\n\"Confessei – te\" (em hebraico: fiz declaração pública e ordenada – \"um após outro\" – Sl
